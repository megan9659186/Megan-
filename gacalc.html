<script>
/* ============================================================
   啟動器(必須放在最前面)
   ------------------------------------------------------------
   本機檔案(file://)無法自行覆寫磁碟上的自己,所以改用這個作法:
   磁碟上那份永遠是「內建版」,線上抓到的新版存在瀏覽器的
   localStorage 當「快取版」。開啟時若快取版比內建版新,就由快取版
   接手渲染;磁碟上的檔案完全不動,隨時可以還原。
   換版若因瀏覽器限制而失敗,下次開啟會自動丟掉快取回到內建版,
   並改為提供下載新檔,不會讓人開到空白頁。
   線上版(http/https)不走這條路,直接讀伺服器上的檔案。
   ============================================================ */
var TOOL_VERSION = "v1.9";
var TOOL_UPDATED = "2026-09-10";
var IS_CACHED_BUILD = false; /*BUILD-FLAG*/
var UPDATE_SRC = "https://raw.githubusercontent.com/megan9659186/Megan-/main/gacalc.html";
var BUILD_KEY  = "gacalc_build";
var SWAP_KEY   = "gacalc_swap";
var GC_SWAP = null;          /* 待接手的快取版全文 */
var GC_SWAP_BROKEN = false;  /* 這台電腦換版失敗過,改走下載 */

function gcVerNum(v){
  var a = String(v || "").replace(/[^0-9.]/g, "").split(".");
  return (parseInt(a[0], 10) || 0) * 1000 + (parseInt(a[1], 10) || 0);
}
function gcVerOf(t){
  var m = String(t || "").match(/TOOL_VERSION\s*=\s*"([^"]+)"/);
  return m ? m[1] : null;
}
function gcValidBuild(t){
  return typeof t === "string" && t.length > 30000
      && /^\s*<!DOCTYPE html>/i.test(t) && t.indexOf("TOOL_VERSION") > 0;
}
function gcLS(fn, dflt){ try{ return fn(); }catch(e){ return dflt; } }
function gcGetBuild(){ return gcLS(function(){ return localStorage.getItem(BUILD_KEY); }, null); }
function gcDropBuild(){ gcLS(function(){ localStorage.removeItem(BUILD_KEY); }); }

(function boot(){
  if(IS_CACHED_BUILD){
    /* 順利接手了,把「換版進行中」的記號清掉 */
    gcLS(function(){ localStorage.removeItem(SWAP_KEY); });
    return;
  }
  if(location.protocol !== "file:") return;

  /* 上次換版沒走完 → 判定這台電腦不支援,丟掉快取改走下載 */
  if(gcLS(function(){ return localStorage.getItem(SWAP_KEY); }) === "pending"){
    GC_SWAP_BROKEN = true;
    gcDropBuild();
    gcLS(function(){ localStorage.removeItem(SWAP_KEY); });
    return;
  }

  var t = gcGetBuild();
  if(!gcValidBuild(t)){ if(t) gcDropBuild(); return; }
  var v = gcVerOf(t);
  if(!v || gcVerNum(v) <= gcVerNum(TOOL_VERSION)){ gcDropBuild(); return; }
  GC_SWAP = t;
  /* 先藏起來,避免內建版閃一下 */
  try{ document.documentElement.style.visibility = "hidden"; }catch(e){}
})();
</script>
</script>

      <span class="sub">Anesthesia Calculator &amp; Drug Preparation</span>
    </div>
    <div class="chips" id="chips"></div>
  </header>

<script>
const el = id => document.getElementById(id);
const NEW_DAYS = 7;
function isNewItem(s){
  if(!s || !s.updated) return false;
  const t = Date.parse(s.updated + "T00:00:00");
  if(isNaN(t)) return false;
  return (Date.now() - t) < NEW_DAYS * 86400000;
}
function toggleInfo(btn){
  const p = btn.nextElementSibling; if(!p) return;
  const show = p.hasAttribute("hidden");
  if(show){ p.removeAttribute("hidden"); } else { p.setAttribute("hidden",""); }
  btn.setAttribute("aria-expanded", show ? "true" : "false");
}

/* ============================================================
   麻醉計算機
   ------------------------------------------------------------
   IBW(Devine)、PBW(ARDSNet)、AdjBW、LBW(Janmahasatian)、
   BMI、BSA(Mosteller);另附各類藥物該用哪個體重的對照表。
   ============================================================ */
const CALC_STATE = { sex:"M", age:45, ht:170, wt:70 };
const FLUID_STATE = { wt:70, npo:8, manual:false };
const EBV_STATE = { wt:70, grp:"75m", hb0:13, hbT:8, manual:false, grpManual:false };

const EBV_GROUPS = [
  { v:"95", t:"早產兒(95 mL/kg)" },
  { v:"85", t:"足月新生兒(85 mL/kg)" },
  { v:"80", t:"嬰兒 1 歲以下(80 mL/kg)" },
  { v:"75", t:"兒童(75 mL/kg)" },
  { v:"75m", t:"成年男性(75 mL/kg)" },
  { v:"65", t:"成年女性(65 mL/kg)" }
];

/* 4-2-1 法則:前 10 kg 每公斤 4 mL/hr、次 10 kg 每公斤 2 mL/hr、超過 20 kg 每公斤 1 mL/hr */
function fluidCalc(wt, npo){
  if(!(wt>0)) return null;
  const mh = wt<=10 ? wt*4 : (wt<=20 ? 40 + (wt-10)*2 : 60 + (wt-20));
  const hrs = (npo>0 && isFinite(npo)) ? npo : 0;
  const def = mh * hrs;
  return { mh, def, h1: def/2 + mh, h23: def/4 + mh };
}

/* EBV = 體重 × 族群係數;ABL = EBV ×(目前 Hb − 可接受最低 Hb)÷ 目前 Hb */
function ebvCalc(wt, perKg, hb0, hbT){
  if(!(wt>0) || !(perKg>0)) return null;
  const ebv = wt*perKg;
  const ok = hb0>0 && hbT>0 && hb0>hbT;
  const abl = ok ? ebv*(hb0-hbT)/hb0 : null;
  return { ebv, abl, pct: abl==null ? null : abl/ebv*100, l15: ebv*0.15, l30: ebv*0.30 };
}

/* 依年齡與性別自動選 EBV 族群;新生兒與早產兒無法由「歲」判斷,維持手動選擇 */
function ebvAutoGroup(age, sex){
  if(!(age>=0) || !isFinite(age)) return null;
  if(age < 1)  return "80";
  if(age < 16) return "75";
  return sex === "F" ? "65" : "75m";
}

function calcAll(sex, ht, wt){
  if(!(ht>0) || !(wt>0)) return null;
  const m = ht/100;
  const bmi = wt/(m*m);
  const inchOver60 = Math.max(0, (ht/2.54) - 60);
  const ibw = (sex==="M" ? 50 : 45.5) + 2.3*inchOver60;
  const pbw = (sex==="M" ? 50 : 45.5) + 0.91*(ht - 152.4);
  const adj = ibw + 0.4*(wt - ibw);
  const lbw = sex==="M"
    ? (9270*wt)/(6680 + 216*bmi)
    : (9270*wt)/(8780 + 244*bmi);
  const bsa = Math.sqrt(ht*wt/3600);
  return { bmi, ibw, pbw, adj:Math.max(adj, ibw), lbw, bsa };
}

function bmiBand(b){
  if(b < 18.5) return "過輕";
  if(b < 24)   return "正常範圍";
  if(b < 27)   return "過重";
  if(b < 30)   return "輕度肥胖";
  if(b < 35)   return "中度肥胖";
  return "重度肥胖";
}

/* ------------------------------------------------------------
   TIVA propofol TCI 模型選擇
   Marsh 只吃體重;Schnider 吃年齡、身高、體重與性別(內建 James 淨體重公式)。
   James 公式在 BMI 過高時會反轉(男約 42、女約 35),此時算出的淨體重不減反增,
   幫浦速率被推高,有過量風險。
   ------------------------------------------------------------ */
const TIVA_CAP = { M:42, F:35 };
const TIVA_STATE = { model:null };   /* null = 跟著建議走;"marsh" / "schnider" = 使用者自選 */

function tivaPick(sex, age, ht, wt){
  const r = calcAll(sex, ht, wt);
  if(!r || !(age>0) || !isFinite(age)) return null;
  const bmi = r.bmi;
  const james = sex==="F"
    ? 1.07*wt - 148*Math.pow(wt/ht, 2)
    : 1.10*wt - 128*Math.pow(wt/ht, 2);
  const cap = sex==="F" ? TIVA_CAP.F : TIVA_CAP.M;
  const o = {
    bmi, james, cap,
    inverted: bmi >= cap,
    adj: Math.round(r.adj),
    tbw: Math.round(wt),
    obese: bmi >= 30,
    old: age >= 65,
    child: age < 16
  };
  o.rec = o.child ? "none" : (o.inverted ? "marsh" : ((o.obese || o.old) ? "schnider" : "both"));
  return o;
}

/* 目前要顯示哪個模型:使用者自選優先,否則跟著建議 */
function tivaModelOf(o){
  if(TIVA_STATE.model) return TIVA_STATE.model;
  return (o && o.rec === "marsh") ? "marsh" : "schnider";
}

/* 產生四格內容 [標題, 數值, 說明] 與注意事項 */
function tivaView(o, model){
  const marsh = model === "marsh";
  const name = marsh ? "Marsh" : "Schnider";
  if(!o) return {
    rows: [["模型", name, "請先輸入年齡、身高與體重"],
           ["靶控模式", "—", "—"],
           ["幫浦輸入體重", "—", "—"],
           [marsh ? "校正體重 AdjBW" : "LBM(Schnider 內建)", "—", "—"]],
    warn: ""
  };
  const na = o.rec === "none";
  let fit, warn = "";
  if(na){
    fit = "未滿 16 歲,兩個模型都不適用";
    warn = "改用小兒 TCI 模型(Paedfusor、Kataria),或改人工輸注並全程監測麻醉深度";
  } else if(o.rec === "both"){
    fit = "本例兩者皆可,依機器預設";
  } else if(o.rec === "marsh"){
    fit = marsh ? "本例建議選這個" : "本例不建議用 Schnider";
    if(!marsh) warn = "BMI 已超過 " + o.cap + ",Schnider 的淨體重公式會反轉、輸注速率反而被推高;請改 Marsh 加校正體重,機器有 Eleveld 則優先用 Eleveld";
  } else {
    fit = marsh ? "本例建議 Schnider;機器沒有時才用 Marsh" : "本例建議選這個";
  }
  const wtV = na ? "—" : ((marsh && o.obese) ? o.adj + " kg" : o.tbw + " kg");
  const wtH = na ? "—"
    : (marsh
        ? (o.obese
            ? "校正體重 AdjBW;直接輸實際體重 " + o.tbw + " kg 會過量"
            : "實際體重,磅秤上的數字")
        : "實際體重,機器自己用身高年齡換算淨體重");
  const rows = [
    ["模型", name, fit],
    ["靶控模式", marsh ? "Cp 血漿" : "Ce 效應室",
      marsh ? "原始 Marsh 走血漿靶控;機器若為 modified Marsh 才走 Ce"
            : "中央室小,走血漿靶控誘導會偏慢"],
    ["幫浦輸入體重", wtV, wtH],
    marsh
      ? ["校正體重 AdjBW", na ? "—" : o.adj + " kg",
         "IBW + 0.4 ×(實際 − IBW);BMI 到 30 以上就輸這個"]
      : ["LBM(Schnider 內建)", na ? "—" : o.james.toFixed(1) + " kg",
         o.inverted ? "已過反轉點(BMI " + o.cap + "),數值不可信"
                    : "James 公式;BMI 到 " + o.cap + " 就會反轉"]
  ];
  if(!warn && !na){
    if(marsh && o.obese)      warn = "Marsh 只吃體重,肥胖者一定要改輸校正體重 " + o.adj + " kg,不要用實際體重";
    else if(marsh && o.old)   warn = "Marsh 沒有年齡項,老年人同樣目標濃度會偏深,先降 20–40% 再慢慢加";
    else if(o.old)            warn = "老年人目標濃度先降 20–40%,誘導慢一點,注意低血壓";
    else if(o.obese)          warn = "肥胖者誘導後容易低血壓與呼吸道問題,目標濃度慢慢往上加";
  }
  return { rows, warn };
}

  if(!v) return base;
  return (v.warn ? "<b class='w'>注意</b>:" + v.warn + "。" : "") + base;
}

          <tr><td><b>IBW</b> 理想體重</td><td>依身高推算的標準體重,與胖瘦無關</td><td>男 50、女 45.5 kg,身高每超過 152.4 cm(60 英吋)一英吋加 2.3 kg</td></tr>

function wireCalc(){
  const updTiva = () => {
    const box = el("tOut"); if(!box) return;
    const o = tivaPick(CALC_STATE.sex, CALC_STATE.age, CALC_STATE.ht, CALC_STATE.wt);
    const m = tivaModelOf(o);
    const v = tivaView(o, m);
    box.querySelectorAll(".calc-cell").forEach((c,i)=>{
      const row = v.rows[i]; if(!row) return;
      const k = c.querySelector(".k"); if(k) k.textContent = row[0];
      const val = c.querySelector(".v"); if(val) val.textContent = row[1];
      const h = c.querySelector(".h"); if(h) h.textContent = row[2];
    });
    const seg = el("tSeg");
    if(seg) seg.querySelectorAll("button").forEach(b=>{
      b.setAttribute("aria-pressed", b.dataset.m === m ? "true" : "false");
    });
    const w = el("tWarn");
    if(w) w.innerHTML = tivaWarnHtml(v);
  };

  const seg = el("tSeg");
  if(seg) seg.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ TIVA_STATE.model = b.dataset.m; updTiva(); });
  });

  const upd = () => {
    const sex = el("cSex").value;
    const age = parseFloat(el("cAge").value);
    const ht = parseFloat(el("cHt").value);
    const wt = parseFloat(el("cWt").value);
    CALC_STATE.sex = sex;
    if(age>=0 && isFinite(age)) CALC_STATE.age = age;
    if(ht>0) CALC_STATE.ht = ht;
    if(wt>0) CALC_STATE.wt = wt;
    const r = calcAll(sex, ht, wt);
    const f = (x,n=1) => (x==null || !isFinite(x)) ? "—" : x.toFixed(n);
    const cells = el("cOut").querySelectorAll(".calc-cell");
    const vals = r ? [
      [f(r.bmi), bmiBand(r.bmi)],
      [f(r.ibw), null],
      [f(r.lbw), null],
      [f(r.adj), null],
      [f(r.pbw), `設潮氣容積用:${(r.pbw*6).toFixed(0)}–${(r.pbw*8).toFixed(0)} mL`],
      [f(r.bsa,2), null]
    ] : [["—",'—'],["—",null],["—",null],["—",null],["—","設潮氣容積用:—"],["—",null]];
    cells.forEach((c,i)=>{
      const v = c.querySelector(".v");
      const u = v.querySelector(".u");
      v.textContent = vals[i][0];
      if(u) v.appendChild(u);
      if(vals[i][1] != null){ const h = c.querySelector(".h"); if(h) h.textContent = vals[i][1]; }
    });
    updTiva();
    syncPatient();
  };
  ["cSex","cAge","cHt","cWt"].forEach(id=>{
    const n = el(id);
    if(n){ n.addEventListener("input", upd); n.addEventListener("change", upd); }
  });

  const setCells = (boxId, vals) => {
    const box = el(boxId); if(!box) return;
    box.querySelectorAll(".calc-cell").forEach((c,i)=>{
      if(!vals[i]) return;
      const v = c.querySelector(".v");
      const u = v.querySelector(".u");
      v.textContent = vals[i][0];
      if(u) v.appendChild(u);
      if(vals[i][1] != null){ const h = c.querySelector(".h"); if(h) h.textContent = vals[i][1]; }
    });
  };
  const n0 = x => (x==null || !isFinite(x)) ? "—" : Math.round(x).toString();

  const updFluid = () => {
    const wt = parseFloat(el("fWt").value);
    const npo = parseFloat(el("fNpo").value);
    if(wt>0) FLUID_STATE.wt = wt;
    if(npo>=0 && isFinite(npo)) FLUID_STATE.npo = npo;
    const x = fluidCalc(wt, npo);
    setCells("fOut", x
      ? [[n0(x.mh),null],[n0(x.def),null],[n0(x.h1),null],[n0(x.h23),null]]
      : [["—",null],["—",null],["—",null],["—",null]]);
  };
  ["fWt","fNpo"].forEach(id=>{
    const n = el(id);
    if(n){ n.addEventListener("input", updFluid); n.addEventListener("change", updFluid); }
  });

  const updEbv = () => {
    const wt = parseFloat(el("bWt").value);
    const grp = el("bGrp").value;
    const perKg = parseFloat(grp);
    const hb0 = parseFloat(el("bHb0").value);
    const hbT = parseFloat(el("bHbT").value);
    if(wt>0) EBV_STATE.wt = wt;
    EBV_STATE.grp = grp;
    if(hb0>0) EBV_STATE.hb0 = hb0;
    if(hbT>0) EBV_STATE.hbT = hbT;
    const x = ebvCalc(wt, perKg, hb0, hbT);
    setCells("bOut", x
      ? [[n0(x.ebv), perKg + " mL/kg × 體重"],
         [x.abl==null ? "—" : n0(x.abl), x.pct==null ? "目前 Hb 需高於可接受最低 Hb" : `約佔 EBV ${x.pct.toFixed(0)}%`],
         [n0(x.l15), null],
         [n0(x.l30), null]]
      : [["—",null],["—",null],["—",null],["—",null]]);
  };
  ["bHb0","bHbT"].forEach(id=>{
    const n = el(id);
    if(n){ n.addEventListener("input", updEbv); n.addEventListener("change", updEbv); }
  });

  /* ----------------------------------------------------------
     病人資訊同步
     ------------------------------------------------------------
     基本資料的體重會自動帶入下方 4-2-1 與預估失血量;年齡與性別
     決定失血量的族群係數。使用者若自行改動該區欄位,該區即停止
     同步(例如只想單獨試算某個體重),按「恢復同步」可以再接回。
     ---------------------------------------------------------- */
  function paintSync(){
    const f = el("fSync");
    if(f) f.innerHTML = FLUID_STATE.manual
      ? `體重已手動調整,不再跟隨基本資料 <button type="button" id="fReSync">恢復同步</button>`
      : `體重跟隨上方基本資料`;
    const b = el("bSync");
    if(b){
      const bits = [];
      bits.push(EBV_STATE.manual ? "體重已手動調整" : "體重跟隨上方基本資料");
      bits.push(EBV_STATE.grpManual ? "族群已手動選擇" : "族群依年齡與性別自動判定");
      b.innerHTML = (EBV_STATE.manual || EBV_STATE.grpManual)
        ? `${bits.join("、")} <button type="button" id="bReSync">恢復同步</button>`
        : bits.join("、");
    }
    const fr = el("fReSync");
    if(fr) fr.addEventListener("click", ()=>{ FLUID_STATE.manual = false; syncPatient(); });
    const br = el("bReSync");
    if(br) br.addEventListener("click", ()=>{
      EBV_STATE.manual = false; EBV_STATE.grpManual = false; syncPatient();
    });
  }

  function syncPatient(){
    if(!FLUID_STATE.manual && CALC_STATE.wt>0){
      const n = el("fWt");
      if(n){ n.value = CALC_STATE.wt; updFluid(); }
    }
    if(!EBV_STATE.manual && CALC_STATE.wt>0){
      const n = el("bWt");
      if(n) n.value = CALC_STATE.wt;
    }
    if(!EBV_STATE.grpManual){
      const g = ebvAutoGroup(CALC_STATE.age, CALC_STATE.sex);
      const n = el("bGrp");
      if(g && n) n.value = g;
    }
    updEbv();
    paintSync();
  }

  const markManual = (id, fn) => {
    const n = el(id);
    if(n) n.addEventListener("input", ()=>{ fn(); updEbvOrFluid(id); paintSync(); });
  };
  const updEbvOrFluid = id => { if(id === "fWt") updFluid(); else updEbv(); };
  markManual("fWt", ()=>{ FLUID_STATE.manual = true; });
  markManual("bWt", ()=>{ EBV_STATE.manual = true; });
  const bg = el("bGrp");
  if(bg) bg.addEventListener("change", ()=>{ EBV_STATE.grpManual = true; updEbv(); paintSync(); });

  syncPatient();
  initScrollRails();
}

const DRUG_CALC_STATE = { pi:"1", mg:8, mL:100, wt:70, dose:0.05, rate:5 };
const DRUG_SEARCH_STATE = { q:"" };

function drugIsHrUnit(pi){
  const p = DRUG_PRESETS[+pi];
  return !!(p && p.hr);           /* 只有以每小時計量的藥(dexmedetomidine)才顯示 µg/kg/hr */
}

function drugConcCalc(mg, mL, wt){
  if(!(mg>0) || !(mL>0) || !(wt>0)) return null;
  const cmg = mg/mL;                 /* mg/mL */
  const cug = cmg*1000;              /* µg/mL */
  return { cmg, cug, perMin: cug/60/wt, perHr: cug/wt };
}

function drugRateFromDose(mg, mL, wt, dose){
  const c = drugConcCalc(mg, mL, wt);
  if(!c || !(dose>0)) return null;
  return dose*wt*60/c.cug;           /* mL/hr */
}

function drugDoseFromRate(mg, mL, wt, rate){
  const c = drugConcCalc(mg, mL, wt);
  if(!c || !(rate>0)) return null;
  return { min: rate*c.perMin, hr: rate*c.perHr };
}

/* HTML 去標籤,只用於建立搜尋用的純文字 */
function dsPlain(x){ return String(x).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim(); }

/* 把 DRUG_PREP 攤平成一列一藥,供查詢使用 */
function drugIndex(){
  const out = [];
  DRUG_PREP.forEach(sec=>{
    (sec.subs || [{ rows: sec.rows }]).forEach(sub=>{
      sub.rows.forEach(r=>{
        const name = dsPlain(r[0]);
        out.push({
          name, grp: sec.g, sub: sub.s || "",
          spec: r[1], prep: r[2], conc: r[3], note: r[4],
          key: [name, sec.g, sub.s || "", dsPlain(r[1]), dsPlain(r[2]),
                dsPlain(r[3]), dsPlain(r[4]),
                (DRUG_ALIAS[name] || []).join(" ")].join(" ").toLowerCase()
        });
      });
    });
  });
  return out;
}

function wireDrugSearch(){
  const idx = drugIndex();
  const box = el("dsOut"), q = el("dsQ"), names = el("dsNames");
  const run = () => {
    const t = (q.value || "").trim().toLowerCase();
    DRUG_SEARCH_STATE.q = q.value || "";
    if(names) names.style.display = t ? "none" : "flex";
    if(!t){
      box.innerHTML = `<div class="ds-empty">上方可直接點選藥名,或輸入關鍵字查詢。</div>`;
      return;
    }
    const terms = t.split(/\s+/).filter(Boolean);
    const hit = idx.filter(d => terms.every(w => d.key.indexOf(w) >= 0));
    box.innerHTML = hit.length
      ? `<div class="ds-count">找到 ${hit.length} 筆</div>` + hit.map(dsCard).join("")
      : `<div class="ds-empty">查無這個藥名。可以改用英文原名、常用簡稱,或到「藥物泡法」分頁瀏覽完整表格。<br>本表只收錄本單位需要稀釋或上幫浦的藥品。</div>`;
  };
  if(q){ q.addEventListener("input", run); }
  const c = el("dsClear");
  if(c) c.addEventListener("click", ()=>{ q.value = ""; run(); q.focus(); });
  if(names) names.querySelectorAll(".ds-chip").forEach(b=>{
    b.addEventListener("click", ()=>{ q.value = b.dataset.n; run(); });
  });
  run();
}

/* ---------- 表格左右捲動指示條(常駐顯示)---------- */
let RAIL_DRAG = null;
let RAIL_GLOBAL_BOUND = false;

function railBindGlobal(){
  if(RAIL_GLOBAL_BOUND) return;
  RAIL_GLOBAL_BOUND = true;
  const move = e => {
    if(!RAIL_DRAG) return;
    const d = RAIL_DRAG;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const max = d.sc.scrollWidth - d.sc.clientWidth;
    const track = d.rail.clientWidth - d.thumb.offsetWidth;
    if(track > 0 && max > 0) d.sc.scrollLeft = d.left0 + (x - d.x0) * (max / track);
  };
  const up = () => { RAIL_DRAG = null; };
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, { passive:true });
  document.addEventListener("mouseup", up);
  document.addEventListener("touchend", up);
  document.addEventListener("touchcancel", up);
}

function initScrollRails(){
  railBindGlobal();
  document.querySelectorAll(".tool-scroll").forEach(sc => {
    let rail = sc.nextElementSibling;
    if(!rail || !rail.classList || !rail.classList.contains("scroll-rail")){
      rail = document.createElement("div");
      rail.className = "scroll-rail";
      rail.innerHTML = `<div class="scroll-thumb"></div>`;
      sc.parentNode.insertBefore(rail, sc.nextSibling);
    }
    const thumb = rail.querySelector(".scroll-thumb");
    const sync = () => {
      const max = sc.scrollWidth - sc.clientWidth;
      if(max <= 2){ rail.classList.add("off"); return; }
      rail.classList.remove("off");
      const w = Math.max((sc.clientWidth / sc.scrollWidth) * 100, 14);
      thumb.style.width = w + "%";
      thumb.style.left = ((sc.scrollLeft / max) * (100 - w)) + "%";
    };
    if(!sc.dataset.railed){
      sc.dataset.railed = "1";
      sc.addEventListener("scroll", sync, { passive:true });
      const start = e => {
        const max = sc.scrollWidth - sc.clientWidth;
        if(max <= 2) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const tb = thumb.getBoundingClientRect();
        /* 直接點軌道任一處:先把滑塊移過去再開始拖曳 */
        if(x < tb.left || x > tb.right){
          const rb = rail.getBoundingClientRect();
          const track = rail.clientWidth - thumb.offsetWidth;
          if(track > 0){
            const p = Math.min(Math.max((x - rb.left - thumb.offsetWidth/2) / track, 0), 1);
            sc.scrollLeft = p * max;
            sync();
          }
        }
        RAIL_DRAG = { sc, rail, thumb, x0:x, left0:sc.scrollLeft };
        if(e.cancelable) e.preventDefault();
      };
      rail.addEventListener("mousedown", start);
      rail.addEventListener("touchstart", start, { passive:false });
      window.addEventListener("resize", sync);
    }
    sync();
    setTimeout(sync, 80);
  });
}

function wireDrugCalc(){
  const S = DRUG_CALC_STATE;
  const fmt = x => (x==null || !isFinite(x)) ? "—"
    : (Math.abs(x)>=100 ? x.toFixed(0) : Math.abs(x)>=10 ? x.toFixed(1) : Math.abs(x)>=1 ? x.toFixed(2) : x.toFixed(3));
  const setCells = (boxId, vals) => {
    const box = el(boxId); if(!box) return;
    box.querySelectorAll(".calc-cell").forEach((c,i)=>{
      if(!vals[i]) return;
      const v = c.querySelector(".v");
      const u = v.querySelector(".u");
      v.textContent = vals[i][0];
      if(u) v.appendChild(u);
      if(vals[i][1] != null){ const h = c.querySelector(".h"); if(h) h.textContent = vals[i][1]; }
    });
  };
  const upd = () => {
    const mg = parseFloat(el("dgMg").value);
    const mL = parseFloat(el("dgVol").value);
    const wt = parseFloat(el("dgWt").value);
    const dose = parseFloat(el("dgDose").value);
    const rate = parseFloat(el("dgRate").value);
    if(mg>0) S.mg = mg;
    if(mL>0) S.mL = mL;
    if(wt>0) S.wt = wt;
    if(dose>0) S.dose = dose;
    if(rate>0) S.rate = rate;
    const isHr = drugIsHrUnit(S.pi);
    const hrCell = el("dgHrCell");
    if(hrCell) hrCell.style.display = isHr ? "" : "none";
    const c = drugConcCalc(mg, mL, wt);
    setCells("dgOut", c
      ? [[fmt(c.cmg), `= ${fmt(c.cug)} µg/mL`], [fmt(c.perMin), null], [fmt(c.perHr), null]]
      : [["—","—"], ["—",null], ["—",null]]);
    const r = drugRateFromDose(mg, mL, wt, dose);
    const d = drugDoseFromRate(mg, mL, wt, rate);
    setCells("dgOut2", [
      [fmt(r), null],
      [fmt(d && d.min), d ? (isHr ? `= ${fmt(d.hr)} µg/kg/hr` : "依上方濃度與體重換算") : "—"]
    ]);
  };
  const pre = el("dgPreset");
  if(pre){
    pre.addEventListener("change", () => {
      S.pi = pre.value;
      const p = DRUG_PRESETS[+pre.value];
      if(p && p.mg != null){
        el("dgMg").value = p.mg;
        el("dgVol").value = p.mL;
      }
      upd();
    });
  }
  ["dgMg","dgVol","dgWt","dgDose","dgRate"].forEach(id=>{
    const n = el(id);
    if(n){
      n.addEventListener("input", upd);
      n.addEventListener("change", upd);
    }
  });
  ["dgMg","dgVol"].forEach(id=>{
    const n = el(id);
    if(n) n.addEventListener("input", () => {
      const p = el("dgPreset");
      if(p){ p.value = "0"; S.pi = "0"; }
    });
  });
  initScrollRails();
}

   線上版:比對伺服器上的檔案版本,按更新即重新載入。
   本機版:比對 GitHub raw 檔案版本;按更新後把新版存進 localStorage
   再重新載入,由啟動器接手。磁碟上的檔案不動,可隨時還原。
   偵測失敗(離線、被防火牆擋住)一律靜默略過,不影響離線查詢。
   ============================================================ */
(function(){
  var isFile  = location.protocol === "file:";
  var SELF    = location.href.split("#")[0].split("?")[0];
  var SRC     = isFile ? UPDATE_SRC : SELF;
  var pending = null;
  var newVer  = null;

  function dotIcon(){
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>"
      + "<rect x='2' y='2' width='60' height='60' rx='14' fill='#B7CFD4'/>"
      + "<rect x='13' y='11' width='38' height='13' rx='3' fill='#3C3B39'/>"
      + "<g fill='#4E5766'><rect x='13' y='30' width='16' height='10' rx='2'/>"
      + "<rect x='35' y='30' width='16' height='10' rx='2'/>"
      + "<rect x='13' y='44' width='16' height='10' rx='2'/>"
      + "<rect x='35' y='44' width='16' height='10' rx='2'/></g>"
      + "<circle cx='51' cy='13' r='12' fill='#C0392B' stroke='#FDFDFC' stroke-width='4'/></svg>";
    return "data:image/svg+xml," + encodeURIComponent(svg);
  }

  function paintDot(v){
    var b = document.getElementById("upd");
    if(b){
      b.innerHTML = GC_SWAP_BROKEN
        ? "🔄 有新版本 " + v + " · 點此下載新檔覆蓋"
        : "🔄 有新版本 " + v + " · 點此立即更新";
      b.style.display = "flex";
    }
    if(document.title.indexOf("●") !== 0) document.title = "● " + document.title;
    try{
      var href = dotIcon();
      var list = document.querySelectorAll("link[rel~='icon']");
      if(list.length){ for(var i = 0; i < list.length; i++) list[i].href = href; }
      else{
        var l = document.createElement("link");
        l.rel = "icon"; l.href = href;
        document.head.appendChild(l);
      }
    }catch(e){}
  }

  function check(){
    if(navigator.onLine === false) return;
    fetch(SRC, { cache:"no-store" })
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(t){
        if(!gcValidBuild(t)) return;
        var v = gcVerOf(t);
        if(v && gcVerNum(v) > gcVerNum(TOOL_VERSION)){ pending = t; newVer = v; paintDot(v); }
      })
      .catch(function(){});
  }

  function offerDownload(){
    try{
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([pending], { type:"text/html" }));
      a.download = "gacalc.html";
      a.click();
      alert("已下載新版 " + newVer + "。請用它覆蓋這台電腦上的舊檔,重開就是新版。");
    }catch(e){
      alert("下載失敗,請直接到 GitHub 取得新版檔案。");
    }
  }

  window.applyUpdate = function(){
    if(!pending){ location.reload(); return; }
    if(!isFile){ location.reload(); return; }
    if(GC_SWAP_BROKEN){ offerDownload(); return; }
    try{
      localStorage.setItem(BUILD_KEY,
        pending.replace("var IS_CACHED_BUILD = false; /*BUILD-FLAG*/",
                        "var IS_CACHED_BUILD = true; /*BUILD-FLAG*/"));
      location.reload();
    }catch(e){ offerDownload(); }
  };

  window.revertBuild = function(){
    if(!confirm("將清除線上更新的版本,回到這個檔案原本的內容。要繼續嗎?")) return;
    gcDropBuild();
    location.reload();
  };

  check();
  setInterval(check, 300000);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") check();
  });
  window.addEventListener("focus", check);
  window.addEventListener("online", check);
})();

/* ============================================================
   快取版接手
   ------------------------------------------------------------
   等內建版渲染完成後才換,確保文件解析已結束。換版前先留下記號,
   若換版沒走完(瀏覽器不支援),下次開啟會偵測到記號並自動回到
   內建版,不會停在空白頁。
   ============================================================ */
if(GC_SWAP){
  setTimeout(function(){
    try{
      localStorage.setItem(SWAP_KEY, "pending");
      document.open();
      document.write(GC_SWAP);
      document.close();
    }catch(e){
      gcDropBuild();
      try{ localStorage.removeItem(SWAP_KEY); }catch(e2){}
      try{ document.documentElement.style.visibility = "visible"; }catch(e3){}
    }
  }, 0);
}
</script>
</body>
</html>
