anation": "蜘蛛膜下腔出血因血液刺激腦膜而出現腦膜刺激徵象：頸部僵硬、Brudzinski's sign 與 Kernig's sign 陽性。Homan's sign 是足背屈時小腿疼痛，用於評估深部靜脈栓塞，與腦膜刺激無關，故 B 為錯誤敘述。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 5, "stem": "有關頭眼反射（oculocephalic reflex）的敘述，下列何者錯誤？", "options": ["又稱為洋娃娃眼現象（Doll's eye phenomenon）", "將昏迷病人眼睛撐開，再將頭迅速向左右移動", "懷疑有頸椎損傷病人不可以進行此項檢查", "測試時眼睛會向相同的方向移動，表示腦幹功能正常"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-5", "explanation": "腦幹功能完整時，頭部快速轉向一側，眼球會向「相反」方向移動（如洋娃娃眼）；若眼球隨頭部往「相同」方向移動（即固定不動），表示腦幹功能受損，故 D 敘述錯誤。此檢查需移動頸部，疑似頸椎損傷者禁做。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 6, "stem": "有關多發性硬化症的敘述，下列何者正確？", "options": ["是一種自體免疫疾病", "好發於老年男性", "可治癒不會再發", "主要侵犯周邊神經"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-6", "explanation": "多發性硬化症為自體免疫性去髓鞘疾病，故 A 正確。好發於 20～40 歲女性；病程為反覆緩解與惡化，目前無法治癒；侵犯的是中樞神經（腦與脊髓）的髓鞘，而非周邊神經。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 7, "stem": "下列何者為評估病人腦幹功能的檢查？", "options": ["深腱反射（deep tendon reflex）", "腹部反射（abdomen reflex）", "頭眼反射（oculocephalic reflex）", "肛門反射（anal reflex）"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-7", "explanation": "頭眼反射的反射弧經由第 VIII 對腦神經、腦幹前庭核到第 III、VI 對腦神經核，屬腦幹反射，可用於評估昏迷病人的腦幹功能，故選 C。深腱反射、腹部反射與肛門反射反映的是脊髓節段功能。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 8, "stem": "有關顱內壓升高（IICP）的護理措施，下列何者正確？", "options": ["搖高床頭 30 度以促進靜脈血液回流", "運用 Valsalva's maneuver 以促進排便", "鼓勵大量喝水以改善循環", "垂頭仰臥以增加腦部循環"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-8", "explanation": "床頭抬高 30 度並保持頭頸正中位，可促進顱內靜脈回流而降低顱內壓，故 A 正確。Valsalva 操作會升高胸腔與顱內壓；顱內壓升高者需限水以免腦水腫加劇；垂頭仰臥會使腦部靜脈回流受阻，顱內壓更高。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 9, "stem": "下列何項指標可以用在術前診斷大腸癌及術後追蹤癌症是否復發？", "options": ["癌胚抗原（CEA）", "血紅素數值（Hb）", "α-胎兒蛋白（AFP）", "大便潛血反應（FOB）"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-9", "explanation": "CEA 為大腸直腸癌最常用的腫瘤標記，可協助術前評估與術後追蹤復發，故選 A。AFP 主要用於肝細胞癌與生殖細胞瘤；FOB 為篩檢工具無法確診；Hb 僅反映貧血程度。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 10, "stem": "有關腸造瘻口護理指導的敘述，下列何者錯誤？", "options": ["觀看腸造瘻口外觀應為粉紅色", "觀察乙狀結腸造瘻口為成形便", "病人應避免進食易產氣食物", "術後三週內建議採高渣飲食"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-10", "explanation": "術後初期腸道尚在適應階段，應採低渣飲食以減少糞便量與造瘻口刺激，待適應後再逐漸增加纖維，故 D 錯誤。正常造瘻口呈粉紅或紅色且濕潤；乙狀結腸造瘻口位置最遠端，排出物已成形；產氣食物會使造口袋鼓脹應避免。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 11, "stem": "有關肝硬化之飲食建議，下列何者正確？", "options": ["低鈉飲食", "低熱量飲食", "高脂肪飲食", "高蛋白飲食"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-11", "explanation": "肝硬化病人因低白蛋白血症與醛固酮代謝異常而有腹水及水腫，需限制鈉攝取，故 A 正確。應給予足夠熱量以避免蛋白質分解；脂肪需適量以免加重消化負擔；併有肝性腦病變時蛋白質反而要限制，不能一律高蛋白。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 12, "stem": "有關內視鏡逆行膽胰攝影的敘述，下列何者正確？", "options": ["檢查前無須禁食", "檢查前須先檢測凝血功能", "檢查後口服硫酸鎂 30 c.c.，可促使歐迪氏括約肌鬆弛", "用於評估肝胰壺腹、膽道及胰臟是否病變"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-12", "explanation": "ERCP 經十二指腸乳突注入顯影劑，用以評估肝胰壺腹、膽道與胰管的病變，故 D 正確。檢查前需禁食 8 小時以上；檢查後應禁食至咽反射恢復並觀察有無胰臟炎，而非給予硫酸鎂（硫酸鎂是口服膽囊攝影的用法）。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 13, "stem": "有關上腸胃道攝影的敘述，下列何者正確？①檢查前無需禁食 ②檢查前需清潔灌腸 ③檢查後多喝開水以促使鋇劑排出 ④檢查後 2～3 天可能解白色糞便，為正常反應", "options": ["①②", "①③", "②④", "③④"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-13", "explanation": "上消化道攝影檢查前需禁食 8～12 小時（①錯），清潔灌腸是下消化道（鋇劑灌腸）的準備而非上消化道（②錯）。檢查後應多喝水並視需要給予緩瀉劑，促進鋇劑排出以免結成硬塊（③對）；2～3 天內解白色糞便屬正常現象（④對），故選 ③④。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 14, "stem": "有關胃潰瘍的敘述，下列何者正確？①右上腹疼痛 ②常見噁心嘔吐 ③進食後 2～3 小時、半夜、空腹時發生疼痛 ④胃酸分泌正常", "options": ["①③", "①④", "②③", "②④"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-14", "explanation": "胃潰瘍疼痛位於上腹部偏左（①錯），常伴噁心、嘔吐與體重減輕（②對）；疼痛多在進食後 30～60 分鐘出現（③所述空腹、半夜痛為十二指腸潰瘍特徵，③錯）；胃潰瘍的胃酸分泌正常甚至偏低，致病關鍵在黏膜屏障受損（④對），故選 ②④。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 15, "stem": "接受全靜脈營養輸注的病人，突然停止輸注後容易產生的併發症狀，下列何者正確？", "options": ["液體負荷過重", "高血糖症", "低血糖症", "高血鈉症"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-15", "explanation": "全靜脈營養含高濃度葡萄糖，體內胰島素分泌已代償性上升；若突然停止輸注，殘留的高胰島素會使血糖驟降而發生反彈性低血糖，故選 C。因此停用時須逐漸減慢速率，或先換上 10% 葡萄糖溶液。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 16, "stem": "李先生因胃癌接受全胃切除術，術後開始進食稀飯，約 30 分鐘後出現腹脹、噁心嘔吐、心悸、頭暈等現象，下列何者為其最可能造成的原因？", "options": ["胰島素分泌太少", "攝入水分過多", "缺少胃酸", "食物快速進入腸道"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-16", "explanation": "此為傾食症候群（dumping syndrome）。胃切除後失去幽門控制，高滲透壓食物快速傾入空腸，將體液拉入腸腔而造成腹脹、噁心及血容積下降引起的心悸、頭暈，故選 D。護理上應採少量多餐、乾濕食物分開、高蛋白低碳水化合物飲食，餐後平躺。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 17, "stem": "有關痔瘡術後的護理措施，下列何者錯誤？", "options": ["手術後 12 小時可使用溫水坐浴，以減輕疼痛與腫脹", "開刀後採側躺或俯臥姿勢，避免壓迫肛門傷口", "8 小時若有二塊以上會陰部敷料浸溼，表示傷口出血", "手術後初期鼓勵病人攝取高纖維食物"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-17", "explanation": "術後初期（約 24 小時內）應採低渣飲食，避免過早排便刺激傷口；待傷口穩定後才逐步增加纖維與水分預防便秘，故 D 為錯誤敘述。溫水坐浴、側臥或俯臥減壓、以敷料浸濕量判斷出血皆為正確措施。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 18, "stem": "有關腔隙症候群的處置，下列何者正確？", "options": ["肢體抬高超過心臟", "患肢冷熱敷", "彈繃加壓包紮", "去除敷料、夾板或石膏"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-18", "explanation": "腔隙症候群的關鍵是解除筋膜腔內壓力，故應立即移除敷料、夾板或石膏，必要時行筋膜切開術，選 D。患肢抬高過心臟或加壓包紮會減少動脈灌流而加重缺血；冰敷造成血管收縮亦不宜，患肢應維持與心臟同高。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 19, "stem": "王先生，診斷痛風性關節炎，正服用秋水仙素（Colchicine）。有關此藥物的護理指導，下列何者正確？", "options": ["服用此藥物會低血壓，早上起床時要格外小心", "服用此藥物要定期檢查眼睛", "服用此藥物若出現嚴重腹瀉時應停藥", "因為此藥物可能會導致血液凝結，每天要多喝水"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-19", "explanation": "Colchicine 最常見的副作用是腸胃道症狀，出現噁心、嘔吐及嚴重腹瀉即為毒性徵象，應停藥並回診，故 C 正確。此藥不以低血壓或眼睛毒性為主要副作用，也不會造成血液凝結；多喝水是為促進尿酸排除。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 20, "stem": "有關痛風性關節炎病人的護理指導，下列何者正確？", "options": ["睡覺時應維持肢體屈曲的姿勢，以降低關節疼痛", "服用水楊酸藥物，須按時服用，要注意有無出血徵象", "關節對溫度特別敏感，因此須避免關節處冰敷或熱敷", "應該減少肉類、海鮮及啤酒的攝取，以預防疾病發作"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-20", "explanation": "內臟、紅肉、帶殼海鮮及啤酒屬高普林食物，會升高血中尿酸而誘發急性發作，應減少攝取，故 D 正確。長期屈曲會造成關節攣縮；水楊酸類（Aspirin）低劑量會抑制尿酸排泄，痛風病人應避免；急性期可局部冰敷減輕疼痛與腫脹。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 21, "stem": "有關全髖關節置換術後病人之護理指導，下列何者錯誤？", "options": ["教導翻身時，雙腿中間仍需夾著內展枕", "鼓勵患肢作等長收縮運動", "強調髖關節屈曲不可超過 90 度", "未併用骨泥者，六星期後方可承受重量"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-21", "explanation": "全髖關節置換術後為預防人工關節脫位，雙腿之間應夾「外展枕（abduction pillow）」維持髖關節外展，若使用內展枕會使髖關節內收而導致脫臼，故 A 錯誤。避免髖屈曲超過 90 度、鼓勵等長收縮運動、無骨泥者延後負重皆為正確指導。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 22, "stem": "有關白內障症狀的敘述，下列何者錯誤？", "options": ["畏光", "視力減退", "眼痛", "瞳孔變為白色"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-22", "explanation": "白內障是水晶體混濁，屬無痛性、漸進性視力模糊，並可出現畏光、複視與瞳孔區呈白色混濁，但通常「不會」有眼痛，故 C 錯誤。急性眼痛合併視力驟降應優先想到急性青光眼。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 23, "stem": "有關接受鼻竇手術病人的護理指導，下列何者錯誤？", "options": ["二週內勿用太熱的水洗臉", "術後採側臥，有助分泌物引流", "應注意口腔衛生", "不要抽菸"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-23", "explanation": "鼻竇手術後應採半坐臥（Fowler's position），以減少頭部充血、降低出血機會並促進引流，故 B 錯誤。過熱的水會使血管擴張而增加出血；因口內常有血水滲出需加強口腔衛生；抽菸會刺激黏膜並延緩癒合。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 24, "stem": "有關視網膜剝離病人的術後護理措施，下列何者錯誤？", "options": ["應蓋上敷料及眼罩並觀察敷料是否有滲出液", "術後一週內應避免眼球快速運動", "手術時玻璃體腔注入氣體時，術後應採仰臥", "若有噁心及嘔吐情形，應禁食到無胃部不適為止"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-24", "explanation": "玻璃體腔注入氣體者，需利用氣泡上浮的力量將視網膜頂回原位，術後應採「俯臥或臉朝下」的姿勢，仰臥反而使氣泡無法壓迫裂孔，故 C 錯誤。其餘避免眼球快速運動、覆蓋眼罩觀察滲液、嘔吐時暫禁食以免用力增加眼壓，皆屬正確。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 25, "stem": "有關感覺神經性聽力喪失的敘述，下列何者正確？", "options": ["在噪音中聽力佳", "韋伯氏測驗（Weber's test）結果患側聽到比較大的聲音", "任內氏測驗（Rinne's test）結果空氣傳導時間比骨傳導時間長", "外耳道或鼓膜異常"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-25", "explanation": "感覺神經性聽力喪失病灶在耳蝸或聽神經，空氣傳導與骨傳導同時減弱但仍維持 AC＞BC 的正常型態，故 C 正確。Weber's test 聲音偏向「健側」；病灶不在外耳道或鼓膜（那是傳導性聽力喪失）；在吵雜環境中聽辨能力反而更差。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 26, "stem": "使用 Warfarin（Coumadin®）預防深部靜脈栓塞（deep vein thrombosis, DVT）之護理指導，下列何者正確？①需定期監測凝血酶原時間（PT） ②鼓勵多攝取銀杏、當歸 ③若出現血尿是正常的現象不需理會 ④宜使用電動刮鬍刀", "options": ["①③", "①④", "②③", "②④"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-26", "explanation": "Warfarin 需定期監測 PT／INR 調整劑量（①對），並使用電動刮鬍刀、軟毛牙刷以避免出血（④對）。銀杏、當歸具抗血小板或抗凝作用，會增強出血風險應避免（②錯）；血尿是出血徵象必須立即回報（③錯），故選 ①④。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 27, "stem": "有關高血壓病人服用 Propranolol（Inderal）的護理指導，下列何者正確？①需確認病人有無氣喘 ②服藥前宜先檢查心跳次數 ③副作用有低血鈉 ④副作用會造成脫水", "options": ["①②", "①③", "②③", "②④"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-27", "explanation": "Propranolol 是非選擇性乙型阻斷劑，會阻斷支氣管 β2 受體而誘發支氣管痙攣，氣喘病人禁用（①對）；也會減慢心跳，服藥前應測脈搏，過慢（一般＜60 次／分）需暫停並回報（②對）。低血鈉與脫水並非其典型副作用，故選 ①②。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 28, "stem": "有關心肌梗塞病人的護理，下列敘述何者錯誤？", "options": ["協助採取半坐臥姿，減少心肌耗氧量", "教導等長運動，增加活動耐力", "提供氧氣，增加心肌供氧量", "教導必要時可於性交前服用 NTG，預防胸痛不適"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-28", "explanation": "等長運動（如提重物、用力握持）會使血壓與後負荷驟升、增加心肌耗氧量，心肌梗塞病人應採漸進式的等張運動如步行，故 B 錯誤。半坐臥可減少靜脈回流與心臟負荷；給氧改善心肌缺氧；性行為前預防性使用 NTG 為正確衛教（但須注意不可與威而鋼類藥物併用）。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 29, "stem": "有關心臟血管系統檢查評估的敘述，下列何者錯誤？", "options": ["頸靜脈搏動最高點與胸骨角的垂直距離為 5 公分，顯示可能右心房壓力偏高", "聽診第三心音時，病人應採左側臥，以聽診器膜面聽診心尖處", "心尖最大搏動點之正常位置，應在左鎖骨中線與第五肋間交叉處", "評估脈搏應記錄速率、節律、強度，並比較左、右側的對稱性"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-29", "explanation": "第三心音（S3）屬低頻音，須以聽診器的「鐘面（bell）」輕放於心尖處聽診，採左側臥可使心尖更貼近胸壁，故 B 中「膜面」為錯誤。頸靜脈怒張高於胸骨角 3 公分以上即提示右心房壓力上升；心尖搏動正常位於左鎖骨中線第五肋間。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 30, "stem": "有關心電圖的敘述，下列何者錯誤？", "options": ["胸導程 V5，應置放在左腋前線第五肋間", "T 波表示心室去極化", "運動心電圖可評估心肌缺氧的情形", "相鄰的 2 個 R 波為 5 大格，則心跳速率為 60 次／分"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-30", "explanation": "T 波代表心室「再極化（repolarization）」，心室去極化是 QRS 複合波，故 B 錯誤。V5 置於左腋前線第五肋間；運動心電圖可誘發並偵測心肌缺氧；每大格 0.2 秒，5 大格即 1 秒，300÷5＝60 次／分。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 31, "stem": "有關心律不整的敘述，下列何者錯誤？", "options": ["心房纖維顫動（Af）容易產生血栓，可以使用 Heparin 來預防", "陣發性心室心搏過速（PSVT）可以使用按摩頸動脈竇的方式來使心律恢復正常", "竇性心搏過慢（sinus bradycardia）常見於運動員，不需要治療", "1°房室傳導阻斷（1°AV block），通常不會出現症狀，不需要治療"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-31", "explanation": "心房纖維顫動的長期血栓預防以口服抗凝劑 Warfarin 或新型口服抗凝劑為主，Heparin 屬針劑僅用於急性期或轉換期的過渡，並非用於長期預防，故 A 敘述錯誤。頸動脈竇按摩可提高迷走神經張力終止陣發性上心室心搏過速；運動員的竇性心搏過慢與無症狀的第一度房室傳導阻斷皆不需治療。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 32, "stem": "有關僧帽瓣狹窄的臨床表徵，下列何者正確？", "options": ["左心房壓力上升，可能導致左心房擴大", "血液鬱積於左心房造成周邊血壓上升", "容易產生周邊靜脈栓塞", "嚴重僧帽瓣狹窄會導致心收縮期雜音"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-32", "explanation": "僧帽瓣狹窄使左心房血液排空受阻，左心房壓力升高而擴大，進而併發心房纖維顫動與肺鬱血，故 A 正確。血液鬱積在左心房與肺循環，周邊血壓不會上升；左心房內形成的血栓是打入「動脈」造成全身性栓塞（如腦中風）而非周邊靜脈栓塞；其雜音為心舒張期隆隆聲。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 33, "stem": "評估時請病人快速彎曲足背，如果出現小腿疼痛，表示為下列何種徵象？", "options": ["霍夫曼徵象（Hoffmann's sign）", "霍克尼氏徵象（Hochne's sign）", "霍伯氏徵象（Hope's sign）", "霍曼氏徵象（Homan's sign）"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-33", "explanation": "足部快速背屈引起小腿肚疼痛稱為 Homan's sign 陽性，過去用於提示深部靜脈栓塞，故選 D。Hoffmann's sign 是彈壓中指甲床引起拇指屈曲，屬上運動神經元病變的徵象。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 34, "stem": "有關心包膜積水的主要症狀，下列何者錯誤？", "options": ["胸痛、尖銳痛或瀰漫性鈍痛", "脈搏壓升高", "心音模糊及低沉", "頸靜脈怒張"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-34", "explanation": "心包膜積水限制心室舒張充盈，心搏出量下降使收縮壓降低，而舒張壓相對維持，故脈搏壓（脈壓差）「變窄」而非升高，B 錯誤。心包填塞的典型三徵（Beck's triad）即為低血壓、心音遙遠低沉與頸靜脈怒張。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 35, "stem": "有關癌症危險因子的敘述，下列何者錯誤？", "options": ["吃檳榔會增加口腔癌的發生率", "荷爾蒙治療會增加子宮內膜癌的發生率", "長期接觸甲醛會增加大腸癌的發生率", "長期吸入石綿會增加肺癌的發生率"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-35", "explanation": "甲醛主要與鼻咽癌及白血病相關，並非大腸癌的危險因子，故 C 錯誤。大腸癌的危險因子為高脂低纖飲食、加工紅肉、家族史與發炎性腸道疾病。檳榔與口腔癌、未併用黃體素的雌激素療法與子宮內膜癌、石綿與肺癌及間皮瘤的關聯皆已確立。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 36, "stem": "有關 BUN 與 Serum Creatinite 比值的敘述，下列何者正確？", "options": ["正常比值量 40：1", "發燒會導致比值下降", "嚴重腹瀉會導致比值下降", "肝衰竭會導致比值下降"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-36", "explanation": "尿素是肝臟合成的，肝衰竭時尿素合成能力下降使 BUN 降低，比值因而下降，故 D 正確。正常比值約為 10～20：1；發燒屬分解代謝增加會使 BUN 上升、比值升高；嚴重腹瀉造成脫水屬腎前性因素，比值同樣升高。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 37, "stem": "病人接受化學治療後血小板數值為 10,000 cells/mm³，下列何者為護理評估重點？", "options": ["意識狀態", "體溫變化", "腸蠕動音", "皮膚飽和度"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-37", "explanation": "血小板低於 20,000／mm³ 有自發性出血的高度風險，其中最致命的是顱內出血，因此需密切監測意識狀態、瞳孔反應與頭痛等神經學變化，故選 A。體溫變化主要用於評估嗜中性球低下的感染風險。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 38, "stem": "有關何杰金氏淋巴瘤的敘述，下列何者錯誤？", "options": ["淋巴組織切片中可發現瑞德-史登伯氏細胞（Reed-Sternberg cell）", "會侵犯淋巴結、肝臟及脾臟", "好發於女性老年人", "疾病預後與分期有關"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-38", "explanation": "何杰金氏淋巴瘤好發於「男性」，且發病年齡呈雙峰分布（15～35 歲及 50 歲以後），並非好發於老年女性，故 C 錯誤。切片可見 Reed-Sternberg 細胞為其診斷特徵，病灶可由淋巴結擴及肝、脾，預後與分期密切相關。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 39, "stem": "有關化學治療特性的敘述，下列何者正確？", "options": ["使用具細胞毒性藥物來縮小腫瘤或控制症狀", "化學治療藥物大多可以通過血腦屏障", "使用多種不同抗癌藥物來增加療效，但副作用也會增加", "目前治療方式多採高劑量、較無毒性，減少次數、增加休息時間方式進行"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-39", "explanation": "化學治療是使用細胞毒性藥物抑制快速分裂的細胞，以縮小腫瘤、控制轉移或緩解症狀，故 A 正確。多數化療藥物「無法」通過血腦屏障，中樞侵犯需鞘內注射；合併化療的目的是選擇作用機轉不同、毒性不重疊的藥物以增效並「分散」副作用；化療藥物並非無毒性。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 40, "stem": "有關瀕死病人護理的敘述，下列何者正確？①出現瀕死前的嘎嘎聲是因為喉嚨有痰，要給予抽痰 ②肛門附近周圍皮膚傷口可使用氧化鋅 ③要鼓勵病人進食，以增加舒適感 ④瀕死病人對刺激無反應時，其聽力也會喪失 ⑤意識不清病人宜採側臥，以利分泌物流出", "options": ["①②", "①④", "②⑤", "③⑤"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-40", "explanation": "氧化鋅可在肛門周圍形成保護膜，隔絕排泄物刺激（②對）；意識不清者採側臥可讓分泌物自然流出，減少吸入（⑤對）。瀕死嘎嘎聲源自咽喉肌肉鬆弛、分泌物聚積，抽痰反而造成痛苦，應改以擺位及藥物處理（①錯）；瀕死期強迫進食會增加不適與吸入風險（③錯）；聽覺是最後消失的感覺，仍應持續與病人說話（④錯），故選 ②⑤。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 41, "stem": "有關頭頸部放射線治療的敘述，下列何者錯誤？", "options": ["照射部位發紅可以熱敷促進舒適", "最大張口及咀嚼運動可預防牙關緊閉", "唾液腺破壞會有口乾問題", "進食前使用止痛劑可減輕疼痛"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-41", "explanation": "放射線照射部位的皮膚脆弱敏感，禁止熱敷、冰敷、貼膠布或塗抹含金屬成分的藥膏，以免加重皮膚損傷，故 A 錯誤。張口及咀嚼運動可預防顳顎關節纖維化造成的牙關緊閉；唾液腺受破壞導致口乾；口腔黏膜炎疼痛時可於進食前給予止痛劑。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 42, "stem": "有關癌症病人感染問題的敘述，下列何者錯誤？", "options": ["感染是造成病人死亡的主要原因", "感染與癌症治療骨髓功能受抑制有關", "白血球比嗜中性球更能反映病人是否易受感染", "G-CSF 皮下注射可增加白血球數目"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-42", "explanation": "真正反映感染風險的是絕對嗜中性球數（ANC），因嗜中性球才是對抗細菌的第一線；白血球總數可能因其他細胞而被高估，故 C 錯誤。感染確為癌症病人主要死因，與化放療造成骨髓抑制有關，G-CSF 可刺激骨髓生成嗜中性球。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 43, "stem": "有關席林試驗可協助診斷的貧血類別，下列何者正確？", "options": ["缺鐵性貧血", "惡性貧血", "溶血性貧血", "再生不良性貧血"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-43", "explanation": "席林試驗（Schilling test）藉由口服放射性維生素 B12 測量其尿中排出量，用以評估內在因子缺乏所致的維生素 B12 吸收障礙，即惡性貧血，故選 B。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 44, "stem": "下列何者不是皮膚過敏試驗？", "options": ["貼布試驗（patch test）", "皮內試驗（intradermal test）", "盤尼西林試驗（penicillin test）", "伍氏螢光檢查（wood's light test）"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-44", "explanation": "伍氏燈是以紫外線照射皮膚，依螢光顏色協助診斷黴菌感染、白斑等皮膚病灶，與過敏無關，故選 D。貼布試驗用於檢測接觸性過敏原，皮內試驗與盤尼西林試驗則屬立即型過敏反應的測試。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 45, "stem": "有關傷口敷料的敘述，下列何者正確？", "options": ["親水性敷料可以吸收傷口分泌物，不易使細菌滋生", "含銀敷料不適用於感染性傷口", "藻膠敷料不適用於滲液過多的傷口", "傳統敷料不易使組織浸潤引發細胞感染和壞死"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-45", "explanation": "親水性膠體敷料能吸收滲液並形成密閉的濕潤癒合環境，可減少細菌孳生，故 A 正確。含銀敷料具抗菌作用，正是用於感染或高感染風險傷口；藻膠（alginate）吸收力極強，適用於「大量」滲液的傷口；傳統紗布因吸收與阻隔性不足，反而較易造成周邊組織浸潤。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 46, "stem": "有關蜂窩性組織炎病人的護理措施，下列何者錯誤？", "options": ["抬高患肢，以促進靜脈回流減輕腫脹", "觀察及記錄患部皮膚紅腫範圍、溫度變化及疼痛情形", "患部無傷口時，可以用熱敷來減輕炎症反應，緩解疼痛", "鼓勵病人臥床休息，且病灶處須制動，以防止感染擴散"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-46", "explanation": "急性發炎期熱敷會使局部血管擴張，可能促使感染沿組織擴散，故 C 為錯誤選項。此症治療以抗生素為主，並配合抬高患肢減輕腫脹、劃記紅腫範圍以監測病程進展、臥床與患處制動以避免感染擴散。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 47, "stem": "有關燒傷病人敷料應用的敘述，下列何者錯誤？", "options": ["1% Silver Sulfadiazine 不會造成酸鹼與電解質不平衡", "0.5% Silver Nitrate 會造成高血鈉，應密切監測電解質", "Gentamycin Sulfate 適用於臉部傷口，應密切監測腎功能變化", "使用 1% Silver Sulfadiazine 應觀察有無白血球數目減少"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-47", "explanation": "0.5% Silver Nitrate 為低張溶液，會將鈉、鉀、氯離子由傷口拉出，造成「低」血鈉、低血鉀與低血氯，故 B 敘述錯誤。1% Silver Sulfadiazine 不影響酸鹼電解質，但可能引起暫時性白血球低下；Gentamycin 具腎毒性與耳毒性，使用期間需監測腎功能。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 48, "stem": "有關後天免疫缺乏症候群（acquired immunodeficiency syndrome, AIDS）病人出院護理指導的敘述，下列何者錯誤？", "options": ["與家人共同生活，即便未有危險性行為，仍易傳染愛滋病毒", "出現疾病變化時應儘速就醫，如發燒、呼吸喘、咳嗽、腹瀉等", "食用蛋類、海鮮、肉品等應煮熟，水也應煮沸後才可飲用", "避免收留流浪動物，且環境應定期以殺菌劑清洗，以免細菌孳生"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-48", "explanation": "愛滋病毒經血液、性行為與母嬰垂直傳染，日常共同生活如共餐、擁抱、共用衛浴並不會傳染，故 A 錯誤。因病人免疫力低下，需注意食物與飲水的衛生、避免接觸動物的排泄物，並在出現感染徵象時儘速就醫。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 49, "stem": "下列何者為初級免疫反應最先合成的免疫球蛋白？", "options": ["IgA", "IgD", "IgG", "IgM"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-49", "explanation": "初次接觸抗原時，B 細胞最先產生的是分子量最大的 IgM，隨後才經類別轉換產生 IgG；再次接觸同一抗原時則以 IgG 為主且反應更快更強，故選 D。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 50, "stem": "有關愛滋病的傳染途徑，下列何者錯誤？", "options": ["垂直傳染", "血液傳染", "性行為傳染", "飲食傳染"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-50", "explanation": "HIV 主要經性行為、血液（共用針具、輸血）及母嬰垂直傳染，病毒在體外環境存活力極差，不會經由飲食、飛沫或日常接觸傳染，故 D 錯誤。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 51, "stem": "下列何者不屬於第Ⅰ型過敏反應？", "options": ["接觸性皮膚炎", "氣喘", "枯草熱", "異位性皮膚炎"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-51", "explanation": "接觸性皮膚炎屬第 IV 型遲發性過敏反應，由 T 細胞媒介，接觸後 24～48 小時才出現症狀，故選 A。氣喘、枯草熱（過敏性鼻炎）與異位性皮膚炎均由 IgE 媒介，屬第 I 型立即型過敏反應。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 52, "stem": "當動脈氣體分析值為 pH：7.40、PaCO₂：42 mmHg、HCO₃⁻：24 mEq/L、PaO₂：80 mmHg 時，有關病人呼吸器脫離（ventilator weaning）的敘述，下列何者正確？", "options": ["動脈氣體分析值正常，應可考慮開始脫離呼吸器", "動脈氣體分析值為呼吸性酸中毒，必須先行矯正，尚不宜脫離呼吸器", "動脈氣體分析值為呼吸性酸中毒，可刺激病人呼吸，所以應適合脫離呼吸器", "PaCO₂及 PaO₂為正常但可能阻礙呼吸，故不宜脫離呼吸器"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-52", "explanation": "pH 7.40（正常 7.35～7.45）、PaCO₂ 42（正常 35～45）、HCO₃⁻ 24（正常 22～26）、PaO₂ 80（正常 80～100）皆在正常範圍，無酸鹼與氧合異常，是可考慮開始脫離呼吸器的條件之一，故選 A。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 53, "stem": "接受胸腔放液後的病人，下列何者最需緊急處理？", "options": ["主訴疼痛為 5 分（以 0～10 分的疼痛量表作評估）", "周邊血氧濃度為 88%", "血壓 156/88 mmHg", "平躺時呼吸次數為 24 次／分"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-53", "explanation": "血氧飽和度 88% 代表已有明顯低血氧，可能是放液後併發氣胸或復張性肺水腫，屬 ABC 中的呼吸問題，須優先立即處理，故選 B。疼痛 5 分、血壓略高與呼吸 24 次／分雖需追蹤，但危急程度均不及低血氧。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 54, "stem": "下列何者不是造成肺泡通氣不足而導致呼吸衰竭的原因？", "options": ["睡眠呼吸中止症", "頸椎損傷", "肺栓塞", "安眠藥服用過量"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-54", "explanation": "肺栓塞是肺血管遭阻塞造成「通氣／灌流比不均（V/Q mismatch）」，肺泡通氣本身並未減少，故選 C。睡眠呼吸中止症、頸椎損傷影響呼吸肌、安眠藥過量抑制呼吸中樞，三者皆屬肺泡通氣不足。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 55, "stem": "下列何者為肺炎病人最可能出現的臨床表徵？", "options": ["呼吸過慢（bradypnea）", "頸靜脈怒張（jugular vein distension）", "泡沫狀痰（frothy sputum）", "意識混亂（confusion）"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-55", "explanation": "肺炎造成氧合下降與感染毒素影響，尤其在老年人常以意識混亂為早期甚至唯一表現，故選 D。肺炎多為呼吸「過快」；頸靜脈怒張屬右心衰竭；粉紅泡沫痰是肺水腫的特徵，肺炎痰液多為黃綠色濃稠痰。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 56, "stem": "有關肋膜積水進行放液時，若一次超過 1,200 c.c.，可能會發生下列何種現象？", "options": ["血壓急速上升", "高碳酸血症", "肺水腫", "肺纖維化"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-56", "explanation": "一次抽出過多積液會使長期受壓的肺泡突然快速擴張，肺內負壓驟增導致微血管通透性改變，引發復張性肺水腫，故選 C。臨床上一次放液量通常限制在 1,000～1,200 c.c. 以內，並需監測有無胸悶、咳嗽與血氧下降。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 57, "stem": "有關人體酸鹼平衡的敘述，下列何者正確？", "options": ["血液 pH 低於 7.35 時，人體會呼吸減慢且淺，保留 CO₂", "血液 pH 低於 7.35 時，人體會增加呼吸速率以調節 HCO₃⁻", "血液 pH 高於 7.45 時，腎臟會排出 H⁺以保留 HCO₃⁻", "血液 pH 高於 7.45 時，人體會增加呼吸的速率及深度"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-57", "explanation": "酸中毒（pH＜7.35）時，人體以加深加快呼吸排出 CO₂ 來代償，使 pH 回升，故 B 的代償方向正確（僅措辭上實為排出 CO₂ 以維持 HCO₃⁻／H₂CO₃ 比值）。A 的呼吸減慢會使酸中毒惡化；鹼中毒時腎臟應排出 HCO₃⁻ 並保留 H⁺，且呼吸會變慢變淺，故 C、D 皆錯。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 58, "stem": "護理一位出現肺水腫症狀與徵候的病人，下列措施之順序，何者最適當？①經由鼻導管給與 2 L/min 氧氣治療 ②呼叫醫師 ③協助病人採高坐臥 ④準備床邊抽痰用物", "options": ["①②③④", "①④③②", "②①③④", "③①④②"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-58", "explanation": "依 ABC 原則，最先且護理人員可立即獨立執行的是協助高坐臥（③），使橫膈下降、減少靜脈回流以減輕肺鬱血；接著給氧改善缺氧（①），再準備抽痰用物（④），最後通知醫師後續處置（②），故選 D。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 59, "stem": "有關以定量吸入器（MDI）方式給藥的敘述，下列何者錯誤？", "options": ["全身副作用較小", "使用後需要漱口", "使用時需快速深吸氣", "吸完藥物後要閉氣約 5～10 秒"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-59", "explanation": "MDI 應在按壓噴藥的同時「緩慢而深」地吸氣，藥物才能沉積到小支氣管；快速吸氣會使藥粒撞擊在口咽部而降低療效，故 C 錯誤。吸入後閉氣 5～10 秒有助藥物沉積；使用類固醇後漱口可預防口腔念珠菌感染；吸入給藥的全身性副作用低於口服。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 60, "stem": "急性腎衰竭病人血清鉀為 7.2 mEq/L，下列處置何者正確？①靜脈注射中長效胰島素及 5%葡萄糖溶液 ②口服或灌腸給予 Kayexalate ③靜脈注射重碳酸鈉 ④鼓勵多食用香蕉、柳丁", "options": ["①③", "①④", "②③", "②④"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-60", "explanation": "Kayexalate 為陽離子交換樹脂，可在腸道以鈉交換鉀並隨糞便排出（②對）；重碳酸鈉可提高血液 pH 促使鉀離子移入細胞內（③對）。以胰島素驅鉀應使用「短效（regular）」胰島素才能迅速作用（①錯）；香蕉、柳丁為高鉀食物必須避免（④錯），故選 ②③。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 61, "stem": "有關急性腎絲球腎炎的敘述，下列何者錯誤？", "options": ["是抗原抗體反應造成的免疫性疾病", "會出現蛋白尿、血尿", "補體（C₃與 C₄）值會上升", "腎絲球過濾率（GFR）會下降"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-61", "explanation": "急性腎絲球腎炎為抗原抗體複合物沉積所致，補體在反應過程中被大量消耗，因此血中 C₃、C₄ 值「下降」，故 C 錯誤。典型表現為血尿（可樂色尿）、蛋白尿、水腫、高血壓，並伴隨 GFR 下降。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 62, "stem": "有關膀胱癌進行尿路改道手術後之照護，下列何者正確？", "options": ["鼓勵多進食酸性食物，以酸化尿液可預防感染", "造瘻口周圍皮膚結晶物可用稀釋碳酸氫鈉清除", "需控制每日水分攝取量，以避免產生尿液滲漏", "造瘻口應為暗紅色、乾燥，出現黏性分泌物需返診"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-62", "explanation": "攝取蔓越莓汁等酸性食物使尿液酸化，可抑制細菌繁殖並減少結晶形成，故 A 正確。皮膚結晶應以稀釋「白醋」擦拭溶解；需鼓勵每日攝取 2,000～3,000 c.c. 水分以沖洗尿路；正常造瘻口應為粉紅色且濕潤，回腸導管排出黏液屬正常現象。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 63, "stem": "下列何者於檢查後，不會出現血尿情況？", "options": ["膀胱鏡", "腎臟切片", "尿流速", "逆行性腎盂攝影術"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-63", "explanation": "尿流速檢查僅測量排尿的流速與尿量，屬非侵入性檢查，不會造成血尿，故選 C。膀胱鏡與逆行性腎盂攝影需器械進入尿路，腎臟切片為穿刺侵入性檢查，術後皆可能出現短暫血尿。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 64, "stem": "下列何種疾病的常見臨床症狀不包括血尿？", "options": ["輸尿管結石", "腎絲球腎炎", "前列腺肥大", "膀胱癌"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-64", "explanation": "良性前列腺肥大的主要症狀是尿路阻塞相關表現，如頻尿、夜尿、尿流變細、餘尿感與尿滯留，血尿並非常見症狀，故選 C。輸尿管結石因黏膜刮傷、腎絲球腎炎因腎絲球受損、膀胱癌則以無痛性血尿為典型表現。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 65, "stem": "有關急迫性尿失禁的護理措施，下列何者最不適當？", "options": ["需減重與避免增加腹壓的活動，如提重物", "避免食用刺激膀胱的食物如咖啡、茶或酒", "指導凱格爾運動來訓練強化骨盆底肌肉", "協助擬訂排尿計畫作膀胱訓練增加容量"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-65", "explanation": "減重與避免提重物等增加腹壓的活動，主要是針對「壓力性」尿失禁的措施，對急迫性尿失禁的逼尿肌過動並無直接助益，故 A 最不適當。急迫性尿失禁應避免刺激膀胱的飲食、以膀胱訓練延長排尿間隔並增加容量，並配合骨盆底肌肉運動抑制急迫感。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 66, "stem": "引起代謝性酸中毒的原因，下列何者正確？①延腦異常 ②急性腎衰竭 ③肺擴張不全 ④血糖過高", "options": ["①②", "①③", "②④", "③④"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-66", "explanation": "急性腎衰竭因無法排除氫離子並流失重碳酸根而造成代謝性酸中毒（②對）；血糖過高導致的糖尿病酮酸中毒因酮酸堆積亦屬代謝性酸中毒（④對）。延腦異常與肺擴張不全皆使 CO₂ 滯留，屬「呼吸性」酸中毒（①③錯），故選 ②④。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 67, "stem": "有關腎移植後的急性排斥徵候，不包括下列何者？", "options": ["血壓上升", "尿量減少", "血清肌酸酐值升高", "體重下降"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-67", "explanation": "急性排斥時移植腎功能下降、水分滯留，體重應「增加」而非下降，故選 D。其典型徵候包括發燒、移植部位腫脹壓痛、尿量減少、血壓上升、BUN 與血清肌酸酐上升及體重增加。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 68, "stem": "有關甲狀腺功能亢進病人的護理處置，下列何者正確？", "options": ["睡覺時採平躺，以利眼眶內液體回流，減少不適", "為預防角膜受傷，病人需限制飲食中的鉀含量", "教導病人需採高熱量、高蛋白與高纖維的飲食", "服用飽和碘化鉀溶液時，可混和牛奶一起服用"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-68", "explanation": "飽和碘化鉀溶液（SSKI）味道苦澀且刺激胃黏膜，可稀釋於牛奶或果汁中並以吸管飲用（以免染黃牙齒），故 D 正確。眼球突出者應抬高床頭以促進眼眶液體回流；限制鉀與角膜保護無關，護眼應用人工淚液與眼罩；甲亢代謝率高應採高熱量、高蛋白與高維生素飲食，但因常腹瀉需採「低纖維」並避免咖啡因。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 69, "stem": "有關甲狀腺素製劑使用原則與注意事項，下列何者錯誤？", "options": ["甲狀腺素製劑需終身服用，不可自行停藥或更改劑量", "甲狀腺素會增加毛地黃、Ketamine 及抗凝血劑藥物作用", "新生兒或嬰幼兒，應儘早採高劑量治療，以避免發育遲滯", "服用甲狀腺素製劑會使血糖下降，糖尿病病人需監測血糖"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-69", "explanation": "甲狀腺素會增加腸道葡萄糖吸收與肝醣分解，使血糖「上升」，糖尿病病人可能需調高降血糖藥物劑量，故 D 敘述錯誤。甲狀腺低能症需終身補充；甲狀腺素會增強毛地黃、抗凝血劑等藥物作用；先天性甲狀腺低能症需及早足量治療以避免不可逆的智能與生長遲滯。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 70, "stem": "有關康氏症候群（Conn's syndrome）的臨床表徵，下列何者錯誤？", "options": ["呼吸抑制", "心律不整", "低血容積", "多尿、夜尿"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-70", "explanation": "康氏症候群是原發性醛固酮增多症，鈉與水分滯留使血容積「增加」並造成高血壓，故 C 錯誤。同時大量排出鉀離子造成低血鉀，因而出現肌肉無力甚至呼吸肌無力、心律不整；低血鉀影響腎小管濃縮功能則導致多尿與夜尿。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 71, "stem": "有關蝶骨切除腦下垂體腫瘤的手術後護理處置，下列何者正確？", "options": ["不可用力擤鼻涕、打噴嚏、咳嗽、解便", "提醒 Cortisone 類藥物，必須於飯前服用", "指導手術後二個月後，切勿進行彎腰動作", "若出現多尿、劇渴，表示可能血糖上升"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-71", "explanation": "經蝶骨手術的傷口位於鼻腔與蝶竇，用力擤鼻、打噴嚏、咳嗽或用力解便會升高顱內壓，可能導致腦脊髓液滲漏，故 A 正確。類固醇應「飯後」服用以減少胃刺激；應避免彎腰是術後初期而非兩個月後才開始；術後出現多尿合併劇渴應優先懷疑尿崩症，而非血糖上升。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 72, "stem": "有關副甲狀腺機能亢進病人的臨床表徵，下列何者正確？①少尿 ②噁心 ③心律不整 ④骨鈣沉積", "options": ["①②", "①③", "②③", "②④"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-72", "explanation": "副甲狀腺機能亢進造成高血鈣，會抑制腸胃蠕動而出現噁心、嘔吐、便秘（②對），並影響心肌傳導導致心律不整（③對）。高血鈣使腎臟濃縮功能受損而「多尿」（①錯）；骨骼中的鈣被釋出到血中，造成骨質流失與病理性骨折，而非骨鈣沉積（④錯），故選 ②③。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 73, "stem": "王先生，58 歲，罹患糖尿病 2 年，藉由口服抗血糖藥物、飲食與運動控制血糖，今日在家昏倒救護車送入急診，心跳 118 次／分，血壓 85/50 mmHg，呼吸速率 20 次／分，血糖為 650 mg/dL。下列何者為最可能之診斷？", "options": ["乳酸中毒", "低血糖昏迷", "糖尿病酮酸中毒（DKA）", "高滲透壓高血糖狀態（HHS）"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-73", "explanation": "第 2 型糖尿病病人仍有殘存胰島素可抑制脂肪分解，故不易產生酮體；血糖高達 650 mg/dL（常＞600）合併嚴重脫水造成的心搏過速、低血壓與意識改變，符合高滲透壓高血糖狀態，故選 D。DKA 多見於第 1 型糖尿病，會出現酮體、庫斯毛耳氏呼吸與爛蘋果味。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 74, "stem": "承上題，有關王先生診斷可能出現的徵象，下列何者錯誤？", "options": ["檢驗血中呈現無或微量酮體", "檢驗血漿滲透壓為 280 mOsm/kg", "皮膚與黏膜乾燥、電解質不平衡", "血液容積減少而心搏過速、低血壓"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-74", "explanation": "HHS 的診斷條件之一即為血漿滲透壓大於 320 mOsm/kg，280 mOsm/kg 屬正常值範圍，故 B 錯誤。其餘無或微量酮體、脫水造成的皮膚黏膜乾燥與電解質不平衡、血容積不足導致的心搏過速與低血壓，皆為 HHS 的典型表現。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 75, "stem": "有關糖尿病視網膜病變的敘述，下列何者錯誤？", "options": ["視網膜眼底檢查可見微血管瘤，是屬於非增殖性視網膜病變", "區分增殖性或非增殖性視網膜病變可藉由直接觀察視網膜來確診", "視網膜新生血管破裂出血，液體從血管滲出，會造成黃斑部水腫", "糖尿病所引起的黃斑部病變可利用雷射治療恢復失去的視力"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-75", "explanation": "雷射光凝固治療的目的是封閉滲漏血管、抑制新生血管以「阻止病變繼續惡化」，並無法使已喪失的視力恢復，故 D 錯誤。微血管瘤屬非增殖期的早期變化；有無新生血管增生可由眼底檢查判別；新生血管滲漏或出血會造成黃斑部水腫而使中心視力下降。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 76, "stem": "下列何種休克病人，根據其導因應優先考慮給與水分或血品之輸注？", "options": ["心因性休克", "低血容積性休克", "過敏性休克", "敗血性休克"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-76", "explanation": "低血容積性休克的病因即為血液或體液大量流失，故首要處置是快速補充晶體溶液與血品以恢復循環容積，選 B。心因性休克過度給液反而加重心臟負荷；過敏性休克首選 Epinephrine；敗血性休克雖也需給液，但關鍵在抗生素與升壓劑。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 77, "stem": "何處骨折最適合使用八字繃帶法進行固定？", "options": ["前臂與手腕骨折", "骨盆骨折", "股骨骨折", "鎖骨骨折"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-77", "explanation": "八字（figure-of-eight）繃帶繞經兩側腋下與背部交叉，可將雙肩向後拉開並維持鎖骨對位，是鎖骨骨折的典型固定方式，故選 D。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 78, "stem": "下列何者為病人在休克進行期或不可逆期出現的表徵？", "options": ["心跳 70～80 次／分", "呼吸 12～15 次／分", "血中 pH＞7.50", "血中 PaCO₂＞40 mmHg"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-78", "explanation": "休克進行期以後，組織灌流嚴重不足、呼吸肌疲乏且肺功能惡化，CO₂ 無法排出而滯留，PaCO₂ 上升超過 40 mmHg，故選 D。此階段心跳與呼吸皆明顯增快而非正常範圍；因乳酸堆積會出現代謝性酸中毒，pH 應低於 7.35 而非大於 7.50。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 79, "stem": "有關急救藥物主要治療效果的敘述，下列何者錯誤？", "options": ["Amiodarone 主要用於治療病人持續出現心室纖維顫動或是無脈搏心室心搏過速", "Atropine 多用於心搏過緩或心臟收縮不全", "Dopamine 多用於治療低血壓", "Sodium Bicarbonate（NaHCO₃）多用於治療鹼血症"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-79", "explanation": "Sodium Bicarbonate 為鹼性藥物，用於矯正代謝性「酸」血症（如長時間心肺復甦、高血鉀、藥物中毒），若用於鹼血症會使病情惡化，故 D 錯誤。Amiodarone 用於難治型 VF／無脈搏 VT；Atropine 提升心跳；Dopamine 具升壓作用。"}, {"year": "110", "session": "第二次", "subject": "內外科護理學", "num": 80, "stem": "有關腸病毒的敘述，下列何者錯誤？", "options": ["是 DNA 病毒的一種", "除小兒麻痺病毒外，尚無疫苗可預防", "可經由口鼻分泌物、飛沫及糞便等途徑傳染", "主要採症狀治療"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-2-3104-80", "explanation": "腸病毒屬小 RNA 病毒科（Picornaviridae），為「RNA」病毒而非 DNA 病毒，故 A 錯誤。腸病毒型別眾多，除小兒麻痺病毒有疫苗外其餘尚無疫苗（腸病毒 71 型疫苗於本試題年度後才上市）；傳染途徑為糞口、飛沫與接觸；治療以支持性與症狀療法為主。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 1, "stem": "有關煮沸消毒法的敘述，下列何者正確？", "options": ["水量須蓋過消毒物品且與消毒物品等高", "消毒時間是自打開爐火後開始計算", "沸水中加入 2%的碳酸鈉可增加消毒作用", "玻璃類以煮沸 3～5 分鐘為原則"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-1", "explanation": "沸水中加入 2% 碳酸鈉可提高沸點並增強消毒效果，故選 C。水量應高過物品 5 公分以上；時間須自水「沸騰」後計算；玻璃類約需煮沸 10～20 分鐘。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 2, "stem": "下列何種情況出現時只需要記錄，不需要報告？", "options": ["體溫 37.6℃的病人經衛教後能多喝水", "糖尿病病人足部潰瘍在換藥後發現傷口周圍有明顯的泛紅情形", "姿位性低血壓的病人在下床時跌倒", "躁症病患與其他病人在病室發生口角衝突"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-2", "explanation": "體溫僅略高且經衛教後能自行增加水分攝取，屬穩定情況，記錄即可，故選 A。傷口周圍泛紅（感染徵象）、跌倒事件與病人衝突皆屬異常事件，必須立即報告。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 3, "stem": "為四肢水腫嚴重病人執行盤尼西林皮膚試驗時，下列何者為最適合的注射部位？", "options": ["上臂三角肌外側", "大腿中段外側", "前臂中段內側", "前胸鎖骨下方"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-3", "explanation": "皮內試驗需在水腫程度最輕、皮膚平整處判讀，四肢嚴重水腫時前臂與大腿皆不適合，故改選前胸鎖骨下方，選 D。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 4, "stem": "有關執行存留導尿的技術，下列敘述何者錯誤？", "options": ["導尿管號碼越大，尺寸越大", "成人個案一般會選用 20 Fr.的導尿管", "須確定氣囊整個進入膀胱後，才可以打入液體固定", "導尿管插入的深度，男性約 20 公分，女性約 5 公分"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-4", "explanation": "本題選錯誤。成人存留導尿一般選用 14～16 Fr.，20 Fr. 過粗易造成尿道損傷，故 B 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 5, "stem": "病人術後 6 小時有排尿困難，下列何者誘尿方法需有醫囑才能執行？", "options": ["聽流水聲", "手握冰塊", "熱水袋熱敷膀胱", "溫水會陰沖洗"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-5", "explanation": "使用熱水袋屬用熱措施，有燙傷與加重出血之虞，須有醫囑才能執行，故選 C。聽流水聲、手握冰塊、溫水沖洗會陰皆屬護理獨立性措施。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 6, "stem": "游奶奶接受雙側膝關節置換術，術後第一天使用自控式嗎啡疼痛控制器止痛，白班護生王同學照顧游奶奶，9:40 am 尚未備口服藥物，實習指導老師詢問下，王同學表示：「奶奶還在睡覺，剛剛測量的生命徵象 BP 為 122∕64 mmHg、TPR：36.4℃、64 次／分、8 次／分，我想奶奶昨天開刀應該讓她休息一下，我不忍心叫她起床吃藥」，針對上述情境，下列處置何者最適當？", "options": ["應讓病人有足夠的休息，以利術後復原", "服藥時間已超過應暫停給此次服藥", "護生具有關懷之心應給予正向鼓勵", "立即再次確認病人生命徵象之正確性"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-6", "explanation": "呼吸速率僅 8 次／分且病人叫不醒，是嗎啡過量抑制呼吸的重要警訊，應立即再次確認生命徵象並評估意識，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 7, "stem": "承上題，游奶奶術後第一天生命徵象的改變，下列敘述何者正確？", "options": ["傷口疼痛會使得呼吸速率變慢", "鴉片類止痛劑會抑制呼吸速率及深度", "術後失血減低呼吸速率", "全身麻醉劑刺激呼吸速率"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-7", "explanation": "鴉片類止痛劑會抑制延腦呼吸中樞，使呼吸速率變慢、深度變淺，故選 B。傷口疼痛與術後失血會使呼吸「加快」；全身麻醉劑則為抑制而非刺激呼吸。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 8, "stem": "李先生因車禍造成腦部創傷，手術後一個月，生命徵象穩定但意識不清、需長期臥床，此時較合適使用何種方式提供營養？", "options": ["由口進食", "鼻胃管灌食法", "口胃管灌食法", "腸胃道造口管灌食法"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-8", "explanation": "意識不清無法安全吞嚥，且預計管灌時間仍屬中短期（一個月），以鼻胃管灌食最合適，故選 B。口胃管多用於新生兒或鼻腔受阻者；造口管適用於預計超過 4～6 週以上的長期灌食。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 9, "stem": "髖部全關節運動，不包括下列何者？", "options": ["旋前", "屈曲", "外展", "內收"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-9", "explanation": "旋前（pronation）與旋後為前臂的動作，不屬於髖關節的關節運動，故選 A。髖關節可執行屈曲、伸展、外展、內收與內外旋。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 10, "stem": "朱老太太因股骨頭骨折接受手術治療，其下肢以彈性繃帶包紮之主要目的為何？", "options": ["促進血液回流、防止鬱積", "保暖", "固定傷口敷料", "加壓止血"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-10", "explanation": "下肢使用彈性繃帶的主要目的是提供均勻壓力、促進靜脈回流，預防血液鬱積與深部靜脈栓塞，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 11, "stem": "王先生因氣喘入院治療，為他安排最適當的臥姿為：", "options": ["仰臥式", "坐臥式", "膝胸臥式", "俯臥式"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-11", "explanation": "坐臥式可使橫膈下降、增加胸腔容積並利於使用呼吸輔助肌，能有效改善氣喘病人的呼吸困難，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 12, "stem": "當執行遺體護理時，家屬表示希望為病人進行佛教助唸儀式，護理人員如何處置最為適當？", "options": ["告知家屬至太平間後才能舉行", "在醫院政策准許下提供助唸環境", "告知須立刻執行遺體護理，不宜舉行儀式", "請病房中相同信仰之工作人員及病友一起助唸"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-12", "explanation": "遺體護理應尊重家屬的宗教信仰與文化需求，在醫院政策許可範圍內提供助唸環境最為適當，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 13, "stem": "雇主提供員工定期身體檢查，在三段五級健康學說中屬於那一層級的預防？", "options": ["第一段第一級", "第一段第二級", "第二段第三級", "第三段第四級"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-13", "explanation": "依 Leavell 與 Clark 三段五級的原始分類，「定期選擇性健康檢查」與衛生教育、良好營養、適當工作休閒、婚姻與性教育、遺傳優生同列為第一段第一級「促進健康」的內容，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 14, "stem": "關於醫院火災種類和適用的滅火器，下列敘述何者錯誤？", "options": ["配電盤系統引發火災適用二氧化碳滅火器滅火", "實驗室鎂離子引發火災適用乾粉滅火器滅火", "裝潢時油漆引發火災適用泡沫滅火器滅火", "燃紙引發火災適用二氧化碳滅火器滅火"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-14", "explanation": "本題選錯誤。紙張屬 A 類（普通火災），應以水或泡沫滅火器撲滅；二氧化碳滅火器適用於 B 類（油類）與 C 類（電氣）火災，故 D 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 15, "stem": "有關輻射防護之敘述，下列何者正確？", "options": ["曝露時間越長對人體傷害越大，故照顧病人宜採取短時間多次的方式", "放射線強度與距離的平方呈正比，故越接近輻射線所受到的輻射線傷害越大", "操作人員須隨時戴上感光片，並定期追蹤所接受輻射量之多寡", "輻射線 α、β、γ 當中，以 α 射線穿透力最強，對人體危害的嚴重程度最強"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-15", "explanation": "操作人員應配戴輻射劑量佩章（感光片）並定期追蹤累積劑量，故選 C。照護應「集中護理、縮短時間與次數」；輻射強度與距離平方成「反比」；三者中以 γ 射線穿透力最強。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 16, "stem": "張女士，因乳癌入院接受化療，住院期間非常關心血液檢查結果，依疾病病程，張女士現處於那一階段？", "options": ["開始期", "接受期", "恢復期", "結束期"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-16", "explanation": "病人已接受疾病與治療事實，並將注意力集中於自身檢查數據與病情變化，屬病程中的接受期，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 17, "stem": "手術室最適宜的室溫以及相對濕度之範圍，下列何者正確？", "options": ["15～20℃，30～50%", "15～20℃，50～70%", "20～27℃，30～50%", "20～27℃，50～70%"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-17", "explanation": "手術室建議室溫約 20～27℃、相對濕度 50～70%，濕度過低易產生靜電、過高則利於微生物繁殖，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 18, "stem": "病人因化學治療導致噁心嘔吐，無法進食，照會營養師給予飲食指導，隨後護理人員追蹤病人的進食狀態，屬於下列何種護理功能？", "options": ["依賴性功能", "治療性功能", "合作性功能", "獨立性功能"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-18", "explanation": "與營養師等其他專業人員共同照護並追蹤成效，屬合作性（協同性）護理功能，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 19, "stem": "下列何者屬於客觀性資料（objective data）？", "options": ["主訴：「我覺得想吐、頭痛」", "家屬：「他昨天一直起來上廁所」", "呼吸淺而快，每分鐘 25 次", "主訴：「我發燒應該有 38℃」"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-19", "explanation": "客觀資料是可經由觀察或測量而得的徵象，呼吸型態與速率屬之，故選 C。病人主訴與家屬敘述皆屬主觀資料。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 20, "stem": "醫囑 Tetracycline oint .O.D. t.i.d.，下列給藥方式何者正確？", "options": ["將藥膏塗於病人左眼", "將藥膏塗於病人右眼", "將藥膏塗於病人左耳", "將藥膏塗於病人右耳"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-20", "explanation": "O.D.（oculus dexter）為右眼之意，故藥膏應塗於右眼，選 B。左眼為 O.S.、雙眼為 O.U.。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 21, "stem": "有關醫囑的敘述，下列何者正確？", "options": ["「order renew」代表先前開立之醫囑無效，須以重新開立之醫囑為依據", "緊急狀況時護生可以接受口頭醫囑，但事後須盡速補開醫囑", "長期醫囑的有效期限為 7 日", "執行 p.r.n 醫囑後，無須記錄病人用藥情況"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-21", "explanation": "order renew 表示原醫囑失效，須以重新開立者為執行依據，故選 A。護生不得接受口頭醫囑；長期醫囑於停止或更改前持續有效；p.r.n. 給藥後仍須記錄用藥時間與反應。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 22, "stem": "醫囑 Coumadin 1# p.o. stat & q.d.×3 days then 0.5# p.o. q.d.，請問第 5 天時 Coumadin 應給予幾顆？", "options": ["0.5#", "1#", "1.5#", "2#"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-22", "explanation": "1# q.d. 僅給 3 天（第 1～3 天），第 4 天起改為 0.5# q.d.，故第 5 天應給 0.5 顆，選 A。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 23, "stem": "王先生身體外觀瘦弱，右小腿有一處 2×3 公分的傷口，左側偏癱無法行走，無法自行進食，有中度脫水情形。王先生的問題，下列何者應最優先處理？", "options": ["皮膚完整性受損", "活動功能障礙", "體液容積缺失", "營養少於身體需要"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-23", "explanation": "依馬斯洛需求層次與生命威脅程度，中度脫水造成的體液容積缺失最可能危及循環與生命，應最優先處理，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 24, "stem": "陳女士，50 歲，罹患糖尿病多年，下肢現有 5×3×2 公分潰瘍性傷口，傷口分泌物惡臭有腐肉，入院進行傷口清創手術，其護理目標之訂定，下列何者最適當？", "options": ["一星期內傷口可完全癒合", "二個星期後傷口可縮小至 3×2×1 公分", "可攝取適當營養", "自述高熱量、低蛋白飲食的重要性"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-24", "explanation": "良好的護理目標須具體、可測量且有時間性與可達成性，「二週後傷口縮小至 3×2×1 公分」符合此原則，故選 B。糖尿病足潰瘍一週內完全癒合不切實際；C 缺乏具體指標；傷口癒合應採高蛋白而非低蛋白。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 25, "stem": "護理師收集病人主觀資料和客觀資料，下列敘述何者正確？", "options": ["觀察到病人臉色蒼白、盜汗，屬客觀資料", "家屬說：「很少看到他喝水」，屬客觀資料", "24 小時攝入／排出量：2,000 / 1,500 c.c.，屬主觀資料", "觀察到病人淚流滿面，雙手抱緊肚子，屬主觀資料"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-25", "explanation": "護理師直接觀察到的臉色蒼白與盜汗屬客觀資料，故選 A。家屬陳述屬主觀資料；I/O 為測量所得屬客觀資料；觀察到的哭泣與姿勢亦屬客觀資料。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 26, "stem": "協助病人使用口頰溶片 Painkyl（fentanyl citrate）（buccal soluble films/200 mcg）1 buccalfilm 控制疼痛，下列何者最適當？", "options": ["將藥片放置於舌下", "使用前，協助病人潤濕口腔兩頰", "藥片使用後，4 小時內完全禁食", "藥片置入後 30 分鐘內，應避免飲用液體"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-26", "explanation": "口頰溶片需貼附於頰黏膜，使用前應先以水潤濕口腔兩頰以利藥片黏附與溶解，故選 B。此劑型置於頰側而非舌下，也不需長時間禁食。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 27, "stem": "林女士術後傷口痛，醫囑：Pethidine（Demerol）50 mg IM stat.，為減少注射過程中疼痛與不適，下列措施何者不適當？", "options": ["注射前，熱敷注射部位", "下針時，繃緊注射部位", "注射後，迅速拔出針頭", "注射後，按摩注射部位"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-27", "explanation": "本題選不適當。注射前熱敷對減輕「注射過程中」的疼痛並無助益，且會使局部血管擴張加速藥物吸收，故 A 不適當。繃緊皮膚、快速拔針與注射後輕輕按摩皆可減輕不適。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 28, "stem": "10：00 am 開立一臨時醫囑：Oxacillin sodium（500 mg/vial）2,000 mg IVF stat.，然護理師於 1：00 pm 給予 Oxacillin sodium（500 mg/vial）2vial IVF，上述給藥過程，不符合那幾項給藥原則：①時間 ②途徑 ③劑量 ④藥物", "options": ["①④", "②③", "①③", "②④"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-28", "explanation": "stat. 應立即給藥卻延遲 3 小時，違反①時間；醫囑 2,000 mg 需 4 vial，實際僅給 2 vial（1,000 mg），違反③劑量；途徑與藥物皆正確，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 29, "stem": "一位 10 公斤重的病童，服用 Amolin susp.（amoxicillin）30 mg/kg q12h P.O.，藥瓶標籤顯示 25 mg/mL、60 mL/瓶，單次給藥劑量應為多少？", "options": ["5 mL", "10 mL", "12 mL", "24 mL"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-29", "explanation": "單次劑量 ＝ 30 mg/kg × 10 kg ＝ 300 mg；300 mg ÷ 25 mg/mL ＝ 12 mL，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 30, "stem": "有關冷熱效用的敘述，下列何者最適當？", "options": ["空氣的導熱力與滲透力高於水，故乾冷熱效果較好", "冷接受器在皮膚淺層，故人體對冷刺激較為敏感", "溼冷的效果比乾冷佳，使用濕冷時應較乾冷溫度低，以防凍傷", "皮膚接觸冷熱時間越久，其對溫度的敏感性越高"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-30", "explanation": "冷接受器分布較淺且數量較多，故人體對冷刺激較敏感，選 B。水的導熱與滲透力高於空氣，故濕冷熱效果較佳；使用濕冷時溫度應「較高」以防凍傷；接觸時間越久敏感性反而下降（適應現象）。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 31, "stem": "鼻黏膜出血的病人，於前額冰敷以達止血的原理為何？", "options": ["收縮淺層皮膚血管使血液循環變慢", "降低微血管通透性，抑制血管和組織間液體交換", "提升「凝血因子」的活性，減緩血流速度", "減少血流與組織淋巴液，降低細胞的新陳代謝"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-31", "explanation": "冷療的止血機轉在於使淺層血管收縮、局部血流減慢而促進止血，故選 A。降低通透性主要是減輕水腫；冷會降低而非提升凝血因子活性；降低細胞代謝屬於冷療的其他效應。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 32, "stem": "產後會陰傷口使用烤燈之目的，下列何者錯誤？", "options": ["可促進傷口乾燥", "可促進血管收縮", "可減輕腫脹", "可促進血液循環"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-32", "explanation": "本題選錯誤。烤燈屬乾熱療法，會使血管「擴張」而非收縮，故 B 錯誤。其作用在促進傷口乾燥、增加血液循環並減輕腫脹與疼痛。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 33, "stem": "病人便秘、痔瘡凸出疼痛，下列冷熱處理方式，何者最適當？", "options": ["肛門處給予乾熱敷", "於肛門處使用熱水袋", "給予溫水坐浴", "肛門處使用冷敷墊"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-33", "explanation": "溫水坐浴屬濕熱療法，能均勻接觸會陰與肛門部位，促進循環、鬆弛括約肌並減輕痔瘡疼痛，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 34, "stem": "吳女士的血液檢驗報告：Sodium 138 mEq/L、Potassium 2.9 mEq/L、Chloride 102 mEq/L、Calcium 4.8 mEq/L，下列何者情境可能引發此檢驗結果？", "options": ["過度水化（overhydration）", "脫水（dehydration）", "嘔吐（vomiting）", "長期臥床（immobility）"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-34", "explanation": "報告中僅鉀離子 2.9 mEq/L 偏低（正常 3.5～5.0），其餘皆在正常範圍。嘔吐會由胃液大量流失鉀離子而造成低血鉀，故選 C。過度水化多見低血鈉、脫水時電解質整體上升、長期臥床則易高血鈣。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 35, "stem": "病人右手臂正在進行靜脈輸液，護理人員發現其點滴流速不順暢、沒有回血、注射部位水腫且冰冷，下列處置何者最適當？", "options": ["調整右手臂的位置並調高點滴架", "右手臂注射部位進行熱敷", "調整血管中靜脈留置針的長度", "停止輸注並移除靜脈留置針"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-35", "explanation": "流速不順、無回血、局部水腫且冰冷是典型的輸液滲漏（浸潤）徵象，應立即停止輸注並移除留置針，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 36, "stem": "靜脈輸注部位的選擇原則，下列何者正確？", "options": ["應從上肢遠端靜脈開始選", "優先選擇下肢的深部靜脈", "肘關節處靜脈是最佳位置", "浸潤重打時，應選擇浸潤部位的遠心端靜脈"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-36", "explanation": "靜脈穿刺應由上肢遠端開始，逐次往近心端選擇以保留血管，故選 A。下肢靜脈易生栓塞不宜優先；肘關節處活動大易滲漏；浸潤後重打應選「近心端」或另一肢。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 37, "stem": "下列那些情況，會增加身體無感性水分喪失（insensible losses）？①腹瀉 ②發燒 ③呼吸短促 ④使用利尿劑", "options": ["①②", "②③", "③④", "①④"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-37", "explanation": "無感性水分喪失指經由皮膚蒸發與呼氣散失的水分，②發燒與③呼吸短促皆會使其增加，故選 B。腹瀉與使用利尿劑屬可測量的有感性水分喪失。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 38, "stem": "長期臥床病人若採取伐式操作法（Valsava's maneuver）用力解便，可能導致下列何種情況？", "options": ["減少胸內壓", "增加靜脈血回流至右心房", "增加身體氧合功能", "減低心搏出量"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-38", "explanation": "伐式操作法時閉氣用力使胸內壓上升，靜脈回流受阻、心室充填減少，導致心搏出量下降，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 39, "stem": "王女士，罹患腦瘤，頭部曾接受放射線照射治療，協助其洗髮時，下列敘述何者最適當？", "options": ["若頭髮梳不開，可用 90%酒精梳理", "吹風機直吹頭皮，加速頭皮與髮絲乾燥", "梳髮時先梳髮尾再梳髮根", "儘量以指尖洗頭皮兼止癢"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-39", "explanation": "梳髮應先由髮尾梳順再往髮根，可減少拉扯與落髮，故選 C。酒精與吹風機直吹會使頭皮乾燥受損；洗頭應以指腹而非指尖，避免抓傷放射照射後脆弱的頭皮。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 40, "stem": "黃先生為糖尿病病人，血糖控制不佳住院，右足背有一傷口，外觀紅腫，有關足部護理措施，下列何者最適當？", "options": ["先浸泡溫水 15～30 分鐘再行修剪趾甲", "腳趾甲應修成圓形，避免形成嵌趾甲", "腳趾甲旁的肉刺應協助剪除並進行消毒", "由大腿往腳趾方向塗抹乳液並同時按摩"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-40", "explanation": "肉刺易造成皮膚裂傷而成為感染入口，糖尿病病人不可自行處理，應由醫護人員協助剪除並消毒，故選 C。足部已有紅腫傷口不宜長時間浸泡；趾甲應平剪而非修成圓形；乳液塗抹與按摩應由末梢往近心端方向並避開趾縫。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 41, "stem": "為老年病人執行背部護理時，下列何者不適當？", "options": ["重擦法（friction）", "按撫法（stroking）", "敲擊法（tapotement）", "揉捏法（kneading）"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-41", "explanation": "本題選不適當。老年人多有骨質疏鬆，敲擊法力道大且具震動性，易造成骨折或不適，故 C 不適當。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 42, "stem": "有關藥物使用對排便之影響，下列敘述何者正確？", "options": ["長期服用嗎啡（Morphine）止痛易導致腹瀉", "高劑量含鋁的制酸劑易導致腹瀉", "腸道攝影檢查服用鋇劑可能會解黑便", "長期服用抗生素易破壞正常菌叢造成腹瀉"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-42", "explanation": "長期使用抗生素會破壞腸道正常菌叢而引起腹瀉，故選 D。嗎啡抑制腸蠕動造成便秘；含鋁制酸劑亦導致便秘；服用鋇劑後解出的是「白色」糞便，黑便多與含鐵劑或上消化道出血有關。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 43, "stem": "下列病人情境，何者適合執行灌腸？", "options": ["王女士平日無便秘，不明原因腹絞痛兩天，有裏急後重感", "王先生吃麻辣鍋後，肛門口痔瘡腫痛厲害，排便困難", "王太太懷孕 28 週，住院臥床安胎，輕微宮縮，多日未解便", "王太太下肢骨折住院，多日未解便，腹脹不適"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-43", "explanation": "下肢骨折臥床導致腸蠕動減慢而便秘腹脹，屬灌腸的適當適應症，故選 D。不明原因腹痛、痔瘡急性腫痛與安胎中的孕婦（灌腸會刺激子宮收縮）皆為禁忌。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 44, "stem": "下列何者是最可能發生心搏速率 > 100 次／分的情況？", "options": ["正在服用毛地黃藥物之病人", "低體溫入院的溺水病人", "規律服用 Propranolol 的老年病人", "甲狀腺機能亢進的中年病人"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-44", "explanation": "甲狀腺機能亢進使代謝率上升、交感神經活性增強，最易出現心搏過速，故選 D。毛地黃與 Propranolol 皆會減慢心跳，低體溫時心跳亦變慢。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 45, "stem": "有關血壓之敘述，下列何者錯誤？", "options": ["飲酒過量，會使血管收縮導致血壓上升", "顱內壓過高者，會出現心跳變慢、血壓上升", "一天中，午後或傍晚的血壓值最高", "血壓值變化從高到低，依序為站姿、坐姿、平躺"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-45", "explanation": "本題選錯誤。酒精會使周邊血管「擴張」，短時間內血壓反而下降（長期過量飲酒才與高血壓有關），故 A 敘述錯誤。顱內壓過高的庫欣氏反應為心跳變慢、血壓上升。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 46, "stem": "關於脈搏的特性或測量之敘述，下列何者正確？", "options": ["脈搏於吸氣增快，呼氣變慢稱為柯利干氏脈（Corrigan's pulse）", "正常脈搏強度的標記為 1+", "評估雙下肢動脈阻塞情形，可測量足背動脈", "尺及橈動脈之脈搏均為 70 次／分、心尖脈為 85 次／分，稱為竇性心律不整"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-46", "explanation": "足背動脈為下肢遠端的重要脈搏點，可評估下肢動脈血流是否阻塞，故選 C。吸氣加快呼氣變慢為竇性心律不整；正常脈搏強度標記為 2+；心尖脈與橈動脈脈搏數不一致稱為脈搏短絀。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 47, "stem": "下列個案情境，何者未達國際睡眠障礙分類法所建議失眠（insomnia）的標準？", "options": ["70 歲老人，上床到入睡時間超過 40 分鐘", "70 歲老人，經常半夜醒來 2～4 次，每次覺醒超過 10 分鐘", "成年人，每天睡眠總時數共 5 小時", "成年人，睡眠效率為 85%"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-47", "explanation": "睡眠效率達 85% 以上屬正常範圍，未達失眠標準，故選 D。入睡時間超過 30 分鐘、夜間頻繁覺醒、總睡眠時數少於 6 小時皆符合失眠指標。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 48, "stem": "王老太太，85 歲，尾薦骨處出現 5×6×1 公分的壓傷，導致壓傷的可能原因下列何者錯誤？", "options": ["營養不良", "採半坐臥，身體常下滑", "長期便秘", "躺臥於不平整床褥"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-48", "explanation": "本題選錯誤。壓傷的成因為壓力、剪力、摩擦力與組織耐受性下降；長期便秘與尾薦骨壓傷並無直接關係，故 C 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 49, "stem": "陳先生手術後 6 小時呈現躁動，意識不清，欲拔除身上管路，護理師欲執行約束法，下列敘述何者錯誤？", "options": ["如家屬無法立即聯絡，可先進行約束，隨後再取得家屬同意", "約束時，約束帶鬆緊度以能伸入 1～2 根手指寬為原則", "約束部位先以棉墊包裹，再使用平結", "約束帶勿固定於可移動的設備上"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-49", "explanation": "本題選錯誤。約束屬限制人身自由的措施，須有醫囑並取得病人或家屬的知情同意後方可執行，不得以「事後再補同意」為原則，故 A 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 50, "stem": "醫囑每 2 小時間歇管灌食的病人，已於 8：00 am 灌食 250 mL 後，於 10：00 am 管灌前反抽鼻胃管有 150 mL 之未消化液，下列處置何者最適當？", "options": ["將病人採右側臥以促進胃排空，一小時後再給予灌食", "評估腸蠕動音，並給予胃部按摩", "減少灌食量，此次給予灌食 100 mL", "暫停鼻胃灌食，並與醫師討論"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-50", "explanation": "殘餘量 150 mL 已超過前次灌食量的一半（＞100 mL），代表胃排空明顯延遲，應暫停灌食並與醫師討論後續處置，以免嘔吐與吸入，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 51, "stem": "有關入院病人護理措施，下列何者適當？①需在接病人的當班內完成所有的護理評估等病歷內容 ②自我介紹及觀察病人是最先的護理活動 ③需建立身高、體重及生命徵象的資料 ④護理人員應主動保管病人貴重物品，以免遺失", "options": ["①③", "②③", "②④", "①④"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-51", "explanation": "②自我介紹並觀察病人是入院最先執行的護理活動，③身高、體重與生命徵象為必要的基本資料，故選 B。護理評估通常於 24 小時內完成而非限當班；貴重物品應請家屬帶回，護理人員不主動保管。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 52, "stem": "接觸性隔離病人出院後，其病人單位與用物的處理，下列何者正確？", "options": ["病人服放於塑膠袋內，袋外註明床號、傳染類別，再丟入於一般污衣桶內", "枕頭先以塑膠袋包裹，袋外註明床號、傳染類別，送高壓蒸氣消毒", "病床應先以紫外線照射 30 分鐘後，再以消毒液擦拭清理", "點滴幫浦，應先以 95%酒精擦拭，吹晾 8 小時後才能再使用"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-52", "explanation": "隔離病人出院後的終期消毒，病床可先以紫外線照射 30 分鐘再以消毒液擦拭，故選 C。病人服應丟入「隔離」污衣桶；枕頭不耐高壓蒸氣，多採日曬或環氧乙烷處理；儀器表面應以 75% 酒精擦拭。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 53, "stem": "有關靜脈採血收集檢體，下列敘述何者最適當？", "options": ["為減少病人扎針次數，可由靜脈輸液管路抽血", "止血帶應綁於抽血部位上方距離約 2～3 公分處", "抽血後，如採集試管內有抗凝血劑，應輕搖試管", "抽血後應請病人按揉抽血處，以免血腫產生"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-53", "explanation": "含抗凝血劑的試管需輕輕反轉搖勻，使血液與抗凝劑充分混合又不致溶血，故選 C。由輸液管路抽血會稀釋檢體；止血帶應綁在穿刺點上方約 5～10 公分；拔針後應「按壓」而非按揉，以免皮下出血。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 54, "stem": "有關死亡後的遺體變化，下列敘述何者正確？", "options": ["屍斑的產生是因肌蛋白發生化學變化導致", "屍僵是死亡後遺體最早的改變", "屍僵的產生由頷部開始", "在完全屍僵後軀體就不會再軟化"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-54", "explanation": "屍僵一般自頷部（下顎）與頸部開始，再向下擴展至軀幹與四肢，故選 C。屍斑是血液因重力沉積所致；最早出現的變化是屍冷；屍僵約於 24～48 小時後會自行緩解軟化。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 55, "stem": "莊太太有貧血，預做糞便潛血試驗（化學法），下列措施何者錯誤？", "options": ["告知檢體收集前三天勿食用波菜、甘藍菜、紅肉和肝臟", "告知常規服用的鐵劑於檢體收集前三天停止服用", "檢體收集前需評估莊太太是否於經期", "沾有尿液的糞便，仍可置入無菌容器送檢"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-55", "explanation": "本題選錯誤。糞便檢體若被尿液污染會影響檢驗結果，應重新採集，故 D 錯誤。化學法潛血試驗前三天應避免紅肉、肝臟與含過氧化酶的蔬菜並停用鐵劑，且經期中不宜採檢。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 56, "stem": "林先生診斷為肝癌末期，住院期間剛好遇到鄰床同樣是癌末的病人過世，林先生晚上因害怕無法入睡並時常按叫人鈴，下列何者是最優先的護理措施？", "options": ["請家屬夜間留院陪伴", "評估病人對死亡的感受", "協助轉床減少恐懼", "提供唸佛機轉移注意力"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-56", "explanation": "護理過程應先評估再處置，須先了解病人對死亡的感受與恐懼來源，才能提供適切支持，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 57, "stem": "下列何者不屬於醫院的固定成本？", "options": ["護理人員薪資", "醫療衛材費用", "建築物折舊", "儀器設備費用"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-57", "explanation": "固定成本不隨業務量增減而變動；醫療衛材費用會隨病人數與治療量增加而上升，屬變動成本，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 58, "stem": "依照馬斯洛（Maslow）的需求層級理論，護理主管應優先注意護理人員下列何種需要？", "options": ["薪資福利", "升遷", "專業成長", "成就感"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-58", "explanation": "薪資福利屬最基本的生理與安全需求，依需求層級理論應優先被滿足，故選 A。升遷、專業成長與成就感屬較高層次的尊重與自我實現需求。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 59, "stem": "醫療院所欲控制成本時，下列何者不是進行成本分析的要項？", "options": ["基層員工的配合", "正確的統計資料", "健全的會計制度", "健全的組織結構"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-59", "explanation": "成本分析的要項在於制度與資料面，包括正確的統計資料、健全的會計制度與組織結構；基層員工配合屬執行層面，並非成本分析的要項，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 60, "stem": "團體決策的好處是可以集思廣益，想出解決問題的可行方案。病房護理長利用通訊軟體（LINE）建立該病房護理師群組，徵詢大家意見並引導討論和排定解決問題的最佳方案。這是屬於那一種團體決策技巧？", "options": ["問卷調查法（survey）", "名義／記名式團體法（nominal group technique）", "焦點團體法（focus group interview）", "德菲法（Delphi method）"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-60", "explanation": "成員各自提出意見、不面對面互動，再由主持人彙整並排定方案優先順序，屬名義（記名式）團體法，故選 B。焦點團體須面對面互動討論；德菲法為多輪匿名問卷。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 61, "stem": "有關規劃護理管理工作的主要目的，下列何者錯誤？", "options": ["設定明確目標", "增加效率及效果", "降低不確定的程度", "增加工作步驟"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-61", "explanation": "本題選錯誤。規劃的目的在於簡化流程、提升效率，而非增加工作步驟，故 D 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 62, "stem": "管理者在新年度編列預算時，不考量過去年度的預算而重新編列，這是屬於下列何種預算？", "options": ["設計計畫預算", "零基預算", "固定式預算", "開放式預算"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-62", "explanation": "零基預算不以過去年度預算為基礎，每項支出均須重新評估其必要性後編列，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 63, "stem": "為了增加護理人員的自主性，降低離職率與換班機率，下列何種排班方式較為適當？", "options": ["集權式排班", "分權式排班", "自我排班法", "週期式排班"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-63", "explanation": "自我排班法由護理人員在既定原則下自行安排班次，最能提升自主性與工作滿意度，並減少換班與離職，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 64, "stem": "衝突發生時，雙方都認為自己是對的，而不聽對方或旁觀者的意見，有關緩解衝突的原則，下列何者較不適當？", "options": ["審慎的選擇要處理的衝突問題", "評估衝突當事人", "分析衝突原因和根源", "以權力來壓制雙方的衝突"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-64", "explanation": "本題選較不適當。以權力壓制僅能暫時中止衝突，無法解決根本問題並可能加深對立，故 D 不適當。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 65, "stem": "某病房兩班制，有 40 床，占床率 80%。該單位護理人員每年每人平均休假日為 140 天，每天每床平均護理時數為 8 小時，則此病房需配置護理人員數為多少人？", "options": ["35", "43", "52", "64"], "answer": "A", "note": "考選部公告：第65題答Ａ給分（更正答案）", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-65", "explanation": "本題經考選部公告更正，答 A 給分。護理人力估算須同時考量占床率、每床每日所需護理時數、每人每年實際上班天數與每日工時，本題依公告更正後之答案為 A。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 66, "stem": "下列何者不是醫院的營運成本？", "options": ["人事成本", "利息支出", "藥品成本", "管理費用"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-66", "explanation": "利息支出屬財務（非營業）費用，並非醫院提供醫療服務所產生的營運成本，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 67, "stem": "下列那一種教學評量方式，最能評量學習者的專業實作能力？", "options": ["客觀結構式臨床測驗（OSCE）", "直接觀察操作技術（DOPS）", "臨床情境口試", "臨床情境筆試"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-67", "explanation": "DOPS 是在真實臨床情境中直接觀察學習者實際執行技術並即時回饋，最能反映其專業實作能力，故選 B。OSCE 為模擬情境的標準化測驗。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 68, "stem": "某醫院癌症中心副主任在組織架構中屬於癌症中心，但升遷、薪水發放屬於護理部。此種組織結構是屬於下列那一種？", "options": ["直線式組織結構", "幕僚式組織結構", "矩陣式組織結構", "委員會式組織結構"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-68", "explanation": "同時隸屬於功能部門（護理部）與專案／任務單位（癌症中心），形成雙重指揮系統，屬矩陣式組織結構，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 69, "stem": "下列那一項疾病不是藉由空氣傳染？", "options": ["腦膜炎", "肺結核", "水痘", "流行性感冒"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-69", "explanation": "細菌性腦膜炎主要經飛沫及直接接觸口鼻分泌物傳染，不屬於空氣（飛沫核）傳染，故選 A。肺結核、水痘與流感（含空氣微粒傳播）則需空氣傳染防護。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 70, "stem": "有關國家辦理「護理師」考試的目的，下列何者錯誤？", "options": ["證明護理從業人員的執業能力", "依法提供護理人員就業保障", "提供民眾辨識專業人員的執業資格", "利於管控護理從業人員的執業人數"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-70", "explanation": "本題選錯誤。國家考試的目的在於確保執業能力與品質、保障民眾就醫安全，而非用來管控執業人數，故 D 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 71, "stem": "您是一位應用 Y 理論管理的護理長，觀察到所屬員工都非常積極努力、自動自發、充滿創意，下列管理措施何者最適當？", "options": ["給予金錢獎勵", "進行嚴格的監督與管理", "依員工特質安排具挑戰性工作", "強化員工的安全感"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-71", "explanation": "Y 理論認為員工天性願意工作並具潛能，管理上應授權並安排具挑戰性的工作以發揮才能，故選 C。嚴格監督與強調物質誘因屬 X 理論的做法。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 72, "stem": "護病比是估算合理護理人力的指標之一，衛生福利部中央健康保險署每月要求各醫院提報全日平均護病比。某醫學中心一般內科病房 40 床，占床率約 90%，若依醫學中心最低平均護病比（1：9）估算，每天上班人力至少應排多少人？", "options": ["11", "12", "13", "14"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-72", "explanation": "實際照護病人數 ＝ 40 床 × 90% ＝ 36 人；36 ÷ 9 ＝ 4 人／班；一天三班共需 4 × 3 ＝ 12 人，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 73, "stem": "有關技術混合照護模式，下列敘述何者最適當？", "options": ["醫師和護理師合作的團隊照護模式", "由不同進階層級護理師合作搭配上班", "護理師和護理佐理員合作提供照護", "由護理師分別提供不同技術之照護模式"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-73", "explanation": "技術混合（skill mix）指依照護需求配置不同層級與職類的照護人力，如護理師與護理佐理員搭配提供照護，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 74, "stem": "有關管理方格理論（managerial grid theory）的構面，下列何者正確？", "options": ["關懷與法規", "關係與目標", "績效與酬勞", "生產與員工"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-74", "explanation": "管理方格理論以「對生產（工作）的關心」與「對員工（人員）的關心」兩個構面建構，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 75, "stem": "有關透過電腦資訊系統的護理應用可達到之效益，下列敘述何者錯誤？", "options": ["可協助監控病人床位數及病人住院天數", "可自動化記錄病患病情變化，無須探視或評估病患", "可評估病人所需的護理措施，改善護理資源的應用", "可應用電子病歷提升病歷的記錄完整性及持續性"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-75", "explanation": "本題選錯誤。資訊系統只能輔助記錄與整合資料，無法取代護理人員的親自探視與臨床評估，故 B 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 76, "stem": "根據系統理論，其運作過程的結果敘述，下列何者正確？", "options": ["輸出量提高，輸入量不變，即可提高生產力", "輸出量不變，輸入量提高，即可提高生產力", "輸出量降低，輸入量提高，即可提高生產力", "輸出量提高，輸入量降低，即可降低生產力"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-76", "explanation": "生產力 ＝ 輸出量 ÷ 輸入量。輸入不變而輸出提高，生產力即上升，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 77, "stem": "下列何激勵理論是說明工作滿意度包含激勵因子及保健因子？", "options": ["雙因子理論", "X 和 Y 理論", "滿足需求理論", "ERG（existence-relatedness-growth）理論"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-77", "explanation": "赫茲伯格（Herzberg）的雙因子理論將影響工作滿意的因素分為激勵因子與保健因子，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 78, "stem": "護理長為表示所管理的單位無弱兵，展現高的領導能力，並給予員工高的評價，此種績效考評效應為：", "options": ["近因效應", "霍桑效應", "月暈效應", "向日葵效應"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-78", "explanation": "主管為凸顯自身領導成效而普遍給予部屬偏高評價，稱為向日葵效應，故選 D。月暈效應是以單一特質推論整體表現；近因效應是受最近事件影響。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 79, "stem": "有關醫療糾紛的敘述，下列何者錯誤？", "options": ["醫療過程、方式、結果、收費或服務態度不好所導致的紛爭", "任何醫療行為均可能有風險，因此無法預防醫療糾紛的產生", "重大醫療糾紛發生後，應做根本原因分析，改正其缺失", "醫療糾紛可能來自於醫病或護病溝通不良所產生"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-79", "explanation": "本題選錯誤。醫療行為雖有風險，但透過良好溝通、告知同意、品質管理與風險管控仍可有效「預防」醫療糾紛，故 B 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基本護理學", "num": 80, "stem": "有關精實生產（lean manufacturing）的敘述，下列何者錯誤？", "options": ["是一種精簡流程", "促使員工有更多時間專注於工作", "精簡人力", "以病人需求為核心"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-2-2104-80", "explanation": "本題選錯誤。精實生產強調消除流程中的浪費、以顧客（病人）需求為核心，使人力得以投入更有價值的工作，並非以裁減人力為目的，故 C 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 1, "stem": "細胞膜的成分，下列何者錯誤？", "options": ["碳水化合物", "蛋白質", "磷脂質", "核酸"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-1", "explanation": "細胞膜以磷脂雙層為骨架，內嵌各類膜蛋白，外側並有醣脂與醣蛋白形成的醣類外衣（碳水化合物）。核酸（DNA、RNA）存在於細胞核與細胞質中，並非細胞膜的組成成分，故 D 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 2, "stem": "小腿脛骨（tibia）的外形，屬於下列何種骨骼？", "options": ["長骨", "短骨", "扁平骨", "種子骨"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-2", "explanation": "長骨的特徵是長度大於寬度、具骨幹與兩端骨骺，脛骨、股骨、肱骨、橈骨皆屬之，故選 A。短骨如腕骨、跗骨；扁平骨如顱骨、肋骨、肩胛骨；種子骨最典型者為髕骨。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 3, "stem": "下列何者藉由跟腱（Achilles tendon）附著於跟骨？", "options": ["脛前肌", "脛後肌", "腓長肌", "腓腸肌"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-3", "explanation": "腓腸肌與比目魚肌共同形成小腿三頭肌，其肌腱合併成跟腱（阿基里斯腱）止於跟骨，收縮時可使足部蹠屈，故選 D。脛前肌使足背屈，脛後肌使足內翻，腓長肌使足外翻。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 4, "stem": "下列何者同時供應小腸與大腸？", "options": ["肝總動脈", "左胃動脈", "上腸繫膜動脈", "下腸繫膜動脈"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-4", "explanation": "上腸繫膜動脈供應十二指腸下段、空腸、迴腸，以及盲腸、升結腸與橫結腸近端三分之二，因此同時涵蓋小腸與大腸，故選 C。下腸繫膜動脈只供應橫結腸遠端至直腸上段。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 5, "stem": "下列何者不通過肺門？", "options": ["胸管", "肺動脈", "肺靜脈", "主支氣管"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-5", "explanation": "肺門是肺臟內側面的凹陷處，通過的構造包含主支氣管、肺動脈、肺靜脈、支氣管動靜脈、淋巴管與神經。胸管走行於後縱膈，向上注入左鎖骨下靜脈與內頸靜脈交會處，並不經過肺門，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 6, "stem": "有關消化道肌肉層的敘述，下列何者正確？", "options": ["除口腔、咽部外，所有消化道的肌肉層皆由平滑肌構成", "除口腔、咽部外，所有消化道的肌肉層皆分為內層環向、外層縱向", "咽部主要由骨骼肌所構成", "口腔的硬腭是骨骼肌構成，而軟腭是平滑肌所構成"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-6", "explanation": "咽部負責吞嚥的隨意動作，由骨骼肌（縮咽肌群）構成，故 C 正確。食道上三分之一及肛門外括約肌同樣為骨骼肌，故 A 錯；胃的肌肉層有斜、環、縱三層，並非一律兩層，故 B 錯；硬腭是骨質構成，軟腭才是骨骼肌，故 D 錯。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 7, "stem": "脊髓的齒狀韌帶由下列何者衍生構成？", "options": ["軟脊膜", "蛛網膜", "硬脊膜", "絨毛膜"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-7", "explanation": "齒狀韌帶是由緊貼脊髓表面的軟脊膜（pia mater）向兩側延伸、穿過蛛網膜下腔後附著於硬脊膜，具有固定脊髓位置的功能，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 8, "stem": "腦下垂體細胞 HE 染色的特性與其功能的敘述，下列何者錯誤？", "options": ["嗜酸性細胞分泌促腎上腺皮質素（adrenocorticortropic hormone）", "無顆粒難染細胞（chromophobes）分泌促腎上腺皮質素（adrenocorticortropic hormone）", "嗜鹼性細胞分泌促甲狀腺素（thyroid-stimulating hormone）", "嗜鹼性細胞分泌濾泡刺激素（follicle-stimulating hormone）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-8", "explanation": "腦下垂體前葉的嗜酸性細胞分泌生長激素（GH）與泌乳素（PRL）；促腎上腺皮質素（ACTH）則由嗜鹼性細胞分泌，故 A 敘述錯誤。嗜鹼性細胞另分泌 TSH、FSH 與 LH；難染細胞一般被認為是已釋出顆粒後的細胞。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 9, "stem": "下列何者不是皮膚表皮（epidermis）的細胞層？", "options": ["基底層（stratum basale）", "棘狀層（stratum spinosum）", "顆粒層（stratum granulosum）", "網狀層（reticular layer）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-9", "explanation": "表皮由深至淺依序為基底層、棘狀層、顆粒層、透明層（僅見於厚皮）與角質層。網狀層屬於真皮（dermis）的深層構造，含大量膠原與彈性纖維，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 10, "stem": "心尖的位置約在左鎖骨中線與第幾肋間的交會處？", "options": ["第 3 肋間", "第 5 肋間", "第 7 肋間", "第 9 肋間"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-10", "explanation": "心尖朝向左前下方，其最大搏動點（PMI）位於左鎖骨中線與第五肋間的交會處，是聽診二尖瓣與測量心尖脈的標準位置，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 11, "stem": "血球的生命週期，下列何者最長？", "options": ["紅血球", "血小板", "嗜中性球", "嗜鹼性球"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-11", "explanation": "紅血球壽命約 120 天，遠長於血小板的 7～10 天與嗜中性球的數小時至數天，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 12, "stem": "睪丸主要負責產生精子，是下列那一構造？", "options": ["睪丸網（rete testis）", "直管（straight tubule）", "輸出小管（efferent ductule）", "曲細精管（seminiferous tubule）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-12", "explanation": "精子由曲細精管管壁的生殖細胞經減數分裂形成，賽氏細胞（Sertoli cell）位於管內提供支持與營養，故選 D。直管、睪丸網與輸出小管僅為精子輸送的通路。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 13, "stem": "腎小體（renal corpuscle）的過濾膜（filtration membrane），不含下列那一構造？", "options": ["腎絲球血管的內皮（glomerular endothelium）", "腎絲球的基底膜（basal membrance of glomerulus）", "鮑氏囊的壁層（parietal layer of Bowman's capsule）", "鮑氏囊的臟層（visceral layer of Bowman's capsule）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-13", "explanation": "過濾膜由三層構成：有孔的腎絲球微血管內皮、基底膜，以及鮑氏囊臟層的足細胞（podocyte）及其濾過裂隙。鮑氏囊壁層為單層扁平上皮，僅負責圍成囊腔並不參與過濾，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 14, "stem": "消化道的奧氏神經叢（Auerbach's plexus），主要位於下列何處？", "options": ["黏膜層", "黏膜下層", "肌肉層", "漿膜層"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-14", "explanation": "奧氏神經叢又稱肌間神經叢，位於肌肉層的環走肌與縱走肌之間，主要調控消化道的蠕動；位於黏膜下層的則是麥氏神經叢（Meissner's plexus），負責調節腺體分泌與局部血流，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 15, "stem": "橫結腸不具下列何種構造？", "options": ["腸脂垂", "縱走之肌肉帶", "結腸袋", "小網膜"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-15", "explanation": "大腸的特有構造為結腸帶（縱走肌肉帶）、結腸袋與腸脂垂。小網膜連接肝臟與胃小彎及十二指腸上部，與橫結腸無關（橫結腸上方連接的是大網膜），故選 D。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 16, "stem": "股神經（femoral nerve）受損，最可能發生下列何種情形？", "options": ["大腿內收功能不全", "膝反射消失", "男性陰莖皮膚感覺消失", "足無法外翻"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-16", "explanation": "股神經支配股四頭肌，是膝反射（膝跳反射）的運動路徑，受損時膝反射消失且無法伸直膝關節，故選 B。大腿內收由閉孔神經支配，陰莖感覺屬陰部神經，足外翻由腓淺神經支配。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 17, "stem": "有關骨骼肌與心肌收縮的比較，下列敘述何者正確？", "options": ["兩者都是透過橫小管來傳導動作電位", "兩者的收縮速度都很慢", "骨骼肌與心肌一樣，肌纖維長度越長，收縮時產生的張力就越大", "單一骨骼肌纖維與心肌纖維一樣，都是刺激頻率越高，產生的張力就越大"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-17", "explanation": "骨骼肌與心肌皆屬橫紋肌，都藉由橫小管（T tubule）將表面的動作電位快速傳入細胞內部以觸發鈣離子釋放，故 A 正確。兩者收縮速度並不慢；肌纖維長度與張力呈鐘形關係而非越長越大；心肌有長不反應期不會發生強直收縮，與骨骼肌可因頻率增加而張力疊加不同。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 18, "stem": "基底核（basal nuclei）功能受損或退化的症狀，下列何者最有關？", "options": ["阿茲海默症", "帕金森氏症", "失語症", "嗅覺喪失"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-18", "explanation": "帕金森氏症肇因於中腦黑質的多巴胺神經元退化，使基底核迴路失衡，出現靜止性顫抖、肌肉僵硬與運動遲緩，故選 B。阿茲海默症主要侵犯大腦皮質與海馬迴，失語症與大腦優勢半球語言區有關。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 19, "stem": "有關促進睪固酮分泌之敘述，下列何者正確？", "options": ["濾泡刺激素（FSH）直接作用於萊氏細胞（Leydig cell）", "黃體刺激素（LH）直接作用於賽氏細胞（Sertoli cell）", "促性腺素釋放激素（GnRH）間接作用於萊氏細胞（Leydig cell）", "抑制素（inhibin）間接作用於賽氏細胞（Sertoli cell）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-19", "explanation": "下視丘分泌 GnRH 刺激腦下垂體釋出 LH，LH 再作用於萊氏細胞促使其分泌睪固酮，故 GnRH 是「間接」作用於萊氏細胞，C 正確。FSH 作用的對象是賽氏細胞而非萊氏細胞，LH 則直接作用於萊氏細胞，A、B 剛好互換；抑制素由賽氏細胞分泌，回饋抑制 FSH。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 20, "stem": "當血壓升高時，頸動脈竇內的壓力接受器因應壓力變化而引發之神經衝動，會傳至何處來調節血壓的平衡？", "options": ["大腦", "中腦", "橋腦", "延腦"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-20", "explanation": "延腦是心血管中樞（含心搏抑制中樞、心搏加速中樞與血管運動中樞）所在。頸動脈竇壓力接受器經舌咽神經將訊息傳入延腦，再經迷走神經減慢心跳、降低血壓，形成壓力反射，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 21, "stem": "有關細胞膜的主要生理功能，下列何者錯誤？", "options": ["媒介細胞物質運輸", "進行訊息傳遞", "產生細胞骨架", "細胞辨識與細胞黏附"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-21", "explanation": "細胞骨架由微絲、中間絲與微管構成，是在細胞質中組裝而成，並非由細胞膜產生，故 C 錯誤。細胞膜的功能包括選擇性物質運輸、接受並傳遞訊息、細胞辨識與細胞間黏附。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 22, "stem": "下列何種細胞受損對血腦障壁（blood-brain barrier）的功能影響最大？", "options": ["微膠細胞（microglia）", "寡突細胞（oligodendrocytes）", "星狀細胞（astrocytes）", "室管膜細胞（ependymal cells）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-22", "explanation": "星狀細胞的終足包圍腦部微血管，誘導內皮細胞形成緊密連接，是構成血腦障壁的關鍵，故選 C。微膠細胞負責免疫吞噬，寡突細胞形成中樞髓鞘，室管膜細胞襯於腦室並參與腦脊髓液生成。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 23, "stem": "褪黑激素（melatonin）主要由腦部那一區域的腺體所分泌？", "options": ["下視丘（hypothalamus）", "上視丘（epithalamus）", "視丘（thalamus）", "前額葉皮質（prefrontal cortex）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-23", "explanation": "分泌褪黑激素的松果體位於間腦的上視丘，可依光線明暗調節日夜週期與睡眠節律，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 24, "stem": "下列何種激素最可能造成血管平滑肌的收縮？", "options": ["醛固酮（aldosterone）", "副甲狀腺素（PTH）", "抗利尿激素（ADH）", "多巴胺（dopamine）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-24", "explanation": "抗利尿激素又稱血管加壓素（vasopressin），除促進腎臟集尿管再吸收水分外，高濃度時可直接作用於血管平滑肌的 V1 受體引起血管收縮而升高血壓，故選 C。醛固酮作用於腎小管保鈉排鉀，屬間接影響血壓。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 25, "stem": "甲狀腺激素（thyroid hormone）合成的第一個步驟，下列過程何者正確？", "options": ["酪胺酸（tyrosine）的碘化", "甲狀腺素（T4）轉變為三碘甲狀腺素（T3）", "雙碘酪胺酸（DIT）與單碘酪胺酸（MIT）結合", "碘離子（I⁻）轉換為碘分子（I₂）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-25", "explanation": "甲狀腺濾泡細胞先將血中碘離子主動運輸入細胞，再由過氧化酶將 I⁻ 氧化成活性碘（I₂），這是合成的第一步；接著才進行甲狀腺球蛋白上酪胺酸的碘化，形成 MIT 與 DIT，最後兩兩偶合為 T3、T4，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 26, "stem": "有關排卵過程的敘述，下列何者正確？", "options": ["單一高劑量雌激素（estrogen）即可促進排卵", "濾泡刺激素（FSH）使顆粒細胞黃體化", "前列腺素（prostaglandin）減少濾泡液", "顆粒細胞分泌酵素促進濾泡膜分解"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-26", "explanation": "排卵前顆粒細胞受 LH 高峰刺激而分泌蛋白水解酶，消化濾泡壁與白膜使其破裂，卵子得以排出，故 D 正確。雌激素需持續高濃度達一定時間才觸發 LH 高峰；使顆粒細胞黃體化的是 LH 而非 FSH；前列腺素會「增加」濾泡液並促進平滑肌收縮以協助排卵。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 27, "stem": "有關體內維持酸鹼平衡的敘述，下列何者錯誤？", "options": ["腎臟近曲小管可藉由次級主動運輸分泌氫離子", "重碳酸根離子與氫離子結合後分解成二氧化碳和水", "醛固酮過量分泌會造成腎小管性酸中毒", "降低血管收縮素Ⅱ分泌會降低氫離子分泌"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-27", "explanation": "考選部公告答案為 D。其認定的理由應是：血管收縮素Ⅱ會刺激近曲小管的 Na⁺-H⁺ 逆向運輸，若把此路徑視為「促進氫離子分泌」以外的機轉，則 D 的因果敘述被判為不成立。⚠ 但請注意，選項 C「醛固酮過量分泌會造成腎小管性酸中毒」在生理學上同樣是錯的——醛固酮過量會促進氫離子與鉀離子排出，造成低血鉀與代謝性「鹼」中毒；第四型腎小管性酸中毒反而是醛固酮「不足」所致。本題爭議性高但未公告更正，作答時請記公告答案 D。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 28, "stem": "健康檢查中檢測腎功能的常用指標，下列何者正確？", "options": ["肌肝酸", "菊糖", "葡萄糖", "脂肪酸"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-28", "explanation": "肌酸酐（creatinine）由肌肉代謝穩定產生，可自由通過腎絲球且幾乎不被腎小管再吸收，臨床上以血中濃度與清除率評估腎絲球過濾率，故選 A。菊糖（inulin）雖是測量 GFR 的黃金標準，但需外源注射，不用於常規健檢。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 29, "stem": "有關表面作用劑（surfactant）敘述，下列何者錯誤？", "options": ["增加肺順應性（lung compliance）", "穩定大肺泡，預防萎縮", "減少小肺泡的表面張力（surface tension）", "深呼吸可增加表面作用劑分泌"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-29", "explanation": "依拉普拉斯定律，半徑越小的肺泡塌陷壓力越大，表面作用劑的作用正是選擇性降低「小」肺泡的表面張力，防止小肺泡塌陷並將氣體排入大肺泡，故 B 敘述錯誤。其效果可降低表面張力、提高肺順應性，深呼吸與嘆息可刺激第二型肺泡細胞增加分泌。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 30, "stem": "造成氧合解離曲線（oxygen-hemoglobin dissociation curve）向左偏移，下列何者正確？", "options": ["增加 2, 3-雙磷甘油（2, 3-diphosphoglycerate）", "增加體溫", "增加代謝", "升高 pH 值"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-30", "explanation": "pH 上升（鹼中毒）使血紅素與氧的親和力增加、氧氣不易釋放至組織，曲線左移，故選 D。反之，2,3-DPG 增加、體溫上升、代謝增加與二氧化碳增多（波爾效應）皆使曲線右移，促進氧氣釋出。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 31, "stem": "有關腸道中脂解酶（lipase）的敘述，下列何者正確？", "options": ["主要由肝臟製造分泌", "協助乳化脂肪", "使乳糜微粒（chylomicron）分解成單酸甘油酯（monoglyceride）和游離脂肪酸（free fatty acid）", "將三酸甘油酯（triglyceride）分解為單酸甘油酯和游離脂肪酸"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-31", "explanation": "胰脂解酶將食物中的三酸甘油酯水解為單酸甘油酯與游離脂肪酸，以利小腸吸收，故 D 正確。脂解酶主要由胰臟分泌而非肝臟；負責乳化脂肪的是肝臟製造的膽鹽；乳糜微粒是脂質吸收後在腸細胞內重組的運輸顆粒，並非脂解酶的受質。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 32, "stem": "下列那個物質不會出現在乳糜微粒（chylomicron）中？", "options": ["特低密度脂蛋白（very-low-density lipoprotein）", "維生素 D（vitamin D）", "磷脂質（phospholipid）", "膽固醇（cholesterol）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-32", "explanation": "乳糜微粒由三酸甘油酯、膽固醇、磷脂質、脂溶性維生素（A、D、E、K）與載脂蛋白組成。VLDL 是肝臟另外合成的獨立脂蛋白顆粒，不會存在於乳糜微粒之中，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 33, "stem": "血清素（serotonin）是屬於那一類之炎症化學介質？", "options": ["血管活性胺（vasoactive amine）", "激肽系統（kinin system）", "補體系統（complement system）", "凝血系統（clotting system）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-33", "explanation": "血清素與組織胺同屬血管活性胺，血清素主要儲存於血小板的緻密顆粒中，於發炎初期釋出造成血管擴張與通透性增加，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 34, "stem": "臨床上引起肺栓塞（pulmonary embolism）栓子（embolus）最常見的來源，下列何者正確？", "options": ["上腔靜脈", "下腔靜脈", "大隱靜脈", "下肢深部靜脈"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-34", "explanation": "超過九成的肺栓塞栓子來自下肢深部靜脈（尤其膕靜脈以上的近端深靜脈）的血栓脫落，經下腔靜脈與右心到達肺動脈，故選 D。大隱靜脈屬淺層靜脈，形成的血栓較少造成肺栓塞。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 35, "stem": "嗜伊紅性白血球增多（eosinophilic leukocytosis）之常見原因，下列何者錯誤？", "options": ["天皰瘡（pemphigus）", "氣喘", "Epstein-Barr virus 感染", "寄生蟲感染"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-35", "explanation": "EB 病毒感染引起傳染性單核球增多症，主要造成「淋巴球」增多並出現非典型淋巴球，並非嗜伊紅性白血球增多，故 C 錯誤。嗜伊紅性白血球增多常見於寄生蟲感染、過敏性疾病（氣喘、過敏性鼻炎）、藥物過敏及天皰瘡等自體免疫水疱病。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 36, "stem": "下列何者與 Epstein-Barr virus 之感染最有關？", "options": ["子宮頸癌（cervical carcinoma）", "鼻咽癌（nasopharyngeal carcinoma）", "肝癌（hepatocellular carcinoma）", "卡波西肉瘤（Kaposi sarcoma）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-36", "explanation": "EB 病毒與鼻咽癌、伯基特氏淋巴瘤及部分何杰金氏淋巴瘤密切相關，故選 B。子宮頸癌與人類乳突病毒（HPV）有關，肝癌與 B、C 型肝炎病毒有關，卡波西肉瘤則與人類疱疹病毒第 8 型（HHV-8）有關。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 37, "stem": "有關細菌內毒素之敘述，下列何者錯誤？", "options": ["是革蘭氏陽性細菌細胞壁的一種成分", "細菌死亡後釋出", "可引起發燒", "可引起急性呼吸窘迫症候群"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-37", "explanation": "內毒素即脂多醣（LPS），是革蘭氏「陰性」菌外膜的成分，故 A 錯誤。其於菌體崩解死亡後釋出，會刺激巨噬細胞大量分泌 IL-1、TNF-α 等細胞激素，引起發燒、敗血性休克、瀰漫性血管內凝血與急性呼吸窘迫症候群。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 38, "stem": "下列何種病灶的顯微變化與微血管性血管瘤相似，有大量的微血管增生？", "options": ["化膿性肉芽腫（pyogenic granuloma）", "囊性水瘤（cystic hygroma）", "血管球瘤（glomus tumor）", "蜘蛛網血管擴張症（spider telangiectasia）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-38", "explanation": "化膿性肉芽腫實為微血管瘤的一型（分葉狀微血管瘤），顯微鏡下可見大量增生的微血管，常見於牙齦、皮膚外傷或孕婦口腔，故選 A。囊性水瘤源自淋巴管，血管球瘤源自血管球體的平滑肌細胞，蜘蛛網血管擴張症則為既有血管的擴張而非增生。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 39, "stem": "胎兒紅血球母細胞症（erythroblastosis fetalis）的主要病因為何？", "options": ["母親的血紅素球蛋白 β 鏈異常", "母親與胎兒血型不合", "母親的紅血球細胞膜異常", "母親葉酸缺乏"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-39", "explanation": "胎兒紅血球母細胞症即新生兒溶血症，最典型為 Rh 陰性母親懷有 Rh 陽性胎兒，母體產生的抗 D 抗體經胎盤破壞胎兒紅血球，造成溶血、貧血與核黃疸，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 40, "stem": "梅克爾氏憩室（Meckel diverticulum）最常見的異位組織，下列何者正確？", "options": ["肝組織", "胃黏膜", "脾組織", "唾液腺"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-40", "explanation": "梅克爾氏憩室是卵黃管殘留形成的真性憩室，最常見的異位組織為胃黏膜，其分泌的胃酸會侵蝕鄰近迴腸黏膜而造成潰瘍與無痛性下消化道出血，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 41, "stem": "鏈球菌感染後腎絲球腎炎（post-streptococcal glomerulonephritis）之主要臨床表現，下列何者錯誤？", "options": ["血尿（hematuria）", "氮血症（azotemia）", "高血壓", "大量蛋白尿"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-41", "explanation": "鏈球菌感染後腎絲球腎炎屬「腎炎症候群」，典型表現為血尿（可樂色尿）、輕至中度蛋白尿、水腫、高血壓與氮血症。大量蛋白尿（每日超過 3.5 公克）是「腎病症候群」的特徵，故 D 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 42, "stem": "25 歲女性，因下腹部不適就醫，經醫師檢查後確定為良性卵巢腫瘤。下列何者的可能性最高？", "options": ["卵黃囊腫瘤（yolk sac tumor）", "成熟畸胎瘤（mature teratoma）", "顆粒細胞腫瘤（granulosa cell tumor）", "克魯肯氏腫瘤（Krukenberg tumor）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-42", "explanation": "成熟畸胎瘤（皮樣囊腫）是育齡女性最常見的良性卵巢腫瘤，內含毛髮、皮脂、牙齒等三胚層分化的成熟組織，故選 B。卵黃囊腫瘤為惡性生殖細胞瘤，克魯肯氏腫瘤是胃腸道癌轉移至卵巢的惡性病灶，顆粒細胞瘤則具低度惡性潛能。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 43, "stem": "5 歲小男孩，出現腦壓增加、步履不穩的症狀，腦部電腦斷層掃描發現小腦中間有一生長迅速的腫瘤，下列何者是最可能的診斷？", "options": ["髓芽母細胞瘤（medulloblastoma）", "室管膜瘤（ependymoma）", "星狀細胞瘤（astrocytoma）", "寡突膠細胞瘤（oligodendroglioma）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-43", "explanation": "髓芽母細胞瘤好發於兒童，典型位置在小腦蚓部（中線），生長迅速並易阻塞第四腦室造成顱內壓升高與步態不穩，故選 A。小兒星狀細胞瘤多位於小腦半球且生長緩慢，寡突膠細胞瘤多見於成人大腦。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 44, "stem": "關於良性（benign）腫瘤的敘述，下列何者最不適當？", "options": ["腫瘤多半界限明顯，常有纖維性包膜（fibrous capsule）將腫瘤局限於一處", "較少見壞死（necrosis）或出血（hemorrhage）", "常見細胞多形性（pleomorphism）", "核質比（nuclear-to-cytoplasmic ratio）偏向正常"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-44", "explanation": "細胞多形性（大小形狀不一）是惡性腫瘤細胞退分化的特徵，良性腫瘤細胞形態一致且分化良好，故 C 最不適當。良性腫瘤生長緩慢、界限清楚常具包膜、血液供應足夠故少見壞死出血，核質比接近正常。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 45, "stem": "顯微鏡下，肺腫瘤細胞的細胞質少且呈圓形或橢圓形，具有神經內分泌的特性，是下列那一種肺腫瘤？", "options": ["腺癌（adenocarcinoma）", "鱗狀細胞癌（squamous cell carcinoma）", "小細胞癌（small cell carcinoma）", "大細胞未分化癌（large cell undifferentiated carcinoma）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-45", "explanation": "小細胞肺癌源自支氣管黏膜的神經內分泌細胞，顯微鏡下細胞小、細胞質稀少、核染色深呈燕麥狀，並常分泌激素造成腫瘤伴生症候群（如 ADH 或 ACTH 過量），故選 C。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 46, "stem": "關於發生於胃的黏膜相關淋巴組織淋巴瘤（mucosa-associated lymphoid tissue lymphoma, MALToma）之敘述，下列何者錯誤？", "options": ["與慢性胃炎（chronic gastritis）有關", "可以經由消除幽門螺旋桿菌來治療，屬於低惡性度淋巴瘤", "屬於 T 細胞淋巴瘤（T-cell lymphoma）", "顯微鏡下可見淋巴上皮病灶（lymphoepithelial lesions）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-46", "explanation": "胃部 MALToma 源自黏膜相關淋巴組織中的 B 淋巴細胞，屬「B 細胞」淋巴瘤，故 C 錯誤。其與幽門螺旋桿菌造成的慢性胃炎密切相關，早期僅以根除幽門桿菌即可使腫瘤消退，顯微鏡下的特徵為淋巴上皮病灶。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 47, "stem": "關於腎臟囊腫疾病（cystic disease of the kidney），下列何者錯誤？", "options": ["單純性囊腫（simple cyst）一般為臨床上無害的變異", "成人多囊性腎病（adult polycystic kidney disease）典型為雙側腎臟囊腫，且伴隨肝臟囊腫", "兒童多囊性腎病（childhood polycystic kidney disease）遺傳上多為體染色體顯性（autosomal dominant）", "成人多囊性腎病有許多病例與 PKD1 基因缺陷有關"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-47", "explanation": "兒童型多囊性腎病為體染色體「隱性」遺傳（ARPKD），與 PKHD1 基因缺陷有關，病情嚴重且常合併肝纖維化，故 C 錯誤。成人型為體染色體顯性遺傳，約八成五與 PKD1 基因缺陷有關，常見雙側腎囊腫並伴隨肝囊腫。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 48, "stem": "下列那一種關節炎是好發於年輕男性的薦腸骨關節及 HLA-B27 呈陽性？", "options": ["黏連性脊椎關節炎（ankylosing spondyloarthritis）", "類風濕性關節炎（rheumatoid arthritis）", "退化性關節炎（degenerative arthritis）", "痛風性關節炎（gouty arthritis）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-48", "explanation": "僵直性脊椎炎好發於 20～40 歲男性，最早侵犯薦腸關節並逐漸向上蔓延造成脊椎竹節樣變化，逾九成病人 HLA-B27 陽性，故選 A。類風濕性關節炎與 HLA-DR4 相關且好發於女性的小關節。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 49, "stem": "治療青光眼的藥物中，下列何者是藉由直接作用於膽鹼性受體（cholinergic receptor）而降低眼壓？", "options": ["Atropine", "Echothiophate", "Pilocarpine", "Timolol"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-49", "explanation": "Pilocarpine 為蕈毒鹼受體的直接致效劑，可使瞳孔括約肌與睫狀肌收縮、瞳孔縮小並拉開小樑網，促進房水排出而降低眼壓，故選 C。Echothiophate 是抑制乙醯膽鹼酯酶的「間接」作用藥；Timolol 為乙型阻斷劑；Atropine 屬抗膽鹼藥，反而會誘發青光眼發作。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 50, "stem": "Cabamazepine 主要作用於下列何種離子通道（ion channel），而用於 partial seizure 之治療？", "options": ["鈣", "氯", "鉀", "鈉"], "answer": "D", "subjectC
