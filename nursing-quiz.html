<style>
:root{
  --bg:#F3EFE7; --bg2:#E7E1D6; --card:#FCFAF5; --card2:#F1ECE2;
  --ink:#45423C; --ink2:#6B655C; --muted:#948C81; --line:#E5DED2;
  --accent:#8497A0; --accent-ink:#3B4A50;
  --ok:#7E9A82; --ok-bg:#E7EDE4; --ok-ink:#3E5642;
  --no:#BC8A82; --no-bg:#F2E5E2; --no-ink:#7A413B;
  --star:#C9A75C; --star-bg:#F3EAD5; --star-ink:#7E6222;
  --s1:#8AA0A8; --s2:#9FAC8C; --s3:#B29CA6; --s4:#C4A88E; --s5:#9BA0B6;
  --radius:16px; --radius-s:11px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  font-size:21px; line-height:1.7; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.topbar{padding:calc(var(--safe-t) + 16px) 20px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-size:30px;font-weight:750;letter-spacing:.5px;line-height:1.25}
.brand small{display:block;font-size:15px;font-weight:500;letter-spacing:2px;color:var(--muted);margin-top:2px}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 124px}
.eyebrow{font-size:13px;letter-spacing:3px;color:var(--muted);font-weight:600;text-transform:uppercase;margin:20px 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.stat-row{display:flex;gap:10px;margin-bottom:4px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:14px 12px;text-align:center}
.stat .n{font-size:30.5px;font-weight:750;line-height:1;letter-spacing:-.5px}
.stat .l{font-size:13px;color:var(--muted);margin-top:6px;letter-spacing:1px}
.progress{height:7px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:10px}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s cubic-bezier(.3,.7,.3,1)}
.exam-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:16px 0 0;padding:16px 16px 14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--radius);transition:background .2s,border-radius .2s}
.exam-head:active{background:var(--card2)}
.exam-head.open{background:var(--card2);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.exam-head .exam-main{flex:1;min-width:0;display:block}
.exam-head .exam-title{display:block;font-size:23px;font-weight:750;letter-spacing:.5px;color:var(--accent-ink)}
.exam-head .exam-title span{margin-left:9px;font-size:17px;font-weight:600;color:var(--ink2);letter-spacing:1px}
.exam-head .exam-meta{display:block;font-size:14px;color:var(--muted);margin-top:4px;font-weight:600}
.exam-head .progress{margin-top:9px}
.exam-head .exam-arrow{flex:none;width:26px;height:26px;color:var(--muted);transition:transform .25s}
.exam-head.open .exam-arrow{transform:rotate(180deg);color:var(--accent-ink)}
.exam-body{border:1px solid var(--line);border-top:none;border-left:5px solid var(--accent);border-radius:0 0 var(--radius) var(--radius);padding:12px 12px 3px;margin-bottom:4px;animation:fade .22s ease}
.exam-body .subj{margin-bottom:9px}
.subj{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;transition:transform .12s,background .2s}
.subj:active{transform:scale(.985);background:var(--card2)}
.subj .dot{width:12px;height:36px;border-radius:6px;flex:none}
.subj .mid{flex:1;min-width:0}
.subj .name{font-weight:650;font-size:21px}
.subj .sub{font-size:14px;color:var(--muted);margin-top:3px;display:flex;gap:10px}
.subj .rate{font-size:23.5px;font-weight:750;color:var(--accent-ink);min-width:52px;text-align:right}
.subj .rate span{font-size:13px;color:var(--muted);font-weight:500}
.mini-prog{height:5px;border-radius:5px;background:var(--bg2);overflow:hidden;margin-top:8px}
.mini-prog > i{display:block;height:100%;border-radius:5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;font-size:21px;font-weight:700;background:var(--accent);color:#fff;letter-spacing:1px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:11px;font-size:16.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 17px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:19.5px;color:var(--ink2);font-weight:600;transition:.15s}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:active{transform:scale(.96)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:13px 16px;margin-top:10px}
.toggle-row .tl{font-size:17.5px;font-weight:600}
.toggle-row .td{font-size:14px;color:var(--muted);margin-top:2px}
.sw{width:50px;height:29px;border-radius:16px;background:var(--bg2);position:relative;transition:.2s;flex:none}
.sw.on{background:var(--accent)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on::after{left:24px}
/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 12px}
.qtag{font-size:16.5px;font-weight:650;padding:6px 13px;border-radius:20px;color:#fff;letter-spacing:.5px;flex:none}
.qhr{display:flex;align-items:center;gap:10px}
.clock{font-size:19px;font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);padding:5px 11px;border-radius:20px}
.qcount{font-size:17.5px;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.starbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1.5px solid var(--line);font-size:23.5px;color:var(--muted);flex:none;transition:.15s}
.starbtn.on{background:var(--star-bg);border-color:var(--star);color:var(--star)}
.starbtn:active{transform:scale(.9)}
.qbar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin:0 2px 18px}
.qbar > i{display:block;height:100%;background:var(--accent);transition:width .4s}
.stem{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px;font-size:23.5px;line-height:1.85;margin-bottom:8px;font-weight:500}
.stem .qno{color:var(--muted);font-weight:700;margin-right:8px;font-size:21px}
.opts{margin-top:6px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-s);padding:16px 16px;margin-bottom:11px;font-size:21px;line-height:1.7;transition:transform .1s,border-color .2s,background .2s}
.opt:active{transform:scale(.99)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg2);color:var(--ink2);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.2s}
.opt .t{flex:1;padding-top:1px}
.opt.picked{border-color:var(--accent)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.correct .t{color:var(--ok-ink)}
.opt.wrong{background:var(--no-bg);border-color:var(--no)}
.opt.wrong .k{background:var(--no);color:#fff}
.opt.wrong .t{color:var(--no-ink)}
.opt.locked{pointer-events:none}
.verdict{display:flex;align-items:center;gap:10px;padding:15px 18px;border-radius:var(--radius-s);font-weight:650;font-size:21px;margin:4px 0 11px}
.verdict.ok{background:var(--ok-bg);color:var(--ok-ink)}
.verdict.no{background:var(--no-bg);color:var(--no-ink)}
.verdict .big{font-size:26px}
.note{background:var(--card2);border-left:3px solid var(--s4);border-radius:8px;padding:13px 16px;font-size:19.5px;line-height:1.75;color:var(--ink2);margin-bottom:11px}
.expl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:var(--radius-s);background:var(--card);border:2px dashed var(--accent);color:var(--accent-ink);font-weight:700;font-size:21px;margin-bottom:11px}
.expl{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 18px;font-size:23.5px;line-height:1.95;color:var(--ink);margin-bottom:11px;animation:fade .25s ease}
.expl .eh{font-size:16.5px;letter-spacing:2px;color:var(--accent-ink);font-weight:700;margin-bottom:8px}
.expl.pending{color:var(--muted);border-left-color:var(--muted);font-style:normal}
.qfoot{position:sticky;bottom:0;padding:8px 0 calc(var(--safe-b) + 8px);background:linear-gradient(180deg,transparent,var(--bg) 32%)}
/* floating buttons */
.fabs{position:fixed;right:18px;bottom:calc(var(--safe-b) + 74px);display:flex;flex-direction:column;gap:10px;z-index:25}
.fab{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(132,151,160,.92);color:#fff;box-shadow:0 4px 14px rgba(90,100,105,.32);backdrop-filter:blur(3px);transition:transform .12s}
.fab:active{transform:scale(.9)}
.fab.mini{width:44px;height:44px;background:rgba(252,250,245,.92);color:var(--accent-ink);border:1.5px solid var(--line)}
.fab svg{width:24px;height:24px}
.fab.mini svg{width:20px;height:20px}
/* jump modal */
.mask{position:fixed;inset:0;background:rgba(60,56,50,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 18px calc(var(--safe-b) + 20px);max-height:76vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.8,.3,1)}
.sheet h3{margin:4px 2px 4px;font-size:19px}
.sheet .hint{font-size:14px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gcell{aspect-ratio:1;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-size:16.5px;font-weight:650;color:var(--ink2);display:flex;align-items:center;justify-content:center;position:relative}
.gcell.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.gcell.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink)}
.gcell.no{background:var(--no-bg);border-color:var(--no);color:var(--no-ink)}
.gcell .st{position:absolute;top:-4px;right:-3px;font-size:13px;color:var(--star)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:14px 2px 4px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:30}
.nav button{flex:1;padding:12px 0 11px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:17px;font-weight:600;letter-spacing:.5px;position:relative}
.nav button.on{color:var(--accent-ink)}
.nav .ic{width:32px;height:32px}
.nav .badge{position:absolute;top:6px;left:50%;transform:translateX(6px);background:var(--no);color:#fff;font-size:12px;font-weight:700;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.empty{text-align:center;color:var(--muted);padding:60px 30px}
.empty .em{font-size:47px;margin-bottom:12px;opacity:.5}
.section-title{font-size:19px;font-weight:700;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
.tiny{font-size:14px;color:var(--muted)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:4px 0 14px}
.seg button{flex:1;padding:11px;border-radius:9px;font-size:19.5px;font-weight:650;color:var(--ink2);transition:.15s}
.seg button.on{background:var(--card);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.rev-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:13px 15px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.rev-item .body{flex:1;text-align:left}
.rev-item .wq{font-size:19.5px;line-height:1.6;font-weight:500}
.rev-item .wmeta{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge-s{font-size:12px;color:#fff;padding:2px 8px;border-radius:10px;font-weight:600}
.xstar{flex:none;font-size:21px;color:var(--star);padding:2px 4px}
.bars .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.bars .bar-name{width:64px;font-size:15px;color:var(--ink2);font-weight:600;flex:none}
.bars .bar-track{flex:1;height:20px;background:var(--bg2);border-radius:10px;overflow:hidden;position:relative}
.bars .bar-fill{height:100%;border-radius:10px;transition:width .6s}
.bars .bar-val{position:absolute;right:8px;top:0;line-height:20px;font-size:13px;font-weight:700;color:var(--ink2)}
.link{color:var(--accent-ink);font-weight:600;text-decoration:underline;font-size:15.5px}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">護理師國考刷題<small>NURSING LICENSURE</small></div>
  </div>
  <div class="screen" id="screen"></div>
  <div class="nav" id="nav"></div>
</div>

<script>
const BANK = [{"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 1, "stem": "有關重積性癲癇的敘述，下列何者正確？", "options": ["最常見的原因是強光刺激，死亡率約 5～20%", "定義是指持續發作 60 分鐘以上或 2 次發作之間意識沒有恢復", "確認病人安全後，應立即建立呼吸道通暢並給予氧氣為最優先的措施", "病人抽搐時，要按壓病人並試圖喚醒病人"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-1", "explanation": "重積性癲癇處置以維持呼吸道通暢、給氧為最優先（ABC 原則），故 C 正確。定義為單次發作持續 ≥5 分鐘（舊定義 30 分鐘）或反覆發作間意識未恢復，非 60 分鐘；最常見誘因是突然停用抗癲癇藥物而非強光；發作時不可強壓或搖醒病人，以免受傷。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 2, "stem": "多發性硬化症（multiple sclerosis; MS）使用 Cyclophosphamide 藥物治療之最主要目的，下列何者正確？", "options": ["抑制中樞神經", "抑制免疫反應", "抑制頻尿反應", "抑制炎症反應"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-2", "explanation": "Cyclophosphamide 為烷化劑類免疫抑制劑，用於多發性硬化症的主要目的是抑制過度活化的自體免疫反應以減緩神經去髓鞘，故選 B。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 3, "stem": "下列何者為重症肌無力病人最早受到影響的肌肉？", "options": ["眼肌", "咽喉肌", "呼吸肌", "膀胱逼尿肌"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-3", "explanation": "重症肌無力最早受侵犯的是眼外肌，表現為眼瞼下垂與複視，故選 A；病程進展才可能影響咽喉肌、呼吸肌。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 4, "stem": "因車禍造成左側胸椎第 6 節受傷的病人，出現脊髓半側截斷症候群，下列敘述何者正確？", "options": ["左側胸椎第 6 節以下的疼痛及溫度感消失", "左側胸椎第 6 節以下的運動功能及震動感消失", "左側胸椎第 6 節以下的輕觸覺消失", "右側胸椎第 6 節以下的深觸覺消失"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-4", "explanation": "脊髓半側截斷（Brown-Séquard）為同側運動、本體感覺與震動感喪失（皮質脊髓束＋後索），對側則為痛覺與溫度覺喪失（脊視丘束）。左側受傷 → 左側（同側）運動與震動感消失，故選 B；痛溫覺喪失應在對側（右側），故 A 錯。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 5, "stem": "會影響吞嚥動作之腦神經，下列何者正確？①CN III ②CN VII ③CN IX ④CN X ⑤CN XI", "options": ["①②③", "①④⑤", "②③④", "③④⑤"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-5", "explanation": "吞嚥動作主要由 CN VII（顏面）、CN IX（舌咽）、CN X（迷走）參與，對應②③④，故選 C。CN III 為動眼、CN XI 為副神經，與吞嚥無關。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 6, "stem": "協助昏迷病人由側臥翻成平躺時，須注意下列那一個部位是否有壓傷形成？", "options": ["枕骨", "尾椎骨", "足跟", "踝部"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-6", "explanation": "側臥時外踝（踝部）為主要受壓點，翻回平躺後應檢查此處是否已形成壓傷，故選 D；枕骨、尾椎、足跟則是平躺姿勢的受壓點。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 7, "stem": "有關不同類型腦血管意外的敘述，下列何者正確？", "options": ["血栓型，在發病前會有先驅症狀", "栓塞型，常因高血壓所導致", "出血型，腦脊髓液是清澈的", "出血型，進展多數呈漸進式且與活動有關"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-7", "explanation": "血栓型腦中風發作前常有暫時性腦缺血等先驅症狀，故 A 正確。栓塞型多源於心臟（如心房顫動）而非高血壓；出血型腦脊髓液呈血性而非清澈，且發作突然、常於活動時發生而非漸進，故 B、C、D 皆錯。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 8, "stem": "有關癲癇病人服用藥物的敘述，下列何者正確？", "options": ["發作後或覺得快發作時服用藥物，特別有效", "服用 acetazolamide（Diamox），常有夜盲的困擾", "服用 primidone（Mysoline），可能會出現嗜睡的困擾", "合併多種低劑量的抗癲癇藥物的治療效果較佳"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-8", "explanation": "primidone（Mysoline）常見副作用為嗜睡，故 C 正確。抗癲癇藥須規律服用而非發作時才吃；治療原則以單一藥物為優先而非多種併用。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 9, "stem": "有關吸收不良症候群的臨床表徵，下列何者正確？", "options": ["脂肪吸收不良容易出現肌肉無力", "碳水化合物吸收不良容易出現水腫", "蛋白質吸收不良容易出現體重下降", "維生素 B12 吸收不良容易出現口腔潰瘍"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-9", "explanation": "蛋白質吸收不良會導致體重下降與低白蛋白（水腫），故 C 正確。脂肪吸收不良表現為脂肪便與脂溶性維生素缺乏；維生素 B12 缺乏主要造成惡性貧血與神經症狀。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 10, "stem": "有關各種肝硬化的臨床表徵，下列何者錯誤？", "options": ["壞死後肝硬化會出現黃疸", "膽源性肝硬化會出現脂肪便", "酒精性肝硬化會出現全身搔癢", "心因性肝硬化會出現肝臟腫大"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-10", "explanation": "本題選「錯誤」敘述。全身搔癢是膽源性（膽汁滯留）肝硬化的典型表徵，並非酒精性肝硬化，故 C 為錯誤敘述、即為答案。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 11, "stem": "有關肝性腦病變之醫護處置，下列何者正確？", "options": ["教導病人維持排便通暢", "需採取高熱量高蛋白質飲食", "服用鎮靜安眠藥以維持良好的睡眠狀況", "使用 Lactulose 抑制細菌生長以減少產生大量的氨"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-11", "explanation": "肝性腦病變應維持排便通暢以減少腸道氨的吸收，故 A 正確。飲食須「限制」蛋白質而非高蛋白；應避免鎮靜安眠藥（會誘發或加重腦病變）；Lactulose 主要是酸化腸道、將氨轉為銨並促進排出，而非單純抑制細菌。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 12, "stem": "有關口腔癌的敘述，下列何者正確？", "options": ["早期症狀為口腔內有疼痛且不易癒合的潰瘍", "細胞學上以腺癌最常見", "術後優先護理措施是維持呼吸道通暢", "最常發生的部位為口腔底部"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-12", "explanation": "口腔癌術後首要護理是維持呼吸道通暢，故 C 正確。組織學上以鱗狀細胞癌最常見（非腺癌）；早期潰瘍多為無痛、久不癒合；最常見部位為舌（側緣）而非口腔底部。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 13, "stem": "有關食道弛緩不能（Esophageal achalasia）的敘述，下列何者正確？", "options": ["好發於食道上 1/3 處", "不會引發潰瘍性食道炎", "晚期才會出現吞嚥困難症狀", "症狀會隨著情緒壓力而加劇"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-13", "explanation": "食道弛緩不能的症狀會隨情緒壓力加劇，故 D 正確。病灶在下食道括約肌（非上 1/3）；食物滯留可引發食道炎；吞嚥困難為早期主要症狀，對固體與液體皆然。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 14, "stem": "下列何者不是結腸癌的典型臨床表徵？", "options": ["解便習慣改變", "灰色便", "裡急後重", "腹脹"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-14", "explanation": "本題選「非典型」表徵。灰白（陶土）便為膽道阻塞的表現，並非結腸癌典型症狀，故選 B。結腸癌典型表現為排便習慣改變、裡急後重、腹脹與血便。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 15, "stem": "有關急性胰臟炎之相關檢驗項目的結果，下列何者正確？", "options": ["血清鈣上升", "血清澱粉酶上升", "血清脂肪酶下降", "血清葡萄糖下降"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-15", "explanation": "急性胰臟炎時血清澱粉酶上升，故 B 正確。脂肪酶同樣上升（非下降）；血鈣因脂肪皂化而下降（非上升）；常合併高血糖（非下降）。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 16, "stem": "有關膽道疾病手術後放置 T 型管的護理措施，下列何者錯誤？", "options": ["引流液顏色應為棕綠色", "引流液的量應會逐漸減少", "每日需定時執行 T 型管沖洗", "活動時，引流袋位置宜低於腰部以下"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-16", "explanation": "本題選錯誤。T 型管不做每日常規沖洗，以免膽道壓力升高與感染；引流液正常呈棕綠色、量會逐漸減少，引流袋須低於腰部避免逆流，故 C 為錯誤措施。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 17, "stem": "有關胃食道逆流的居家照護注意事項，下列何者錯誤？", "options": ["避免進行腹內壓升高的活動", "需戒菸、酒及咖啡", "避免高油脂及高熱量食物", "進食後需立即平躺"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-17", "explanation": "本題選錯誤。胃食道逆流病人進食後應維持直立、勿立即平躺，以免逆流，故 D 錯誤。其餘（避免腹壓升高、戒菸酒咖啡、少油少熱量）皆正確。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 18, "stem": "下列何者是罹患骨質疏鬆症風險最低的情況？", "options": ["67 歲女性，其最後一次月經期為 15 年前", "45 歲男性，過去 6 個月一直服用腎上腺皮質醇治療劑", "30 歲男性，偶爾飲酒，身體質量指數（BMI）為 28", "35 歲女性，有癲癇病史，並定期服用 Dilantin"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-18", "explanation": "骨質疏鬆風險最低者為 C：30 歲、男性、BMI 偏高（負重多、骨密度較佳）。A 停經多年、B 長期類固醇、D 長期使用 Dilantin（影響維生素 D）皆為高風險。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 19, "stem": "下列何者為骨性關節炎的臨床表徵？", "options": ["Heberden’s 結節", "發燒", "尺側偏斜", "Felty’s 症候群"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-19", "explanation": "骨性關節炎特徵為遠端指間關節的 Heberden's 結節，故選 A。發燒、尺側偏斜、Felty's 症候群屬類風濕性關節炎。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 20, "stem": "下列何者為骨髓炎病人的常見用藥？", "options": ["利尿劑及鈣離子阻斷劑", "抗生素及解熱鎮痛劑", "骨骼肌肉鬆弛劑及皮質類固醇", "抗組織胺及軟便劑"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-20", "explanation": "骨髓炎為細菌感染，常用抗生素治療並以解熱鎮痛劑緩解症狀，故選 B。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 21, "stem": "下列何者為費林氏測驗（Phalen’s test）陽性反應的描述？", "options": ["雙手維持手腕掌側屈曲、手背相對 60 秒，手指感到麻木", "敲擊正中神經，手指感到刺痛、麻木感", "緊握足踝做內旋，再慢慢伸直，無法伸直膝關節", "手握腳底做內外旋動作，聽到關節內有聲響"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-21", "explanation": "Phalen's test：雙腕掌屈、手背相對約 60 秒後手指麻木為陽性，提示腕隧道症候群，故選 A。敲擊正中神經引發刺麻為 Tinel's 徵象。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 22, "stem": "為了避免白內障手術病人植入之水晶體移位，返家後活動限制的護理指導，下列何者錯誤？", "options": ["不可提重物", "不可彎腰", "不可咳嗽", "不可深呼吸"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-22", "explanation": "本題選錯誤。白內障術後為避免人工水晶體移位，須避免提重物、彎腰、咳嗽用力等升高眼壓的動作；深呼吸並不會升高眼壓，故「不可深呼吸」為錯誤指導，選 D。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 23, "stem": "關於糖尿病性酮酸中毒（DKA）的敘述，下列何者正確？", "options": ["屬於原發性呼吸性酸中毒", "易發生在第 1 型糖尿病病人身上", "昏迷前常出現陳施氏呼吸", "急性期需及時補充葡萄糖來緩解症狀"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-23", "explanation": "DKA 好發於第 1 型糖尿病，故選 B。它屬代謝性酸中毒（非呼吸性）；典型為庫斯毛耳氏深快呼吸（非陳施氏）；急性期先給胰島素與輸液，而非補充葡萄糖。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 24, "stem": "因呼吸衰竭而血中二氧化碳分壓（PaCO2）過高時，下列症狀何者最可能立即危及生命？", "options": ["病人變得嗜睡導致 PaCO2 提高", "病人周邊血氧飽和濃度（SpO2）為 90%", "病人主訴全身虛弱", "病人的血壓偏高 160/90 mmHg"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-24", "explanation": "PaCO2 過高時，最危及生命的是 A：二氧化碳蓄積造成嗜睡（CO2 麻醉）→ 通氣更下降 → PaCO2 再升高，形成惡性循環，可致呼吸停止。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 25, "stem": "有關急性中耳炎之敘述，下列何者正確？", "options": ["外耳道會有過多的耳垢", "鼓膜可能出現發亮的珍珠灰色", "嚴重時，將導致傳導性聽力喪失", "持續服用抗生素至發燒症狀緩解"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-25", "explanation": "急性中耳炎嚴重時可致傳導性聽力喪失，故選 C。耳垢過多非其特徵；珍珠灰亮澤是正常鼓膜（中耳炎時鼓膜紅腫）；抗生素須服完整療程而非退燒即停。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 26, "stem": "有關心肌病變（cardiomyopathy）的敘述，下列何者正確？", "options": ["擴張性心肌病變（dilated cardiomyopathy）最常見於心肌炎病人", "肥厚性心肌病變（hypertrophic cardiomyopathy）多數與家族遺傳無關", "心肌病變病人心輸出量增加，不需限制水分攝取", "限制性心肌病變（restricted cardiomyopathy）最為常見"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-26", "explanation": "擴張性心肌病變最常見且與心肌炎相關，故選 A。肥厚性心肌病變多與家族遺傳有關；心肌病變心輸出量下降須限水；限制型最少見。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 27, "stem": "有關高血壓病人的飲食原則，下列何者不適當？", "options": ["鼓勵高鈣與高鈉飲食", "鼓勵攝取高纖飲食", "避免含咖啡因飲料", "避免高油炸食物"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-27", "explanation": "本題選不適當。高血壓飲食應「限鈉」，鼓勵高鈉並不適當，故選 A。高纖、避免咖啡因與油炸則正確。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 28, "stem": "下列何者最可能為腹主動脈瘤病人的病史或身體檢查與評估的結果？", "options": ["出現腹部腫塊與血壓上升等現象", "聽診腹部，會聽到舒張期血管嘈音", "主訴腹部有心跳搏動感", "當疼痛轉移至下背部，表示症狀緩解"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-28", "explanation": "腹主動脈瘤病人常主訴腹部有搏動感，故選 C。血壓未必上升；聽診為收縮期血管雜音（非舒張期）；疼痛轉移至下背部反而提示擴大或破裂而非緩解。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 29, "stem": "有關長時間靜脈注射抗生素引發靜脈炎的護理措施，下列何者錯誤？", "options": ["抬高患肢", "鼓勵活動", "立即拔除靜脈導管", "給予局部溫敷"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-29", "explanation": "本題選錯誤。靜脈炎應抬高患肢、拔除導管、局部溫敷並「休息」，鼓勵活動並不適當，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 30, "stem": "預防靜脈曲張的護理指導，下列何者最適當？①避免外傷 ②下肢不宜抬高 ③不需特別控制體重 ④應規律運動", "options": ["①③", "①④", "②③", "②④"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-30", "explanation": "預防靜脈曲張應①避免外傷、④規律運動，故選 B（①④）。下肢應適度抬高、仍需控制體重，故②③錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 31, "stem": "急性心肌梗塞的診斷檢查，下列何者最具專一性？", "options": ["心肌鈣蛋白 I（cardiac troponin I）", "鉈-201 掃描（Tl-201）", "肌紅素（myoglobin）", "心電圖"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-31", "explanation": "急性心肌梗塞最具專一性的診斷指標為心肌鈣蛋白 I，故選 A。肌紅素敏感但不專一，心電圖為輔助。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 32, "stem": "有關心臟血管系統的診斷檢查結果，下列敘述何者正確？", "options": ["十二導程心電圖 II, III 及 aVF 出現 ST 上升，顯示心室前壁心肌梗塞", "B 型排鈉利尿胜肽（BNP）＞100pg/mL，表示心臟衰竭", "肺動脈楔壓過高，代表主動脈阻力過高", "高密度脂蛋白（HDL）偏高，容易罹患冠狀動脈疾病"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-32", "explanation": "BNP＞100 pg/mL 提示心臟衰竭，故選 B。II、III、aVF 之 ST 上升為「下壁」梗塞；肺動脈楔壓反映左心充填壓；HDL 偏高具保護性。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 33, "stem": "有關心臟循環動力學的敘述，下列何者錯誤？", "options": ["心輸出量（cardiac output）＝心搏出量（stroke volume）×每分鐘心跳次數", "心跳次數 200 次／每分鐘之心輸出量＞心跳次數 80 次／每分鐘之心輸出量", "中心靜脈導管測量的是右心房之壓力", "平均動脈壓＝1/3 收縮壓＋2/3 舒張壓"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-33", "explanation": "本題選錯誤。心跳過快（如 200 次/分）會縮短舒張充填、降低心搏出量，使心輸出量反而下降，故 B 敘述錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 34, "stem": "決定心搏出量（stroke volume）的要素，下列何者錯誤？", "options": ["前負荷", "後負荷", "心收縮力", "心跳速率"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-34", "explanation": "心搏出量取決於前負荷、後負荷與心收縮力；心跳速率影響的是心輸出量而非心搏出量本身，故「心跳速率」為錯誤選項，選 D。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 35, "stem": "有關貧血病因的敘述，下列何者正確？", "options": ["海洋性貧血，因造血骨髓被破壞或功能受到抑制", "鐮狀細胞貧血，因血小板被破壞所致", "再生不良性貧血，因骨髓被破壞或功能受到抑制", "缺鐵性貧血，因血紅素的結構異常所致"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-35", "explanation": "再生不良性貧血因骨髓被破壞或功能受抑制，故選 C。海洋性貧血與缺鐵性貧血屬血紅素合成/結構問題；鐮狀細胞貧血為血紅素結構異常。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 36, "stem": "下列何者不是紅血球過多症常見的併發症？", "options": ["栓塞（thrombosis）", "出血（bleeding）", "痛風（gout）", "過敏（allergy）"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-36", "explanation": "紅血球過多症常見併發症為栓塞、出血與痛風（尿酸增加），過敏並非其併發症，故選 D。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 37, "stem": "有關慢性淋巴性白血病的敘述，下列何者錯誤？", "options": ["好發於 50 歲以上成人", "分期較早通常不需治療", "小且異常的不成熟淋巴球增生", "容易造成嚴重感染"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-37", "explanation": "本題選錯誤。慢性淋巴性白血病為「成熟」但功能異常的淋巴球增生，非小而不成熟（不成熟為急性白血病），故 C 錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 38, "stem": "有關化學藥物發生滲漏的敘述，下列何者正確？", "options": ["化學藥物滲漏時，都會有疼痛和紅腫的現象", "發生化學藥物滲漏，須立即停止注射藥物，並拔除針頭", "植物鹼類化學藥物發生滲漏時，應溫熱敷外滲部位", "加壓滲漏部位，並抬高患肢以減輕腫脹"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-38", "explanation": "植物鹼類（如長春花生物鹼）化療藥外滲時應「溫熱敷」，故選 C。外滲未必都會紅腫痛；發生外滲應停止注射但不立即拔針（需先抽吸/給解毒劑）；不可加壓。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 39, "stem": "有關血小板減少症照護的敘述，下列何者正確？", "options": ["病人可使用非類固醇抗發炎之止痛藥物", "教導病人使用牙線代替牙籤", "教導病人避免做閉氣用力的動作", "鼻黏膜乾燥不適，不可塗抹凡士林"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-39", "explanation": "血小板減少症應避免閉氣用力（Valsalva）以防出血，故選 C。應避免 NSAIDs（抑制血小板）；避免牙線與牙籤（改軟毛牙刷）；鼻黏膜乾燥可塗凡士林。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 40, "stem": "有關預防乳癌病人術後淋巴水腫的照護，下列敘述何者正確？", "options": ["術後第二天才可以操作手指屈曲和腕部伸展運動", "爬牆和轉繩運動在有引流管時，就要開始做", "側臥時，健臂在上，枕頭夾於腋下到臀部，並將手墊高", "臥床時，用枕頭將肩部與患臂墊高，使手腕比手肘高，手肘比肩膀高"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-40", "explanation": "預防乳癌術後淋巴水腫，臥床時以枕頭墊高使手腕高於手肘、手肘高於肩膀以利回流，故選 D。手指腕部運動術後第一天即可開始，非第二天。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 41, "stem": "有關骨髓移植後病人產生移植物抗宿主疾病（Graft-versus-host Disease; GVHD）症狀，下列何者錯誤？", "options": ["膽紅素上升", "皮疹", "肝功能受損", "便祕"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-41", "explanation": "本題選錯誤。GVHD 常見皮疹、肝功能受損（膽紅素上升）及腹瀉；便祕並非其表現，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 42, "stem": "下列何者不是嚴重缺鐵性貧血病人常見的症狀？", "options": ["吞嚥困難", "舌炎、口炎", "湯匙狀指甲", "手足有麻木感"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-42", "explanation": "嚴重缺鐵性貧血可見吞嚥困難、舌炎口炎、湯匙狀指甲；手足麻木屬維生素 B12 缺乏，非缺鐵，故選 D。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 43, "stem": "有關骨髓抑制病人之敘述，下列何者錯誤？", "options": ["絕對嗜中性白血球下降容易導致感染", "血小板低於 50,000/μL 容易引起自發性出血", "絕對嗜中性白血球低於 500/μL 要採取保護隔離", "血紅素過低可補充紅血球濃厚液"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-43", "explanation": "本題選錯誤。自發性出血風險多在血小板低於 2 萬/μL，而非 5 萬/μL，故 B 敘述錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 44, "stem": "下列皮膚病灶何者是原發性皮膚病變？", "options": ["潰瘍（Ulcer）：皮膚受損傷及真皮或皮下組織", "糜爛（Erosion）：表皮層流失，傷口潮濕界線分明的凹陷", "抓痕（Excoriation）：表皮表面線狀、深度不一的小缺損", "膨疹（Wheal）：皮膚腫起有明顯界線但外觀呈不規則狀"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-44", "explanation": "膨疹（Wheal）屬原發性皮膚病變，故選 D。潰瘍、糜爛、抓痕皆為續發性病變。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 45, "stem": "有關化學物質燒傷導致皮下組織損傷的處置，下列何者錯誤？", "options": ["休克期應預防低血鈉及代謝性酸中毒", "利尿期應預防低血鉀及代謝性酸中毒", "在燒傷現場應先沖洗再送醫", "恢復期應預防急性腎衰竭"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-45", "explanation": "本題選錯誤。化學燒傷急性腎衰竭風險主要在休克期（大量體液移動、肌球蛋白），而非恢復期，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 46, "stem": "有關燒傷病人居家照護的護理指導，下列何者錯誤？", "options": ["每天評估傷口狀況並換藥，有感染症狀需就醫", "已癒合傷口可塗抹乳液等潤膚劑，避免乾燥", "避免按摩疤痕，減少疤痕增生", "持續執行肢體復健運動，避免肢體攣縮"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-46", "explanation": "本題選錯誤。燒傷癒合後應「按摩疤痕」以減少肥厚性疤痕增生，故「避免按摩疤痕」為錯誤指導，選 C。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 47, "stem": "有關乳癌的敘述，下列何者錯誤？", "options": ["約 5～10%乳癌與遺傳有關", "多數乳癌腫塊會有疼痛感", "乳房自我檢查不能檢測到所有的腫瘤", "最常發生部位為乳房外上四分之一"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-47", "explanation": "本題選錯誤。多數乳癌腫塊為「無痛性」，故 B 錯誤。乳癌約 5～10% 與遺傳有關、自我檢查無法查出所有腫瘤、最常位於外上四分之一。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 48, "stem": "有關愛滋病檢驗的敘述，下列何者正確？", "options": ["T4 與 T8 的比值大於 1", "當 CD4 細胞小於 400/μl 時，容易出現伺機性感染", "沒有空窗期", "西方墨點試驗是一種確定診斷的檢驗法"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-48", "explanation": "西方墨點試驗為愛滋病的確認診斷法，故選 D。AIDS 時 T4/T8 比值＜1；CD4＜200 才易伺機性感染；且有空窗期。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 49, "stem": "有關心臟衰竭合併肺水腫病人之護理措施及其原理的敘述，下列何者正確？", "options": ["應採頭低腳高的姿勢，以增加回心血量", "應限制液體的攝入量，以減少心臟的後負荷", "必要時可以依醫囑給予嗎啡，以減輕前後負荷", "須限制給氧，以減輕心臟負擔"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-49", "explanation": "心臟衰竭合併肺水腫時，必要時可依醫囑給嗎啡以減輕前後負荷，故選 C。姿勢應採高坐臥（非頭低）；限水是減少前負荷；應給氧而非限氧。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 50, "stem": "有關類風濕性關節炎的醫療處置，下列敘述何者正確？", "options": ["非類固醇抗炎藥物 Ibuprofen 最需擔心肝腎功能損傷問題", "DMARDs 為育齡婦女治療的首選藥物", "COX-2 抑制劑有延長出血時間的副作用", "使用抗瘧疾製劑（奎寧類），應定期檢查眼睛"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-50", "explanation": "使用抗瘧疾製劑（奎寧類）須定期檢查眼睛以防視網膜病變，故選 D。DMARDs 非孕婦首選（如 MTX 有致畸性）；COX-2 抑制劑出血風險較低。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 51, "stem": "有關全身性紅斑性狼瘡（SLE）的診斷檢查，下列何者錯誤？", "options": ["抗核性抗體（ANA）呈陽性反應", "血清補體 C3 和 C4 值下降", "白血球及血小板值升高", "免疫球蛋白濃度升高"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-51", "explanation": "本題選錯誤。SLE 常造成白血球與血小板「下降」而非升高，故 C 錯誤。ANA 陽性、補體 C3/C4 下降、免疫球蛋白升高皆為典型。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 52, "stem": "車禍外傷病人出現胸部右側聽不到呼吸音，且氣管向左側偏移，下列處置何者最適當？", "options": ["準備抽血進行血液培養（blood culture）", "準備心肺復甦術（CPR）並請其他人通知醫師", "準備胸部針刺減壓（chest needle decompression）", "進行動脈氣體分析（arterial blood gas analysis）"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-52", "explanation": "右胸呼吸音消失且氣管偏向對側，提示張力性氣胸，應立即行胸部針刺減壓，故選 C。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 53, "stem": "有關放置胸管（chest tube）病人的照護，下列何者正確？", "options": ["為避免胸管滑脫，應限制病人活動", "平時應間歇性的夾住管路，避免過度引流", "水封瓶內出現大量氣泡，為正常現象", "負壓引流時，抽吸控制瓶應使用持續性抽吸"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-53", "explanation": "負壓引流時抽吸控制瓶應採持續性抽吸，故選 D。不應過度限制活動、不可常規夾管（恐張力性氣胸）；水封瓶大量氣泡代表漏氣為異常。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 54, "stem": "使用卞德里氧氣面罩（Venturi mask）給氧的最主要特點為何？", "options": ["可提供 70%以上濃度的氧氣", "可增加用氧的溼度", "可提供較精確的用氧濃度", "可用於病人進食時"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-54", "explanation": "文氏面罩（Venturi mask）最大特點是能提供較精確的氧氣濃度，故選 C。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 55, "stem": "下列何者不是闌尾炎的徵象？", "options": ["透納氏徵象（Turner’s sign）", "洛夫辛徵象（Rovsing’s sign）", "腰大肌徵象（Psoa sign）", "閉孔肌徵象（Obturator sign）"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-55", "explanation": "透納氏徵象（側腹瘀斑）為出血性胰臟炎表現，非闌尾炎徵象，故選 A。Rovsing's、腰大肌、閉孔肌徵象皆屬闌尾炎。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 56, "stem": "有關抗凝劑 Warfarin 使用的注意事項，下列何者錯誤？", "options": ["需教導病人觀察異常出血的症狀，如血尿、黑便、鼻出血等", "需觀察顆粒白血球過少引起的發炎症狀，如發燒、喉嚨痛等", "鼓勵服用含有高維生素 K 的食品，如青花椰菜、菠菜", "若使用劑量不當造成出血不止，必要時可給予 Phytonadione"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-56", "explanation": "本題選錯誤。Warfarin 使用期間應維持維生素 K 攝取穩定、避免大量攝取（維生素 K 會拮抗藥效），故「鼓勵高維生素 K 食物」為錯誤，選 C。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 57, "stem": "下列那一種肺癌生長最快速，且最惡性但對化學及放射線治療敏感？", "options": ["小細胞肺癌", "鱗狀細胞癌", "肺腺癌", "大細胞肺癌"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-57", "explanation": "小細胞肺癌生長最快、惡性度最高，但對化療與放射線治療敏感，故選 A。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 58, "stem": "有關促進急性呼吸窘迫症候群（ARDS）病人有效呼吸道清除的護理措施，下列何者正確？", "options": ["每 2 小時給氧", "每 4 小時翻身", "給予鎮靜劑以促進休息", "若咳嗽無效，可進行抽痰"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-58", "explanation": "ARDS 病人若咳嗽無效可執行抽痰以清除呼吸道分泌物，故選 D。翻身應每 2 小時、給氧須持續，鎮靜劑會抑制咳嗽故不宜。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 59, "stem": "病人的動脈血氧分析結果 PaO2 值為 50 mmHg，此病人 PaO2 的判讀及處置，下列何者正確？", "options": ["此病人有嚴重的缺氧（hypoxia）", "血氧氣值低但對病人不會造成威脅", "病人的 PaO2 在正常範圍", "可使用低流量的氧氣治療"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-59", "explanation": "PaO2 50 mmHg 遠低於正常（80～100），代表嚴重缺氧，故選 A，須積極給氧處置。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 60, "stem": "當慢性阻塞性肺疾病（COPD）病人出現下列何種評估結果時，護理師須優先採取因應措施？", "options": ["杵狀指", "白色濃痰", "使用呼吸輔助肌", "桶狀胸"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-60", "explanation": "COPD 病人出現使用呼吸輔助肌，代表呼吸窘迫，須優先處置，故選 C。杵狀指、桶狀胸為慢性表現，白色濃痰非急迫。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 61, "stem": "有關血液透析（HD）與持續可攜帶式腹膜透析（CAPD）治療的敘述，下列何者錯誤？", "options": ["HD 較 CAPD 蛋白質流失較多", "CAPD 需承擔較多的自我照顧活動", "CAPD 易發生血中三酸甘油脂增加", "HD 過程，易發生低血壓及頭痛、抽筋不平衡症候群"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-61", "explanation": "本題選錯誤。腹膜透析（CAPD）因蛋白質經腹膜流失較多，故「HD 較 CAPD 蛋白質流失多」錯誤，選 A。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 62, "stem": "有關尿液檢查目的之敘述，下列何者正確？", "options": ["尿液細菌培養是泌尿道疾病初步常規檢查", "24 小時尿液檢查可以評估尿中蛋白質含量", "酚紅試驗是測定腎絲球對外排除的能力", "肌酸酐廓清率是檢驗腎小管尿液濃縮的能力"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-62", "explanation": "24 小時尿液檢查可評估尿蛋白含量，故選 B。尿液常規（非細菌培養）為初步檢查；酚紅試驗測腎小管分泌；肌酸酐廓清率評估腎絲球過濾率。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 63, "stem": "泌尿道結石成分為尿酸時之處置與照護，下列何者正確？", "options": ["可使用 Probencid 降低血中尿酸值，避免復發", "攝取鹼性食物（如肉類、乾梅或穀類等），促使尿液鹼化", "避免攝取香菇、豆類、海鮮與內臟等，減少尿酸形成", "需維持每日尿量，可多飲用開水、茶或啤酒等，增加尿量"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-63", "explanation": "尿酸結石應避免香菇、豆類、海鮮與內臟等高普林食物，故選 C。應鹼化尿液（多攝取蔬果而非肉類）、避免啤酒。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 64, "stem": "有關膀胱癌的診斷檢查與治療，下列何者錯誤？", "options": ["尿液細胞學檢查是確認惡性細胞最方便的方式", "以化學治療與放射線治療為主，外科切除為輔", "膀胱鏡檢查是確診和定期追蹤的主要方式", "膀胱化學灌藥適用於未侵犯肌肉表淺性腫瘤"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-64", "explanation": "本題選錯誤。膀胱癌以「外科切除為主」（TURBT/膀胱切除），化放療為輔，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 65, "stem": "有關腎病症候群之照護措施，下列何者錯誤？", "options": ["嚴重水腫時，鼓勵多下床活動，增加水分排除", "當腎功能正常時，可採高蛋白、高熱量飲食", "指導抗凝劑使用的注意事項，如出血徵兆", "每日需監測輸入輸出量、體重及腹圍變化"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-65", "explanation": "本題選錯誤。腎病症候群嚴重水腫時應臥床休息，而非鼓勵多下床活動，故 A 錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 66, "stem": "有關接受經尿道前列腺切除術病人之護理指導，下列何者錯誤？", "options": ["逆行性射精為術後常見暫時性的問題", "3 個月內應避免騎腳踏車或跑步", "避免上樓梯，以免因腹內壓增加而出血", "避免坐浴或熱敷下腹部，以減少出血機會"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-66", "explanation": "本題選錯誤。經尿道前列腺切除術後，逆行性射精多為「永久性」而非暫時性，故 A 錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 67, "stem": "有關良性前列腺肥大的合併症，下列何者錯誤？", "options": ["尿毒症", "膀胱結石", "壓力性尿失禁", "尿道炎"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-67", "explanation": "本題選錯誤。良性前列腺肥大造成阻塞，易致溢出性/急尿，並非壓力性尿失禁，故「壓力性尿失禁」非其合併症，選 C。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 68, "stem": "有關愛迪生氏危機（Addisonian crisis）之特徵，下列何者正確？", "options": ["高血壓", "高血糖", "低血鉀", "低血鈉"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-68", "explanation": "愛迪生氏危機特徵為低血鈉、高血鉀、低血糖與低血壓，故選 D（低血鈉）。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 69, "stem": "有關嗜鉻細胞瘤的敘述，下列何者錯誤？", "options": ["因病人情緒激動導致腫瘤突然釋放大量兒茶酚胺所導致", "過量的腎上腺素與正腎上腺素會引起交感神經過度活動", "會出現 5P 症狀：心悸、盜汗、疼痛、臉色蒼白及高血壓", "可透過檢測病人血液當中的杏仁酸（VMA）含量確立診斷"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-69", "explanation": "本題選錯誤。嗜鉻細胞瘤是檢測「尿液」中的杏仁酸（VMA）而非血液，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 70, "stem": "有關糖尿病病人產生腎臟病變之敘述，下列何者正確？", "options": ["採高蛋白飲食可預防腎功能惡化", "是造成糖尿病病人最主要的死因", "只會出現在第 2 型糖尿病病人", "因腎絲球基底膜變薄且通透性降低所造成"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-70", "explanation": "糖尿病腎病變是糖尿病病人重要死因，故選 B。高蛋白飲食會加重腎損；第 1、2 型皆可發生；病變為基底膜增厚、通透性增加。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 71, "stem": "有關糖化血色素（HbA1c）檢查之敘述，下列何者正確？", "options": ["可取代口服葡萄糖耐量試驗（OGTT）、血糖及尿糖的監測", "用來評估缺鐵性貧血的控制成效", "HbA1c 值在 13%以下表示糖尿病控制良好", "可作為糖尿病的診斷標準之一"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-71", "explanation": "HbA1c 可作為糖尿病診斷標準之一（≥6.5%），故選 D。它不能取代血糖監測、與缺鐵貧血無關，13% 代表控制不良。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 72, "stem": "有關糖尿病性酮酸中毒（DKA）治療之敘述，下列何者正確？", "options": ["處理低血糖", "矯正水分過度負荷狀態", "補充鈉離子", "矯正血液 pH 值"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-72", "explanation": "DKA 治療重點之一為矯正血液 pH（酸中毒），故選 D。應處理高血糖（非低血糖）、矯正脫水（非水分過載），並補鉀而非以補鈉為主。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 73, "stem": "有關糖尿病足之護理指導，下列何者正確？", "options": ["足部保持乾燥，勿擦拭任何乳液", "足部要使用熱水袋或電毯保暖", "出門要穿涼鞋，以避免香港腳", "穿鞋前要先檢視鞋內有否異物"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-73", "explanation": "糖尿病足應於穿鞋前檢查鞋內異物以防受傷不自覺，故選 D。應保濕（趾縫除外）、勿用熱水袋電毯（燙傷）、勿穿露趾涼鞋。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 74, "stem": "長期接受血液透析的病人，突然意識改變、出現抽筋及肌肉無力情況，入急診求治，抽血檢查結果：尿素氮／肌酸酐 120 mg/dL／10.6 mg/dL、鉀離子 7.8 mg/dL、鈉離子 135 mg/dL，動脈血液氣體分析結果：pH 7.28、PaO₂ 70 mmHg、PaCO₂ 30 mmHg、 HCO₃⁻ 20 mEq/L。下列判斷何者正確？", "options": ["未代償性呼吸性酸中毒", "部分代償性代謝性酸中毒", "完全代償性呼吸性鹼中毒", "未代償性代謝性鹼中毒"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-74", "explanation": "pH 7.28 呈酸血症、HCO₃⁻ 20 偏低為代謝性酸中毒，PaCO₂ 30 代償性下降但 pH 未回正常，屬部分代償性代謝性酸中毒，故選 B。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 75, "stem": "承上題，下列處置何者錯誤？", "options": ["口服陽離子交換樹脂（Kalmate）", "靜脈注射正規胰島素（RI）及高張性葡萄糖液（D50W）", "補充 0.3%氯化鈉溶液", "緊急血液透析並持續監測心電圖變化"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-75", "explanation": "本題選錯誤處置。此高血鉀尿毒病人不宜補充低張的 0.3% 氯化鈉溶液，故 C 錯誤。Kalimate、胰島素加 D50W 降鉀、緊急血液透析並監測心電圖皆正確。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 76, "stem": "有關第一期心腦肺甦醒術（cardiopulmonary cerebral resuscitation; CPCR）的執行步驟，下列何者最優先？", "options": ["靜脈輸液", "維持循環", "低溫治療", "氧氣治療"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-76", "explanation": "CPCR 第一期最優先為維持循環（先胸外按壓，C-A-B），故選 B。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 77, "stem": "依據「臺灣急診檢傷與急迫度分級量表」（TTAS），病人出現中樞性疼痛程度為 4～7 分，級數應為 下列何者？", "options": ["一級", "二級", "三級", "四級"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-77", "explanation": "依 TTAS，中樞性疼痛 4～7 分應歸為第三級，故選 C。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 78, "stem": "有關敗血性休克引發瀰漫性血管內凝血（DIC）之敘述，下列何者正確？", "options": ["體內會產生凝血因子和血小板功能被抑制", "DIC 產生之症狀包括皮膚出現水泡", "應優先治療敗血症之導因", "DIC 治療包括優先提供全血輸注"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-78", "explanation": "敗血性休克引發 DIC 應優先治療敗血症之導因，故選 C。DIC 為凝血因子與血小板被大量消耗、表現為出血點瘀斑（非水泡），治療非以全血輸注為優先。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 79, "stem": "有關休克初期身體啟動之正常代償機轉，下列何者錯誤？", "options": ["副交感神經釋放腎上腺素使心跳加快", "腎臟血流減少", "四肢溫度降低", "全身末梢血管收縮"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-79", "explanation": "本題選錯誤。休克初期是「交感神經」釋放腎上腺素使心跳加快，非副交感神經，故 A 錯誤。"}, {"year": "110", "session": "第一次", "subject": "內外科護理學", "num": 80, "stem": "下列何者不屬於傳染病的護理評估項目？", "options": ["疾病症狀開始的時間", "家族疾病史", "近期有無海外旅遊", "居住環境"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "110-1-3104-80", "explanation": "家族疾病史與傳染病護理評估關聯最低，故選 B（非評估項目）。症狀開始時間、近期海外旅遊、居住環境皆為傳染病評估重點。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 1, "stem": "有關預防病人跌倒之敘述，下列何者正確？", "options": ["應固定床高，不宜調整床面高低", "床欄固定拉起，不宜調整床欄起落", "有定向障礙病人，病室不宜太靠近護理站", "浴廁與樓梯是醫院中病人跌倒常發生的地點"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-1", "explanation": "浴廁與樓梯是醫院跌倒最常發生的地點，故選 D。床高與床欄應可調整、失定向病人病室宜「接近」護理站以便照看。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 2, "stem": "臨床上常遇到布類有舊血漬沾染，下列何者對於清除舊血漬的效果最佳？", "options": ["漂白水", "雙氧水", "肥皂水", "溫開水"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-2", "explanation": "清除舊血漬以雙氧水（過氧化氫）效果最佳，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 3, "stem": "下列那位專家提出「人生可分成八個發展階段，而每個階段都有其應完成的任務」？", "options": ["佛洛依德（Freud）", "艾瑞克森（Erikson）", "佩普洛（Peplau）", "馬斯洛（Maslow）"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-3", "explanation": "提出人生八階段、各階段有發展任務者為艾瑞克森（Erikson），故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 4, "stem": "有關壓力情境下在警覺期（alarm stage）可能出現的身體反應，下列何者錯誤？", "options": ["心跳加快", "瞳孔縮小", "血壓上升", "血糖上升"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-4", "explanation": "本題選錯誤。警覺期為交感神經興奮，瞳孔應「放大」而非縮小，故 B 錯誤；心跳加快、血壓與血糖上升皆為正確反應。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 5, "stem": "護理人員跟隨醫師巡視住院病人的主要專業角色，下列敘述何者正確？", "options": ["隨時提供病歷，方便醫師開立醫囑", "表示同屬一醫療團隊，增加病人信任", "觀察病程發展和醫療計畫，確認病人需求", "即時向醫師報告說明護理目標與措施"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-5", "explanation": "護理師隨醫師巡診的主要角色是觀察病程與醫療計畫、確認病人需求，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 6, "stem": "提供左側下肢乏力但意識清楚之老人安全環境，下列敘述何者正確？", "options": ["為方便上下床，不要拉起右側床欄", "夜間仍須打開照明設備", "浴室進出口應放置小地毯以防濕滑", "助行器應置放左側床尾"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-6", "explanation": "意識清楚、左下肢乏力的老人，夜間仍應保持照明以防跌倒，故選 B。床欄應拉起、浴室不放易滑地毯、助行器置於健側方便使用。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 7, "stem": "有關病人症狀（symptoms）資料的敘述，下列何者正確？", "options": ["腹部手術部位傷口疼痛", "空腹血糖值 180 mg/dL", "肺部 X 光檢查有肺泡浸潤現象", "痰液結核桿菌試驗呈陽性反應"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-7", "explanation": "症狀（主觀資料）指病人主訴，如傷口疼痛，故選 A。血糖值、X 光、結核桿菌試驗屬客觀徵象。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 8, "stem": "下列何項護理措施，需採外科無菌原則？①胃造瘻灌食 ②氣管內插管抽痰 ③結腸造瘻灌洗 ④胰島素注射", "options": ["①②", "②③", "②④", "③④"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-8", "explanation": "需外科無菌者為②氣管內抽痰與④胰島素注射，故選 C（②④）。胃造瘻灌食與結腸造瘻灌洗採清潔原則即可。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 9, "stem": "當醫療院所開始發生火災時，護理人員依 RACE 的原則進行臨場處置，其中 A 是指：", "options": ["關閉電器以侷限火源", "啟動警報系統通知消防單位", "將病人立即移開危險區", "使用合宜滅火器滅火"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-9", "explanation": "火災 RACE 中 A 為 Alarm，啟動警報並通知消防，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 10, "stem": "有關病人的資料收集及觀察時機，下列敘述何者正確？", "options": ["晨間護理時可收集到病人的白血球數", "傷口換藥時可觀察到感染情形", "檢閱體溫紀錄單時可觀察到病人排尿困難", "測量生命徵象時可觀察病人的人際關係"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-10", "explanation": "傷口換藥時可觀察到感染情形，故選 B。白血球數需靠檢驗、排尿困難非體溫單可見、人際關係非量生命徵象可得。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 11, "stem": "有關護理診斷的敘述，下列何者錯誤？", "options": ["書寫護理診斷使用之文字必須適當、簡潔、正確及確實", "僅需一個明顯之臨床表徵即可確立一個護理診斷", "護理措施主要在於矯正問題之導因", "護理診斷主要是在護理實務範疇中，描述病人對於疾病或是情境之反應或需要"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-11", "explanation": "本題選錯誤。確立護理診斷需有足夠的臨床表徵，僅憑單一表徵並不足夠，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 12, "stem": "有關行為過程觀察與記錄方法，下列敘述何者正確？", "options": ["為避免個案隱藏情緒想法，錄音錄影可不需事先告知", "會談者一面會談同時作記錄，可增加觀察資料的真實性", "配合觀察目的，可以選擇特定時間活動進行行為過程觀察", "記錄偏重於個案的語言和非語言行為，不關心當時的情境"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-12", "explanation": "可配合觀察目的選擇特定時間與活動進行行為觀察，故選 C。錄音錄影須事先告知；邊談邊記錄會影響真實性；記錄應兼顧當時情境。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 13, "stem": "有關「p.r.n.」醫囑的敘述，下列何者錯誤？①是一種臨時醫囑 ②開立醫囑時，醫師會指定間隔時間 多久一次 ③中文解釋為「如有需要僅給予一次」 ④執行後須記錄 ⑤此醫囑有效時間為 12 小時", "options": ["①②④", "①③⑤", "②④⑤", "③④⑤"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-13", "explanation": "本題選錯誤敘述為①③⑤。p.r.n. 為「需要時給予、可重複」，非臨時醫囑、非僅給一次、也無固定 12 小時效期；②醫師指定間隔、④執行後須記錄則正確，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 14, "stem": "診斷縮寫 R/O 的含意，下列何者正確？", "options": ["不含", "身體檢查", "疑似", "許可出院"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-14", "explanation": "R/O（rule out）意為「疑似」，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 15, "stem": "有關護理措施的敘述，下列何者正確？", "options": ["每二小時協助病人翻身為非獨立性護理措施", "經鼻導管給予氧氣為獨立性護理措施", "中心靜脈導管置入為獨立性護理措施", "與營養師共同擬定病人的飲食計畫為合作性護理措施"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-15", "explanation": "與營養師共同擬定飲食計畫屬合作性護理措施，故選 D。翻身為獨立性、給氧與置放中心靜脈導管屬需醫囑的非獨立性措施。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 16, "stem": "護理師處理電話中的藥物醫囑時，下列敘述何者錯誤？", "options": ["寫下此口頭醫囑，並複誦一次與醫師確認無誤後，才可執行", "事後應在護理記錄中，註明醫師姓名、藥物名稱、劑量、途徑、時間", "宜婉轉向醫師說明為確保給藥安全，拒絕接受口頭醫囑", "事後依醫院作業規範，儘速請醫師補開醫囑"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-16", "explanation": "本題選錯誤。電話口頭醫囑在寫下並複誦確認後可執行，事後補開醫囑，並非一律婉拒，故 C 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 17, "stem": "給予成年病人肛門栓劑時，栓劑置入肛門內的適當深度，下列何者正確？", "options": ["1.4～3.6 公分", "4.4～5.6 公分", "6.4～7.6 公分", "8.4～9.6 公分"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-17", "explanation": "成人肛門栓劑置入適當深度約 6.4～7.6 公分（越過內括約肌），故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 18, "stem": "有關由藥瓶（Vial）抽藥方法的敘述，下列何者正確？", "options": ["核對藥瓶及藥牌上藥物的名稱及劑量，為第三讀", "粉劑應先稀釋溶解，並用力上下搖晃以搖勻藥液", "抽完藥為避免針頭變鈍，可排氣後再更換針頭", "抽藥時針筒朝上針頭沒入液面，抽完藥後，雙手呈水平方式拔針頭"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-18", "explanation": "由藥瓶抽藥時針頭沒入液面下抽取、抽畢以水平方式拔針，故選 D。粉劑應輕輕搖勻勿劇烈搖晃（起泡）。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 19, "stem": "張小姐，30 歲，因過敏性眼瞼結膜炎，醫囑開立 Rinteron solution 1 gtt.O.U. q6h 及 Tetracycline oint. O.U. q6h，護理師進行眼藥滴入時，下列何者為正確給藥方式？", "options": ["先以棉球由眼外眥往內眥擦拭分泌物", "先使用 Tetracycline oint.，再使用 Rinteron solution 1 gtt.", "Rinteron solution 1 gtt.滴入下眼瞼結膜囊內", "Tetracycline oint.應擦在角膜上"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-19", "explanation": "眼藥水應滴入下眼瞼結膜囊內，故選 C。擦拭分泌物由內眥往外眥；先點藥水再上藥膏；藥膏不可直接塗於角膜。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 20, "stem": "楊先生為癌症病人，今天 9AM 給藥時拒絕服用口服藥，護理師在第一時間的反應，下列何者最適當？", "options": ["立即通知醫師前來處理病人問題", "說明該藥物對癌症具療效，勸病人服用", "評估病人拒服原因，必要時聯絡醫師處理", "尊重病人決定，將藥物帶回護理站並做紀錄"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-20", "explanation": "病人拒服藥時，應先評估拒服原因，必要時聯絡醫師，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 21, "stem": "李先生是使用 Digoxin 治療的病人，下列何者是護理師依醫囑繼續給藥的最重要依據？", "options": ["心率 64 次／分鐘", "血壓 120/80 mmHg", "心率 52 次／分鐘", "呼吸 18 次／分鐘"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-21", "explanation": "Digoxin 給藥前須評估心率，心率 64 次/分（≥60）可依醫囑續給，故選 A；若＜60（如 52）則應暫停並通報。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 22, "stem": "給予幼兒左耳耳滴藥治療時，應採取的姿勢，下列敘述何者正確？①頭側向右側 ②頭側向左側 ③將耳翼向上向後拉 ④將耳垂向下向後拉", "options": ["①③", "①④", "②③", "②④"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-22", "explanation": "幼兒左耳點藥：頭側向右（患耳朝上）、將耳垂向下向後拉（三歲以下），故選 B（①④）。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 23, "stem": "局部用冷會產生那些生理現象？①減輕組織腫脹 ②鬆弛僵硬的組織 ③降低細胞新陳代謝 ④容 易導致寒顫發生 ⑤減輕疼痛", "options": ["①③④", "①③⑤", "②③④", "③④⑤"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-23", "explanation": "局部用冷可①減輕腫脹、③降低細胞代謝、⑤減輕疼痛，故選 B（①③⑤）。鬆弛僵硬組織屬用熱效果。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 24, "stem": "靜脈輸注 5%葡萄糖水 1,000 mL 及生理食鹽水 1,000 mL，需要於 24 小時內輸注完畢，當使用普通輸 液套管時，滴注速度，下列何者正確？", "options": ["8 滴／分鐘", "20 滴／分鐘", "30 滴／分鐘", "84 滴／分鐘"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-24", "explanation": "2000 mL 於 24 小時、普通輸液套（15 gtt/mL）：2000×15÷1440≈20 滴/分，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 25, "stem": "有關常見的用熱方式與治療目的之敘述，下列何者錯誤？", "options": ["石蠟浴的目的在協助類風濕性關節炎病人，作為關節疼痛與僵硬的物理治療", "溫水浸泡可促進糖尿病人足部的血液循環", "烤燈可應用於植皮供皮區，促進血液循環與傷口的癒合", "熱水袋能安全地使用於老人和嬰幼兒，且不須考慮燙傷的問題"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-25", "explanation": "本題選錯誤。熱水袋用於老人與嬰幼兒仍須防範燙傷，不可謂「不須考慮燙傷」，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 26, "stem": "0.33%食鹽水輸液適用於下列何種病人？", "options": ["顱內壓過高", "尿崩症", "嚴重燒傷", "營養不良"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-26", "explanation": "0.33% 食鹽水為低張溶液，適用於尿崩症病人補充自由水，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 27, "stem": "林小姐因腦血管損傷住院中，靜脈注射在右手背，欲幫林小姐更衣，正確的順序為何？", "options": ["右手先脫先穿", "右手後脫先穿", "左手先脫先穿", "左手後脫先穿"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-27", "explanation": "右手有靜脈注射，更衣原則「患肢後脫、先穿」，故右手後脫先穿，選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 28, "stem": "有關成人輸血護理之敘述，下列何者不適當？", "options": ["輸血前核對病人血型/Rh 因子", "協助放置 20G 的靜脈留置針", "開始輸血前 15 分鐘流速 25gtt/min", "病人主訴呼吸困難且不適時，調慢流速"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-28", "explanation": "本題選不適當。輸血中若病人主訴呼吸困難不適，應「立即停止輸血」而非僅調慢流速，故 D 不適當。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 29, "stem": "下列何種情況下，病人適宜使用熱療？", "options": ["不明原因腹痛", "持續出血", "齒齦發炎", "3 天前腳踝扭傷"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-29", "explanation": "腳踝扭傷 3 天後（超過急性期）可使用熱療，故選 D。不明腹痛、持續出血、齒齦發炎急性發炎期不宜用熱。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 30, "stem": "溫水拭浴是同時運用下列那二種能量轉移方式，而達到降溫效果？①輻射 ②蒸發 ③傳導 ④對流", "options": ["①②", "①④", "②③", "③④"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-30", "explanation": "溫水拭浴主要利用②蒸發與③傳導兩種能量轉移方式散熱，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 31, "stem": "「換氣過度」病人的動脈氣體分析結果，下列何者最有可能？", "options": ["呼吸性酸中毒", "呼吸性鹼中毒", "代謝性酸中毒", "代謝性鹼中毒"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-31", "explanation": "換氣過度使二氧化碳排出過多，導致呼吸性鹼中毒，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 32, "stem": "病人為左手蜂窩性組織炎，需接受靜脈抗生素治療至少二至三星期時，有關注射部位選擇的注意事 項，下列何者正確？①應優先選擇近心側小靜脈 ②應選擇患肢側靜脈，使抗生素藥效較快速作用 ③應以平滑柔軟且摸起來有彈性的血管為主 ④病人的右手為最好的注射選擇部位", "options": ["①②", "③④", "①③", "②④"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-32", "explanation": "長期靜脈抗生素應選③平滑柔軟有彈性的血管，並以④健側（右手）為佳，故選 B（③④）；不應選患肢或近心側小靜脈。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 33, "stem": "執行背部護理之開始與結束時，最常採用下列何種按摩法？", "options": ["重擦法（friction）", "揉捏法（kneading）", "按撫法（stroking）", "敲擊法（tapotement）"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-33", "explanation": "背部按摩起始與結束最常用按撫法（stroking），故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 34, "stem": "張女士 62 歲，懷孕 7 次，生了 5 個孩子。常常在大笑或咳嗽時排出少量尿液，屬於下列那一種尿失禁？", "options": ["急迫性尿失禁", "壓力性尿失禁", "反射性尿失禁", "功能性尿失禁"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-34", "explanation": "大笑或咳嗽（腹壓上升）時漏尿屬壓力性尿失禁，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 35, "stem": "為一位 76 歲罹患乳癌並有骨轉移之病人進行床上沐浴及背部護理時，下列方式何者較適宜？", "options": ["沐浴水溫宜保持在 46.5～48℃，以促進血液循環", "應由肢體遠心端往近心端按摩擦洗四肢", "以 50%酒精進行背部按摩", "以扣擊法進行背部及肩頸部的按摩"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-35", "explanation": "骨轉移病人擦洗四肢應由遠心端往近心端按摩以助回流，故選 B。水溫不宜過高、不宜用酒精按摩、骨轉移禁用扣擊法（恐骨折）。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 36, "stem": "灌腸時肛管大小之選擇，下列何者正確？", "options": ["成人小量灌腸宜選用 24～26 Fr.的肛管", "成人大量灌腸宜選用 18～20 Fr.的肛管", "孩童宜選用 14～18 Fr.的肛管", "嬰幼兒宜選用 5～6 Fr.的肛管"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-36", "explanation": "孩童灌腸宜選用 14～18 Fr. 肛管，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 37, "stem": "正常成人之尿餘量應少於多少？", "options": ["200 c.c.", "150 c.c.", "100 c.c.", "50 c.c."], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-37", "explanation": "正常成人尿餘量應少於 50 c.c.，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 38, "stem": "李先生車禍後因腦挫傷導致顱內壓上升，他的體溫及呼吸可能會出現下列何種反應？", "options": ["體溫上升、呼吸過速", "體溫上升、呼吸過慢", "體溫下降、換氣過度", "體溫下降、換氣不足"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-38", "explanation": "顱內壓上升引發庫欣氏反應：體溫上升、呼吸變慢，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 39, "stem": "有關體溫的調節，下列敘述何者錯誤？", "options": ["下視丘是利用負回饋來統整身體產熱與散熱間之生理過程的主要中心", "效應系統（effector system）指的是血管、骨骼肌及汗腺等體溫調節反應器", "病人調整室內溫度屬於行為機轉", "下視丘對於體表溫度較為敏感"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-39", "explanation": "本題選錯誤。下視丘主要對「核心（血液）溫度」較敏感，而非體表溫度，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 40, "stem": "有關影響呼吸的相關因素，下列敘述何者正確？", "options": ["年齡愈大，呼吸速率愈快", "大出血時，呼吸速率加快", "胸腔積水，呼吸速率下降", "急性疼痛，呼吸速率下降"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-40", "explanation": "大出血時呼吸速率會加快以代償缺氧，故選 B。年齡愈大呼吸偏慢、胸腔積水與急性疼痛皆使呼吸加快。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 41, "stem": "有關脈律（pulse rhythm）的敘述，下列何者正確？", "options": ["二重脈（bigeminal pulse）的病人會出現每兩次正常脈動後，緊跟著出現一次未成熟的搏動", "主動脈瓣膜閉鎖不全的病人可能出現柯利干氏脈（Corrigan’s pulse）", "竇性心律不整（sinus arrhythmis）的病人會出現吸氣時脈量減弱，呼氣時增強的情形", "跑脈（running pulse）會出現脈搏間隔時間長短不均，無固定節律，跳幾下停一下的情形"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-41", "explanation": "主動脈瓣閉鎖不全可出現柯利干氏脈（水槌脈），故選 B。二重脈是一次正常搏動後緊跟一次早期搏動；吸氣脈量減弱屬奇脈；跑脈為快而規則。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 42, "stem": "有關血壓的測量，下列敘述何者正確？", "options": ["壓脈帶成人用充氣囊寬度 18～20 公分，長度約 24～26 公分", "壓脈帶包覆在靜脈點滴注射位置上方至少 2 吋", "心律不整病人應測量三次血壓後取其平均值", "半側偏癱病人應測量患側肢體"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-42", "explanation": "心律不整病人應連測三次血壓取平均，故選 C。壓脈帶寬度約為上臂 40%（18～20 公分過寬）；不應在點滴上方或患側測量。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 43, "stem": "高太太，75 歲，早上去公園散步時跌倒，導致右手和右腳多處傷口，護理師欲以繃帶包紮，有關繃 帶包紮的原則和注意事項，下列何者錯誤？", "options": ["應先清洗傷口並覆蓋無菌敷料後，再包紮", "包紮部位若在骨突處，應先墊棉墊或合適之敷料", "包紮時，應抬高肢體，由近心端往遠心端包紮", "包紮的壓力應平均分布，第二圈應覆蓋前一圈範圍的 1/2 至 2/3"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-43", "explanation": "本題選錯誤。繃帶包紮應由「遠心端往近心端」以利靜脈回流，而非由近往遠，故 C 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 44, "stem": "承上題，包紮完畢後，可於下列何處結帶固定？", "options": ["傷口區", "關節處", "上臂", "易受壓處"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-44", "explanation": "結帶固定應選在上臂等平坦處，避開傷口區、關節處與易受壓處，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 45, "stem": "護理人員協助左側偏癱的張女士坐輪椅的方法，下列何者錯誤？", "options": ["輪椅放床尾，椅背與床尾呈 45 度", "輪椅應放於張女士的右側", "下床前先測脈搏、呼吸及血壓", "返回病床時，輪椅置放位置與下床相同"], "answer": "ABCD", "note": "第45題一律給分", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-45", "explanation": "本題經考選部公告「一律給分」，四個選項皆計分。臨床上協助左側偏癱者上輪椅時，輪椅宜置於健側（右側）、下床前應先測生命徵象。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 46, "stem": "有關等長運動的敘述，下列何者錯誤？", "options": ["是一種靜態運動，又稱為肌肉固定運動", "運動時，肌肉長度與關節角度改變，可增強肌肉的緊張度", "為保持上石膏病人患肢肌力，並防止肌肉萎縮，應教導其執行等長運動", "此為主動性運動"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-46", "explanation": "本題選錯誤。等長運動時肌肉長度與關節角度「不改變」（靜態運動），故 B 敘述錯誤。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 47, "stem": "在鼻胃管灌食中，有關食物快灌完時，要再灌入少量溫開水的主要目的，下列敘述何者正確？", "options": ["潤濕鼻胃管", "確定管子是否通暢", "刺激胃液分泌", "避免食物在管內發酵"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-47", "explanation": "鼻胃管灌食末再灌少量溫開水，主要目的是沖淨管壁、避免食物殘留在管內發酵，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 48, "stem": "長期側臥不動的病人，容易發生壓瘡部位為何？①耳朵 ②枕骨 ③腸骨嵴 ④尾椎骨 ⑤踝部", "options": ["①③⑤", "②④⑤", "①②③", "①③④"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-48", "explanation": "長期側臥好發壓瘡於①耳朵、③腸骨嵴、⑤踝部，故選 A（①③⑤）；枕骨與尾椎屬平躺受壓點。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 49, "stem": "下列各類營養素中，何者可幫助維生素 D 的吸收及利用？", "options": ["醣類", "蛋白質類", "脂肪", "菸鹼酸"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-49", "explanation": "脂肪可幫助脂溶性維生素 D 的吸收與利用，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 50, "stem": "有關非腸道營養法，下列敘述何者錯誤？", "options": ["周邊靜脈營養法（PPN），多使用等張的營養製劑", "以全靜脈營養法（TPN）供給營養者，需密切監測病人血糖狀況", "可使用頸靜脈執行全靜脈營養法（TPN）", "以全靜脈營養法（TPN）供給營養，每袋輸注時間不超過 48 小時為宜"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-50", "explanation": "本題選錯誤。TPN 每袋輸注時間不宜超過 24 小時（感染風險），而非 48 小時，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 51, "stem": "吳小姐因懷疑有泌尿道感染，今欲留中段尿送檢，下列相關步驟之護理指導，何者正確？", "options": ["指導留尿前，須先以優碘棉棒由後往前消毒會陰部", "先解掉前段小便以沖洗尿道口，再以無菌容器盛取中段小便", "所需小便量至少要 120 c.c.以上，檢驗才有意義", "小便標本需留置至少 4 小時以上，才能送檢"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-51", "explanation": "中段尿採集應先解掉前段尿沖洗尿道口，再以無菌容器盛取中段尿，故選 B。消毒應由前往後、量不需 120 c.c.、且須儘速送檢。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 52, "stem": "有關遺體護理，下列敘述何者正確？", "options": ["移走枕頭，保持死者身體平直，以避免身體彎曲變形", "若有傷口需要縫合，以維護死者皮膚完整性", "移除假牙，以防脫落", "身體腔道出口保持通暢"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-52", "explanation": "遺體若有傷口需縫合以維護皮膚完整性，故選 B。應保留枕頭墊高頭部（防血液鬱積變色）、保留假牙維持臉型、並填塞腔道出口。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 53, "stem": "有關安寧緩和療護之敘述，下列何者正確？", "options": ["以疾病治癒為導向", "僅提供病人支持性照護直到死亡為止", "照護範圍以疼痛控制和症狀緩解為限", "針對生命受威脅疾病的病人與其家屬提供照護"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-53", "explanation": "安寧緩和療護是為生命受威脅疾病的病人「及其家屬」提供照護，故選 D。並非以治癒為導向，亦不限於疼痛與症狀控制。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 54, "stem": "有關臨終病人的生理變化，下列何者正確？", "options": ["腸蠕動增快造成腹瀉失禁", "呼吸道分泌物增加", "肢體末端溫熱潮紅且乾燥", "視覺是最後消失的知覺"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-54", "explanation": "臨終病人呼吸道分泌物增加（瀕死嘎音），故選 B。腸蠕動減慢、肢端變冷發紺、聽覺為最後消失的知覺（非視覺）。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 55, "stem": "下列何者不是病人的權利？", "options": ["可延長住院期限獲取醫療保險給付", "知道自己的診斷、進展與治療內容", "閱讀、影印自己的病歷或相關文件", "拒絕非其意願之治療及護理活動"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-55", "explanation": "延長住院以獲取保險給付並非病人權利，故選 A。得知診斷病情、閱覽影印病歷、拒絕非意願之治療皆為病人權利。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 56, "stem": "趙先生 68 歲，意識清楚，診斷肝硬化合併食道靜脈曲張，血小板：22,000/μL，痰乾且量少，因病人 發燒寒顫，醫師開立收集痰液培養（sputum culture）之醫囑，護理人員應如何執行最為適當？", "options": ["以抽痰方式取得痰液，抽吸壓力維持於 150～170mmHg", "鼓勵病人深呼吸後，立刻用力咳出痰液", "鼓勵先以漱口劑清潔口腔，避免標本污染", "先給予 0.45% NaCl 噴霧吸入，稀釋痰液後配合呼氣咳痰"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-56", "explanation": "血小板極低的病人採痰宜先給 0.45% NaCl 噴霧稀釋痰液後配合呼氣咳痰，較安全，故選 D。避免高壓抽吸與可能污染的漱口劑。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 57, "stem": "有關目標管理的敘述，下列何者錯誤？", "options": ["可衡量的具體目標", "主管決策", "明確的期限", "績效的回饋評估"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-57", "explanation": "本題選錯誤。目標管理（MBO）強調共同參與設定目標，而非僅由主管決策，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 58, "stem": "資訊時代，必須注意環境中有許多影響因素，務必依據情況的變化進行適度調整，才能永續經營。此 論述比較接近下列那個時期的觀點？", "options": ["古典時期（傳統理論時期）", "新古典時期（修正理論時期）", "新近時期或現代時期（系統理論時期）", "後現代理論時期"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-58", "explanation": "強調隨環境變化調整以永續經營，屬系統理論（現代時期）觀點，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 59, "stem": "某護理長認為護理人員天性喜歡工作、願意學習且具有潛力，故使用激勵方式引導護理人員發揮才 能。請問是採用下列那一種管理理論？", "options": ["麥克葛雷格（Douglas McGregor）的 X 理論", "麥克葛雷格（Douglas McGregor）的 Y 理論", "大內（William Ouchi）的 Z 理論", "費堯（Henri Fayol）的管理程序理論"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-59", "explanation": "認為員工天性喜歡工作、具潛力並以激勵引導，屬麥克葛雷格的 Y 理論，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 60, "stem": "下列何者屬於非量性的決策工具？", "options": ["腦力激盪法", "模擬法", "排列法", "作業研究法"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-60", "explanation": "腦力激盪法屬非量性（質性）決策工具，故選 A；模擬法、排列法、作業研究屬量性工具。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 61, "stem": "下列何者為規劃護理管理工作之核心觀念？", "options": ["分析資料", "決策", "簡化流程", "開源節流"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-61", "explanation": "規劃護理管理的核心觀念是決策，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 62, "stem": "進行規劃革新護理管理活動時，下列目標設定何者最佳？", "options": ["提升住院病人滿意度至 100%", "降低中心靜脈導管感染率", "於 6 個月內降低病人壓瘡發生率至 0.10%", "提升護理人員留任率"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-62", "explanation": "最佳目標須具體、可衡量且有期限，如「6 個月內降低壓瘡發生率至 0.10%」，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 63, "stem": "有關排班的敘述，下列何者正確？", "options": ["由單位小組長排班稱為集權式排班", "排班表是一種很好的獎懲工具", "為達排班一貫性，排班後不得更換", "應優先考量病人的需求"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-63", "explanation": "排班應優先考量病人需求，故選 D。小組長排班屬分權式、排班表不宜作為獎懲工具、必要時可調整。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 64, "stem": "某病房 40 床，一年實際上班天數為 258 天，每日工時 8 小時，共 16 位護理師，5 月份有 3 位護理師 離職，為維持每位病人每天護理時數為 4 小時，可以控制下列那一項？", "options": ["占床率", "每日工作時數", "上班天數", "病人嚴重度"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-64", "explanation": "在人力與工時固定下，欲維持每床每日護理時數，可調控的是占床率，故選 A。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 65, "stem": "在人力資源管理體系中，設計員工行為規範可以使組織成員導向共同行為和工作習慣。成功的行為 規範設計應注意幾項原則，下列何者較不適當？", "options": ["合理合法", "普遍適用", "具體簡潔", "個別彈性"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-65", "explanation": "本題選較不適當。行為規範應普遍適用，而非因人而異的「個別彈性」，故 D 較不適當。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 66, "stem": "下列何項不是運用資訊科技促進病人安全？", "options": ["將藥物資訊列印於藥袋標籤", "張貼標示禁止查詢病人隱私", "利用條碼協助藥物辨識", "線上查詢藥物交互作用"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-66", "explanation": "張貼禁止查詢病人隱私的標示並非運用資訊科技促進病安，故選 B。條碼辨識、藥袋標示、線上查交互作用才是。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 67, "stem": "選擇品質改善項目之優先順序，下列何者應為優先項目？", "options": ["最困難改善", "最容易改善", "最高發生頻率", "最低花費的改善活動"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-67", "explanation": "品質改善優先順序應以最高發生頻率者優先，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 68, "stem": "為提升醫院的研發能力，醫院集結各領域的研究創新人才，組成一個新的育成中心。此種組織結構設 計屬於下列何種類型？", "options": ["矩陣式", "功能式", "直線－幕僚式", "扁平式"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-68", "explanation": "集結各領域研究人才依專長組成新中心，屬功能式組織結構，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 69, "stem": "使用多項護理人力的彈性運用策略，以解決護理人力短缺問題，下列何者屬於「數量彈性」？", "options": ["工作分享制", "工作多樣化", "專業性分工", "領導彈性"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-69", "explanation": "工作分享制屬「數量彈性」策略，故選 A；工作多樣化、專業分工屬功能彈性。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 70, "stem": "有關人力資源管理，下列何者不是護理員工教育訓練之目的？", "options": ["協助角色適應", "作為考核依據", "提升專業能力", "減少執業疲潰"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-70", "explanation": "作為考核依據並非員工教育訓練的目的，故選 B。訓練目的在角色適應、提升專業能力與減少職業疲潰。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 71, "stem": "因個人擁有高度專業知識技能而贏得部屬的尊敬和信從，是屬於下列何種影響力？", "options": ["榜樣的影響力", "專家的影響力", "獎勵的影響力", "合法的影響力"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-71", "explanation": "因高度專業知能而獲部屬尊敬信從，屬專家的影響力，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 72, "stem": "在單位中若大部分的護理同仁為資淺且臨床能力較不足，但仍有意願完成工作，基於情境領導理論， 此時護理長宜採取下列何項領導行為？", "options": ["說明決策並提供機會讓同仁澄清疑問", "借助協調與溝通與同仁分享想法", "給予同仁明確命令與指導", "讓同仁參與建立標準作業流程"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-72", "explanation": "對資淺、能力不足但有意願的同仁（情境領導 R2），宜採「推銷/教練」式：說明決策並讓其澄清疑問，故選 A。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 73, "stem": "病人因水腫氣喘至急診求助，經檢傷分類後至內科急診區域等候。護理師幫該病人抽血後，等候 50 分鐘才取得抽血報告。家屬因不耐久候、情緒失控，大吵大鬧。約 10 分鐘後醫師來看病人並解說病 情。家屬抱怨等了 2 個小時，非常生氣，不聽醫療人員的說明。醫師見狀「冷處理」，家屬情緒更加 激動。根據上述情境，醫師為了等待抽血結果才能進行後續醫療處置，但病人家屬是希望醫師趕快緩 解病人氣喘及水腫的問題。依據 Daft & Marcic（2001）之分類，此為下列何種原因所產生的衝突？", "options": ["急診人力不足", "雙方個性價值觀不同", "雙方目標不一致", "雙方權力與地位不同"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-73", "explanation": "醫師要等抽血結果、家屬要立即緩解症狀，屬雙方目標不一致所生之衝突，故選 C（Daft & Marcic）。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 74, "stem": "承上題，醫師看到家屬正在氣頭上，於是以「冷處理」應對，並希望收集更多資料後再做進一步反 應。依據 Thomas（1976）的衝突處理行為，醫師的應對是屬於下列何種行為？", "options": ["逃避", "順從", "競爭", "妥協"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-74", "explanation": "醫師以冷處理並待收集更多資料再反應，屬 Thomas 衝突處理中的「逃避」，故選 A。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 75, "stem": "有關各成本項目之歸屬，下列何者正確？", "options": ["固定成本：門診量、手術量、電腦斷層機器之折舊", "變動成本：手術室護理師薪水、手術床折舊、外科主任之薪水", "間接成本：醫院水電費、資訊室費用、醫師薪水", "直接成本：護理師薪水、衛材費用、醫師薪水"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-75", "explanation": "直接成本包括護理師薪水、衛材費用、醫師薪水，故選 D。其餘選項之成本歸屬皆有誤。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 76, "stem": "醫院評鑑之具體執行內容，下列何者屬於評鑑醫療服務之結果面指標？", "options": ["加護病房病人中央靜脈導管換藥正確性", "加護病房病人血流感染率", "首次接受化學治療病人護理指導完整率", "手術同意書填寫完整率"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-76", "explanation": "加護病房血流感染率屬結果面指標，故選 B；換藥正確性、指導完整率、同意書完整率屬過程面。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 77, "stem": "醫院廢棄物分類中，下列何者為一般性醫療廢棄物？", "options": ["與針頭相連之注射筒及輸液導管", "蓋玻片或破裂之玻璃器皿", "致癌或可能致癌之細胞毒素", "非有害藥用玻璃瓶或藥水容器"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-77", "explanation": "非有害的藥用玻璃瓶或藥水容器屬一般性醫療廢棄物，故選 D；針具、破玻璃、細胞毒素屬有害廢棄物。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 78, "stem": "某病房最近發生集體院內感染，護理部主任經與督導個別討論後，主任決定要求護理長提出改善方 案，此決策模式屬於下列何種決策？", "options": ["團體一型", "團體二型", "諮商一型", "諮商二型"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-78", "explanation": "主任與督導個別討論後自行決定，屬 Vroom 決策模式中的諮商一型（CI，個別諮詢），故選 C。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 79, "stem": "醫院湧入大量粉塵爆傷患，經此嚴重的災難後，醫院為推動持續品質改善機制，下列何者較適合作為 事後分析工具？", "options": ["危害分析", "PDCA 循環", "失效模式分析", "SWOT 分析"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-79", "explanation": "災難後推動持續品質改善，適合以 PDCA 循環作為事後分析工具，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基本護理學", "num": 80, "stem": "有關平衡計分卡的敘述，下列何者錯誤？", "options": ["包含品質構面、顧客構面、內部流程、學習與成長等 4 項構面", "績效評核指標之管理工具", "以機構願景與策略訂定可衡量指標", "可作為與員工間溝通的工具"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "110-1-2104-80", "explanation": "本題選錯誤。平衡計分卡四構面為財務、顧客、內部流程、學習與成長，並無「品質構面」，故 A 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 1, "stem": "在青春期，下列何者對長骨的「縱向生長」最為重要？", "options": ["骨外膜（periosteum）", "骨內膜（endosteum）", "骨骺板（epiphyseal plate）", "骨骺線（epiphyseal line）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-1", "explanation": "青春期長骨縱向生長最重要的是骨骺板（生長板），故選 C；骨骺線是生長板閉合後的痕跡。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 2, "stem": "下列椎骨中，何者的棘突（spinous process）最長？", "options": ["第 5 頸椎", "第 5 胸椎", "第 5 腰椎", "第 5 薦椎"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-2", "explanation": "胸椎（尤其中段如第 5 胸椎）棘突細長且向下傾斜，為最長者，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 3, "stem": "下列何者參與圍成股三角（femoral triangle）？", "options": ["股內側肌（vastus medialis）", "股外側肌（vastus lateralis）", "縫匠肌（sartorius）", "恥骨肌（pectineus）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-3", "explanation": "股三角由腹股溝韌帶（上）、縫匠肌（外）、內收長肌（內）圍成，故選 C（縫匠肌）；恥骨肌構成底部。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 4, "stem": "關於心臟腔室的敘述，下列何者錯誤？", "options": ["梳狀肌位於心房內壁", "卵圓窩位於心房間隔上", "房室瓣上面有腱索附著，並連接到心房", "心臟表面的冠狀溝，位於心房與心室的界線上"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-4", "explanation": "本題選錯誤。腱索連接房室瓣瓣膜與心室的乳頭肌，並非連接到心房，故 C 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 5, "stem": "下列關於紅血球（erythrocyte; RBC）的敘述，何者正確？", "options": ["呈雙凹圓盤狀，直徑大約 7～8 奈米（nm）", "人類的紅血球發育成熟後具有多葉狀的細胞核", "血紅素含有鐵原子，可與氧氣或二氧化碳結合", "O+型血液，係指紅血球表面同時有 O 型與 Rh 型的抗原"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-5", "explanation": "血紅素含鐵原子，可結合氧或二氧化碳，故選 C。紅血球直徑約 7～8 微米（非奈米）、成熟後無細胞核、O 型是指無 A/B 抗原。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 6, "stem": "下列那個胃腺細胞，主要產生鹽酸與內在因子？", "options": ["黏液頸細胞（mucous neck cell）", "壁細胞（parietal cell）", "主細胞（chief cell）", "腸內分泌細胞（enteroendocrine cell）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-6", "explanation": "胃壁細胞（parietal cell）分泌鹽酸與內在因子，故選 B；主細胞分泌胃蛋白酶原。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 7, "stem": "下列何者位於延髓（medulla oblongata）？", "options": ["乳頭體（mammillary body）", "四疊體（corpora quadrigemina）", "錐體（pyramid）", "松果體（pineal body）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-7", "explanation": "錐體位於延髓，故選 C；乳頭體屬下視丘、四疊體屬中腦、松果體屬上視丘。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 8, "stem": "下列關於內分泌細胞的敘述，何者錯誤？", "options": ["松果腺細胞分泌褪黑素（melatonin）", "胰臟 alpha 細胞分泌升糖素（glucagon）", "副甲狀腺主細胞（chief cells）分泌副甲狀腺素（parathyroid hormone）", "腎上腺皮質絲球帶細胞（zona glomerulosa cells）分泌糖皮質激素（glucocorticoid）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-8", "explanation": "本題選錯誤。腎上腺皮質絲球帶分泌的是礦物皮質激素（醛固酮），糖皮質激素由束狀帶分泌，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 9, "stem": "間盤（intercalated disc）為下列何者之特殊結構？", "options": ["骨骼肌", "心肌", "平滑肌", "橫紋肌"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-9", "explanation": "間盤（intercalated disc）為心肌特有的構造，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 10, "stem": "總膽管與胰管匯聚形成肝胰壺腹（hepatopancreatic ampulla），開口於下列何處？", "options": ["胃的幽門部", "胃的賁門部", "十二指腸", "空腸"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-10", "explanation": "總膽管與胰管匯聚成的肝胰壺腹開口於十二指腸，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 11, "stem": "下列男性生殖系統，何者具有靜纖毛（stereocilia）構造，以及儲存精子的功能？", "options": ["睪丸（testis）", "副睪（epididymis）", "精囊（seminal vesicle）", "前列腺（prostate gland）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-11", "explanation": "副睪具靜纖毛並有儲存精子功能，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 12, "stem": "肺臟內的那一構造，只具有傳送氣體的導管功用，但是不具備氣體交換的功能？", "options": ["肺泡囊（alveolar sac）", "肺泡管（alveolar duct）", "終末細支氣管（terminal bronchiole）", "呼吸性細支氣管（respiratory bronchiole）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-12", "explanation": "終末細支氣管僅具傳送氣體功能、無氣體交換，故選 C；呼吸性細支氣管已可進行部分交換。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 13, "stem": "下列那一種器官主要負責尿液（urine）的形成？", "options": ["腎臟（kidney）", "輸尿管（ureter）", "膀胱（urinary bladder）", "尿道（urethra）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-13", "explanation": "尿液的形成主要在腎臟，故選 A；輸尿管、膀胱、尿道負責運送與貯存排出。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 14, "stem": "依照大腸（large intestine）前後排列之順序，下列何者在最前端？", "options": ["升結腸", "降結腸", "盲腸", "迴腸"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-14", "explanation": "大腸最前端（起始）為盲腸，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 15, "stem": "下列何者不是由腹膜（peritoneum）衍生形成的構造？", "options": ["大網膜", "小網膜", "肝圓韌帶", "腸繫膜"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-15", "explanation": "肝圓韌帶為臍靜脈退化的殘跡，非腹膜衍生構造，故選 C；大小網膜與腸繫膜皆由腹膜形成。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 16, "stem": "下列何者包覆陰蒂（clitoris），形成陰蒂的包皮（prepuce of clitoris）？", "options": ["陰阜（mons pubis）", "大陰唇（labia majora）", "小陰唇（labia minora）", "陰道前庭（vaginal vestibule）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-16", "explanation": "陰蒂包皮由小陰唇包覆形成，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 17, "stem": "何時次級卵母細胞（secondary oocyte）會完成第二次減數分裂？", "options": ["胚胎時期", "出生時", "排卵時", "受精時"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-17", "explanation": "次級卵母細胞在受精時才完成第二次減數分裂，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 18, "stem": "以間隙接合（gap junction）形成的電性突觸（electrical synapse）並不存在於：", "options": ["心肌細胞", "平滑肌細胞", "骨骼肌細胞", "神經細胞"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-18", "explanation": "以間隙接合形成的電性突觸不存在於骨骼肌，故選 C；心肌、平滑肌與神經細胞則有。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 19, "stem": "心肌細胞興奮時會增加細胞質中鈣離子的濃度，下列敘述何者正確？", "options": ["從細胞外流入的鈣離子量等於從肌漿網釋放的量", "從細胞外流入的鈣離子量大於從肌漿網釋放的量", "從細胞外流入的鈣離子量小於從肌漿網釋放的量", "從細胞外流入的鈣離子量等於從粒線體釋放的量"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-19", "explanation": "心肌收縮採鈣誘發鈣釋放，由細胞外流入的鈣量小於肌漿網釋放量，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 20, "stem": "二氧化碳在血液中運送的各種形式，其中比例最高的形式是下列何者？", "options": ["氣態二氧化碳", "溶於血漿中之二氧化碳", "碳醯胺基血紅素（carbaminohemoglobin）", "碳酸氫根離子（HCO₃⁻）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-20", "explanation": "二氧化碳在血液中以碳酸氫根離子（HCO₃⁻）形式運送比例最高，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 21, "stem": "下列何者在小腸液中的含量最低？", "options": ["蔗糖酶（sucrase）", "肝醣酶（glycogenase）", "乳糖酶（lactase）", "麥芽糖酶（maltase）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-21", "explanation": "小腸液中肝醣酶含量最低（澱粉/肝醣主要由胰澱粉酶處理），故選 B；蔗糖酶、乳糖酶、麥芽糖酶則存在。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 22, "stem": "有關靜止膜電位（resting membrane potential）之敘述，下列何者正確？", "options": ["細胞外鉀離子濃度增加，靜止膜電位減小", "細胞外鉀離子濃度減少，靜止膜電位減小", "細胞內鉀離子濃度增加，靜止膜電位減小", "細胞內鉀離子濃度增加，靜止膜電位不變"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-22", "explanation": "細胞外鉀離子濃度增加會使靜止膜電位變小（去極化），故選 A。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 23, "stem": "死亡後開始出現肌肉僵硬的現象，主要是由下列那一個原因造成？", "options": ["乳酸的堆積", "缺少鈣離子", "肝醣耗盡", "缺乏 ATP"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-23", "explanation": "死後肌肉僵硬（屍僵）主要因缺乏 ATP，肌動與肌凝蛋白無法解離，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 24, "stem": "關於視覺路徑，物體影像經水晶體投射至視網膜時，其影像與原物體方位相比較，下列敘述何者正確？", "options": ["影像方位與原物體相同", "影像呈現上下顛倒且左右相反", "影像呈現上下顛倒，但左右與原物體相同", "影像呈現左右相反，但上下與原物體相同"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-24", "explanation": "
