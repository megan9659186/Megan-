"explanation": "近曲小管中鈉離子主要與葡萄糖共同運輸進入上皮細胞（SGLT），故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 31, "stem": "腎臟對水的再吸收與下列何種離子最為相關？", "options": ["鈉離子", "鉀離子", "磷離子", "氫離子"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-31", "explanation": "腎臟對水的再吸收與鈉離子最為相關，故選 A。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 32, "stem": "有關脂溶性維生素的敘述，下列何者錯誤？", "options": ["吸收不受膽汁分泌的影響", "包含維生素 A、D、E 與 K", "溶解在微膠粒（micelle）中", "在小腸中被吸收進入人體"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-32", "explanation": "本題選錯誤。脂溶性維生素的吸收「需要」膽汁協助乳化，故「不受膽汁影響」錯誤，選 A。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 33, "stem": "40 歲女性出現手指僵硬，吞嚥困難及非發炎性真皮明顯纖維化。此人最可能罹患下列何種疾病？", "options": ["皮肌炎（dermatomyositis）", "全身性硬皮病（systemic scleroderma）", "修格連氏症候群（Sjögren syndrome）", "僵直性脊椎炎（ankylosing spondilitis）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-33", "explanation": "手指僵硬、吞嚥困難併非發炎性真皮纖維化，最可能為全身性硬皮病，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 34, "stem": "下列何種感染最容易發生在燒燙傷的病人？", "options": ["結核桿菌（Mycobacterium tuberculosis）", "大腸桿菌（Escherichia coli）", "隱球菌（Cryptococcus）", "綠膿桿菌（Pseudomonas aeruginosa）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-34", "explanation": "燒燙傷病人最易感染綠膿桿菌，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 35, "stem": "堵塞性血栓血管炎（thromboangiitis obliterans）最常侵犯身體何處的血管？", "options": ["腦", "腳", "腎", "脾"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-35", "explanation": "堵塞性血栓血管炎（柏格氏病）最常侵犯四肢（腳）血管，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 36, "stem": "下列何者不屬於 B 細胞（B lymphocyte）腫瘤？", "options": ["慢性淋巴細胞白血病（chronic lymphocytic leukemia）", "濾泡性淋巴瘤（follicular lymphoma）", "伯基特氏淋巴瘤（Burkitt’s lymphoma）", "蕈樣肉芽腫（mycosis fungoides）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-36", "explanation": "蕈樣肉芽腫為 T 細胞淋巴瘤，不屬 B 細胞腫瘤，故選 D；CLL、濾泡性與伯基特氏淋巴瘤皆為 B 細胞源。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 37, "stem": "下列何者不是潰瘍性結腸炎（ulcerative colitis）的臨床病理特徵？", "options": ["通常僅侷限於黏膜層和黏膜下層", "易產生肉芽腫", "是一種連續性病變", "是發生大腸癌的危險因子"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-37", "explanation": "本題選非特徵。易產生肉芽腫是克隆氏症的特徵，非潰瘍性結腸炎，故選 B；UC 為侷限黏膜層之連續性病變、且為大腸癌危險因子。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 38, "stem": "有關微量變化疾病（minimal change disease）之敘述，下列何者正確？", "options": ["90%以上的病人對類固醇治療反應良好", "50%以上的病人，終究會出現慢性腎衰竭", "以血尿（hematuria）為主要表現", "因免疫沉澱物所引發"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-38", "explanation": "微量變化疾病 90% 以上對類固醇反應良好，故選 A；以蛋白尿（腎病症候群）表現、少進展至慢性腎衰竭、無免疫沉澱。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 39, "stem": "下列何種乳房疾病是造成乳頭的派吉特氏症（Paget disease）的最主要成因？", "options": ["纖維狀變化（fibrocystic change）", "化膿性乳房炎（suppurative mastitis）", "乳管原位癌（ductal carcinoma in situ）", "葉狀瘤（phyllodes tumor）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-39", "explanation": "乳頭派吉特氏症最主要成因為乳管原位癌，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 40, "stem": "骨質疏鬆症（osteoporosis）與下列那一徵候較無關？", "options": ["發燒", "疼痛", "骨折", "脊柱側彎"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-40", "explanation": "骨質疏鬆與發燒較無關，故選 A；疼痛、骨折與脊柱變形（側彎/駝背）則相關。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 41, "stem": "下列細胞形態或胞器的改變，何者是屬於細胞可逆性的損傷？", "options": ["脂肪變性", "溶酶體破裂", "細胞核溶解", "細胞核破裂"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-41", "explanation": "脂肪變性屬可逆性細胞損傷，故選 A；溶酶體破裂、細胞核溶解與破裂屬不可逆之壞死變化。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 42, "stem": "下列有關栓塞（embolism）的敘述，何者最不適當？", "options": ["發生嚴重長骨骨折的病人可能會發生脂肪栓塞", "全身性血栓栓塞是指靜脈循環中的栓子，大部分來自深部腿靜脈", "深海潛水伕上升水面速度太快易引發空氣栓塞", "羊水栓塞是羊水或其內容物經由破裂的子宮靜脈進入母體循環所造成"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-42", "explanation": "本題選最不適當。全身性（動脈）血栓栓塞多源自心臟/動脈；來自深部腿靜脈的栓子造成的是肺栓塞，故 B 敘述不當。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 43, "stem": "下列何種腫瘤的細胞來源是上皮細胞（epithelial cells）？", "options": ["脂肪瘤（lipoma）", "血管瘤（hemangioma）", "淋巴瘤（lymphoma）", "乳頭狀瘤（papilloma）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-43", "explanation": "乳頭狀瘤來源為上皮細胞，故選 D；脂肪瘤、血管瘤、淋巴瘤分別源自脂肪、血管與淋巴組織。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 44, "stem": "下列何者不是威爾森氏病（Wilson disease）的特徵？", "options": ["為體染色體顯性遺傳（autosomal dominant inheritance）疾病", "銅離子無法被代謝，沉積在肝、腦等器官", "眼睛角膜周圍可見棕綠色環", "可能有神經及精神症狀"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-44", "explanation": "本題選非特徵。威爾森氏病為體染色體「隱性」遺傳，非顯性，故 A 錯誤；銅沉積於肝腦、角膜可見 K-F 環並有神經精神症狀。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 45, "stem": "病人突然發生呼吸短促、呼吸困難。顯微鏡下可見支氣管壁的平滑肌肥大，黏膜下腺體增生，伴有炎 症反應，特別是嗜酸性白血球（eosinophils）增多。上列敘述最可能是那一種病症的組織反應？", "options": ["急性肺炎", "支氣管擴大症", "肺氣腫", "過敏性氣喘"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-45", "explanation": "平滑肌肥大、黏膜下腺體增生併嗜酸性白血球浸潤，最符合過敏性氣喘，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 46, "stem": "克林氏潰瘍（Curling ulcer）最容易發生在那種病人身上？", "options": ["長期服用阿司匹靈（Aspirin）", "嚴重燒傷", "車禍之後嚴重頭痛", "感染幽門螺旋桿菌"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-46", "explanation": "克林氏潰瘍（Curling ulcer）好發於嚴重燒傷病人，故選 B；顱腦損傷相關者為 Cushing 潰瘍。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 47, "stem": "陰莖鱗狀細胞瘤及前驅病變，與下列何種病毒最有關？", "options": ["人類乳突瘤病毒（human papilloma virus; HPV）", "EB 病毒（Epstein-Barr virus; EBV）", "人類疱疹病毒（human herpes virus-8; HHV8）", "人類免疫缺失病毒（human immunodeficiency virus; HIV）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-47", "explanation": "陰莖鱗狀細胞瘤及前驅病變與人類乳突瘤病毒（HPV）最相關，故選 A。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 48, "stem": "關於正常骨折癒合的過程，下列那一個順序是正確的？", "options": ["有機化血塊（organizing hematoma）→軟性骨痂（soft callus）→骨性骨痂（bony callus）→層狀硬 骨（lamellar bone）", "有機化血塊（organizing hematoma）→骨性骨痂（bony callus）→層狀硬骨（lamellar bone）→軟性 骨痂（soft callus）", "有機化血塊（organizing hematoma）→軟性骨痂（soft callus）→層狀硬骨（lamellar bone）→骨性 骨痂（bony callus）", "有機化血塊（organizing hematoma）→層狀硬骨（lamellar bone）→軟性骨痂（soft callus）→骨性 骨痂（bony callus）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-48", "explanation": "正常骨折癒合順序為：有機化血塊 → 軟性骨痂 → 骨性骨痂 → 層狀硬骨，故選 A。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 49, "stem": "國產藥物與外國原廠的藥物，口服後之時間-血中濃度曲線下之面積相同時，表示此兩種藥物具有何 種相同性質？", "options": ["生體可用率（bioavailability）", "首渡效應（first-pass effect）", "藥物代謝速率（metabolic rate）", "生體相等性（bioequivalence）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-49", "explanation": "時間-血中濃度曲線下面積（AUC）相同代表兩藥具生體相等性，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 50, "stem": "下列何者不是抗癲癇藥物的作用機轉？", "options": ["影響特定離子通道的通透性", "阻斷興奮性麩胺酸（glutamate）受體", "活化抑制性 γ-胺基丁酸（GABA）受體", "阻斷正腎上腺素（norepinephrine）受體"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-50", "explanation": "抗癲癇藥機轉包括影響離子通道、阻斷麩胺酸受體、活化 GABA 受體；阻斷正腎上腺素受體並非其機轉，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 51, "stem": "阿司匹靈（Aspirin）與下列何種藥物併用會增加血中濃度，而使危險性提高？", "options": ["Antacids", "Warfarin", "Heparin", "Probenecid"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-51", "explanation": "Aspirin 與 Warfarin 併用會提高其血中濃度與出血危險，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 52, "stem": "高血壓用藥 furosemide 在分類上屬於下列何者？", "options": ["保鉀利尿劑", "滲透性利尿劑", "亨利氏環利尿劑", "碳酸酐酶抑制劑"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-52", "explanation": "Furosemide 屬亨利氏環利尿劑，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 53, "stem": "有關可待因（codeine）的敘述，下列何者錯誤？", "options": ["具成癮性", "具止咳作用", "止咳劑量低於止痛劑量", "容易出現腹瀉之副作用"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-53", "explanation": "本題選錯誤。可待因等鴉片類會造成「便祕」而非腹瀉，故 D 錯誤；其具成癮性、止咳作用，止咳劑量低於止痛劑量。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 54, "stem": "腎臟功能不良的高齡病人，若以 vancomycin 治療其嚴重感染症，要特別注意下列何種副作用？", "options": ["耳毒性", "癲癇", "腹瀉", "白內障"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-54", "explanation": "腎功能不良高齡者使用 vancomycin 須注意耳毒性（及腎毒性），故選 A。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 55, "stem": "下列何者不是 physostigmine 的作用？", "options": ["膀胱逼尿肌收縮", "瞳孔放大", "血壓下降", "心跳減速"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-55", "explanation": "Physostigmine 為抗膽鹼酯酶，會使瞳孔「縮小」，故「瞳孔放大」非其作用，選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 56, "stem": "下列何者不是 phenytoin 的副作用？", "options": ["牙齦增生", "複視", "Steven-Johnson 症候群", "體重增加"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-56", "explanation": "Phenytoin 副作用有牙齦增生、複視、Steven-Johnson 症候群；體重增加非其典型副作用，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 57, "stem": "下列何種安眠藥物被濫用的可能性較低，而未被列為管制藥品？", "options": ["Zolpidem", "Zaleplon", "Eszopiclone", "Ramelteon"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-57", "explanation": "Ramelteon 為褪黑激素受體致效劑，濫用可能性低、未列管制藥，故選 D；Z 類藥物則屬管制。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 58, "stem": "Alteplase 主要用於治療急性缺血性中風、心肌梗塞、肺栓塞、深部靜脈栓塞，其藥理作用機轉為何？", "options": ["不可逆結合抑制凝血酶 IIa", "可逆結合抑制凝血酶 Xa", "活化已經和血栓結合之胞漿素原（fibrin-bound plasminogen）", "活化 vitamin K 環氧化還原酶（epoxide reductase）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-58", "explanation": "Alteplase（tPA）活化與血栓結合的胞漿素原以溶解血栓，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 59, "stem": "Nitroglycerin（NTG）經由舌下或經皮膚（貼劑）給藥的目的為何？", "options": ["以利併用其他擴增冠狀動脈循環用藥", "減少低血壓之副作用", "避開肝臟代謝之首渡效應", "減少反射性心搏過速之副作用"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-59", "explanation": "NTG 舌下或經皮給藥可避開肝臟首渡效應，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 60, "stem": "下列何種藥物是經由抑制多巴胺受體（dopamine receptor）而產生止吐作用，可用以治療化療藥物所造成 之噁心嘔吐？", "options": ["Aprepitant", "Dexamethasone", "Ondansetron", "Prochlorperazine"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-60", "explanation": "Prochlorperazine 藉阻斷多巴胺受體止吐，可用於化療引起之噁心嘔吐，故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 61, "stem": "關於 corticosteroid 的臨床用途，下列何者錯誤？", "options": ["診斷庫欣氏症候群（Cushing’s syndrome）", "治療腎上腺皮質機能不全", "治療白內障", "緩解異位性皮膚炎"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-61", "explanation": "本題選錯誤。類固醇會「誘發」白內障而非治療白內障，故 C 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 62, "stem": "下列何種藥物可用於治療肢端肥大症（acromegaly）？", "options": ["Octreotide", "Somatropin", "Methimazole", "Leuprolide"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-62", "explanation": "肢端肥大症可用體抑素類似物 Octreotide 治療，故選 A。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 63, "stem": "下列何者的藥理作用機轉是抑制細胞內微小管（microtubule）的聚合，並具有較低的骨髓抑制作用？", "options": ["Colchicine", "Docetaxel", "Vinblastine", "Vincristine"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-63", "explanation": "Vincristine 抑制微小管聚合且骨髓抑制較低（劑量限制為神經毒性），故選 D。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 64, "stem": "下列何者與磺胺藥（sulfadoxine）混合使用，以治療弓形蟲（Toxoplasma gondii）之感染？", "options": ["Ciprofloxacin", "Metronidazole", "Pyrimethamine", "Trimethoprim"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-64", "explanation": "治療弓形蟲常以 Pyrimethamine 併用磺胺藥（sulfadoxine），故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 65, "stem": "下列何者存在於動物細胞，而不存在於細菌？", "options": ["核糖體（ribosome）", "細胞壁（cell wall）", "質體（plasmid）", "溶酶體（lysosome）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-65", "explanation": "溶酶體存在於動物細胞而不存在於細菌，故選 D；核糖體兩者皆有，細胞壁與質體為細菌所有。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 66, "stem": "惡性貧血的病因是因為體內產生對抗下列何者的自體抗體？", "options": ["維生素 C", "維生素 B12 內在因子（intrinsic factor）", "胰島素（insulin）", "血清素（serotonin）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-66", "explanation": "惡性貧血是體內產生對抗維生素 B12 內在因子的自體抗體，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 67, "stem": "藍氏（Lancefield）血清學分類法，主要是依溶血性鏈球菌之何種構造的抗原不同加以分類？", "options": ["細胞壁", "細胞膜", "細胞質", "細胞核"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-67", "explanation": "藍氏血清學分類依鏈球菌「細胞壁」醣類抗原不同分類，故選 A。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 68, "stem": "下列何者目前沒有疫苗可以預防？", "options": ["百日咳桿菌", "淋病雙球菌", "流行性感冒嗜血桿菌", "破傷風桿菌"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-68", "explanation": "淋病雙球菌目前尚無疫苗可預防，故選 B；百日咳、b 型嗜血桿菌、破傷風皆有疫苗。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 69, "stem": "包氏螺旋體（Borrelia）感染除了萊姆病（Lyme disease）外，主要造成何種人類疾病？", "options": ["梅毒", "腦膜炎", "回歸熱", "食物中毒"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-69", "explanation": "包氏螺旋體除萊姆病外，主要造成回歸熱，故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 70, "stem": "下列何者是致死率極高，目前世界衛生組織宣布已經被人類消滅之 DNA 病毒？", "options": ["天花病毒", "伊波拉病毒", "漢他病毒", "E 型肝炎病毒"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-70", "explanation": "世界衛生組織宣布已消滅、致死率極高的 DNA 病毒為天花病毒，故選 A。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 71, "stem": "下列何種病毒主要由齧齒類動物為媒介傳播至人？", "options": ["日本腦炎病毒", "漢他病毒", "黃熱病病毒", "委內瑞拉腦炎病毒"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-71", "explanation": "漢他病毒主要以齧齒類為媒介傳播至人，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 72, "stem": "下列何者不是 prion 的主要特性？", "options": ["可濾過性，具傳染性", "具有蛋白質", "不具有核酸", "可引起免疫反應"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-72", "explanation": "本題選非特性。Prion 不含核酸、僅為蛋白質、具傳染性，但「不會引起免疫反應」，故 D（可引起免疫反應）為非特性。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 73, "stem": "下列何種器官移植，較可能發生移植體對抗宿主疾病（graft-versus-host disease; GVHD）？", "options": ["肝臟移植", "心臟移植", "骨髓移植", "腎臟移植"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-73", "explanation": "骨髓移植較易發生移植體對抗宿主疾病（GVHD），故選 C。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 74, "stem": "五大主要類型的免疫球蛋白（immunoglobulin）具有不同的性質與功能，下列敘述何者正確？", "options": ["IgA 與造成全身性過敏反應有關", "所有類型的免疫球蛋白都能通過胎盤", "IgG 是半衰期最長的免疫球蛋白", "IgE 是固定補體最有效率的免疫球蛋白"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-74", "explanation": "IgG 是半衰期最長的免疫球蛋白，故選 C。全身性過敏與 IgE 有關、僅 IgG 可通過胎盤、固定補體最有效的是 IgM。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 75, "stem": "關於組織相容性複合體（MHC）的敘述，下列何者正確？", "options": ["樹突細胞利用第 I 類 MHC（MHC Class I）呈現抗原活化 CD4 T 細胞", "所有有核細胞均表現第 II 類 MHC（MHC Class II）", "蛋白分子必須經過適當的裂解形成短胜肽才能被 MHC 分子呈現", "第 I 類 MHC 主要呈現 11～13 個胺基酸的胜肽"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-75", "explanation": "蛋白須先裂解成短胜肽才能被 MHC 呈現，故選 C。MHC I 活化 CD8（非 CD4）、MHC II 僅表現於抗原呈現細胞、MHC I 呈現約 8～10 個胺基酸的胜肽。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 76, "stem": "關於各型大腸桿菌（Escherichia coli）的敘述，下列何者正確？", "options": ["志賀毒性大腸桿菌（Shiga toxin-producing E. coli; STEC）主要透過未煮熟的食物傳染，嚴重時會引 發出血性腹瀉", "腸毒素性大腸桿菌（Enterotoxigenic E. coli; ETEC）常以人傳人的方式造成旅行者腹瀉", "腸聚集性大腸桿菌（Enteroaggregative E. coli; EAEC）只會導致持續性腹瀉，並不會造成發炎反應", "腸病源性大腸桿菌（Enteropathogenic E. coli; EPEC）具有志賀毒素（Shiga toxin）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-76", "explanation": "STEC 主要經未煮熟食物傳染、嚴重時引發出血性腹瀉，故選 A。ETEC 非人傳人、EAEC 可致發炎、EPEC 不含志賀毒素。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 77, "stem": "有關梅毒螺旋菌（Treponema pallidum）的感染，下列敘述何者錯誤？", "options": ["第一期梅毒出現硬性下疳（hard chancre），感染後約 10～90 天會出現無痛性潰瘍", "第二期梅毒疹，在全身皮膚及黏膜出現紅疹（rash）", "第三期肉芽腫病變亦稱為梅毒腫（gummas），只出現在生殖器官", "細菌可經由子宮感染引起先天性梅毒，導致胎兒嚴重疾病"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-77", "explanation": "本題選錯誤。第三期梅毒腫（gummas）可出現於皮膚、骨骼、肝等多處，非只在生殖器官，故 C 錯誤。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 78, "stem": "下列何種特性不是白色念珠菌（Candida albicans）之主要致病因子？", "options": ["能黏附組織", "能合成黑色素", "能分泌蛋白酶", "能轉換表現型"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-78", "explanation": "白色念珠菌致病因子包括黏附、分泌蛋白酶與表現型轉換；合成黑色素為隱球菌特性，非念珠菌，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 79, "stem": "下列何種酵素與麴菌屬（Aspergillus）之毒性無關？", "options": ["彈性蛋白酶", "葉酸酶", "磷脂酶", "過氧化氫酶"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-79", "explanation": "麴菌毒性相關酵素有彈性蛋白酶、磷脂酶、過氧化氫酶；葉酸酶與其毒性無關，故選 B。"}, {"year": "110", "session": "第一次", "subject": "基礎醫學", "num": 80, "stem": "下列何種藥物治療蟠尾絲蟲（Onchocerca volvulus）引起的河川盲（river blindness）為首選藥物，而 且病人副作用最小？", "options": ["Tetracycline", "Ivermectin", "Praziquantel", "Mebendazole"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-1-1104-80", "explanation": "治療蟠尾絲蟲引起的河川盲，首選且副作用最小者為 Ivermectin，故選 B。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 1, "stem": "有關以家庭為中心的照護，下列敘述何者正確？", "options": ["家中每位成員的需求皆需要被注意及尊重", "醫療機構只能讓準父親陪產", "因孕產婦的自主權最重要，照護只需考量婦女需求", "婚姻的品質與婦女的支持系統無關"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-1", "explanation": "以家庭為中心的照護重視並尊重家中每位成員的需求，故選 A。陪產不限準父親、須兼顧家庭支持系統，婦女自主權重要但非唯一考量。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 2, "stem": "有關產婦接受腰椎硬膜外麻醉術可能發生的合併症，下列何者錯誤？", "options": ["低血壓", "胎兒心跳變異性增加", "脊髓性頭痛", "排尿困難"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-2", "explanation": "本題選錯誤。硬膜外麻醉可能造成低血壓、脊髓性頭痛、排尿困難；它會使胎心變異性「下降」而非增加，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 3, "stem": "有關妊娠期腸胃系統的變化所造成孕婦不適的現象，下列敘述何項正確？", "options": ["噁心與嘔吐是與胃蛋白酶分泌增加有關", "膽囊排空時間延長，膽汁排出量減少", "肝功能改變，如血漿白蛋白和球蛋白值上升", "唾液分泌減少，若口腔衛生不佳者易患齲齒"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-3", "explanation": "妊娠期膽囊排空延長、膽汁排出減少（易生膽結石），故選 B。噁心嘔吐與 hCG 有關、白蛋白下降、唾液分泌增加。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 4, "stem": "有關常見遺傳疾病之敘述，下列何項正確？", "options": ["唐氏症是 21 號染色體多一條，95%非遺傳所造成", "X 染色體脆折症為單基因遺傳疾病，女性發生率高於男性", "裘馨氏肌肉萎縮症是為染色體異常遺傳疾病，每胎產下重症寶寶機率為 1/4", "海洋性貧血為多基因遺傳疾病，也會受到環境因素共同調控而產生"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-4", "explanation": "唐氏症為 21 號染色體多一條，約 95% 為染色體不分離所致（非遺傳），故選 A。脆折 X 男性較嚴重、裘馨氏為 X 性聯隱性、海洋性貧血為單基因隱性遺傳。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 5, "stem": "第三妊娠期孕婦身體姿勢之敘述，下列何項正確？", "options": ["坐姿為挺直背脊，身體的重量壓力應集中在坐骨", "採後傾 30 度的半坐臥姿，身體的重量壓力應集中在尾骨", "坐時應儘量選擇無靠背椅子，大腿呈外八字可避免重心不穩及下背痛", "坐下時應側身手扶椅面，並先坐椅面前 1/3 再將臀部挪進中央"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-5", "explanation": "第三孕期坐姿宜挺直背脊、重量集中於坐骨，故選 A。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 6, "stem": "懷孕 32 週婦女接受無壓力性試驗（Nonstress Test; NST）20 分鐘後，未發現胎兒有活動訊號，下列 措施何者最適當？", "options": ["給予補充含糖電解質飲料，再監測", "立即安排住院密切觀察", "請孕婦返家，等到 34 週再監測", "鼻吸氧氣 2～3 L/min，30 分鐘後再監測"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-6", "explanation": "NST 20 分鐘無胎動多為胎兒睡眠，可先給含糖飲料再監測（或聲音刺激），故選 A。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 7, "stem": "懷孕婦女詢問為什麼她臉頰、額頭最近開始出現一些褐色斑點，護理師以下解釋，何者正確？", "options": ["這是一種臉部結締組織擴張所致", "這是因臉部的血管擴張、增生所致", "臉部皮下組織代謝增加所致", "因腦下垂體分泌的黑色素刺激素增加"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-7", "explanation": "孕婦臉部褐斑（黑斑）因腦下垂體分泌黑色素刺激素增加所致，故選 D。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 8, "stem": "有關雷奧波德式操作法（Leopold’s maneuvers）之敘述，下列何者正確？", "options": ["在妊娠 12 週即可操作", "第一段操作法的目的為找出胎兒的那一部位位於子宮底", "檢查前需要先脹膀胱", "第三段操作法的目的之一為找出最適當的胎心音聽診部位"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-8", "explanation": "雷奧波德式第一段操作在於找出位於子宮底的胎兒部位，故選 B。應排空膀胱、於妊娠後期操作，第三段在確認先露部與胎頭嵌入。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 9, "stem": "有關胎兒呼吸系統發育，下列敘述何者正確？", "options": ["胎兒在 28 週，肺表面張力素開始製造", "胎兒娩出後，才開始有呼吸動作", "胎兒在子宮內有呼吸動作易造成羊水吸入", "肺表面張力素過少易造成新生兒呼吸窘迫症候群"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-9", "explanation": "肺表面張力素過少易造成新生兒呼吸窘迫症候群，故選 D。胎兒在子宮內即有呼吸樣動作、正常不致吸入羊水。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 10, "stem": "有關受精的敘述，下列何者錯誤？", "options": ["精子在進入卵子之前，必須穿過卵子外層的放射冠及透明帶", "雙胞胎是指同時有二隻精子進入卵子的細胞核完成受精", "受精最常發生於輸卵管壺腹部", "受精是單套染色體的精子與單套染色體卵子的結合"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-10", "explanation": "本題選錯誤。雙胞胎並非兩隻精子進入同一卵子細胞核，故 B 錯誤；受精多發生於輸卵管壺腹部。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 11, "stem": "有關待產婦之照顧，下列敘述何者正確？", "options": ["已破水的個案宜灌腸", "早產安胎的個案便祕宜灌腸", "待產婦不用常規剃除陰毛", "破水後應立即生產"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-11", "explanation": "待產婦不須常規剃除陰毛，故選 C。已破水或安胎者不宜灌腸；破水後不一定立即生產。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 12, "stem": "有關生產疼痛之敘述，下列何者錯誤？", "options": ["第一產程疼痛來源主要是子宮收縮與子宮頸變薄及擴張", "第二產程疼痛來源主要是子宮收縮、陰道與會陰肌肉的伸張與伸展", "第三產程疼痛來源主要是胎盤排出時子宮收縮和子宮頸擴張", "生產疼痛是相當主觀而有個別性經驗，與個人過去經驗有關"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-12", "explanation": "本題選錯誤。第二產程疼痛主要來自胎頭下降造成陰道與會陰的伸展壓迫（軀體痛），B 將主因歸為子宮收縮並不正確。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 13, "stem": "李女士待產時宮縮疼痛非常焦慮不安，下列護理措施何者錯誤？", "options": ["換氣過度可給予塑膠袋及 O2 使用", "利用集中注意力與意象法，減輕疼痛", "利用音樂療法，促進放鬆減輕疼痛", "讓待產婦浸泡於溫水中，達到肌肉鬆弛"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-13", "explanation": "本題選錯誤。換氣過度應以紙袋回吸以提高二氧化碳，不應同時給氧（矛盾），故 A 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 14, "stem": "有關脊髓阻斷（Spinal Block）之敘述，下列何者正確？", "options": ["常用於減痛分娩，有效緩解第一產程產痛", "在 L4-5 或 L5-S1 下針", "麻醉前 30 分鐘須給予較多的靜脈輸液", "麻醉後須平躺 3～4 小時，預防頭痛"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-14", "explanation": "脊髓阻斷前 30 分鐘須先給予較多靜脈輸液以預防低血壓，故選 C。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 15, "stem": "以下那些護理評估可以知道待產婦已開始進入第二產程？①破水 ②子宮規則收縮 ③陰道排出粉 紅色黏液 ④子宮頸完全擴張 ⑤會陰可見胎頭膨出，個案有不自主用力感", "options": ["①②", "②③", "③④", "④⑤"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-15", "explanation": "子宮頸完全擴張（④）與會陰可見胎頭膨出且有不自主用力感（⑤）代表進入第二產程，故選 D。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 16, "stem": "入院待產婦裝置體外電子胎兒監測器後，下列何者為第一優先的監測項目？", "options": ["辨識出胎心加速的型態", "評估胎心率基準線", "確立子宮收縮強度", "確立子宮收縮的頻率"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-16", "explanation": "裝置電子胎兒監測器後第一優先為評估胎心率基準線，故選 B。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 17, "stem": "有關正常子宮收縮的特性，下列何者錯誤？", "options": ["無法由產婦的意志支配", "以子宮底收縮強度最高", "受腸胃的神經管制", "間歇性的收縮"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-17", "explanation": "本題選錯誤。子宮收縮不受腸胃神經管制，故 C 錯誤；其為不隨意、以子宮底最強、且為間歇性收縮。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 18, "stem": "待產婦以催產素（Pitocin）引產時，下列何者最不需要監測？", "options": ["血壓與呼吸次數", "輸出入量", "宮縮與胎心率", "血糖"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-18", "explanation": "催產素引產時最不需監測血糖，故選 D；血壓呼吸、輸出入量、宮縮與胎心率皆須監測。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 19, "stem": "林女士，陰道分娩後 12 小時，主訴會陰傷口疼痛，下列敘述何者適當？", "options": ["請產婦採屈膝仰臥式評估會陰傷口", "採 REEDA 評估時，A 是指傷口密合度（Approximation）", "指導如廁後由肛門往陰道口的方向擦拭會陰部", "給予溫水坐浴 20 分鐘"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-19", "explanation": "REEDA 評估中 A 指傷口密合度（Approximation），故選 B。評估宜採側臥、擦拭由前往後、坐浴時間不宜過長。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 20, "stem": "邱女士，產後第三天嚴重脹奶，原想採純母乳哺餵，表示：「昨天都還好，今早突然這樣，實在太痛 了，我想打退奶針。」下列何項處置最適當？", "options": ["哺餵次數過多會造成乳汁分泌量增多，建議定時餵奶", "協助熱敷與按摩乳房直至乳房呈現柔軟狀態", "刺激噴乳反射，協助擠出乳汁", "建議穿著較緊胸罩、減少刺激與限制水分來退奶"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-20", "explanation": "嚴重脹奶且想持續哺乳者，應刺激噴乳反射並協助擠出乳汁，故選 C；退奶措施（緊胸罩、限水）不適用於欲哺乳者。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 21, "stem": "下列何者為更年期女性的生理變化？①濾泡刺激素大量增加 ②雌性素分泌增加 ③低密度脂蛋白 增加 ④陰道 pH 值下降", "options": ["①③", "②③", "①④", "③④"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-21", "explanation": "更年期①濾泡刺激素上升、③低密度脂蛋白增加，故選 A；雌性素下降、陰道 pH 上升。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 22, "stem": "丁女士 30 歲，第二胎，現為產後第二天，其宮底位於臍下一指，惡露呈紅色量中，主訴昨夜睡眠差 且感宮縮疼痛不適，當新生兒推出餵奶時，表示想休息並拒絕餵奶，此行為正確的解釋是：", "options": ["此為第二胎，所以對新生兒較不感好奇，也較以自我為中心", "此宮縮痛是不正常之現象，應立即通知醫師", "此時處於接受期，身體仍需調養，所以應主動為她哺餵新生兒", "此時處於接受期，應先滿足她的需求，但同時亦應鼓勵她多接觸新生兒"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-22", "explanation": "產後第二天屬接受期，應先滿足產婦需求，同時鼓勵其多接觸新生兒，故選 D；後嬰宮縮痛屬正常。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 23, "stem": "有關母乳哺餵對母親的影響，下列護理指導何者正確？", "options": ["刺激腦下垂體前葉分泌催產素", "停經前罹患卵巢癌的機率較低", "因鈣質流失易造成母親中年期骨質疏鬆症", "對月經來潮時間沒有影響"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-23", "explanation": "哺乳可降低停經前罹患卵巢癌的機率，故選 B。哺乳刺激的是腦下垂體後葉分泌催產素、不致骨質疏鬆、會延後月經來潮。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 24, "stem": "王女士 G1P1，陰道生產產後第 3 天，主訴感覺疲倦、失眠、緊張、過於敏感，有時會不由自主的掉 眼淚。她目前最可能的情況為何？", "options": ["產後的正常現象", "產後情緒低落（postpartum blues）", "產後憂鬱（postpartum depression）", "產後精神病（postpartum psychosis）"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-24", "explanation": "產後第 3 天出現疲倦、失眠、易哭等短暫情緒變化，屬產後情緒低落（postpartum blues），故選 B。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 25, "stem": "陳女士產後小便尚未自解，護理師評估結果為尿瀦留，下列敘述何者正確？", "options": ["聽診下腹部有囉音", "叩診恥骨聯合上方處有鼓音", "陳女士目前為產後 3 小時", "觸診腹部子宮底的位置偏向右側"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-25", "explanation": "尿瀦留時觸診子宮底偏向右側（脹大膀胱推移子宮），故選 D；恥骨聯合上方叩診呈濁音而非鼓音。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 26, "stem": "承上題，此時護理師需優先注意的現象為何？", "options": ["排汗多寡", "子宮收縮狀態", "大便自解情形", "腰酸背痛程度"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-26", "explanation": "尿瀦留時需優先注意子宮收縮狀態，因膀胱脹大易致子宮收縮不良而出血，故選 B。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 27, "stem": "有關新生兒囟門的敘述，下列何者錯誤？", "options": ["前囟門為菱形，一般在新生兒出生後 12～18 週時關閉", "後囟門為三角形，一般在新生兒出生後 8～12 週時關閉", "當新生兒脫水時，可以觀察到其前囟門凹陷的狀況", "當顱內壓力上升時，可以觀察到新生兒前囟門凸出的狀況"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-27", "explanation": "本題選錯誤。前囟門一般在出生後 12～18「個月」關閉，非 12～18 週，故 A 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 28, "stem": "下列新生兒的皮膚評估，何者為異常？", "options": ["出生時臀部有蒙古斑", "出生後 2～3 天胸腹部出現毒性紅斑", "出生時先露部位有紅紫色瘀點（Petechiae）", "出生時臉部有葡萄色酒斑"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-28", "explanation": "臉部葡萄色酒斑（port-wine stain）屬異常，故選 D；蒙古斑、毒性紅斑、先露部瘀點多為良性。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 29, "stem": "有關新生兒免疫系統的敘述，下列何者錯誤？", "options": ["新生兒自妊娠 20 週後即可自行合成少量的免疫球蛋白（IgM，IgG，IgE）", "第三妊娠期中，IgG 可通過胎盤，胎兒即可獲得來自母體的被動免疫能力", "IgM 無法通過胎盤，若新生兒體內 IgM 值偏高，即可能表示胎兒有感染現象", "IgE 可自初乳中分泌出來，因此哺餵母乳的新生兒，較易獲得來自母體的 IgE"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-29", "explanation": "本題選錯誤。初乳提供的是分泌型 IgA 而非 IgE，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 30, "stem": "有關女陰癌之敘述，下列何者正確？", "options": ["早期病變為搔癢、小傷口，但癌症生長快速", "容易因直接接觸至鄰近器官而發生局部轉移", "早期治療以化學治療為主", "術後應採仰臥式，維持大腿 45 度外張，膝關節 90 度彎曲之姿勢"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-30", "explanation": "女陰癌術後應採仰臥、大腿外張 45 度、膝彎 90 度姿勢，故選 D；早期病變生長較慢、經淋巴轉移、早期以手術為主。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 31, "stem": "王女士，有糖尿病病史，到院進行產前諮詢。醫護人員會建議她在懷孕前最好接受何項檢驗，以了解 其血糖控制之狀況？", "options": ["50 公克口服葡萄糖耐受試驗", "100 公克口服葡萄糖耐受試驗", "糖化血色素", "空腹血糖"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-31", "explanation": "糖尿病婦女孕前宜檢測糖化血色素以了解長期血糖控制，故選 C。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 32, "stem": "陳女士妊娠 30 週，因有早產預兆而入院安胎，依醫囑使用 Ritodrine（Yutopar）靜脈點滴注射。有關 此藥物的副作用，下列何者錯誤？", "options": ["低血糖", "噁心", "頭痛", "胎心率增加"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-32", "explanation": "本題選錯誤。Ritodrine 會造成「高血糖」而非低血糖，故 A 錯誤；噁心、頭痛、胎心率增加為其副作用。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 33, "stem": "李女士產後 8 小時，惡露呈鮮紅色，1 小時內即浸溼整片產墊，下列護理措施何者錯誤？", "options": ["監測生命徵象及血壓", "評估出血量", "暫停子宮按摩", "依醫囑給予子宮收縮藥物"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-33", "explanation": "本題選錯誤。產後出血時應「執行子宮按摩」而非暫停，故 C 錯誤；並監測生命徵象、評估出血量、依醫囑給子宮收縮劑。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 34, "stem": "有關前置胎盤的敘述，下列何者正確？", "options": ["生育期婦女發生前置胎盤的機率與年齡無關", "胎盤著床的位置在子宮底部位", "有前置胎盤病史者，再次發生機率較高", "發生的機率與婦女有無多次子宮刮除術經驗無關"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-34", "explanation": "有前置胎盤病史者再次發生機率較高，故選 C；發生率隨年齡與多次子宮刮除經驗增加，胎盤著床於子宮下段。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 35, "stem": "下列何者不是多囊性卵巢疾病之臨床表徵？", "options": ["雌性素分泌過多", "肥胖", "多毛", "月經過少或無月經"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-35", "explanation": "多囊性卵巢症為雄性素過多，並非雌性素分泌過多，故「雌性素過多」非其表徵，選 A；肥胖、多毛、月經稀少為其特徵。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 36, "stem": "鄭女士 53 歲，有關更年期之注意事項，下列敘述何者最適當？", "options": ["多喝冰涼飲品，可舒緩熱潮紅", "仍需定期做子宮頸抹片檢查", "建議接受民俗療法，以舒緩不適症狀", "因萎縮性陰道炎，不要有性行為"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-36", "explanation": "更年期婦女仍須定期做子宮頸抹片檢查，故選 B；冰涼飲品無法舒緩熱潮紅、不建議民俗療法、萎縮性陰道炎可用潤滑劑維持性生活。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 37, "stem": "有關經前症候群的護理措施，下列敘述何者最適當？", "options": ["補充高蛋白、高熱量、高鹽分的飲食", "服用雌性素預防不適症狀", "多飲用咖啡、冰涼的手調茶飲", "調整生活作息，良好的睡眠品質"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-37", "explanation": "經前症候群護理宜調整作息、維持良好睡眠，故選 D；應減鹽、減少咖啡因，雌性素非首選。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 38, "stem": "有關子宮頸癌的護理措施，下列敘述何者正確？", "options": ["根除性子宮切除術後，可能出現排尿問題，病人需接受膀胱訓練", "全子宮切除術後一個月可恢復正常生活，例如爬樓梯、提重物等", "放射線治療的病人，照射部位皮膚容易乾燥搔癢，可自行擦拭乳液", "需先評估白血球在 2,000/mm3、血紅素在 12gm%以上才可行放射治療"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-38", "explanation": "根除性子宮切除術後可能出現排尿問題，需接受膀胱訓練，故選 A；術後一個月不宜提重物爬樓梯、放療部位皮膚不可自行塗乳液。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 39, "stem": "體外受精與胚胎植入術（IVF-ET）執行過程中，受精卵分裂數量為多少時即可植入子宮內？", "options": ["2～8 個細胞", "10～16 個細胞", "18～32 個細胞", "36～48 個細胞"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-39", "explanation": "IVF-ET 中受精卵分裂至 2～8 個細胞時即可植入子宮，故選 A。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 40, "stem": "有關婦科體外放射治療後產生的腹瀉問題之護理指導，下列何者不適當？", "options": ["維持水分平衡", "增加乳製品攝取", "採用低渣飲食", "必要時使用止瀉劑"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-40", "explanation": "本題選不適當。放療後腹瀉應「減少」乳製品（乳糖會加重腹瀉），故 B 不適當；宜維持水分、採低渣飲食、必要時用止瀉劑。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 41, "stem": "依據「兒童及少年福利與權益保障法」第 53 條，當護理師知悉兒童非法施用毒品或管制藥品、遭受 虐待或其他傷害，至遲不得超過幾小時，應立即向主管機關通報？", "options": ["12 小時", "24 小時", "36 小時", "48 小時"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-41", "explanation": "依兒少福利與權益保障法第 53 條，知悉兒少受虐等情事至遲不得超過 24 小時應通報，故選 B。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 42, "stem": "小方，3 歲，因急性腸胃炎住院，下列何種行為反應顯示小方處於分離焦慮的抗議期？", "options": ["持續性哭叫", "吸手指頭", "白天尿床", "吃奶嘴"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-42", "explanation": "分離焦慮抗議期表現為持續哭叫、抗拒，故選 A；吸手指、尿床等退化行為屬絕望期。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 43, "stem": "有關燒傷病童休克期最初 24 小時的處置措施，下列敘述何者最適當？", "options": ["優先選擇乳酸林格氏液（lactated Ringer solution）補充液體", "以皮下或肌肉注射給予止痛藥物，降低病童疼痛不適", "提供高蛋白、高熱量飲食，以補充熱量與蛋白質耗損", "照護重點是避免燒傷造成關節攣縮或變形後遺症"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-43", "explanation": "燒傷休克期最初 24 小時以乳酸林格氏液補液為優先，故選 A；此期止痛採靜脈給藥、暫禁食、關節攣縮預防屬後期重點。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 44, "stem": "小玉，3 歲，體重 15 公斤，誤食外婆包粽子用的鹼水，就醫時意識清楚，下列處置何者最適當？", "options": ["食入後儘快進行催吐延緩吸收", "在食入 2 小時內喝清水或牛奶中和", "給予灌腸或胃灌洗", "食入後積極投予 deferoxamine 治療"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-44", "explanation": "誤食鹼水（腐蝕性）且意識清楚者，宜在 2 小時內喝清水或牛奶稀釋中和，故選 B；不可催吐或洗胃（再度灼傷）。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 45, "stem": "小瑄，1 歲 1 個月，因不明原因發燒而入住兒童病房，測量小瑄的生命徵象時，下列護理措施何者較 不適當？", "options": ["採肛溫測量以獲得正確體溫", "讓主要照顧者陪伴在身旁", "先量呼吸、心跳再量體溫", "血壓測量部位最常用為右上臂"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-45", "explanation": "本題選較不適當。1 歲幼兒測體溫不宜常規採肛溫（侵入、風險），故 A 較不適當；其餘（照顧者陪伴、先量呼吸心跳、右上臂測血壓）皆適當。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 46, "stem": "下列何者是造成兒童燒傷急救期（emergent period）休克的主要原因？", "options": ["低血量性", "壓力性", "心因性", "敗血性"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-46", "explanation": "燒傷急救期休克主因為體液大量流失所致的低血量性休克，故選 A。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 47, "stem": "早產兒吸吮力弱，有關使用口胃管灌食的注意事項，下列敘述何者不適當？", "options": ["插口胃管時先以無菌蒸餾水潤滑", "每次餵食前應先檢查胃內殘餘量", "灌食時，早產兒頭部抬高大於 30 度", "每日攝取熱量宜為 100～120 Kcal/kg"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-47", "explanation": "本題選不適當。口胃管灌食時頭部略抬高約 30 度即可，題目「大於 30 度」之敘述不適當，故選 C。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 48, "stem": "有關兒童疼痛概念與認知的敘述，下列何者錯誤？", "options": ["早產兒、新生兒不會覺得疼痛，因為傳導慢", "16 個月的小欣，對疼痛有記憶看到針頭就哭", "5 歲的小美用語言抗議和肢體活動來表達疼痛", "7 歲的阿偉將疼痛視為一種錯誤行為的懲罰"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-48", "explanation": "本題選錯誤。早產兒與新生兒同樣會感到疼痛，故 A 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 49, "stem": "有關兒童常用的鴉片類製劑（opioids）疼痛處置，下列敘述何者正確？", "options": ["此類藥物適用於兒童中度至重度的疼痛", "主要抑制前列腺素的合成，而有鎮痛效果", "常見副作用包括胃潰瘍、腹瀉、出血性腎炎", "Morphine 與雷氏症候群有關，不建議兒童使用"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-49", "explanation": "鴉片類製劑適用於兒童中度至重度疼痛，故選 A；其作用於鴉片受體（非抑制前列腺素），胃潰瘍出血屬 NSAIDs，雷氏症候群與 aspirin 有關。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 50, "stem": "嬰兒最早發展的知覺為下列何者？", "options": ["聽覺", "視覺", "觸覺", "嗅覺"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-50", "explanation": "嬰兒最早發展的知覺為觸覺，故選 C。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 51, "stem": "小明，3 歲半，診斷為會厭炎而住院求治，下列護理措施何者最適當？", "options": ["給予小明接種流感嗜血桿菌疫苗", "協助喉嚨採檢時，備好急救用物", "宜給予抽痰以維持呼吸道通暢", "提供冰冷軟質食物，以減少會厭腫脹"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-51", "explanation": "會厭炎採檢喉嚨時應備妥急救用物（防完全阻塞），故選 B；不宜抽痰刺激、Hib 疫苗為預防非治療。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 52, "stem": "有關意識不清的嬰幼兒期病童疼痛評估，下列何者最適當？", "options": ["Poker Chip Scale 籌碼片量表", "Face Pain Scale 臉譜疼痛量表", "Face, Legs, Activity, Cry& Consolability 量表", "Numeric Pain Scale 數字疼痛量表"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-52", "explanation": "意識不清嬰幼兒疼痛評估宜用 FLACC（臉、腿、活動、哭泣、可安撫性）量表，故選 C。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 53, "stem": "張小妹，妊娠 28 週出生，體重 960 公克，有關早產兒的特徵及照護，下列敘述何者正確？", "options": ["依醫囑由靜脈點滴給予表面張力素（survanta）", "若無吸吮及吞嚥反射，以腸道外營養法提供營養", "四肢屈曲且內縮，呈現子宮內姿勢", "皮膚缺乏皮下脂肪、胎毛少、腳底皺摺多"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-53", "explanation": "早產兒若無吸吮吞嚥反射，應以腸道外營養提供營養，故選 B；表面張力素經氣管內給予、早產兒呈伸展姿勢、皮下脂肪少而胎毛多、腳底皺摺少。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 54, "stem": "有關兒童事故傷害的預防與處置，下列敘述何者正確？", "options": ["誤食漂白水，在 2 小時內，給予吐根糖漿（ipecac syrup）催吐", "溺水發生時，最優先的緊急處置是恢復體溫", "嬰幼兒乘坐汽車，安全座椅應固定於前座駕駛旁", "處於口腔階段嬰幼兒容易發生異物哽塞或鉛中毒"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-54", "explanation": "處於口腔期的嬰幼兒易發生異物哽塞或鉛中毒，故選 D；誤食漂白水不可催吐、溺水優先處理呼吸道、安全座椅應置後座。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 55, "stem": "小傑，2 歲，罹患重度海洋性貧血（Thalassemia），需反覆入院輸血。母親為印尼裔回教徒的新住民， 中文溝通有限，有關以家庭為中心的護理計畫，下列敘述何者最適當？", "options": ["提供家庭以臺灣本土文化為主的照護計畫", "完全配合印尼文化，進行所有病童與其家庭對疾病與住院的反應和需求照護", "在住院期間，儘量與家庭的文化習慣和常規保有一致性", "在所有照護決策過程，請小傑母親找尋其他家人幫忙做翻譯"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-55", "explanation": "以家庭為中心的照護應在住院期間儘量與其文化習慣與常規保持一致，故選 C；不宜強加本土文化或全由母親找家人翻譯。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 56, "stem": "早產兒常出現呼吸暫停現象，下列敘述何者正確？", "options": ["指呼吸停止連續 10～15 秒，且併有發紺、心跳變快的現象", "維持俯臥姿勢，可縮短早產兒發生呼吸暫停時的心跳遲緩，或發紺之持續時間", "給予 theophylline 時，須觀察有無心搏過慢，及嗜睡等中毒的徵象", "出現呼吸暫停，立即執行心外按摩，促進呼吸恢復"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-56", "explanation": "早產兒呼吸暫停時採俯臥可縮短心跳遲緩或發紺持續時間，故選 B；呼吸暫停指停止＞20 秒併心搏「變慢」，theophylline 中毒表現為心搏過速與躁動。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 57, "stem": "小花，8 歲，罹患神經母細胞瘤末期，問護理師他是否快要死掉了，下列敘述何者較適當？", "options": ["沒有啊，是誰告訴你的，不要想那麼多", "為什麼你突然問這個問題，說說看你在擔心什麼", "你聽誰說的？你是不是太累了，會不會聽錯了", "每個人都會死掉，只是早死或晚死罷了"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-57", "explanation": "面對瀕死病童詢問，宜以開放方式探詢其感受：「說說看你在擔心什麼」，故選 B。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 58, "stem": "協助學齡前期的手足面對病童瀕死的護理措施，下列敘述何者正確？", "options": ["為了保護病童之手足，應減少手足與瀕死的病童接觸", "此年齡的孩童對死亡概念模糊，不需與他談到死亡", "當手足出現行為問題時，須予以糾正", "以繪本或遊戲方式，引導病童手足講出其心中想法"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-58", "explanation": "協助學齡前手足面對瀕死病童，宜以繪本或遊戲引導其表達內心想法，故選 D；不應減少接觸或迴避死亡話題。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 59, "stem": "有關川崎氏症（Kawasaki disease）的臨床表徵，下列敘述何者錯誤？", "options": ["急性期會出現持續發燒 5 天以上", "急性期兩眼結膜充血、草莓樣舌和頸部淋巴結腫大", "亞急性期可能出現腕、膝和踝等關節痛的症狀", "亞急性期紅血球沉降速率和血小板數值降低"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-59", "explanation": "本題選錯誤。川崎氏症亞急性期血小板與紅血球沉降速率會「上升」（血小板增多），而非降低，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 60, "stem": "感染麻疹（measles）在卡他期（catarrhal stage）的病童之 3C 症狀，下列敘述何者不適當？", "options": ["結膜炎（conjunctivitis）", "鼻炎（coryza）", "咳嗽（cough）", "抽搐（convulsion）"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-60", "explanation": "麻疹卡他期 3C 為結膜炎、鼻炎、咳嗽；抽搐（convulsion）非 3C，故選 D。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 61, "stem": "小傑，8 個月，罹患支氣管肺炎（Bronchopneumonia），需住院治療，下列護理措施何者不適當？", "options": ["進行呼吸症狀評估，且依醫囑給予氧氣", "促進小傑休息和節省體力，故採集中護理", "每當小傑看見父母時都會大哭，宜避免父母親參與照顧", "宜抬高床頭給予舒適臥姿，促進肺部擴張"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-61", "explanation": "本題選不適當。支氣管肺炎病童應鼓勵父母參與照顧以安撫情緒，不應因哭泣而避免父母參與，故 C 不適當。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 62, "stem": "有關兒童罹患會厭炎（Epiglottitis）的典型症狀，下列敘述何者最不適當？", "options": ["流口水", "吞嚥困難", "發聲困難", "口腔潰瘍"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-62", "explanation": "會厭炎典型為流口水、吞嚥困難、發聲困難；口腔潰瘍非其典型，故選 D。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 63, "stem": "王小弟，2 歲，因肺部的下葉上節有痰液蓄積，護理師為其執行姿位引流，下列姿勢何者最適當？", "options": ["俯臥，頭放低 30 度", "側臥，頭放低 15 度", "側臥，頭放低 30 度", "俯臥，頭放低 15 度"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-63", "explanation": "肺下葉上節痰液引流採俯臥、床頭稍放低約 15 度，故選 D。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 64, "stem": "王小妹，6 個月大，有關心導管檢查前的準備，下列敘述何者適當？", "options": ["避免測量下肢血壓", "確認禁食 4～6 小時", "確認鼠蹊部脈搏最強處，標示記號", "確認檢查前不宜給鎮靜劑與抗生素"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-64", "explanation": "心導管檢查前應確認禁食 4～6 小時，故選 B；需測下肢血壓作基準、標記遠端脈搏以利術後比較。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 65, "stem": "有關病毒性腦膜炎（virus meningitis）的護理措施，下列敘述何者錯誤？", "options": ["採支持性療法或症狀治療", "大多數病童會出現神經系統障礙的後遺症", "持續監測病童的生命徵象", "若同時發生細菌性感染，則會給予抗生素使用"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-65", "explanation": "本題選錯誤。病毒性腦膜炎多數可痊癒、少留神經後遺症，故「多會出現神經後遺症」錯誤，選 B。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 66, "stem": "有關胎兒出生後的心臟血管變化，下列敘述何者錯誤？", "options": ["左心房壓力大於右心房，導致卵圓孔瓣膜關閉", "臍動脈閉合，形成肝圓韌帶", "左心房與左心室的壓力增加", "動脈導管於出生後 1～3 個月閉塞，形成動脈韌帶"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-66", "explanation": "本題選錯誤。肝圓韌帶由臍「靜脈」閉合形成，臍動脈閉合則形成臍內側韌帶，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 67, "stem": "有關血友病住院病童及其家屬之照顧，下列敘述何者較適當？", "options": ["父母為帶因者易對病童有罪惡感，應支持父母對病童的保護行為", "為維護健康手足之生活品質，宜儘量減少其至病房", "為提升病童自我照顧能力，應儘早提供居家照護知識", "為避免受同儕排擠，應鼓勵病童積極參加學校各類活動"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-67", "explanation": "血友病病童宜儘早提供居家照護知識以提升自我照顧能力，故選 C；不應強化過度保護、減少手足探視或鼓勵劇烈活動。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 68, "stem": "小凌，16 歲，罹患再生不良性貧血，住院接受抗淋巴球蛋白（ALG）及 cyclosporin 治療，下列護理 措施何者較適當？", "options": ["因小凌食慾不振，儘量選擇其愛吃的食物，例如生菜沙拉", "青春期在意身體外觀，先暫不告知藥物有外觀改變之副作用", "為避免社交隔離，鼓勵安排同學到院探訪", "發燒時，避免使用 aspirin，以免延長出血時間"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-68", "explanation": "再生不良性貧血病童發燒時應避免使用 aspirin（延長出血），故選 D；免疫低下應避免生菜與訪客、且應告知藥物外觀副作用。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 69, "stem": "小青，2 歲，罹患先天性甲狀腺功能低下（congenital hypothyroidism），下列敘述何者不適當？", "options": ["提供低纖維食物，以預防腹瀉", "增加鐵質的提供，以預防貧血", "給予四肢適當保暖，預防體溫過低", "鼓勵增加日曬時間，以促進骨骼發展"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-69", "explanation": "本題選不適當。先天性甲狀腺功能低下常致便祕，應給「高纖」飲食而非低纖，故 A 不適當。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 70, "stem": "有關兒童腫瘤好發部位的敘述，下列何者錯誤？", "options": ["骨肉瘤（osteosarcoma）最常發生於肱骨（humerus）", "最常見的原發性腦瘤是膠質瘤（glioma）", "神經母細胞瘤（neuroblastoma）最常發生在腎髓質", "威廉氏腫瘤（Wilm’s tumor）是發生於腎臟的惡性腫瘤"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-70", "explanation": "本題選錯誤。骨肉瘤最常發生於膝關節周圍（股骨遠端/脛骨近端），而非肱骨，故 A 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 71, "stem": "林小弟，9 歲，因為急性腎絲球腎炎（acute glomerulonephritis）而入院治療，有關此疾病之護理照護， 下列敘述何者錯誤？", "options": ["急性期階段，儘量鼓勵臥床休息，以減少能量消耗", "須密切監測病童水腫、血壓、尿量等的變化", "鼓勵病童多進食高鉀食物，如香蕉、橘子以預防低血鉀", "每日定時使用同一磅秤與相同穿著測量體重"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-71", "explanation": "本題選錯誤。急性腎絲球腎炎尿量減少時應「限制」高鉀食物以防高血鉀，故「鼓勵高鉀食物」錯誤，選 C。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 72, "stem": "有關早產兒呼吸窘迫症候群的護理措施，下列敘述何者正確？", "options": ["胸部 X 光表現為肺擴張不全，毛玻璃樣的變化", "胎兒在妊娠週數 32 週大時才開始製造及分泌表面張力素", "早產兒呼吸窘迫症候群的臨床表徵為吸氣出現咕嚕聲", "呼吸性酸中毒為動脈血液氣體分析 pH＜7.20、PaO2＞50 mmHg"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-72", "explanation": "早產兒呼吸窘迫症候群胸部 X 光呈肺擴張不全、毛玻璃樣變化，故選 A；表面張力素約 24 週即開始製造、臨床為呼氣性呻吟。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 73, "stem": "小強，男生，1 個月大，因泌尿道感染住院，有關此疾病敘述與照護，下列何者錯誤？", "options": ["嬰兒常出現的臨床表徵包括發燒、餵食困難、食慾下降等", "鼓勵給予小強蔓越莓汁，以鹼化尿液，預防感染", "指導母親應給予小強勤換尿布及避免泡澡", "指導母親在小強抗生素服用期間，勿因症狀改善而任意停用抗生素"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-73", "explanation": "本題選錯誤。蔓越莓汁會「酸化」尿液而非鹼化，且不適用於一個月大嬰兒，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 74, "stem": "兒童是易受輪狀病毒感染的高危險群，為預防輪狀病毒感染，有關家屬的護理指導，下列敘述何者錯 誤？", "options": ["鼓勵父母及兒童養成勤洗手習慣", "需注射兩劑輪狀病毒疫苗", "儘量減少出入公共場所", "勿吃生食，保持廚房、器具、食材的清潔"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-74", "explanation": "本題選錯誤。輪狀病毒疫苗為「口服」而非注射，且依廠牌為 2～3 劑，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 75, "stem": "罹患腸套疊（intussusception）的病童，接受鋇劑灌腸治療後，下列敘述何者正確？", "options": ["腸套疊可完全復原，不需擔心再度復發", "必須配合外科手術使腸道完全復位", "初次解出灰白色糞便代表非正常現象", "解出正常的褐色糞便，表示腸套疊可能復原"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-75", "explanation": "腸套疊鋇劑灌腸復位後，解出正常褐色糞便表示可能已復原，故選 D；仍可能復發。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 76, "stem": "有關病童罹患膀胱輸尿管逆流（Vesicoureteral Reflux; VUR）的初期臨床表徵，下列敘述何者正確？", "options": ["排尿疼痛有灼熱感", "無尿意感", "出現下肢骨突處凹陷性水腫", "總膽固醇與三酸甘油脂數值上升"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-76", "explanation": "膀胱輸尿管逆流初期常見排尿疼痛灼熱等泌尿道感染表徵，故選 A。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 77, "stem": "周小弟，12 歲，因打球跌倒導致右側脛腓骨骨折，已上石膏住院治療，下列護理措施何者錯誤？", "options": ["不可使用烤燈加速石膏乾燥", "評估右下肢皮膚及指甲床顏色、溫度有無改變", "患肢未被石膏固定的上下關節儘量固定不動，避免疼痛", "抬高敷有石膏的患肢，以促靜脈回流"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-77", "explanation": "本題選錯誤。上石膏後未固定的上下關節應「適度活動」以防僵硬，而非儘量固定不動，故 C 錯誤。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 78, "stem": "小畢，5 歲，因騎腳踏車跌倒，頭撞到地板，出現頭痛、嘔吐的現象，送醫後緊急接受開顱手術，下 列有關手術後護理何者不適當？", "options": ["密切評估監測意識狀態與生命徵象", "觀察有無顱內壓增高症狀，如頭痛、嘔吐、視力模糊等", "協助小畢採頭低臀高的姿勢，以促進頭部傷口引流", "提供安靜光線柔和的環境，並減少聲光刺激"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-78", "explanation": "本題選不適當。開顱術後應抬高床頭以降低顱內壓，不可採頭低臀高姿勢，故 C 不適當。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 79, "stem": "張小弟，5 個月，因水腦症入院，為預防顱內壓升高，下列護理措施何者不適當？", "options": ["密切觀察有無囟門鼓脹或噴射狀嘔吐現象", "抬高床頭 30～45 度，以降低腦內壓", "術後每 2 小時協助叩擊與抽痰，以預防吸入性肺炎", "給予安撫奶嘴以減少哭泣不安"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-79", "explanation": "本題選不適當。水腦症為防顱內壓升高，應避免抽痰（會升高顱內壓），故 C 不適當。"}, {"year": "110", "session": "第一次", "subject": "產兒科護理學", "num": 80, "stem": "有關兒童腦性麻痺的型態及表徵，下列敘述何者不適當？", "options": ["運動失調型（ataxic）因小腦功能病變而導致平衡和協調障礙", "痙攣型（spastic）因錐體徑路病變而肌肉持續性出現高張力", "運動困難型（dyskinetic）因錐體外徑路病變而有不自主運動", "徐動型（athetoid）因基底核受損而使雙下肢麻痺"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-1-4104-80", "explanation": "本題選不適當。徐動型腦性麻痺因基底核受損而有不自主動作，並非造成雙下肢麻痺，故 D 不適當。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 1, "stem": "依據現行精神衛生法，基於對精神病人的保護，經專科醫師診斷或鑑定，屬嚴重病人者，應置保護人 一人。專科醫師應開具診斷證明書交付保護人，此保護人應考量嚴重病人利益。依條文敘述保護人可 為：①監護人 ②法定代理人 ③同居人 ④配偶 ⑤父母 ⑥家屬 ⑦心理師", "options": ["①③④⑤⑦", "①②③⑤⑥", "①②④⑤⑥", "②③④⑥⑦"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-1", "explanation": "依精神衛生法，保護人可為①監護人、②法定代理人、④配偶、⑤父母、⑥家屬，故選 C（①②④⑤⑥）；同居人與心理師不在其列。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 2, "stem": "當病人服用下列何種藥物時，護理師需教導病人有關體重增加之副作用？", "options": ["Alprazolam（Xanax）", "Propranolol（Inderal）", "Olanzapine（Zyprexa）", "Venlafaxine（Efexor）"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-2", "explanation": "Olanzapine（Zyprexa）等非典型抗精神病藥常見體重增加副作用，故選 C。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 3, "stem": "黃先生，55 歲，被診斷為思覺失調症，與案母同住，服藥不規則，須由案母提醒他吃藥。一個月前， 案母因病過世，黃先生認為鄰居透過社區的 LINE 群組說他的壞話，因此作勢要攻擊鄰居。黃先生最 可能有以下何種症狀？", "options": ["關係妄想（delusion of reference）", "誇大妄想（delusion of grandeur）", "虛無妄想（nihilistic delusion）", "嫉妒妄想（delusion of jealousy）"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-3", "explanation": "認為鄰居透過社區群組說他壞話，屬關係妄想，故選 A。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 4, "stem": "有關兒童精神疾病的敘述，下列何者正確？", "options": ["語言障礙症（language disorders）常在上小學後被發現", "輕度智能不足（mild intellectual disability）常在幼稚園時被發現", "精神疾病的病徵與兒童的年齡、發展階段沒有關係", "侵擾行為、衝動控制及行為規範障礙症（disruptive, impulse control and conduct disorder）是和同儕 互動中被發現"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-4", "explanation": "侵擾行為、衝動控制及行為規範障礙症多在與同儕互動中被發現，故選 D；語言障礙與輕度智能不足發現時機及精神病徵與發展階段皆相關。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 5, "stem": "在生物化學研究中，憂鬱症病人最可能缺乏那些神經傳導物質？", "options": ["多巴胺（dopamine）和甲狀腺素（thyroxine）", "γ-胺基丁酸（γ-aminobutyric acid; GABA）和乙醯膽鹼（acetylcholine）", "皮質醇（cortisol）和腎上腺素（epinephrine）", "血清素（serotonin）和正腎上腺素（norepinephrine）"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-5", "explanation": "憂鬱症最可能缺乏血清素與正腎上腺素，故選 D。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 6, "stem": "對有聽幻覺（auditory hallucination）、被害妄想（delusion of persecution）的病人進行溝通時，下列回 應何者較適當？", "options": ["這裡除了我和你，並沒有其他人在說話", "你說有人要害你，其實這是你的想像", "你說有人害你，可是你還活得好好的", "你這是幻聽、妄想的精神症狀，藥物可以改善"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-6", "explanation": "對幻聽妄想病人宜以呈現現實但不爭辯的方式回應，如「這裡除了我和你並沒有其他人在說話」，故選 A。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 7, "stem": "對憂鬱症的病人進行「人際關係心理治療」，下列敘述何者較適當？", "options": ["進行人際關係心理治療時，不需合併藥物治療", "認為憂鬱症病人常見的問題是角色轉換困難、人際糾紛", "人際關係心理治療者主要對憂鬱症病人進行錯誤認知的分析", "治療過程中著重分析憂鬱症病人早期的生活事件"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-7", "explanation": "人際關係心理治療認為憂鬱症常見問題為角色轉換困難與人際糾紛，故選 B；常合併藥物、錯誤認知分析屬 CBT、早期生活事件屬精神分析。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 8, "stem": "病人服用抗精神病藥物，有關錐體外徑副作用（extrapyramidal symptoms; EPS）之敘述，下列何者正 確？", "options": ["會有體溫升高至 41℃以上，與肌肉僵硬", "出現斜頸、牙關緊閉和舌頭收縮，稱之為遲發性不自主運動", "出現坐立不安、來回走動或原地踏步是出現靜坐不能（akathisia）的現象", "出現鼓嘴、不斷眨眼和做鬼臉，是屬於急性肌肉緊張異常（acute dystonia）的現象"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-8", "explanation": "靜坐不能（akathisia）表現為坐立不安、來回走動，故選 C。斜頸牙關緊閉屬急性肌肉緊張異常；鼓嘴眨眼做鬼臉屬遲發性不自主運動；高燒＞41℃併僵硬屬抗精神病藥惡性症候群。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 9, "stem": "環境治療應用於急性住院病房之敘述，下列何項較適當？", "options": ["提高環境刺激，以照護躁症病人感官增加之需求", "不論那種情境使用身體約束及保護室隔離，都不符合環境治療原則", "多種感官刺激的環境不適合失智症個案的照護", "運用環境治療設計的原則於「住院生活作息表」及「生活討論會」"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-9", "explanation": "環境治療可運用於住院生活作息表與生活討論會的設計，故選 D；躁症宜「降低」刺激、必要時仍可用約束隔離、失智者亦可用適度感官刺激。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 10, "stem": "當罹患思覺失調症病人不斷敘述他的妄想內容時，下列何項護理措施較適當？", "options": ["引導病人談與妄想內容有關的情緒與感受", "告訴病人不要胡思亂想，症狀就會慢慢不見", "強烈質疑病人的妄想內容，讓病人感到自我矛盾與錯亂", "儘量不要跟病人討論以免加重病情"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-10", "explanation": "病人陳述妄想時，宜引導其談與妄想有關的情緒感受，故選 A；不宜責備、強烈質疑或迴避討論。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 11, "stem": "廖先生診斷為躁症，入院後常只吃一口飯，就四處去找病友，說要監督別人有無浪費食物，下列何項 護理措施較適當？", "options": ["為病人準備容易攜帶的食物，例如：三明治讓病人可以在行動中進食", "為了讓病人好好吃完一頓飯，需安排與其他病人一起在餐廳用餐", "因為病人不容易專心，讓他每天只吃一頓就好", "用靜脈注射營養品來補充熱量，平時隨便他愛吃多少都沒關係"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-11", "explanation": "躁症病人可準備易攜帶食物（如三明治）讓其行動中進食，故選 A。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 12, "stem": "躁症發作（manic episode）的典型臨床特徵，下列何者較適當？", "options": ["情緒低落，低自尊", "精力旺盛，愛管閒事", "自殺意念", "易有穩固的親密關係"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-12", "explanation": "躁症發作典型為精力旺盛、愛管閒事，故選 B；情緒低落、自殺意念屬鬱症。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 13, "stem": "王先生，在家因覺得有人要害他、跟蹤他而不敢睡覺，故由父親帶來住院，住院後仍覺得周遭的人不 懷好意，護理師提供之照護措施，下列何者正確？①同理並接受病人感受 ②主動積極接觸關懷病 人 ③評估妄想對病人生活干擾的程度 ④不要與病人爭辯妄想的真實性", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-13", "explanation": "被害妄想病人照護宜①同理接受感受、③評估妄想干擾程度、④不與病人爭辯真實性，故選 C（①③④）。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 14, "stem": "有關妄想症（delusional disorder）的敘述，下列何者正確？", "options": ["出現至少持續兩週的妄想", "人格異常是妄想症的危險因子之一", "導因是因為物質使用或身體病況的生理效應", "行為明顯的奇特或怪異"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-14", "explanation": "人格異常為妄想症的危險因子之一，故選 B；妄想需持續至少 1 個月、非物質/身體病況所致、行為多不明顯怪異。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 15, "stem": "牛先生，最近被診斷為憂鬱症，醫師開立服用 sertraline（Zoloft®）藥物治療，有關 Zoloft 之敘述，下 列何者正確？①選擇性血清素回收抑制劑（SSRIs） ②血清素－正腎上腺素回收抑制劑（SNRIs） ③一般持續服用 2 週以上才有療效出現 ④服藥會有嗜睡、噁心嘔吐等副作用", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-15", "explanation": "Sertraline（Zoloft）①為 SSRI、③須服用 2 週以上才顯效、④可能有嗜睡噁心嘔吐，故選 C（①③④）。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 16, "stem": "王小姐診斷為妄想症（delusional disorder），認為自己的伙食被下毒，而拒絕食用，下列護理措施何 者最適切？", "options": ["宜安排固定的護理師照顧，培養信任感", "扶著病人的手協助餵食", "保證醫院食物沒毒，請病人不必多想", "護理師直接食用以證明食物沒有毒"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-16", "explanation": "妄想症拒食者宜安排固定護理師照顧以培養信任感，故選 A；不宜強行餵食、空泛保證或親自試吃。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 17, "stem": "鬱症發作（depressive episode）的典型臨床特徵，下列何者較適當？", "options": ["意念飛躍", "自我價值感低", "怕獨處而活動多", "無睡眠障礙"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-17", "explanation": "鬱症發作典型為自我價值感低落，故選 B；意念飛躍屬躁症、鬱症多有睡眠障礙。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 18, "stem": "王小姐被診斷為憂鬱症，她最常使用的防衛機轉，下列敘述何者正確？", "options": ["外射（projection）", "內射（introjection）", "否認（denial）", "合理化（rationalization）"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-18", "explanation": "憂鬱症病人最常使用的防衛機轉為內射（introjection），故選 B。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 19, "stem": "有關社交焦慮症（social anxiety disorders）之敘述，下列何者較適當？", "options": ["病人會反覆的出現突發性的害怕失控或即將發瘋的感受", "因病人對任何的社交情境均會感受到焦慮，故病人的焦慮型態為漂浮型焦慮", "病人會因自覺身處於被觀察的社交情境而引發焦慮", "對於合併有肥胖症的病人而言，社交焦慮症引發的恐懼、焦慮或逃避行為與肥胖症有關"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-19", "explanation": "社交焦慮症病人會因自覺身處被觀察的社交情境而引發焦慮，故選 C；突發失控感屬恐慌、漂浮型焦慮屬廣泛性焦慮。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 20, "stem": "病人因反覆出現強迫性思考及持續洗手的行為，而入院治療，下列敘述何者較適當？", "options": ["病人的強迫性思考內容常為無意義的", "護理目標以直接中止病人的洗手症狀為最優先考量", "洗手行為是病人藉此內射出其內在強迫性思考的手段", "須評估病人自我傷害的可能性，必要時可戴手套洗手"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-20", "explanation": "強迫症病人須評估自我傷害可能性、必要時可戴手套洗手，故選 D；強迫思考對病人具意義且痛苦、不宜直接強行中止洗手行為。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 21, "stem": "有關創傷後壓力症（post-traumatic stress disorder; PTSD）病人的治療處置，下列何者較適當？", "options": ["若採用藥物治療，治療重點為以鋰鹽來緩解病人情緒症狀", "若採用精神分析治療，治療重點為採用家庭系統學說來說明家庭間病態的溝通", "若採用行為治療，治療重點為以洪水法協助病人逐步控制侵入性的創傷事件影像", "若採用認知治療，治療重點為引導病人修正對創傷事件起因與結果的扭曲認知"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-21", "explanation": "PTSD 認知治療重點為引導病人修正對創傷起因與結果的扭曲認知，故選 D；並非以鋰鹽治療、洪水法非「逐步」。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 22, "stem": "張小姐被診斷為做作型人格障礙症（histrionic personality disorder），護理師應事先了解病人的特性， 才能客觀的與病人建立治療性關係，下列何者是張小姐較可能出現的行為？①利用自己身體外觀來 吸引他人注意 ②展現快速轉變和膚淺表現的情緒 ③衝動、易怒、具攻擊性 ④常以不適當的性 挑逗與他人交往", "options": ["①②③", "②③④", "①③④", "①②④"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-22", "explanation": "做作型人格常①以外貌吸引注意、②情緒快速轉變且膚淺、④以不當性挑逗與人交往，故選 D（①②④）；③衝動易怒具攻擊性屬邊緣型/反社會型。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 23, "stem": "照顧罹患身體症狀及相關障礙症的病人，須特別評估隨著症狀表現而來的附帶收獲（secondary gain） ， 下列何項描述較適當？", "options": ["附帶收獲是指表現出身體症狀便可以直接避免面對心理衝突或壓力", "應儘量不要太關注病人的身體症狀，以避免不當的增強附帶收獲", "以抗精神病（antipsychotics）藥物進行催眠會談，在過程中給予暗示及建議", "鼓勵病人持續關注身體症狀，以關注病人的身體症狀為主要護理措施"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-23", "explanation": "為避免增強附帶收獲，應儘量不過度關注病人的身體症狀，故選 B；直接避免心理衝突屬原發收獲。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 24, "stem": "護理師在精神科急性病房照顧王老先生期間，王老先生常表示她就像是自己的女兒一樣，並以「女 兒」稱呼護理師。對此狀況之解釋，下列敘述何者較適當？", "options": ["病人對護理師發生情感轉移", "病人有假性痴呆症之變化", "這是一般老人對人親切之稱謂", "這表示病人對護理師極高之評價"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-24", "explanation": "病人稱護理師為「女兒」屬情感轉移（transference），故選 A。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 25, "stem": "依據 DSM-5 所訂定之標準，物質使用障礙症（substance use disorders）中，有關耐受性（tolerance） 的敘述，下列何者正確？", "options": ["使用物質過量或過久，會花時間去尋找使用的物質", "因物質使用嚴重，而產生了生理上的依賴，一旦停止使用，會導致身心不適", "使用物質造成身體傷害，明知使用物質對身體有傷害仍持續使用", "指腦部及身體已適應較高的物質濃度，因此需要更多的物質，才能達到原來的效果"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-25", "explanation": "耐受性指腦部與身體已適應較高物質濃度，需更多物質才能達到原來效果，故選 D。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 26, "stem": "美沙冬（Methadone）可作為海洛因（Heroin）的替代治療藥物之原因，下列敘述何者錯誤？", "options": ["避免使用針頭，減少 HIV 傳染", "較少欣快感，且長期使用不易產生嗜睡或憂鬱", "提升日常生活功能後，較能正常就業", "不會造成依賴"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-26", "explanation": "本題選錯誤。美沙冬本身為鴉片類藥物，仍會造成依賴，故「不會造成依賴」錯誤，選 D。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 27, "stem": "酒精成癮的病人，因長期缺乏下列何種維生素，導致維尼克氏腦症（Wernicke’s encephalopathy）， 出現意識障礙、眼肌麻痺、運動失調症狀？", "options": ["維生素 A", "維生素 B1", "維生素 D", "維生素 K"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-27", "explanation": "酒癮長期缺乏維生素 B1（硫胺）導致維尼克氏腦症，故選 B。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 28, "stem": "根據精神疾病診斷準則手冊（diagnostic and statistical manual of mental disorders：DSM-5），有關譫妄 （delirium）的敘述，下列何者正確？", "options": ["記憶障礙是診斷之基本要件", "病程慢性化，且症狀逐漸惡化", "所產生的認知困擾，包含失去定向感、語言、視覺空間能力", "移除致病導因後，通常無法完全恢復"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-28", "explanation": "譫妄的認知困擾包含失去定向感、語言與視覺空間能力障礙，故選 C；其為急性、波動、移除病因後多可恢復，記憶障礙為失智核心。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 29, "stem": "關於認知障礙症病人之臨床症狀，下列何者正確？", "options": ["定向感障礙部分，通常先發生對人物的定向感障礙", "記憶力減退部分，通常先發生遠期的記憶障礙", "感覺知覺障礙部分，較少出現日落症候群", "語言功能部分，可能出現語言整合、理解及表達能力減退，或出現失語症"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-29", "explanation": "認知障礙症語言功能可出現整合、理解與表達能力減退或失語症，故選 D；定向感常先失時間、記憶常先失近期、日落症候群常見。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 30, "stem": "對於暴食症（Bulimia Nervosa）病人的特徵之敘述，下列何者錯誤？", "options": ["短時間內吃下大量食物", "覺得自己無法控制進食的種類與數量", "禁食或過度運動也可能是其補償行為的一種", "暴食症狀與不當補償行為同時出現，並持續一個月可達診斷標準"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-30", "explanation": "本題選錯誤。暴食症診斷須暴食與不當補償行為每週至少一次並持續 3 個月，非 1 個月，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 31, "stem": "王小弟，5 歲，診斷為自閉症類群障礙症（Autism Spectrum Disorder），下列護理措施何者錯誤？", "options": ["評估王小弟的情緒、認知及日常生活功能，並鼓勵其發展適齡的技能", "安排規律的治療、吃飯與就寢時間", "每天關心王小弟，以期待他能有正向情感回饋", "溝通必須清楚、具體及簡單化"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-31", "explanation": "本題選錯誤。自閉症兒童情感互動困難，不宜「期待其正向情感回饋」，故 C 錯誤；應評估功能、安排規律作息、溝通清楚具體。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 32, "stem": "黃先生 43 歲，診斷為思覺失調症，症狀經常反覆惡化，兩個月前才剛出院返家，今日又因拒服藥、 自我照顧能力差、暴力攻擊家人而入院，下列敘述何者正確？", "options": ["入院時即須開始進行出院準備服務", "護理師於病人入院時應立即主動約束病人以防再次攻擊暴力", "出院前幾天才開始進行出院準備服務，以利病人記住", "有鑑於病人經常反覆住院，因此建議病人應長期住院為佳"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-32", "explanation": "思覺失調症病人入院時即須開始出院準備服務，故選 A；不宜立即約束、延後準備或建議長期住院。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 33, "stem": "有關復元（recovery）的敘述，下列何者正確？", "options": ["建立一個能容許精神病人退縮退化的環境", "生病是無奈的，因此探索生命的意義是一大禁忌", "精神病人無法自我控制，故不強調自主調控", "協助病人保持希望，自信與樂觀地看待未來"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-33", "explanation": "復元強調協助病人保持希望、自信與樂觀看待未來，故選 D；不鼓勵退縮退化、探索生命意義並非禁忌、應強調自主調控。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 34, "stem": "有關社區精神心理衛生護理的敘述，下列何者正確？", "options": ["注重病人持續性、一致性的照顧", "強調病人的問題解決，不需使用護理評估、診斷、目標、護理處置及評值的模式", "不須考量家屬、環境、文化等因素，才是以病人為中心的照護", "不應考量經濟、社會等因素，以免在社區護理過程中失焦"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-34", "explanation": "社區精神心理衛生護理注重持續性與一致性的照顧，故選 A；仍須運用護理過程並考量家屬、環境、文化與社經因素。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 35, "stem": "王女士 45 歲，獨居，近半年來自我照顧能力差、常常自言自語，經常倒垃圾到鄰居家，鄰居苦不堪 言，而多次報警，仍無法有效處理，有關社區心理衛生護理師之處置，下列何者較適當？", "options": ["立即聯合警消一起啟動精神疾病強制住院治療", "確認王女士非為精神照護系統內登記之精神病人，故不須處理", "通報衛生局連結醫療資源，由精神專科醫師到場評估，以進行確診及下一步處置", "為避免與王女士衝突，不予處理"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-35", "explanation": "社區個案自我照顧差且干擾鄰里，宜通報衛生局連結醫療資源、由精神專科醫師到場評估後續處置，故選 C；不可未經評估即強制住院或不予處理。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 36, "stem": "佛洛依德（Sigmund Freud）對偏差行為的看法，認為是早期發展衝突未能妥善解決的結果，此為運 用下列何種模式？", "options": ["人際關係模式", "溝通模式", "行為模式", "精神分析模式"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-36", "explanation": "佛洛依德認為偏差行為源於早期發展衝突未解決，屬精神分析模式，故選 D。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 37, "stem": "提供穩定之慢性思覺失調症病人至社區復健中心持續接受照護，是屬於下列何項預防概念？", "options": ["初級預防", "次級預防", "三級預防", "危機處置"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-37", "explanation": "提供穩定慢性思覺失調症病人至社區復健中心持續照護，屬三級預防，故選 C。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 38, "stem": "對於自殺行為與精神疾病之敘述，下列何者錯誤？", "options": ["不是每一個憂鬱症的病人，都會出現自殺企圖行為", "藥癮病人的自殺，主要是因為毒品使用過量，與憂鬱無關", "憂鬱症個案在出院後，仍可能有自殺的危險性", "思覺失調症病人可能受到幻覺控制而出現自殺企圖行為"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-38", "explanation": "本題選錯誤。藥癮病人的自殺常與憂鬱相關，非僅因用量過度，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 39, "stem": "張先生 40 歲，被診斷為思覺失調症，因出現被害妄想，持長棍於住家樓下，對路過行人出現言語恐 嚇之行為。經聯絡警消人員送醫後強制住院治療。入病室後病人出現激躁不安、神情緊張、用力拍門 及對病友口出威脅的言語，下列何者是醫護人員應立即採取的措施？", "options": ["醫護人員勿單獨前去處理病人，召來足夠支援人力", "請家屬來院安撫並引導病人", "醫護人員站在病人後面，並儘量靠近病人", "對病人的要求儘量滿足，避免破壞與病人關係"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-39", "explanation": "面對激躁具威脅的病人，醫護勿單獨處理、應召集足夠支援人力，故選 A；不宜站在病人身後貼近或一味滿足要求。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 40, "stem": "承上題，經醫護人員規勸，病人仍無法控制行為時，需進行身體約束隔離措施，下列敘述何者正確？ ①身體約束目的是由具體的身體控制，以保護病人不傷害自己及他人 ②執行身體約束過程中，無 須告知病人執行目的和時間，只要注意約束過程確保人員安全即可 ③執行身體約束隔離時，每 15 分鐘應探視病人，評估生理狀況與需求 ④疏散現場圍觀者", "options": ["①②③", "②③④", "①③④", "①②④"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-40", "explanation": "身體約束①目的在保護病人不傷害自己及他人、③每 15 分鐘探視評估、④疏散圍觀者，故選 C（①③④）；②仍須告知病人執行目的與時間。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 41, "stem": "熟悉流行病學與生命統計資料，分析與運用相關健康數據以監測社區計畫成效，是屬於社區護理師 應具備的何種能力？", "options": ["社區、群體與家庭能力", "個案照顧管理能力", "管理能力", "以實證為基礎的能力"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-41", "explanation": "熟悉流行病學與生命統計、運用健康數據監測計畫成效，屬以實證為基礎的能力，故選 D。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 42, "stem": "護理師發現社區有行動不便的獨居老人，無法自行就醫，於是她向轄區里長爭取安排社區志工陪病 就醫，下列何者較能描述護理師的角色功能？", "options": ["照護提供者", "個案管理者", "代言人", "教育者"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-42", "explanation": "護理師為獨居老人爭取志工陪病就醫，扮演代言人（倡議者）角色，故選 C。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 43, "stem": "王太太，49 歲，無抽菸與嚼檳榔史，未曾做過任何篩檢，依據全民健保預防保健服務範圍，她可接 受那些篩檢項目？①成人預防保健「健康加值方案」 ②子宮頸癌篩檢 ③乳癌篩檢 ④大腸癌篩 檢 ⑤口腔癌篩檢", "options": ["①②③", "①②⑤", "②③④", "③④⑤"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-43", "explanation": "49 歲、無菸檳者可接受①成人預防保健、②子宮頸抹片、③乳癌篩檢，故選 A；大腸癌篩檢滿 50 歲起、口腔癌篩檢限有菸檳習慣者。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 44, "stem": "有關流行病學世代研究法（cohort study），下列何者較適當？①適合研究罕見致癌因子 ②能描述疾 病之自然史 ③能探討因果關係 ④可能出現訪談誤差（interview bias）", "options": ["①②", "①④", "②③", "③④"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-44", "explanation": "世代研究可②描述疾病自然史、③探討因果關係，故選 C（②③）；訪談誤差較常見於病例對照研究。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 45, "stem": "有關結核病防治工作敘述，下列何者錯誤？", "options": ["目前我國加入「世界衛生組織（WHO）2035 年消除結核第一期計畫」", "「丙型干擾素釋放試驗，IGRA」能確定有無潛伏性結核感染，並適用於所有年齡層", "結核病發病的高危險群，如適時給予抗結核藥物治療潛伏感染，可有效減少日後發病的機會", "潛伏結核感染短期治療處方可採速克伏（3HP），每週服藥一次，需 12 個劑量，共 3 個月完成療程"], "answer": "AB", "note": "答A或B者均給分", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-45", "explanation": "本題答 A 或 B 均給分。B 之敘述有誤：IGRA 對幼童準確度較低，並非適用於「所有年齡層」；A 之計畫年程描述亦有爭議，故 A、B 皆列可給分。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 46, "stem": "接種麻疹疫苗，是屬於下列何種傳染病防治原則？", "options": ["祛除病原體", "截斷傳染途徑", "提升宿主免疫力", "管制傳染窩"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-46", "explanation": "接種麻疹疫苗屬「提升宿主免疫力」的防治原則，故選 C。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 47, "stem": "有關愛滋病的三段五級防治原則，下列敘述何者錯誤？", "options": ["初段預防：與愛滋病人討論家庭計畫或育兒計畫", "初段預防：鼓勵孕婦接受產前檢查", "次段預防：鼓勵伴侶接受檢驗", "三段預防：使用抗愛滋病毒藥物組合的「雞尾酒療法」"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-47", "explanation": "本題選錯誤。鼓勵孕婦接受產前檢查屬「次段」預防（早期發現），非初段預防，故 B 錯誤。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 48, "stem": "下列那些疾病是由病毒引起？①登革熱 ②日本腦炎 ③霍亂 ④麻疹", "options": ["①②③", "②③④", "①②④", "①③④"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-48", "explanation": "①登革熱、②日本腦炎、④麻疹由病毒引起，故選 C（①②④）；霍亂為細菌所致。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 49, "stem": "以本國居民及移居海外之華僑進行鼻咽癌比較研究，較可能找出何種因子的影響？", "options": ["醫療因子", "法規制度因子", "遺傳因子", "環境因子"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-49", "explanation": "比較本國居民與移居海外華僑之鼻咽癌，較能凸顯環境因子的影響，故選 D。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 50, "stem": "有關社區資源的敘述，下列何者正確？①無形資源－人力 ②有形資源－財力 ③有形資源－社區 凝聚力 ④有形資源－物力 ⑤無形資源－社區意識", "options": ["①②④", "①③⑤", "②③④", "②④⑤"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-50", "explanation": "社區資源中②財力、④物力屬有形資源，⑤社區意識屬無形資源，故選 D（②④⑤）；人力為有形、社區凝聚力為無形。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 51, "stem": "社區護理師排定社區健康問題的順序時，下列何者應優先處理？", "options": ["社區老人對用藥安全認知不足", "社區發現 5 位麻疹個案", "社區婦女參與子宮頸抹片檢查意願不高", "社區體重控制相關資源不足"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-51", "explanation": "社區發現 5 位麻疹個案（傳染病）應優先處理，故選 B。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 52, "stem": "依據 Anderson 和 McFarlane（2008）以社區為夥伴模式進行社區評估，下列敘述何者錯誤？", "options": ["評估社區的人為環境與動植物分布等，是呈現物理環境的資料", "描述社區的發展史，是呈現人口核心的資料", "評估居民對醫療服務的滿意度，是呈現健康及社會服務的資料", "評估社區民眾對知識的接受度，是呈現溝通的資料"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-52", "explanation": "本題選錯誤。評估居民對知識的接受度屬「教育」次系統資料，而非溝通，故 D 錯誤。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 53, "stem": "國際間公認用以評估兒童健康的單一指標為何？", "options": ["5 歲以下兒童死亡率", "7 歲以下兒童死亡率", "12 歲以下兒童死亡率", "18 歲以下兒童死亡率"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-53", "explanation": "國際公認評估兒童健康的單一指標為 5 歲以下兒童死亡率，故選 A。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 54, "stem": "社區護理師在教導民眾預防三高的護理指導時，下列何者錯誤？", "options": ["每週至少累計 150 分鐘的中度運動", "慎選食物烹調方式，避免油煎或油炸食物", "多攝取低纖維食物，有助於延長膽固醇的吸收時間", "建議降低高膽固醇食物的攝取量"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-54", "explanation": "本題選錯誤。預防三高應多攝取「高纖」食物以減少膽固醇吸收，故「多攝取低纖維」錯誤，選 C。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 55, "stem": "社區護理師欲教導初診糖尿病個案學習調整日常飲食習慣，下列何種教學方法較適當？", "options": ["小組討論法", "問答法", "示範教學與回覆示教法", "價值澄清法"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-55", "explanation": "教導糖尿病個案調整飲食宜採示範教學與回覆示教法，故選 C。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 56, "stem": "依據渥太華健康促進憲章五大行動綱領，針對不同年齡層舉辦健康飲食講座，以提升社區民眾每天 蔬果攝取量，屬於下列何項行動綱領？", "options": ["創造支持性環境", "強化社區行動力", "發展個人技能", "調整健康服務取向"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-56", "explanation": "針對不同年齡層舉辦健康飲食講座以提升蔬果攝取，屬渥太華憲章之「發展個人技能」，故選 C。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 57, "stem": "執行衛生教育計畫時，評估民眾的參與程度，是屬於下列何種評價？", "options": ["發展期評價（formative evaluation）", "過程評價（process evaluation）", "結果評價（outcome evaluation）", "衝擊評價（impact evaluation）"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-57", "explanation": "評估民眾參與程度屬過程評價，故選 B。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 58, "stem": "下列何者是堆肥法處理最主要的優點？", "options": ["操作技術簡單，成本及操作維護費用便宜", "市場銷售穩定，不受季節性農作情況而改變", "利用生化作用將物質分解腐熟，可改善土壤", "為廢棄物處理最終處置"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-58", "explanation": "堆肥法最主要優點是藉生化作用分解腐熟、可改善土壤，故選 C。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 59, "stem": "下列何種衛生教育方法最能快速讓民眾了解流感預防的相關知識？", "options": ["講述法", "團體討論法", "電腦輔助教學法", "健康傳銷法"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-59", "explanation": "欲快速讓民眾了解流感預防知識，健康傳銷法（社會行銷）觸及廣且快，故選 D。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 60, "stem": "水污染愈嚴重時，愈容易發生下列那種情況？", "options": ["生化需氧量（BOD）愈低", "水中生物種類會減少且數量也隨之減少", "水中溶氧量（DO）愈高", "水中氨氮（NH3-N）愈高"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-60", "explanation": "水污染愈嚴重，水中氨氮（NH₃-N）愈高，故選 D；同時 BOD 上升、DO 下降、生物種類與數量減少。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 61, "stem": "若紫外線指數為 7，且空氣品質指標（AQI）為 130，下列何者正確？", "options": ["紫外線指數中量級；空氣品質指標為普通", "紫外線指數高量級；空氣品質指標對敏感族群不健康", "紫外線指數過量級；空氣品質指標對所有族群不健康", "紫外線指數危險級；空氣品質指標對敏感族群不健康"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-61", "explanation": "紫外線指數 7 屬高量級；AQI 130 屬對敏感族群不健康，故選 B。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 62, "stem": "當地球臭氧層被破壞時，最主要的危害為何？", "options": ["地表溫室效應增加，全球氣溫上升", "地表有害的紫外線增加，生物健康受到影響", "地表冰川因太陽輻射量增加而融化，海平面上升", "太陽輻射增加，造成地表沙漠化"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-62", "explanation": "臭氧層破壞最主要危害是地表有害紫外線增加、影響生物健康，故選 B。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 63, "stem": "王家夫婦育有二子，長子已成婚並育有一子，未婚次子也居住在附近。兒子們時常幫媽媽採買、媽媽 也常燉湯送到二子家中，是屬於下列何種家庭類型？", "options": ["三代家庭", "重組核心家庭", "公社家庭", "家族網"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-63", "explanation": "已婚子女住附近、彼此採買送湯互助，屬家族網（family network），故選 D。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 64, "stem": "關於家庭訪視期間訂定護理契約的敘述，下列何者正確？①訂定契約之目的主要是使家庭正式參與 護理過程 ②達成協議後，社區護理師須有效率地為個案和案家訂定目標和分派任務 ③護理契約 是持續進行可隨案家情況重新談判的工作協議 ④為能減少家庭健康風險，須與家庭中能負責和適 當的成員簽訂契約", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-64", "explanation": "護理契約①使家庭正式參與、③可隨情況重新談判、④與能負責的成員簽訂，故選 C（①③④）；②目標任務應與案家共同訂定而非護理師單方分派。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 65, "stem": "有關家庭護理措施的原則，下列敘述何者不適當？", "options": ["運用護理過程提供服務", "提升家庭對於社區的參與", "為家庭規劃所有照護計畫", "運用及開發家庭內外資源"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-65", "explanation": "本題選不適當。家庭護理應與家庭共同規劃，而非由護理師「規劃所有」照護計畫，故 C 不適當。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 66, "stem": "有關「產前健康管理」的工作重點，下列何者不適當？", "options": ["產前遺傳診斷指導與服務", "孕期營養指導", "異常個案的發現與追蹤", "產後減重計畫"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-66", "explanation": "本題選不適當。產後減重計畫屬產後範疇，非產前健康管理工作重點，故 D 不適當。"}, {"year": "110", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 67, "stem": "對懷孕 32 週孕婦的孕期衛生指導，下列何者適當？①優生保健 ②每個月產檢 ③預防流產 ④乳 房護理 ⑤新生兒用物準備 ⑥腿部保暖及抬高", "options": ["①②③", "①③⑤", "②④⑤", "④⑤⑥"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-1-5104-67", "explanation": "懷孕 32 週宜指導④乳房護理、⑤新生兒用物準備、⑥腿部保暖及抬高，故選 D；優生保健屬孕前、預防流產屬早期、32 週產檢應改為兩週一次。"}, {"year": "110", "session": "第一次", "s
