ode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-50", "explanation": "Carbamazepine 藉由阻斷電位依賴性鈉離子通道、延長其去活化狀態，抑制神經元高頻重複放電，為部分性癲癇發作的首選藥物之一，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 51, "stem": "治療糖尿病的用藥中，下列何者的主要作用是刺激胰臟 β 細胞釋放 insulin？", "options": ["Glyburide", "Metformin", "Acarbose", "Dapagliflozin"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-51", "explanation": "Glyburide 屬磺醯脲類（sulfonylurea），會關閉 β 細胞的 ATP 敏感性鉀通道使細胞去極化，促進胰島素分泌，故選 A，其主要副作用即為低血糖。Metformin 減少肝糖新生，Acarbose 抑制腸道 α-葡萄糖苷酶，Dapagliflozin 抑制腎小管 SGLT2 促進糖尿排出。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 52, "stem": "動情素在臨床上用來治療攝護腺癌，是因為下列何種藥理作用？", "options": ["可以增加腎素（renin）的分泌", "可以和攝護腺癌細胞的動情素受體結合，而調控基因表現", "具有拮抗雄性素的作用", "可以經由腎臟代謝產生代謝物，而抑制攝護腺癌生長"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-52", "explanation": "攝護腺癌屬雄性素依賴型腫瘤。動情素可回饋抑制下視丘與腦下垂體的 LH 分泌，減少睪丸製造睪固酮，達到類似去勢的抗雄性素效果而抑制腫瘤生長，故選 C。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 53, "stem": "免疫抑制劑 mycophenolate mofetil 用於腎臟移植時，可減少淋巴細胞異常增殖而緩解腎臟排斥作用，其作用機轉為何？", "options": ["抑制 purine 的生合成", "抑制 calcineurin 的活性", "螯合 DNA 的作用", "抑制轉錄因子 NFAT 的活性"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-53", "explanation": "Mycophenolate mofetil 的活性代謝物抑制 inosine monophosphate dehydrogenase，阻斷嘌呤（purine）從頭合成途徑。淋巴細胞缺乏補救途徑而特別依賴此路徑，故能選擇性抑制 T、B 細胞增生，選 A。抑制 calcineurin 與 NFAT 者為 Cyclosporine 與 Tacrolimus。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 54, "stem": "如果一個藥物的半衰期為 10 小時，以靜脈輸注此藥物後，在血液中達到穩定濃度所需的時間約多久？", "options": ["5 小時", "10 小時", "20 小時", "40 小時"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-54", "explanation": "持續定速輸注時，經過約 4～5 個半衰期血中濃度可達穩定狀態的 94～97%，臨床上以 4 個半衰期估算，10 × 4 ＝ 40 小時，故選 D。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 55, "stem": "非典型抗憂鬱藥物，下列何者可降低菸癮者對尼古丁的渴求？", "options": ["Nefazodone", "Mirtazapine", "Bupropion", "Vortioxetine"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-55", "explanation": "Bupropion 抑制多巴胺與正腎上腺素的再回收，可減輕戒菸時的渴求與戒斷症狀，已核准作為戒菸輔助用藥，故選 C。使用時需注意會降低痙攣閾值，癲癇病人禁用。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 56, "stem": "成癮性物質中，下列何者之身體依賴性相對較高？", "options": ["咖啡因", "麥角酸二乙胺（LSD）", "大麻", "安非他命"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-56", "explanation": "四者相較，安非他命屬中樞神經興奮劑，會強烈作用於多巴胺獎賞系統，停用後出現明顯的疲倦、嗜睡、憂鬱與強烈渴求，身體與心理依賴性最高，故選 D。LSD 與大麻的身體依賴性低，咖啡因僅有輕微戒斷症狀。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 57, "stem": "下列何者藥物具有強力止吐作用？", "options": ["Sibutramine", "Tegaserod", "Buspirone", "Ondansetron"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-57", "explanation": "Ondansetron 為選擇性 5-HT3 受體拮抗劑，可阻斷腸道迷走神經末梢與延腦化學受體觸發區的訊號，是化學治療與術後噁心嘔吐的主要用藥，故選 D。Sibutramine 為減肥藥，Tegaserod 促進腸道蠕動，Buspirone 為抗焦慮劑。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 58, "stem": "Propranolol 治療甲狀腺亢奮引起之震顫及心悸，但病人有下列何種疾病時，不宜使用？", "options": ["高血壓", "心搏過速", "氣喘", "偏頭痛"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-58", "explanation": "Propranolol 是非選擇性乙型阻斷劑，會同時阻斷支氣管平滑肌的 β2 受體而引起支氣管收縮，氣喘與慢性阻塞性肺病病人禁用，故選 C。高血壓、心搏過速與偏頭痛預防反而是其適應症。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 59, "stem": "抗高血壓藥物 Aliskiren 的藥理作用為何？", "options": ["直接抑制血管內皮受體", "直接抑制腎素活性", "抑制心房利鈉胜肽代謝", "抑制血管緊縮素受體"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-59", "explanation": "Aliskiren 是直接腎素抑制劑，作用在 RAA 系統的最上游，阻止血管收縮素原轉變為血管收縮素 I，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 60, "stem": "有關具黏膜保護作用的 Sucralfate 敘述，下列何者錯誤？", "options": ["可與黏膜上帶正電的蛋白質結合", "需要在高 pH 值環境下活化", "不宜與 Omeprazole 併用", "無法預防 Aspirin 造成之消化性潰瘍"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-60", "explanation": "Sucralfate 需在「低」pH 的酸性環境中活化，形成帶負電的黏稠聚合物覆蓋於潰瘍面，故 B 錯誤。也因如此不宜與制酸劑或質子幫浦抑制劑（如 Omeprazole）同時服用，應間隔投與並於飯前空腹使用。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 61, "stem": "下列何種藥物可預防或減輕因使用 Aspirin 造成之消化性潰瘍？", "options": ["Biscodyl", "Lactulose", "Misoprostol", "Sorbitol"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-61", "explanation": "Misoprostol 是前列腺素 E1 的類似物，可補充非類固醇消炎藥所抑制的前列腺素，促進黏液與重碳酸鹽分泌並增加黏膜血流，用於預防 NSAID 引起的潰瘍，故選 C。因會刺激子宮收縮，孕婦禁用。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 62, "stem": "有關體重控制藥物 Lorcaserin 的敘述，下列何者錯誤？", "options": ["是 serotonin reuptake 的抑制劑", "可刺激 pro-opiomelanocortin 神經而活化 melanocortin 受體", "主要由肝臟代謝", "代謝物經由尿液排除"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-62", "explanation": "Lorcaserin 是選擇性 5-HT2C 受體「致效劑」，並非血清素再回收抑制劑，故 A 錯誤。它作用於下視丘弓狀核，刺激 POMC 神經元活化黑皮質素受體而產生飽足感，主要經肝臟代謝、代謝物由尿液排出。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 63, "stem": "下列何種藥物可以治療免疫不全病人，因感染巨細胞病毒（CMV）導致視網膜炎，以及對 acyclovir 無效之單純疱疹病毒感染？", "options": ["Cidofovir", "Fomivirsen", "Foscarnet", "Ganciclovir"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-63", "explanation": "Foscarnet 直接抑制病毒 DNA 聚合酶，不需經病毒胸苷激酶活化，因此對缺乏該酶而對 acyclovir 或 ganciclovir 產生抗藥性的 HSV 與 CMV 仍然有效，故選 C。使用時需注意腎毒性與低血鈣。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 64, "stem": "抗癌藥物中，下列何者有明顯的周邊神經毒性與肝毒性？", "options": ["Busulfan", "Cisplatin", "Doxorubicin", "Oxaliplatin"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-64", "explanation": "Oxaliplatin 最具代表性的劑量限制毒性即為周邊感覺神經病變（遇冷誘發的感覺異常），並可造成肝竇損傷等肝毒性，故選 D。Busulfan 的特徵毒性是肺纖維化，Cisplatin 為腎毒性與耳毒性，Doxorubicin 為心臟毒性。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 65, "stem": "有關真菌的敘述，下列何者錯誤？", "options": ["化合異營生物（chemoheterotroph），且不含葉綠素", "單細胞或多細胞生物", "可行無性或有性生殖", "沒細胞核，但有細胞壁"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-65", "explanation": "真菌屬真核生物，具有真正的細胞核與胞器，其細胞壁主成分為幾丁質，故 D 錯誤。真菌不含葉綠素、需自外界取得有機碳源，可為單細胞（酵母菌）或多細胞（黴菌），並可行無性或有性生殖。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 66, "stem": "下列何種補體的成分，可以活化吞噬細胞？", "options": ["C1", "C5a", "C4", "C5b-9"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-66", "explanation": "C5a 是最強的補體趨化因子，能吸引並活化嗜中性球與巨噬細胞、促進其黏附與釋放溶酶體酵素，並具過敏毒素作用，故選 B。C5b-9 為攻膜複合體負責溶解標的細胞，C1 與 C4 屬活化途徑的早期成分。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 67, "stem": "如果在出生後立即切除胸腺，主要會影響下列何種免疫反應？", "options": ["補體的作用", "樹突細胞（dendritic cell）的抗原呈現", "T 淋巴細胞的成熟分化", "B 淋巴細胞產生 IgM 的能力"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-67", "explanation": "胸腺是 T 淋巴細胞成熟與進行正、負向篩選的初級淋巴器官。出生後立即切除會使 T 細胞無法分化成熟，細胞媒介性免疫嚴重缺損，故選 C。B 細胞在骨髓成熟，產生 IgM 的初級反應不需 T 細胞協助。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 68, "stem": "婦女經期衛生棉條不潔，引起之毒性休克症候群（toxic shock syndrome），為下列何種細菌產生之毒素所引起的？", "options": ["腦膜炎雙球菌（Neisseriae menigitidis）", "金黃色葡萄球菌（Staphylococcus aureus）", "A 族鏈球菌（group A Streptococcus）", "淋病雙球菌（Neisseriae gonorrhoeae）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-68", "explanation": "與衛生棉條相關的毒性休克症候群，是金黃色葡萄球菌產生的 TSST-1 毒素所致。該毒素為超級抗原，可大量非特異性活化 T 細胞並釋出細胞激素，造成高燒、低血壓、紅疹與多重器官衰竭，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 69, "stem": "主要抑制麥角固醇（ergosterol）合成有關之抗真菌藥物為何？", "options": ["Polyenes 及 Azoles", "Echinocandins", "Azoles 及 Fluorocytosine", "Polyenes 及 Echinocandins"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-69", "explanation": "本題以麥角固醇為作用標的作分類：Azoles 抑制 14-α-去甲基酶而阻斷麥角固醇合成，Polyenes（如 Amphotericin B）則與麥角固醇結合形成孔洞，兩者皆針對麥角固醇作用，故選 A。Echinocandins 抑制細胞壁 β-glucan 合成，Fluorocytosine 干擾核酸合成。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 70, "stem": "下列何種細胞源於卵黃囊，發育後長期駐守在組織中，負責組織維護與修復的功能？", "options": ["肝臟的庫氏細胞（Kupffer cell）", "樹突細胞（dendritic cell）", "肥大細胞（mast cell）", "漿細胞（plasma cell）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-70", "explanation": "庫氏細胞是肝臟的常駐巨噬細胞，源自胚胎卵黃囊的前驅細胞，可在組織中自我更新並長期駐留，負責清除門靜脈血中的細菌、老化紅血球與參與組織修復，故選 A。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 71, "stem": "後天性免疫缺乏症候群（acquired immune deficiency syndrome, AIDS）是因為感染人類免疫缺乏病毒（HIV），造成何種細胞減少？", "options": ["B 細胞", "CD4 T 細胞", "巨噬細胞（macrophage）", "自然殺手細胞（natural killer cell）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-71", "explanation": "HIV 的 gp120 與 CD4 分子及趨化因子受體結合而進入細胞，主要感染並破壞輔助型 T 細胞（CD4 T 細胞）。當 CD4 數目降至 200/μL 以下，即易發生伺機性感染與伺機性腫瘤，故選 B。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 72, "stem": "關於厭氧菌的敘述，下列何者錯誤？", "options": ["粉刺丙酸桿菌（Propionibacterium acnes）造成青春痘的症狀可靠清潔皮膚完全消除", "厭氧菌通常是人體常在菌的一部分，常從黏膜傷口侵入造成疾病", "鬆脆性類桿菌（Bacteroides fragilis）的莢膜是其重要致病因子", "放射菌屬（Actinomycetes）感染部位可見硫磺色細粒（sulfur granules）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-72", "explanation": "痤瘡丙酸桿菌棲息於毛囊皮脂腺深處，青春痘的成因還包含皮脂分泌過多與角質阻塞，單靠清潔皮膚無法完全消除，常需局部或口服抗生素及 A 酸治療，故 A 錯誤。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 73, "stem": "關於土倫法蘭西斯桿菌（Francisella tularensi）的敘述，下列何者正確？", "options": ["對清除細菌來說，抗體免疫比細胞免疫重要", "A 型菌比 B 型菌的毒性強", "可利用乙內醯胺（β-lactam）類抗生素降低死亡率", "主要引發戰壕熱（trench fever）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-73", "explanation": "土倫病桿菌 A 型（tularensis）主要分布於北美，毒性明顯強於 B 型（holarctica），故 B 正確。此菌為細胞內寄生菌，清除主要依賴細胞免疫；治療首選 Streptomycin 或 Gentamicin，β-lactam 類無效；戰壕熱是五日熱巴通氏菌所引起。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 74, "stem": "關於肉毒梭孢桿菌（Clostridium botulinum）感染之敘述，下列何者錯誤？", "options": ["此菌是一種產生芽孢之厭氧菌", "感染者應立即給予疫苗治療", "食源性肉毒桿菌素中毒（foodborne botulism）通常是由罐頭或真空包裝食品所引起", "嬰兒肉毒桿菌素中毒（infant botulism）可能由污染的蜂蜜或奶粉而傳染"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-74", "explanation": "肉毒桿菌中毒的治療是立即施打「抗毒素」以中和血中游離毒素，並給予呼吸支持；疫苗屬事前主動免疫，對已中毒者無立即療效，故 B 錯誤。此菌為產芽孢的絕對厭氧菌，常見於保存不當的罐頭與真空包裝食品，嬰兒則可能因食用蜂蜜而致病，故一歲以下不建議餵食蜂蜜。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 75, "stem": "關於萊姆病（Lyme disease）及其病原體的敘述，下列何者錯誤？", "options": ["由包氏疏螺旋體（Borrelia burgdorferi）感染所引起", "主要是人與人之間藉由體蝨（body louse）互相傳染", "典型的症狀是病媒叮咬皮膚，傷口出現遊走性紅斑（erythema migrans）", "若未適當治療可能導致神經症狀及關節炎"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-75", "explanation": "萊姆病是經硬蜱（tick）叮咬傳染的人畜共通疾病，不會在人與人之間藉體蝨傳播，故 B 錯誤。體蝨傳播的是流行性斑疹傷寒與回歸熱。其早期特徵為靶心狀的遊走性紅斑，未治療可進展為心臟傳導阻滯、神經症狀與慢性關節炎。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 76, "stem": "關於新型隱球菌（Cryptococcus neoformans）的敘述，下列何者錯誤？", "options": ["常在鴿子的糞便中被發現", "會形成莢膜（capsule）", "會引發黴菌性腦膜炎（fungal meningitis）", "只會在免疫缺失的病患身上造成感染"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-76", "explanation": "新型隱球菌雖以免疫功能低下者（尤其愛滋病人）為主要感染族群，但免疫功能正常者仍可能發病，並非「只會」感染免疫缺失病人，故 D 錯誤。此菌常存在於鴿糞，具多醣莢膜可抵抗吞噬，經吸入後易播散至中樞神經造成隱球菌腦膜炎，可用墨汁染色檢出。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 77, "stem": "肝炎病毒感染後，下列何者只會造成急性肝炎，並不會導致長期慢性感染的發生？", "options": ["A 型肝炎病毒", "B 型肝炎病毒", "C 型肝炎病毒", "D 型肝炎病毒"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-77", "explanation": "A 型肝炎經糞口途徑傳染，僅造成急性肝炎，痊癒後可獲終身免疫，不會轉為慢性帶原，故選 A。B、C、D 型皆經血液與體液傳染並可能演變為慢性肝炎、肝硬化與肝癌，其中 C 型的慢性化比率最高。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 78, "stem": "下列何類型藥物，無法用於抑制人類免疫缺乏病毒（HIV）？", "options": ["神經氨酸水解酶抑制劑（neuraminidase inhibitor）", "核苷類似物（nucleoside analogue）", "蛋白酶抑制劑（protease inhibitor）", "嵌合酶抑制劑（integrase inhibitor）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-78", "explanation": "神經氨酸酶抑制劑（如 Oseltamivir）是抑制流感病毒自宿主細胞釋出的藥物，HIV 並無此酵素，故選 A。抗 HIV 的雞尾酒療法組合包含核苷類似物反轉錄酶抑制劑、蛋白酶抑制劑與嵌合酶抑制劑。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 79, "stem": "有關庫賈氏病（Creutzfeldt-Jakob disease, CJD）的敘述，下列何者錯誤？", "options": ["大部分患者曾暴露到牛海綿狀腦病（bovin spongiform encephalopathy）致病原", "為 prion 蛋白所引起", "目前並無特殊療法可以延緩疾病的進程，以支持性治療為主", "無法利用血液檢驗（serologic tests）檢出"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-79", "explanation": "約 85% 的庫賈氏病屬散發型，病因不明，僅少數為遺傳型或醫源性；與牛海綿狀腦病（狂牛症）有關的是罕見的「新變異型」CJD，故 A 錯誤。其致病原為異常摺疊的普利昂蛋白，不含核酸也不引發免疫反應，因此無法以血清學檢驗診斷，目前亦無有效療法。"}, {"year": "110", "session": "第二次", "subject": "基礎醫學", "num": 80, "stem": "下列何種寄生蟲病診斷時不需要檢查糞便檢體？", "options": ["蛔蟲病（ascariasis）", "鞭蟲病（trichuriasis）", "旋毛蟲病（trichinellosis）", "腸道毛線蟲病（intestinal capillariasis）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "110-2-1104-80", "explanation": "旋毛蟲的幼蟲寄生於橫紋肌內形成包囊，蟲卵不會排入腸道，診斷需靠肌肉切片、血清學檢查與嗜伊紅性白血球增多，而非糞便檢查，故選 C。蛔蟲、鞭蟲與腸道毛線蟲皆寄生於腸道，糞便中可檢出蟲卵。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 1, "stem": "王女士 30 歲，第一次懷孕，詢問有關人性化生產準備，下列護理師的回應何者較不適當？", "options": ["與產婦一起討論生產計畫", "多元友善的生產環境，是鼓勵家人參與分娩過程", "提供新生兒於產後立即第一次與產婦接觸", "醫院生產前會有禁食、灌腸、會陰切開等常規處置"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-1", "explanation": "人性化生產強調減少不必要的常規醫療介入，禁食、灌腸、會陰切開已非例行處置，故較不適當者選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 2, "stem": "有關嬰兒正確含乳的注意事項，下列護理指導何者正確？", "options": ["需下壓乳暈以免乳房壓到嬰兒鼻子造成缺氧", "通常上乳暈露出比下乳暈少", "以乳頭觸動嬰兒的嘴以利張口含乳", "吸吮到乳汁會發出嘖嘖聲"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-2", "explanation": "正確含乳應以乳頭輕觸嬰兒嘴唇誘發張口反射再含入，故選 C。不需以剪刀式下壓乳暈；含乳正確時上方露出的乳暈應比下方多；聽到嘖嘖聲代表含乳不當漏氣。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 3, "stem": "有關第二孕期母血唐氏症四指標（quadruple test）之檢測項目，下列何者錯誤？", "options": ["胎兒甲型蛋白（AFP）", "非結合性雌三醇（Unconjugated estriol, uE3）", "β-人類絨毛膜性腺激素（β-hCG）", "胎盤生長激素（PlGF）"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-3", "explanation": "第二孕期母血四指標為 AFP、uE3、β-hCG 與 Inhibin A，不含胎盤生長激素（PlGF），故錯誤者選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 4, "stem": "懷孕期間由於生理機能改變，使得藥物在孕婦體內的吸收、分布、代謝與排泄均有改變，下列敘述何者正確？", "options": ["潮氣容積量下降，使吸入性藥物的吸收減少", "藥物與白蛋白結合比例降低，肝臟對藥物的代謝能力增加", "腎絲球過濾率增加，藥物的代謝變慢", "胃排空加快胃酸分泌增加，藥物滯留腸胃道時間減少"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-4", "explanation": "孕期血漿白蛋白濃度下降，藥物與白蛋白結合比例降低、游離藥物增加，肝臟代謝能力亦提高，故選 B。孕期潮氣容積增加、腎絲球過濾率增加使排泄加快、胃排空則延遲。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 5, "stem": "有關產前胎兒生理活動評估，下列敘述何者正確？", "options": ["計分方式分為兩種，而滿分標準分為 8 分和 10 分", "若總分為 6 分，表示胎兒狀況良好可每週再重複做一次", "超音波觀察之項目，如呼吸運動、胎動、胎兒身體張力和羊水容積", "正常羊水容積是指兩相互垂直的平面羊水囊，直徑均小於 1 公分"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-5", "explanation": "胎兒生理活動評估（BPP）以超音波觀察呼吸運動、胎動、肌肉張力與羊水量，再加上無壓力試驗，故選 C。滿分為 10 分；6 分屬可疑需追蹤；正常羊水囊垂直深度應大於 2 公分。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 6, "stem": "有關妊娠期會陰按摩，下列敘述何者正確？", "options": ["藉由按摩減少會陰肌肉的延展性，以減少會陰撕裂傷", "可在妊娠 32～34 週開始按摩，每星期至少 3～4 次", "會陰按摩應是一種無菌措施，以防止胎兒受到感染", "按摩應避免觸及尿道口，過程中若有微熱感是異常現象"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-6", "explanation": "會陰按摩建議自妊娠 32～34 週開始，每週至少 3～4 次，目的在增加會陰組織延展性以減少撕裂傷，故選 B。按摩為清潔而非無菌措施，過程中有微熱感屬正常。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 7, "stem": "妊娠各時期的孕婦心理反應會因生理的改變而產生變化。第一妊娠期婦女的心理反應，下列敘述何者最適當？", "options": ["憂喜參半的矛盾心理", "接受懷孕事實", "準備新角色", "身體界限的改變"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-7", "explanation": "第一妊娠期婦女典型心理反應為對懷孕憂喜參半的矛盾心理，故選 A。接受懷孕事實與身體界限改變多見於第二期，準備新角色則在第三期。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 8, "stem": "李女士月經週期約 28～45 天，產前門診剛確定懷孕，最後一次月經來是上個月 3 號，下列何者為最準確的預產期推估法？", "options": ["用最後一次月經（LMP）日期，以內格來氏法推估", "詢問其最可能的排卵受孕日期，再加上 266 天", "等到第二孕期感受到胎動的日期，再加上 20～22 週", "以超音波觀察胚胎發育，例如：妊娠囊、胎心音"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-8", "explanation": "個案月經週期不規則（28～45 天），排卵日難以推算，內格來氏法不準確，宜以早期超音波觀察妊娠囊、胚胎大小推估最準確，故選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 9, "stem": "護理師執行腹部四段式操作法之主要目的為何？", "options": ["測子宮收縮強度", "測胎兒心跳", "檢查胎產式", "測子宮收縮頻率"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-9", "explanation": "腹部四段式觸診（Leopold's maneuvers）主要在評估胎產式、胎位、胎向與先露部位下降情形，故選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 10, "stem": "懷孕 30 週婦女，主訴想強化骨盆肌肉群，下列產前運動之建議何者正確？①盤腿坐姿運動 ②凱格爾運動 ③蹲踞運動 ④膝胸臥式運動 ⑤腹肌收縮運動", "options": ["①②③", "①③④", "②③④", "②④⑤"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-10", "explanation": "強化骨盆肌肉群可採①盤腿坐姿、②凱格爾運動與③蹲踞運動，故選 A。④膝胸臥式用於矯正胎位，⑤腹肌收縮運動主要強化腹部肌群。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 11, "stem": "陳女士 G2P1 待產時發現胎位為枕後位，主訴腰酸疼痛，下列護理措施何者不適當？", "options": ["運用生產球膝跪姿有助於胎頭旋轉，減輕疼痛", "採站立弓箭步有助於胎頭旋轉，減輕疼痛", "按摩薦骨處，並請待產婦平躺，減輕疼痛", "冷熱敷骶骨處，減輕疼痛"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-11", "explanation": "枕後位腰痛應採前傾姿勢（膝跪、弓箭步）並按摩薦骨以促進胎頭旋轉，平躺會加重腰薦部壓迫且不利旋轉，故不適當者選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 12, "stem": "有關待產婦呼吸技巧之敘述，下列何者錯誤？", "options": ["第一產程時，不須拘泥呼吸形態，只要待產婦覺得舒適即可", "建議呼吸技巧與其他舒適技巧並用", "出現迫切想用力時，可採用哈氣呼吸法", "待產婦若有換氣過度時，常因體內存留太多 CO2，導致嘴唇或手指有麻刺感"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-12", "explanation": "換氣過度是 CO2 排出過多、體內 CO2 過低造成呼吸性鹼中毒，才出現嘴唇與手指麻刺感，故錯誤者選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 13, "stem": "當待產婦有下列何者描述時，可判斷為真陣痛的徵象？", "options": ["我剛剛坐著休息一下就好像沒那麼痛了", "我的子宮收縮痛的強度增加且越來越密", "我感覺到下腹部有子宮收縮痛", "我在走動時子宮收縮就沒那麼痛"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-13", "explanation": "真陣痛的特徵是收縮強度漸增、間隔漸短，且不因休息或走動而緩解，故選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 14, "stem": "有關第二產程的敘述，下列何者錯誤？", "options": ["胎頭下降壓迫薦椎和閉孔神經，使產婦有便意感", "建議採超過 10 秒閉氣用力法", "在第二產程的休息期時，不建議用力", "指子宮頸完全擴張到胎兒完全娩出的過程"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-14", "explanation": "第二產程不建議超過 10 秒的閉氣用力，長時間 Valsalva 會減少胎盤灌流造成胎兒缺氧，宜採開放性聲門的自發性用力，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 15, "stem": "下列何種胎位之生產時間通常較短？", "options": ["LOP", "LOA", "LSA", "LMP"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-15", "explanation": "LOA（左枕前位）為最有利分娩的胎位，胎頭俯屈良好、產程通常較短，故選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 16, "stem": "李女士 G1P0，子宮收縮每 2 分鐘一次，子宮頸口開 9 公分，變薄程度為 90%，先露部位高度為 0，產婦說：「我很痛，我要用力了」，此時的優先護理措施為何？", "options": ["通知麻醉醫師，告知產婦疼痛狀況", "教導平躺休息以避免子宮頸腫脹", "教導吹熄蠟燭式呼吸", "教導閉氣向下用力"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-16", "explanation": "子宮頸開 9 公分屬過渡期，尚未全開即用力會造成子宮頸水腫與撕裂，應教導吹熄蠟燭式（哈氣）呼吸以抑制用力感，故選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 17, "stem": "蔡女士第一胎，子宮收縮每 2 分鐘一次，每次持續 60 秒，收縮強度為中度，子宮頸口開 8 公分，突然自然破水，羊水呈棕綠色，無晚期減速或變異性減速的情形。此時最優先的護理措施為何？", "options": ["內診評估子宮頸口變化", "監測子宮收縮", "測量體溫、脈搏、呼吸", "測量胎心率"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-17", "explanation": "羊水呈棕綠色代表胎便染色，可能為胎兒窘迫或胎便吸入風險，最優先應持續監測胎心率以評估胎兒狀況，故選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 18, "stem": "有關產婦產後第 1 天的生理變化，下列敘述何者錯誤？", "options": ["白血球增多症（leukocytosis）", "凝血因子（coagulation）減少", "黃體素（progesterone）減少", "雌性素（estrogen）減少"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-18", "explanation": "產後為預防出血，凝血因子與纖維蛋白原是增加而非減少，形成暫時性高凝狀態，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 19, "stem": "張女士產後第一天，表示：「初乳黃黃黏黏的，聽說對嬰兒不好，等等我把它擠掉以後再餵奶。」，下列敘述何者正確？", "options": ["初乳可以促進胎便排出，減少膽紅素再吸收，所以可以減少黃疸的機率", "初乳因為不含脂肪但含易消化吸收的乳糖，所以有利消化能力弱的新生兒", "初乳含豐富的抗體 IgM，可以保護新生兒不受病菌感染", "初乳含的維生素 K 雖然不如成熟乳多，但仍有防止出血的功用"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-19", "explanation": "初乳有輕瀉作用可促進胎便排出、減少膽紅素經腸肝循環再吸收，因而降低黃疸機率，故選 A。初乳含脂肪、主要抗體為分泌型 IgA，維生素 K 含量不足以預防出血。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 20, "stem": "李女士，哺餵母乳，產後出院前表示：「我暫時不想懷孕，想跟以前一樣吃避孕藥，可以考慮使用避孕器，其他方法就不用了。」，下列敘述何者最適當？", "options": ["餵母奶期間不可以吃口服避孕藥，要改用保險套或是禁慾", "如果要吃避孕藥，需先禁慾，等接著的月經來潮後再開始吃", "如果要吃混合雌性素與黃體素的避孕藥，現在可以開始服用", "如果要用子宮內避孕器，要等 4～6 週後返診時再置入"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-20", "explanation": "哺乳婦女的子宮內避孕器宜於產後 4～6 週子宮復舊後返診置入，故選 D。含雌性素的複合口服避孕藥會抑制泌乳，哺乳期不建議使用。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 21, "stem": "蔡女士 18 歲，表示：「我都用保險套避孕，前幾天跟我男友發生關係，忘記要用套子，可是我們不想懷孕。」，下列敘述何者最適當？", "options": ["說明墮胎的方式與合併症，建議跟男友商量並繼續懷孕", "Mifepristone（RU486）有拮抗黃體素的作用，可以用來避免懷孕", "因為還不確定懷孕，建議繼續觀察，確定懷孕後再決定如何處理", "在 72 小時內服用高劑量雌性素，12 小時後再服第二劑，可以用來避孕"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-21", "explanation": "Mifepristone（RU486）具拮抗黃體素作用，可阻斷著床，用於緊急避孕或早期終止妊娠，故選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 22, "stem": "有關新生兒飢餓的暗示行為，下列敘述何者錯誤？", "options": ["寶寶的手伸向嘴巴並扭動身體", "臉部放鬆", "舌頭伸出來", "寶寶的臉轉向照顧者"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-22", "explanation": "飢餓暗示行為包括手往嘴巴移動、身體扭動、伸舌與尋乳轉頭；臉部放鬆是吃飽滿足的表現，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 23, "stem": "婦女於正常陰道生產後的復舊生理變化，下列何者所需時間最長？", "options": ["陰道皺襞", "心輸出量", "排尿量", "月經週期"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-23", "explanation": "月經週期的恢復所需時間最長，未哺乳者約 6～10 週、哺乳者可延遲數月，故選 D。陰道皺襞約 3～4 週恢復，心輸出量與排尿量多在產後 1～2 週內回復。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 24, "stem": "白女士 G2P2，陰道生產後一週，此時惡露的評估正常為何？①白色 ②粉紅色 ③1 小時內產墊上的血液約為 5 公分 ④30 分鐘浸溼整片產墊", "options": ["①③", "②④", "①④", "②③"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-24", "explanation": "產後一週惡露應為②漿液性（粉紅至褐色），量以③1 小時內產墊上血跡約 5 公分內為正常，故選 D。白色惡露約在產後 10 天後出現；30 分鐘浸溼整片產墊屬異常大量出血。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 25, "stem": "白女士因胎兒窘迫接受剖腹生產，採腰椎硬膜外麻醉，有關於術後姿勢及其護理指導，下列何者最適當？", "options": ["採垂頭仰臥式，有助呼吸道分泌物引流", "維持平躺 8 小時，避免腦脊髓液滲出", "採辛氏臥位頭側向一邊，避免分泌物阻塞呼吸道", "協助左側躺，以增加子宮的血液循環"], "answer": "ABCD", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-25", "explanation": "考選部公告本題一律給分，四個選項均計分。臨床上腰椎硬膜外麻醉並未穿刺硬脊膜，術後不需嚴格平躺 8 小時，可協助側臥並注意呼吸道通暢。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 26, "stem": "下列那一個新生兒篩檢項目為檢測性聯染色體隱性遺傳疾病？", "options": ["半乳糖血症", "G-6-PD 缺乏症（蠶豆症）", "高胱胺酸尿症", "先天性甲狀腺低能症"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-26", "explanation": "G-6-PD 缺乏症（蠶豆症）為性聯（X 染色體）隱性遺傳，故選 B。半乳糖血症、高胱胺酸尿症屬體染色體隱性遺傳，先天性甲狀腺低能症多為散發性。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 27, "stem": "有關新生兒髖關節脫臼的身體或姿勢表徵，下列何者錯誤？", "options": ["大腿與臀部的股縫不對稱", "膝關節屈曲時患部的股骨較長", "歐特蘭尼徵象（Ortolani’s sign）為陽性", "外展患部髖部動作時會受限且有阻力"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-27", "explanation": "髖關節脫臼時患側股骨看起來較短（Allis／Galeazzi 徵象），非較長，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 28, "stem": "聽診新生兒心跳速率的部位，下列何者正確？", "options": ["左鎖骨內側第 2 至第 3 肋間交會點", "左鎖骨中線第 3 至第 4 肋間交會點", "左鎖骨內側第 3 至第 4 肋間交會點", "左鎖骨中線第 2 至第 3 肋間交會點"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-28", "explanation": "新生兒心尖脈的聽診部位在左鎖骨中線第 3～4 肋間交會點，故選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 29, "stem": "有關新生兒腸胃系統及排泄，下列敘述何者錯誤？", "options": ["新生兒出生後 3～4 天，體重會下降 5～10%，稱為生理性脫水", "新生兒出生後 12 小時內未解胎便，應通知小兒科醫師檢查", "出生 3～4 天後因哺餵母乳或配方奶的關係，會解出過渡便", "因新生兒賁門擴約肌未成熟，應避免餵食太飽"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-29", "explanation": "新生兒應於出生後 24 小時內解出胎便，超過 24 小時未解才需通報醫師評估是否有腸阻塞，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 30, "stem": "張女士，妊娠 8 週，因陰道斷續性少量出血到門診檢查。主訴有嚴重的噁心和嘔吐，醫師初步評估子宮大小超過懷孕週數，hCG 值偏高，超音波掃描未看到胎兒影像。張女士最可能的情況是：", "options": ["先兆性流產", "子宮外孕", "雙胞胎", "葡萄胎"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-30", "explanation": "子宮大於妊娠週數、hCG 明顯偏高、嚴重孕吐且超音波未見胎兒影像，最符合葡萄胎的表現，故選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 31, "stem": "王女士，懷孕 32 週，突然發生陰道出血而入院，醫囑住院安胎。評估個案未覺腹痛，出血呈鮮紅色、量中。護理師的處置與指導，下列何者錯誤？", "options": ["密切觀察生命徵象及出血狀況", "若安胎失敗，只能採剖腹生產", "評估與治療前，給予個案和家屬說明程序", "禁止執行陰道檢查"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-31", "explanation": "無痛性鮮紅色陰道出血高度懷疑前置胎盤；若為邊緣性且出血停止，仍可能經陰道分娩，並非只能剖腹，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 32, "stem": "下列何者不適合使用麥角鹼類藥物（如 Ergonovine）來促進產後的子宮收縮？①妊娠糖尿病 ②前置胎盤 ③子癇前症 ④心臟疾病", "options": ["①②", "②③", "③④", "②④"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-32", "explanation": "麥角鹼類會使全身血管收縮、升高血壓，③子癇前症與④心臟疾病者禁用，故選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 33, "stem": "有關德國麻疹與懷孕關係，下列敘述何者錯誤？", "options": ["病毒藉由空氣及飛沫傳染", "德國麻疹疫苗是活的減毒疫苗", "孕婦應接種疫苗以避免感染", "妊娠初期感染會造成胎兒嚴重缺陷"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-33", "explanation": "德國麻疹疫苗為活性減毒疫苗，孕婦不可接種，應於孕前或產後補種，故錯誤者選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 34, "stem": "陳女士因痛經求診，護理師的回答，下列何者最適當？", "options": ["可自行服用止痛藥", "可泡熱水澡以舒緩疼痛", "可多吃巧克力、咖啡等食物", "多休息，局部熱敷下腹部"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-34", "explanation": "痛經的護理指導以充分休息、下腹部局部熱敷緩解痙攣最適當，故選 D。止痛藥宜經醫師評估後使用，咖啡因與巧克力可能加重不適。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 35, "stem": "鄭女士因骨盆腔炎症入院治療，下列敘述何者正確？", "options": ["護理指導安全性生活", "臥床休息，採側臥以利引流", "執行陰道灌洗，以保持清潔", "每天限液體 1,000 c.c.內"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-35", "explanation": "骨盆腔炎多經性行為感染，衛教安全性行為可預防再發，故選 A。宜採半坐臥利引流、禁行陰道灌洗，且應鼓勵多攝取水分。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 36, "stem": "有關更年期婦女使用荷爾蒙補充療法的禁忌，下列何者錯誤？", "options": ["下肢靜脈血栓", "憂鬱症", "高血壓", "子宮頸原位癌"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-36", "explanation": "荷爾蒙補充療法禁忌包括靜脈血栓、乳癌或雌激素依賴性腫瘤、不明原因陰道出血、肝功能異常等；憂鬱症並非禁忌，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 37, "stem": "有關更年期婦女的護理指導，下列何者不適當？", "options": ["定期做子宮頸抹片檢查", "鈣攝取量增加至 500 mg/天，以預防骨質疏鬆", "減少高糖高油脂食物", "建議維生素 D 攝取 400 IU/天"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-37", "explanation": "更年期婦女每日鈣建議攝取量約 1000～1200 mg，僅增加至 500 mg 明顯不足，故不適當者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 38, "stem": "下列何者不是預防新生兒臍帶感染的護理措施？", "options": ["沐浴前先用 95%的酒精消毒，再用 75%的酒精促進乾燥", "每次更換尿布時應注意臍帶是否有感染徵象", "包尿布時應保持尿布在臍部以下，避免尿液回滲", "臍帶尚未脫落前，應隨時保持臍部清潔乾燥"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-38", "explanation": "現行臍帶護理以保持清潔乾燥為原則，不建議先以 95% 酒精消毒再用 75% 酒精，且兩者濃度用途也顛倒（75% 消毒、95% 促乾），故選 A。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 39, "stem": "下列何者最可能與原發性月經疼痛相關？", "options": ["前列腺素", "子宮肌瘤", "卵巢腫瘤", "經血量過多"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-39", "explanation": "原發性痛經與子宮內膜合成前列腺素過多、引起子宮強烈收縮及缺血有關，故選 A。子宮肌瘤、卵巢腫瘤屬續發性痛經原因。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 40, "stem": "王女士 26 歲，結婚 2 年，因性交疼痛令其十分困擾而就診，下列護理措施何者錯誤？", "options": ["夫婦兩人一起討論以發掘彼此忽略的問題", "為顧及配偶自尊，治療初期以王女士為主", "探討病因期間建議王女士暫時禁慾", "必要時可鼓勵使用無刺激性的潤滑劑"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-40", "explanation": "性功能障礙宜由夫妻雙方共同參與評估與治療，僅以女方為主無法解決互動層面的問題，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 41, "stem": "有關 3 歲兒童的心肺復甦術之敘述，下列何者正確？", "options": ["執行心外按摩，以兩根手指按壓胸骨，深度為 4 公分", "檢查有無脈搏時，以肱動脈為主", "執行人工呼吸時，應同時罩住口、鼻，以防吹氣時漏氣", "胸部按壓與人工呼吸比例，單人施救應 30：2，雙人施救應 15：2"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-41", "explanation": "兒童 CPR 胸部按壓與人工呼吸比例為單人 30：2、雙人 15：2，故選 D。1 歲以上兒童以單手或雙手按壓、深度約胸廓前後徑 1/3（約 5 公分），脈搏檢查以頸動脈為主，人工呼吸採口對口並捏住鼻子。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 42, "stem": "小強，5 歲，因溺水急救後送至急診，體溫為 29℃，下列處置何者錯誤？", "options": ["使用 40～45℃加熱潮濕的氧氣", "由靜脈提供 40～42℃的溫熱液體", "給予 40～45℃電解液行胃灌洗", "給予加溫毯使體溫上升 3℃/小時"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-42", "explanation": "低體溫復溫速度過快易致復溫休克與心律不整，一般以每小時上升 1～2℃ 為宜，故錯誤者選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 43, "stem": "小剛，12 歲，國小六年級，因最近走路經常偏斜、跌倒，情緒變得暴躁，且經常遺忘事情而入院，經醫師檢查後，診斷為惡性腦瘤，母親情緒低落的說：「怎麼會這樣呢？小剛這麼乖，為什麼要讓他受這麼多折磨，我到底做錯了什麼？」，護理師最適當的處理為何？", "options": ["媽媽別難過，只要配合醫師，醫師一定會把孩子醫好的", "小剛這麼乖，這麼聽話，媽媽要有信心，上帝一定會幫助他的", "媽媽聽了醫師病情解釋後，心理一定非常傷心難過，如果想哭就哭出來", "人生有許多不如意的事，媽媽不要想太多"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-43", "explanation": "面對得知孩子罹患惡性腦瘤的母親，同理其悲傷並允許情緒宣洩最適當，故選 C。其餘皆為虛假保證或阻斷情緒表達。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 44, "stem": "針對注意力不足／過動症（attention deficit hyperactivity disorder, ADHD）的行為表現與診斷之敘述，下列何者錯誤？", "options": ["容易分心精神無法集中", "過動及衝動行為持續 3 個月", "學齡兒童常見的發展性神經行為障礙之一", "重複一些被禁止的行為，企圖引他人注意"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-44", "explanation": "ADHD 診斷需症狀持續至少 6 個月，且於 12 歲前出現、在兩種以上場合造成功能損害，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 45, "stem": "小莉，3 歲，因被熱湯潑及，處於燒燙傷急救期（emergent period），當小莉在低血量休克狀態下時，下列何者為最有效的止痛劑給予途徑？", "options": ["鼻部吸入", "皮下注射", "肌肉注射", "靜脈注射"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-45", "explanation": "低血量休克時周邊循環不良，皮下與肌肉注射吸收不穩定，應採靜脈注射給予止痛劑，故選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 46, "stem": "美國精神疾病診斷準則手冊第五版（DSM-5）將自閉症、亞斯伯格症及未分類廣泛性發展障礙，統稱為自閉症類群障礙症（autism spectrum disorder, ASD），有關其身心表徵，下列何者錯誤？", "options": ["孤立的人際互動", "動作協調困難", "堅持固定的習慣或玩法", "語言和溝通能力障礙"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-46", "explanation": "自閉症類群障礙症的核心表徵為社交互動障礙、語言溝通障礙與固著重複行為；動作協調困難非其診斷表徵，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 47, "stem": "有關兒童虐待的敘述，下列何者錯誤？", "options": ["遇到可疑的受虐兒，可撥打 110 或 113 專線", "1 歲以下嬰兒身上有任何的骨折，都須通報", "與受虐兒談話時，需協助指認及責怪施虐者", "施虐者大多是受虐兒熟識的身邊人占最多"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-47", "explanation": "與受虐兒會談時應避免要求指認或責怪施虐者，以免造成二度傷害與衝突，故錯誤者選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 48, "stem": "有關為 4 歲的兒童進行身體檢查評估時，下列敘述何者最適當？", "options": ["測量耳溫時，應將該兒童的耳朵向下向後拉", "測量心尖脈的位置為左鎖骨中線與第五肋間交會點", "進行副鼻竇檢查時，首重出生時即存在且發育的額竇", "進行呼吸速率評估時，應注意該年齡為腹式呼吸"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-48", "explanation": "4 歲兒童（約 7 歲以前）仍以腹式呼吸為主，評估呼吸速率時須注意此特性，故選 D。3 歲以上量耳溫應將耳廓向上向後拉；此年齡心尖脈在左鎖骨中線第 4～5 肋間；額竇約 6～7 歲後才發育。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 49, "stem": "護理師為了讓 2～6 歲病童認為藥杯內藥物減少，將小藥杯改為較大底面積的藥杯，主要是運用兒童尚未發展何種認知概念？", "options": ["物體恆存", "質量保留", "象徵符號", "抽象邏輯"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-49", "explanation": "2～6 歲屬前運思期，尚未發展質量保留概念，會以容器外觀判斷多寡，故選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 50, "stem": "下列那個年齡層兒童，其繪畫發展已能充分表現創造性、具有平面及空間概念畫法？", "options": ["2～4 歲", "4～7 歲", "7～9 歲", "9～12 歲"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-50", "explanation": "7～9 歲學齡兒童的繪畫進入寫實期，已能表現平面與空間概念並展現創造性，故選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 51, "stem": "依據皮亞傑（Piaget）的認知發展理論，感覺運動期（sensory-motor stage）的孩童，主要在建立何種概念？", "options": ["萬物有靈", "時間概念", "物體恆存", "抽象符號"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-51", "explanation": "感覺運動期（0～2 歲）的主要認知成就是建立物體恆存概念，故選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 52, "stem": "餵食母乳之新生兒，可由母乳得到何種抗體，協助其對抗水痘、單純性疱疹與流行性感冒？", "options": ["IgA", "IgD", "IgE", "IgG"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-52", "explanation": "母乳（尤其初乳）富含分泌型 IgA，可在腸道與呼吸道黏膜形成保護，協助對抗水痘、單純疱疹與流感等病毒，故選 A。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 53, "stem": "早產兒的體溫調節功能不成熟，下列護理措施何者不適當？", "options": ["採集中護理，執行醫療照護時避免早產兒離開保溫箱", "低出生體重早產兒絕對不能執行袋鼠式護理，以免造成低體溫", "使用特殊透明膠膜覆蓋於加熱處理台（warmer），可以減少體熱散失", "早產兒抱出保溫箱時需要提供保暖，例如帽子、包被、手套"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-53", "explanation": "生命徵象穩定的低出生體重早產兒仍可執行袋鼠式護理，有助維持體溫與促進親子依附，故不適當者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 54, "stem": "小衡，7 歲，因妥瑞氏症（Tourette’s disorder），在學校常出現搖頭聳肩、發出狗叫聲，導致班上同學嘲笑，下列護理措施何者不適當？", "options": ["疾病會影響智能發展，宜提供特殊教育", "評估小衡對疾病的認知程度，給予正向的心理支持", "教導小衡學會放鬆，減少因身體抽動導致疲倦的症狀", "教導家屬發掘小衡潛能或專長，以建立良好的自信心"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-54", "explanation": "妥瑞氏症不影響智能發展，不需安排特殊教育，重點在協助適應與同儕理解，故不適當者選 A。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 55, "stem": "小妮，1 歲半，診斷為蠶豆症（G-6-PD），有關此疾病之兒童與家庭壓力反應之護理措施，下列敘述何者最不適當？", "options": ["應用聯合性遊戲溝通，以緩解其罪惡感", "儘量減少與父母分離以避免分離焦慮", "儘量維持小妮的日常生活作息與規範", "做任何治療時應使用簡潔的字句與小妮溝通"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-55", "explanation": "1 歲半屬幼兒期，遊戲型態為平行遊戲而非聯合性遊戲，且此年齡尚未發展出罪惡感，故最不適當者選 A。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 56, "stem": "媽媽看到 2 歲大的小寶喝了一大口漂白水，應該如何立即處置再送醫？", "options": ["先給小寶清水漱口", "先給小寶喝一點牛奶", "先幫小寶拍背讓他吐出來", "給予吐根糖漿引發嘔吐"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-56", "explanation": "漂白水屬腐蝕性物質，誤食後不可催吐以免二次灼傷，可先給少量牛奶或清水稀釋後立即就醫，故選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 57, "stem": "有關護理師與癌症末期病童談論有關死亡的溝通方式，下列敘述何者最適當？", "options": ["可鼓勵學齡期病童憑空想像死亡的意義", "避免與病童討論死亡議題", "提供病童遊戲和藝術，表達其想法與感受", "給予病童痊癒的希望"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-57", "explanation": "提供遊戲與藝術活動，讓病童以非語言方式表達對死亡的想法與感受最適當，故選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 58, "stem": "新生兒經母子垂直感染後天免疫缺乏症候群（AIDS），有關護理措施之敘述，下列何者錯誤？", "options": ["執行侵入性治療時採取全面性防護措施", "鼓勵哺餵母乳以提升新生兒免疫能力", "可按時接種 B 肝疫苗", "不會透過唾液及碰觸帶原者所接觸的物體感染"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-58", "explanation": "HIV 可經母乳傳染，故不應鼓勵哺餵母乳，錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 59, "stem": "有關麻疹與德國麻疹的臨床表徵之比較，下列何者正確？", "options": ["麻疹會在口腔出現科氏斑點（Kopliks’ spots）", "德國麻疹在紅疹消退後留下棕色色素沉著", "德國麻疹會出現咳嗽、結膜炎、鼻炎的症狀", "麻疹的疹子出現在淋巴腺腫大之後"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-59", "explanation": "麻疹在出疹前 1～2 天會於口腔頰黏膜出現科氏斑點，具診斷價值，故選 A。麻疹疹退後留棕色沉著並伴咳嗽、結膜炎、鼻炎；德國麻疹則先有耳後及枕下淋巴結腫大。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 60, "stem": "幼兒感染腸病毒後的 5 天內，需要密切注意腸病毒的嚴重合併症狀，下列選項何者除外？", "options": ["嗜睡、意識不清、活力不佳、手腳無力", "無故驚嚇或突然間全身肌肉收縮", "呼吸急促或心跳加快", "腸骨疼痛"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-60", "explanation": "腸病毒重症前兆為嗜睡、意識不清、活力不佳、肌抽躍（無故驚嚇）、持續嘔吐、呼吸急促或心跳加快；「腸骨疼痛」並非重症徵兆，故選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 61, "stem": "有關氣喘病童使用吸入型氣喘藥物，下列敘述何者錯誤？", "options": ["使用定量噴霧吸入劑（metered dose inhaler）時，應告訴病童閉氣 5～10 秒鐘", "乾粉吸入劑型（dry powder inhaler），建議適用於 5 歲以上之氣喘病童", "定量噴霧吸入劑（metered dose inhaler）的優點為劑量及副作用比口服少", "建議小於 10 歲兒童，使用定量噴霧吸入劑時併用面罩式吸藥輔助器（aerochamber）"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-61", "explanation": "建議小於 5 歲（而非 10 歲）的兒童使用定量噴霧吸入劑時併用面罩式吸藥輔助器，故錯誤者選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 62, "stem": "小玲，9 歲，於扁桃腺切除術（tonsillectomy）後，用手指著傷口並抱怨傷口疼痛，下列護理措施何者最適當？", "options": ["避免吃冰涼飲食，以免影響傷口癒合", "為緩解疼痛，依醫囑按時服用 Acetaminaphen", "建議小玲熱敷傷口，以降低腫脹減輕疼痛", "鼓勵喝檸檬汁或柳橙汁，以加速傷口癒合"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-62", "explanation": "扁桃腺切除術後應依醫囑按時給予 Acetaminophen 止痛，故選 B。術後宜給冰涼飲食與冰敷以止血止痛，並避免檸檬、柳橙等酸性刺激傷口。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 63, "stem": "張小妹，5 個月大，因肺部嚴重感染而住院，現有氣管內管留置，呼吸道分泌物黏稠，有關執行抽痰技能與應注意的事項，下列敘述何者正確？", "options": ["應每小時執行抽痰，以有效排除呼吸道之分泌物", "抽痰順序：氣管內管→口腔→鼻腔", "抽痰管應在無抽吸壓力狀態下，放置到抽吸部位", "抽吸壓力應調在 110～130 mmHg"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-63", "explanation": "抽痰管應在無抽吸壓力的狀態下插入至定位，再邊旋轉邊抽吸退出，以減少黏膜損傷與缺氧，故選 C。抽痰應視需要而非固定每小時執行；順序為氣管內管→鼻腔→口腔；嬰幼兒抽吸壓力約 60～100 mmHg。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 64, "stem": "有關兒童毛地黃（Digoxin）給藥之護理指導，下列敘述何者正確？", "options": ["給藥前測橈動脈 1 分鐘，以監測心律不整", "給予口服糖漿時與牛奶併用，增加服藥遵從性", "忘記給藥的時間如未超過 6 小時，則補服一劑", "長期服用需補充奶類食物，以預防低血鈣"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-64", "explanation": "忘記給藥若未超過 6 小時可補服一劑，超過則跳過該次並記錄，故選 C。給藥前應測心尖脈 1 分鐘、不宜與牛奶或食物併服，且須注意低血鉀會增加毒性。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 65, "stem": "小倫，6 個月大，患有法洛氏四重畸形（Tetralogy of Fallot, TOF），為維持心輸出量足夠身體所需之組織灌流的護理目標，下列護理措施何者不適當？", "options": ["集中護理、安撫小倫情緒，並減少哭泣", "避免便秘造成閉氣用力，增加心臟負擔", "宜選用柔軟、吸食洞孔稍大的奶嘴餵奶", "每次餵食時間不宜太短，應超過 30 分鐘"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-65", "explanation": "法洛氏四重畸形嬰兒每次餵食時間不宜超過 30 分鐘，過久會增加耗氧與心臟負擔，故不適當者選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 66, "stem": "30 週早產之男嬰，出生體重 1,500 公克，診斷開放性動脈導管（patent ductus arteriosus），以 Indomethacin 靜脈注射治療，下列敘述何者正確？", "options": ["尿量＜1 mL/kg/hr 時應通知醫師調整藥物劑量", "治療前聽診較少出現心雜音", "因肺動脈血流下降易造成發紺", "Indomethacin 易造成血栓之副作用"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-66", "explanation": "Indomethacin 會減少腎血流，尿量少於 1 mL/kg/hr 時應通知醫師調整劑量，故選 A。PDA 治療前可聽到連續性機械樣心雜音，肺血流增加而非下降，藥物副作用為出血傾向而非血栓。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 67, "stem": "阿強，9 歲，罹患 G-6-PD 缺乏症，因全身黃疸住院治療，有關此疾病之誘發因子，下列敘述何者錯誤？", "options": ["最近是否吃蠶豆", "最近是否服用 Aspirin", "最近是否有使用樟腦丸", "最近是否服用止咳藥"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-67", "explanation": "G-6-PD 缺乏症的誘發因子包括蠶豆、樟腦丸、磺胺類、抗瘧藥與 Aspirin 等；一般止咳藥並非誘發因子，故錯誤者選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 68, "stem": "有關鐮狀細胞貧血的敘述，下列何者錯誤？", "options": ["紅血球變形呈鐮刀狀", "遺傳因子血紅素 S（Hgb S）造成紅血球變形", "疼痛時可用 Aspirin 止痛", "經由體染色體隱性遺傳而來"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-68", "explanation": "鐮狀細胞貧血疼痛發作時不宜使用 Aspirin，以免加重酸中毒與出血風險，宜用 Acetaminophen 或嗎啡類止痛，故錯誤者選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 69, "stem": "小明，3 歲，罹患神經母細胞瘤，進行第一次化學治療需要裝置人工血管，有關人工血管的敘述，下列何者不適當？", "options": ["Port-A 植入需要由外科醫師於手術室完成", "PICC 可由特別訓練護理師執行導管插入", "Port-A 每個月需要沖洗一次 10 mL（含 Heparine100 U/mL）生理食鹽水", "PICC 是最適合小明化學治療期間，長期給藥的方式"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-69", "explanation": "長期、反覆的化學治療給藥以 Port-A 較適合，PICC 並非小明長期給藥的最佳方式，故不適當者選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 70, "stem": "化學治療期間血液檢查結果，絕對嗜中性白血球（absolute neutrophil count, ANC）數目為 320/mm3，依據檢查結果，下列護理指導何者較適當？", "options": ["教導個案 ANC 是確立白血病緩解與否的指標", "教導個案 ANC 的正常值會隨著年齡不同而改變", "教導個案注意預防感染，需採保護性隔離措施", "教導個案可能出現自發性出血，需要限制活動"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-70", "explanation": "ANC 320/mm³ 屬嚴重嗜中性球低下（＜500），感染風險極高，須衛教預防感染並採保護性隔離，故選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 71, "stem": "小名，14 歲，因左膝尖銳性疼痛、腫脹入院，醫師診斷為骨肉瘤（osteosarcoma）並進行截肢手術，下列護理措施何者不適當？", "options": ["觀察殘肢是否有出血、滲液或發炎", "評估幻肢痛，視需要使用藥物和神經阻斷法改善疼痛", "截肢術後立即以彈性繃帶固定殘肢，以預防攣縮", "截肢術後立即裝置永久性義肢，以減輕殘肢水腫"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-71", "explanation": "截肢術後不會立即裝置永久性義肢，應先以彈性繃帶塑型消腫，待殘肢穩定後再評估裝配，故不適當者選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 72, "stem": "小花，3 個月大，診斷為先天性甲狀腺功能低下，有關其疾病之臨床表徵，下列敘述何者正確？", "options": ["肌肉張力強", "前囟門未閉合", "常有腹瀉情形", "皮膚乾粗"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-72", "explanation": "先天性甲狀腺功能低下的表現為皮膚乾粗、肌肉張力差、便秘、活動力低與前囟門寬大且延遲閉合，故選 D。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 73, "stem": "嬰兒唇顎裂手術後的護理照護注意事項，下列敘述何者錯誤？", "options": ["需適時約束嬰兒，手臂避免抓到縫線", "避免哭泣影響傷口，可使用安撫奶嘴安撫之", "直立式坐姿是較適合餵食的方式", "可用毛毯限制嬰兒翻身，避免嬰兒碰到傷口"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-73", "explanation": "唇顎裂術後禁用奶嘴、吸管或任何會造成吸吮動作的物品，以免拉扯縫線，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 74, "stem": "王小弟，6 週大，每次餵奶後出現噴射式嘔吐，被診斷為幽門狹窄（pyloric stenosis），下列敘述何者正確？", "options": ["嘔吐物含膽汁，呈黃褐色", "嘔吐多發生在餵食完後", "上腹部出現由右至左慢慢移動的胃蠕動波", "大便含有血液與黏膜"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-74", "explanation": "幽門狹窄的嘔吐多發生在餵食完畢後，呈噴射狀，故選 B。嘔吐物不含膽汁、胃蠕動波由左至右移動、大便不含血液與黏膜。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 75, "stem": "小雄，2 歲，因嘔吐、體溫 38.6℃而入院，母親主訴小雄昨日就開始嘔吐、解水樣綠色便多次，且進食量、尿量明顯減少，體重由 14 公斤降到 13.1 公斤。下列評估何者正確？", "options": ["無脫水現象", "輕度脫水現象", "中度脫水現象", "重度脫水現象"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-75", "explanation": "體重由 14 公斤降至 13.1 公斤，減少 0.9 公斤約 6.4%，屬中度脫水，故選 C。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 76, "stem": "張小弟，10 歲，診斷為腎病症候群（nephrotic syndrome），目前服用 Prednisolone 治療，下列護理指導何者最適當？", "options": ["常見副作用是掉髮，建議以帽子或假髮修飾", "出現腸胃不適，先自行停藥，待症狀改善後再服用", "避免接觸有傳染病源的人或環境，以預防感染", "解血尿是藥物副作用所致，停藥後會改善"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-76", "explanation": "Prednisolone 為免疫抑制劑，須避免接觸感染源以預防感染，故選 C。常見副作用為月亮臉、多毛與體重增加，不可自行停藥，須依醫囑逐漸減量。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 77, "stem": "小芳，5 歲，罹患腦性麻痺（cerebral palsy），因咀嚼及吞嚥能力較差，導致進食量少，有關協助其進食的護理措施，下列敘述何者正確？", "options": ["提供高熱量、高蛋白質的流質食物，以增加進食量", "儘量將食物置放於舌頭後方", "膝蓋放鬆低於大腿，雙腳自然下垂", "不鼓勵小芳使用輔具學習獨立進食能力，以防嗆到"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-77", "explanation": "腦性麻痺兒童進食時可將食物置於舌頭後方以利引發吞嚥反射，故選 B。宜提供半固體或濃稠食物而非流質、進食時髖膝屈曲約 90 度雙腳踏穩，並鼓勵使用輔具學習獨立進食。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 78, "stem": "小玉，3 歲，因原有腦室-腹膜分流管（V-P shunt）感染，已移除並接受腦室外引流（external ventricular drainage）手術，有關術後護理措施，下列敘述何者正確？", "options": ["引流時需完全平躺，以眼睛高度為壓力零點，嚴禁抬高床頭", "此裝置可配合測量顱內壓", "只能採取持續性引流，不可關閉引流管", "將腦脊髓液引流至一個半開放式的無菌收集瓶"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-78", "explanation": "腦室外引流裝置可同時連接監測顱內壓，故選 B。壓力零點應對齊外耳道，床頭可依醫囑抬高；引流可視情況間歇關閉；收集系統應為密閉式無菌裝置。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 79, "stem": "陳小妹，於學校上體育課時，出現強直陣攣型痙攣（tonic-clonic seizure）發作，下列護理措施何者最不適當？", "options": ["壓額抬下巴，通暢呼吸道", "移開可能造成損傷的物品", "勿強行放置壓舌板於口內", "觀察並記錄發作型態與時間"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-79", "explanation": "痙攣發作當下不宜壓額抬下巴，應協助側臥、鬆開衣物並保護頭部，待發作結束再評估呼吸道，故最不適當者選 A。"}, {"year": "110", "session": "第二次", "subject": "產兒科護理學", "num": 80, "stem": "王小妹，8 個月大，被診斷為熱性痙攣（febrile convulsion），下列敘述何者最適當？", "options": ["熱性痙攣通常會續發為癲癇的主要原因", "發作時呈現全身性或局部性痙攣型態", "痙攣發作時間通常持續 1 小時以上", "熱性痙攣發作後，常造成肢體偏癱或智能障礙等後遺症"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "110-2-4104-80", "explanation": "熱性痙攣多呈全身性、少數為局部性的痙攣型態，故選 B。發作時間通常短於 15 分鐘，多數不會續發癲癇，也少留下偏癱或智能障礙等後遺症。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 1, "stem": "依據現行精神衛生法規定，嚴重病人不遵從醫囑導致病情不穩或生活功能有退化之虞，經強制社區治療審查會決定許可強制社區治療，此次嚴重病人在接受強制社區治療期間，不能超過多久？", "options": ["3 個月", "6 個月", "9 個月", "12 個月"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-1", "explanation": "依精神衛生法，強制社區治療每次許可期間不得超過 6 個月，故選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 2, "stem": "有關症狀穩定且日常生活可自理的精神病人，剛轉入康復之家，首要的復健目標為何？", "options": ["協助個案提升社區生活的能力", "減少藥物服用劑量和緩解副作用", "提升及早返家生活的機會", "提升個人的職場工作適應"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-2", "explanation": "康復之家屬社區型復健機構，服務對象為症狀穩定、生活可自理者，首要目標是提升其在社區獨立生活的能力，故選 A。減藥、返家或就業均為後續目標。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 3, "stem": "面對有自傷意念的憂鬱症病人，下列敘述何者最符合治療性溝通行為？", "options": ["「憂鬱症應該可以治好的，不要擔心。」", "「我認為你應該辭職，專心養病才對。」", "「想要自殺的人，都在逃避負責任。」", "「你對目前自己的狀況，不是很滿意。」"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-3", "explanation": "D 為「反映」技巧，將病人的感受回饋給對方，屬治療性溝通。A 是虛假保證、B 是給建議、C 是價值批判，皆非治療性。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 4, "stem": "吳女士，診斷思覺失調症，坐在餐桌前，不斷以手拍打桌子，口中喊著說：「怎麼這麼多蟑螂，快來幫忙打蟑螂。」雖然護理師告訴她沒有蟑螂在桌上，但她仍堅持桌上看到許多蟑螂。此為下列何種精神症狀？", "options": ["妄想（delusion）", "自我感消失（depersonalization）", "幻覺（hallucination）", "失真感（derealization）"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-4", "explanation": "沒有外在刺激卻產生知覺經驗（看見不存在的蟑螂）即為幻覺，故選 C。妄想是錯誤而堅信的思考內容；自我感消失與失真感屬解離症狀。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 5, "stem": "護理師問病人：「100 減 7 是多少？」然後連續減了五個 7。這種方式除了可以評估病人的計算能力外，還可以評估下列何種能力？", "options": ["定向感（orientation）", "注意力（attention）", "判斷力（judgement）", "病識感（insight）"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-5", "explanation": "連續減 7（serial sevens）除計算力外，主要用於評估專注力與持續注意力，故選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 6, "stem": "下列何者為貝克（Beck）認知學說的主要論述？", "options": ["精神問題與個人童年早期未解決之衝突及焦慮有關", "人格是被環境所塑造，可用行為改變技巧矯正", "情緒低落是對自己、他人及外界的錯誤解釋", "高情感表露的家庭可能會增加精神疾病的復發率"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-6", "explanation": "Beck 認知學說核心為認知三角，即對自己、他人（世界）與未來的負向、錯誤解釋導致情緒低落，故選 C。A 為精神分析、B 為行為學派、D 為高情感表露理論。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 7, "stem": "護理師在與病人建立關係的過程中常需要自我坦露（self disclosure），有關自我坦露的敘述，下列何者較適當？", "options": ["與病人關係對等，坦露程度決定於關係建立的深淺", "自我坦露是有目的、有限度的", "只要對病人有助益，都要分享自己的類似經驗", "自我坦露能擴大「周哈里窗」（Johari window）之自我隱私象限"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-7", "explanation": "自我坦露應是有目的、有限度，且以病人治療利益為考量，故選 B。坦露不以關係對等為前提，也不需分享所有類似經驗；自我坦露是縮小而非擴大周哈里窗的隱私象限。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 8, "stem": "有關抗精神病藥物的敘述，下列何者藥理作用最能歸屬於「第二型及第三型多巴胺特別性接受器阻斷劑（specific D2/D3 antagonist）」？", "options": ["Amisulpride（Solian®）", "Olanzapine（Zyprexa®）", "Risperidone（Risperdal®）", "Ziprasidone（Geodon®）"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-8", "explanation": "Amisulpride 為選擇性 D2/D3 接受器阻斷劑，故選 A。Olanzapine、Risperidone、Ziprasidone 皆同時作用於血清素與多巴胺（SDA）。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 9, "stem": "有關錐體外徑症候群之藥物副作用（extrapyramidal symptoms, EPS）的敘述，下列何者正確？", "options": ["開始使用抗精神病藥物治療的最初 3～4 天，最常產生的 EPS 是靜坐不能（akathisia）", "開始使用抗精神病藥物治療 1 個月後，病人最常產生的 EPS 是急性肌肉緊張異常（acute dystonia）", "開始使用抗精神病藥物治療 1 個月內，通常會出現遲發性不自主運動（tardive dyskinesia, TD）", "開始使用抗精神病藥物治療的前 3 個月，就可能產生類似巴金森氏症的運動不能、表情呆板及手抖副作用"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-9", "explanation": "類巴金森氏症狀（運動不能、面具臉、手抖）常在用藥前 3 個月出現，故 D 正確。急性肌肉緊張異常最早（數小時至數天）、靜坐不能多在數週至 2 個月、遲發性不自主運動則需長期用藥後才出現。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 10, "stem": "有關精神科護理中認知治療的敘述，下列何者最適當？", "options": ["宜強調個案過去的事件，而非此時此刻的問題", "個人的邏輯推理錯誤或不合理想法，常造成焦慮或適應不良", "以單一事件對大多數事件做推論，是屬於過度個人化（personalization）", "生理回饋儀是基本必備，始能達到認知改變"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-10", "explanation": "認知治療認為邏輯推理錯誤或不合理信念導致焦慮與適應不良，故選 B。認知治療著重此時此刻；以單一事件推論全部屬過度類化；生理回饋儀非必備。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 11, "stem": "護理人員應用行為治療原則於急性病房住院精神疾病病人，下列何者最適當？", "options": ["病人一出現不適當行為，一律立即給予懲罰", "醫師與護理師分別扮黑白臉，對懲罰的態度可不同，以增強其適當的行為", "出現攻擊行為後，取消禁止外出購物活動，是符合負向增強法", "選擇對個案有影響的增強物，可增強適當的行為"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-11", "explanation": "行為治療應選擇對個案真正有效的增強物來增強適當行為，故選 D。一律懲罰、醫護態度不一致皆不當；取消原有活動屬懲罰而非負向增強。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 12, "stem": "有關 Benzodiazepine（BZD）的護理指導，下列何者最適當？", "options": ["BZD 是代謝較快的藥物，將可以改善其記憶力", "BZD 類藥物主要就是鎮靜安眠，無法用來抗焦慮", "建議勿飲酒的主要原因是酒精促排尿，就會大量將 BZD 排出", "長期服用 BZD 可能造成依賴，戒斷時宜逐漸減量"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-12", "explanation": "長期服用 BZD 會產生耐受性與依賴，停藥須逐漸減量以免戒斷，故選 D。BZD 可能損害記憶、具抗焦慮作用，且與酒精併用會加重中樞抑制。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 13, "stem": "初次入住精神科急性病房的李先生，擔心醫院伙食被人下毒，有被害妄想不願意用餐，下列何者護理措施最適當？", "options": ["警告他如果不吃，就須鼻胃管灌食", "讓病人協助準備食物，或自備食物", "同意先讓他不吃，等餓了自然就肯吃", "請其他病人向他保證食物沒有毒"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-13", "explanation": "被害妄想而拒食者，讓其參與備餐或自備食物可降低疑慮並維持營養，故選 B。威脅灌食、放任不吃或請他人保證均無法解除妄想。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 14, "stem": "對於缺乏病識感的思覺失調症住院病人，拒絕服藥時，下列處理何者較為適當？", "options": ["向病人解釋此為維他命沒有副作用，只要肯服下就好", "了解病人拒服藥的原因，觀察其是否有藏藥行為", "警告病人不服藥，就不能出院", "採鼻胃管灌藥，以確保服下藥物"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-14", "explanation": "應先了解拒藥原因並觀察是否藏藥，再據以處理，故選 B。欺騙、威脅或逕行灌藥皆不符倫理與治療關係。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 15, "stem": "有關雙相情緒障礙（bipolar disorder）的病因，下列敘述何者正確？", "options": ["與電解質不平衡無關", "壓力或環境改變，不會提升發病率", "與正腎上腺素（norepinephrine）及血清素（serotonin）濃度有關", "與遺傳因素無關"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-15", "explanation": "雙相情緒障礙與正腎上腺素、血清素等神經傳導物質濃度變化有關，故選 C。此症與遺傳、壓力事件及電解質（如鈉）皆有關聯。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 16, "stem": "林小姐入院診斷為憂鬱症，常向護理師表示自己做錯事害得父母離婚，又因為自己不夠好，所以男友跟她分手。下列何項回應最適當？", "options": ["勸導她何必單戀一枝花，男友再找就有了，是他不懂林小姐的好", "傾聽並同理她低自尊的感受，適時澄清其價值觀", "告訴她事情都過去了，多參加外面的活動就好了", "勸她不要再提父母離婚與她有關的想法"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-16", "explanation": "應傾聽並同理其低自尊與自責感受，再適時協助澄清不合理的價值判斷，故選 B。其餘選項為敷衍、轉移或壓抑情緒表達。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 17, "stem": "有關病人於住院期間憂鬱症的照護，下列敘述何者正確？", "options": ["由於病人怕吵，儘量安排單人房給病人減少干擾", "在症狀嚴重期最容易出現自殺行為，等病人情緒好轉就解除自殺風險", "避免給病人壓力，不要安排活動", "病人出現退化行為時，仍要鼓勵病人適時提供自我照顧的機會"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-17", "explanation": "憂鬱症病人出現退化行為時仍應鼓勵其做力所能及的自我照顧，故選 D。不宜安排單人房以利觀察；情緒好轉、體力恢復時自殺危險反而升高；應安排簡單、不具競爭性的活動。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 18, "stem": "有關躁症病人住院期間的活動安排，下列何項措施最適當？", "options": ["安排病人參加投籃競賽，發洩過多的體力", "鼓勵參與文藝活動，但避免安排精細動作的活動", "將病人一天的時間都填滿活動，這樣他就不會分心去干擾別人製造紛爭", "因為要訓練病人的持續力與注意力，安排長時間（至少 1 小時）的活動最有效果"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-18", "explanation": "躁症病人宜安排不需精細動作、非競爭性的活動，故選 B。競賽會刺激其激動、行程排滿與長時間活動皆不符其注意力短暫的特性。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 19, "stem": "沈女士為慢性精神病病人，平日都可依醫囑按時服用抗精神病藥物，但情緒仍常受幻聽干擾而時有波動，護理師提供的護理措施，下列何者錯誤？", "options": ["同理病人的感受", "詢問病人：「聲音說些什麼？」", "直接向病人說：「不要胡思亂想！」", "鼓勵運用可行之阻斷幻聽的方法"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-19", "explanation": "「不要胡思亂想」否定病人的知覺經驗與感受，屬非治療性溝通，故錯誤者選 C。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 20, "stem": "憂鬱症病人常伴有退化行為而導致自我照顧能力缺失，護理師提供的相關護理措施，下列何者錯誤？", "options": ["協助進食", "增加水分攝取", "安排固定時間如廁", "完全協助病人的自我照顧"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-20", "explanation": "完全代勞會助長退化並降低自尊，應依能力提供部分協助，故錯誤者選 D。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 21, "stem": "有關躁症發作（manic episode）病人最常見的症狀，下列何者正確？", "options": ["低自尊", "意念飛躍", "目標導向的活動減少", "表情淡漠"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-21", "explanation": "躁症發作最典型的思考症狀為意念飛躍，故選 B。躁症呈現高自尊、目標導向活動增加、情感高昂。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 22, "stem": "劉先生為思覺失調症病人，身體具異味，衣著髒亂，無法自行清潔身體，針對劉先生自我照顧功能退化的護理，下列何者正確？", "options": ["尋求人力支援", "幫劉先生洗澡", "教導劉先生洗澡", "尊重劉先生意願"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-22", "explanation": "自我照顧功能退化者的護理重點是重建能力，應逐步教導其洗澡，故選 C。全代勞或僅尊重意願皆無法改善功能。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 23, "stem": "依據學習理論，有關特定畏懼症（special phobia）病人學習恐懼的途徑，下列敘述何者最適當？", "options": ["過去曾有被畏懼對象傷害的不愉快經驗", "未能從過去經歷過的重大失落事件學習如何處理焦慮", "未能感受到自己被重要他人所認可", "無法忽略或壓抑反覆出現的想法或衝動"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-23", "explanation": "依學習理論（古典制約），畏懼源自過去被畏懼對象傷害的不愉快經驗，故選 A。其餘敘述屬精神分析或強迫症的解釋。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 24, "stem": "有關強迫症（obsessive-compulsive disorder, OCD）病人的敘述，下列何者最適當？", "options": ["病人通常缺乏病識感，無法理解這些強迫性想法", "病人常使用內射之防衛機轉，化解內在的衝突不安", "病人通常發病前即有求全、完美的傾向，強調事情的是非，缺少通融變化", "病人對其所患之強迫思想或行為常覺得不合理或並非自己所願，但尚可抗拒"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-24", "explanation": "強迫症病人多在發病前即具求全、完美、拘泥是非且缺乏彈性的強迫型人格特質，故選 C。病人多具病識感、知道想法不合理卻難以抗拒；主要防衛機轉為抵消、隔離與反向作用，而非內射。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 25, "stem": "有關急性壓力症（acute stress disorder），下列敘述何者錯誤？", "options": ["病人會出現易怒行為和無預警發怒", "診斷的對象限於直接經歷創傷事件者", "症狀困擾至少須持續 3 天以上", "病人會避免接觸與創傷事件有關的物件或場合"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-25", "explanation": "急性壓力症的診斷對象不限於直接經歷者，目擊或得知親近他人遭遇創傷亦可，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 26, "stem": "有關人格障礙症（personality disorder）的特性與病因，下列敘述何者較適當？", "options": ["與自我（ego）的功能薄弱有關，導致自我控制力較差", "與遺傳無關，於嬰幼兒時期人格發展過程中形成障礙", "與血清素代謝物（5-HIAA）過高有關，常會有自殺企圖、衝動控制力差", "與青春期或成年早期的發展無關，宜以現有症狀表現進行診斷"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-26", "explanation": "人格障礙症與自我（ego）功能薄弱、自我控制力差有關，故選 A。此症與遺傳有關、與 5-HIAA 偏低（非過高）有關，且發展多始於青春期或成年早期。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 27, "stem": "邱同學在會考前 1 個月，每次學校模擬考時都感到右手無力，被家人送到神經內科求診，但經多科醫師會診及檢查，卻找不到任何跟生理病變有關的證據，邱同學最有可能是下列何項診斷？", "options": ["身體症狀障礙症（somatic symptom disorder）", "罹病焦慮症（illness anxiety disorder）", "轉化症（conversion disorder）", "人為障礙症（factitious disorder）"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-27", "explanation": "考前出現右手無力卻查無生理病變，屬心理衝突轉換為神經功能症狀，即轉化症，故選 C。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 28, "stem": "有關物質使用障礙心理治療的敘述，下列何者錯誤？", "options": ["此項治療多半在個案恢復期時執行，可疏導個案的內心問題", "採用動機式晤談（motivational interview）法，以直接面質為治療的原則", "通常與家庭及心理因素息息相關，故除了提供身體治療外，也應追索問題的根源", "可疏導個案的內心問題，引導個案使用正向積極的方式發洩其內心的憤怒與不滿"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-28", "explanation": "動機式晤談強調同理、避免爭辯與直接面質，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 29, "stem": "美沙冬（Methadone）本為麻醉性止痛劑，可替代嗎啡類藥物，以達到治療嗎啡類藥物成癮患者。下列敘述何者正確？", "options": ["通常用來治療 K 他命成癮的患者", "不會有蓄積性，可長期使用，且不需減少劑量", "不會有呼吸抑制、欣快感和戒斷症狀", "為口服藥劑，可以減少因共用針頭引起的疾病感染"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-29", "explanation": "美沙冬為口服替代療法，可減少共用針頭導致的血液傳染病，故選 D。它用於嗎啡（海洛因）類成癮而非 K 他命，且具蓄積性、呼吸抑制與戒斷症狀。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 30, "stem": "有關護理評估自閉症類群障礙症（autism spectrum disorder）的核心障礙，下列何者錯誤？", "options": ["重度智能不足", "社交互動障礙", "語言溝通障礙", "重複刻板的行為模式"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-30", "explanation": "自閉症類群障礙症的核心障礙為社交互動障礙、語言溝通障礙與重複刻板行為；重度智能不足並非核心診斷條件，故錯誤者選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 31, "stem": "針對阿茲海默氏症引起重度認知障礙症的敘述，下列何者最適當？", "options": ["日常生活不受影響", "在傍晚和前半夜會較嚴重，出現日落症候群", "遠期記憶減退通常是最先出現的記憶障礙", "情緒變化與以前差別不大"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-31", "explanation": "重度認知障礙者常於傍晚及前半夜出現混亂加劇的日落症候群，故選 B。此症日常生活明顯受影響、最先喪失的是近期記憶、情緒變化亦明顯。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 32, "stem": "有關臺灣老年精神健康問題與疾病，下列敘述何者正確？", "options": ["老年精神疾病盛行率低於 1%", "常見的老年精神疾病為雙相情感疾患及物質使用障礙症", "老年人自殺，通常少有徵兆，難以觀測及預防", "老年人會以飲酒與濫用處方藥物，調適其壓力或憂鬱"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-32", "explanation": "老年人常以飲酒或濫用處方藥物來調適壓力與憂鬱，故選 D。老年精神疾病盛行率遠高於 1%，最常見為憂鬱症與認知障礙症，且自殺前多有徵兆可循。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 33, "stem": "運用簡易心智量表（Mini-Mental State Examination, MMSE）評估老年人精神狀態，下列何者不是其評估的功能表現？", "options": ["定向感", "注意力", "記憶力", "情緒狀態"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-33", "explanation": "MMSE 評估定向感、注意力與計算、記憶力、語言與空間結構等認知功能，不包含情緒狀態，故選 D。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 34, "stem": "有關罹患注意力缺陷過動症（ADHD）學齡期兒童的治療計畫，下列敘述何者錯誤？", "options": ["可使用中樞神經興奮劑 Ritalin®，來改善其衝動及活動量過高之行為", "為避免病情復發，中樞神經興奮劑宜長期服用，絕對不可停藥", "可合併使用藥物治療及感覺統合治療，以增加治療效益", "急性住院期間宜安排不具攻擊性的活動"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-34", "explanation": "中樞神經興奮劑可依症狀調整劑量或安排藥物假期，並非絕對不可停藥，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 35, "stem": "許小姐 35 歲，反覆住院的情感性精神病病人。近日剛從急性病房轉慢性病房，家屬可接受病人返家同住，只是擔心病人病情惡化，病人有工作及復健潛能。下列有關病人的出院準備何者較適當？", "options": ["在出院前轉介精神衛生護理之家", "在出院前轉介日間型精神復健機構", "在出院前轉介住宿型精神復健機構", "在出院前轉介康復之家"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-35", "explanation": "病人症狀穩定、可返家同住且具工作與復健潛能，適合白天到院、晚上返家的日間型精神復健機構，故選 B。護理之家、住宿型機構與康復之家皆需住宿。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 36, "stem": "有關賦能模式（empowerment model）的概念，下列何者正確？", "options": ["是依個案的需求，由精神專業人員為個案做出最好的決定", "提供充分的資訊，協助個案了解自己的狀況，擁有自決的能力", "主張在復元的歷程，由精神專業人員承擔個案身心照護之責", "視個案為失能者，針對個案的缺點發現問題本身進行問題改善"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-36", "explanation": "賦能模式強調提供充分資訊、協助個案了解自身狀況並擁有自決能力，故選 B。其餘敘述均由專業人員主導或以缺陷觀點看待個案。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 37, "stem": "臨床護理人員面對病人暴力行為時的心理反應與態度，下列敘述何者正確？", "options": ["臨床醫師被病人攻擊的危險性最高", "當護理人員於職場中被攻擊時，通常出現大聲哭訴", "於精神科工作被病人攻擊是正常的現象，所以只要提醒受害工作人員小心即可", "營造治療性環境的支持，可以協助護理人員被暴力攻擊時處理情緒"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-37", "explanation": "營造具支持性的治療性環境，可協助護理人員在遭受暴力後處理情緒，故選 D。臨床上護理人員被攻擊的危險性最高，且事件後需正式輔導而非僅提醒小心。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 38, "stem": "有關「社區心理衛生中心」的主要服務內容，下列何者適當？", "options": ["辦理身體健康促進、衛教宣導及專業訓練等活動", "辦理心理健康促進活動及高危險群病人之危機處理", "執行災難緊急應變之身體創傷救護", "辦理民眾身體健康諮詢及身體治療服務"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-38", "explanation": "社區心理衛生中心以心理健康促進、諮詢及高危險群的危機處理為主要服務，故選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 39, "stem": "有關精神科住院病人出現暴力行為的護理措施，下列敘述何者錯誤？", "options": ["約束病人前，需取得病人同意", "執行約束後，至少每 15 分鐘探視病人 1 次", "可依照醫囑給予注射抗精神病藥物", "病人情況穩定後，讓其有機會說明自己的行為"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-39", "explanation": "約束屬緊急保護性措施，依醫囑執行並向病人說明即可，不以取得病人同意為前提，故錯誤者選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 40, "stem": "有關遭受精神病人暴力攻擊的護理人員之輔導，下列何者較適當？", "options": ["護理人員被攻擊後可能會感到羞愧，避免直接與其會談", "現場立即檢討是否護理人員處置不當而引發病人暴力", "加強全院通報系統，以杜絕病房暴力發生", "暴力事件後，提升護理人員面對暴力行為的處理能力"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-40", "explanation": "暴力事件後應提供減壓輔導並提升人員處理暴力行為的能力，故選 D。應主動關懷而非避免會談，也不宜現場檢討責備，通報系統無法「杜絕」暴力。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 41, "stem": "有關健全健康照護體系的主要目的，下列何者錯誤？", "options": ["民眾可以得到適當的健康服務之可用性（available）", "民眾可以配合政府的衛生政策之可主動性（active）", "民眾可以容易取得健康促進、特殊保護、篩檢與預防服務之可近性（accessible）", "符合民眾的健康需求與型態之可接受性（acceptable）"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-41", "explanation": "健全健康照護體系強調可用性、可近性、可負擔性與可接受性，並無「可主動性」，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 42, "stem": "有關現行衛生福利部組織之敘述，下列何者正確？", "options": ["國民健康署主要負責發展長期照護體系，提升原住民族與離島地區健康照護品質", "護理及健康照護司主要負責規劃推動生育健康、婦幼健康、癌症、心血管疾病及其他非傳染病防治", "疾病管制署成立之宗旨為建立現代化的防疫體系，免除國人疫病的威脅", "心理及口腔健康司主要負責青少年網路成癮以及齲齒防治與促進口腔衛生"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-42", "explanation": "疾病管制署設立宗旨即為建立現代化防疫體系、免除國人疫病威脅，故選 C。長照體系屬長期照顧司、生育健康與慢性病防治屬國民健康署。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 43, "stem": "有關全民健康保險預防保健服務的敘述，下列何者錯誤？", "options": ["兒童預防保健服務共計 7 次，7 歲以下兒童適用，包含身體及發展檢查及衛生教育指導", "孕婦產前檢查共計 10 次，若發現德國麻疹抗體陰性之孕婦可提供免費的德國麻疹疫苗注射", "成人預防保健「健康加值」服務 40 歲至 64 歲每 3 年 1 次，65 歲以上、55 歲以上原住民及 35 歲以上罹患小兒麻痺者每年 1 次", "30 歲以上女性可免費每年進行子宮頸抹片檢查"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-43", "explanation": "德國麻疹疫苗為活性減毒疫苗，孕期禁止接種，應於產後再補種，故錯誤者選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 44, "stem": "未滿 1 歲 6 個月的兒童，全民健保提供幾次兒童預防保健服務？", "options": ["1次", "2次", "4次", "7次"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-44", "explanation": "兒童預防保健服務於未滿 1 歲 6 個月前共提供 4 次（出生至 2 個月、2～4 個月、4～10 個月、10 個月至 1 歲 6 個月），故選 C。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 45, "stem": "健康里於該年 7 月 1 日總人口數 3,000 人，育齡婦女有 450 人，該年活產嬰兒 60 人，下列健康里的粗出生率（crude birth rate, CBR）何者正確？", "options": ["150‰", "133‰", "20‰", "0.13‰"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-45", "explanation": "粗出生率＝當年活產數／年中總人口×1000＝60／3000×1000＝20‰，故選 C。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 46, "stem": "承上題，健康里的一般生育率（general fertility rate , GFR），下列何者正確？", "options": ["150‰", "133‰", "20‰", "0.13‰"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-46", "explanation": "一般生育率＝當年活產數／育齡婦女數×1000＝60／450×1000≒133‰，故選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 47, "stem": "有關孕婦的疫苗接種，下列何者是可以接種的？", "options": ["麻疹疫苗", "水痘疫苗", "流感疫苗", "日本腦炎"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-47", "explanation": "流感疫苗為不活化疫苗，孕婦可且建議接種，故選 C。麻疹、水痘與日本腦炎（減毒株）屬活性減毒疫苗，孕期不宜。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 48, "stem": "社區護理師宜根據流行病學的方法學進行健康議題之評估，下列敘述何者正確？", "options": ["某社區的登革熱屬於地方性（endemic）疾病事件", "南臺灣曾發生過的烏腳病屬於大流行（pandemic）", "食物中毒在流行病的時間上屬於散發性（spordic）", "某事件的發生率超過其正常期望值，即符合流行病（epidemic）的條件"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-48", "explanation": "某事件發生率超過正常期望值即構成流行（epidemic），故選 D。烏腳病屬地方性、食物中毒多屬點狀爆發流行。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 49, "stem": "某職場對 460 名員工進行糞便潛血篩檢，結果呈現陽性反應的有 80 名，此 80 名員工到醫院進一步檢查確診為大腸直腸癌為 30 名，另對陰性反應者 380 名進行確認，350 名確認為無大腸直腸癌，關於此疾病篩檢何者正確？", "options": ["敏感度（sensitivity）為 37.5%", "特異性（specificity）為 87.5%", "偽陽性率（false positive rate）為 50.0%", "偽陰性率（false negative rate）為 12.5%"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-49", "explanation": "真陽性 30、偽陽性 50、真陰性 350、偽陰性 30。特異性＝350／(350＋50)＝87.5%，故選 B。敏感度＝30／60＝50%、偽陽性率 12.5%、偽陰性率 50%。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 50, "stem": "有關病毒性腸胃炎之敘述，下列何者正確？", "options": ["腺病毒好發於 6 歲以上小孩", "輪狀病毒好發於 65 歲長者", "克沙奇 A 型最容易引發重症心肌炎", "諾羅病毒好發於學校、機構等人口密集處"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-50", "explanation": "諾羅病毒傳染力強，好發於學校、機構等人口密集場所，故選 D。腺病毒與輪狀病毒好發於嬰幼兒，重症心肌炎多與克沙奇 B 型有關。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 51, "stem": "進行社區健康評估時，評估社區民眾教育程度的主要理由，下列何者最適當？", "options": ["可做為社區民眾健康指導的依據", "可了解社區民眾的社會福利補助狀況", "可預測社區民眾的疾病發生狀況", "可了解社區民眾的醫療設備狀況"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-51", "explanation": "教育程度影響民眾的理解與學習方式，是規劃健康指導內容與衛教媒材的重要依據，故選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 52, "stem": "有關社區健康評估的目的，下列何者不適當？", "options": ["可做為社區衛生活動計畫的依據", "可了解並排定社區健康需求及優先順序", "可由學者參與以提升評估品質", "可找出影響社區健康的危險因子"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-52", "explanation": "社區健康評估的目的在於了解健康需求、排定優先順序、找出危險因子並作為計畫依據；「由學者參與提升品質」屬執行方式而非目的，故選 C。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 53, "stem": "有關護理師運用社區資源的敘述，下列何者不適當？", "options": ["宜根據專長動用人力資源，善用其能力", "宜把握經濟原則，不要浪費", "宜依據預算執行，提供經費收支明細表供監督", "宜應尊重社區組織，並配合對方的利益"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-53", "explanation": "運用社區資源應尊重社區組織，但須以社區民眾健康需求為前提，不是配合對方的利益，故不適當者選 D。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 54, "stem": "以人群為導向的社區衛生護理師，應具備的社區概念中，下列敘述何者不適當？", "options": ["功能性社區通常以地理疆界為劃分的依據", "社區是動態且具有高度彈性的", "影響社區動力的重要因素包括社區溝通方式及領導與決策", "地點（place）、人（people or person）、功能（function）是社區定義的三大重要概念"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-54", "explanation": "以地理疆界劃分者為地理性（結構性）社區；功能性社區是依共同目標或功能結合，故不適當者選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 55, "stem": "社區護理師與社區運動性社團共同推動健康體能活動，是依據社區健康營造的何種步驟？", "options": ["成立健康營造推動小組", "結合社區資源", "激發民眾共同參與", "訂定社區健康議題"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-55", "explanation": "結合社區既有的運動性社團共同推動活動，屬社區健康營造中「結合社區資源」的步驟，故選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 56, "stem": "有關健康促進的概念，下列敘述何者正確？", "options": ["強調健康促進是一種狀態，而不是過程", "強調增進民眾掌控其健康的影響因素及改善其健康", "強調環境對民眾健康的影響", "屬於三段五級的第二級預防策略"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-56", "explanation": "渥太華憲章界定健康促進為使人們能增進掌控其健康及影響健康因素的「過程」，故選 B。健康促進屬第一段第一級預防。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 57, "stem": "有關衛生教育的評價，下列敘述何者正確？", "options": ["標準參照評價（criterion-referenced evaluation）著重了解學習者的學習成就是否達預先設定的標準", "形成性評價（formative evaluation）是在教學之前測量學習者所具備的知識及能力", "診斷性評價（diagnostic evaluation）是在教學過程中測量學習者對教學內容的熟悉程度", "總結性評價（summative evaluation）是在教學結束後測量學習者造成學習困難的原因"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-57", "explanation": "標準參照評價著重學習成就是否達到預先設定的標準，故選 A。診斷性評價在教學前、形成性評價在教學過程中、總結性評價在教學後測學習成果。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 58, "stem": "依據跨理論模式（transtheoretical model），王女士陳述「我想要運動，但就是找不到時間。如果我能每週運動 3 天，我對於自己的感覺會比較好。」，依據王女士目前所處的行為改變階段，下列何種方法最適當？", "options": ["自我再評價", "情境替代", "增強管理", "刺激控制"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-58", "explanation": "「想運動但找不到時間」表示已意識到問題卻尚未行動，屬意圖期，適合使用自我再評價，故選 A。情境替代、增強管理與刺激控制多用於行動期與維持期。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 59, "stem": "下列何者是目前健康體適能的測量指標？", "options": ["肌力與肌耐力、心肺耐力、柔軟度、身體組成", "肌力、腰圍、心肺耐力、柔軟度、身體組成", "肌力與肌耐力、心率變異、柔軟度、體重", "肌力與肌耐力、心肺耐力、柔軟度、體脂肪"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-59", "explanation": "健康體適能的四項測量指標為肌力與肌耐力、心肺耐力、柔軟度及身體組成，故選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 60, "stem": "下列何種食品添加物會引起類交感神經興奮？", "options": ["銅葉綠素", "毒澱粉", "瘦肉精", "人工甘味劑"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-60", "explanation": "瘦肉精屬乙型受體素，會產生類交感神經興奮作用如心悸、手抖，故選 C。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 61, "stem": "有關醫療廢棄物的處理，下列敘述何者正確？", "options": ["按廢棄物清理法規定，感染性廢棄物不可在室溫下貯存", "不可燃的感染廢棄物經滅菌處理後，可視為一般廢棄物清除", "可燃的感染廢棄物用黃色容器收集後，採焚化處理", "放射線廢棄物應收集於黑色塑膠袋後，交由行政院原子能委員會處理"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-61", "explanation": "不可燃的感染性廢棄物經滅菌處理後可視為一般廢棄物清除，故選 B。可燃者應以紅色容器收集焚化；感染性廢棄物於室溫可暫存但有時限；放射性廢棄物不以黑色塑膠袋收集。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 62, "stem": "有關家庭內在資源中的軟體結構支持（structure support）下列敘述何者正確？", "options": ["為中風家人裝設牆壁扶手和緊急鈴", "太太出國工作，先生在國內身兼母職處理家務和照顧子女", "社會福利機構提供物質、設備", "衛生所提供家庭訪視"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-62", "explanation": "軟體結構支持指家庭成員角色的彈性調整與功能替代，如先生身兼母職，故選 B。裝設扶手屬硬體支持，機構與衛生所屬家庭外在資源。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 63, "stem": "有關社區護理師能夠順利執行家庭護理措施，下列基本原則何者最重要？", "options": ["建立信賴關係", "提升家庭改變動機", "了解家庭資源", "運用適切的護理措施"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-63", "explanation": "家庭護理措施能否推行，最基本且最重要的前提是與家庭建立信賴關係，故選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 64, "stem": "依據 Duvall 的家庭發展階段理論，進行家庭評估主要目的為何？", "options": ["了解家庭現階段的保健事項及發展任務", "了解家庭現階段的健康機關公共設施的資源", "了解家庭現階段的事業發展狀況", "了解家庭對疾病發展的評價"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-64", "explanation": "Duvall 家庭發展階段理論依家庭生命週期界定各階段的發展任務，評估目的在了解現階段的保健重點與發展任務，故選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 65, "stem": "社區護理師首次訪視剛來臺 4 個月的新住民，發現個案懷孕 3 個月，下列何者為優先措施？", "options": ["介紹外籍同鄉會姐妹", "通譯員翻譯其需求", "介紹識字班就讀", "協助申請產檢補助"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-65", "explanation": "新住民懷孕 3 個月，最優先應確保其能接受規則產前檢查，故協助申請產檢補助，選 D。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 66, "stem": "有關原住民族在人口學的措施，下列健康政策的敘述何者最不適當？", "options": ["年齡未滿 20 歲及年滿 55 歲以上者，部分補助其自付保險費", "居住偏遠地區原住民，另可申請就醫交通費補助", "55 歲以上免費每年 1 次成人預防保健服務", "30 歲以上婦女免費每年 1 次子宮頸抹片檢查"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-66", "explanation": "原住民未滿 20 歲及年滿 55 歲以上者為「全額」補助其自付保險費，非部分補助，故最不適當者選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 67, "stem": "社區護理師提供更年期婦女骨質疏鬆防治措施，下列何者最不適當？", "options": ["建立正確的預防骨質疏鬆知識", "鼓勵使用傳統荷爾蒙替代療法", "鼓勵充分日曬及負重運動", "鼓勵多攝取深綠色蔬菜"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-67", "explanation": "傳統荷爾蒙替代療法有乳癌與心血管風險，不宜作為骨質疏鬆的常規防治，故最不適當者選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 68, "stem": "回教信仰的新住民產婦拒吃婆婆煮的麻油豬肝，引起婆婆不悅，下列護理措施何者最適當？", "options": ["鼓勵新住民應積極融入在地文化", "積極學習印尼語幫忙婆媳溝通", "請外籍通譯員作孕期營養衛教", "協助家人尊重宗教文化差異"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-68", "explanation": "回教信仰禁食豬肉，應協助家人理解並尊重宗教文化差異，故選 D。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 69, "stem": "有關理想的校園健康環境，下列何者錯誤？", "options": ["教室濕度應在60～65%之間", "窗戶應占教室建坪面積1/5以上", "教室噪音不超過70分貝", "桌面照度應高於350米燭光"], "answer": "CD", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-69", "explanation": "依學校衛生相關標準，教室噪音應維持在 60 分貝以下，故 C 敘述有誤；考選部公告本題答 C 或 D 者均給分。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 70, "stem": "有關學校衛生法的敘述，下列何者錯誤？", "options": ["專科以上學校應定期檢測學生的健康體適能", "高級中等以下學校班級數未達 40 班者，應置護理人員 1 人", "學校對患有心臟病、癲癇、糖尿病、血友病、癌症、精神疾病、罕見疾病等及其他重大傷病或身心障礙之學生，應加強輔導與照顧；必要時，得調整其課業及活動", "高級中等以下學校，應全面禁菸"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-70", "explanation": "定期檢測學生健康體適能的規範對象為高級中等以下學校，非專科以上學校，故錯誤者選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 71, "stem": "職業衛生護理的工作內容與其他社區群體護理最大的不同為何？", "options": ["健康照護", "工作現場訪視", "健康監測", "健康管理活動"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-71", "explanation": "職業衛生護理需進入工作現場訪視、辨識作業環境危害，這是與其他社區群體護理最大的差異，故選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 72, "stem": "下列何者為我國目前國小校園最常見的傳染病？", "options": ["麻疹", "腸病毒", "B 型流感", "破傷風"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-72", "explanation": "腸病毒為我國國小校園最常見的傳染病，故選 B。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 73, "stem": "有關聯合國對於人口老化的敘述，下列何者最不適當？", "options": ["高齡化社會（aging society）指 65 歲以上老年人口占總人口 7%以上", "高齡社會（aged society）指 65 歲以上老年人口占總人口 14%以上", "超高齡社會（super-aged society）指 65 歲以上老年人口占總人口 25%以上", "我國於 2018 年進入高齡社會（aged society）"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-73", "explanation": "超高齡社會指 65 歲以上人口占總人口 20% 以上，非 25%，故最不適當者選 C。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 74, "stem": "有關居家護理之敘述，下列何者錯誤？", "options": ["是屬於三段五級中末段預防", "目的是減少疾病合併症及再住院率", "全民健保對居家護理服務的給付，每個月 1 次為限", "一般戶居家服務的來回計程車交通費用，由案家自行負擔"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-74", "explanation": "全民健保居家護理訪視給付以每月 2 次為限，非 1 次，故錯誤者選 C。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 75, "stem": "依據長期照顧十年計畫 2.0 失智照護政策之介紹，下列何者錯誤？", "options": ["將 60 歲以上失智者納入服務對象", "廣設「失智社區服務據點」以提供個案及照顧者支持服務，如：家屬照顧訓練及支持團體等", "鼓勵縣市政府廣結民間資源，布建日間照顧中心、團體家屋等社區照顧服務", "補助入住機構專區之失智症中度以上且具行動能力老人「特別處遇費」，減輕家屬負擔"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-75", "explanation": "長照 2.0 已將 50 歲以上失智者納入服務對象，非 60 歲，故錯誤者選 A。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 76, "stem": "有關長期照顧十年計畫 2.0 之敘述，下列何者最不適當？", "options": ["我國長照政策之規劃係以居家、社區為主，機構式服務為輔", "社區整體照顧服務體系，規劃以培植 A、擴充 B、廣布 C 為原則", "社區整體照顧服務體系是由中央、地方政府及民間單位三方協力布建在地化長照服務網絡", "C 級巷弄長照站其服務功能為研擬照顧計畫，進行協調連結照顧服務資源"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-76", "explanation": "研擬照顧計畫、協調連結照顧資源為 A 級社區整合型服務中心的功能；C 級巷弄長照站提供社會參與、健康促進與共餐等服務，故最不適當者選 D。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 77, "stem": "有關長期照護成效的評價指標，下列何者最不適當？", "options": ["個案或案家滿意程度", "個案健康狀況維持狀況", "個案慢性疾病治癒率", "個案使用長期照護的成本"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-77", "explanation": "長期照護對象多為慢性、不可逆的健康問題，目標在維持功能與生活品質，故「慢性疾病治癒率」最不適合作為成效指標，選 C。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 78, "stem": "糖尿病病人經常出現血管與神經病變，需定期進行併發症篩檢，下列何者不屬於糖尿病併發症篩檢項目？", "options": ["視網膜檢查", "尿蛋白檢查", "胎兒甲型蛋白（α-fetoprotein, AFP）檢查", "足踝神經檢查"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-78", "explanation": "AFP 用於肝癌及胎兒神經管缺損篩檢，不屬糖尿病併發症篩檢項目，故選 C。糖尿病併發症篩檢包含視網膜、尿蛋白（微量白蛋白）與足部神經血管檢查。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 79, "stem": "王老先生向社區護理師主訴他最近常提不起精神、感覺無力、不想出門、體重也減輕，下列護理師的處置何者最不適當？", "options": ["轉介至老年醫學科或家醫科就診", "轉介參加社區延緩失能失智活動", "教導預防跌倒策略", "建議多休息，以利恢復體能"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-79", "explanation": "老年人出現無力、活動退縮與體重減輕，可能為憂鬱或衰弱徵兆，建議「多休息」會加速失能，故最不適當者選 D。"}, {"year": "110", "session": "第二次", "subject": "精神科與社區衛生護理學", "num": 80, "stem": "依據病人自主權利法規定，有關輕度認知障礙者事先預立醫療決定的敘述，下列何者正確？", "options": ["18 歲以上者都可以簽署預立醫療決定", "意願人簽署「預立醫療決定」前須先經醫療機構「預立醫療照護諮商」", "家屬可全權代理簽署「預立醫療決定」文件", "有認知障礙者不能簽立「預立醫療決定」"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "110-2-5104-80", "explanation": "依病人自主權利法，簽署預立醫療決定前必須先完成醫療機構的預立醫療照護諮商，故選 B。簽署人須為具完全行為能力者，不得由家屬代理；具輕度認知障礙但仍有行為能力者可簽署。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 1, "stem": "有關病人心智狀態評估內容的敘述，下列何者錯誤？", "options": ["可以利用簡易心智狀況量表（Mini Mental State Examination, MMSE）進行測試", "可以依判斷力、定向感、記憶力、注意力、抽象思考能力、計算力進行評估", "詢問病人有關「人、時、地」的確認能力，主要是評估注意力", "詢問老年病人年輕時的基本資料如求學、求職等，主要是評估遠期記憶力"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-1", "explanation": "詢問「人、時、地」評估的是定向感（orientation），不是注意力；注意力常用連續減 7、數字複誦測試。MMSE、判斷力／記憶力等項目、以及問年輕往事測遠期記憶，敘述皆正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 2, "stem": "有關病人已出現顱內壓升高的護理處置，下列敘述何者錯誤？", "options": ["保持病人的頭頸在正中位置", "抬高床頭 30 度", "將抽痰、翻身拍背、擦澡等活動都集中一次完成", "應注意體溫的控制及維持排便正常"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-2", "explanation": "顱內壓升高時各項護理活動應「分散進行」並在活動間安排休息，集中一次完成會使顱內壓急遽上升。頭頸維持正中、床頭抬高 30 度、控制體溫並避免用力排便皆為正確措施。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 3, "stem": "有關腰椎椎間盤突出的敘述，下列何者錯誤？", "options": ["俗稱為「下背疼痛」，此種疼痛會向下延伸至臀部、大腿後側及小腿", "進行直舉腿試驗（straight leg raising test）可伸展到 90 度", "進行 Kernig sign 試驗，病人將小腿往上伸展會覺得有阻力且感到劇烈疼痛", "病人咳嗽、提重物、彎腰、長時間站立或坐著都會使疼痛加劇"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-3", "explanation": "椎間盤突出者做直舉腿試驗時，通常抬高 30～60 度即引發下背及下肢放射痛，無法伸展到 90 度。其餘敘述正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 4, "stem": "「走失」是阿茲海默氏症（Alzheimer’s Disease）病人，那一期重要臨床表徵？", "options": ["極早期", "早期", "中期", "末期"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-4", "explanation": "遊走、走失是阿茲海默氏症「中期」的重要表徵；早期以近期記憶減退、判斷力下降為主，末期則臥床、失去語言與吞嚥功能。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 5, "stem": "有關巴金森氏症病人日常生活護理指導，下列何者錯誤？", "options": ["行走時可使用助行器來維持平衡", "衣服儘量選擇以魔鬼氈代替釦子", "儘量多休息以減少活動產生震顫", "馬桶可提高坐墊方便坐下或起身"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-5", "explanation": "巴金森氏症應鼓勵規律運動與主動活動以維持關節活動度、平衡與肌力，過度休息反而加重僵硬與功能退化；其震顫屬靜止性震顫，休息時更明顯。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 6, "stem": "有關頭部創傷之敘述，下列何者正確？", "options": ["腦震盪是因外力造成暫時性的神經功能缺失，且腦組織有實質性的損傷", "腦挫傷是因沒有腦組織的實質性損傷，所以受傷後常會出現腦震盪症候群", "若出現鼻漏且確認是腦脊髓液，表示病人的硬腦膜受損", "有鼻漏或耳漏的病人通常要儘快用抽吸管抽吸乾淨"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-6", "explanation": "確認為腦脊髓液的鼻漏，代表硬腦膜已破損。腦震盪無腦組織實質損傷、腦挫傷才有實質損傷（A、B 敘述顛倒）；有鼻漏或耳漏時禁止抽吸或填塞，以免造成逆行性感染。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 7, "stem": "有關腦波檢查的護理措施，下列何者錯誤？", "options": ["說明檢查可診斷腦腫瘤", "告知病人檢查前，需清洗頭髮", "確認腦波室內備有足夠的點滴及氧氣", "檢查後，留在頭皮及頭髮上的黏膠，可用丙酮清理"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-7", "explanation": "腦波檢查測的是大腦皮質電位活動，用於癲癇、睡眠障礙及腦死判定，無法診斷腦腫瘤（需靠 CT／MRI）。其餘為正確的檢查前後護理。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 8, "stem": "有關脊髓損傷導致「自主神經反射過度」的敘述，下列何者正確？", "options": ["常發生於 T6～T12 受傷的病人", "走路運動是可能的誘因", "出現嚴重的高血壓及搏動性頭痛", "心跳加速"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-8", "explanation": "自主神經反射過度好發於 T6 以上的脊髓損傷，典型為突發性嚴重高血壓、搏動性頭痛、心搏「變慢」、發汗與臉部潮紅；常見誘因為膀胱脹尿或便秘，而非走路運動。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 9, "stem": "有關腸阻塞的臨床表徵，下列何者正確？①嘔吐 ②腹脹 ③腹部絞痛 ④腹瀉", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-9", "explanation": "腸阻塞典型表現為嘔吐、腹脹、腹部絞痛，並伴隨排便排氣停止（便秘），不會出現腹瀉，故①②③正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 10, "stem": "有關肝硬化引起腹水機轉之敘述，下列何者正確？", "options": ["微血管靜力壓下降", "血清白蛋白下降", "血漿膠體滲透壓上升", "有效循環血量上升"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-10", "explanation": "肝硬化時肝臟合成白蛋白減少，血清白蛋白下降使血漿膠體滲透壓「降低」；加上門脈高壓造成微血管靜力壓「上升」，液體滲入腹腔形成腹水，有效循環血量反而減少。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 11, "stem": "有關預防傾倒症候群（Dumping Syndrome）的護理指導，下列何者正確？", "options": ["鼓勵病人少量多餐，進食時採半坐臥姿勢", "鼓勵病人多進食富含水分的食物", "治療先從增加碳水化合物飲食開始", "建議採高脂肪、低蛋白、高糖食物"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-11", "explanation": "預防傾倒症候群應少量多餐、進食時採半坐臥或餐後平躺休息、餐中限制水分（餐間再補充），並採高蛋白、高脂肪、低碳水化合物飲食，以延緩食糜快速進入空腸。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 12, "stem": "下列何者不是食道癌常見的臨床表徵？", "options": ["吞嚥困難", "食慾不振", "腹痛", "聲音沙啞"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-12", "explanation": "食道癌典型表現為進行性吞嚥困難、體重減輕、食慾不振，侵犯喉返神經時出現聲音沙啞；腹痛並非其常見表徵。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 13, "stem": "有關膈裂孔疝氣的敘述，下列何者正確？", "options": ["造成原因是胃自橫膈的食道裂孔往上進入縱膈腔內", "食道旁疝氣常出現反流症狀", "滑動疝氣發生率占所有膈裂孔疝氣的 20%", "膈裂孔疝氣的原因為橫膈肌痙攣或腹內壓降低所致"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-13", "explanation": "膈裂孔疝氣是胃經橫膈的食道裂孔向上進入縱膈腔。滑動型約占 90% 且較常出現胃食道逆流症狀，食道旁疝氣反而較少逆流；成因為腹內壓「升高」及橫膈食道裂孔鬆弛。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 14, "stem": "有關口腔炎的分類及臨床表徵，下列何者正確？", "options": ["單純性疱疹常因細菌感染導致", "缺乏維生素 C 會引發口角炎", "念珠菌感染好發於口腔衛生習慣不好者", "常有疼痛、吞嚥困難及口腔出血等症狀"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-14", "explanation": "念珠菌感染（鵝口瘡）好發於口腔衛生不良、免疫功能低下、長期使用抗生素或類固醇者。單純疱疹屬病毒感染；口角炎與缺乏維生素 B 群（B2）有關；口腔炎以疼痛、吞嚥困難為主，出血並非典型。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 15, "stem": "有關癌症病人貧血問題之敘述，下列何者錯誤？", "options": ["全胃或脾臟切除手術會影響病人紅血球的生成", "貧血症狀包括蒼白、心跳變慢、血壓上升、易疲倦等", "鼓勵病人補充鐵質和含葉酸食物，如牛肉、綠色蔬菜", "集中護理可讓病人獲得充分的休息"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-15", "explanation": "貧血時身體代償會使心跳「加快」、血壓「下降」，並非心跳變慢、血壓上升。其餘敘述正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 16, "stem": "有關膽結石好發之高危險群，下列何者最不可能？", "options": ["女性", "肥胖者", "口服避孕藥者", "曾接受胃部手術者"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-16", "explanation": "膽結石高危險群為典型的 4F：女性（Female）、肥胖（Fat）、四十歲（Forty）、多產（Fertile），口服避孕藥（雌激素）亦會增加風險；胃部手術病史則非好發族群。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 17, "stem": "有關心口灼熱（Heart Burn）的敘述，下列何者錯誤？", "options": ["是下食道括約肌異常所致", "病人常以痙攣痛或打結般形容此不適", "進食後平躺可緩解症狀", "是食道疾病的常見症狀"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-17", "explanation": "心口灼熱是胃食道逆流的表現，進食後平躺會
