使胃酸更易逆流而「加劇」症狀，應採半坐臥並避免餐後立即躺下。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 18, "stem": "有關腕隧道症候群的敘述，下列何者正確？", "options": ["是指腕部正中神經受到壓迫所造成的現象", "主要發生在男性，以 50～60 歲居多", "臨床症狀是疼痛且腕部無法伸直", "可藉由膨脹徵象（Bulge sign）與霍曼氏徵象（Homan’s sign）確定診斷"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-18", "explanation": "腕隧道症候群是腕部正中神經受到壓迫。好發於女性、30～60 歲；症狀為麻木、刺痛與夜間加劇，腕部仍可伸直；診斷用 Tinel’s sign 與 Phalen’s test，Bulge sign 用於膝關節積液、Homan’s sign 用於深部靜脈栓塞。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 19, "stem": "王先生開放性骨折日前出院返家，近日發燒、寒顫、躁動不安、患肢持續性疼痛及拒絕移動關節或觸碰患肢。下列何者為其最可能的合併症？", "options": ["肺栓塞", "骨髓炎", "脂肪栓塞", "低血容積休克"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-19", "explanation": "開放性骨折後出現發燒、寒顫、患肢持續性疼痛及拒絕移動，是骨髓炎的典型表現。脂肪栓塞多在骨折後 24～72 小時內出現且以呼吸窘迫、點狀出血為主。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 20, "stem": "有關痛風藥物 Probenecis（Benemid）的主要作用，下列何者正確？", "options": ["抑制尿酸形成", "增加尿酸排出", "降低普林排出", "抑制炎症反應"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-20", "explanation": "Probenecid 屬促尿酸排泄劑，可抑制腎小管再吸收尿酸而增加尿酸排出；抑制尿酸形成者為 Allopurinol，抗發炎則用 Colchicine 或 NSAID。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 21, "stem": "有關骨折的癒合過程，下列順序何者正確？①血腫形成期 ②骨化期 ③細胞增生期 ④重塑期 ⑤骨痂形成期", "options": ["①②③④⑤", "①③⑤②④", "②③①④⑤", "⑤④③②①"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-21", "explanation": "骨折癒合順序為：①血腫形成期 → ③細胞增生期 → ⑤骨痂形成期 → ②骨化期 → ④重塑期。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 22, "stem": "有關青光眼病人之護理措施，下列何者正確？", "options": ["眼內壓上升超過正常值且造成視神經受損，稱為青光眼", "準備病人接受晶狀體植入", "熬夜不會影響眼壓", "指導病人術後臥向手術側"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-22", "explanation": "青光眼定義為眼內壓上升超過正常值並造成視神經受損與視野缺損。晶狀體植入是白內障手術；熬夜、情緒緊張會使眼壓升高；術後應臥向「健側」以免壓迫術眼。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 23, "stem": "有關中耳炎手術病人之術後護理指導，下列何者錯誤？", "options": ["手術後要觀察有無切斷顏面神經的合併症", "病人應採用軟質飲食", "禁做會阻塞耳咽管的伐氏操作法（Valsalva’s Maneuver）", "勿用力擤鼻子、用力咳嗽或打噴嚏"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-23", "explanation": "中耳手術不會刻意切斷顏面神經，護理重點是觀察顏面神經有無「受損」徵象（如口角歪斜、閉眼不全）。軟質飲食、禁做伐氏操作法、勿用力擤鼻或咳嗽皆為正確指導。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 24, "stem": "下列腫瘤何者源自結締組織？", "options": ["滑液膜肉瘤（synovial-sarcoma）", "軟骨肉瘤（chondrosarcoma）", "血管肉瘤（angiosarcoma）", "淋巴管肉瘤（lymphangiosarcoma）"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-24", "explanation": "軟骨肉瘤源自軟骨組織，屬結締組織來源的惡性腫瘤。滑液膜肉瘤源自滑液膜、血管肉瘤源自血管內皮、淋巴管肉瘤源自淋巴管內皮。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 25, "stem": "有關聽力喪失病人的護理指導，下列何者錯誤？", "options": ["與別人溝通時，等待對方先開口", "採用適當的位置，使說話者面部採光良好", "要求對方先說明主題，當改變話題時先通知", "家中電話加裝擴音器，或家中電鈴加裝閃光"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-25", "explanation": "與聽力喪失者溝通時，應「主動先開口」並確認對方已注意到自己，再面對面清楚說話，而非等待對方先開口。其餘為正確指導。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 26, "stem": "有關心臟復健（Cardiac Rehabilitation, CR）活動時應注意事項的敘述，下列何者錯誤？", "options": ["活動時應以漸進性方式增加強度", "活動初期的心跳速率以其最大心跳的 80%為原則", "活動時的心跳速率以不超過靜態休息時的 20 次/分鐘為原則", "活動後血壓上升以不超過正常血壓值 25 mmHg 為原則"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-26", "explanation": "心臟復健初期運動強度應控制在最大心跳的 60～70%（甚至更低）並漸進增加，80% 過高易誘發心肌缺氧。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 27, "stem": "王先生經醫生診斷為柏格氏病（Buerger’s Disease），下列敘述何者正確？", "options": ["與抽菸有關", "主要是周邊靜脈之阻塞", "好發在上肢", "走路無異狀"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-27", "explanation": "柏格氏病（血栓閉塞性脈管炎）與抽菸關係密切，戒菸是首要處置；它侵犯的是中小「動脈」（也可及靜脈），好發於「下肢」，典型症狀為間歇性跛行。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 28, "stem": "有關心絞痛病人接受股動脈經皮穿腔冠狀動脈血管成形術（PTCA）之術後護理，下列何者錯誤？", "options": ["監測雙側肢體之脈搏", "監測心電圖", "鼓勵病人多飲水", "鼓勵病人行下肢全關節主動運動"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-28", "explanation": "PTCA 經股動脈穿刺後，術側肢體須保持伸直、限制活動 6～8 小時以防穿刺處出血或血腫，不可鼓勵下肢全關節主動運動。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 29, "stem": "有關裝置心臟節律器之護理指導，下列何者錯誤？", "options": ["心律變慢時，可能是電池快沒電的徵象", "每天需監測橈動脈至少 1 分鐘整", "持續打嗝時，可利用 Valsalva 運動減緩打嗝", "術後 6 週內避免抬重物"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-29", "explanation": "持續打嗝可能是節律器導線移位刺激橫膈所致，應回診檢查；Valsalva 動作會改變胸內壓並影響節律器功能，不宜使用。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 30, "stem": "有關心因性休克之敘述，下列何者錯誤？", "options": ["心臟幫浦功能障礙造成循環衰竭", "最常見之致病原因為心肌梗塞", "最常見之症狀為呼吸停止", "心輸出量不符身體組織所需"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-30", "explanation": "心因性休克最常見的表現是低血壓、心搏過速、末梢濕冷、尿量減少與意識改變，並非呼吸停止。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 31, "stem": "有關聽診心音之敘述，下列何者錯誤？", "options": ["第一心音的產生是僧帽瓣與三尖瓣關閉血液撞擊所造成", "聽診心音的主動脈瓣區在胸骨右緣第 2 肋間", "聽到第二心音之後心動週期進入心室的舒張期", "心臟衰竭病人如出現第三心音會在心室的舒張末期聽到"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-31", "explanation": "第三心音（S3）出現在心室舒張「早期」的快速充盈期，是心衰竭常見的奔馬音；出現在舒張末期者為第四心音（S4）。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 32, "stem": "下列血流動力學檢查結果何者正常？", "options": ["右心房壓力 130 mmHg", "右心室收縮壓 120 mmHg", "左心室舒張壓 40 mmHg", "上腔靜脈壓 8 mmHg"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-32", "explanation": "上腔靜脈壓（中心靜脈壓）正常值約 2～8 mmHg，故 8 mmHg 屬正常。右心房壓正常 2～6 mmHg、右心室收縮壓 15～30 mmHg、左心室舒張壓 4～12 mmHg，其餘數值皆明顯過高。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 33, "stem": "輸注下列何種藥物時，需以不透光錫箔紙包住點滴瓶及輸液管？", "options": ["Diazoxide（Hyperstat）", "Dobutamine（Dobutrex）", "Nitroglycerin（Tridil）", "Nitroprusside（Nipride）"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-33", "explanation": "Nitroprusside（Nipride）遇光易分解並產生氰化物，故點滴瓶及輸液管須以不透光錫箔紙包覆避光。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 34, "stem": "下列何者是心肌梗塞最常見且會導致死亡的併發症？", "options": ["心因性休克", "心肌梗塞再度發生", "心律不整", "急性肺水腫"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-34", "explanation": "心律不整（尤其心室顫動）是心肌梗塞最常見且最易致死的併發症，故心肌梗塞病人須持續心電圖監測。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 35, "stem": "有關缺鐵性貧血病人的護理措施，下列何者正確？①教導病人使用吸管吸食液態鐵劑 ②鼓勵病人飯後服用鐵劑以增加鐵的吸收 ③鼓勵病人多攝取富含維生素 C 的食物 ④注射鐵劑後應避免立即拔出針頭", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-35", "explanation": "①③④正確：液態鐵劑用吸管可避免牙齒染黑，維生素 C 可促進鐵吸收，肌肉注射鐵劑採 Z 字形注射並停留數秒再拔針以防滲漏染色。②錯誤，鐵劑宜「飯前空腹」服用吸收較佳（腸胃不適時才改飯後）。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 36, "stem": "林先生接受骨髓移植後 2 週出現黃疸、腹水、體重增加，下列何者為最可能發生之合併症？", "options": ["感染", "間質性肺炎", "肝靜脈阻塞疾病", "慢性移植物對抗宿主疾病"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-36", "explanation": "骨髓移植後 2～3 週出現黃疸、腹水、體重增加與肝腫大，最典型為肝靜脈阻塞疾病（VOD）。慢性移植物對抗宿主疾病多發生於移植 100 天以後。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 37, "stem": "有關白血病病人接受異體骨髓移植後出現合併症之敘述，下列何者錯誤？", "options": ["移植前曾罹患肝炎者會增加肝靜脈阻塞的機率", "急性移植物對抗宿主疾病以皮膚、腸胃道及肝臟為主", "慢性移植物對抗宿主疾病的發生率與年齡有關", "移植後 2 星期內的感染以巨細胞病毒感染最常見"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-37", "explanation": "移植後 2 星期內（骨髓尚未生長期）以細菌與黴菌感染為主；巨細胞病毒（CMV）感染多發生於移植後 1～3 個月。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 38, "stem": "有關特異性血小板減少性紫斑症之敘述，下列何者正確？①可能與自體免疫疾病有關 ②骨髓檢查可發現巨核細胞增加 ③須避免使用 Aspirin 的藥物 ④經常發生於細菌感染後", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-38", "explanation": "①②③正確：特發性血小板減少性紫斑症與自體免疫有關，骨髓檢查可見巨核細胞增加，且須避免使用 Aspirin 等影響血小板功能的藥物。④錯誤，它常發生於「病毒」感染之後。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 39, "stem": "有關化學治療藥物作用機轉與副作用之敘述，下列何者錯誤？", "options": ["Cisplatin 屬烴基化合物，常見副作用是噁心嘔吐、耳毒性和周邊神經病變等", "Fluorouracil（5-FU）屬抗代謝藥物，常見副作用是口腔炎、骨髓抑制等", "Doxorubicin 屬類固醇藥物，可促進 G0 期癌細胞進入分裂期", "Vincristine 屬植物鹼類藥物，作用於 M 期，干擾有絲分裂"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-39", "explanation": "Doxorubicin 屬抗腫瘤抗生素（非類固醇），會嵌入 DNA 抑制複製，最重要的副作用是心臟毒性。其餘三項敘述正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 40, "stem": "有關放射線治療病人照射處皮膚照護之敘述，下列何者錯誤？", "options": ["要用中性肥皂搓洗避免感染", "不可塗抹含酒精的乳液", "可依醫囑塗抹氧化鋅", "只能使用電動刮鬍刀"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-40", "explanation": "放射線照射部位的皮膚應以溫水輕拍清洗、保持乾燥，「不可」用肥皂搓洗或摩擦，以免破壞脆弱皮膚造成潰瘍。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 41, "stem": "有關癌症病人出血問題之敘述，下列何者錯誤？", "options": ["血小板數目 8 萬/μL 是正常的數據", "消化道出血時，可使用冰鹽水灌洗", "有出血傾向的病人要限制使用 Coumadin 和 Heparine", "要避免肌肉注射或量肛溫等侵入性處置"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-41", "explanation": "血小板正常值約 15 萬～40 萬/μL，8 萬/μL 已明顯偏低並有出血風險，不能視為正常數據。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 42, "stem": "有關乳癌症狀與疾病分期之敘述，下列何者正確？", "options": ["好發部位在乳房的內上 1/4 處", "T2N1M0 屬於癌症分期的第三期", "最常見的症狀為疼痛性腫塊", "乳頭下腫塊會造成乳頭回縮或高低不一"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-42", "explanation": "乳頭下方的腫塊會牽扯乳頭造成回縮或兩側高低不一。乳癌好發於「外上」1/4 象限；T2N1M0 屬第二期（IIB）；最常見症狀為「無痛性」硬塊。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 43, "stem": "有關前列腺癌之敘述，下列何者正確？", "options": ["藥物治療大多使用雄性素", "放射線治療時最常使用鈷 60 放射源", "鹼性磷酸酶值過高與前列腺癌之診斷有關", "前列腺特異性抗原（PSA）濃度可做為治療效果的參考"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-43", "explanation": "PSA 可用於前列腺癌的篩檢、診斷輔助及治療效果追蹤。藥物治療是以「抗雄性素」去勢療法；放射治療現多用直線加速器；與診斷相關者為酸性磷酸酶及 PSA，鹼性磷酸酶升高僅反映骨轉移。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 44, "stem": "有關決定膚色的黑色素細胞主要分布在下列那一層？", "options": ["顆粒層", "棘狀層", "基底層", "網狀層"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-44", "explanation": "黑色素細胞位於表皮的最深層——基底層，其產生的黑色素決定膚色。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 45, "stem": "有關全身性紅斑性狼瘡之護理措施，下列何者錯誤？", "options": ["出門時應穿長袖衣物及穿戴寬邊帽子防曬", "出現血尿、蛋白尿等狀況時，應多下床活動", "慢性疲勞時，建議執行漸進式活動，如步行或游泳等", "若有生育考量，於病情控制良好 6 個月後，再與醫師討論懷孕計畫"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-45", "explanation": "出現血尿、蛋白尿代表狼瘡腎炎處於活動期，應「臥床休息」以減輕腎臟負擔，不應多下床活動。其餘防曬、漸進式活動、懷孕規劃皆正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 46, "stem": "有關感染疥瘡（Scabies）引起皮膚疾病之敘述，下列何者錯誤？", "options": ["人體接觸疥蟲後 2 週左右會出現症狀", "疥蟲感染者所使用的床單，在 2 週內具有傳染力", "劇癢症狀好發在頸部以下", "衣物用具加熱煮沸可以殺死疥蟲"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-46", "explanation": "疥瘡初次感染的潛伏期約 4～6 週才出現症狀（再次感染則 1～4 天）；污染的床單、衣物可維持數天傳染力，須以 60℃ 以上熱水清洗或煮沸。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 47, "stem": "有關燒傷深度的敘述，下列何者錯誤？", "options": ["一度燒傷是指表皮受到損害，會有疼痛感", "二度燒傷是指真皮層受到損傷，會有劇烈疼痛", "三度燒傷是指全皮層的損傷，會有劇烈疼痛", "四度燒傷是指全皮層、肌肉和骨骼的損傷，沒有疼痛感"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-47", "explanation": "三度燒傷為全皮層損傷，神經末梢已被破壞，因此傷處「沒有」痛覺（周邊二度區域才會痛）。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 48, "stem": "有關後天免疫缺乏症候群（Acquired Immunodeficiency Syndrome, AIDS）之敘述，下列何者錯誤？", "options": ["不會經由握手、擁抱、共餐、共用馬桶、游泳、蚊蟲叮咬等途徑傳染病毒", "有皮膚疾患或懷孕的醫療人員不應直接對病人進行醫療照護", "由於病人容易產生伺機性感染，避免到人多擁擠的公共場所", "病人應定期接種麻疹腮腺炎德國麻疹混合疫苗（MMR）與流感疫苗"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-48", "explanation": "AIDS 病人免疫功能低下，「不可」接種 MMR 等活性減毒疫苗；流感疫苗則為不活化疫苗可接種。其餘傳染途徑與感染預防敘述皆正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 49, "stem": "有關器官移植後之護理指導，下列何者錯誤？", "options": ["移植後應多做戶外運動、曬太陽，以增強抵抗力", "移植後避免出入公共場所，外出戴口罩", "移植後服藥出現藥物副作用，不可自行停藥，回診由醫師調整用藥", "移植後需要暫時避孕，若準備懷孕應事先與醫師討論"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-49", "explanation": "器官移植後長期使用免疫抑制劑，應「避免」曝曬陽光（皮膚癌風險增加）及人多場所，並非多做戶外運動曬太陽。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 50, "stem": "有關類風濕性關節炎之敘述，下列何者正確？①手部關節會出現尺側偏斜 ②活動後有僵硬的現象 ③關節 X 光變化呈現關節腔變窄 ④關節腫脹呈現不對稱性", "options": ["①②", "①③", "②④", "③④"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-50", "explanation": "①③正確：手部關節出現尺側偏斜，X 光可見關節腔變窄。②錯誤，類風濕性關節炎為「晨間僵硬」且活動後緩解；④錯誤，其關節腫脹呈「對稱性」分布。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 51, "stem": "有關鞏皮症之敍述，下列何者正確？", "options": ["又稱「進行性系統性硬化症」，好發於男性", "常發生雷諾氏症候群（Raynaud’s syndrome）", "血液檢查 γ–球蛋白增加，主要是 IgA 增加", "侵犯臉部，造成臉部表情豐富現象"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-51", "explanation": "鞏皮症（進行性系統性硬化症）好發於女性，最常見的早期表現即雷諾氏現象。血中球蛋白以 IgG 增加為主；侵犯臉部時皮膚繃緊、表情減少呈「面具臉」。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 52, "stem": "有關使用呼氣末期陽壓（PEEP）治療急性呼吸窘迫症候群的主要目的，下列何者正確？", "options": ["可避免肺纖維化的產生", "可使吸氣時有更多氣體帶入肺內", "可將 100%的氧氣帶入肺內", "可避免吐氣時肺泡塌陷"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-52", "explanation": "PEEP 是在吐氣末期維持正壓，避免肺泡塌陷、增加功能性肺餘量與氣體交換面積，藉此改善急性呼吸窘迫症候群的氧合。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 53, "stem": "下列何者為肺水腫最典型的症狀？", "options": ["呼吸音出現肋膜摩擦音", "突然胸痛", "粉紅色泡沫痰", "杵狀指"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-53", "explanation": "肺水腫最典型的症狀是咳出粉紅色泡沫痰，並伴隨端坐呼吸、囉音。肋膜摩擦音見於肋膜炎、突發胸痛見於氣胸或肺栓塞、杵狀指見於慢性缺氧。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 54, "stem": "病人行氣管內插管後聽診呼吸音時，發現左側肺部呼吸音減弱但右側正常，下列何者為導致此情形最可能的原因？", "options": ["氣管內管插到食道中", "氣管內管插到右主支氣管內", "氣管內管插到氣管分叉處上", "病人有左肺肺炎"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-54", "explanation": "右主支氣管較短、較粗且角度較直，氣管內管過深時最容易滑入右主支氣管，造成左側呼吸音減弱而右側正常，處置為將管子往外拉並重新確認深度。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 55, "stem": "有關呼吸器的使用，通常會設定每分鐘數次深呼吸，其所要預防之首要合併症，下列何者正確？", "options": ["氣胸", "肺栓塞", "肺炎", "肺擴張不全"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-55", "explanation": "呼吸器設定每分鐘數次的嘆息（sigh）深呼吸，主要目的是使塌陷的肺泡再擴張，預防肺擴張不全（肺塌陷）。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 56, "stem": "照護右上肺葉肺炎病人之護理措施，下列何者不適當？", "options": ["協助病人右側臥", "教導病人抱胸咳嗽", "將病人床頭抬高 45 度", "鼓勵病人下床活動"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-56", "explanation": "右上肺葉肺炎應採「左側臥」（健側在下、患側在上），以利患側分泌物引流並維持健側通氣；協助右側臥反而壓迫患側，並不適當。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 57, "stem": "有關肺栓塞的醫療處置，下列何者錯誤？", "options": ["給與氧氣治療，維持 PaO2 在 60 mmHg 以上", "抬高下肢增加靜脈回流", "給與 Streptokinase 預防血栓形成", "在下腔靜脈放入腔靜脈過濾器"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-57", "explanation": "肺栓塞的栓子多來自下肢深部靜脈，急性期應臥床休息、避免按摩或抬高下肢以增加靜脈回流，以免血栓再度脫落。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 58, "stem": "肺炎發生時，於肺實質所產生的病生理變化，不包括下列何者？", "options": ["肺塌陷", "支氣管擴張症", "肺積水", "發炎反應"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-58", "explanation": "肺炎是肺實質的發炎，病生理變化包括發炎反應、肺泡積水（實質化）與肺塌陷；支氣管擴張症是慢性且不可逆的支氣管結構破壞，並非肺炎當下的變化。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 59, "stem": "胸腔手術後病人進行深呼吸運動之主要成效，下列何者正確？", "options": ["可以提高橫膈膜，使胸腔擴大且增加肺部進行氣體交換的表面積", "可增加到肺部的血流量，使術後復原較快", "可控制氣體的流速，使病人不會過度通氣", "可擴張肺泡，增加氣體交換的表面積"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-59", "explanation": "深呼吸運動可使橫膈下降、肺泡擴張，增加氣體交換的表面積並促進分泌物排出，是胸腔手術後預防肺擴張不全的重要措施。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 60, "stem": "有關電解質失調之症狀評估結果，下列何者錯誤？", "options": ["高血鈉症會致肌肉軟弱無力", "低血鈣症常有凝血時間延長", "低血鉀症常有便秘腹脹現象", "低血鈣症易導致手足抽搐"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-60", "explanation": "高血鈉症以口渴、黏膜乾燥、躁動不安、反射亢進甚至抽搐為主；肌肉軟弱無力則是低血鉀症的典型表現。低血鈣的凝血時間延長與手足抽搐、低血鉀的便秘腹脹皆正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 61, "stem": "林小姐食慾不振，嚴重水腫，無法平躺睡覺，至某醫學中心就診，抽血檢查結果血清 Creatinine=13.8 mg/dL，eGFR=9.2 mL/min/1.73 m2，依此結果，林小姐是處於慢性腎臟病（CKD）的第幾期？", "options": ["第二期", "第三期", "第四期", "第五期"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-61", "explanation": "eGFR 9.2 mL/min/1.73 m²（＜15）已達慢性腎臟病第五期，即末期腎病；合併食慾不振、嚴重水腫與端坐呼吸為尿毒症狀。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 62, "stem": "承上題，下列何項為林小姐接下來的重要處理目標？", "options": ["減緩腎功能惡化", "尿毒症相關之護理指導", "建立血管通路", "開始透析治療或腎移植"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-62", "explanation": "第五期（末期腎病）且已出現尿毒症狀與嚴重體液過量，接下來的重要目標是開始腎臟替代療法——透析治療或腎臟移植。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 63, "stem": "張先生 50 歲，患有糖尿病腎病變，下列治療何項錯誤？", "options": ["鼓勵病人每天多攝取蛋白質（1.5～2.0 g/天）", "將糖化血色素控制在 7%以內", "將血壓控制在 130/80 mmHg 以內", "血管收縮素轉化酶抑制劑（ACEI）可用來控制血壓"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-63", "explanation": "糖尿病腎病變應「限制」蛋白質攝取（約 0.6～0.8 g/kg/天）以減緩腎功能惡化，不可鼓勵多攝取。血糖（HbA1c＜7%）、血壓（＜130/80 mmHg）控制及使用 ACEI 皆正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 64, "stem": "梁太太規律接受血液透析，因腎性貧血服用葉酸，其最恰當的服用時間為何？", "options": ["透析前半小時服用", "開始透析時立即服用", "透析當中服用", "透析結束後服用"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-64", "explanation": "葉酸屬水溶性維生素，透析過程中會被移除，因此應於「透析結束後」服用，才能維持有效血中濃度。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 65, "stem": "有關酸鹼不平衡之敘述，下列何者錯誤？", "options": ["慢性阻塞性肺疾病病人易致呼吸性酸中毒", "歇斯底里症者、過度焦慮者，易致呼吸性鹼中毒", "嚴重腹瀉者，易致代謝性鹼中毒", "嚴重嘔吐者，易致代謝性酸中毒"], "answer": "CD", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-65", "explanation": "本題 C、D 敘述皆錯：嚴重腹瀉會流失腸液中的重碳酸鹽而導致代謝性「酸」中毒；嚴重嘔吐流失胃酸則導致代謝性「鹼」中毒，故答 C 或 D 者均給分。", "note": "更正答案：第 65 題答 C 或 D 者均給分"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 66, "stem": "有關腎臟活體組織切片檢查之敘述，下列何者錯誤？", "options": ["透過超音波導引取出組織切片，以確認腎實質疾病之病因", "通常穿刺時採俯臥姿，部位大約於第 12 肋骨與脊椎交角中間", "檢查前需確認凝血功能，以及暫停使用含 Aspirin 成分之藥物", "檢查後 24 小時內應臥床休息，避免下床活動"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-66", "explanation": "腎臟切片的穿刺定位應取腎「下極」，約在第 12 肋骨下緣與脊柱旁肌肉外緣交角處，而非第 12 肋骨與脊椎交角中間。其餘超音波導引、確認凝血功能與停用 Aspirin、術後臥床 24 小時皆正確。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 67, "stem": "有關慢性腎衰竭的典型臨床表徵，下列何者錯誤？", "options": ["氮血症", "高血脂", "低血磷", "代謝性酸中毒"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-67", "explanation": "慢性腎衰竭因腎小球過濾率下降、磷排除減少，會出現「高血磷」與繼發性低血鈣，而非低血磷。氮血症、高血脂與代謝性酸中毒均為典型表徵。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 68, "stem": "有關經尿道前列腺切除術的敘述，下列何者錯誤？", "options": ["透過電刀切除前列腺，是良性前列腺肥大第一線最常用的治療方式", "若手術過程吸收過多沖洗液，容易引起腦水腫需注意病人意識狀態", "出血是最常見的合併症，術後需要持續用生理食鹽水做膀胱灌洗", "若尿道內括約肌有受損，可能導致性行為高潮時出現逆行性射精"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-68", "explanation": "良性前列腺肥大的第一線治療是藥物（α 阻斷劑、5α 還原酶抑制劑）及觀察追蹤，經尿道前列腺切除術（TURP）屬於藥物無效或有併發症時的手術治療。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 69, "stem": "有關黏液水腫昏迷之檢查結果，下列何者錯誤？", "options": ["血清中 T4 下降", "血中 TSH 下降", "血鈉下降", "血糖下降"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-69", "explanation": "黏液水腫昏迷屬原發性甲狀腺功能低下，T4 下降會使腦下垂體代償性分泌增加，故血中 TSH 應「上升」而非下降。低血鈉、低血糖則為其典型檢查結果。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 70, "stem": "有關抗利尿激素分泌不當症候群（SIADH）之臨床表徵，下列何者錯誤？", "options": ["通常是由泌尿道疾病引發", "最常出現症狀是食慾不振", "血鈉濃度會＜135 mEq/L", "病人會出現低尿酸血症"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-70", "explanation": "SIADH 最常見的原因是肺部疾病（尤其小細胞肺癌）、中樞神經病變及藥物，並非泌尿道疾病。抗利尿激素過多導致水分滯留、稀釋性低血鈉（＜135 mEq/L）與低尿酸血症。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 71, "stem": "有關糖尿病病人足部護理，下列何者正確？①直線修剪趾甲緣 ②每日以溫水浸泡清洗足部 30 分鐘 ③穿著色深、柔軟的尼龍襪，且每日更換 ④足部傷口沖洗後，消毒敷料覆蓋，紙膠固定，應儘速就醫", "options": ["①②", "①④", "②③", "③④"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-71", "explanation": "①④正確：趾甲應直線修剪避免嵌甲；足部傷口沖洗後以消毒敷料覆蓋、紙膠固定並儘速就醫。②錯誤，泡腳應以溫水 5～10 分鐘即可，30 分鐘易使皮膚浸軟破損；③錯誤，應穿「淺色」棉質襪以便觀察傷口滲液。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 72, "stem": "有關糖化血紅素（HbA1c）的敘述，下列何者正確？", "options": ["當＜10%表示控制良好", "反應過去 6 個月內血糖控制的情形", "不受禁食、驗血時間所影響", "正常人約 4～9%"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-72", "explanation": "HbA1c 反映紅血球生命週期內的平均血糖，即過去 2～3 個月的控制情形，且不受禁食與抽血時間影響。正常人約 4～6%，控制良好指＜7%。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 73, "stem": "有關甲狀腺功能低下症之護理措施，下列何者正確？", "options": ["服用甲狀腺素時採飯後使用，以避免胃酸增加", "使用甲狀腺素藥物時須監測血糖之變化", "給予病人電毯或熱水袋，以增加舒適及保暖", "鼓勵採高熱量、低纖維、低脂肪飲食"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-73", "explanation": "甲狀腺素會影響醣類代謝並可能升高血糖，糖尿病病人使用時須監測血糖。甲狀腺素應「飯前空腹」服用；病人感覺遲鈍不可用電毯或熱水袋以免燙傷；飲食應採高蛋白、高纖維、低熱量以防便秘與體重增加。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 74, "stem": "有關糖尿病酮酸中毒（DKA）與高滲透壓高血糖狀態（HHS）之臨床處置，下列何者正確？", "options": ["HHS 需補充的水分較少", "HHS 需要較多的胰島素治療", "HHS 較 DKA 更需補充重碳酸鈉", "HHS 不需要補充鉀離子"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-74", "explanation": "HHS 血糖常高於 600 mg/dL，遠高於 DKA，故需要較多的胰島素才能降至安全範圍。HHS 脫水更嚴重需補充「更多」水分；因無明顯酮酸血症故不需補充重碳酸鈉；且胰島素治療後鉀離子移入細胞內，仍須監測並補充鉀離子。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 75, "stem": "有關使用 Spironolactone（Aldactone）藥物指導之敘述，下列何者正確？①須注意鉀離子濃度 ②須注意鎂離子濃度 ③鼓勵多食用柑橘類食物 ④不宜食用芭樂", "options": ["①③", "①④", "②③", "②④"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-75", "explanation": "①④正確：Spironolactone 屬保鉀利尿劑，須監測血鉀濃度並避免高鉀食物。③錯誤，柑橘類含鉀量高應限制；②鎂離子並非此藥的監測重點。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 76, "stem": "下列何者不是休克時會發生之代償機轉？", "options": ["刺激交感神經分泌腎上腺素，造成血管收縮", "刺激交感神經，使呼吸加速及加深", "刺激內分泌系統分泌血管緊縮素，促進血管收縮", "刺激消化道系統，促進腸胃蠕動"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-76", "explanation": "休克時交感神經興奮會使血流重新分配至心、腦等重要器官，腸胃道血管收縮、蠕動「減弱」，因此促進腸胃蠕動並非代償機轉。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 77, "stem": "下列何種情況最可能引發神經性休克？", "options": ["蜜蜂螫傷引發休克", "張力性氣胸造成休克", "心肌梗塞造成休克", "車禍脊髓受損造成休克"], "answer": "D", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-77", "explanation": "神經性休克源自脊髓損傷、脊髓麻醉等造成血管運動張力喪失、血管擴張。蜜蜂螫傷屬過敏性休克、張力性氣胸屬阻塞性休克、心肌梗塞屬心因性休克。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 78, "stem": "有關敗血症之敘述，下列何者錯誤？", "options": ["血小板＞140,000 cells/μL", "尿量＜0.5 mL/kg/hr", "膽紅素＞4 mg/dL", "收縮壓＜90 mmHg"], "answer": "A", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-78", "explanation": "敗血症時常見血小板「減少」（＜100,000 cells/μL）與凝血功能異常，血小板＞140,000 cells/μL 並非敗血症的判定指標。其餘尿量、膽紅素、收縮壓數值均為器官功能障礙指標。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 79, "stem": "病人輸血 10 分鐘時出現蕁麻疹及哮喘之處置，下列何者錯誤？", "options": ["需密切監測生命徵象的變化", "暫停輸血 5 分鐘，再繼續進行輸血", "維持呼吸道暢通", "給予 Epinephrine 及 Aminophylline"], "answer": "B", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-79", "explanation": "出現輸血反應時應「立即停止輸血」，並改以生理食鹽水維持靜脈通路、通知醫師，不可暫停後再繼續輸注。"}, {"year": "111", "session": "第一次", "subject": "內外科護理學", "num": 80, "stem": "有關腸病毒之敘述，下列何者錯誤？", "options": ["經由腸胃道、呼吸道或接觸病人皮膚水泡的液體而感染", "感染時會出現發燒、手足口症及疱疹性咽峽炎等症狀", "發病前 1 週內傳染力最強，成人感染發病時多無症狀，且無傳染力", "引起腸病毒感染併發重症之型別以腸病毒 71 型為主"], "answer": "C", "subjectCode": "3104", "subjectShort": "內外科", "id": "111-1-3104-80", "explanation": "腸病毒在發病後 1 週內傳染力最強，且可持續由糞便排出病毒數週；成人感染雖多無症狀，但「仍具傳染力」，可能傳染給家中幼兒。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 1, "stem": "王奶奶，80 歲，因憂鬱症住院。低聲說：「我全身都壞了，兒子不孝順只想要我的財產而已。」護理師說：「妳是擔心自己的身體和財產嗎？」此時護理師所運用的溝通技巧為：", "options": ["澄清", "提出懷疑", "鼓勵比較", "面質"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-1", "explanation": "護理師把病人零散的敘述重述並確認其真正意涵（「妳是擔心自己的身體和財產嗎？」），屬於澄清（clarification）技巧。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 2, "stem": "社區內舉辦新手媽媽講座，教導懷孕的身心變化相關課程，是屬於精神心理衛生工作中的那一級的預防？", "options": ["初級預防", "次級預防", "三級預防", "各級皆涵蓋"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-2", "explanation": "對懷孕婦女進行身心變化的衛教，目的在增進健康、預防問題發生，屬於初級（一級）預防。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 3, "stem": "下列何者最符合現行精神衛生法所規範的精神病人之保護及權益保障？", "options": ["為保護住院精神病人之安全，不可以有會客權利", "為保護校園安全，學校得拒絕曾罹患精神疾病病人入學就讀", "為保護社區安全，慢性精神病患應長期安置於醫療機構", "傳播媒體的報導，不得使用與精神疾病有關的歧視性稱呼或描述"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-3", "explanation": "精神衛生法明定傳播媒體報導不得使用與精神疾病有關的歧視性稱呼或描述。住院病人有會客權、不得因病史拒絕入學，且應推動社區照護而非長期機構安置。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 4, "stem": "關於精神衛生護理工作範圍，居家護理師於病人出院後，協助強化其社交技巧，此項照護較屬於下列何者？", "options": ["保健性", "治療性", "復健性", "管理性"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-4", "explanation": "病人已出院、症狀穩定，協助其強化社交技巧以恢復社會功能，屬於復健性照護。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 5, "stem": "有關譫妄（delirium）的敘述，下列何者錯誤？", "options": ["觸幻覺是最常見的知覺障礙", "任何年齡皆有可能發生", "會出現認知困擾", "電解質不平衡與譫妄發生有關"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-5", "explanation": "譫妄最常見的知覺障礙是「視幻覺」，而非觸幻覺。譫妄可發生於任何年齡，以意識混亂、注意力與認知困擾為主，電解質不平衡、感染、藥物都是誘因。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 6, "stem": "陳護理師因為先生喝酒問題常常引起夫妻之間的衝突，陳護理師想到今天要接的新病人，診斷為酒精使用障礙症（alcohol use disorder），陳護理師就感到焦慮、生氣，這是下列何種現象？", "options": ["正面情感轉移", "負面情感轉移", "正面情感反轉移", "負面情感反轉移"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-6", "explanation": "護理師因自身家庭經驗，把情緒投射到具有相似特質的病人身上，屬於「反轉移」；情緒為焦慮、生氣等負向感受，故為負面情感反轉移。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 7, "stem": "承上題，陳護理師與新病人接觸前，宜優先進行下列何項措施？", "options": ["隱藏自己內心的焦慮與生氣", "請護理長改由其他護理師接此病人", "自我覺察這類診斷的病人會讓自己感到不適", "自己與病人接觸時不能有任何情緒"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-7", "explanation": "處理反轉移的第一步是自我覺察，辨識自己的情緒來源與反應，才能避免影響治療性關係；隱藏情緒或要求換人並非優先且無助於專業成長。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 8, "stem": "護理師在病房照護病人，經常會應用行為治療協助病人行為改變，下列敘述何者最適當？", "options": ["護理師稱讚病人可以踴躍發言，病人因而更願意分享，這是應用負向增強原理", "護理師和病人約定，如果不出現干擾行為達 3 天，就可以解除暫禁外出，這是應用正向增強原理", "為協助病人養成盥洗習慣，從簡單開始，將任務分成許多步驟推動，是應用逐步養成法的行為處置", "將攻擊他人的病人，四肢約束送進保護室觀察，最主要是運用負向增強原理"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-8", "explanation": "把盥洗任務拆解成許多小步驟、由簡而繁逐步完成並給予增強，是逐步養成法（shaping）。A 為正向增強；B 解除暫禁外出屬移除嫌惡刺激的「負向增強」；D 約束隔離屬處罰。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 9, "stem": "協助危機狀態生還者之個別性處置（individual approach），下列何者最適當？", "options": ["需要發掘個案適用的因應機轉", "通常並不包含家人在處置內", "重視生理需求，但先不處理心理需求", "鼓勵個案澄清（clarify）事實為主，不鼓勵情感宣洩（catharsis）"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-9", "explanation": "危機處置的核心在協助個案找出並運用有效的因應機轉。危機處置應納入家人支持系統、生理與心理需求並重，且鼓勵情感宣洩（catharsis）以釋放壓力。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 10, "stem": "下列有關精神疾病臨床症狀的敘述，何者正確？", "options": ["對外界事務過度注意，甚至有警覺心，稱之為欣快感（euphoria）", "對同一件事同時存在兩種相反的情感感受，稱之為不恰當情感（inappropriate affect）", "情感遲鈍、面部表情少、對外界漠不關心，稱之為失快樂感（anhedonia）", "說話快速而持續，話題轉換迅速，話題間略有關聯，稱之為意念飛躍（flight of ideas）"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-10", "explanation": "說話快速而持續、話題轉換迅速但仍略有關聯，即意念飛躍，常見於躁症。對外界過度警覺為警戒；同時存在兩種相反情感為矛盾情感；情感遲鈍、對外漠不關心為情感平淡。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 11, "stem": "強調人是自主的，可自由創造具有價值意義的生存方式，是下列何項心理治療的理論觀點？", "options": ["心理分析治療", "個人中心治療", "存在—人文主義治療", "認知行為治療"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-11", "explanation": "強調人具自主性、可自由選擇並創造生命意義，是存在—人文主義治療的核心觀點。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 12, "stem": "王小姐在精神科病房住院，住院期間某日與其他病人爭執，出手攻擊對方。依據行為治療理論，下列何項負向增強（negative reinforcement）的處置最適當？", "options": ["減少外出購物次數", "送到保護室", "不讓病人吃點心", "執行約束"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-12", "explanation": "本題為更正答案，公告第 12 題答 B 給分。負向增強在此指移除／改變環境刺激以減少攻擊行為，公告採「送到保護室」為答案。", "note": "更正答案：第 12 題答 B 給分"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 13, "stem": "有關現實治療的描述，下列敘述何者最適當？", "options": ["可藉由正當、責任與現實來有效管理個人的生活", "運用面質技巧，矯正個案的錯誤認知", "重視過去的探討，而非此時此刻和未來", "運用潛意識引導，協助認識自我的需求"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-13", "explanation": "現實治療強調 3R——正當（Right）、責任（Responsibility）、現實（Reality），協助個案為自己的行為負責並有效管理生活。它重視此時此刻與未來，不探討潛意識與過去。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 14, "stem": "對慢性思覺失調症且功能退化病人的照護，護理師指導家屬的照護病人的措施，下列何者正確？①直接幫病人做日常生活上的照顧，又快又好 ②宜採漸進式訓練 ③需要耐性予以接納與訓練 ④配合獎賞引發學習動機", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-14", "explanation": "②③④正確：慢性且功能退化的病人需採漸進式訓練、耐心接納，並配合獎賞引發學習動機。①錯誤，直接代做會剝奪病人維持自我照顧能力的機會。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 15, "stem": "根據 DSM-5 診斷準則，經期前情緒低落症（Premenstrual Dysphoric Disorder）的症狀，下列何者最不適當？", "options": ["月經前 1 週出現易怒、焦慮、緊張", "月經前 1 週出現專注力降低、易疲勞、失去控制感", "月經來潮後幾天內症狀會改善", "症狀不會影響工作效率"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-15", "explanation": "DSM-5 的經期前情緒低落症必須「明顯影響」工作、社交或人際功能才符合診斷，故「症狀不會影響工作效率」最不適當。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 16, "stem": "林先生因為雙相情緒障礙症（Bipolar Disorder）躁症發作住院，主要治療藥物為鋰鹽、carbamazepine（Tegretol®）。護理師發現林先生顯得倦怠、無力，緊急抽血鋰鹽濃度為 0.8 mEq/L、Na 為 120 mEq/L。下列何項護理措施最適當？", "options": ["鋰鹽濃度偏高，立即停止服用鋰鹽，預防中毒", "是 carbamazepine 的嚴重不良反應，立即停止服用", "注意評估病人飲水量", "再隔 2 個月抽血檢查鋰鹽及 Na 濃度"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-16", "explanation": "鋰鹽濃度 0.8 mEq/L 仍在治療範圍（0.6～1.2），但血鈉僅 120 mEq/L 明顯偏低。低血鈉會減少鋰鹽排除而增加中毒風險，且可能與過度飲水有關，故應優先評估病人的飲水量。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 17, "stem": "黃先生，診斷為思覺失調症（Schizophrenia），規則服藥，在社區復健機構接受治療時，被一位女性踩到腳，他認為自己是病人，又沒結婚，那位女性才會故意踩他的腳。下列何項護理措施最適當？", "options": ["病人有被害妄想，建議調藥", "同理病人並討論對應方法", "解釋那位女性不是故意行為", "提醒病人走路要注意"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-17", "explanation": "病人有被害意念時，不宜直接反駁或解釋，應先同理其感受、接納情緒，再與其討論實際的因應方法。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 18, "stem": "有關思覺失調症（Schizophrenia）病程進展的描述，下列何者最適當？", "options": ["前驅期以正性症狀為主，出現功能衰退的表現", "發病期的發作一般與心理社會壓力事件有關", "前驅期常常出現暴力或自傷行為", "殘留期通常發生在青少年階段"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-18", "explanation": "思覺失調症發病期（急性期）的發作常與心理社會壓力事件有關。前驅期以負性症狀與功能逐漸退化為主、暴力自傷多見於急性期，殘留期則出現在急性症狀緩解之後。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 19, "stem": "小君，診斷為思覺失調症（Schizophrenia），可規則服藥，在大賣場工作自覺可以勝任，但近來懷疑組長挑剔她，以咳嗽暗示要她辭職。下列何者為目前最主要的護理問題？", "options": ["服藥問題", "社區民眾的歧視問題", "家庭問題", "症狀困擾問題"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-19", "explanation": "小君能規則服藥且工作勝任，問題在於出現關係意念／被害意念（認為組長以咳嗽暗示她辭職），屬於症狀困擾問題。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 20, "stem": "承上題，有關提供小君的護理措施，下列何者最適當？", "options": ["教導努力增加工作表現", "提高自我價值感", "教導辨識精神症狀及處理", "教導正確服藥的方法"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-20", "explanation": "承上題，護理重點在協助病人辨識自己的精神症狀並學習因應處理方式，才能維持社區生活與工作。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 21, "stem": "李小姐因強迫症住院，今日母親探視時又因李小姐的強迫症狀而有爭執，母親離去後李小姐顯得焦躁不安。下列何種說法最有助於協助病人覺察自己的焦慮與行為間的關聯性？", "options": ["可不可以多告訴我，妳對強迫症的看法？", "沒有人是完美的，妳的強迫症狀是正常的。", "我看到妳在咬指甲和走來走去，妳現在覺得怎麼樣？", "妳很緊張吧，我們來聽音樂消除焦慮。"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-21", "explanation": "描述所觀察到的客觀行為並邀請病人表達感受（「我看到妳在咬指甲和走來走去，妳現在覺得怎麼樣？」），最能協助病人覺察焦慮與行為之間的關聯。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 22, "stem": "根據 DSM-5 診斷準則，有關反社會人格（Antisocial Personality Disorder）的敘述，下列何者最不適當？", "options": ["無法遵從社會規範，經常遊走於法律邊緣", "認為自己很重要，希望他人自動順從自己的意願", "不負責任，無法維持工作或亂開空頭支票", "不知悔恨，合理化對他人造成的傷害"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-22", "explanation": "「認為自己很重要、希望他人自動順從」是自戀型人格的特徵。反社會人格的核心為違反社會規範、不負責任、欺騙與缺乏悔意。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 23, "stem": "有關強迫症病人常使用的防衛機轉，下列何項較不適當？", "options": ["隔離", "反向", "抵消", "內射"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-23", "explanation": "強迫症常用的防衛機轉為隔離、反向、抵消（undoing）與儀式化行為；內射（introjection）較常見於憂鬱症，並非強迫症的典型機轉。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 24, "stem": "下列何種藥物，常用於治療強迫症病人的強迫行為？", "options": ["抗焦慮劑—短效 benzodiazepine，例如 alprazolam（Xanax®）", "抗憂鬱劑—選擇性血清素再回收抑制劑，例如 fluvoxamine（Luvox®）", "中樞神經興奮劑，例如 methylphenidate（Ritalin®）", "抗精神病藥物，例如 aripiprazole（Abilify®）"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-24", "explanation": "強迫症的首選藥物為選擇性血清素再回收抑制劑（SSRI），如 fluvoxamine（Luvox®）、fluoxetine，以及三環抗鬱劑 clomipramine。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 25, "stem": "王先生，診斷為廣泛性焦慮症，住院第一天顯得坐立不安、肌肉緊繃。有關此時會談的重點，下列何者最適當？", "options": ["你以前緊張時都是怎麼處理的？", "是否因為擔心工作的事而引起？", "你和家人相處的狀況如何？", "請你說說你現在覺得怎麼樣？"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-25", "explanation": "病人正處於高度焦慮、坐立不安狀態，會談應聚焦於「此時此刻」的主觀感受（「請你說說你現在覺得怎麼樣？」），高焦慮時不宜探討過去或複雜問題。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 26, "stem": "有關評估假性失智症（pseudodementia）與失智症之臨床差異，下列何者正確？①假性失智症多半有比較清楚的發病時間 ②假性失智症常抱怨認知障礙 ③失智症行為與認知障礙的嚴重度吻合 ④失智症對問話老是回答「不知道」、「忘記了」", "options": ["①③④", "②③④", "①②④", "①②③"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-26", "explanation": "①②③正確：假性失智症（憂鬱引起）發病時間明確、常主動抱怨認知障礙；失智症的行為表現與認知障礙嚴重度相符。④錯誤，常回答「不知道」、「忘記了」者為假性失智症，失智症病人反而傾向虛談掩飾。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 27, "stem": "有關海洛因中毒症狀的敘述，下列何者錯誤？", "options": ["瞳孔放大", "心跳變慢", "昏迷", "呼吸抑制"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-27", "explanation": "海洛因（鴉片類）中毒的典型三徵為瞳孔「縮小」呈針尖狀、意識昏迷與呼吸抑制，並伴隨心跳變慢、血壓下降。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 28, "stem": "有關酒精成癮治療的敘述，下列何者錯誤？", "options": ["以麻醉拮抗劑（naloxone）矯正乙醇引發的意識昏迷狀態", "以 BZD 與 α1-Blockers 藥物治療自主神經系統亢奮症狀", "戒酒發泡錠（disulfiram）可抑制肝臟代謝酒精的過程", "宜合併心理治療"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-28", "explanation": "酒精戒斷的自主神經亢奮症狀主要以 benzodiazepine（BZD）為主，並可搭配 β 阻斷劑或 clonidine，並非 α1 阻斷劑。其餘 naloxone 用於昏迷、disulfiram 抑制乙醛去氫酶、合併心理治療皆正確。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 29, "stem": "有關於精神疾病診斷準則手冊（Diagnostic and statistical manual of mental disorders, DSM-5）對於「認知障礙症」診斷準則之敘述，下列何者正確？", "options": ["病程是慢性而可逆的", "記憶障礙是診斷之基本要件", "一項或多項的認知範疇顯著較先前的認知表現降低", "認知缺損不影響到日常活動獨立進行"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-29", "explanation": "DSM-5 認知障礙症的核心準則是「一項或多項認知範疇顯著較先前表現降低」。其病程多為慢性且不可逆、記憶障礙非必要條件（可為執行功能、語言等）、且重度者會影響日常活動的獨立性。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 30, "stem": "有關注意力不足／過動症（ADHD）的治療原則，下列何者最不適當？", "options": ["安排活動以疏導其過多的活動力", "活動無法持續時應立即終止，以減少挫折", "儘量避免選擇需非常專注的靜態活動", "不宜安排過度攻擊的活動，以防造成傷害"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-30", "explanation": "ADHD 兒童注意力持續時間短，活動無法持續時應調整內容或給予協助以延長參與，「立即終止」反而會加深挫折並強化中斷行為。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 31, "stem": "張先生，80 歲，診斷為阿茲海默症，因情緒激動及焦慮而住院。近日因不明原因發燒、咳嗽有痰不舒服，表示要回家，且對陪同住院媳婦不諒解，故出手打了媳婦一巴掌。下列何者護理措施最適當？", "options": ["立即給予張先生抗精神病針劑藥物", "將張先生帶離現場，協助痰液排出", "告知張先生打人是不被允許的", "將張先生帶入保護室，予以約束"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-31", "explanation": "病人的攻擊行為與發燒、咳嗽有痰等生理不適有關，應優先將其帶離現場以確保雙方安全，並協助痰液排出、處理生理不適，而非先用藥或約束。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 32, "stem": "承上題，張先生懷疑家中地契被媳婦偷。下列何項護理措施最適當？", "options": ["跟張先生澄清：「沒有人會拿您的地契，不用擔心。」", "請媳婦向張先生解釋自己並未拿取地契", "對張先生說：「你最喜歡的戶外散步時間到了，我們一起去戶外散步！」", "請張先生最信任的女兒或兒子到院幫忙安撫"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-32", "explanation": "面對失智症病人的妄想，直接澄清或請當事人解釋皆易引發爭執，最適當的是以病人熟悉且喜歡的活動轉移注意力。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 33, "stem": "有關輕度失智症病人的護理措施，下列何者最適當？", "options": ["活動安排宜每日做變化，以訓練病人的記憶力", "主動協助病人生活照顧，以免增加病人的失能", "安排不同的工作人員照顧病人，以增加病人的定向感", "當病人出現妄想而激躁時，宜適當轉移注意力"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-33", "explanation": "輕度失智症病人出現妄想而激躁時，宜以轉移注意力的方式因應。活動安排應「固定規律」、鼓勵自我照顧、由「固定」照顧者提供服務，才有助於維持定向感與功能。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 34, "stem": "5 歲的小欣被愛上網咖的父母親獨自留在家裡 3 天了，被發現時只有桌上放一瓶水和一些零食。較屬於下列何項家庭暴力？", "options": ["身體虐待（physical abuse）", "疏忽（neglect）", "心理虐待（emotional or psychological abuse）", "管教不當（inappropriate discipline）"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-34", "explanation": "父母未提供 5 歲幼兒必要的照顧、食物與安全監護，屬於疏忽（neglect）。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 35, "stem": "病人跟護理師說：「我好想死！沒有她，我真的活不下去。」下列何項護理措施最適當？", "options": ["告訴病人「拜託，別那麼笨了，就為了一個女人」", "病人現在正在情緒低落時，給他時間獨處冷靜後就會沒事", "告訴病人「失去她，你心裡真不好受，要不要多談一些！」", "這是失戀者常說的話，過一段時間就好了"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-35", "explanation": "面對表達死亡意念的病人，應同理其失落感受並鼓勵進一步表達，同時進一步評估自殺危險性；責備、獨處或輕忽都可能增加風險。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 36, "stem": "照顧精神護理之家的失智症住民，下列何項護理措施最適當？", "options": ["協助發揮其尚存的優勢和能力", "與聽力障礙的住民互動時，只能提高音量、大聲說話", "當住民有視、聽幻覺時，宜忽略此症狀", "避免跌倒發生，不宜安排活動"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-36", "explanation": "失智症照護強調發揮病人「尚存的」優勢與能力以維持功能與自尊。與聽障者互動宜面對面、放慢速度並配合非語言溝通；有幻覺時應評估與同理而非忽略；仍應安排適當活動並做好防跌措施。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 37, "stem": "對保護室內病人採取約束處置時，密切觀察的主要項目，不包含下列何項？", "options": ["是否有娛樂設施", "病人的言行反應", "個人的生理需求", "脈搏及呼吸"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-37", "explanation": "約束期間的密切觀察重點包括生命徵象（脈搏、呼吸）、肢體末梢循環、言行反應及進食、排泄等生理需求；是否有娛樂設施並非約束觀察項目。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 38, "stem": "王小姐，45 歲，體重適中，是居住在社區的思覺失調症病人，因服用抗精神病藥物 clozapine，之後發現有代謝症候群。下列敘述何者最適當？", "options": ["clozapine 出現代謝症候群的症狀，包括嚴重流口水、白血球缺乏等", "立即停藥是控制代謝症候群的最好策略", "應先釐清代謝症候群是遺傳性或非遺傳性", "先測量病人的尿酸做為基準值，有利後續持續追蹤"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-38", "explanation": "clozapine 引起的代謝症候群與遺傳體質及藥物作用皆可能相關，故應先釐清其性質再擬定處置。流口水與白血球缺乏是 clozapine 的副作用但不屬代謝症候群；不可自行立即停藥；代謝症候群的監測指標為腰圍、血糖、血脂與血壓，而非尿酸。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 39, "stem": "承上題，對王小姐因藥物副作用產生的代謝症候群，下列何項護理措施最適當？", "options": ["瞭解 clozapine 產生糖尿病的危險性，只需追蹤服藥後 1 年之空腹血糖即可", "瞭解 clozapine 對尿酸的影響，建議採用低普林飲食", "瞭解流口水是 clozapine 造成的代謝症候群問題之一，建議醫師變更藥物", "瞭解 clozapine 對體重上升的影響，開始服藥後需持續提供病人營養及運動諮詢"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-39", "explanation": "clozapine 最常見的代謝副作用是體重增加，因此自開始服藥即應持續提供營養與運動諮詢並定期監測體重、血糖與血脂，而非只追蹤一年或改以低普林飲食。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 40, "stem": "根據卡普蘭（Caplan, G.）危機理論，當個人常慣用的因應機轉失敗時，個體功能變得紊亂時，此為何項危機理論的分期？", "options": ["衝擊期", "紊亂期", "求助期", "崩潰期"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-40", "explanation": "卡普蘭危機理論分為四期：衝擊期、退縮（紊亂）期、調適期與危機解除期。當慣用因應機轉失敗、個體功能變得紊亂時，即為紊亂期。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 41, "stem": "有關健康融入所有政策（health in all policies）的概念，下列敘述何者正確？", "options": ["強調健康部門推動健康促進的責任", "強調健康部門制訂健康政策的責任", "所有公共政策皆應將健康效益納入考量", "健康部門必須制訂完善周延健康政策"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-41", "explanation": "健康融入所有政策（HiAP）強調健康不只是衛生部門的責任，所有公共政策（交通、教育、住宅、經濟等）在制訂時都應將健康效益與衝擊納入考量。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 42, "stem": "有關社區衛生護理之特性，下列何者正確？①有較高的自主與獨立性 ②個案管理的時間較長 ③工作目標是限制殘障與復健 ④服務層面較廣", "options": ["①②③", "①②④", "①③④", "②③④"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-42", "explanation": "①②④正確：社區衛生護理獨立自主性高、個案管理期間長、服務層面涵蓋個人到社區且較廣。③錯誤，限制殘障與復健屬三段五級中的第二、三段，並非社區衛生護理的主要工作目標。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 43, "stem": "劉小姐，50 歲，其可使用的全民健康保險中的預防保健服務，下列何者正確？①每年一次的成人健康檢查 ②每 3 年一次的成人健康檢查 ③每 2 年一次的婦女子宮頸抹片檢查 ④每 2 年一次的乳房攝影檢查", "options": ["①③", "②③", "①④", "②④"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-43", "explanation": "②④正確：40～64 歲成人預防保健為每 3 年一次；乳房攝影為 45～69 歲每 2 年一次。子宮頸抹片檢查則是 30 歲以上婦女「每年」補助一次，故③錯誤。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 44, "stem": "有關「急性病毒性Ａ型肝炎」的敘述，下列何者錯誤？", "options": ["感染 A 型肝炎病毒後，約 70%～80%會演變成慢性肝炎", "衛生局所接獲轄區內有 A 型肝炎通報病例發生時應即進行訪視", "病人罹病期間需採腸胃道隔離措施", "A 型肝炎疫苗自 107 年起列入本國滿 12 個月以上之幼兒常規接種項目"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-44", "explanation": "A 型肝炎為急性自限性疾病，不會演變成慢性肝炎或帶原（B、C 型才會）。其為糞口傳染，需採腸胃道隔離，且自 107 年起納入幼兒常規接種。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 45, "stem": "下列那一項指標，最能反映一個國家的經濟負擔狀況？", "options": ["依賴指數", "平均餘命", "社會增加率", "孕產婦死亡率"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-45", "explanation": "依賴指數（扶養比）表示每 100 名工作年齡人口需扶養的幼年與老年人口數，最能反映一個國家的經濟負擔狀況。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 46, "stem": "某護理師欲探討罕見病例的危險因子，下列何種研究方法最適當？", "options": ["生態研究法（ecological study）", "世代研究法（cohort study）", "橫斷研究法（cross-sectional study）", "病例對照法（case-control study）"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-46", "explanation": "罕見疾病因發生率低，前瞻性追蹤成本極高，最適合採回溯性的病例對照法（case-control study）來探討危險因子。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 47, "stem": "針對 200 位民眾進行慢性腎臟病篩檢，發現原本有 40 位慢性腎臟病患者經篩檢後 20 位呈陽性，而原本 160 位健康者經篩檢後有 140 位呈陰性，此次篩檢工具的敏感性（sensitivity）為何？", "options": ["20%", "30%", "50%", "87%"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-47", "explanation": "敏感性＝真陽性÷（真陽性＋偽陰性）＝真正病人中被檢出陽性的比例＝20÷40＝50%。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 48, "stem": "有關登革熱的敘述，下列何者錯誤？", "options": ["屬於第二類法定傳染病", "典型登革熱的潛伏期約為 1 至 2 天", "典型臨床症狀有突發性的高燒（≧38℃）", "臺灣病媒蚊主要為埃及斑蚊與白線斑蚊"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-48", "explanation": "典型登革熱的潛伏期約 3～8 天（最長可達 14 天），並非 1 至 2 天。其餘為第二類法定傳染病、突發高燒及病媒蚊為埃及斑蚊與白線斑蚊皆正確。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 49, "stem": "有關結核病的敘述，下列何者錯誤？", "options": ["由結核桿菌引起，為一種慢性傳染病", "在臺灣一年四季都有病例，男性發生率比女性高", "結核病可發生在人體任何器官或組織", "潛伏結核感染者雖無症狀，但具有傳染力"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-49", "explanation": "潛伏結核感染者體內雖有結核菌但未發病，無症狀且「不具傳染力」，僅有活動性肺結核（尤其痰塗片陽性）才會傳染。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 50, "stem": "依據 Anderson 的理論進行社區健康評估時，蒐集垃圾處理狀況，主要是評估社區的那一個系統？", "options": ["教育系統", "安全與交通系統", "物理環境系統", "健康與社會服務系統"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-50", "explanation": "Anderson 社區評估八大次系統中，垃圾處理、空氣、水質、住宅密度等屬於「物理環境系統」。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 51, "stem": "下列何種評價是在計畫執行完成後，用以衡量該計畫的價值？", "options": ["形成性評價（formative evaluation）", "資產評價（asset evaluation）", "過程評價（process evaluation）", "總結性評價（summative evaluation）"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-51", "explanation": "在計畫執行完成後評估其整體成效與價值者為總結性評價（summative evaluation）；形成性與過程評價則是在計畫進行中進行。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 52, "stem": "下列何者為永續經營社區健康營造中心最不需考量的重點？", "options": ["是否由上而下的方式形成的行動", "是否能接受民眾自決與創意的組織文化", "是否發展推動多元性健康生活的策略", "是否歷經民眾自決健康需求的過程"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-52", "explanation": "社區健康營造強調「由下而上」的居民參與與自決，故「是否由上而下的方式形成的行動」最不需（也不應）作為永續經營的考量重點。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 53, "stem": "有關社區資源盤點的功能，下列何者錯誤？", "options": ["掌握社區資源所在", "凝聚社區民眾共識", "檢視重疊的服務項目", "衡量可提供的服務量"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-53", "explanation": "社區資源盤點的功能在於掌握資源分布、檢視重疊或不足的服務項目、衡量可提供的服務量；凝聚民眾共識屬於社區組織與動員的功能，非資源盤點本身。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 54, "stem": "根據世界衛生組織（WHO）對社區的定義，下列何者正確？", "options": ["社區所屬的社會團體通常沒有一定的地理區域", "社區成員彼此認識且互相往來，各有不同的興趣和價值體系", "社區成員共同創造社會規範，行使社會功能", "多數社會功能需與其他社區共同合作才能完成"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-54", "explanation": "WHO 對社區的定義強調社區成員共同創造社會規範並行使社會功能。社區通常有一定地理範圍、成員彼此分享共同的價值與興趣，且多數社會功能可在社區內自行完成。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 55, "stem": "衛生福利部國民健康署透過各類媒體進行大腸癌防治宣導，鼓勵民眾定期做大腸癌篩檢，是屬於下列何種衛生教育方法？", "options": ["價值澄清法", "團體動力法", "示範法", "健康傳銷法"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-55", "explanation": "運用大眾媒體、廣告等行銷手法推廣健康行為（定期篩檢），屬於健康傳銷法（social marketing）。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 56, "stem": "有關衛生福利部國民健康署推動健康識能（health literacy）的狀況，下列敘述何者錯誤？", "options": ["鼓勵健康照護機構致力讓民眾易於獲取與應用健康資訊與服務", "善用 eHealth、新媒體傳播健康資訊，以提升民眾健康識能", "透過社區、學校、職場、醫院等場域以傳播健康識能", "通常民眾健康識能程度越低，對預防保健服務的利用率較高"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-56", "explanation": "研究顯示民眾健康識能程度越低，對預防保健服務的利用率也越「低」，且較難理解與遵循醫療指示，故此敘述錯誤。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 57, "stem": "有關體適能的敘述，下列何者錯誤？", "options": ["心肺適能為評估健康體能項目之一", "體適能分為健康體能（health-related fitness）及競技體能（skill-related fitness）", "任何運動都算是身體活動，但並不是所有的身體活動都可以視為運動", "從事 3 週任何身體活動即可降低大腸癌的發生率"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-57", "explanation": "身體活動須「長期規律」（每週至少 150 分鐘中等強度、持續數月以上）才可能降低大腸癌風險，從事 3 週並不足夠。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 58, "stem": "有關空氣污染的敘述，下列何者正確？", "options": ["使用「無鉛汽油」的汽車就不會造成空氣污染", "空氣中過多的二氧化碳吸收紫外線是造成溫室效應的主因", "硫氧化物與氨氧化物是造成酸雨的主因", "空氣中的一氧化碳是造成臭氧層破洞的主因"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-58", "explanation": "硫氧化物（SOx）與氮氧化物（NOx）溶於水氣形成硫酸與硝酸，是造成酸雨的主因。無鉛汽油仍排放污染物；溫室效應主因是二氧化碳吸收「紅外線」；破壞臭氧層的是氟氯碳化物（CFCs）。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 59, "stem": "有關食品添加物之敘述，下列何者錯誤？", "options": ["硝酸鹽與亞硝酸鹽添加，可抑制肉類肉毒桿菌生長", "防腐劑可抑制和殺死微生物的作用", "添加阿斯巴甜之食物，應標註「苯酮尿症患者」不宜食用", "過氧化氫（H2O2）可添加於魚肉煉製品，但不得殘留"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-59", "explanation": "防腐劑只能「抑制」微生物生長繁殖，並無殺死微生物的作用。其餘亞硝酸鹽抑制肉毒桿菌、阿斯巴甜須標示苯酮尿症警語、過氧化氫不得殘留皆正確。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 60, "stem": "自來水廠淨水工程中採用的曝氣法，主要目的為何？①增加一氧化碳，抑制藻類植物的生長 ②去除水中有害氣體及不良氣味 ③過濾及淨化水質 ④提高 pH 值，以減少水管腐蝕性", "options": ["①③", "①④", "②③", "②④"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-60", "explanation": "②④正確：曝氣法藉由使水與空氣充分接觸，去除水中有害氣體（如硫化氫、二氧化碳）及不良氣味，並提高 pH 值以減少水管腐蝕。①錯誤（應為去除二氧化碳）；③過濾淨化屬過濾程序。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 61, "stem": "當環境噪音達多少分貝以上時，應立即配戴防音的防護具？", "options": ["55 dB", "65 dB", "75 dB", "85 dB"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-61", "explanation": "依職業安全衛生法規，工作場所噪音達 85 分貝以上時，雇主應提供並使勞工確實配戴防音防護具，並實施聽力保護計畫。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 62, "stem": "何小明欲成為無國界醫療人員，其父母雖憂心仍支持他。是屬於 APGAR 家庭功能評估量表中的何種功能？", "options": ["適應度（adaptation）", "成長度（growth）", "情感度（affection）", "融洽度（resolve）"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-62", "explanation": "APGAR 中的成長度（Growth）指家庭成員是否支持彼此在情緒與生理上的成熟與自我實現；父母雖憂心仍支持他追求志向，即為成長度。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 63, "stem": "張老先生患有失智症，因他有隨地大小便，且有誤食之問題。基於安全考量，社區護理師應優先建議家屬使用下列何項措施？", "options": ["將張老先生送至失智症專門照顧機構", "儘量將危險物品收起", "儘量為張老先生包尿片", "訓練張老先生按時如廁"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-63", "explanation": "面對有誤食問題的失智症病人，基於安全考量應優先將危險物品（清潔劑、藥品、小零件等）收起以防中毒或窒息；送機構、包尿片皆非優先且限制過多。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 64, "stem": "依杜瓦爾（Duvall）的家庭發展階段理論，下列敘述何者正確？", "options": ["最後一個孩子小於 30 個月的家庭，為生育期家庭（early childbearing family）", "最後一個孩子介於 2 歲半至 6 歲之間的家庭，為有學齡前兒童家庭（family with preschoolers）", "最後一個孩子 13 歲至獨立時（約 20 歲）的家庭，為有青少年家庭（family with teenagers）", "最後一個孩子獨立離開家至夫妻中有一人退休，為中年期家庭（middle-aged family）"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-64", "explanation": "杜瓦爾家庭發展階段以「最大」的孩子年齡為劃分依據：生育期為最大孩子出生至 30 個月、學齡前期 2.5～6 歲、青少年期 13～20 歲；中年期家庭則自最後一個孩子離家至夫妻之一退休，故 D 正確。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 65, "stem": "有關長期照顧十年計畫 2.0 小規模多機能服務機構發展的目的，下列何者錯誤？", "options": ["發展多元化社區照顧模式", "因地制宜符合社區需求", "落實在地老化目標", "增加老人再就業機會"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-65", "explanation": "小規模多機能服務的目的在發展多元化社區照顧模式、因地制宜滿足社區需求並落實在地老化；增加老人再就業機會並非其設立目的。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 66, "stem": "某公司工作現場環境測定後，報告中出現 8 小時日時量平均容許濃度（time weighted average, TWA）是代表什麼意思？", "options": ["不得使勞工有任何時間超過此濃度的暴露", "任何勞工連續暴露 15 分鐘，不可有無法忍受的刺激或工作效率降低", "勞工累積 1 天的容許暴露濃度", "勞工每天工作 8 小時，一般勞工重複暴露此濃度下，不會發生不良反應"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-66", "explanation": "8 小時日時量平均容許濃度（TWA）指勞工每天工作 8 小時、一般勞工重複暴露於此濃度下，不致引起不良反應的平均濃度。A 為最高容許濃度、B 為短時間時量平均容許濃度（STEL）的概念。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 67, "stem": "有關獨居老人預防跌倒的安全議題，下列何者正確？", "options": ["室內燈光不足是內因性的危險因子", "浴室門口放置活動地毯，擦乾鞋底", "建議家中物品固定擺放", "預防跌倒是屬於三段五級中的第四級"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-67", "explanation": "建議家中物品固定擺放可減少絆倒與尋物跌倒的風險。室內燈光不足屬「外因性」危險因子；浴室門口的活動地毯反而易滑倒；預防跌倒屬三段五級中的第一段第二級（特殊保護）。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 68, "stem": "依據現行勞工健康保護規則，下列何者不是一般勞工健康檢查的必要項目？", "options": ["胸部 X 光檢查", "生活習慣調查", "癌症篩檢", "尿液檢查"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-68", "explanation": "一般勞工健康檢查項目包括既往病史與生活習慣調查、身體檢查、胸部 X 光、血液及尿液常規、血糖血脂等；癌症篩檢並非法定必要項目。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 69, "stem": "下列何者是社區健康營造計畫達到永續經營最重要的措施？", "options": ["種子志工人才培訓", "領導者培訓", "衛生專業人員培訓", "加強中老年衛生講座"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-69", "explanation": "社區健康營造要永續經營，最重要的是培育在地的種子志工人才，使居民能自主持續推動，不因外部經費或專業人員異動而中斷。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 70, "stem": "有關國中學生健康檢查事項之敘述，下列何者正確？", "options": ["學生定期健康檢查可分為 3 個月一次的常規性檢查及 1 年一次的全身健康檢查", "檢查項目中胸、腹部及泌尿生殖系統需家長及學生同意在校檢查，若家長不同意學生在校檢查，則需自行帶學生至醫療院所自費檢查，並將報告交回學校", "學生每學期都需要由護理人員檢查身高、體重與口腔", "對於視力不良、肥胖與氣喘等體格缺點需要進行缺點矯治"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-70", "explanation": "學生健康檢查中，胸部、腹部及泌尿生殖系統屬隱私性檢查，需家長及學生同意才在校檢查；若不同意則自費至醫療院所檢查並將報告交回學校。定期健康檢查為國小一、四年級及國中、高中一年級各一次，並非 3 個月一次。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 71, "stem": "衛生福利部推動職場健康促進的歷程依序為何？①強化職場健康促進計畫 ②推廣職場健康體適能、職場戒菸、戒檳榔和降低體脂肪 ③結合各種資源推行職場健康促進模式 ④健康職場認證", "options": ["①②③④", "②③①④", "③④②①", "④①③②"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-71", "explanation": "衛福部職場健康促進的推動歷程依序為：②推廣職場健康體適能、戒菸戒檳榔與降低體脂肪 → ③結合各種資源推行職場健康促進模式 → ①強化職場健康促進計畫 → ④健康職場認證。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 72, "stem": "有關喘息服務之敘述，下列何者最不適當？", "options": ["喘息服務只在 C 級—巷弄長照站提供", "喘息服務的服務對象是家庭照顧者", "凡經評估為輕度、中度失能服務對象之家庭照顧者，每年最高可獲得 14 天補助", "重度失能服務對象之家庭照顧者，每年最高可獲得 21 天補助"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-72", "explanation": "喘息服務並非只在 C 級巷弄長照站提供，可透過居家、日間照顧、機構等多種形式提供。其服務對象為家庭照顧者，輕中度失能每年最高補助 14 天、重度 21 天。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 73, "stem": "有關衰弱評估量表 SOF（Study of Osteoporotic Fractures frailty index）的敘述，下列何者錯誤？", "options": ["有三項評估項目", "體重減輕（weight loss）：與 1 年前相比體重減少超過 5 公斤以上", "下肢功能（lower extremity function）：無法從椅子不用手扶站起 5 次", "符合二項以上者為衰弱（frail）"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-73", "explanation": "SOF 衰弱評估的體重減輕定義為「1 年內體重減輕 5% 以上」，而非減少 5 公斤以上。其餘三項評估項目、無法從椅子起身 5 次、符合 2 項以上為衰弱皆正確。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 74, "stem": "有關長期照顧的理念與目標，下列何者最不適當？", "options": ["機構化（institutionalization）：服務以機構資源為主、社區資源為輔的原則", "在地老化（aging in place）：儘可能讓服務使用者能安全、舒適地留在家中或生活於熟悉的社區", "整合式服務（integrated care）：同時需要生活照顧、醫事照顧、社會支持、多面向資源組合的服務", "消費者導向（consumer-driven）：強調個別化與人性化的服務，提供所需之協助與支持"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-74", "explanation": "長期照顧的理念強調「去機構化」，以社區與居家資源為主、機構為輔；以機構資源為主的機構化並不符合長照理念與目標。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 75, "stem": "長期照顧十年計畫 2.0 採用 ABC 三級服務，其主要目的為何？", "options": ["減少照顧人力", "節約長期照護成本", "整合與銜接服務資源", "預防長期照護機構過多"], "answer": "C", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-75", "explanation": "長照 2.0 的 ABC 三級（A 社區整合型服務中心、B 複合型服務中心、C 巷弄長照站）主要目的在建立社區整體照顧模式，整合與銜接各項服務資源，使民眾就近取得連續性照顧。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 76, "stem": "社區護理師進行骨質疏鬆症防治的衛生教育內容，下列何者最適當？", "options": ["多攝取乳品、豆製品及深綠色蔬菜以利儲存骨本", "上午 10 點至下午 2 點間塗抹防曬乳，進行日曬，增加維生素 D3 轉化", "儘可能減輕體重，以免增加骨負擔", "多做水中有氧運動，增加骨密度"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-76", "explanation": "骨質疏鬆防治應多攝取乳品、豆製品及深綠色蔬菜以儲存骨本。日曬應避開上午 10 點至下午 2 點且塗抹防曬乳會阻礙維生素 D 合成；過瘦反而增加骨鬆風險；水中運動缺乏負重刺激，效果不如負重運動。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 77, "stem": "獨居的張爺爺罹患氣喘多年，最近因氣喘發作反覆入院，近日出院返家，每週會有居服員到宅服務，社區衛生護理師到家中訪視，下列建議何者最不適當？", "options": ["請居服員每週以攝氏 55 度熱水清洗寢具", "請居服員以濕抹布打掃環境", "建議張爺爺將厚重窗簾移除，改用百葉窗或塑膠板", "建議張爺爺飼養貓或狗等寵物陪伴"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-77", "explanation": "貓狗等寵物的皮屑與毛髮是常見的過敏原，會誘發氣喘發作，不宜建議飼養。其餘高溫熱水清洗寢具、濕抹布擦拭、移除厚重窗簾皆可減少塵蟎與過敏原。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 78, "stem": "有關戒菸的護理指導，下列何者正確？", "options": ["戒菸會有戒斷症候群，是體內尼古丁減少的正常反應", "減少吸菸量，就可以成功戒菸", "使用電子菸替代一般菸品有助戒菸", "所有吸菸者都是戒菸治療服務對象"], "answer": "A", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-78", "explanation": "戒菸初期出現焦躁、失眠、注意力不集中等戒斷症候群，是體內尼古丁濃度下降的正常生理反應。單純減量難以成功戒菸；電子菸未被證實有助戒菸且有健康疑慮；戒菸治療服務有其資格條件並非所有吸菸者皆為對象。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 79, "stem": "以腰圍作為代謝症候群指標之一，是因為腹部肥胖可以推估下列何者之多寡？", "options": ["皮下脂肪", "內臟脂肪", "蛋白質", "肌肉"], "answer": "B", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-79", "explanation": "腰圍反映的是腹腔內堆積的「內臟脂肪」，與胰島素阻抗、代謝症候群及心血管疾病風險密切相關。"}, {"year": "111", "session": "第一次", "subject": "精神科與社區衛生護理學", "num": 80, "stem": "整合性篩檢是現階段政府推動重要的社區中老年防治計畫，下列何者正確？①肺癌、肝癌、乳癌、口腔癌、子宮頸癌是五種癌症的項目 ②早期防治能見效是因慢性病的病因較為單純 ③糖尿病、高血壓與高血脂是慢性病防治重點 ④此項業務隸屬在衛生福利部國民健康署", "options": ["①②", "①④", "②③", "③④"], "answer": "D", "subjectCode": "5104", "subjectShort": "精神社區", "id": "111-1-5104-80", "explanation": "③④正確：糖尿病、高血壓與高血脂為社區慢性病防治重點，且整合性篩檢業務隸屬衛生福利部國民健康署。①錯誤（癌症篩檢項目為大腸癌、口腔癌、乳癌、子宮頸癌及肺癌，非肝癌）；②錯誤，慢性病病因多重且複雜。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 1, "stem": "下列何者主要是由膜（membrane）構成的胞器？", "options": ["核仁", "內質網", "核糖體", "中心粒"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-1", "explanation": "胞器中以膜構成者為內質網（含粗糙與平滑內質網），故選 B。核仁與核糖體主成分為 RNA 與蛋白質、無膜構造；中心粒由微管組成。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 2, "stem": "低血鈣主要會刺激那一個內分泌腺體的激素分泌，以增加血鈣濃度？", "options": ["下視丘", "副甲狀腺", "腦下垂體前葉", "腦下垂體後葉"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-2", "explanation": "血鈣下降會刺激副甲狀腺分泌副甲狀腺素（PTH），促進骨鈣釋出、腎小管再吸收鈣並活化維生素 D，使血鈣上升，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 3, "stem": "內側蹄系（medial lemniscus）與下列何訊息傳遞有關？", "options": ["視覺", "本體覺", "痛覺", "聽覺"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-3", "explanation": "內側蹄系為後索－內側蹄系路徑的一部分，傳遞精細觸覺、震動覺與本體覺，故選 B。痛溫覺走脊視丘路徑，聽覺走外側蹄系。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 4, "stem": "肺臟內進行氣體交換的呼吸膜（respiratory membrane）構造，主要是由那兩種細胞與結締組織共同構成？", "options": ["第一型肺泡細胞（type I alveolar cell）與第二型肺泡細胞（type II alveolar cell）", "第一型肺泡細胞（type I alveolar cell）與微血管內皮細胞（endothelial cell）", "第二型肺泡細胞（type II alveolar cell）與微血管內皮細胞（endothelial cell）", "第二型肺泡細胞（type II alveolar cell）與肺泡內巨噬細胞（alveolar macrophage）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-4", "explanation": "呼吸膜由第一型肺泡細胞、融合的基底膜與微血管內皮細胞構成，故選 B。第二型肺泡細胞負責分泌表面張力素，不參與氣體交換。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 5, "stem": "有關前列腺的敘述，下列何者錯誤？", "options": ["位於膀胱下方", "位於泌尿生殖橫膈上方", "位於直腸後方", "位於精囊下方"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-5", "explanation": "本題選錯誤。前列腺位於膀胱下方、泌尿生殖橫膈上方、精囊下方，且在直腸「前方」而非後方（故臨床可經直腸指診觸摸），故 C 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 6, "stem": "下列支氣管樹的分支，何者具有氣體交換功能？", "options": ["葉支氣管", "節支氣管", "終末細支氣管", "呼吸性細支氣管"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-6", "explanation": "呼吸性細支氣管管壁已出現少量肺泡，是傳導區進入呼吸區的過渡構造，具氣體交換功能，故選 D。終末細支氣管以上皆屬傳導區。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 7, "stem": "下列何者不是淋巴組織？", "options": ["扁桃體", "腮腺", "淋巴結", "胸腺"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-7", "explanation": "腮腺為唾液腺（外分泌腺），並非淋巴組織，故選 B。扁桃體、淋巴結與胸腺皆屬淋巴器官。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 8, "stem": "下列管道何者不開口於右心房？", "options": ["肺靜脈", "冠狀竇", "上腔靜脈", "下腔靜脈"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-8", "explanation": "肺靜脈開口於「左心房」，故選 A。冠狀竇、上腔靜脈與下腔靜脈皆開口於右心房。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 9, "stem": "下列器官的主要養分來源，何者不是來自髂內動脈？", "options": ["卵巢", "子宮", "陰道", "膀胱"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-9", "explanation": "卵巢動脈直接由腹主動脈分出（與睪丸動脈同源），並非髂內動脈分支，故選 A。子宮、陰道與膀胱的血流則來自髂內動脈。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 10, "stem": "卵巢排卵（ovulation）時，卵母細胞（oocyte）的減數分裂（meiosis），停留在那一時期？", "options": ["第一次減數分裂的中期（metaphase of meiosis I）", "第一次減數分裂的末期（telophase of meiosis I）", "第二次減數分裂的中期（metaphase of meiosis II）", "第二次減數分裂的末期（telophase of meiosis II）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-10", "explanation": "排卵時排出的是次級卵母細胞，停留在第二次減數分裂中期，須待受精才完成分裂，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 11, "stem": "下列何者不屬於小腸的一部分？", "options": ["十二指腸", "迴腸", "盲腸", "空腸"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-11", "explanation": "小腸包含十二指腸、空腸與迴腸；盲腸屬大腸的起始部，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 12, "stem": "下列何者位於肝臟尾葉（caudate lobe）的右側？", "options": ["膽囊", "肝門（porta hepatis）", "小網膜", "下腔靜脈"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-12", "explanation": "下腔靜脈緊貼肝臟尾葉的右側走行，故選 D。膽囊位於方葉右側、肝門在尾葉前下方、小網膜連接於肝門與胃小彎。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 13, "stem": "下列何者是位於迴腸最外層之結構？", "options": ["漿膜層", "黏膜層", "黏膜下層", "肌肉層"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-13", "explanation": "迴腸位於腹膜腔內，管壁由內而外為黏膜層、黏膜下層、肌肉層、漿膜層，最外層即漿膜層，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 14, "stem": "下列何者會發出滋養肺臟的支氣管動脈？", "options": ["肺動脈", "肺靜脈", "胸主動脈", "胸內動脈"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-14", "explanation": "支氣管動脈負責滋養肺組織本身，主要由胸主動脈發出，故選 C。肺動脈輸送的是待氣體交換的缺氧血，屬功能性循環。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 15, "stem": "中腦內不具有下列何者？", "options": ["薄核（gracile nucleus）", "紅核（red nucleus）", "網狀結構（reticular formation）", "內側蹄系（medial lemniscus）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-15", "explanation": "薄核位於「延髓」，是後索的中繼核，中腦並不具有，故選 A。中腦含紅核、黑質、網狀結構與上行的內側蹄系。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 16, "stem": "下列何種神經節主要負責傳遞一般體表感覺訊息？", "options": ["翼腭神經節（pterygopalatine ganglion）", "睫狀神經節（ciliary ganglion）", "螺旋神經節（spiral ganglion）", "背根神經節（dorsal root ganglion）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-16", "explanation": "一般體表感覺（觸、痛、溫、本體覺）的初級感覺神經元細胞本體位於背根神經節，故選 D。翼腭與睫狀神經節屬副交感神經節，螺旋神經節傳遞聽覺。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 17, "stem": "碳水化合物（carbohydrate）的碳、氫、氧原子數目的比率是：", "options": ["1：1：1", "1：2：1", "1：3：1", "1：4：1"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-17", "explanation": "碳水化合物通式為 (CH₂O)ₙ，碳、氫、氧比例為 1：2：1，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 18, "stem": "肌肉收縮使用無氧呼吸時，主要使用的能量來源為何？", "options": ["乳酸", "蛋白質", "葡萄糖", "脂肪"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-18", "explanation": "肌肉行無氧呼吸時，主要以葡萄糖（來自肝醣分解）進行糖解作用產生 ATP，故選 C。乳酸是無氧代謝的「產物」而非能量來源。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 19, "stem": "下列何種胺基酸與甘味（umami）的味覺產生有關？", "options": ["甘胺酸（glycine）", "麩胺酸（glutamate）", "酪胺酸（tyrosine）", "色胺酸（tryptophan）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-19", "explanation": "甘味（鮮味，umami）主要由麩胺酸（glutamate）刺激 T1R1/T1R3 受體所產生，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 20, "stem": "下列關於摸到滾燙的熱水，手臂會迅速的收回的敘述，何者錯誤？", "options": ["此反應是由痛的刺激所引起", "此時手臂屈肌收縮", "此反應無需大腦下達命令", "此反應的神經傳導途徑，無需中間神經元"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-20", "explanation": "本題選錯誤。縮回反射屬多突觸的屈肌反射，痛覺傳入後需經脊髓內的中間神經元才轉接至運動神經元，故 D「無需中間神經元」錯誤（單突觸者為牽張反射）。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 21, "stem": "下列何者可協助維生素 D（vitamin D）轉換為骨化三醇（calcitriol）？", "options": ["副甲狀腺素", "降鈣素", "抗利尿激素", "胰島素"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-21", "explanation": "副甲狀腺素可活化腎臟的 1α-羥化酶，將 25-(OH)D₃ 轉換為活性型骨化三醇（1,25-(OH)₂D₃），故選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 22, "stem": "下列何者具有產生配子的功能？", "options": ["卵巢", "輸卵管", "子宮", "子宮頸"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-22", "explanation": "配子（卵子）由卵巢的生殖細胞產生，故選 A。輸卵管為受精與運送場所，子宮供著床，子宮頸為通道。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 23, "stem": "下列由內皮細胞分泌的因子中，何者不會使血管舒張？", "options": ["一氧化氮（NO）", "緩激肽（bradykinin）", "前列腺環素（prostacyclin）", "內皮因子-1（endothelin-1）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-23", "explanation": "內皮因子-1（endothelin-1）是強力的血管「收縮」因子，故選 D。一氧化氮、緩激肽與前列腺環素皆使血管舒張。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 24, "stem": "下列有關微血管及組織液交換的敘述，何者錯誤？", "options": ["組織液的膠體滲透壓比血漿大", "組織液的靜水壓比血漿小", "組織液中葡萄糖與鹽的濃度與血漿相同", "組織液中蛋白質的濃度比血漿低"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-24", "explanation": "本題選錯誤。血漿含大量白蛋白，其膠體滲透壓「大於」組織液，這正是微血管末端回收液體的動力，故 A 敘述錯誤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 25, "stem": "正常成年男子之腎絲球過濾率（glomerular filtration rate）約為多少 mL/min？", "options": ["1250", "125", "12.5", "1.25"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-25", "explanation": "正常成年男性腎絲球過濾率約 125 mL/min（每日約 180 公升），故選 B。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 26, "stem": "下列有關人體缺血性休克後造成排尿量下降的主要原因，何者最不可能？", "options": ["動脈壓下降", "腎素分泌下降", "出球小動脈收縮", "入球小動脈不收縮"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-26", "explanation": "休克時腎素分泌會「增加」（經交感神經與腎灌流下降刺激），以保鈉保水維持血壓，故「腎素分泌下降」最不可能，選 B。動脈壓下降、出球小動脈收縮與入球小動脈無法代償性擴張皆會降低尿量。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 27, "stem": "下列何者不屬於胰臟的外分泌蛋白質？", "options": ["胰島素（insulin）", "胰蛋白酶（trypsin）", "胰乳麋蛋白酶（chymotrypsin）", "胰澱粉酶（pancreatic alpha-amylase）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-27", "explanation": "胰島素由胰島 β 細胞分泌至血液，屬「內分泌」，並非胰臟外分泌的消化酵素，故選 A。胰蛋白酶、胰乳糜蛋白酶與胰澱粉酶皆為外分泌酵素。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 28, "stem": "下列有關色盲（color blindness）的敘述，何者正確？", "options": ["發生於女性的機率遠高於男性", "是與 Y 染色體相關的顯性性狀", "主要肇因於產生太多種錐狀細胞（cone cells）", "主要肇因於視蛋白（opsins）的種類過少"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-28", "explanation": "色盲主因為視錐細胞中視蛋白（opsins）的種類缺失或異常，使可辨識的色彩減少，故選 D。它屬 X 性聯隱性遺傳，男性發生率遠高於女性。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 29, "stem": "下列有關肌節（sarcomere）的明暗帶在肌肉收縮時的敘述，何者正確？", "options": ["I band 縮短、H zone 不變", "H zone 縮短、I band 不變", "I band 及 H zone 皆縮短", "H zone 及 I band 皆不變"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-29", "explanation": "肌肉收縮時肌絲互相滑動，I band 與 H zone 皆縮短，A band 長度不變，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 30, "stem": "下列何種激素在懷孕過程中不會大量增加？", "options": ["人類胎盤泌乳素（hPL）", "催產素（oxytocin）", "雌激素（estrogen）", "泌乳素（prolactin）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-30", "explanation": "催產素在懷孕過程中維持低量，直到分娩發動與哺乳時才大量分泌，故選 B。hPL、雌激素與泌乳素在孕期皆持續大量增加。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 31, "stem": "下列有關人體在高海拔地區之生理調適反應，何者正確？", "options": ["2, 3-雙磷甘油（2, 3-diphosphoglycerate）減少", "肌肉中血管的密度降低", "刺激周邊化學接受器（peripheral chemoreceptor）促進換氣", "腎臟促紅細胞生成素（erythropoietin）分泌降低"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-31", "explanation": "高海拔缺氧會刺激頸動脈體等周邊化學接受器，促進換氣以增加攝氧，故選 C。適應反應還包括 2,3-DPG 增加、肌肉微血管密度增加與紅血球生成素分泌增加。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 32, "stem": "下列有關胃腸道神經反射的受體（receptor）角色，何者錯誤？", "options": ["包括化學感受器、滲透壓感受器和機械感受器", "位於胃腸道管壁上", "將信息傳遞給中樞神經系統或腸道神經叢", "激活前饋路徑（feedforward pathway）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-32", "explanation": "本題選錯誤。胃腸道的受體是偵測管腔內狀態後將訊息傳出，屬「回饋」路徑；前饋路徑（如頭期反射）是在食物尚未到達前即先啟動，並非由這些受體激活，故 D 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 33, "stem": "細胞壞死（Necrosis）時，最早會出現：", "options": ["細胞核濃縮", "細胞核破裂", "細胞核溶解", "胞膜破裂"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-33", "explanation": "細胞壞死的細胞核變化依序為細胞核濃縮（pyknosis）→ 破裂（karyorrhexis）→ 溶解（karyolysis），最早出現者為核濃縮，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 34, "stem": "下列何者最不代表惡性細胞的病理特徵？", "options": ["多型性（pleomorphism）", "細胞核濃染（hyperchromasia）", "異常細胞分裂相（abnormal mitosis）", "核質比下降（nuclear/cytoplasmic ratio decreased）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-34", "explanation": "惡性細胞因細胞核大而細胞質少，核質比應「上升」而非下降，故「核質比下降」最不代表惡性，選 D。多型性、核濃染與異常分裂相皆為惡性特徵。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 35, "stem": "帶狀疱疹病毒（Varicella-Zoster virus）在初次感染人體後，會潛伏在人體何種細胞中？", "options": ["背根神經節的神經元細胞", "骨髓中的造血幹細胞", "皮膚真皮血管的內皮細胞", "皮膚上皮的基底層細胞"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-35", "explanation": "水痘－帶狀疱疹病毒初次感染（水痘）後，會沿感覺神經上行潛伏於背根神經節的神經元，日後再活化即為帶狀疱疹，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 36, "stem": "社區型急性肺炎（community-acquired acute pneumonia）最常由下列何種微生物的感染所引起？", "options": ["黴漿菌（Mycoplasma）", "隱球菌（Cryptococcus）", "鏈球菌（Streptococcus）", "麴菌（Aspergillus）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-36", "explanation": "社區型急性肺炎最常見的病原為肺炎鏈球菌（Streptococcus pneumoniae），故選 C。黴漿菌多引起非典型肺炎，隱球菌與麴菌則見於免疫低下者。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 37, "stem": "Heinz 氏小體是一種氧化的血紅素，下列何種溶血性貧血的紅血球內最常見到 Heinz 氏小體？", "options": ["免疫性溶血性貧血（immunohemolytic anemia）", "地中海型貧血（thalassemia）", "鐮刀血球性貧血（sickle cell anemia）", "葡萄糖-6-磷酸去氫酶缺乏症（glucose-6-phosphate dehydrogenase deficiency）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-37", "explanation": "Heinz 氏小體是氧化變性的血紅素沉積，最常見於葡萄糖-6-磷酸去氫酶（G-6-PD）缺乏症，因紅血球無法對抗氧化壓力，故選 D。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 38, "stem": "下列何種肝炎病毒，只能在 B 型肝炎病毒存在的情況下共同感染？", "options": ["A 型", "C 型", "D 型", "E 型"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-38", "explanation": "D 型肝炎病毒為缺陷病毒，需藉 B 型肝炎病毒的表面抗原（HBsAg）才能組裝，故只在 HBV 存在時共同或重疊感染，選 C。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 39, "stem": "下列那一種腎臟腫瘤主要常見於 10 歲以下的小孩？", "options": ["亮細胞癌（clear cell carcinoma）", "威爾斯氏瘤（Wilms tumor）", "嫌色腎細胞癌（chromophobe renal cell carcinoma）", "乳突狀腎細胞癌（papillary renal cell carcinoma）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-39", "explanation": "威爾斯氏瘤（Wilms tumor，腎母細胞瘤）好發於 10 歲以下（尤其 2～5 歲）兒童，故選 B。亮細胞癌等腎細胞癌屬成人腫瘤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 40, "stem": "子宮頸癌最可能與何者病毒感染有關？", "options": ["人類乳突病毒（HPV）", "疱疹病毒（HSV）", "Epstein-Barr 病毒（EBV）", "巨細胞病毒（CMV）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-40", "explanation": "子宮頸癌與人類乳突病毒（HPV，尤其 16、18 型）持續感染最相關，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 41, "stem": "下列何種腦瘤最常見於小於 5 歲兒童的小腦？", "options": ["寡突細胞瘤（oligodendroglioma）", "室管細胞瘤（ependymoma）", "髓母細胞瘤（medulloblastoma）", "腦膜瘤（meningioma）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-41", "explanation": "髓母細胞瘤好發於 5 歲以下兒童的小腦（尤其蚓部），生長快速並易阻塞第四腦室，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 42, "stem": "肝臟因為慢性右側心臟衰竭發生嚴重充血現象時，肝小葉中心區域出現出血性壞死，稱為：", "options": ["脂肪肝", "荳蔻肝", "肉芽腫", "潰瘍"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-42", "explanation": "慢性右心衰竭造成肝臟被動充血，肝小葉中央區出血性壞死與周邊脂肪變性相間，切面如檳榔（肉豆蔻）花紋，稱荳蔻肝，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 43, "stem": "下列何種免疫性疾病，病人幾乎都是男性？", "options": ["全身性紅斑性狼瘡（SLE）", "迪喬治症候群（DiGeorge syndrome）", "IgA 缺乏症（isolated IgA deficiency）", "布魯頓氏病（Bruton disease）／X-性聯遺傳無伽碼 g 球蛋白血症"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-43", "explanation": "布魯頓氏病（X-性聯無伽瑪球蛋白血症）為 X 性聯隱性遺傳，病人幾乎全為男性，故選 D。SLE 與 IgA 缺乏症女性較多，迪喬治症候群無性別差異。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 44, "stem": "下列那一項因素與波雷特氏食道（Barrett esophagus）發生腺癌（adenocarcinoma）最有關係？", "options": ["上皮細胞的異生程度", "波雷特氏食道的長短", "波雷特氏食道的發炎程度", "有無食道狹窄發生"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-44", "explanation": "波雷特氏食道演變為腺癌的關鍵在於上皮的異生（dysplasia）程度，異生越嚴重風險越高，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 45, "stem": "下列何者與新生兒呼吸窘迫症候群最不相關？", "options": ["致病機轉主要與新生兒體重過大有關", "肺界面活性劑（surfactant）缺乏", "玻璃質膜（hyaline membrane）形成，導致缺氧", "新生兒出現呼吸困難現象"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-45", "explanation": "新生兒呼吸窘迫症候群主因為早產導致表面張力素不足，與「體重過大」無關（體重過大反而與母親糖尿病相關），故最不相關者選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 46, "stem": "下列有關妊娠滋養層疾病（Gestational trophoblastic disease）之敘述，何者錯誤？", "options": ["主要常見有葡萄胎、侵襲性葡萄胎和絨毛膜癌", "絕大多數會製造人類絨毛膜性腺激素（human Chorionic Gonadotropin, hCG）", "完全型葡萄胎是二倍體，而部分型葡萄胎是三倍體", "部分型葡萄胎轉變為絨毛膜癌之機會比完全型葡萄胎高"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-46", "explanation": "本題選錯誤。完全型葡萄胎轉為絨毛膜癌的機會遠高於部分型（約 2～3% 對比極低），故 D 敘述錯誤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 47, "stem": "下列何者不是引起快速進行（新月形）腎小球腎炎[Rapidly progressive（crescentic）glomerulonephritis]的原因？", "options": ["Goodpasture’s 症候群", "全身性紅斑性狼瘡", "鏈球菌感染後腎小球腎炎（Post-streptococcal glomerulonephritis）", "非類固醇抗消炎藥（Non-Steroidal Anti-Inflammatory Drug, NSAID）引起之腎病變"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-47", "explanation": "NSAID 引起的腎病變多為間質性腎炎或微小變化型腎病，並非快速進行性（新月形）腎小球腎炎的原因，故選 D。Goodpasture 症候群、SLE 與鏈球菌感染後腎炎皆可造成新月形腎炎。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 48, "stem": "下列何者是病理性骨折（pathological fracture）？", "options": ["因車禍，只有骨頭折斷，周圍的軟組織未受傷；病理切片檢查並無發現任何潛在病兆", "運動員因長期的活動而造成反覆的骨頭外傷", "因軍人長期行軍造成的趾骨骨折", "因潛在疾病造成的骨折，如轉移性腫瘤、惡性腫瘤等"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-48", "explanation": "病理性骨折指骨骼本身已有潛在病灶（如轉移性腫瘤、骨質疏鬆），受輕微外力即斷裂，故選 D。B、C 屬疲勞性（壓力性）骨折，A 為單純外傷性骨折。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 49, "stem": "Dobutamine 可用於增加急性鬱血性心臟衰竭（congestive heart failure）病人的心輸出量（cardiac output），其作用主要是透過活化下列何種受體而產生？", "options": ["β1 腎上腺素受體（β1 adrenergic receptor）", "β2 腎上腺素受體（β2 adrenergic receptor）", "D1 多巴胺受體（D1 dopaminergic receptor）", "D2 多巴胺受體（D2 dopaminergic receptor）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-49", "explanation": "Dobutamine 主要為 β1 腎上腺素受體致效劑，增強心肌收縮力以提高心輸出量，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 50, "stem": "使用下列何種吸入性麻醉劑，最易引起心律不整（cardiac arrhythmia）之副作用？", "options": ["Desflurane", "Halothane", "Isoflurane", "Sevoflurane"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-50", "explanation": "Halothane 會使心肌對兒茶酚胺敏感性增加，最易誘發心律不整，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 51, "stem": "下列藥物和作用機轉之配對，何者錯誤？", "options": ["Procainamide：阻斷鉀離子通道", "Bretylium：阻斷鉀離子通道", "Propanolol：阻斷腎上腺素 beta 受體", "Quinidine：阻斷鈉離子通道"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-51", "explanation": "本題選錯誤配對。Procainamide 屬 Class IA 抗心律不整藥，主要阻斷「鈉離子」通道（次要延長再極化），故 A 配對錯誤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 52, "stem": "下列藥物中，何者不適用於治療生長激素分泌過多而產生的肢端肥大症？", "options": ["Octreotide", "Bromocriptine", "Corticotropin", "Pegvisomant"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-52", "explanation": "Corticotropin（ACTH）會刺激腎上腺皮質，與抑制生長激素無關，不能治療肢端肥大症，故選 C。Octreotide、Bromocriptine 與生長激素受體拮抗劑 Pegvisomant 皆為適用藥物。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 53, "stem": "下列抗生素中，何者不會作用在細菌的核糖體上？", "options": ["Vancomycin", "Gentamicin", "Erythromycin", "Clindamycin"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-53", "explanation": "Vancomycin 抑制細菌細胞壁的胜肽聚醣合成，不作用於核糖體，故選 A。Gentamicin（30S）、Erythromycin 與 Clindamycin（50S）皆作用於核糖體。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 54, "stem": "藥物在肝臟代謝的第一期（phase I）反應，不包括下列何者？", "options": ["氧化（oxidation）", "水解（hydrolysis）", "結合作用（conjugation）", "羥化（hydroxylation）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-54", "explanation": "結合作用（conjugation，如葡萄糖醛酸化）屬第二期（phase II）反應，故選 C。第一期為氧化、還原、水解與羥化等。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 55, "stem": "Buspirone 治療慢性泛焦慮症，主要透過下列何種受體？", "options": ["多巴胺 1 型（D1）", "血清素 3 型（5-HT3）", "GABAA", "血清素 1A 型（5-HT1A）"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-55", "explanation": "Buspirone 為血清素 5-HT1A 受體的部分致效劑，用於慢性泛焦慮症，故選 D。其優點是無鎮靜與成癮性，但需 1～2 週才顯效。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 56, "stem": "使用左多巴（levodopa）治療帕金森氏症時，不會產生下列何種副作用？", "options": ["厭食", "心搏過慢", "精神疾患", "血壓降低"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-56", "explanation": "左多巴會經周邊代謝為多巴胺並活化 β 受體，造成「心搏過速」與心律不整，而非心搏過慢，故選 B。厭食、噁心、姿位性低血壓與精神症狀皆為其常見副作用。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 57, "stem": "下列有關 aspirin 的作用中，何者所需要的劑量最高？", "options": ["抗發炎", "止痛", "抗凝血", "退燒"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-57", "explanation": "Aspirin 的劑量效應由低至高依序為抗凝血 → 退燒止痛 → 抗發炎，抗發炎所需劑量最高，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 58, "stem": "血管緊縮素轉換酶抑制劑用於治療充血性心衰竭病人，其作用機轉為何？", "options": ["增加血中腎素活性，但不影響心臟纖維化", "減少腎素產生，進而減少心臟纖維化", "減少周邊血管阻抗，促進利尿來降低心臟後負荷", "減少醛固酮（aldosterone）分泌，可降低心臟前負荷"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-58", "explanation": "ACEI 減少血管收縮素 II 生成，使醛固酮分泌下降、鈉水滯留減少，進而降低前負荷（並同時降低後負荷與心臟纖維化），依題目選 D。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 59, "stem": "下列抗高血壓治療藥物，何者不會產生心搏過速之副作用？", "options": ["Amlodipine", "Atenolol", "Prazosin", "Hydralazine"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-59", "explanation": "Atenolol 為選擇性 β1 阻斷劑，會使心跳「變慢」，不會造成反射性心搏過速，故選 B。Amlodipine、Prazosin 與 Hydralazine 因血管擴張皆可引起反射性心搏過速。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 60, "stem": "下列何種藥物具有止吐作用，常合併 metoclopramide 以增強止吐的作用？", "options": ["Loperamide", "Dexamethasone", "Lubiprostone", "Methylcellulose"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-60", "explanation": "Dexamethasone 具止吐作用，臨床上常與 metoclopramide（或 5-HT3 拮抗劑）併用以增強化療止吐效果，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 61, "stem": "下列何種藥物是屬於擬抗膽鹼素性拮抗劑（cholinergic antagonists），當氣喘病人無法忍受擬腎上腺素性作用劑（β2 adrenergic agonists）的作用時，可作為替代品治療氣喘？", "options": ["Cromolyn", "Omalizumab", "Ipratropium", "Theophylline"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-61", "explanation": "Ipratropium 為吸入型抗膽鹼藥物，可阻斷迷走神經引起的支氣管收縮，適用於無法忍受 β2 致效劑者，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 62, "stem": "關於礦物皮質類固醇（mineralocorticoid）的生理及藥理作用，下列何者錯誤？", "options": ["促進鈉離子的再吸收", "促進氯離子的再吸收", "促進鉀離子的再吸收", "促進水的再吸收"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-62", "explanation": "本題選錯誤。礦物皮質類固醇（醛固酮）促進鈉、氯與水的再吸收，但同時促進鉀離子「排泄」而非再吸收，故 C 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 63, "stem": "下列何者可藉由中和 interleukin-1（IL-1），阻斷 IL-1 受體活化所導致的關節發炎疾病？", "options": ["Anakinra", "Infliximab", "Rituximab", "Tofacitinib"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-63", "explanation": "Anakinra 為 IL-1 受體拮抗劑，可阻斷 IL-1 所導致的關節發炎，故選 A。Infliximab 拮抗 TNF-α、Rituximab 針對 CD20、Tofacitinib 抑制 JAK。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 64, "stem": "當前往瘧疾疫區旅行，得知該區疫情已經對 chloroquine 產生抗藥性時，下列何者為最佳預防用藥？", "options": ["Artemisinin", "Mefloquine", "Primaquine", "Pyrimethamine"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-64", "explanation": "前往 chloroquine 抗藥性瘧疾疫區，預防用藥首選 Mefloquine（或 Doxycycline、Atovaquone-proguanil），故選 B。Primaquine 主要用於根除肝內休眠體。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 65, "stem": "在淋巴結的濾泡（follicle）所聚集的細胞，會產生什麼特殊蛋白質？", "options": ["肝素（heparin）", "抗體（antibody）", "穿孔素／顆粒溶解酶（perforin／granzyme）", "纖維分解酶（cellulase）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-65", "explanation": "淋巴結濾泡是 B 淋巴細胞聚集與增殖之處，分化為漿細胞後產生抗體，故選 B。穿孔素／顆粒溶解酶由胞毒性 T 細胞與自然殺手細胞產生。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 66, "stem": "下列關於細胞激素（cytokine）的敘述何者錯誤？", "options": ["具有多效性", "具有協同作用", "具有拮抗作用", "無法誘發其他細胞激素的產生"], "answer": "D", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-66", "explanation": "本題選錯誤。細胞激素具串聯效應，能誘發其他細胞激素的產生（cascade），故 D 敘述錯誤。多效性、協同與拮抗作用皆為其特性。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 67, "stem": "下列對於滅菌作用機制的描述，何者正確？", "options": ["酒精的殺菌作用是破壞細胞膜", "紫外線的殺菌作用是破壞細胞膜", "戊二醛（glutaraldehyde）的殺菌作用是破壞核酸", "石碳酸化合物（例如 Lysol）的殺菌作用是阻礙核酸合成"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-67", "explanation": "酒精藉由使蛋白質變性並溶解脂質而破壞細胞膜，故選 A。紫外線破壞核酸（形成嘧啶二聚體）、戊二醛使蛋白質烷基化、石碳酸類則破壞細胞膜與使蛋白質變性。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 68, "stem": "利用黏試紙（scotch tape test）黏取肛門周邊之蟲卵是用於下列那一種寄生蟲診斷？", "options": ["蟯蟲（Enterobius vermicularis）", "蛔蟲（Ascaris lumbricoides）", "鞭蟲（Trichuris trichiura）", "鉤蟲（Hookworm）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-68", "explanation": "蟯蟲於夜間爬出肛門周圍產卵，故以黏試紙（scotch tape test）於清晨黏取肛門周圍蟲卵作診斷，選 A。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 69, "stem": "絕對厭氧菌不能在有氧環境下生長，是因為缺乏以下何種酵素？", "options": ["觸酶（catalase）和凝固酶（coagulase）", "超氧岐化酶（superoxide dismutase）和觸酶（catalase）", "氧化酶（oxidase）和超氧岐化酶（superoxide dismutase）", "凝固酶（coagulase）和氧化酶（oxidase）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-69", "explanation": "絕對厭氧菌缺乏超氧岐化酶與觸酶，無法清除超氧陰離子與過氧化氫，故在有氧環境會被氧化毒性殺死，選
