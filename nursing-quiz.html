  else if(view==='practice') renderPractice();
  else if(view==='quiz') renderQuiz();
  else if(view==='review') renderReview();
  else if(view==='stats') renderStats();
  renderNav();
  screen.scrollTop=0;
}

/* HOME */
function renderHome(){
  const total=BANK.length, ans=answeredCount(BANK), r=rate(BANK), w=wrongList().length, st=starredList().length;
  let h=`<div class="eyebrow">學習概況</div>
  <div class="stat-row">
    <div class="stat"><div class="n">${ans}<span style="font-size:14px;color:var(--muted)">/${total}</span></div><div class="l">已作答</div></div>
    <div class="stat"><div class="n">${r}<span style="font-size:14px;color:var(--muted)">%</span></div><div class="l">答對率</div></div>
    <div class="stat"><div class="n" style="color:var(--no-ink)">${w}</div><div class="l">錯題數</div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-weight:600"><span>總進度</span><span>${ans}/${total}</span></div>
    <div class="progress"><i style="width:${total?ans/total*100:0}%"></i></div>
  </div>
  <div class="eyebrow">分科練習</div>`;
  SUBJECTS.forEach(s=>{
    const list=bySubject(s.name), a=answeredCount(list), rr=rate(list);
    h+=`<button class="subj" onclick="startSession('${s.name}','seq')">
      <span class="dot" style="background:${s.color}"></span>
      <span class="mid">
        <span class="name">${s.name}</span>
        <span class="sub"><span>${list.length} 題</span><span>已作答 ${a}</span></span>
        <span class="mini-prog"><i style="width:${a/list.length*100}%;background:${s.color}"></i></span>
      </span>
      <span class="rate">${a?rr:'–'}<span>${a?'%':''}</span></span>
    </button>`;
  });
  h+=`<div style="height:6px"></div>
    <button class="btn" onclick="go('practice')">開始練習・自訂篩選</button>`;
  screen.innerHTML=`<div class="fade">${h}</div>`;
}

/* PRACTICE SETUP */
function renderPractice(){
  const st=store.settings;
  let subChips=`<button class="chip ${st.subject==='all'?'on':''}" onclick="setSetting('subject','all')">全部科目</button>`;
  SUBJECTS.forEach(s=> subChips+=`<button class="chip ${st.subject===s.name?'on':''}" onclick="setSetting('subject','${s.name}')">${s.short}</button>`);
  const modes=[['seq','循序'],['random','隨機'],['wrong','只練錯題'],['star','只練不熟']];
  let modeChips=''; modes.forEach(m=> modeChips+=`<button class="chip ${st.mode===m[0]?'on':''}" onclick="setSetting('mode','${m[0]}')">${m[1]}</button>`);
  const list=buildList(st.subject, st.mode);
  screen.innerHTML=`<div class="fade">
    <div class="eyebrow">選擇科目</div><div class="chips">${subChips}</div>
    <div class="eyebrow">出題方式</div><div class="chips">${modeChips}</div>
    <div class="toggle-row" onclick="toggleTimed()">
      <div><div class="tl">⏱ 計時模式</div><div class="td">記錄總作答時間與每題平均，測驗答題速度</div></div>
      <div class="sw ${st.timed?'on':''}"></div>
    </div>
    <div class="card" style="margin-top:14px;text-align:center">
      <div style="font-size:13px;color:var(--muted);letter-spacing:1px">本次題數</div>
      <div style="font-size:34px;font-weight:750;letter-spacing:-1px;margin:2px 0">${list.length}</div>
      <div class="tiny">${st.mode==='wrong'?'從你的錯題中出題':st.mode==='star'?'從標記「不熟」的題目出題':(st.subject==='all'?'涵蓋全部五科':st.subject)}${st.timed?'・計時':''}</div>
    </div>
    <button class="btn" ${list.length?'':'disabled'} onclick="startFromSetup()">開始作答</button>
  </div>`;
}
function setSetting(k,v){ store.settings[k]=v; save(); renderPractice(); }
function toggleTimed(){ store.settings.timed=!store.settings.timed; save(); renderPractice(); }
function buildList(subject, mode){
  let list;
  if(mode==='wrong') list=wrongList();
  else if(mode==='star') list=starredList();
  else list = subject==='all'? BANK.slice() : bySubject(subject);
  if((mode==='wrong'||mode==='star') && subject!=='all') list=list.filter(i=>i.subject===subject);
  if(mode==='random') list=shuffle(list);
  return list;
}
function startFromSetup(){
  const st=store.settings; const list=buildList(st.subject,st.mode);
  if(!list.length) return;
  const s=st.subject==='all'?null:subjByName[st.subject];
  const titles={wrong:'錯題練習',star:'不熟練習'};
  beginSession(list, st.mode, titles[st.mode]||(st.subject==='all'?'綜合練習':st.subject), s?s.color:'var(--accent)', st.timed);
}
function startSession(subjectName, mode){
  const list = buildList(subjectName, mode);
  const s=subjByName[subjectName];
  beginSession(list, mode, subjectName, s.color, store.settings.timed);
}
function beginSession(list, mode, title, color, timed){
  session={list, idx:0, mode, title, color, timed:!!timed, startTime:Date.now(), answers:{}, showExpl:{}, endTime:null};
  view='quiz'; render();
}

/* QUIZ */
function renderQuiz(){
  const {list,idx}=session;
  if(idx>=list.length){ return renderSessionEnd(); }
  const item=list[idx];
  const s=subjByName[item.subject];
  const picked = (item.id in session.answers) ? session.answers[item.id] : null;
  const showResult = picked!=null;
  const starred = !!store.starred[item.id];
  let opts='';
  item.options.forEach((o,i)=>{
    const L=LETTERS[i];
    let cls='opt';
    if(showResult){ cls+=' locked';
      if(isCorrect(item,L)) cls+=' correct';
      else if(picked===L) cls+=' wrong';
    } else if(picked===L) cls+=' picked';
    opts+=`<button class="${cls}" onclick="pick('${L}')"><span class="k">${L}</span><span class="t">${esc(o)}</span></button>`;
  });
  let after='';
  if(showResult){
    const ok=isCorrect(item,picked);
    after+=`<div class="verdict ${ok?'ok':'no'}"><span class="big">${ok?'✓':'✕'}</span>
      <span>${ok?'答對了':'答錯了'}・正確答案 ${item.answer.split('').join('、')}</span></div>`;
    if(item.note) after+=`<div class="note">📌 ${esc(item.note)}</div>`;
    const showE=!!session.showExpl[item.id];
    after+=`<button class="expl-btn" onclick="toggleExpl('${item.id}')">${showE?'▲ 收起解析':'💡 顯示解析'}</button>`;
    if(showE){
      if(item.explanation) after+=`<div class="expl"><div class="eh">解 析</div>${esc(item.explanation)}</div>`;
      else after+=`<div class="expl pending"><div class="eh">解 析</div>此題解析尚未補充。</div>`;
    }
  }
  const last = idx===list.length-1;
  const clock = session.timed?`<span class="clock" id="clock">${fmtTime(Date.now()-session.startTime)}</span>`:'';
  screen.innerHTML=`<div class="fade" data-q="${item.id}">
    <div class="qhead">
      <span class="qtag" style="background:${s.color}">${s.short}</span>
      <span class="qhr">
        ${clock}
        <span class="qcount" onclick="openJump()">${idx+1} / ${list.length}</span>
        <button class="starbtn ${starred?'on':''}" onclick="toggleStar('${item.id}')" title="標記不熟">${starred?'★':'☆'}</button>
      </span>
    </div>
    <div class="qbar"><i style="width:${(idx+1)/list.length*100}%;background:${s.color}"></i></div>
    <div class="stem"><span class="qno">${item.num}.</span>${esc(item.stem)}</div>
    <div class="opts">${opts}</div>
    ${after}
    <div class="qfoot">
      <div style="display:flex;gap:10px;margin-bottom:9px">
        <button class="btn ghost" style="flex:1" onclick="prevQ()" ${idx===0?'disabled':''}>上一題</button>
        <button class="btn" style="flex:1.6;background:${s.color}" onclick="skipNext()">${last?'完成本回':'下一題'}</button>
      </div>
      <button class="btn ghost" onclick="quitQuiz()">退出練習</button>
    </div>
  </div>`;
  if(session.timed) startClock();
}
function pick(L){
  const item=session.list[session.idx];
  if(item.id in session.answers) return;
  session.answers[item.id]=L;
  const ok=isCorrect(item,L);
  const prev=rec(item.id);
  store.records[item.id]={picked:L, correct:ok, attempts:(prev?prev.attempts:0)+1};
  save();
  renderQuiz();
}
function toggleExpl(id){ session.showExpl[id]=!session.showExpl[id]; renderQuiz(); }
function toggleStar(id){
  if(store.starred[id]) delete store.starred[id]; else store.starred[id]=1;
  save();
  if(view==='quiz') renderQuiz(); else renderReview();
}
function next(){ gotoIdx(session.idx+1); }
function skipNext(){ if(session.idx>=session.list.length-1){ renderSessionEnd(); } else gotoIdx(session.idx+1); }
function prevQ(){ if(session.idx>0) gotoIdx(session.idx-1); }
function gotoIdx(i){
  session.idx=Math.max(0,Math.min(i, session.list.length));
  if(session.idx>=session.list.length) renderSessionEnd(); else renderQuiz();
  renderNav();
}
function quitQuiz(){ stopClock(); session=null; view='home'; render(); }

function startClock(){
  if(clockTimer) return;
  clockTimer=setInterval(()=>{
    const el=document.getElementById('clock');
    if(el && session) el.textContent=fmtTime((session.endTime||Date.now())-session.startTime);
  },1000);
}
function stopClock(){ if(clockTimer){clearInterval(clockTimer);clockTimer=null;} }

function renderSessionEnd(){
  stopClock();
  const {list}=session;
  if(!session.endTime) session.endTime=Date.now();
  const a=list.filter(i=>i.id in session.answers).length;
  const c=list.filter(i=>{const p=session.answers[i.id];return p!=null&&isCorrect(i,p)}).length;
  const pct=a?Math.round(c/a*100):0;
  const el=session.endTime-session.startTime;
  const timeBlock = session.timed
    ? `<div class="card" style="max-width:320px;margin:0 auto 16px">
         <div style="display:flex;justify-content:space-around">
           <div style="text-align:center"><div style="font-size:22px;font-weight:750">${fmtTime(el)}</div><div class="tiny">總時間</div></div>
           <div style="text-align:center"><div style="font-size:22px;font-weight:750">${a?Math.round(el/a/1000):0}<span style="font-size:13px">秒</span></div><div class="tiny">每題平均</div></div>
         </div></div>` : '';
  screen.innerHTML=`<div class="fade empty">
    <div class="em">🌿</div>
    <div style="font-size:22px;font-weight:750;color:var(--ink)">本回完成</div>
    <div style="margin:14px 0 18px;font-size:15px;color:var(--ink2)">
      作答 ${a} 題・答對 <b style="color:var(--ok-ink)">${c}</b> 題・正確率 <b>${pct}%</b></div>
    ${timeBlock}
    <div style="display:flex;gap:10px;max-width:320px;margin:0 auto">
      <button class="btn ghost sm" onclick="go('home')">回首頁</button>
      <button class="btn sm" onclick="go('practice')">再練一回</button>
    </div>
  </div>`;
  let f=document.getElementById('fabs'); if(f) f.remove();
  session=null;
}

/* JUMP SHEET */
function openJump(){
  const {list,idx}=session;
  let cells='';
  list.forEach((it,i)=>{
    const p=session.answers[it.id];
    let cls='gcell';
    if(i===idx) cls+=' cur';
    if(p!=null) cls+= isCorrect(it,p)?' ok':' no';
    const st=store.starred[it.id]?'<span class="st">★</span>':'';
    cells+=`<button class="${cls}" onclick="jumpTo(${i})">${it.num}${st}</button>`;
  });
  document.getElementById('modal').innerHTML=`
    <div class="mask" onclick="closeModal(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <h3>跳至題目</h3>
        <div class="hint">點選題號直接前往・顯示原卷題號</div>
        <div class="grid">${cells}</div>
        <div class="legend">
          <span><i style="background:var(--ok)"></i>答對</span>
          <span><i style="background:var(--no)"></i>答錯</span>
          <span><i style="background:var(--card);border:1px solid var(--line)"></i>未作答</span>
          <span style="color:var(--star)">★ 不熟</span>
        </div>
      </div>
    </div>`;
}
function jumpTo(i){ closeModal(); gotoIdx(i); }
function closeModal(e){ if(e&&e.target.closest('.sheet'))return; document.getElementById('modal').innerHTML=''; }

/* REVIEW (錯題本 + 不熟) */
function renderReview(){
  const tab=store.ui.reviewTab;
  const wl=wrongList(), sl=starredList();
  const list = tab==='wrong'?wl:sl;
  let h=`<div class="seg">
    <button class="${tab==='wrong'?'on':''}" onclick="setReviewTab('wrong')">錯題 ${wl.length}</button>
    <button class="${tab==='star'?'on':''}" onclick="setReviewTab('star')">不熟 ${sl.length}</button>
  </div>`;
  if(!list.length){
    h+=`<div class="empty"><div class="em">${tab==='wrong'?'✦':'☆'}</div>
      <div style="font-size:16px;color:var(--ink2);font-weight:600">${tab==='wrong'?'目前沒有錯題':'尚未標記不熟的題目'}</div>
      <div class="tiny" style="margin-top:8px">${tab==='wrong'?'答錯的題目會自動收進這裡':'作答時點右上角 ☆ 即可標記'}</div></div>`;
    screen.innerHTML=`<div class="fade">${h}</div>`; return;
  }
  h+=`<button class="btn" style="margin-bottom:14px" onclick="startReviewSession('${tab}')">開始複習${tab==='wrong'?'錯題':'不熟題'}</button>`;
  list.forEach(i=>{
    const s=subjByName[i.subject]; const r=rec(i.id);
    const meta = tab==='wrong'
      ? `<span class="badge-s" style="background:${s.color}">${s.short}</span><span>你選 ${r?r.picked:'-'}・正解 ${i.answer.split('').join('、')}</span>`
      : `<span class="badge-s" style="background:${s.color}">${s.short}</span><span>第 ${i.num} 題${r?(r.correct?'・已答對':'・曾答錯'):'・未作答'}</span>`;
    h+=`<div class="rev-item">
      <button class="body" onclick="reviewOne('${i.id}')">
        <div class="wq">${i.num}. ${esc(i.stem)}</div>
        <div class="wmeta">${meta}</div>
      </button>
      ${tab==='star'?`<button class="xstar" onclick="toggleStar('${i.id}')" title="取消不熟">★</button>`:''}
    </div>`;
  });
  screen.innerHTML=`<div class="fade">${h}</div>`;
}
function setReviewTab(t){ store.ui.reviewTab=t; save(); renderReview(); renderNav(); }
function startReviewSession(tab){
  const list = tab==='wrong'?wrongList():starredList();
  if(!list.length)return;
  beginSession(shuffle(list), tab==='wrong'?'wrong':'star', tab==='wrong'?'錯題複習':'不熟複習', 'var(--accent)', store.settings.timed);
}
function reviewOne(id){
  const item=BANK.find(i=>i.id===id);
  beginSession([item], 'review', '複習', subjByName[item.subject].color, false);
}

/* STATS */
function renderStats(){
  const total=BANK.length, ans=answeredCount(BANK), c=correctCount(BANK), r=rate(BANK);
  let bars='';
  SUBJECTS.forEach(s=>{
    const list=bySubject(s.name), a=answeredCount(list), rr=rate(list);
    bars+=`<div class="bar-row">
      <div class="bar-name">${s.short}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${a?rr:2}%;background:${s.color}"></div>
        <div class="bar-val">${a?rr+'%':'未作答'}</div>
      </div></div>`;
  });
  screen.innerHTML=`<div class="fade">
    <div class="eyebrow">總覽</div>
    <div class="stat-row">
      <div class="stat"><div class="n">${ans}</div><div class="l">已作答</div></div>
      <div class="stat"><div class="n" style="color:var(--ok-ink)">${c}</div><div class="l">答對</div></div>
      <div class="stat"><div class="n">${r}%</div><div class="l">正確率</div></div>
    </div>
    <div class="section-title">各科表現</div>
    <div class="card bars">${bars}</div>
    <div class="section-title">練習進度</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-weight:600"><span>整體完成度</span><span>${Math.round(ans/total*100)}%</span></div>
      <div class="progress"><i style="width:${ans/total*100}%"></i></div>
      <div class="tiny" style="margin-top:10px">共 ${total} 題・已作答 ${ans} 題・剩餘 ${total-ans} 題・不熟 ${starredList().length} 題</div>
      <div class="tiny" style="margin-top:4px;color:var(--muted)">題庫更新：${BUILD}</div>
    </div>
    <div style="text-align:center;margin-top:24px">
      <span class="link" onclick="resetAll()">清除所有作答紀錄</span>
    </div>
  </div>`;
}
function resetAll(){
  if(confirm('確定要清除全部作答進度、錯題、不熟標記與統計嗎？此動作無法復原。')){
    store.records={}; store.starred={}; save(); render();
  }
}

/* NAV */
function renderNav(){
  const w=wrongList().length;
  const tabs=[
    ['home','首頁', iconHome()],
    ['practice','練習', iconPractice()],
    ['review','複習', iconWrong(), w],
    ['stats','統計', iconStats()],
  ];
  const active = (view==='quiz')
    ? (session&&(session.mode==='wrong'||session.mode==='star'||session.mode==='review')?'review':'practice')
    : view;
  document.getElementById('nav').innerHTML = tabs.map(t=>
    `<button class="${active===t[0]?'on':''}" onclick="go('${t[0]}')">
       <span class="ic">${t[2]}</span>${t[1]}
       ${t[3]?`<span class="badge">${t[3]>99?'99+':t[3]}</span>`:''}
     </button>`).join('');
}
function go(v){ if(v==='quiz')return; stopClock(); view=v; session=null; document.getElementById('modal').innerHTML=''; let f=document.getElementById('fabs'); if(f)f.remove(); render(); }

function esc(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function iconHome(){return svg('<path d="M4 12l8-7 8 7M6 10v9h12v-9"/>')}
function iconPractice(){return svg('<path d="M5 4h14v16l-7-4-7 4z"/>')}
function iconWrong(){return svg('<path d="M12 3l2.5 5 5.5.8-4 4 1 5.5L12 20l-5 2.8 1-5.5-4-4 5.5-.8z"/>')}
function iconStats(){return svg('<path d="M5 20V10M12 20V4M19 20v-7"/>')}
function svg(inner){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`}
