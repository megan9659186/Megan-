 B。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 70, "stem": "下列何者是主要引起敗血症全身性反應的因子？", "options": ["TNF-α", "IL-12", "IL-17", "C-reactive protein"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-70", "explanation": "敗血症的全身性反應主要由 TNF-α 所媒介（內毒素刺激巨噬細胞大量釋出），造成發燒、血管擴張與休克，故選 A。C-反應蛋白僅為急性期反應指標。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 71, "stem": "下列何者是影響自體免疫疾病易感性的主要遺傳因子？", "options": ["CTLA-4（cytotoxic T lymphocyte-associated antigen 4）", "FOXP3（forkhead box P3）", "HLA（human leukocyte antigen）", "AIRE（Autoimmune regulator）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-71", "explanation": "影響自體免疫疾病易感性的最主要遺傳因子為 HLA（人類白血球抗原）基因型，故選 C。CTLA-4、FOXP3、AIRE 亦有影響但非主要。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 72, "stem": "關於肉毒桿菌（Clostridium botulinum）引發食物中毒的敘述，下列何者錯誤？", "options": ["不容易從腸道分離出細菌", "常因自製醃漬或封裝的罐頭食物被污染造成", "病人常因嚴重的發炎反應導致呼吸系統功能降低而死亡", "病人康復後對肉毒桿菌仍然不具有免疫能力"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-72", "explanation": "本題選錯誤。肉毒桿菌毒素阻斷乙醯膽鹼釋放，造成「鬆弛性麻痺」，死因為呼吸肌麻痺而非嚴重發炎反應，故 C 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 73, "stem": "關於萊姆病（Lyme disease）的敘述，下列何者錯誤？", "options": ["被節肢動物叮咬後引發", "患者出現全身性丘疹的臨床症狀", "若未依照程序治療，患者有可能引發關節炎", "血清學測試可做為檢驗依據"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-73", "explanation": "本題選錯誤。萊姆病早期典型皮膚表現為叮咬處的靶心狀「遊走性紅斑」，而非全身性丘疹，故 B 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 74, "stem": "下列關於痘病毒（poxvirus）的敘述，何者錯誤？", "options": ["天花病毒（Smallpox Virus）雖然目前在自然界已經絕跡，但仍有被使用作為生化武器之風險", "天花病毒與傳染性軟疣病毒（Molluscum Contagiosum Virus）都只會感染人類", "痘病毒是 DNA 病毒，所以病毒的複製是在細胞核內進行", "很多動物痘病毒與天花病毒具有共通的抗原性，所以可以用動物痘病毒來製備天花病毒疫苗"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-74", "explanation": "本題選錯誤。痘病毒雖為 DNA 病毒，卻是少數在「細胞質」內完成複製者（自備轉錄酶），故 C 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 75, "stem": "下列那一種細菌與引起非典型肺炎（atypical pneumonia）較為無關？", "options": ["李斯特菌（Listeria monocytogenes）", "肺炎黴漿菌（Mycoplasma pneumoniae）", "退伍軍人桿菌（Legionella pneumophila）", "肺炎披衣菌（Chlamydophila pneumoniae）"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-75", "explanation": "李斯特菌主要引起腦膜炎與新生兒／免疫低下者的敗血症，與非典型肺炎較無關，故選 A。黴漿菌、退伍軍人桿菌與披衣菌皆為非典型肺炎病原。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 76, "stem": "下列關於黴漿菌（Mycoplasma）的敘述，何者錯誤？", "options": ["無法於體外自由生長（free-living），是絕對細胞內寄生的細菌", "細菌無細胞壁", "培養時需要添加固醇（sterol）", "細菌菌體小，可通過 0.45 μm 的濾膜"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-76", "explanation": "本題選錯誤。黴漿菌可在含固醇的人工培養基上自由生長，並非絕對細胞內寄生菌，故 A 錯誤。其無細胞壁、菌體極小可通過 0.45 μm 濾膜。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 77, "stem": "補體活化後最終形成膜攻擊複合體（membrane attack complex, MAC）。下列何者較易受到這項防禦機制的作用而死亡？", "options": ["B 型肝炎病毒（Hepatitis B virus）", "奈瑟氏菌（Neisseria）", "葡萄球菌（Staphylococcus）", "鏈球菌（Streptococcus）"], "answer": "B", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-77", "explanation": "奈瑟氏菌屬革蘭氏陰性雙球菌，外膜較薄且缺乏厚細胞壁保護，最易被膜攻擊複合體（MAC）溶解，故選 B（補體末端成分缺乏者易反覆奈瑟氏菌感染）。革蘭氏陽性菌有厚細胞壁可抵抗 MAC。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 78, "stem": "下列何種病毒會造成潛伏感染（latent infection），病毒會潛伏在神經節的神經細胞中？", "options": ["EB 病毒（Epstein-Barr Virus, EBV）", "巨細胞病毒（Cytomegalovirus, CMV）", "單純疱疹病毒（Herpes Simplex Virus）", "日本腦炎病毒（Japanese Encephalitis Virus）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-78", "explanation": "單純疱疹病毒會潛伏於感覺神經節（如三叉神經節、薦神經節）的神經細胞內，故選 C。EBV 潛伏於 B 細胞，CMV 潛伏於單核球與腺體細胞。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 79, "stem": "下列有關登革熱病毒的敘述，何者錯誤？", "options": ["只有一種血清型", "可藉由埃及斑蚊傳播", "病患若發生多次感染，發生重症的機率會增加", "嚴重的登革熱病症會有出血與休克"], "answer": "A", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-79", "explanation": "本題選錯誤。登革熱病毒有四種血清型（DENV-1～4），故 A 錯誤；也因不同型別再感染會產生抗體依賴性增強作用而提高重症風險。"}, {"year": "111", "session": "第一次", "subject": "基礎醫學", "num": 80, "stem": "宿主細胞的何種機轉必為病毒所用？", "options": ["RNA 剪接（RNA splicing）", "轉錄（transcription）", "轉譯（translation）", "轉導（transduction）"], "answer": "C", "subjectCode": "1104", "subjectShort": "基礎醫學", "id": "111-1-1104-80", "explanation": "病毒本身沒有核糖體，蛋白質合成必須完全依賴宿主細胞的轉譯機制，故選 C。RNA 剪接與轉錄並非所有病毒都需要（如部分 RNA 病毒自備複製酶），轉導則是細菌基因轉移方式。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 1, "stem": "Maslow 的需要階層理論中，最高層級的需要為何？", "options": ["自我實現", "愛及歸屬感", "自尊", "安全與安全感"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-1", "explanation": "Maslow 需要階層由低至高為生理、安全、愛與歸屬、自尊、自我實現，最高層級為自我實現，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 2, "stem": "有關與護理人員相關的法律問題，下列敘述何者錯誤？", "options": ["未實際測量血壓而依過去的數值做成紀錄，護理人員將有法律責任", "有自殺傾向的病人以病房內延長線自殺以致成為植物人，護理人員有怠忽職守", "一般醫療處置時，護理人員不經病人同意即可進行抽血檢查，以維護病人健康", "管制藥品只能在醫師的指示下使用，若擅自攜帶出去將有違法之虞"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-2", "explanation": "本題選錯誤。任何醫療處置（含抽血）皆須先取得病人同意，不得以「維護健康」為由逕行執行，違反知情同意原則，故 C 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 3, "stem": "護理師舖床協助病人執行移位時，下列原則何者正確？", "options": ["儘量使用「滑動」的方式移動病人，以節省體力", "儘可能使用小肌肉，如：背肌比臀肌佳，減少肌肉疲勞", "站立時，應縮小底面積，以減少身體移動範圍", "以彎曲腰部的方式，調整工作高度，以降低重心"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-3", "explanation": "移位時以「滑動」取代抬起可減少施力、節省體力並保護病人皮膚，故選 A。應使用大肌肉群（臀肌優於背肌）、擴大底面積以求穩定、屈膝而非彎腰來降低重心。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 4, "stem": "有關外科無菌的定義，下列敘述何者正確？", "options": ["屬於清潔的技術之一", "可以處理病人與病人間的交互感染", "用來確保無菌物品維持在無菌狀態", "常運用在傳染病人的隔離防治"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-4", "explanation": "外科無菌（surgical asepsis）目的在確保無菌物品維持絕對無菌狀態，故選 C。它屬無菌而非清潔技術；處理交互感染與隔離防治屬內科無菌範疇。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 5, "stem": "關於滅菌法之敘述，下列何者正確？", "options": ["高壓滅菌法屬於物理滅菌法，使用條件為每平方吋壓力 10～12 磅，達到 90～110℃的水蒸氣", "2%戊二醛（Cidex）或 6～10%過氧化氫（H2O2）可以適用於內視鏡或呼吸治療器材的消毒", "濕熱滅菌法較乾熱滅菌法傳導效果差，故使用的溫度需較高才能達到滅菌效果", "紫外線消毒法穿透力佳，可以有效殺滅細菌芽胞，屬於物理滅菌方式"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-5", "explanation": "2% 戊二醛（Cidex）或 6～10% 過氧化氫適用於不耐高溫的內視鏡與呼吸治療器材消毒，故選 B。高壓蒸氣需 15 磅、121℃；濕熱傳導效果優於乾熱，故所需溫度較低；紫外線穿透力差且無法有效殺滅芽胞。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 6, "stem": "下列何者不屬於內科無菌的技術？", "options": ["洗手", "傷口換藥", "戴口罩", "隔離技術"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-6", "explanation": "傷口換藥須維持無菌敷料與傷口的無菌狀態，屬「外科無菌」技術，故選 B。洗手、戴口罩與隔離技術皆屬內科無菌。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 7, "stem": "下列何者不是主觀症狀（subjective symptom）？", "options": ["全身發癢", "口渴", "陳施氏呼吸", "心悸"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-7", "explanation": "陳施氏呼吸（Cheyne-Stokes respiration）是護理人員觀察所得的徵象，屬客觀資料，故選 C。發癢、口渴與心悸皆為病人主訴的主觀症狀。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 8, "stem": "王先生進行全喉切除手術，術後僅能以書寫溝通。王先生多次以書寫方式溝通，護理師皆無法了解，王先生於是無奈地向護理師擺擺手，轉頭留下眼淚。依據伯儂（Berlo）溝通模式，下列敘述何者正確？", "options": ["王先生訊息傳遞的途徑為書寫，是一種語言溝通", "王先生與護理師之間是為父母式（parent）與兒童式（child）之互補溝通模式", "王先生與護理師之間是 parent-adult-child 理論的交錯溝通模式", "情境中因王先生無法言語，此溝通過程中缺乏訊息的回饋與反應"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-8", "explanation": "書寫屬於語言溝通（使用文字符號）的一種，只是管道由口語改為文字，故選 A。題幹情境中王先生確有回饋（擺手、流淚），且未提及父母－兒童式的溝通型態。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 9, "stem": "護理人員執行治療後於紀錄中寫下：「10：00 協助病人翻身，發現腳跟破皮傷口，給予傷口換藥」，此護理紀錄未遵守下列何項原則？", "options": ["準確性", "扼要性", "時效性", "組織性"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-9", "explanation": "紀錄僅寫「腳跟破皮傷口」而未描述傷口大小、部位、性質與換藥內容，缺乏具體事實，違反紀錄的準確性原則，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 10, "stem": "醫囑 Demeral 10 mg I.V. drip St.之含意，下列敘述何者正確？", "options": ["需要時給予，由靜脈直接推注", "需要時給予，由靜脈滴注", "立即給予，由靜脈直接推注", "立即給予，由靜脈滴注"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-10", "explanation": "I.V. drip 為靜脈「滴注」，St.（stat）為立即給予，故選 D。靜脈直接推注應寫 I.V. push／I.V.；需要時給予則為 p.r.n.。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 11, "stem": "一位剛入院且預計明日要進行乳房切除手術的王太太，哭著向護理師表示：「我好害怕，明天可以不要手術嗎？」下列何項敘述最符合同理心的回應？", "options": ["可以跟我說您在害怕些什麼事情嗎？", "要我打電話給主治醫師，跟您談談嗎？", "不用害怕，醫師技術高明，沒問題", "我了解您的害怕，我跟醫師說取消明天開刀"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-11", "explanation": "同理心的回應是引導病人說出並澄清自身感受，故「可以跟我說您在害怕些什麼事情嗎？」最適當，選 A。B 為轉介、C 為虛假保證、D 為無法兌現的承諾。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 12, "stem": "盧女士行乳房切除術，乏人照料，護理人員親自為其進行床上沐浴時，蒐集到下列資料，何者屬於急性疼痛的主觀資料？", "options": ["病人幾乎採平躺，不敢翻身", "病人左前胸有一 5×8 公分傷口", "病人表情皺眉害怕的樣子", "病人表示我好痛好不舒服"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-12", "explanation": "主觀資料為病人自述，「我好痛好不舒服」即為急性疼痛的主觀資料，故選 D。平躺不敢翻身、傷口大小與皺眉表情皆屬護理人員觀察所得的客觀資料。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 13, "stem": "林先生因腹部手術後傷口疼痛，10 分疼痛量表評估為 5 分。護理師依據醫囑給予止痛劑 Acetaminophen（500 mg）1# P.O.，此項活動屬於下列何項護理功能？", "options": ["非獨立性護理功能", "獨立性護理功能", "協同性護理功能", "功能性護理功能"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-13", "explanation": "依醫囑給藥屬需醫師處方才能執行的措施，為非獨立性（依賴性）護理功能，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 14, "stem": "下列那些屬於主觀資料？ ①家屬描述「他說肚子痛，一直皺眉頭」 ②護生說「病人說他呼吸會喘」 ③護理師觀察到病人解黑便 ④病人血紅素值為 8.8 mg/dL", "options": ["①②", "③④", "①③", "②④"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-14", "explanation": "主觀資料為個案主訴或轉述其陳述：①家屬轉述「他說肚子痛」、②護生轉述「病人說呼吸會喘」，故選 A（①②）。解黑便為觀察所得、血紅素值為檢驗數據，皆屬客觀資料。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 15, "stem": "有關床邊給藥電子化作業流程之敘述，下列何者正確？", "options": ["可縮短護理人員給藥繁瑣步驟，減少護理人員三讀五對的給藥程序", "刷病人條碼後，電腦出現藥物視窗時，檢視藥物醫囑無誤，就可給藥", "電腦出現藥物視窗，刷藥品上的條碼後，需確認藥物資訊是否符合", "給完藥後，必需按儲存選項，系統即會自動記錄時間與醫師姓名"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-15", "explanation": "床邊給藥電子化仍須在刷讀藥品條碼後確認藥物資訊是否相符，故選 C。它不能取代三讀五對；僅檢視醫囑無誤仍不可給藥；系統記錄的是給藥時間與「護理人員」姓名。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 16, "stem": "有關口服藥物給予方式，下列何者正確？ ①服用輕瀉劑應減少水分攝取 ②止吐劑應在飯後立即服用 ③鹽類緩瀉劑可與冬瓜茶一起服用 ④咳嗽糖漿避免與水共服", "options": ["①②", "①③", "②④", "③④"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-16", "explanation": "咳嗽糖漿服用後應停留於咽喉發揮局部作用，故避免與水共服（服後 15～30 分鐘內勿喝水），④正確；③鹽類緩瀉劑可與冬瓜茶等飲品併服以增加口感與水分，依公告答案選 D（③④）。輕瀉劑應「增加」水分攝取，止吐劑應在飯前給予。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 17, "stem": "張先生為癌末病人，醫囑開立 Fentanyl 止痛貼片使用，給予藥物指導時，下列敘述何者正確？", "options": ["建議黏貼疼痛部位效果最好", "貼上皮膚後，以手掌緊壓貼片 30 秒", "每次更換新貼片，應貼在同一部位", "建議可泡熱水澡，提升藥物效果"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-17", "explanation": "Fentanyl 貼片貼上後應以手掌緊壓約 30 秒使其貼合，故選 B。應貼於軀幹或上臂平坦少毛處而非疼痛部位；每次更換須輪換部位；泡熱水澡會加速吸收造成過量，須避免。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 18, "stem": "有關給藥方法敘述，下列何者錯誤？", "options": ["協助 6 歲兒童耳藥滴入時，耳廓要向上向後拉", "透析當日，病人於透析前暫停服用降血壓藥物", "Biscodyl（Dulcolax®）tablet 應咬碎服用以促進腸道吸收", "眼藥水瓶口距眼球上約 1～2 公分，將藥滴於結膜下穹窿處"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-18", "explanation": "本題選錯誤。Bisacodyl（Dulcolax®）為腸溶錠，須整顆吞服，咬碎會破壞腸衣造成胃部刺激並降低藥效，故 C 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 19, "stem": "高先生為第 2 型糖尿病病人，醫囑「RI 8 I.U. S.C. t.i.d. a.c.」，下列敘述何者錯誤？", "options": ["1 天給藥 3 次", "飯前 30 分鐘給藥", "藥物注入至肌肉層", "注射後可輕壓注射部位"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-19", "explanation": "本題選錯誤。RI 8 I.U. S.C. 為「皮下」注射，並非注入肌肉層，故 C 錯誤。t.i.d. a.c. 即一天三次、飯前給藥。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 20, "stem": "吳先生因骨折手術主訴傷口疼痛，醫囑開立 Pethidine 50 mg I.M. p.r.n. q.4.h.，下列處置何者正確？", "options": ["每天 4 次給予 Pethidine 50 mg 靜脈注射", "需要時，每 4 小時給予 Pethidine 50 mg 靜脈注射", "每天 4 次給予 Pethidine 50 mg 肌肉注射", "需要時，每 4 小時給予 Pethidine 50 mg 肌肉注射"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-20", "explanation": "p.r.n. 為需要時給予、q.4.h. 為每 4 小時、I.M. 為肌肉注射，故正確處置為「需要時，每 4 小時給予 Pethidine 50 mg 肌肉注射」，選 D。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 21, "stem": "醫囑「Digoxin 125 mcg P.O. q.d.」，Digoxin 錠劑每顆的劑量為 0.25 mg，給藥時護理師應發給此病人多少顆 Digoxin？", "options": ["半顆", "1 顆", "2 顆", "5 顆"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-21", "explanation": "醫囑 125 mcg＝0.125 mg，每顆 0.25 mg，0.125 ÷ 0.25 ＝ 0.5，應給半顆，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 22, "stem": "周先生，醫囑：D5W 80 mL/hour IVF，使用精密輸液套管（60 gtts/mL）滴注，早上 9 點護理師給予周先生更換一瓶新的 500 mL D5W 溶液，下列敘述何者正確？", "options": ["點滴流速應調在 60 gtts/min", "下次更換點滴的時間約為 3：15 PM", "周先生的一天輸液總量為 1440 mL", "1 PM 時，瓶中點滴剩餘量應為 250 mL"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-22", "explanation": "9 AM 換上 500 mL、以 80 mL/hr 滴注，500 ÷ 80 ＝ 6.25 小時（6 小時 15 分），下次更換約在 3：15 PM，故選 B。精密輸液套（60 gtts/mL）流速應為 80 gtts/min；一天總量為 80×24＝1920 mL；1 PM 已輸入 320 mL，餘 180 mL。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 23, "stem": "若病人手臂靜脈不明顯且不易穿刺，可以採取下列那些措施以擴張血管？", "options": ["用力拍打欲穿刺的部位，促使抗組織胺分泌", "給予欲穿刺手臂部位局部濕熱敷", "抬高欲穿刺部位之肢體高於心臟", "請個案不要緊張、深呼吸，放鬆手掌"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-23", "explanation": "局部濕熱敷可使血管擴張、靜脈怒張而利於穿刺，故選 B。用力拍打會造成組織損傷；抬高肢體反而使靜脈回流、血管更不明顯；應請個案握拳而非放鬆手掌。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 24, "stem": "李先生體重 60 公斤，輸血醫囑「Blood transfusion PRBC（packed RBC）2 units」，輸血開始 15 分鐘後，出現頭痛、寒顫、發燒、呼吸困難、低血壓等症狀，此時護理師在通知醫師之前，最優先的處理為何？", "options": ["立即停止輸血，以生理鹽水維持靜脈通暢", "調慢滴速，測量生命徵象", "抽血做血液培養", "調高病人床頭，給予氧氣"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-24", "explanation": "輸血後 15 分鐘出現寒顫、發燒、呼吸困難與低血壓，屬急性輸血反應，最優先應立即停止輸血並改以生理食鹽水維持靜脈通暢，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 25, "stem": "有關用熱治療所產生全身性反應的敘述，下列何者正確？ ①血壓上升 ②頭暈 ③呼吸變慢 ④脈搏加速", "options": ["①②", "①③", "②④", "③④"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-25", "explanation": "用熱的全身性反應為周邊血管擴張，導致血壓下降、②頭暈，並反射性使④脈搏加速、呼吸加快，故選 C（②④）。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 26, "stem": "病人沐浴後因寒顫而使用烤燈，下列何者正確？", "options": ["此法運用蒸發原理提供熱源", "使用過程中，隨時保持皮膚濕潤", "使用 60 W 燈泡，距離病人 18～24 吋", "使用時間以 15～20 分鐘為宜"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-26", "explanation": "烤燈使用時間以 15～20 分鐘為宜，故選 D。其運用「輻射」原理供熱；使用中應保持皮膚乾燥；一般以 25～40 W 燈泡距離 45～60 公分（60 W 者距離更遠）。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 27, "stem": "針對冷敷應用的描述，下列何者錯誤？", "options": ["冰領常用在甲狀腺手術傷口，以傳導方式降溫促進止血", "心臟手術使用低溫毯時，墊上絨布可增加冷的傳導效果", "執行溫水拭浴時，為了避免腦部充血可於頭部置放冰枕", "冰敷時不宜直接接觸皮膚，需要使用布類包裹後才使用"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-27", "explanation": "本題選錯誤。低溫毯上加墊絨布會形成隔絕層，反而「降低」冷的傳導效果，故 B 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 28, "stem": "古先生，腳踝扭傷，護理師給予冷敷其腳踝。30 分鐘後，古先生主訴其肢體出現發紅的現象，此現象是屬於何種效應？", "options": ["反彈現象", "溫度的適應性", "遠處效應", "交感性反應"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-28", "explanation": "冷敷持續超過 30～60 分鐘後，身體為避免組織凍傷而引發血管反射性擴張、皮膚發紅，稱為反彈現象（rebound phenomenon），故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 29, "stem": "吳老先生住院多日未解便，醫囑給予意福灌腸液（EVAC enema）行小量灌腸，下列敘述何者正確？", "options": ["灌腸時病人採右側臥，並請其哈氣放輕鬆", "灌腸器頂端與肛管之接合處，需以凡士林潤滑", "灌腸器頂端軟管塞入肛門之深度為 7.5～10 cm", "灌腸中，病人出現痙攣腹痛，請其忍耐直到溶液灌完為止"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-29", "explanation": "成人小量灌腸時，肛管插入肛門的深度約 7.5～10 公分，故選 C。灌腸應採「左」側臥以順應乙狀結腸走向；潤滑劑應塗於肛管前端；出現痙攣腹痛時應暫停並降低灌腸筒高度。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 30, "stem": "放置存留導尿管的病人需收集尿液檢體進行細菌培養（urine culture），收集方式之敘述下列何者正確？", "options": ["以無菌空針從導尿管橡皮接頭處消毒後抽取尿液", "自蓄尿袋開口流出一段尿液後，再收集檢體", "將導尿管及蓄尿袋分開，由接口處收集尿液", "拔掉存留導尿管，收集病人自解之中段尿"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-30", "explanation": "存留導尿管採尿液培養時，應消毒導尿管的橡皮採檢端後以無菌空針抽取，故選 A。由蓄尿袋取樣或拆開接口皆會造成污染，也不應為採檢而拔除導尿管。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 31, "stem": "有關糞便特性之敘述，下列何者錯誤？", "options": ["糞便質地呈現鬆軟狀、水狀，可能原因為腸蠕動增加", "糞便質地呈現乾、硬，可能原因為脫水或腸蠕動減慢", "糞便呈現潛血反應，可能原因為大腸腫瘤", "糞便形狀呈現扁平、鉛筆型或細線狀為正常"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-31", "explanation": "本題選錯誤。糞便呈扁平、鉛筆狀或細線狀，提示腸道狹窄或腫瘤壓迫，屬異常而非正常，故 D 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 32, "stem": "腸道內視鏡檢查之注意事項，下列何者正確？", "options": ["檢查前 3 天起採全流質飲食", "檢查前需服用瀉劑或執行清潔灌腸", "檢查時，採右側臥或膝胸臥式", "檢查後，必須絕對臥床休息 6 小時"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-32", "explanation": "腸道內視鏡檢查前須服用瀉劑或執行清潔灌腸以清空腸道，故選 B。檢查前 1～3 天採低渣或清流質飲食；檢查時採「左」側臥；檢查後可視情況休息，不需絕對臥床 6 小時。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 33, "stem": "利用圓滾木翻身法協助病患翻向右側，下列敘述何者錯誤？", "options": ["常用於協助脊椎病人術後改變姿位", "翻身時應保持病人身體脊椎平直", "可利用翻身單以協助病人翻身", "應於病人兩腳的膝膕處放置枕頭"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-33", "explanation": "本題選錯誤。圓滾木翻身法是讓身體如圓木般整體轉動，枕頭應置於「兩腿之間」以維持脊椎與下肢一直線；於兩腳膝膕處放置枕頭並非此法要點，故 D 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 34, "stem": "林女士，乳癌合併肺部、腦部轉移，因為意識不清，無法自我照顧，今早護理師評估口腔時，發現口頰內右側有白色斑點無法清洗掉、左下側則有潰瘍，清洗時會有皺眉，應與醫師討論下列何種處方協助口腔護理？", "options": ["Epinephrine（Bosmin）+ Chlorhexidine", "L-Glutamine + Dobell’s solution", "Xylocaine + Nystatin（Mycostatin）", "L-Glutamine + Difflam"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-34", "explanation": "口頰白色斑點無法清除提示念珠菌感染，需 Nystatin 抗黴菌；潰瘍清洗時疼痛皺眉則需 Xylocaine 局部麻醉止痛，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 35, "stem": "有關協助病人採辛氏臥姿（Sim’s Position）之敘述，下列何者錯誤？", "options": ["適用於肛門檢查的病人", "肩膀皮膚是容易受壓的部位", "可以加強背部肌肉張力", "又稱 3/4 俯臥姿"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-35", "explanation": "本題選錯誤。辛氏臥姿（3/4 俯臥姿）用於肛門檢查與灌腸，受壓部位包括肩膀、髂骨與膝部；它並不具有加強背部肌肉張力的作用，故 C 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 36, "stem": "有關協助病人翻身擺位之注意事項，下列何者正確？", "options": ["膝膕處可用軟枕墊高，以預防受壓", "頭頸部與脊柱應呈 15º 的擺位，以維持穩定", "使用足托板時應保持足背側伸展", "仰臥時，可用粗隆捲軸預防髖關節外旋"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-36", "explanation": "仰臥時可於大轉子處放置粗隆捲軸（trochanter roll），以預防髖關節外旋，故選 D。膝膕處墊枕會壓迫膕動靜脈；頭頸部應與脊柱呈一直線；足托板是使足部維持背屈以預防垂足。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 37, "stem": "某男士在高溫環境工作大量流汗，感覺頭暈，虛弱不適，至急診就醫時意識清楚，臉色蒼白、皮膚濕冷、體溫 37.9℃、血壓 100/65 mmHg，依上述症狀判斷其可能發生的問題為下列何者？", "options": ["中暑", "熱衰竭", "熱痙攣", "熱感冒"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-37", "explanation": "高溫環境大量流汗導致體液電解質流失，出現頭暈、虛弱、臉色蒼白、皮膚濕冷但意識清楚、體溫僅略升，符合熱衰竭，故選 B。中暑則體溫＞40℃、皮膚乾熱且意識改變。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 38, "stem": "關於影響呼吸速率之相關因素的敘述，下列何者正確？", "options": ["大出血，呼吸變慢", "男性較女性的呼吸速率慢", "焦慮時，呼吸變慢", "血壓下降，呼吸變慢"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-38", "explanation": "男性以腹式呼吸為主、潮氣容積較大，故呼吸速率較女性慢，選 B。大出血、焦慮與血壓下降皆會使呼吸「加快」。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 39, "stem": "下列何種疾病或情況的病人不會採端坐呼吸？", "options": ["腹水", "充血性心臟衰竭", "氣喘", "腦幹腫瘤"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-39", "explanation": "端坐呼吸是為改善肺部擴張與換氣所採取的代償姿勢；腦幹腫瘤造成的是呼吸中樞受損（如呼吸型態異常），不會以端坐呼吸緩解，故選 D。腹水、充血性心衰竭與氣喘病人則常採端坐呼吸。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 40, "stem": "關於心搏過緩（bradycardia）的描述，下列何者正確？", "options": ["常見於毛地黃中毒、體溫過低的病患", "補充甲狀腺素可能產生的合併症", "低於成人平均 72 次/分鐘就可稱之", "登山時因空氣稀薄會出現的代償作用"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-40", "explanation": "心搏過緩常見於毛地黃中毒與體溫過低的病人，故選 A。補充甲狀腺素會使心跳加快；心搏過緩定義為低於 60 次／分而非 72 次／分；登山缺氧的代償是心跳加快。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 41, "stem": "關於脈搏測量方式的描述，下列何者錯誤？", "options": ["新生兒與嬰兒脈搏需測量心尖脈 1 分鐘", "下肢行外科手術前後需要測量足背動脈", "一般成人最常用的周邊脈搏為肱動脈", "心律不整者需同時測量心尖脈與橈動脈"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-41", "explanation": "本題選錯誤。一般成人最常測量的周邊脈搏為「橈動脈」而非肱動脈，故 C 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 42, "stem": "下列何者非維持血壓的因素？", "options": ["心輸出量", "血液黏滯性", "動脈長度", "動脈彈性"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-42", "explanation": "維持血壓的因素包括心輸出量、循環血量、周邊血管阻力、血液黏滯性與動脈彈性；動脈長度在個體是固定的，非維持血壓的因素，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 43, "stem": "評估病人是否慢性營養不良，下列生化檢驗資料中，何者是最佳的評估指標？", "options": ["血清白蛋白（Albumin）", "丙胺酸轉胺酶（GPT）", "高密度脂蛋白（HDL）", "三酸甘油酯（TG）"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-43", "explanation": "血清白蛋白半衰期約 20 天，可反映長期（慢性）營養狀態，是評估慢性營養不良的最佳指標，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 44, "stem": "短腸症病人以全靜脈營養（TPN）方式供給營養，下列敘述何者錯誤？", "options": ["全靜脈營養溶液瓶口應採雙重消毒，預防感染", "連續輸注過程中，如營養配方來不及送達，可用 10%葡萄糖溶液代替", "輸注管路需 72 小時更換，並觀察穿刺處有無感染", "發生空氣栓塞時應採頭部放低，並採左側臥位"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-44", "explanation": "本題選錯誤。TPN 輸注管路應每 24 小時更換一次，而非 72 小時，故 C 錯誤（高糖高營養溶液極易滋生細菌）。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 45, "stem": "有關鼻胃管灌食造成的副作用，下列敘述何者正確？", "options": ["液體攝入過多會造成便秘", "高濃度配方多會造成便秘", "配方中鈉太少會造成水腫", "灌入速度太快易造成腹瀉"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-45", "explanation": "鼻胃管灌食速度過快，高濃度配方快速進入腸道造成傾食效應，易導致腹瀉，故選 D。液體攝入過多與鈉太少會造成腹瀉／低血鈉，高濃度配方易脫水而非便秘。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 46, "stem": "下列那個受壓處不是長期平躺的好發部位？", "options": ["肩胛骨", "腸骨前上棘", "薦骨", "腳跟"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-46", "explanation": "腸骨前上棘（ASIS）是「俯臥」時的受壓點，並非長期平躺的好發部位，故選 B。仰臥好發於枕骨、肩胛骨、肘部、薦骨與腳跟。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 47, "stem": "王太太，70 歲，尾骶骨第二期壓傷，下列衛教指導，何者正確？ ①每 3～4 小時幫病人翻身一次 ②飲食中要注意補充蛋白質與維生素 C，以促進組織的修復 ③尾骶骨處使用氣墊圈，促進血液循環 ④平躺時可於病人小腿處置放小枕頭，使腳跟處騰空，避免腳跟受壓", "options": ["①②", "①③", "②③", "②④"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-47", "explanation": "正確者為②補充蛋白質與維生素 C 促進組織修復、④於小腿處墊枕使腳跟騰空，故選 D（②④）。壓傷病人應每 2 小時翻身一次；氣墊圈會壓迫周邊組織阻斷循環，已不建議使用。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 48, "stem": "有關等長運動（isometric exercise）之敘述，下列何者錯誤？", "options": ["能促進末梢靜脈血液回流", "會陰部肌肉收縮屬等長運動", "適用於上石膏固定之患肢", "此運動屬於被動性肌肉運動"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-48", "explanation": "本題選錯誤。等長運動是病人自行收縮肌肉，屬「主動性」運動，故 D 錯誤。它為靜態運動，可促進靜脈回流、適用於石膏固定的患肢與會陰部肌肉訓練。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 49, "stem": "有關繃帶包紮原則敘述，下列何者正確？", "options": ["包紮病人肢體時，應將肢體放低，以利包紮", "由肢體近心端往遠心端包紮", "繃帶包紮每圈應覆蓋前一圈 1/2～2/3 寬度為宜", "包紮完畢後，應於關節處結帶固定"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-49", "explanation": "繃帶包紮時每圈應覆蓋前一圈的 1/2～2/3 寬度，才能均勻施壓且不易鬆脫，故選 C。包紮時應抬高肢體、由遠心端往近心端包紮，並避免在關節處、傷口上或受壓處結帶。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 50, "stem": "王先生因車禍意外接受左下肢截肢手術，術後為了減輕腫脹及加壓止血，應使用下列何種繃帶？", "options": ["紗布繃帶", "彈性繃帶", "石膏繃帶", "橡皮繃帶"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-50", "explanation": "截肢術後為減輕腫脹、加壓止血並塑型殘肢，應使用彈性繃帶，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 51, "stem": "有關尿液培養採檢之敘述，下列何者正確？", "options": ["以清潔方式收集中段尿液於標本容器中", "以導尿方式收集中段尿液於無菌標本容器中", "晨起第一次解的尿液不要，收集當日 7 AM～次日 7 AM 尿液", "睡前最後一次解的尿液不要，收集當日 9 PM～次日 9 PM 尿液"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-51", "explanation": "尿液培養須避免污染，以導尿方式收集中段尿液置於「無菌」標本容器中最為正確，故選 B。清潔法所用容器仍須無菌；C、D 描述的是 24 小時尿液收集法。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 52, "stem": "護理師協助收集常規尿液檢查，發現尿液呈現螢光黃色，下列何者為最可能之原因？", "options": ["脂肪尿", "服用維生素 B12", "綠膿桿菌感染", "尿道結石"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-52", "explanation": "服用維生素 B 群（含 B12、B2）後尿液會呈鮮明的螢光黃色，屬正常藥物現象，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 53, "stem": "王先生因氣喘發作而急診入院，剛轉入病房，可聽見呼吸喘鳴音（wheezing），首要的入院護理措施為何？", "options": ["病史詢問", "說明痰液檢體收集方法", "病室環境介紹", "抬高床頭並測量生命徵象"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-53", "explanation": "氣喘發作並可聽見喘鳴音，屬呼吸窘迫，首要措施是抬高床頭改善換氣並測量生命徵象評估病況，故選 D。病史詢問與環境介紹皆應延後。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 54, "stem": "有關臨終照護的敘述，下列何者錯誤？", "options": ["依病人意願選擇合宜的進食方式", "停止或減少非必要的醫療處置或監測儀器", "簡化處方並保留症狀控制藥物", "藥物由口服途徑給予，避免造成注射傷害"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-54", "explanation": "本題選錯誤。臨終病人常有吞嚥困難或意識改變，藥物給予應改用非口服途徑（如皮下、經皮貼片、舌下），而非堅持口服，故 D 錯誤。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 55, "stem": "有關屍僵的敘述，下列何者正確？ ①屍僵通常在死亡後 6～8 小時發生 ②屍僵乃因血液凝固而引起 ③小肌肉較大肌肉先發生屍僵 ④屍僵發生多由頭頸部開始", "options": ["①③", "②④", "①②", "③④"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-55", "explanation": "正確者為③小肌肉較大肌肉先發生屍僵、④屍僵多由頭頸部（下顎）開始，故選 D（③④）。屍僵一般在死亡後 2～4 小時開始，且成因為 ATP 耗竭使肌動與肌凝蛋白無法解離，並非血液凝固。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 56, "stem": "張先生，60 歲，昏迷前未簽署「不施行心肺復甦術同意書」，依據安寧緩和醫療條例可請最近親屬簽署，下列何者不是最近親屬？", "options": ["20 歲孫女", "55 歲胞妹", "65 歲堂兄", "85 歲父親"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-56", "explanation": "依安寧緩和醫療條例，最近親屬的順位為配偶、成年子女與孫子女、父母、兄弟姊妹、祖父母、曾祖父母或三親等旁系血親、一親等直系姻親；「堂兄」屬四親等旁系血親，不在其列，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 57, "stem": "有關柏拉圖（Pareto）的 80/20 法則，下列敘述何者正確？", "options": ["把握關鍵多數，就可獲得重要少數", "投入的時間越多，獲得的成果越大", "日常事務中，緊急且重要只占少數", "掌握 80%時間，能解決 20%的問題"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-57", "explanation": "依 80/20 法則，日常事務中真正緊急且重要的關鍵少數只占少數，卻決定大部分成果，故選 C。A 之「關鍵多數／重要少數」用語顛倒；投入時間與成果並非正比。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 58, "stem": "有關完整工作設計對組織目標的影響，下列敘述何者正確？", "options": ["工作就是從做中學習不需要提供員工培訓", "工作擴大化可以為組織節省人事成本的經費", "工作說明書的內容，可做為員工懲戒的依據", "工作項目越完整，越能找到符合需求的員工"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-58", "explanation": "工作項目與職責界定越完整，越能明確描述任職條件，找到符合需求的員工，故選 D。從做中學仍需教育訓練；工作擴大化未必節省人事成本；工作說明書的用途在界定職責而非作為懲戒依據。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 59, "stem": "某醫院產科病房護理長應邀嬰兒奶粉代言，常見她身著護理師制服出現在電視和平面媒體上推薦產品。下列敘述何者正確？", "options": ["不違法，但違背護理專業倫理", "觸犯護理人員法，應處以罰鍰", "有助護理形象行銷，值得鼓勵", "違反消費者保護法，應予檢舉"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-59", "explanation": "護理長身著制服為商品代言，雖未明確觸犯法律，但已使專業形象為商業背書，違反護理專業倫理，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 60, "stem": "有關明茲柏格（Henry Mintzberg）的管理者角色，下列敘述何者正確？", "options": ["護理長調配單位人力、物力、時間及經費，屬於資源分配者", "護理部主任參與院務會議代表護理部報告，屬於精神領袖者", "護理長傳達醫院將舉辦「宣傳護理形象」短片甄選，屬於代言人", "護理長細心觀察護理人員身心健康及工作表現，屬於聯絡者"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-60", "explanation": "調配單位人力、物力、時間與經費屬明茲柏格「決策角色」中的資源分配者，故選 A。代表單位出席會議屬精神領袖（頭臉人物）、對外傳達訊息屬發言人、關心同仁身心與工作表現屬領導者角色。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 61, "stem": "護理部主任重視護理作業標準化及適當分工，以使護理師的服務量增加及品質提升，是應用下列何種管理理論？", "options": ["科學管理理論", "管理程序學派", "層次結構模式理論", "行為科學學派"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-61", "explanation": "重視作業標準化、適當分工以提升服務量與品質，是泰勒科學管理理論的核心，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 62, "stem": "強調「團體價值觀與文化、員工參與式決策」，屬於下列何種管理理論？", "options": ["權變理論", "Z 理論", "系統理論", "管理者角色理論"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-62", "explanation": "強調團體價值觀與文化、員工參與式決策者為大內（Ouchi）的 Z 理論，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 63, "stem": "病人發生非預期死亡或非自然病程中永久性功能喪失，屬於下列何種異常事件？", "options": ["警訊事件（sentinel event）", "意外事件（accident）", "跡近錯失（near miss）", "醫療不良事件（medical adverse event）"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-63", "explanation": "非預期死亡或非自然病程中永久性功能喪失，屬醫院品管中最嚴重的警訊事件（sentinel event），須立即進行根本原因分析，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 64, "stem": "針扎屬於下列何種職業危害？", "options": ["物理性危害", "生物性危害", "化學性危害", "心理性危害"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-64", "explanation": "針扎可能造成 B 型、C 型肝炎與 HIV 等病原體暴露，屬生物性危害，故選 B。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 65, "stem": "甲病房 50 床，占床率 75%，護理師有 20 人，每人 1 年可休假 14 天、公假 10 天參加教育訓練、國定例假日 122 天，請問甲病房每位病人每天平均可獲得多少護理時數？", "options": ["1.96 小時", "2.04 小時", "2.35 小時", "2.56 小時"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-65", "explanation": "每人每年上班日數＝365－14－10－122＝219 天，20 人共 4,380 個班，每班 8 小時＝35,040 護理時數；病人日數＝50×75%×365＝13,687.5，35,040 ÷ 13,687.5 ≒ 2.56 小時，故選 D。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 66, "stem": "有關「非正式組織」的敘述，下列何者正確？ ①對正式組織會產生影響力 ②組織的組成需明文規定 ③是一群能增加工作知能的人 ④因利害關係結合在一起 ⑤需有決策者做規劃領導", "options": ["①②③", "③④⑤", "①③④", "②④⑤"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-66", "explanation": "非正式組織①對正式組織會產生影響力、③成員間可互相增加工作知能、④因利害關係或情感結合，故選 C（①③④）。②明文規定與⑤設有決策者規劃領導是正式組織的特徵。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 67, "stem": "利用工作分析，重新定義工作或職務，確認出新的工作職責和職權，屬於下列何種工作設計？", "options": ["工作擴大化", "工作再輪調", "工作再設計", "工作豐富化"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-67", "explanation": "利用工作分析重新定義工作或職務、確認新的職責與職權，屬工作再設計（job redesign），故選 C。工作擴大化是增加同層級工作項目，工作豐富化是增加職權與挑戰性。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 68, "stem": "當醫院發生緊急事件時，為講求時效，需採行下列何種組織結構型態較適宜？", "options": ["簡單式結構", "功能性結構", "集權式結構", "扁平式結構"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-68", "explanation": "緊急事件講求時效與命令統一，宜採集權式結構由上層迅速下達決策，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 69, "stem": "下列那一項溝通屬於不同層級單位人員間的溝通方式？", "options": ["下行溝通", "上行溝通", "平行溝通", "斜行溝通"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-69", "explanation": "斜行溝通（diagonal communication）是不同層級且不同單位人員間的溝通，故選 D。下行、上行為同一指揮系統的上下層級，平行溝通則為同層級。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 70, "stem": "護理部主任未經督導長同意，直接請護理長負責某專案，不符合下列何項授權原則？", "options": ["單一隸屬關係", "授權非授責", "相互信賴", "量力授權"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-70", "explanation": "護理部主任跳過督導長直接指派護理長任務，破壞了指揮系統的一致性，違反「單一隸屬關係（命令統一）」原則，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 71, "stem": "某護理長負責護理部的品質管理作業，同時負責醫品部的根本原因分析專案業務，此為下列何種組織型態？", "options": ["直線型組織", "扁平式組織", "幕僚型組織", "矩陣式組織"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-71", "explanation": "同時隸屬於護理部（功能部門）與醫品部專案（任務編組），形成雙重指揮系統，屬矩陣式組織，故選 D。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 72, "stem": "下列何種情形可再發給護理執業執照？", "options": ["曾經販賣毒品，並且經過判刑確定者", "執業 6 年，且完成繼續教育時數 120 點", "經主管機關認定身心狀況不能執業者", "因特殊事件，被廢止護理人員證書者"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-72", "explanation": "依護理人員法，護理執業執照每 6 年更新一次，須完成規定的繼續教育積分（150 點，其中專業課程須達一定比例）方可換發；四個選項中僅 B 描述持續執業並完成繼續教育，故選 B。販賣毒品經判刑確定、經認定身心狀況不能執業、證書遭廢止者皆不得再發給執照。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 73, "stem": "依品質管理概念發展之先後順序，下列何者排列正確？ ①品質控制 quality control（QC） ②全面品質管制 total quality control（TQC） ③全面品質管理 total quality management（TQM） ④品質保證 quality assurance（QA）", "options": ["①②③④", "①④②③", "②③①④", "④①③②"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-73", "explanation": "品質管理概念發展順序為①品質控制（QC）→ ④品質保證（QA）→ ②全面品質管制（TQC）→ ③全面品質管理（TQM），故選 B。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 74, "stem": "在衝突的發展過程中，那一個階段最適合運用衝突處理技巧來避免非功能性衝突繼續擴大？", "options": ["潛在對立階段", "認知與個人化階段", "意圖及行為階段", "結果階段"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-74", "explanation": "衝突發展過程中，於「意圖及行為階段」介入運用衝突處理技巧，最能在行為外顯化擴大前加以導正，避免非功能性衝突持續擴大，故選 C。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 75, "stem": "有關護理人員預防醫療糾紛發生之敘述，下列何者正確？", "options": ["多說話容易出錯，故護理師應儘量減少與病人／家屬單獨會談", "護理師需熟知法令規範，確實依法執行業務，以免誤觸法網", "護理師不管態度如何，都應能與病人／家屬建立良好的人際關係", "經驗豐富的護理師，不需依照醫院標準作業執行護理照護工作"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-75", "explanation": "預防醫療糾紛的關鍵在於熟知法令規範、依法確實執行業務，故選 B。應加強而非減少溝通；良好態度是建立關係的前提；再資深也須依標準作業執行。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 76, "stem": "下列何者將「危機管理（Risk Management）」納入品質管理模式？", "options": ["阿丹兒（Adair）的 QUACERS", "戴明（Deming）的 PDCA", "杜納貝迪恩（Donabedian）的 SPO", "美國護理學會（ANA）的品質保證模式"], "answer": "A", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-76", "explanation": "阿丹兒（Adair）的 QUACERS 模式將品質（Quality）、利用率、可近性、成本、效率、風險（Risk Management）與滿意度納入品質管理架構，故選 A。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 77, "stem": "有關造成醫院危機的外在因素，下列何者錯誤？", "options": ["大量傷患擁至", "發生醫療糾紛", "財務結構不良", "媒體負面報導"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-77", "explanation": "本題選錯誤。財務結構不良屬醫院本身的「內在」因素，並非外在因素，故 C 錯誤。大量傷患、醫療糾紛與媒體負面報導皆源自外部。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 78, "stem": "有關線性溝通模式中溝通品質之關鍵要素，下列敘述何者正確？", "options": ["來源、訊息、溝通者及接收者", "訊息、管道、溝通者及接收者", "員工、傳遞者、管道及接收者", "來源、訊息、管道及接收者"], "answer": "D", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-78", "explanation": "線性溝通模式（SMCR）的四項關鍵要素為來源（sender）、訊息（message）、管道（channel）與接收者（receiver），故選 D。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 79, "stem": "下列何種衝突管理策略可達到雙贏？", "options": ["迴避", "合作", "順從", "支配"], "answer": "B", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-79", "explanation": "合作（collaborating）兼顧雙方目標，透過共同解決問題達成雙贏，故選 B。迴避為雙輸、順從為己輸人贏、支配為己贏人輸。"}, {"year": "111", "session": "第一次", "subject": "基本護理學", "num": 80, "stem": "護理長依據同仁的某項特性進行考核，易產生下列何種偏誤？", "options": ["近因效應", "霍桑效應", "月暈效應", "趨勢效應"], "answer": "C", "subjectCode": "2104", "subjectShort": "基本", "id": "111-1-2104-80", "explanation": "僅依同仁的某一項特性（優點或缺點）推論其整體表現，即為月暈效應（halo effect），故選 C。近因效應是受最近事件影響，趨勢效應則指依過去趨勢推論。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 1, "stem": "有關醫療院所提供以家庭為中心照護之策略，下列敘述何者錯誤？", "options": ["鼓勵留院直到適應母職", "推動準爸爸陪產制", "提供待產、分娩、恢復室合而為一的樂得兒產房", "協助產檯上母嬰早期肌膚接觸"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-1", "explanation": "本題選錯誤。以家庭為中心的照護強調家庭參與及早期返家由家人共同支持適應母職，「鼓勵留院直到適應母職」反而使產婦與家庭分離、增加依賴，故 A 為錯誤策略。陪產制、樂得兒（LDR）產房、產檯上早期肌膚接觸皆為正確做法。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 2, "stem": "下列何者不是接受產前遺傳諮詢之高危險群孕婦？", "options": ["懷孕年齡為 34.8 歲孕婦", "曾生下先天性心臟病兒之孕婦", "初次被診斷為妊娠糖尿病的經產婦", "孕婦先生是海洋性貧血帶原者"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-2", "explanation": "本題選「非」高危險群。妊娠糖尿病屬代謝性合併症，並非遺傳疾病，初次診斷之經產婦不需產前遺傳諮詢，故選 C。高齡（34.8 歲已接近 35 歲高齡界線）、曾生育先天異常兒、配偶為海洋性貧血帶原者皆為遺傳諮詢對象。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 3, "stem": "下列何者不是全民健康保險於第一妊娠期婦女所提供之實驗室檢驗項目？", "options": ["乙型鏈球菌篩檢", "B 型肝炎檢查", "德國麻疹抗體檢驗", "愛滋血清抗體檢驗"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-3", "explanation": "本題選「非」第一妊娠期項目。乙型（B 群）鏈球菌篩檢安排在懷孕 35～37 週，屬第三妊娠期，故選 A。B 型肝炎、德國麻疹抗體與愛滋血清抗體檢驗皆屬第一次產檢（第一妊娠期）的例行實驗室項目。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 4, "stem": "有關測量胎心音的敘述，下列何者最正確？", "options": ["妊娠 6 週即可用腹部超音波掃描出胎兒心跳", "妊娠 16 週可用杜普勒（Doppler）在平臍左右兩側探測胎心音", "妊娠 17～20 週可用一般聽診器在腹部聽診到胎心音", "妊娠 20 週可用杜普勒（Doppler）在劍突下 1 公分探測胎心音"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-4", "explanation": "妊娠 17～20 週可用一般聽診器（fetoscope）在腹部聽到胎心音，故選 C。腹部超音波約 6～7 週可見胎心搏動但一般以陰道超音波較早偵測；杜普勒約 10～12 週即可測得，探測位置在恥骨聯合上方而非平臍或劍突下。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 5, "stem": "蔡女士，懷孕第 13 週，主訴上週出國到茲卡病毒疫區，她擔心胎兒會受到影響，護理師的回應，下列何者適當？", "options": ["解釋胎兒此時腦部已發育完全，病毒造成腦部病變機率低", "返家後 2 週內密切觀察是否有紅疹、發燒、關節痛等症狀", "建議可立即考慮做羊水茲卡病毒檢驗", "立即做傳染性通報，並抽血檢驗病毒"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-5", "explanation": "妊娠 13 週赴茲卡病毒疫區，返國後應於 2 週內密切觀察有無紅疹、發燒、關節痛、結膜炎等症狀，故選 B。此時胎兒腦部仍在發育、感染可致小頭症；羊水檢驗與抽血並非無症狀者的第一步，應先觀察並依症狀評估後續檢驗與通報。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 6, "stem": "羅女士，因 16 歲的女兒月經遲遲未來，經醫師診斷為透納式症候群（Turner syndrome），有關透納式症候群之敘述，下列何者正確？", "options": ["其造成原因與目前塑化劑及環境荷爾蒙有關", "通常會有身材矮小、第二性徵發育不全與無法生育的問題", "會有月經不規則及智能遲緩的相關處置", "其典型症狀為小頭、手指粗短與蹼狀足"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-6", "explanation": "透納氏症候群為 45,XO 染色體異常，典型表現為身材矮小、第二性徵發育不全、原發性無月經與不孕，故選 B。此症與塑化劑、環境荷爾蒙無關，智能多屬正常，典型外觀為蹼狀「頸」而非蹼狀足。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 7, "stem": "有關妊娠期婦女需增加熱量攝取之敘述，下列何者正確？", "options": ["依據母體氧氣消耗增加所需熱量", "第一妊娠期應儲存較多熱量以利胎盤的生長", "應攝取較多來自高醣、高蛋白及高脂肪食物", "孕前 BMI 為 22 者，在第一妊娠期應攝取更多熱量"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-7", "explanation": "妊娠期熱量需求增加主要來自母體氧氣消耗量與基礎代謝率上升，故選 A。第一妊娠期熱量不需額外增加（第二、三期才每日增加約 300 大卡）；飲食應均衡而非偏重高醣高脂；孕前 BMI 正常者第一期不需增加熱量。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 8, "stem": "在妊娠期間，下列何項腎臟功能是降低的？", "options": ["腎血漿流量（RPF）", "腎小管的再吸收速度", "對糖分吸收的閾值", "腎臟的排尿量"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-8", "explanation": "妊娠期腎臟對糖分吸收的閾值「降低」，故容易出現生理性糖尿，選 C。腎血漿流量、腎絲球過濾率與排尿量在妊娠期皆增加；腎小管再吸收速度亦提高。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 9, "stem": "陳女士，懷孕 28 週，有一位 4 歲的孩子小明。小明對陳女士說：「我討厭媽媽肚子裡面的小妹妹，因為媽媽只關心她，都不和我玩」。下列護理師回應，何者最適當？", "options": ["告訴小明，要學習愛妹妹", "讓小明用聽診器聽胎兒心跳", "帶小明參加產前教室", "利用遊戲轉移小明注意力"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-9", "explanation": "手足競爭時，讓 4 歲的小明用聽診器聽胎兒心跳，可具體參與並建立與胎兒的連結，故選 B。直接說教要求「學習愛妹妹」易加深排斥；產前教室內容不符其年齡；單純轉移注意力並未處理其被忽略的感受。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 10, "stem": "有關胎兒染色體檢查的敘述，下列何者錯誤？", "options": ["妊娠 5～8 週者母血唐氏症篩檢值大於 1/720 為高危險群", "妊娠 10 週以前施行絨毛膜取樣有斷肢畸形之風險", "妊娠 11～12 週是合適進行母血檢測胎兒染色體的時機", "妊娠 16～18 週是合適進行羊膜穿刺術的時機"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-10", "explanation": "本題選錯誤。母血唐氏症篩檢的適當時機為第一孕期 11～13 週或第二孕期 15～20 週，妊娠 5～8 週無法施行，且高危險切點一般以 1/270 為界，故 A 敘述錯誤。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 11, "stem": "有關待產時陰道內診之敘述，下列何者錯誤？", "options": ["陰道內診可評估待產婦的子宮頸擴張、變薄程度及胎膜完整性", "可指導待產婦深呼吸或哈氣以緩解其內診時的不適", "待產婦有前置胎盤為陰道內診的禁忌", "若待產婦已破水，應更密集陰道內診以評估其產程進展"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-11", "explanation": "本題選錯誤。破水後應「減少」陰道內診次數以降低上行性感染風險，故 D 錯誤。內診可評估子宮頸擴張、變薄與胎膜完整性；深呼吸或哈氣可緩解不適；前置胎盤為內診禁忌。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 12, "stem": "有關分娩的鎮痛與麻醉藥物之敘述，下列何者錯誤？", "options": ["marcaine 為脊髓麻醉常用藥物，術後無須平躺", "meperidine 常用於第一產程活動期止痛用，naloxone 為解毒劑", "meperidine 具呼吸抑制之副作用及胎兒心跳變異性減低", "fentanyl 具呼吸抑制及低血壓之副作用，naloxone 為解毒劑"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-12", "explanation": "本題選錯誤。marcaine（bupivacaine）用於脊髓麻醉後仍須依醫囑平躺，以降低腦脊髓液滲漏造成的脊髓性頭痛，故 A 錯誤。meperidine 與 fentanyl 的副作用及 naloxone 為其解毒劑之敘述皆正確。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 13, "stem": "有關待產時裝置胎兒監測器的注意事項，下列何者錯誤？", "options": ["子宮收縮壓力傳導器置於收縮力最強的子宮底位置", "將胎心率傳導器置於胎心音最清晰處", "應確認傳導器彈性皮帶的鬆緊度約可容納一個指頭為合宜緊度", "偵測到與產婦心跳一致的胎兒臍帶雜音是正常的"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-13", "explanation": "本題選錯誤。與「產婦」心跳一致的雜音是子宮雜音（uterine souffle），臍帶雜音（funic souffle）應與「胎心」一致，故 D 敘述錯誤。其餘傳導器置放位置與皮帶鬆緊度之敘述皆正確。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 14, "stem": "待產婦的護理紀錄記載胎兒先露部位高度是-1。此紀錄結果是指胎兒先露部位為下圖那一個編號的位置？（原卷附骨盆矢狀面圖，編號 1～4 由骨盆入口往出口依序標示，間徑單位為公分）", "options": ["1", "2", "3", "4"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-14", "explanation": "先露部位高度 -1 代表胎頭最低點位於坐骨棘（0 位）上方 1 公分處，故對應圖中編號 3 的位置，選 C。⚠ 本題原卷附骨盆矢狀面圖，編號 1～4 由骨盆入口往出口依序標示，作答時請對照原卷圖示。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 15, "stem": "有關剖腹產的手術前護理措施，下列何者最適當？", "options": ["手術前 1 天進行腹部劃線作標記", "手術前一晚使用抗焦慮劑", "手術前 3 天進食低渣飲食", "手術前 1 天及手術當天應聽診胎心音"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-15", "explanation": "剖腹產術前 1 天及手術當天應聽診胎心音以確認胎兒狀況，故選 D。腹部劃線標記於手術當日進行；抗焦慮劑非例行給予；低渣飲食不需提前 3 天，一般術前 8 小時禁食即可。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 16, "stem": "下列何者為枕後位（OP）第一、二產程延長的主要機轉？", "options": ["需要不斷的屈曲成為 LOP 位", "內迴轉成為枕前位，費時長", "在骨盆入口，不易下降", "實施外部轉向時，費時較長"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-16", "explanation": "枕後位（OP）需經較長距離的內迴轉（約 135 度）才能轉成枕前位娩出，是造成第一、二產程延長的主要機轉，故選 B。胎頭仍需俯屈而非轉為 LOP；OP 在骨盆入口的銜接多無明顯困難；外部轉向術用於臀位而非枕後位。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 17, "stem": "陳女士，待產 12 小時後生下一位健康新生兒。有關護理師執行的第四產程的護理措施，下列何者不適宜？", "options": ["鼓勵產婦與寶寶做眼對眼的接觸", "以包布覆蓋寶寶保暖並鼓勵觸摸寶寶", "延後打維生素 K1 及先進行肌膚接觸", "將新生兒放置保溫箱讓產婦休息"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-17", "explanation": "本題選不適宜。第四產程（產後 1～2 小時）應把握親子依附的敏感期，將新生兒放置保溫箱讓產婦休息會中斷母嬰接觸，故 D 不適宜。眼對眼接觸、包布保暖並鼓勵觸摸、延後施打維生素 K1 以先進行肌膚接觸皆屬適當措施。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 18, "stem": "陳女士，產後 1 週，表示有易怒、失眠、沒有食慾、注意力不集中的情形，其最有可能的情況為何？", "options": ["產後情緒低落", "產後憂鬱症", "產後精神病", "產後躁鬱症"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-18", "explanation": "產後 1 週出現易怒、失眠、食慾不振、注意力不集中等短暫且輕微的情緒變化，最可能為產後情緒低落（postpartum blues），故選 A。此現象約於產後 3～5 天達高峰、2 週內自行緩解；若症狀持續超過 2 週且影響功能，才考慮產後憂鬱症。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 19, "stem": "護理師進行產後子宮復舊評估時，下列何者正確？", "options": ["宜先排空膀胱再進行", "維持半坐臥姿勢", "評估時以單手進行", "剖腹產不宜進行觸診"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-19", "explanation": "評估子宮復舊前應先排空膀胱，以免脹大的膀胱將子宮上推或推向側邊而誤判，故選 A。評估時採平躺屈膝、以「雙手」進行（一手固定子宮下段、一手觸診宮底）；剖腹產婦仍需觸診評估，僅需避開傷口。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 20, "stem": "下列那種情況容易發生產後痛（after pain）？", "options": ["經產婦", "羊水過少", "單胞胎", "剖腹產"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-20", "explanation": "產後痛（after pain）因子宮間歇性強力收縮所致，好發於經產婦、多胞胎、羊水過多及哺乳時，故選 A。初產婦子宮肌張力佳、多呈持續收縮，較少出現產後痛。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 21, "stem": "教導產婦執行產後運動時，膝胸臥式的主要目的為何？", "options": ["促進子宮恢復正常位置", "促進傷口癒合", "預防乳房鬆弛", "改善尿失禁"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-21", "explanation": "膝胸臥式可藉重力使子宮回復至正常前傾前屈位置，主要用於預防或矯正子宮後屈，故選 A。促進傷口癒合靠會陰護理；預防乳房鬆弛為胸部運動；改善尿失禁為凱格爾運動。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 22, "stem": "王女士，從未避孕，產後出院前表示：「我暫時不想懷孕，可是不想避孕，覺得自然比較好。」下列敘述何者最適當？", "options": ["如果可以無論晝夜親餵且月經未恢復，在 6 個月內可避孕", "從接著的月經來潮第 1 天開始算，受精的危險期是第 11 天到第 19 天", "接著的月經來潮日期不一定，在那之前是安全的，可以不用避孕", "每天量基礎體溫，從體溫降低那天開始連續 2 天避免性交，其他日子可以性交"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-22", "explanation": "個案不願使用人工避孕法，可教導哺乳停經避孕法（LAM）：完全親餵、日夜不間斷且月經尚未恢復者，產後 6 個月內具避孕效果，故選 A。危險期應以下次月經前 14 天推算；基礎體溫法是體溫「上升」後 3 天才屬安全期。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 23, "stem": "有關使用荷爾蒙藥物或避孕器的敘述，下列何者正確？", "options": ["子宮內避孕器 Mirena®在分娩後 4～6 週置入子宮，效期 3 年", "混合型避孕藥在月經結束後 1 週開始吃，可使子宮頸黏液變稠", "迷你丸（mini pills）為單一黃體素製劑，因干擾正常排卵而避孕", "Depo-Provera®注射後不會立即有避孕效果，建議先用保險套避孕"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-23", "explanation": "Depo-Provera®（長效黃體素針劑）注射後非立即生效，首次注射後 7 天內應併用保險套，故選 D。Mirena® 效期為 5 年；混合型避孕藥應於月經來潮第 1～5 天開始服用；迷你丸主要作用為使子宮頸黏液變稠並使子宮內膜不適合著床，並非干擾正常排卵。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 24, "stem": "李女士，採脊髓阻斷麻醉剖腹產，產後第 1 天主訴噁心感，起床的時候頭很痛，躺下頭痛就好些。下列何項護理指導較適當？", "options": ["說明是因為禁食較久，導致胃不適與血糖低，建議進食", "說明是腦脊髓液不平衡，建議暫時頭不抬高平躺並補充水分", "說明是麻醉藥的關係，等藥代謝後會緩解，提供檸檬水緩解噁心感", "評估新生兒照顧能力，可能是擔心能力不足太過焦慮引起"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-24", "explanation": "起床時頭痛、平躺可緩解，是脊髓阻斷麻醉後腦脊髓液滲漏造成的脊髓性頭痛，護理指導應為暫時平躺、勿抬高頭部並補充水分，故選 B。必要時可依醫囑給予咖啡因或施行硬膜外血液貼片。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 25, "stem": "王女士表示：「我不准我兒子來，他們天天吵，太皮了，萬一妹妹怎樣就麻煩了。」下列敘述何者最適當？", "options": ["這樣的考量是正確的，大孩子如果太皮可能讓妹妹受傷", "請其他家人一起照看大孩子，讓他們遠遠看妹妹就沒問題了", "有家人在旁協助，讓大孩子撫摸或擁抱妹妹可以增強依附關係", "跟哥哥們說清楚，且要訂好規則，這樣他們就可以自己抱妹妹"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-25", "explanation": "有家人在旁協助下，讓大孩子撫摸或擁抱妹妹，可增進手足間的依附關係並減少排斥感，故選 C。完全隔離或僅「遠遠看」會加深手足競爭；學齡前兒童不宜單獨抱新生兒。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 26, "stem": "新生兒出生後 1 分鐘，哭聲宏亮，呼吸規則，心跳 128 次／分，四肢略屈曲，身體呈粉紅色，四肢為藍色，阿帕嘉計分（Apgar score）為幾分？", "options": ["7 分", "8 分", "9 分", "10 分"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-26", "explanation": "阿帕嘉計分：心跳 128 次/分（＞100）得 2 分、呼吸規則哭聲宏亮得 2 分、反射（哭聲宏亮）得 2 分、四肢略屈曲得 1 分、四肢發紺（acrocyanosis）得 1 分，合計 8 分，故選 B。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 27, "stem": "初產婦照顧新生兒的各項行為，下列何者最不適當？", "options": ["洗澡過後全身擦上精油，預防皮膚乾裂", "餵奶時，以搖籃式抱法，以手臂的彎曲處支持新生兒頭部，以另一隻手支撐臀部", "在餵奶前或是餵奶後 1 小時進行沐浴", "以直立式抱法，讓新生兒靠在肩膀上，一隻手支撐新生兒背臀部，一隻手拍打嗝"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-27", "explanation": "本題選最不適當。新生兒皮膚屏障未成熟，全身塗抹精油可能造成過敏、經皮吸收甚至中毒，故 A 最不適當。搖籃式抱法、餵奶前或餵奶後 1 小時沐浴、直立式抱法拍嗝皆為正確做法。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 28, "stem": "王小弟，出生 1 個月，有關評估其生殖器之描述，下列何者最正確？", "options": ["睪丸位於腹股溝，陰囊皺摺少", "睪丸已下降，陰囊皺摺多", "睪丸未下降，陰囊無皺摺", "陰囊表面光滑，無皺摺"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-28", "explanation": "足月出生滿 1 個月的男嬰，睪丸應已下降至陰囊內且陰囊皺摺多，故選 B。睪丸仍位於腹股溝、陰囊皺摺少或表面光滑，屬早產兒特徵或隱睪之異常表現。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 29, "stem": "有關新生兒護理之敘述，下列何者正確？①出生後給與抗生素眼藥膏預防淋病性結膜炎 ②以吸球清除分泌物時應先抽吸鼻腔 ③以 75%酒精消毒臍斷面 ④頭圍量法為額頭經雙耳中端到枕骨粗隆", "options": ["②③", "①④", "②④", "①③"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-29", "explanation": "①出生後給予抗生素眼藥膏預防淋病性結膜炎、④頭圍量法為額頭經雙耳中端到枕骨粗隆，兩者正確，故選 B（①④）。②以吸球清除分泌物應「先口腔後鼻腔」，以免刺激鼻腔引發吸氣而嗆入；③臍斷面消毒後續照護以保持清潔乾燥為原則。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 30, "stem": "子癇前症孕婦以硫酸鎂（MgSO4）治療期間的護理評估重點，下列何者最重要？", "options": ["意識狀態之變化", "身體平衡反應", "深部肌腱反射", "指尖再灌流檢測"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-30", "explanation": "使用硫酸鎂（MgSO₄）期間，深部肌腱反射消失是鎂中毒最早出現的警訊，早於呼吸抑制與心跳停止，故評估重點為深部肌腱反射，選 C。同時須監測呼吸次數（≥12 次/分）與尿量（≥30 mL/hr），並備妥解毒劑葡萄糖酸鈣。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 31, "stem": "王女士，Rh(-)，初產下一位 Rh(+)的女嬰，母女均安。為了預防下次懷孕時產生胎兒大量溶血，給予母體注射 Rh0 免疫球蛋白之時機，下列何者最適當？", "options": ["此胎產後 72 小時內", "此胎產後 6～8 週", "下次懷孕 28 週時", "下次懷孕產後立即"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-31", "explanation": "Rh 陰性婦女產下 Rh 陽性嬰兒後，應於產後 72 小時內注射 Rh₀ 免疫球蛋白（RhoGAM），以避免母體產生抗 D 抗體影響下一胎，故選 A。另於妊娠 28 週時亦常規給予一劑作為產前預防。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 32, "stem": "有關患有心臟病的孕婦最易發生心臟衰竭的時期，下列何者錯誤？", "options": ["懷孕 22～26 週", "懷孕 28～32 週", "待產陣痛時", "產後 48 小時內"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-32", "explanation": "本題選錯誤。心臟病孕婦最易發生心臟衰竭的時期為懷孕 28～32 週（血漿容積達高峰）、待產陣痛時及產後 48 小時內；懷孕 22～26 週並非好發期，故 A 為錯誤敘述。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 33, "stem": "有關孕婦接受 B 群（乙型）鏈球菌篩檢之敘述，下列何者錯誤？", "options": ["以避免垂直感染新生兒", "建議孕婦在懷孕 35～37 週間進行篩檢", "陽性者，在分娩前 4 小時給予抗生素", "陽性者，建議採取剖腹產"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-33", "explanation": "本題選錯誤。B 群鏈球菌篩檢陽性者的處置為待產時給予靜脈抗生素預防新生兒感染，並非建議剖腹產，故 D 錯誤。篩檢時機為 35～37 週，目的在避免垂直感染。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 34, "stem": "有關子宮內膜癌之敘述，下列何者錯誤？", "options": ["常見症狀為不正常陰道出血", "是發生在子宮內最常見的癌症", "病人出現症狀時多已進入晚期", "診斷檢查以子宮內膜刮搔術（D&C）為主"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-34", "explanation": "本題選錯誤。子宮內膜癌因早期即出現不正常陰道出血，多數在早期即被診斷，故「出現症狀時多已進入晚期」為錯誤敘述，選 C。（晚期才發現者為卵巢癌。）"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 35, "stem": "有關卵巢癌的醫療措施，下列敘述何者錯誤？", "options": ["以手術治療合併化學治療為主流", "分期手術（staging surgery）前應進行腸道準備", "減積手術（debulking surgery）就是儘可能將所有的卵巢腫瘤或已經擴散之腫瘤切除乾淨", "初診斷之卵巢癌化療藥物以微脂體小紅莓（Lipo-Dox）為首選"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-35", "explanation": "本題選錯誤。初診斷卵巢癌的第一線化療組合為紫杉醇（paclitaxel）併鉑金類（carboplatin），微脂體小紅莓（Lipo-Dox）主要用於復發性卵巢癌，故 D 錯誤。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 36, "stem": "有關 HPV 疫苗，下列敘述何者正確？", "options": ["接種疫苗後，仍需定期的子宮抹片檢查", "注射一劑終生有效", "疫苗針對 HPV 型別有 16、18、30、31", "子宮頸癌有 60～70%由 HPV 第 30、31 型引起"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-36", "explanation": "HPV 疫苗無法涵蓋所有致癌型別，接種後仍需定期做子宮頸抹片檢查，故選 A。疫苗需依廠牌接種 2～3 劑而非一劑終生有效；主要涵蓋 6、11、16、18 等型別，且子宮頸癌約 70% 由 HPV 第 16、18 型引起，而非第 30、31 型。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 37, "stem": "陰道鏡檢查的最大優點是可清楚檢測子宮那一個部位之病灶？", "options": ["陰道前壁與子宮頸交接處", "陰道後壁與子宮頸交接處", "子宮頸內口與子宮體交接處", "子宮頸轉換區"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-37", "explanation": "陰道鏡檢查最大的優點是可清楚觀察子宮頸「轉換區」（transformation zone），此處為鱗狀柱狀上皮交界，是子宮頸癌前病變最常發生的部位，故選 D。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 38, "stem": "王女士，已婚，疑似有骨盆腔炎，有關評估其臨床徵候的敘述，下列何者正確？", "options": ["下腹兩側鈍鈍悶痛", "腹部腫大，腰圍變大", "原發性月經過少", "內診子宮頸有移動性疼痛"], "answer": "AD", "note": "更正答案：第 38 題答 A 或 D 者均給分", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-38", "explanation": "⚠ 本題經考選部公告更正，答 A 或 D 者均給分。骨盆腔炎典型表現包含下腹兩側悶痛，內診時子宮頸有移動性壓痛（cervical motion tenderness）亦為重要徵候，兩項敘述皆屬臨床可見表現，故 A、D 皆給分。腹圍變大屬腫瘤表現；骨盆腔炎多為經血量增加而非原發性月經過少。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 39, "stem": "容易出現經前症候群的女性生命週期為那一時期？", "options": ["輸卵管結紮後的中年時期", "停經前幾年的老年時期", "生產後 6 個月青年時期", "初經階段年輕時期"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-39", "explanation": "依公告答案為 D。經前症候群須有排卵性月經週期才會出現，故自初經階段建立規則排卵後即可能發生。其餘選項：輸卵管結紮不影響排卵故非特定好發期、停經前並非「老年時期」之描述、產後 6 個月哺乳期多無排卵。⚠ 臨床流行病學上經前症候群其實以 20～40 歲婦女最常見，本題選項描述與教科書分類有出入，建議對照課本再確認。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 40, "stem": "有關乳房纖維腺瘤之敘述，下列何者正確？", "options": ["多發生於 30 歲以上之婦女", "為最常見的乳房良性腫瘤", "病人常因感到疼痛而就醫", "多為界限不明之腫塊"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-40", "explanation": "乳房纖維腺瘤是最常見的乳房良性腫瘤，故選 B。好發於 30 歲「以下」的年輕女性；腫塊多為無痛、界限清楚、可自由移動的實心腫塊。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 41, "stem": "因應少子化時代來臨，為保護兒童，兒童及少年福利與權益保障法規，下列何者錯誤？", "options": ["醫護人員執行業務時知悉兒童及青少年有施用毒品時，應於 24 小時內通報相關主管機關", "兒童及少年福利與權益保障法主要保護 20 歲以下之兒童及青少年", "任何人對兒童及少年不得有遺棄、身心虐待、猥褻或性交行為", "孕婦不得吸菸、酗酒、嚼檳榔或施用毒品等有害胎兒發育之行為"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-41", "explanation": "本題選錯誤。兒童及少年福利與權益保障法所稱兒童及少年係指未滿 18 歲之人，並非 20 歲以下，故 B 錯誤。醫護人員知悉兒少施用毒品應於 24 小時內通報、禁止遺棄與身心虐待、孕婦不得吸菸酗酒嚼檳榔等敘述皆正確。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 42, "stem": "當發現 8 個月大的張小弟口中塞有異物，有意識、呼吸困難，下列措施何者最適當？", "options": ["挖出異物後，於兩乳頭連線下執行心外按壓", "挖出異物後，蓋住口鼻給予人工呼吸", "張小弟頭低於軀幹，於肩胛骨間叩擊 5 下，兩乳頭連線下壓胸 5 下", "雙手環抱張小弟腰部，於劍突下連續向上推擠 5 下"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-42", "explanation": "8 個月大嬰兒為異物哽塞且仍有意識時，應採頭低於軀幹、於兩肩胛骨間拍擊背部 5 下，再翻轉於兩乳頭連線下方壓胸 5 下，交替執行，故選 C。不可盲目以手指挖取異物（恐推入更深）；哈姆立克腹部推擠法不適用於 1 歲以下嬰兒。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 43, "stem": "有關遭受性虐待後之兒童可能出現的行為表現，下列敘述何者不適當？", "options": ["害怕獨處，討厭他人碰觸身體", "出現複雜或不合宜的性知識概念", "攻擊性強，說謊行為，但無身體發展遲滯", "情緒沮喪退縮，對他人充滿敵意、不信任"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-43", "explanation": "本題選不適當。遭受性虐待的兒童常伴隨生長遲滯、體重不增等身體發展問題，「但無身體發展遲滯」之敘述不適當，故選 C。害怕碰觸、出現超齡的性知識、情緒退縮與不信任他人皆為典型行為表現。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 44, "stem": "有關新生兒搖晃症候群（Shaken Baby Syndrome）的敘述，下列何者錯誤？", "options": ["屬於兒童虐待行為表現之一，須要通報", "因外力劇烈晃動所造成，是一種可逆的傷害", "初期會有嗜睡或煩躁不安", "抱起新生兒時，應該給予頭頸部適當支撐"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-44", "explanation": "本題選錯誤。搖晃嬰兒症候群造成的腦部損傷（硬腦膜下出血、視網膜出血、瀰漫性軸突損傷）為「不可逆」傷害，甚至可致死或留下永久神經後遺症，故 B 錯誤。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 45, "stem": "林小弟，1 個月大，剛確診膽道閉鎖，父母正為是否接受手術猶豫不決。根據以家庭為中心的兒科護理特色，下列何者最適當？", "options": ["為避免父母擔憂害怕，儘量減少開刀風險相關的訊息提供", "利用圖片、影片與模型向病童父母解說治療的選擇", "病童母親認為因懷孕時動到胎神，護理師應向母親說明絕無此事", "由父母決定選擇，醫護人員不參與，增加父母自主性"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-45", "explanation": "以家庭為中心的照護強調提供充分且易懂的資訊以支持家庭決策，利用圖片、影片與模型解說治療選擇最適當，故選 B。減少風險訊息違反知情同意；直接否定民俗信念缺乏文化敏感度；醫護完全不參與決策則失去專業支持的角色。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 46, "stem": "兒科護理重視以家庭為中心的照護，有關其基本觀念之一「賦權（empowerment）」的定義，下列敘述何者正確？", "options": ["治療兒童疾病需考量健康提供者、病童及父母親的相互利益，以滿足家庭成員需求", "醫療人員與家庭互動過程中，讓家庭成員獲得自我控制感，進而增加優勢、能力及行動", "由護理師扮演兒童發言人，讓家庭對兒童的健康需求有所認知", "專業人員使用高科技輔助溝通，使兒童及其家庭減輕其壓力，讓傷害降低"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-46", "explanation": "賦權（empowerment）指醫療人員與家庭互動過程中，協助家庭成員獲得自我控制感，進而增強其優勢、能力與行動力，故選 B。A 為以家庭為中心照護的相互性概念；C 為代言者角色；D 屬科技輔助溝通，皆非賦權的定義。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 47, "stem": "一般 2 歲兒童的生長發育，下列敘述何者錯誤？", "options": ["前囟門已閉合，且胸圍大於頭圍", "腹式呼吸，速率約 15～20 次／分", "腎絲球過濾率約達成人標準", "已長出側門齒和第一大臼齒"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-47", "explanation": "本題選錯誤。2 歲兒童仍以腹式呼吸為主，但呼吸速率約為 20～30 次／分，15～20 次／分過慢，故 B 錯誤。此年齡前囟門已閉合（約 12～18 個月）、胸圍大於頭圍、腎絲球過濾率接近成人、乳齒已長出側門齒與第一大臼齒。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 48, "stem": "臨床上可以和嬰幼兒玩躲貓貓遊戲，轉移害怕的注意力，主要是利用其已發展何種概念？", "options": ["保留概念（conservation）", "符號功能（symbolic function）", "物體恆存（object permanence）", "視覺暫存（persistence of vision）"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-48", "explanation": "躲貓貓遊戲之所以能吸引嬰幼兒並轉移害怕，是因其已建立物體恆存（object permanence）概念，知道物體被遮住仍然存在，故選 C。保留概念屬具體運思期；符號功能屬前運思期。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 49, "stem": "小苗，5 歲，因小腿蜂窩性組織炎住院接受治療，護理師在進行「兒童疼痛概念」發展之評估時，下列敘述何者最適當？", "options": ["小苗會擔心自己的腳無法走路且害怕被截肢", "小苗認為，吹吹痛痛的地方，疼痛就會像魔術般的消失", "小苗可以正向應用其生活經驗調適疼痛", "小苗可以說出蜂窩性組織炎造成自己疼痛的原因"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-49", "explanation": "5 歲屬前運思期，具魔術性思考，會認為「吹吹痛痛的地方，疼痛就會像魔術般消失」，故選 B。擔心截肢、正向運用生活經驗調適、說出病因與疼痛的因果關係，皆為學齡期以上兒童的疼痛認知。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 50, "stem": "有關對於兒童疼痛控制的敘述，下列何者正確？", "options": ["meperidine 用於癌末疼痛控制，但不適合人工血管術後病童", "naloxone 為鴉片類藥物拮抗劑，可緩解呼吸抑制的副作用", "morphine 為鴉片類製劑，常使用於開刀後病童的疼痛控制", "acetaminophen 易產生耐受性，故不建議於兒科疼痛的控制"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-50", "explanation": "naloxone 為鴉片類藥物的拮抗劑，可緩解過量造成的呼吸抑制，故選 B。meperidine 因代謝物具神經毒性不建議用於癌末長期疼痛控制；acetaminophen 不易產生耐受性，是兒科常用的第一線止痛退燒藥；morphine 用於術後疼痛之敘述雖正確，但本題以 B 為最完整正確之選項。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 51, "stem": "正常新生兒消化系統特徵的敘述，下列何者錯誤？", "options": ["唾液的分泌量少", "賁門括約肌不成熟", "胃排空時間約 6 小時", "出生後 24 小時內排出胎便"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-51", "explanation": "本題選錯誤。新生兒胃排空時間約為 2～3 小時，並非 6 小時，故 C 錯誤。唾液分泌量少、賁門括約肌不成熟（易溢奶）、出生後 24 小時內排出胎便皆為正常特徵。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 52, "stem": "有關病童約束的原則，下列何者錯誤？", "options": ["有醫囑和家屬同意書時，才能執行約束", "須確保約束肢端的皮膚完整性", "每隔 2 小時要評估約束的狀況", "木乃伊約束是嬰兒常用的約束法之一"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-52", "explanation": "本題選錯誤。約束期間應每 15～30 分鐘評估約束肢端的血液循環、皮膚完整性與約束鬆緊度，每 2 小時則是鬆開活動關節的頻率，故 C 敘述錯誤。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 53, "stem": "小方，進入瀕臨死亡狀態，有關瀕死的生命跡象，下列何者最不適當？", "options": ["失去理智且意識混亂", "失去大小便的控制能力", "呼吸型態改變（潮式呼吸法：Cheyne-Stokes respiration）", "快速且強而有勁的脈搏"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-53", "explanation": "本題選最不適當。瀕死病人因心輸出量下降，脈搏呈現「快而弱」甚至細弱不規則，並非快速而強勁有力，故 D 最不適當。意識混亂、大小便失禁、潮式呼吸皆為瀕死徵象。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 54, "stem": "早產兒口、鼻、氣管內管分泌物多，必要時應予抽吸，下列敘述何者正確？", "options": ["抽吸順序為①鼻 ②口 ③氣管內管", "抽吸管大小為 5～8 Fr.", "抽吸壓力不可超過 60 mmHg", "氣管內管抽吸一次約 20 秒"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-54", "explanation": "早產兒抽吸應選用 5～8 Fr. 的抽吸管，故選 B。抽吸順序為氣管內管→口腔→鼻腔（先無菌後污染）；抽吸壓力約 60～100 mmHg；氣管內管單次抽吸時間應在 5～10 秒內，20 秒過久易致缺氧與心搏過緩。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 55, "stem": "有關新生兒胎便吸入症候群的敘述，下列何者錯誤？", "options": ["早產兒較常發生，主因是在子宮內缺氧", "黏稠的胎便可能阻塞呼吸道", "可能肺泡過度擴張，甚至破裂造成氣胸", "呼吸窘迫的症狀通常在出生後很快就出現"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-55", "explanation": "本題選錯誤。胎便吸入症候群好發於「足月兒與過期產兒」，早產兒因胎便尚未形成反而少見，故 A 錯誤。子宮內窘迫缺氧使肛門括約肌鬆弛而排出胎便，黏稠胎便阻塞呼吸道可致肺泡過度擴張破裂形成氣胸，症狀多於出生後很快出現。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 56, "stem": "依據娜姬（Nagy）的理論，9 歲兒童對死亡的概念為何？", "options": ["死亡是暫時的", "會探索死亡的靈性意義", "生物體死亡後無法復活", "相信死亡只會發生在老人身上"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-56", "explanation": "依娜姬（Nagy）的理論，9 歲（9 歲以上）兒童已能理解死亡是普遍、不可逆的，知道生物體死亡後無法復活，故選 C。3～5 歲認為死亡是暫時可逆的；5～9 歲則常將死亡擬人化，認為死亡只發生在被死神抓走或年老的人身上。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 57, "stem": "有關早產兒呼吸窘迫症候群的醫療處置，下列何者錯誤？", "options": ["使用氧氣頭罩（O2 hood）時氧氣流量必須大於 5 L/min，以避免二氧化碳滯留", "使用持續性呼吸正壓法（CPAP）壓力為 8～12 cmH2O，以防止呼氣時肺泡塌陷", "持續性呼吸正壓法（CPAP）使用於有自發性呼吸的早產兒", "使用持續性呼吸正壓法（CPAP）後仍有呼吸窘迫的早產兒，需插入氣管內管使用呼吸器"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-57", "explanation": "本題選錯誤。持續性呼吸正壓法（CPAP）常用壓力約為 4～8 cmH₂O，8～12 cmH₂O 過高易致氣胸，故 B 錯誤。氧氣頭罩流量需大於 5 L/min 以避免二氧化碳滯留、CPAP 用於有自發性呼吸者、失敗後改插管使用呼吸器，皆為正確處置。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 58, "stem": "有關嬰兒猝死症候群的預防措施，下列敘述何者最不適當？", "options": ["嬰兒睡眠姿勢建議採取仰睡", "嬰兒床應避免放置任何鬆軟物件", "奶嘴不可懸掛在嬰兒頸部或衣物上", "小於 3 個月的嬰兒，最好與父母同床睡眠"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-58", "explanation": "本題選最不適當。為預防嬰兒猝死症候群，建議親子「同室不同床」，與父母同床會增加窒息與壓迫風險，故 D 最不適當。仰睡、嬰兒床避免鬆軟物件、奶嘴不可懸掛於頸部或衣物上皆為正確措施。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 59, "stem": "有關川崎氏症的護理指導，下列敘述何者不適當？", "options": ["注射免疫球蛋白 2 個月後，要按時接種疫苗", "退燒後仍需依醫囑服用低劑量的 Aspirin", "飲食採少量多餐和提供軟質的食物", "出院後需定期回院追蹤檢查心臟功能"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-59", "explanation": "本題選不適當。注射免疫球蛋白後，因被動抗體會干擾疫苗免疫反應，活性減毒疫苗（如 MMR、水痘）應延後至少 11 個月再接種，2 個月後接種並不適當，故選 A。退燒後仍需依醫囑服用低劑量 Aspirin、少量多餐軟質飲食、定期追蹤心臟功能（冠狀動脈瘤）皆正確。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 60, "stem": "小雄，9 歲，因抽搐發作住院接受檢查，當護理師以腦波檢查的相關圖片及故事，解說檢查的流程及相關注意事項並澄清小雄的錯誤觀念時，此為下列何種治療性遊戲？", "options": ["指導性遊戲", "生理健康促進性遊戲", "情緒宣洩性遊戲", "戲劇性遊戲"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-60", "explanation": "以圖片與故事解說檢查流程、澄清錯誤觀念，屬於「指導性遊戲」（instructional play），故選 A。生理健康促進性遊戲用於促進生理功能（如吹泡泡）；情緒宣洩性遊戲讓病童宣洩情緒；戲劇性遊戲則由病童扮演角色演出。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 61, "stem": "小凱，5 歲，入院診斷為右下肺葉肺炎，急性期發生呼吸窘迫症狀，下列護理措施何者較不適當？", "options": ["維持補充體液，且監測及記錄尿量", "維持組織氧合，給予氧氣、擺位、通氣及抽吸", "預防感染，並治療潛在疾病", "協助採左側臥，以緩解疼痛"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-61", "explanation": "本題選較不適當。右下肺葉肺炎應採「患側臥」（右側臥），使患側受壓以減少疼痛並利於健側肺擴張，協助採左側臥並不適當，故選 D。補充體液監測尿量、維持組織氧合、預防感染與治療潛在疾病皆為正確措施。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 62, "stem": "小佩，3 歲，因長期出現扁桃腺發炎，此次住院欲進行扁桃腺切除手術，有關手術後護理措施，下列敘述何者正確？", "options": ["出現清喉嚨或吞嚥次數增加，應視為早期出血警訊", "鼓勵採平躺姿勢，以利分泌物引流", "鼓勵進食西瓜汁、番茄汁等冰冷飲料，以減輕疼痛", "鼓勵用力擤鼻涕，清除口咽內分泌物"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-62", "explanation": "扁桃腺切除術後若出現頻繁清喉嚨或吞嚥次數增加，代表血液流入咽部而不自覺吞下，為早期出血警訊，故選 A。術後應採側臥或俯臥利分泌物引流；應避免紅色飲料（混淆出血判斷）與酸性刺激；且不可用力擤鼻涕以免出血。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 63, "stem": "陳小弟，7 個月大，因高燒、聲音出現狗吠聲而入院，經醫師診斷為哮吼（croup），有關哮吼的護理措施，下列敘述何者錯誤？", "options": ["給予充足的水分與適當的營養", "給予抽痰協助分泌物排出", "觀察有無呼吸窘迫現象，如心跳加快、鼻翼搧動、胸骨凹陷等", "如醫師開立 Flixotide 蒸氣吸入後，應協助病童漱口以預防感染"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-63", "explanation": "本題選錯誤。哮吼病童喉部黏膜腫脹敏感，抽痰的刺激可能誘發喉痙攣導致完全阻塞，故 B 錯誤。應給予充足水分與營養、密切觀察呼吸窘迫徵象、使用吸入型類固醇後協助漱口預防口腔念珠菌感染。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 64, "stem": "小華，診斷主動脈狹窄（Coarctation of Aorta）入院，有關其身體評估之敘述，下列何者最適當？", "options": ["易有暈眩、流鼻血、心搏過速等症狀", "下肢因血流增加，而溫度較高", "頸動脈搏動變弱", "下肢血壓會高於上肢血壓"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-64", "explanation": "主動脈狹窄使狹窄處近端（上半身）血壓升高，故易出現頭暈、頭痛、流鼻血與心搏過速，選 A。下肢因血流減少而溫度較低、脈搏微弱、血壓低於上肢；頸動脈搏動反而增強。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 65, "stem": "王小弟，心室中膈缺損（VSD），出現充血性心衰竭的症狀，呼吸喘，費力，請問採那個姿勢較舒適？", "options": ["趴睡", "側睡", "垂頭俯臥", "半坐臥"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-65", "explanation": "心室中膈缺損併充血性心衰竭而呼吸費力時，應採半坐臥姿勢，使橫膈下降、增加胸腔容積並減少靜脈回流，故選 D。（嬰兒可採膝屈曲的半坐臥或抱坐姿勢。）"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 66, "stem": "有關兒童心導管檢查的各腔室含氧飽和度，下列敘述何者異常？", "options": ["右心房含氧飽和度 70～75%", "肺靜脈含氧飽和度 70～75%", "主動脈含氧飽和度 95～98%", "左心房含氧飽和度 95～98%"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-66", "explanation": "本題選異常。肺靜脈攜帶自肺臟氧合後的血液回左心房，含氧飽和度應為 95～98%，70～75% 屬異常，故選 B。右心房 70～75%、主動脈與左心房 95～98% 皆為正常值。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 67, "stem": "有關尚未接受治療之缺鐵性貧血（iron deficiency anemia）及地中海型貧血（thalassemia）病童血液檢驗之敘述，下列何者正確？", "options": ["缺鐵性貧血病童之平均血球血紅素（MCH）低於正常；地中海型貧血病童則正常", "缺鐵性貧血病童之平均血球容積（MCV）正常；地中海型貧血病童則低於正常", "缺鐵性貧血病童之血清鐵質降低；地中海型貧血病童鐵蛋白（ferritin）則上升", "兩者病童發病時間皆常見於 6～24 個月大"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-67", "explanation": "缺鐵性貧血與地中海型貧血的發病時間皆常見於 6～24 個月大（此時來自母體的鐵質耗竭、胎兒血紅素轉換完成），故選 D。兩者的 MCH 與 MCV 皆低於正常（小球性低血紅素貧血）；缺鐵性貧血血清鐵與鐵蛋白降低，地中海型貧血則因反覆輸血而鐵蛋白上升。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 68, "stem": "有關血友病關節血腫的臨床表徵，最常發生於何部位？", "options": ["腕關節", "肘關節", "踝關節", "膝關節"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-68", "explanation": "血友病關節血腫最常發生於膝關節，其次為肘關節與踝關節，故選 D。反覆出血會造成慢性關節病變與變形，急性期應採 RICE 原則並輸注凝血因子。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 69, "stem": "小良，4 歲，身高 90 公分，患有生長素缺乏（growth hormone deficiency），有關護理措施，下列敘述何者不適當？", "options": ["應以小良發展年齡的方式與其互動，以促進正向發展", "建議發掘小良較優勢的能力，而非靠身高取勝的活動", "建議母親在家中須每日早上起床時為小良注射生長素", "生長素的注射部位可以選擇腹部及大腿，採皮下注射"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-69", "explanation": "本題選不適當。生長激素應於「睡前」注射，以模擬生理性夜間分泌高峰，早上起床時注射並不適當，故選 C。以發展年齡互動、發掘非身高取勝的優勢能力、選擇腹部及大腿皮下注射皆為適當措施。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 70, "stem": "小華，11 歲，診斷為副甲狀腺功能低下，下列護理照護措施之敘述，何者較不適當？", "options": ["身材矮小、圓臉和短脖子會影響小華的身體心像，鼓勵支持小華的興趣發展", "若緊急出現低血鈣時，可以靜脈注射葡萄糖鈣（calcium gluconate）", "發生強直性痙攣時，應維持呼吸道通暢和注意安全", "服用高劑量的維他命 A"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-70", "explanation": "本題選較不適當。副甲狀腺功能低下造成低血鈣、高血磷，治療應補充鈣質與「維生素 D」以促進鈣吸收，服用高劑量維他命 A 並無助益且有中毒之虞，故 D 較不適當。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 71, "stem": "小奇，10 歲，診斷為第一型糖尿病，有關運動的護理指導，下列敘述何者較不適當？", "options": ["建議運動時隨身攜帶糖果或果汁", "鼓勵進行游泳、慢跑等有氧運動", "建議養成每日睡前運動的習慣", "提醒注射胰島素 60～90 分鐘後再運動"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-71", "explanation": "本題選較不適當。睡前運動易造成夜間及清晨低血糖，第一型糖尿病童不宜養成每日睡前運動的習慣，故選 C。運動時攜帶糖果或果汁備用、進行有氧運動、注射胰島素後待作用高峰前再運動皆屬正確指導。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 72, "stem": "有關新生兒篩檢的敘述，下列何者錯誤？", "options": ["透過篩檢可早期發現和治療先天代謝異常的疾病", "採血位置為兩腳後足跟外側", "於新生兒出生滿 24 小時，或已完全由腸道進食 12 小時後採檢", "初步報告疑陽性者，由負責採集機構通知家長帶個案進行複檢"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-72", "explanation": "本題選錯誤。我國新生兒篩檢採檢時機為出生滿 48 小時後（或完全由腸道進食滿 24 小時後），滿 24 小時採檢過早易出現偽陰性，故 C 錯誤。採血位置為足跟外側、疑陽性由採集機構通知複檢皆正確。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 73, "stem": "乳糜瀉（celiac disease）是對蛋白質中的麩質過敏而導致吸收不良的疾病，下列何種食物不適合麩質過敏的兒童食用？", "options": ["燕麥片", "玉米", "米飯", "蛋"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-73", "explanation": "麩質存在於小麥、大麥、黑麥與燕麥中，故乳糜瀉病童不適合食用燕麥片，選 A。玉米、米飯與蛋皆不含麩質，可安心食用。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 74, "stem": "咚咚，4 個月大，疑似泌尿道感染（urinary tract infection）住院，經排尿性膀胱尿道攝影（Voiding cystourethrogram, VCUG）檢查，確認為第三級，下列敘述何者正確？", "options": ["屬輕微的尿液逆流，不需治療會自行痊癒", "出院後每 3 個月做 1 次尿液培養至少 1 年", "宜限制水分攝取，避免發生低血鉀", "安排開刀，避免尿液大量逆流，造成腎臟損傷"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-74", "explanation": "第三級膀胱輸尿管逆流屬中度，以預防性抗生素及定期追蹤的保守治療為主，出院後應每 3 個月做 1 次尿液培養並持續至少 1 年，故選 B。第一、二級才多可自行痊癒；不可限制水分（應多喝水沖洗尿路）；手術多保留給第四、五級或保守治療失敗者。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 75, "stem": "有關先天性巨結腸症的臨床表徵，下列敘述何者錯誤？", "options": ["出生 24 小時內無法排出胎便", "新生兒時有嘔吐現象且嘔吐物不含膽汁", "嬰兒期時有難以進食及生長遲滯之狀況", "兒童期有慢性便秘且呈現絲帶狀糞便"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-75", "explanation": "本題選錯誤。先天性巨結腸症因遠端腸段阻塞，嘔吐物「含」膽汁（呈綠色），故 B 錯誤。出生 24 小時內無法排出胎便、嬰兒期進食困難與生長遲滯、兒童期慢性便秘並解出絲帶狀糞便，皆為典型表現。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 76, "stem": "小華，5 歲，罹患腎病症候群（nephrotic syndrome），全身出現水腫。為預防因水腫可能產生的皮膚完整性受損，下列護理指導何者不適當？", "options": ["選擇寬鬆通風的棉質衣服", "適當地支托身體可減輕水腫及增加舒適感", "避免經常更換姿勢導致皮膚摩擦受損", "保持皮膚及皺摺處的清潔與乾燥"], "answer": "C", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-76", "explanation": "本題選不適當。水腫病童應「經常」更換姿勢以避免局部持續受壓造成皮膚受損，「避免經常更換姿勢」的指導不適當，故選 C。寬鬆棉質衣物、適當支托身體、保持皮膚與皺摺處清潔乾燥皆為正確措施。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 77, "stem": "妙妙，5 個月大，因發展性髖關節發育不良（developmental dysplasia of the hip）入院，進行髖部人字形石膏固定，有關石膏固定之出院護理，下列敘述何者不適當？", "options": ["餵食時，盡可能採用坐姿或仰臥並抬頭抬高，以預防受嗆", "當因石膏內皮膚發癢不適而哭鬧，協助以長竹棍伸入抓癢減輕不適", "多給予撫觸、擁抱，利用玩具分散注意，以減輕不適", "經常更換尿布，以防石膏受糞便污染"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-77", "explanation": "本題選不適當。石膏內發癢時絕不可將長竹棍等硬物伸入抓癢，以免刮傷皮膚造成感染或異物殘留，應改以冷風吹入緩解，故選 B。餵食時採坐姿或抬高頭部預防嗆咳、多給予撫觸擁抱與玩具分散注意、勤換尿布防污染皆正確。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 78, "stem": "小薇，13 歲，經檢查發現脊柱側彎角度 30 度，確診為脊柱側彎，有關醫療及護理措施，下列何者正確？", "options": ["除洗澡及睡覺之外，都需穿著背架", "需持續穿著背架直到骨成熟為止", "需同步接受脊柱融合術", "穿著背架時才可進行較劇烈的球類運動"], "answer": "B", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-78", "explanation": "脊柱側彎角度 25～40 度需穿著背架，且應持續穿著直到骨骼成熟（生長板閉合）為止，故選 B。背架原則上每日穿著 20～23 小時，僅洗澡時脫下；脊柱融合術用於側彎大於 45～50 度者；穿著背架時不宜進行劇烈運動。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 79, "stem": "有關成骨不全（osteogenesis imperfecta）病變的護理措施，下列敘述何者錯誤？", "options": ["鼓勵儘量固定不動以避免多重骨折", "使用雙磷化合物降低骨折頻率", "固定不動時宜在健側多做運動", "可做骨髓內固定以增強骨的強度"], "answer": "A", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-79", "explanation": "本題選錯誤。成骨不全病童應在保護下維持適度活動以促進骨骼與肌肉強度，長期固定不動反而加重骨質流失與骨折風險，故 A 錯誤。使用雙磷酸鹽降低骨折頻率、固定期間於健側運動、骨髓內固定增強骨強度皆為正確措施。"}, {"year": "111", "session": "第一次", "subject": "產兒科護理學", "num": 80, "stem": "張小妹，10 歲，罹患腦膜炎，出現顱內壓增高（Increased intracranial pressure, IICP），下列護理措施何者不適當？", "options": ["監測有無便秘情形", "監測有無噴射式嘔吐、認知改變", "避免執行頭低腳高的姿位引流", "執行背部扣擊或抽痰，以利呼吸道通暢"], "answer": "D", "subjectCode": "4104", "subjectShort": "產兒科", "id": "111-1-4104-80", "explanation": "本題選不適當。背部扣擊與抽痰會使胸內壓與顱內壓上升，顱內壓增高的病童應避免，故選 D。監測便秘（用力解便會升高顱內壓）、觀察噴射式嘔吐與認知改變、避免頭低腳高的姿位引流皆為正確措施。"}];
</script>
<script>
const SUBJECTS = [
  {name:'內外科護理學', short:'內外科', code:'3104', color:'var(--s1)'},
  {name:'基本護理學',   short:'基本',   code:'2104', color:'var(--s2)'},
  {name:'基礎醫學',     short:'基礎醫學',code:'1104', color:'var(--s3)'},
  {name:'產兒科護理學', short:'產兒科', code:'4104', color:'var(--s4)'},
  {name:'精神科與社區衛生護理學', short:'精神社區', code:'5104', color:'var(--s5)'},
];
const subjByName = Object.fromEntries(SUBJECTS.map(s=>[s.name,s]));
const examKey = i => i.year+'-'+i.session;
const SESSION_ORD = {'第一次':1, '第二次':2, '第三次':3};
const sessOrd = s => SESSION_ORD[s] || 99;
const EXAMS = [...new Set(BANK.map(examKey))]
  .sort((a,b)=>{const[ay,as]=a.split('-'),[by,bs]=b.split('-');
    return ay===by ? sessOrd(bs)-sessOrd(as) : by-ay;})
  .map(k=>{const[y,s]=k.split('-'); return {key:k, year:y, session:s, label:y+' '+s};});
const SKEY='nrsQuiz_v2';
const BUILD='2026-08-01c';
const LETTERS=['A','B','C','D'];
const BANK_BY_ID = Object.fromEntries(BANK.map(i=>[i.id,i]));

function load(){ try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return {}} }
function save(){ localStorage.setItem(SKEY, JSON.stringify(store)); }
let store = load();
if(!store.records) store.records = {};
if(!store.starred) store.starred = {};
if(!store.settings) store.settings = {subject:'all', exam:'all', mode:'seq', timed:false};
if(store.settings.timed===undefined) store.settings.timed=false;
if(!store.settings.exam) store.settings.exam='all';
if(store.settings.exam!=='all' && !EXAMS.some(e=>e.key===store.settings.exam)) store.settings.exam='all';
if(!store.ui) store.ui = {reviewTab:'wrong'};
if(!store.ui.openExams) store.ui.openExams = {};

function isCorrect(item, letter){ return item.answer.includes(letter); }
function rec(id){ return store.records[id]; }
function answeredCount(list){ return list.filter(i=>rec(i.id)).length; }
function correctCount(list){ return list.filter(i=>{const r=rec(i.id);return r&&r.correct}).length; }
function rate(list){ const a=answeredCount(list); return a? Math.round(correctCount(list)/a*100):0; }
function wrongList(){ return BANK.filter(i=>{const r=rec(i.id);return r&&!r.correct}); }
function starredList(){ return BANK.filter(i=>store.starred[i.id]); }
function bySubject(name){ return BANK.filter(i=>i.subject===name); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; }
function fmtTime(ms){ const s=Math.floor(ms/1000); const m=Math.floor(s/60); return (m<10?'0':'')+m+':'+((s%60)<10?'0':'')+(s%60); }

let view='home';
let session=null;   // {list, idx, mode, title, color, timed, startTime, answers:{}, endTime}
let clockTimer=null;

/* ── 續作進度（存進 localStorage 的 store.session）───────────────
   只存題目 id 陣列而非整包題目物件，避免 localStorage 爆量；
   計時模式存累計 elapsed，續作時再回推 startTime。               */
function persistSession(){
  if(!session || session.endTime) return;
  store.session = {
    ids:      session.list.map(i=>i.id),
    idx:      session.idx,
    mode:     session.mode,
    title:    session.title,
    color:    session.color,
    timed:    !!session.timed,
    elapsed:  Date.now() - session.startTime,
    answers:  session.answers,
    showExpl: session.showExpl,
    savedAt:  Date.now()
  };
}
function clearSavedSession(){ if(store.session){ delete store.session; save(); } }
function dropSavedSession(){
  if(confirm('要放棄上次未完成的練習嗎？（已作答的紀錄與統計不會消失）')){
    clearSavedSession(); render();
  }
}
/* 讀回上次的練習，題庫更新後找不到的題目自動略過 */
function savedSessionInfo(){
  const s = store.session;
  if(!s || !Array.isArray(s.ids) || !s.ids.length) return null;
  const list = s.ids.map(id=>BANK_BY_ID[id]).filter(Boolean);
  if(list.length < 2) return null;
  const ans = s.answers || {};
  const answered = list.filter(it => it.id in ans).length;
  /* 續作點以「本回第一題還沒作答的題目」為準，不用最後瀏覽到的題號；
     這樣只翻頁看題、沒有作答，續作時仍會回到該作答的地方。 */
  let idx = list.findIndex(it => !(it.id in ans));
  if(idx < 0) idx = list.length - 1;          // 全部答完
  const viewedIdx = Math.min(Math.max(0, s.idx|0), list.length-1);
  return {raw:s, list, idx, viewedIdx, answered};
}
function resumeSession(from){
  const info = savedSessionInfo();
  if(!info){ clearSavedSession(); render(); return; }
  const s = info.raw;
  const startIdx = (from==='start') ? 0
                 : (from==='viewed') ? info.viewedIdx
                 : info.idx;
  session = {
    list:info.list, idx:startIdx, mode:s.mode, title:s.title,
    color:s.color || 'var(--accent)', timed:!!s.timed,
    startTime: Date.now() - (s.elapsed||0),
    answers:  s.answers  || {},
    showExpl: s.showExpl || {},
    endTime:null
  };
  view='quiz';
  persistSession(); save();
  render();
}
function fmtAgo(ts){
  if(!ts) return '';
  const m = Math.floor((Date.now()-ts)/60000);
  if(m < 1)    return '剛剛';
  if(m < 60)   return m+' 分鐘前';
  const h = Math.floor(m/60);
  if(h < 24)   return h+' 小時前';
  const d = Math.floor(h/24);
  return d < 30 ? d+' 天前' : '很久以前';
}
/* 循序模式：從第一題還沒作答的題目開始（store.session 遺失時的第二層保險） */
function firstUnansweredIdx(list){
  const i = list.findIndex(it => !rec(it.id));
  return i < 0 ? 0 : i;
}

const screen=document.getElementById('screen');
function render(){
  if(view!=='quiz') stopClock();
  if(view==='home') renderHome();
  else if(view==='practice') renderPractice();
  else if(view==='quiz') renderQuiz();
  else if(view==='review') renderReview();
  else if(view==='stats') renderStats();
  renderNav();
  scrollTop();
}

/* .app 為 min-height 版面，實際捲動的是整個頁面而非 .screen，
   故兩者都要歸零；再用 rAF 補一次，避免 iOS 在重繪後還原捲動位置。 */
function scrollTop(){
  const reset=()=>{
    screen.scrollTop=0;
    if(document.scrollingElement) document.scrollingElement.scrollTop=0;
    window.scrollTo(0,0);
  };
  reset();
  requestAnimationFrame(reset);
}

/* HOME */

    const cur = rs.list[rs.idx];

    h += `<div class="eyebrow">繼續上次練習</div>
    <div class="card" style="border-left:4px solid ${col}">

      <div class="tiny" style="margin-top:9px;color:var(--ink2)">接著從第 ${rs.idx+1} 題開始（原卷第 ${cur.num} 題・${esc(cur.subject)}）</div>
      ${viewedNote}
      <button class="btn sm" style="margin-top:11px;background:${col}" onclick="resumeSession()">繼續作答</button>
      <div style="display:flex;gap:10px;margin-top:9px">
        <button class="btn ghost sm" style="flex:1" onclick="resumeSession('start')">從第一題開始</button>
        <button class="btn ghost sm" style="flex:1" onclick="dropSavedSession()">放棄</button>
      </div>
    </div>`;
  }
  h += `<div class="eyebrow">學習概況</div>
  <div class="stat-row">
    <div class="stat"><div class="n">${ans}<span style="font-size:16.5px;color:var(--muted)">/${total}</span></div><div class="l">已作答</div></div>
    <div class="stat"><div class="n">${r}<span style="font-size:16.5px;color:var(--muted)">%</span></div><div class="l">答對率</div></div>
    <div class="stat"><div class="n" style="color:var(--no-ink)">${w}</div><div class="l">錯題數</div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;font-size:15.5px;color:var(--ink2);font-weight:600"><span>總進度</span><span>${ans}/${total}</span></div>
    <div class="progress"><i style="width:${total?ans/total*100:0}%"></i></div>
  </div>
  `;
  EXAMS.forEach(e=>{
    const eList=BANK.filter(i=>examKey(i)===e.key);
    const eA=answeredCount(eList), eR=rate(eList);
    const open=!!store.ui.openExams[e.key];
    h+=`<button class="exam-head ${open?'open':''}" onclick="toggleExam('${e.key}')">
      <span class="exam-main">
        <span class="exam-title">${e.year} 年<span>${e.session}</span></span>
        <span class="exam-meta">${eList.length} 題・已作答 ${eA}${eA?'・答對率 '+eR+'%':''}</span>
        <span class="progress"><i style="width:${eList.length?eA/eList.length*100:0}%"></i></span>
      </span>
      <span class="exam-arrow">${svg('<path d="M6 9l6 6 6-6"/>')}</span>
    </button>`;
    if(!open) return;
    h+=`<div class="exam-body">`;
    SUBJECTS.forEach(s=>{
      const list=eList.filter(i=>i.subject===s.name);
      if(!list.length) return;
      const a=answeredCount(list), rr=rate(list);

        <span class="dot" style="background:${s.color}"></span>

          <span class="sub"><span>${list.length} 題</span><span>已作答 ${a}</span></span>
          <span class="mini-prog"><i style="width:${a/list.length*100}%;background:${s.color}"></i></span>

  });
  h+=`<div style="height:6px"></div>
