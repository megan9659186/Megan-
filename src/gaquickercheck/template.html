/* ---------- 表格左右捲動指示條(常駐顯示)---------- */
let RAIL_DRAG = null;
let RAIL_GLOBAL_BOUND = false;

function railBindGlobal(){
  if(RAIL_GLOBAL_BOUND) return;
  RAIL_GLOBAL_BOUND = true;
  const move = e => {
    if(!RAIL_DRAG) return;
    const d = RAIL_DRAG;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const max = d.sc.scrollWidth - d.sc.clientWidth;
    const track = d.rail.clientWidth - d.thumb.offsetWidth;
    if(track > 0 && max > 0) d.sc.scrollLeft = d.left0 + (x - d.x0) * (max / track);
  };
  const up = () => { RAIL_DRAG = null; };
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, { passive:true });
  document.addEventListener("mouseup", up);
  document.addEventListener("touchend", up);
  document.addEventListener("touchcancel", up);
}

function initScrollRails(){
  railBindGlobal();
  document.querySelectorAll(".tool-scroll").forEach(sc => {
    let rail = sc.nextElementSibling;
    if(!rail || !rail.classList || !rail.classList.contains("scroll-rail")){
      rail = document.createElement("div");
      rail.className = "scroll-rail";
      rail.innerHTML = `<div class="scroll-thumb"></div>`;
      sc.parentNode.insertBefore(rail, sc.nextSibling);
    }
    const thumb = rail.querySelector(".scroll-thumb");
    const sync = () => {
      const max = sc.scrollWidth - sc.clientWidth;
      if(max <= 2){ rail.classList.add("off"); return; }
      rail.classList.remove("off");
      const w = Math.max((sc.clientWidth / sc.scrollWidth) * 100, 14);
      thumb.style.width = w + "%";
      thumb.style.left = ((sc.scrollLeft / max) * (100 - w)) + "%";
    };
    if(!sc.dataset.railed){
      sc.dataset.railed = "1";
      sc.addEventListener("scroll", sync, { passive:true });
      const start = e => {
        const max = sc.scrollWidth - sc.clientWidth;
        if(max <= 2) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const tb = thumb.getBoundingClientRect();
        /* 直接點軌道任一處:先把滑塊移過去再開始拖曳 */
        if(x < tb.left || x > tb.right){
          const rb = rail.getBoundingClientRect();
          const track = rail.clientWidth - thumb.offsetWidth;
          if(track > 0){
            const p = Math.min(Math.max((x - rb.left - thumb.offsetWidth/2) / track, 0), 1);
            sc.scrollLeft = p * max;
            sync();
          }
        }
        RAIL_DRAG = { sc, rail, thumb, x0:x, left0:sc.scrollLeft };
        if(e.cancelable) e.preventDefault();
      };
      rail.addEventListener("mousedown", start);
      rail.addEventListener("touchstart", start, { passive:false });
      window.addEventListener("resize", sync);
    }
    sync();
    setTimeout(sync, 80);
  });
}

   字串用雙引號,內文不可再出現雙引號;class 一律單引號;

    return `

      <button class="set-back" type="button" id="criBack">← 回危機處理列表</button>
      ${crisisCardHtml(open)}
      ${warn}
    </div>`;
  }

  return `
  <div class="tool-wrap">
    <div>
      <div class="tool-head">危機處理速查${cNew}</div>
      <div class="tool-sub">術中緊急狀況的辨識重點、立即處置順序與關鍵劑量。點選項目才會展開該項內容。</div>
    </div>

    ${warn}

    ${crisisGroups().map(g => `
      <div>
        <div class="cri-group">${g}</div>
        ${CRISIS.filter(c => c.group === g).map(c => `
          <div class="cri-item ${isChecked(c)?'':'unchecked'}" data-go="${c.id}">
            <div class="ci-name">${c.name}</div>
            <div class="ci-en">${c.en}</div>
            ${c.key ? `<div class="ci-key">${c.key}</div>` : ""}
          </div>`).join("")}
      </div>`).join("")}
  </div>`;
}

function wireCrisis(){
  document.querySelectorAll(".cri-item").forEach(b => {

  });

  initScrollRails();
}

/* ============================================================
   疼痛路徑:獨立教學區(資料在 src/gaquickercheck/pain/)
   每張卡 = { group, id, name, en, key, updated, sections:[{ h, items:[...], table:{ head:[...], rows:[[...]] } }],
              diagram:{ svg, caption }(選填,放在第一段之後), refs:[...] }
              各段也可有 sections[i].diagram(放在該段內容之後)
   items 以 "## " 開頭 → 分段小標題
   ============================================================ */
let PAIN_OPEN = null;
let PAIN_TOPIC = null;   /* null = 停在主題層(疼痛路徑 / 血液動力學);否則為選中的主題 */
const PAIN_TOPIC_INFO = {
  "疼痛路徑": { en:"Pain Pathways", desc:"從受器、脊髓背角到大腦:疼痛如何被感受、放大與抑制,以及各種止痛藥作用在哪一段" },
  "血液動力學": { en:"Hemodynamics", desc:"正常值與公式、SVV 與輸液反應、目標導向輸液、休克分類;附互動計算與判讀工具" }
};
const PAIN = /*@@PAIN@@*/;

function painTopics(){
  const t = [];
  PAIN.forEach(c => { if(!t.includes(c.topic)) t.push(c.topic); });
  return t;
}
function painGroups(topic){
  const g = [];
  PAIN.filter(c => c.topic === topic).forEach(c => { if(!g.includes(c.group||"")) g.push(c.group||""); });
  return g;
}

function painCardHtml(c){
  const li = a => (a||[]).map(x => x.indexOf("## ") === 0
    ? `<li class="hd">${x.slice(3)}</li>` : `<li>${x}</li>`).join("");
  const tbl = t => !t ? "" : `
        <div class="scroll-hint">表格可左右滑動查看</div>
        <div class="tool-scroll">
          <table class="tool-tbl">
            <tr>${t.head.map(h => `<th>${h}</th>`).join("")}</tr>
            ${t.rows.map(r => `<tr>${r.map((d,i) => `<td>${i===0 ? `<b>${d}</b>` : d}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>`;
  const fig = d => !d ? ""
    : `<figure class="d-figure">${d.svg || (d.img ? `<img class="d-img" src="${d.img}" alt="${d.alt||""}" loading="lazy">` : "")}${d.legend ? `<ul class="d-legend">${d.legend.map(l => `<li><span class="dl-k" style="background:${l.c}">${l.k}</span><div><b>${l.t}</b><span>${l.d}</span></div></li>`).join("")}</ul>` : ""}${d.caption ? `<figcaption>${d.caption}</figcaption>` : ""}</figure>`;
  const dia = fig(c.diagram);
  return `
    <div class="tool-box cri-card pain-card">
      <div class="cri-h">
        <div class="cri-en">${c.en}</div>
        <div class="cri-name">${c.name}${isNewItem(c) ? `<span class="badge-new" title="近期新增或更新">NEW</span>` : ""}</div>
        ${c.key ? `<div class="cri-key">${c.key}</div>` : ""}
      </div>
      ${(c.sections||[]).map((sec, i) => `
      <div class="cri-sec">
        ${sec.h ? `<h4>${sec.h}</h4>` : ""}
        ${sec.widget ? `<div class="kw" data-widget="${sec.widget}"></div>` : ""}
        ${(sec.items && sec.items.length) ? `<ul class="cri-ul">${li(sec.items)}</ul>` : ""}
        ${tbl(sec.table)}
        ${fig(sec.diagram)}
      </div>${i === 0 ? dia : ""}`).join("")}
      ${(c.refs && c.refs.length) ? `
      <div class="cri-refs">
        <h4>參考文獻</h4>
        <ol>${c.refs.map(r => `<li>${r}</li>`).join("")}</ol>
      </div>` : ""}
    </div>`;
}

function painHtml(){
  if(!PAIN_TOPIC){
    return `
  <div class="tool-wrap">
    <div>
      <div class="tool-head">麻醉冷知識</div>
      <div class="tool-sub">臨床背後的生理與藥理。先選主題,再點選項目看內容。</div>
    </div>

        ${g ? `<div class="pain-group">${g}</div>` : ""}

          <div class="pain-item${c.id===PAIN_OPEN ? " active" : ""}" data-go="${c.id}">

            <div class="pi-name">${c.name}</div>
            <div class="pi-en">${c.en}</div>

/* ============================================================
   麻醉冷知識:互動小工具。資料卡 sections 裡寫 widget:"名稱" 即可插入。
   可用:hemo-calc / svv-calc / starling / gdt-flow / mcgee / shock-match
   ============================================================ */
const KW = {
  num(root, id){ const x = root.querySelector(`[data-k="${id}"]`); const v = x ? parseFloat(x.value) : NaN; return isFinite(v) ? v : NaN; },
  f(v, d){ return isFinite(v) ? v.toFixed(d) : "—"; },
  row(k, v, unit, range, pill){ return `<div class="kw-row"><span class="k">${k}</span><span class="v">${v}${unit ? ` ${unit}` : ""}${pill||""}<span class="r">${range||""}</span></span></div>`; },
  /* 紅黃綠燈:綠 = 正常範圍內;黃 = 超出範圍 20% 以內;紅 = 超出更多 */
  light(v, lo, hi){
    if(!isFinite(v)) return `<span class="kw-light n" title="未計算"></span>`;
    if(v >= lo && v <= hi) return `<span class="kw-light g" title="正常"></span>`;
    const off = v < lo ? (lo - v) / lo : (v - hi) / hi;
    return off <= 0.2 ? `<span class="kw-light y" title="輕度偏離"></span>` : `<span class="kw-light r" title="明顯偏離"></span>`;
  },
  lrow(k, v, d, unit, lo, hi, range){
    const word = !isFinite(v) ? "" : v < lo ? "偏低" : v > hi ? "偏高" : "正常";
    return `<div class="kw-row"><span class="k">${KW.light(v,lo,hi)}${k}</span><span class="v">${KW.f(v,d)}${unit ? ` ${unit}` : ""}<span class="r">${word ? word + " · " : ""}${range}</span></span></div>`;
  },
  legend: () => `<div class="kw-legend"><span><span class="kw-light g"></span>正常範圍</span><span><span class="kw-light y"></span>超出 20% 以內</span><span><span class="kw-light r"></span>超出 20% 以上</span></div>`,
  inp(id, label, val, step){ return `<label class="kw-f">${label}<input type="number" inputmode="decimal" data-k="${id}" value="${val}" step="${step||"any"}"></label>`; }
};

const WIDGETS = {
  "hemo-calc": {
    html: () => `
      <div class="kw-note">輸入數值即時計算;BSA 用 Mosteller 公式。填入 SVV 可判斷給水是否有效。結果僅供教學練習。</div>
      <div class="kw-grid">
        ${KW.inp("h","身高 (cm)",165)}${KW.inp("w","體重 (kg)",65)}${KW.inp("hr","HR (bpm)",80)}
        ${KW.inp("sv","SV (mL)",70)}${KW.inp("map","MAP (mmHg)",75)}${KW.inp("cvp","CVP (mmHg)",6)}
        ${KW.inp("svv","SVV (%,可空白)","")}
      </div>
      <div class="kw-out" data-o="out"></div>
      <div data-o="next"></div>`,
    /* 下一步建議:依 MAP、CI、SVV、SVR、SVI 判斷灌水 / 升壓 / 強心 / 觀察(教學用) */
    next(v){
      const { map, ci, svv, svr, svi, hr } = v;
      if(![map, ci, svr, svi].every(isFinite)) return "";
      const S = (cls, t, body) => `<div class="kw-step ${cls}"><span class="t">${t}</span>${body}</div>`;
      const out = [];
      const okMap = map >= 65, okCi = ci >= 2.5, hasSvv = isFinite(svv), resp = hasSvv && svv > 13;
      if(okMap && okCi){
        out.push(S("go", "建議:繼續觀察", `MAP ≥65、CI ≥2.5 → 目前達標,<b>不需要額外處置</b>;持續監測趨勢,並確認組織灌流(ScvO₂ &gt;70%、乳酸下降、尿量)。`));
        if(resp) out.push(S("", "提醒", `SVV &gt;13% 代表病人仍在 Frank-Starling 曲線陡段;血壓與心輸出達標時不必為了 SVV 給水,但若出血持續或血壓開始下滑,給水會有效。`));
        if(svr > 1200) out.push(S("", "提醒", `SVR 偏高(血管收縮)→ 想一想是否麻醉過淺、疼痛、低體溫,或代償性的容積不足。`));
        return out.join("");
      }
      /* 未達標 */
      if(hasSvv && resp){
        out.push(S("", "建議:給輸液(前負荷不足)", `SVV ${svv.toFixed(0)}% &gt;13% → 對輸液可能有反應:<b>200–250 mL 輸液挑戰</b>(5–10 分鐘內),看 SV 是否上升 &gt;10%;有上升就可重複,不再上升就停止。`));
        if(svr < 800) out.push(S("", "同時", `SVR 也偏低 → 給水期間血壓仍低可先以升壓劑支持(如 phenylephrine 或 norepinephrine),避免低血壓時間拉長。`));
      } else if(!hasSvv){
        out.push(S("warn", "先判斷:給水有沒有用?", `沒有 SVV 時,先做<b>被動抬腿</b>或<b>小量輸液挑戰(200–250 mL)</b>看 SV 變化:SV 上升 &gt;10% → 繼續給水;沒有上升 → 依下列判讀找原因。也可以在上方填入 SVV。`));
      }
      const brady = isFinite(hr) && hr < 50;
      if(brady) out.push(S("warn", "優先:心搏過緩", `HR ${hr} 合併低血壓 → 心輸出低主要因為心跳太慢:<b>atropine 或 ephedrine</b>,並找原因(迷走反射、高位阻斷、藥物、心律不整)。`));
      if(!resp && !brady){
        const pre = hasSvv ? "SVV ≤13%(給水沒什麼幫助)," : "<b>若給水後 SV 沒有上升:</b>";
        if(!okCi){
          out.push(S("", hasSvv ? "建議:強心(收縮力不足)" : "接著:考慮強心", `${pre}CI ${ci.toFixed(2)} 偏低、SVR ${svr.toFixed(0)} 不低 → <b>心臟打不出去</b>:ephedrine 5–10 mg,不足時 dobutamine 2–20 µg/kg/min;排除心肌缺血、心律不整、麻醉藥抑制。`));
        } else if(!okMap){
          out.push(S("", hasSvv ? "建議:升壓(血管張力不足)" : "接著:考慮升壓", `${pre}CI ${ci.toFixed(2)} 還可以但 MAP 低(SVR ${svr.toFixed(0)})→ <b>血管擴張</b>:ephedrine 5–10 mg 或 phenylephrine;持續低血壓用 norepinephrine 2–12 µg/min 或 10 µg bolus;同時減淺麻醉、排除過敏或敗血。`));
        }
        if(svi > 47 && hasSvv) out.push(S("warn", "注意", `SVI 偏高且對輸液沒有反應 → 不要再給水;若有容積過多表現(肺水腫、氧合變差),與主治醫師討論利尿。`));
      }
      out.push(S("", "每次處置後", `重新評估 MAP、CI、SVV;同時想一想<b>根本原因</b>:出血、麻醉過深、體位、氣腹或手術壓迫大血管。`));
      return out.join("");
    },
    calc(r){
      const h=KW.num(r,"h"), w=KW.num(r,"w"), hr=KW.num(r,"hr"), sv=KW.num(r,"sv"), map=KW.num(r,"map"), cvp=KW.num(r,"cvp"), svv=KW.num(r,"svv");
      const bsa=Math.sqrt(h*w/3600), co=hr*sv/1000, ci=co/bsa, svi=sv/bsa, svr=(map-cvp)*80/co, svri=(map-cvp)*80/ci;
      r.querySelector('[data-o="out"]').innerHTML =
        KW.row("BSA", KW.f(bsa,2), "m²", "") +
        KW.lrow("CO", co, 2, "L/min", 4, 8, "正常 4–8") +
        KW.lrow("CI", ci, 2, "L/min/m²", 2.5, 4, "正常 2.5–4") +
        KW.lrow("SVI", svi, 0, "mL/m²", 33, 47, "正常 33–47") +
        KW.lrow("SVR", svr, 0, "dyn·s/cm⁵", 800, 1200, "正常 800–1200") +
        KW.lrow("SVRI", svri, 0, "", 1970, 2390, "正常 1970–2390") +
        (isFinite(svv) ? KW.lrow("SVV", svv, 0, "%", 0, 13, "&lt;13%") : "") +
        KW.legend();
      const nx = WIDGETS["hemo-calc"].next({ map, ci, svv, svr, svi, hr });
      r.querySelector('[data-o="next"]').innerHTML = nx ? `<div class="kw-out"><div class="kw-note" style="margin-bottom:2px"><b>下一步怎麼做?</b>(教學判讀,實際處置依病人狀況與主治醫師指示)</div>${nx}</div>` : "";
    }
  },
  "svv-calc": {
    html: () => `
      <div class="kw-note">SVV = (SVmax − SVmin) / SVmean × 100;SVmean 未填時以 (SVmax + SVmin) / 2 估算。</div>
      <div class="kw-grid">${KW.inp("mx","SVmax (mL)",78)}${KW.inp("mn","SVmin (mL)",66)}${KW.inp("me","SVmean (mL,可空白)","")}</div>
      <div class="kw-out" data-o="out"></div>`,
    calc(r){
      const mx=KW.num(r,"mx"), mn=KW.num(r,"mn"); let me=KW.num(r,"me"); if(!isFinite(me)) me=(mx+mn)/2;
      const svv=(mx-mn)/me*100;
      const msg = !isFinite(svv) ? "" : svv>13
        ? `<div class="kw-step go"><span class="t">判讀</span>SVV &gt;13% → <b>可能對輸液有反應</b>(前負荷不足);前提是控制通氣、竇性心律、潮氣量足夠、未開胸。</div>`
        : `<div class="kw-step"><span class="t">判讀</span>SVV ≤13% → <b>給水不太會增加 SV</b>;低血壓時改看 SVI 與 SVR 找原因(收縮力或血管張力)。</div>`;
      r.querySelector('[data-o="out"]').innerHTML = KW.lrow("SVV", svv, 1, "%", 0, 13, "&lt;13%") + msg;
    }
  },
  "starling": {
    html: () => `
      <div class="kw-note">給 200–250 mL 輸液(5–10 分鐘內)前後各記一次 SV,看 ΔSV 決定要不要繼續給。</div>
      <div class="kw-grid">${KW.inp("a","給水前 SV (mL)",60)}${KW.inp("b","給水後 SV (mL)",68)}</div>
      <div class="kw-out" data-o="out"></div>`,
    calc(r){
      const a=KW.num(r,"a"), b=KW.num(r,"b"), d=(b-a)/a*100;
      const steep = d>10;
      /* 曲線上的位置:陡段或平台 */
      const x = steep ? 118 : 330, y = steep ? 96 : 40;
      const svg = `<svg viewBox="0 0 420 200" role="img"><title>Frank-Starling 曲線</title>
        <rect x="0" y="0" width="420" height="200" rx="10" fill="#F4F1EB"/>
        <line x1="50" y1="170" x2="400" y2="170" stroke="#8B837A" stroke-width="1.2"/><line x1="50" y1="170" x2="50" y2="20" stroke="#8B837A" stroke-width="1.2"/>
        <text x="400" y="188" text-anchor="end" font-size="12" fill="#726B62" font-family="sans-serif">前負荷 Preload</text>
        <text x="56" y="30" font-size="12" fill="#726B62" font-family="sans-serif">SV</text>
        <path d="M60 165 C110 80 170 52 250 44 C300 40 350 38 395 38" fill="none" stroke="#B5645C" stroke-width="2.6"/>
        <rect x="60" y="150" width="150" height="16" rx="4" fill="#DCE5DD" opacity=".7"/><text x="135" y="162" text-anchor="middle" font-size="11" fill="#3F5A4B" font-family="sans-serif">陡段:給水有效</text>
        <rect x="260" y="150" width="135" height="16" rx="4" fill="#F1DCD6" opacity=".8"/><text x="327" y="162" text-anchor="middle" font-size="11" fill="#8F4F48" font-family="sans-serif">平台:停止給水</text>
        ${isFinite(d) ? `<circle cx="${x}" cy="${y}" r="7" fill="${steep ? "#5F8370" : "#B5645C"}" stroke="#fff" stroke-width="2"/>` : ""}
      </svg>`;
      const msg = !isFinite(d) ? "" : steep
        ? `<div class="kw-step go"><span class="t">建議</span>ΔSV &gt;10% → 仍在曲線陡段,<b>可再給一次 200–250 mL</b> 並再評估。</div>`
        : `<div class="kw-step warn"><span class="t">建議</span>ΔSV ≤10% → 已接近平台,<b>停止給水</b>;持續監測 SV,若下降 &gt;10% 再考慮給水。低血壓仍在 → 找其他原因(升壓或強心)。</div>`;
      r.querySelector('[data-o="out"]').innerHTML = KW.row("ΔSV", KW.f(d,1), "%", "門檻 10%") + svg + msg;
    }
  },
  "gdt-flow": {
    html: () => `
      <div class="kw-note">依筆記中的流程:先把麻醉調好(Vt 約 8 mL/kg),目標 <b>CI ≥2.5 L/min/m²、MAP ≥65 mmHg</b>(收縮壓 &gt;100)。</div>
      <div class="kw-grid">${KW.inp("map","MAP (mmHg)",58)}${KW.inp("ci","CI (L/min/m²)",2.1)}${KW.inp("svv","SVV (%)",15)}${KW.inp("svr","SVR (dyn·s/cm⁵)",1300)}</div>
      <div class="kw-out" data-o="out"></div>`,
    calc(r){
      const map=KW.num(r,"map"), ci=KW.num(r,"ci"), svv=KW.num(r,"svv"), svr=KW.num(r,"svr");
      let out;
      if(!(isFinite(map)&&isFinite(ci)&&isFinite(svv)&&isFinite(svr))) out = "";
      else if(ci>=2.5 && map>=65) out = `<div class="kw-step go"><span class="t">目標達成</span>CI 與 MAP 都已達標 → 持續監測;再確認組織灌流:<b>ScvO₂ &gt;70%</b> 或<b>乳酸持續下降</b>。</div>`;
      else if(svv>12) out = `<div class="kw-step"><span class="t">① 前負荷不足(灌水)</span>SVV &gt;12% → <b>500 mL 晶體液或 250 mL 膠體液</b>,給完看 SV 是否上升 &gt;10%,再回到目標評估。</div>`;
      else if(svr<800) out = `<div class="kw-step"><span class="t">② 後負荷低(血管擴張 → 升壓)</span>SVV ≤12% 且 SVR &lt;800 → <b>ephedrine 5–10 mg</b>;不足時 <b>norepinephrine 2–12 µg/min 或 10 µg bolus</b>(頑固休克可能需要到 30 µg/min)。</div>`;
      else out = `<div class="kw-step"><span class="t">③ 收縮力不足(強心)</span>SVV ≤12% 且 SVR ≥800 → <b>ephedrine 5–10 mg</b>;不足時 <b>dobutamine 2–20 µg/kg/min</b>,或考慮其他強心劑/血管擴張劑。</div>`;
      const extra = (isFinite(ci)&&isFinite(map)&&!(ci>=2.5&&map>=65)) ? `<div class="kw-step"><span class="t">之後</span>每次處置後重新評估 CI 與 MAP,直到達標;最後再看 ScvO₂ &gt;70% 或乳酸清除。</div>` : "";
      r.querySelector('[data-o="out"]').innerHTML = out + extra;
    }
  },
  "mcgee": {
    html: () => `
      <div class="kw-note">灌流不足時:先問『對輸液有反應嗎?』(SVV &gt;13%),再用 SVI 分流。</div>
      <div class="kw-btns" data-g="svv">
        <button type="button" class="kw-btn" data-v="y" aria-pressed="false">SVV &gt;13%(有反應)</button>
        <button type="button" class="kw-btn" data-v="n" aria-pressed="false">SVV ≤13%(沒反應)</button>
      </div>
      <div class="kw-btns" data-g="svi" hidden>
        <button type="button" class="kw-btn" data-v="lo" aria-pressed="false">SVI &lt;40</button>
        <button type="button" class="kw-btn" data-v="mid" aria-pressed="false">SVI 40–50</button>
        <button type="button" class="kw-btn" data-v="hi" aria-pressed="false">SVI &gt;50</button>
      </div>
      <div data-o="out"></div>`,
    wire(r){
      const st = {};
      const show = () => {
        r.querySelector('[data-g="svi"]').hidden = st.svv !== "n";
        const o = r.querySelector('[data-o="out"]');
        if(st.svv === "y") o.innerHTML = `<div class="kw-step go"><span class="t">Volume challenge</span>前負荷不足 → 給一次輸液挑戰(200–250 mL),看 SV 是否上升 &gt;10%。</div>`;
        else if(st.svv === "n" && st.svi === "lo") o.innerHTML = `<div class="kw-step"><span class="t">Inotrope(強心)</span>容積已足但每搏量低 → <b>收縮力問題</b>,考慮強心劑(如 dobutamine)。</div>`;
        else if(st.svv === "n" && st.svi === "mid") o.innerHTML = `<div class="kw-step"><span class="t">Pressor(升壓)</span>容積與每搏量都正常,血壓仍低 → <b>血管張力不足</b>,給升壓劑(如 norepinephrine)。</div>`;
        else if(st.svv === "n" && st.svi === "hi") o.innerHTML = `<div class="kw-step warn"><span class="t">Diuretic(利尿)</span>沒有輸液反應且每搏量偏高 → 若有<b>容積過多</b>的表現,考慮利尿。</div>`;
        else o.innerHTML = "";
      };
      r.querySelectorAll(".kw-btns").forEach(g => g.querySelectorAll(".kw-btn").forEach(b => b.onclick = () => {
        st[g.dataset.g] = b.dataset.v;
        if(g.dataset.g === "svv") st.svi = null;
        g.querySelectorAll(".kw-btn").forEach(x => x.setAttribute("aria-pressed", x===b ? "true" : "false"));
        if(g.dataset.g === "svv") r.querySelectorAll('[data-g="svi"] .kw-btn').forEach(x => x.setAttribute("aria-pressed","false"));
        show();
      }));
    }
  },
  "shock-match": {
    html: () => `
      <div class="kw-note">選出病人的血流動力學型態,看看最像哪一種休克(真實病人常是混合型)。</div>
      <div class="kw-grid">
        <label class="kw-f">CO<select data-k="co"><option value="">—</option><option value="d">↓</option><option value="u">↑ / 正常</option></select></label>
        <label class="kw-f">SVR<select data-k="svr"><option value="">—</option><option value="u">↑</option><option value="d">↓</option></select></label>
        <label class="kw-f">CVP / PAOP<select data-k="cvp"><option value="">—</option><option value="d">↓</option><option value="u">↑</option></select></label>
        <label class="kw-f">HR<select data-k="hr"><option value="">—</option><option value="u">↑</option><option value="d">↓</option></select></label>
      </div>
      <div data-o="out"></div>`,
    calc(r){
      const g = k => (r.querySelector(`[data-k="${k}"]`)||{}).value || "";
      const v = { co:g("co"), svr:g("svr"), cvp:g("cvp"), hr:g("hr") };
      const T = [
        { n:"低血容性休克 Hypovolemic", p:{co:"d",svr:"u",cvp:"d",hr:"u"}, tx:"止血、輸液/輸血復甦", c:"" },
        { n:"心因性休克 Cardiogenic", p:{co:"d",svr:"u",cvp:"u",hr:"u"}, tx:"強心劑、謹慎給水,必要時機械循環輔助(如 ECMO)", c:"" },
        { n:"阻塞性休克 Obstructive", p:{co:"d",svr:"u",cvp:"u",hr:"u"}, tx:"解除阻塞:心包膜穿刺、胸管(張力性氣胸)、肺栓塞處置", c:"與心因性型態相似 → 用超音波或 TEE 區分" },
        { n:"分佈性休克 Distributive", p:{co:"u",svr:"d",cvp:"d",hr:"u"}, tx:"敗血症:抗生素與輸液;過敏性休克:epinephrine;升壓劑", c:"CO 早期可升高、晚期可下降" },
        { n:"神經性休克 Neurogenic", p:{co:"d",svr:"d",cvp:"d",hr:"d"}, tx:"輸液、升壓劑;心搏過緩給 atropine", c:"脊髓或腦部損傷,失去交感張力 → <b>低血壓合併心搏過緩</b>、四肢溫暖" }
      ];
      const picked = Object.values(v).filter(Boolean).length;
      const o = r.querySelector('[data-o="out"]');
      if(!picked){ o.innerHTML = ""; return; }
      const scored = T.map(t => ({ t, s: Object.keys(v).reduce((a,k) => a + (v[k] ? (v[k]===t.p[k] ? 1 : -1) : 0), 0) }))
        .sort((a,b) => b.s - a.s);
      const best = scored[0].s, top = scored.filter(x => x.s === best && best > 0);
      o.innerHTML = top.length ? top.map(x => `<div class="kw-step go"><span class="t">最符合</span><b>${x.t.n}</b>${x.t.c ? `<br>${x.t.c}` : ""}<br>處置:${x.t.tx}</div>`).join("")
        : `<div class="kw-step"><span class="t">沒有典型型態</span>可能是混合型休克,或資料互相矛盾 → 重新評估並考慮超音波。</div>`;
    }
  }
};

function initWidgets(root){

}

  perception:{ t:"③ Perception 知覺", d:"大腦把訊號整合成『痛』的感受:體感皮質判斷位置與強度,邊緣系統產生不愉快與情緒。<br><b>作用在這裡:</b>全身麻醉(抑制知覺,但脊髓仍持續接收傷害訊號)、paracetamol(中樞)、dexmedetomidine。" },
  modulation:{ t:"④ Modulation 調控", d:"<b>PAG → RVM、藍斑核</b>的下行路徑回到背角,釋放<b>內生性鴉片、5-HT、NE</b>,把往上傳的痛訊號『關小聲』;下行路徑也可能反過來放大疼痛。<br><b>作用在這裡:</b>opioid、tramadol、tapentadol、SNRI(duloxetine)。" }
};
function painTip(el, key){
  const fig = el.closest("figure"); if(!fig) return;
  const old = fig.querySelector(".pain-tip");
  if(old){ const same = old.dataset.key === key; old.remove(); if(same) return; }
  const tip = PAIN_TIPS[key]; if(!tip) return;
  const box = document.createElement("div");
  box.className = "pain-tip"; box.dataset.key = key; box.setAttribute("role","dialog");
  box.innerHTML = `<button class="tip-x" type="button" aria-label="關閉說明">×</button><div class="tip-t">${tip.t}</div><div>${tip.d}</div>`;
  box.querySelector(".tip-x").onclick = () => box.remove();
  fig.appendChild(box);
  const fr = fig.getBoundingClientRect(), r = el.getBoundingClientRect();
  let left = r.left - fr.left + r.width/2 - box.offsetWidth/2;
  left = Math.max(8, Math.min(left, fig.clientWidth - box.offsetWidth - 8));
  let top = r.bottom - fr.top + 6;
  if(top + box.offsetHeight > fig.clientHeight - 4) top = Math.max(4, r.top - fr.top - box.offsetHeight - 6);
  box.style.left = left + "px"; box.style.top = top + "px";
}

/* 來源切換(本院筆記 / Miller / UpToDate)：
   - 點區塊標題：展開全部來源
   - 第一次點來源 chip：切換成只看該來源
   - 之後可再加選其他來源；再點一次則收合該來源
*/
function showAllSources(sec){
  if(!sec) return;
  sec.dataset.sourceMode = "all";
  sec.querySelectorAll('.src-piece').forEach(p=>p.removeAttribute('hidden'));
  sec.querySelectorAll('.src-toggle').forEach(b=>b.setAttribute('aria-pressed','false'));
}

function toggleSource(ev, btn){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  const sec = btn.closest('.sec-fold, .flag-box');
  if(!sec) return false;

  /* 若區塊是收合狀態，點來源時先展開 */
  if(sec.tagName === 'DETAILS' && !sec.open) sec.open = true;

  const key = btn.dataset.src;
  const buttons = [...sec.querySelectorAll('.src-toggle')];
  const pieces = [...sec.querySelectorAll('.src-piece')];

  /* 從「全部顯示」第一次點來源 → 進入篩選模式，只顯示這一個 */
  if(sec.dataset.sourceMode !== "filter"){
    sec.dataset.sourceMode = "filter";
    buttons.forEach(b=>b.setAttribute('aria-pressed','false'));
    pieces.forEach(p=>p.setAttribute('hidden',''));
    btn.setAttribute('aria-pressed','true');
    pieces.filter(p=>p.dataset.src===key).forEach(p=>p.removeAttribute('hidden'));
    return false;
  }

  /* 已在篩選模式 → 可多選 / 再點收合 */
  const pressed = btn.getAttribute('aria-pressed') === 'true';
  btn.setAttribute('aria-pressed', pressed ? 'false' : 'true');
  pieces.filter(p=>p.dataset.src===key).forEach(p=>{
    if(pressed) p.setAttribute('hidden',''); else p.removeAttribute('hidden');
  });

  return false;
}

/* 點區塊標題展開時，一律回到「全部來源一起顯示」 */
function sourceSectionToggle(det){
  if(!det || !hasSourceToggle(currentSurgery)) return;
  if(det.open) showAllSources(det);
}

/* 文獻/教科書補充(術式物件選填 lit:[{tag,cls,label,note,各區塊陣列}]),與本院筆記分開呈現 */
function litHas(s, k){ return (s.lit||[]).some(L=>L[k] && L[k].length); }
function hasSourceToggle(s){
  /* 本院筆記 / Miller / UpToDate 可分別點選:凡是區塊可收合且有 lit 的術式都適用 */
  return !!(s && s.collapse && (s.lit||[]).length);

function litBlocks(s, k){

  return (s.lit||[]).filter(L=>L[k] && L[k].length).map(L=>`
      <div class="lit-block ${L.cls||''} ${toggle?'src-piece':''}" ${toggle?`data-src="${L.cls||L.tag}"`:''}>
        <div class="src-h">${L.label}${L.note?`<span>${L.note}</span>`:''}</div>

      </div>`).join('');
}
function srcChips(s, k){
  const lits = s.lit || [];
  if(!lits.length) return '';
  const toggle = hasSourceToggle(s);
  if(toggle){
    const own = ((s[k] && s[k].length) || s.showEmptyNote) ? `<button type="button" class="src-chip note src-toggle" data-src="note" aria-pressed="false" onclick="return toggleSource(event,this)">筆記</button>` : '';
    const ext = lits.filter(L=>L[k] && L[k].length).map(L=>`<button type="button" class="src-chip ${L.cls||''} src-toggle" data-src="${L.cls||L.tag}" aria-pressed="false" onclick="return toggleSource(event,this)">${L.tag}</button>`).join('');
    return `<span class="src-chips">${own}${ext}</span>`;
  }
  const own = ((s[k] && s[k].length) || s.showEmptyNote) ? `<span class="src-chip note">筆記</span>` : '';
  return `<span class="src-chips">${own}${lits.filter(L=>L[k] && L[k].length).map(L=>`<span class="src-chip ${L.cls||''}">${L.tag}</span>`).join('')}</span>`;
}
function flagBoxHtml(s){
  const own = (s.flags && s.flags.length) ? s.flags : [];
  if(!own.length && !litHas(s,"flags")) return "";
  const hasLit = (s.lit||[]).length > 0;
  const ownHtml = own.length ? `<ul>${own.map(x=>`<li>${x}</li>`).join("")}</ul>` : "";
  const body = (own.length && hasSourceToggle(s) ? `<div class="src-piece" data-src="note">${ownHtml}</div>` : ownHtml)
    + litBlocks(s,"flags");
  if(s.collapse) return `
      <details class="flag-box fold-flag" data-sec="flags">
        <summary>⚠ 重要併發症${srcChips(s,"flags")}</summary>
        ${body}
      </details>`;
  return `
      <div class="flag-box" data-sec="flags">
        <h3>⚠ 重要併發症</h3>
        ${body}
      </div>`;
}

/* ============================================================
   螢光筆(個人標記)
   ------------------------------------------------------------
   與個人筆記存在同一處(只在這台裝置),隨「匯出/匯入筆記」一起備份。
   每筆標記 = { id, b:區塊代號, q:標示文字, p:前文, x:後文, c:顏色, t:時間 }
   區塊代號 = 區塊 key + 來源(note / miller / uptodate / otherlit)。
   內容改版後找不到原文的標記,會在個人筆記區提示為「已失效」。
   ============================================================ */
const PEN_COLORS = [
  { c:"y", name:"黃" }, { c:"g", name:"綠" }, { c:"p", name:"粉" }, { c:"b", name:"藍" }
];
const PEN = { on:false, erase:false, color:"y", s:null, sel:null, collapsedAt:0 };

function penMarks(s){ const n = NOTES[noteKey(s)]; return (n && Array.isArray(n.marks)) ? n.marks : []; }

function penBoxes(){
  const d = el("detail"); if(!d) return [];
  const out = [];
  d.querySelectorAll("[data-sec]").forEach(sec => {
    const key = sec.dataset.sec;
    const heads = [...sec.querySelectorAll(".src-h")];
    if(!heads.length){
      out.push({ id:key + "|note", box:sec, head:null });
      return;
    }
    const noteUl = sec.querySelector('.src-piece[data-src="note"] ul') || sec.querySelector(':scope > ul');
    if(noteUl){
      const nb = noteUl.closest('.src-piece') || sec;
      if(nb !== sec) out.push({ id:key + "|note", box:nb, head:null });
    }
    heads.forEach(h => {
      const box = h.parentElement;
      const src = box === sec ? "note"
        : (box.dataset.src || ["miller","uptodate","otherlit"].find(c => box.classList.contains(c)) || "note");
      out.push({ id:key + "|" + src, box, head:h });
    });
  });
  return out;
}

function penNodes(box){
  const w = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p = n.parentElement;
      if(!p || p.closest("[data-pen]") !== box) return NodeFilter.FILTER_REJECT;
      if(!p.closest("ul") || p.closest(".info-btn, .pen-row, .pen-btn")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const a = []; let n; while((n = w.nextNode())) a.push(n);
  return a;
}

function penLocate(text, m){
  const hits = []; let i = text.indexOf(m.q);
  while(i >= 0){ hits.push(i); i = text.indexOf(m.q, i + 1); }
  if(!hits.length) return -1;
  let best = hits[0], bs = -1;
  hits.forEach(h => {
    const pre = text.slice(0, h), suf = text.slice(h + m.q.length);
    let sc = 0;
    for(let k = 1; k <= (m.p||"").length && pre[pre.length-k] === m.p[m.p.length-k]; k++) sc++;
    for(let k = 0; k < (m.x||"").length && suf[k] === m.x[k]; k++) sc++;
    if(sc > bs){ bs = sc; best = h; }
  });
  return best;
}

function penWrap(box, s, e, m){
  let base = 0;
  penNodes(box).forEach(n => {
    const len = n.length, ns = base, ne = base + len; base += len;
    if(ne <= s || ns >= e) return;
    let node = n;
    const a = Math.max(s, ns) - ns, b = Math.min(e, ne) - ns;
    if(b < len) node.splitText(b);
    if(a > 0) node = node.splitText(a);
    const mk = document.createElement("mark");
    mk.className = "umk umk-" + m.c;
    mk.dataset.mid = m.id;
    node.parentNode.insertBefore(mk, node);
    mk.appendChild(node);
  });
}

function penRender(){
  const d = el("detail"); if(!d || !PEN.s) return;
  d.querySelectorAll("mark.umk").forEach(mk => {
    const p = mk.parentNode;
    while(mk.firstChild) p.insertBefore(mk.firstChild, mk);
    p.removeChild(mk); p.normalize();
  });
  const boxes = {};
  penBoxes().forEach(b => { boxes[b.id] = b.box; });
  let stale = 0;
  penMarks(PEN.s).forEach(m => {
    const box = boxes[m.b];
    if(!box){ stale++; return; }
    const text = penNodes(box).map(n => n.data).join("");
    const at = penLocate(text, m);
    if(at < 0){ stale++; return; }
    penWrap(box, at, at + m.q.length, m);
  });
  penStaleNote(stale);
}

function penStaleNote(n){
  const nb = document.querySelector("#detail .note-box"); if(!nb) return;
  let row = nb.querySelector(".pen-stale");
  if(!n){ if(row) row.remove(); return; }
  if(!row){
    row = document.createElement("div");
    row.className = "pen-stale";
    const h = nb.querySelector("h3");
    h ? h.insertAdjacentElement("afterend", row) : nb.prepend(row);
  }
  row.innerHTML = `🖍 有 ${n} 個螢光標記因內容更新找不到原本的文字,已無法顯示。<button type="button" class="note-btn ghost" onclick="penClearStale()">清除失效標記</button>`;
}

async function penClearStale(){
  if(!PEN.s) return;
  const boxes = {};
  penBoxes().forEach(b => { boxes[b.id] = b.box; });
  const keep = penMarks(PEN.s).filter(m => {
    const box = boxes[m.b]; if(!box) return false;
    const text = penNodes(box).map(n => n.data).join("");
    return penLocate(text, m) >= 0;
  });
  await penSave(keep, "已清除失效標記");
}

async function penSave(marks, msg){
  const key = noteKey(PEN.s);
  const n = NOTES[key] || blankNote();
  n.marks = marks;
  await saveNote(key, n, msg);
  penRender();
}

/* 把目前選取範圍換算成「區塊內的文字位置」 */
function penRangeInfo(r){
  const sn = r.startContainer.nodeType === 3 ? r.startContainer.parentElement : r.startContainer;
  const box = sn && sn.closest && sn.closest("[data-pen]");
  if(!box || !el("detail").contains(box)) return null;
  const nodes = penNodes(box);
  let base = 0, s = -1, e = -1;
  nodes.forEach(n => {
    if(r.intersectsNode(n)){
      const a = n === r.startContainer ? r.startOffset : 0;
      const b = n === r.endContainer ? r.endOffset : n.length;
      if(s < 0) s = base + a;
      e = base + b;
    }
    base += n.length;
  });
  if(s < 0 || e <= s) return null;
  const text = nodes.map(n => n.data).join("");
  while(s < e && /\s/.test(text[s])) s++;
  while(e > s && /\s/.test(text[e-1])) e--;
  if(e <= s) return null;
  return { box, bid:box.dataset.pen, s, e, text };
}

function penCurrentSel(){
  const sel = window.getSelection();
  if(sel && sel.rangeCount && !sel.isCollapsed){
    const info = penRangeInfo(sel.getRangeAt(0));
    if(info) return info;
  }
  if(PEN.sel && (!PEN.collapsedAt || Date.now() - PEN.collapsedAt < 1200)) return PEN.sel;
  return null;
}

function penClearSel(){
  PEN.sel = null; PEN.collapsedAt = 0;
  try{ window.getSelection().removeAllRanges(); }catch(e){}
}

async function penApply(color){
  PEN.color = color;
  PEN.erase = false;
  penBarState();
  const info = penCurrentSel();
  if(!info){ penTip("先長按選取要標示的文字,再點顏色"); return; }
  const q = info.text.slice(info.s, info.e);
  const m = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    b: info.bid, q,
    p: info.text.slice(Math.max(0, info.s - 16), info.s),
    x: info.text.slice(info.e, info.e + 16),
    c: color, t: Date.now()
  };
  penClearSel();
  await penSave(penMarks(PEN.s).concat([m]), "已儲存螢光標記");
  penTip("已標示");
}

async function penErase(){
  const info = penCurrentSel();
  if(info){
    const rm = new Set();
    info.box.querySelectorAll("mark.umk").forEach(mk => {
      if(mk.closest("[data-pen]") !== info.box) return;
      /* 以文字位置判斷是否與選取範圍重疊 */
      let base = 0, ms = -1, me = -1;
      penNodes(info.box).forEach(n => {
        if(mk.contains(n)){ if(ms < 0) ms = base; me = base + n.length; }
        base += n.length;
      });
      if(ms < info.e && me > info.s) rm.add(mk.dataset.mid);
    });
    penClearSel();
    if(!rm.size){ penTip("選取範圍內沒有標記"); return; }
    await penSave(penMarks(PEN.s).filter(m => !rm.has(m.id)), "已移除螢光標記");
    penTip("已移除");
    return;
  }
  PEN.erase = !PEN.erase;
  penBarState();
  penTip(PEN.erase ? "橡皮擦:點一下要移除的標記" : "選取文字後點顏色");
}

function penTip(t){ const x = el("penTip"); if(x) x.textContent = t; }

function penBarState(){
  const bar = el("penBar"); if(!bar) return;
  bar.hidden = !PEN.on;
  bar.querySelectorAll(".pen-sw").forEach(b =>
    b.setAttribute("aria-pressed", (!PEN.erase && b.dataset.c === PEN.color) ? "true" : "false"));
  const er = bar.querySelector(".pen-erase");
  if(er) er.setAttribute("aria-pressed", PEN.erase ? "true" : "false");
  document.querySelectorAll("#detail .pen-btn").forEach(b => b.setAttribute("aria-pressed", PEN.on ? "true" : "false"));
  document.body.classList.toggle("pen-on", PEN.on);
  document.body.classList.toggle("pen-erasing", PEN.on && PEN.erase);
}

function penToggle(ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  PEN.on = !PEN.on;
  PEN.erase = false;
  penClearSel();
  penBarState();
  if(PEN.on) penTip("長按選取文字,再點顏色");
  return false;
}

function penEnsureBar(){
  if(el("penBar")) return;
  const bar = document.createElement("div");
  bar.id = "penBar";
  bar.className = "pen-bar";
  bar.hidden = true;
  bar.innerHTML = `
    <div class="pen-tip" id="penTip">長按選取文字,再點顏色</div>
    <div class="pen-tools">
      ${PEN_COLORS.map(x => `<button type="button" class="pen-sw umk-${x.c}" data-c="${x.c}" aria-pressed="false">${x.name}</button>`).join("")}
      <button type="button" class="pen-erase" aria-pressed="false">擦除</button>
      <button type="button" class="pen-done">完成</button>
    </div>`;
  document.body.appendChild(bar);
  /* 按下時不讓選取範圍消失(桌機) */
  bar.addEventListener("mousedown", e => e.preventDefault());
  bar.querySelectorAll(".pen-sw").forEach(b => b.addEventListener("click", () => penApply(b.dataset.c)));
  bar.querySelector(".pen-erase").addEventListener("click", penErase);
  bar.querySelector(".pen-done").addEventListener("click", () => { if(PEN.on) penToggle(); });

  document.addEventListener("selectionchange", () => {
    if(!PEN.on) return;
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || sel.isCollapsed){
      if(PEN.sel && !PEN.collapsedAt) PEN.collapsedAt = Date.now();
      return;
    }
    const info = penRangeInfo(sel.getRangeAt(0));
    if(info){ PEN.sel = info; PEN.collapsedAt = 0; }
  });

  /* 橡皮擦模式:點標記即移除 */
  document.addEventListener("click", async e => {
    if(!PEN.on || !PEN.erase) return;
    const mk = e.target.closest && e.target.closest("#detail mark.umk");
    if(!mk) return;
    e.preventDefault(); e.stopPropagation();
    const id = mk.dataset.mid;
    await penSave(penMarks(PEN.s).filter(m => m.id !== id), "已移除螢光標記");
    penTip("已移除,可繼續點其他標記");
  }, true);
}

/* 每次開啟術式詳情時呼叫:放按鈕、套用既有標記 */
function initPen(s){
  PEN.s = s;
  PEN.on = false; PEN.erase = false;
  PEN.sel = null; PEN.collapsedAt = 0;
  penEnsureBar();
  penBoxes().forEach(b => {
    b.box.setAttribute("data-pen", b.id);
    const btn = `<button type="button" class="pen-btn" aria-pressed="false" title="螢光筆" onclick="return penToggle(event)">🖍</button>`;
    if(b.head){
      b.head.insertAdjacentHTML("beforeend", btn);
    }else{
      const row = document.createElement("div");
      row.className = "pen-row";
      row.innerHTML = btn;
      const own = b.box.querySelector(":scope > summary, :scope > h3");
      const sec = b.box.closest("[data-sec]");
      const title = own || (sec && sec.querySelector(":scope > summary, :scope > h3"));
      title ? title.insertAdjacentHTML("beforeend", btn) : b.box.prepend(row);
    }
  });
  penRender();
  penBarState();
}

        <div class="item pos"><div class="k">Position</div><div class="v">${posIcon(sum.posType)}<span>${sum.position||"—"}</span></div></div>
        <div class="item"><div class="k">預估時間</div><div class="v">${sum.time||"—"}</div></div>
        <div class="item"><div class="k">預估失血</div><div class="v">${sum.blood||"—"}</div></div>
        <div class="item"><div class="k">麻醉方式</div><div class="v">${sum.airway||"—"}</div></div>
      </div>`}
    </div>
    ${sections}
    ${flagBoxHtml(s)}
    ${s.refs && s.refs.length ? `
      <div class="refs-box">
        <details class="refs-det">
          <summary><span>文獻出處　References</span><span class="refs-num">${s.refs.length}</span></summary>
          <ol>${s.refs.map(x=>`<li>${x}</li>`).join("")}</ol>
        </details>
      </div>` : ""}

    </div>

  el("backBtn").onclick = goBack;
  el("backBtnBottom").onclick = goBack;
  el("app").classList.add("stage-detail");
  renderList();
  el("detail").scrollTop = 0;
  window.scrollTo(0,0);
}

/* 往回一層:分區內頁 → 分區選擇頁 → 清單 */
function stepBack(){
  const b = (activeId != null) ? SURGERIES[activeId] : null;
  if(b && b.variants && activeVar != null){ showDetail(activeId); return; }
  goBack();
}

/* 返回清單:收起詳情、回到頁面頂端 */
function goBack(){
  activeVar = null;
  if(typeof PEN !== "undefined" && PEN.on){ PEN.on = false; PEN.erase = false; penBarState(); }
  el("app").classList.remove("stage-detail");
  el("detail").scrollTop = 0;
  window.scrollTo(0,0);
}

/* ============================================================
   手勢:在手術詳情頁往右滑 → 返回清單
   ------------------------------------------------------------
   只在手機版(stage-detail 生效時)作用;若手指起點落在可橫向
   捲動的元素(示意圖、表格等)上則不攔截,避免誤觸。
   ============================================================ */
(function(){
  const SWIPE_X = 70;   /* 水平位移門檻 px */
  const SWIPE_Y = 55;   /* 垂直位移上限 px,超過視為捲動 */
  let x0 = 0, y0 = 0, live = false;
  const pane = el("detail");
  if(!pane) return;

  function scrollableX(node){
    while(node && node !== pane){
      if(node.scrollWidth - node.clientWidth > 8) return true;
      node = node.parentElement;
    }
    return false;
  }
  pane.addEventListener("touchstart", e => {
    live = false;
    if(e.touches.length !== 1) return;
    if(!el("app").classList.contains("stage-detail")) return;
    if(typeof PEN !== "undefined" && PEN.on) return;   /* 螢光筆模式時不觸發滑動返回,避免選字時誤觸 */
    if(scrollableX(e.target)) return;
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    live = true;
  }, { passive:true });
  pane.addEventListener("touchend", e => {
    if(!live) return;
    live = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if(dx > SWIPE_X && Math.abs(dy) < SWIPE_Y) stepBack();
  }, { passive:true });
})();

el("search").addEventListener("input", renderList);
el("impFile").addEventListener("change", function(){
  const f = this.files && this.files[0];
  this.value = "";
  if(f) importNotes(f);
});
renderChips();
renderList();
initNotes();

/* ============================================================
   自動更新:檔案推上 GitHub 後,手機回到 app 或每隔一段時間
   會自動偵測伺服器上的新版並更新,不必重開連結。
   原理:以 no-store 抓自身網址,比對 ETag / Last-Modified
   (取不到時退而比對內容雜湊)。只在 GitHub Pages 等 http(s)
   環境有效;本機 file:// 開啟會靜默略過。
   ============================================================ */
(function(){
  var SELF = location.href.split('#')[0].split('?')[0];
  var baseline = null;
  function hash(t){var h=0;for(var i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0;}return t.length+':'+h;}
  function getSig(){
    /* 先用 HEAD 只取標頭,不下載整份檔案(省流量、不與首次載入搶頻寬) */
    return fetch(SELF,{method:'HEAD',cache:'no-store'}).then(function(res){
      if(!res.ok) throw 0;
      var e=res.headers.get('etag'), m=res.headers.get('last-modified');
      if(e) return 'e:'+e;
      if(m) return 'm:'+m;
      throw 0;
    }).catch(function(){
      /* 伺服器不支援 HEAD 或沒回這兩個標頭時,才退回抓全檔比對 */
      return fetch(SELF,{cache:'no-store'}).then(function(res){
        if(!res.ok) throw 0;
        var e=res.headers.get('etag'), m=res.headers.get('last-modified');
        if(e) return 'e:'+e;
        if(m) return 'm:'+m;
        return res.text().then(function(t){return 'h:'+hash(t);});
      });
    });
  }
  window.applyUpdate=function(){ location.reload(); };
  function onNew(){
    var app=document.getElementById('app');
    if(app && app.classList.contains('stage-detail')){
      var b=document.getElementById('upd'); if(b) b.style.display='flex';
    } else { location.reload(); }
  }
  function check(){
    getSig().then(function(sig){
      if(baseline===null){ baseline=sig; return; }
      if(sig!==baseline){ onNew(); }
    }).catch(function(){});
  }
  check();
  setInterval(check, 60000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
  window.addEventListener('focus', check);
})();
</script>
