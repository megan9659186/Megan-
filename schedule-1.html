<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="排班">
<link rel="apple-touch-icon" href="icon.png">
<title>排班</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#1a1a1a;background:#f5f1e8;padding:calc(env(safe-area-inset-top,20px) + 16px) 12px 12px 12px;font-size:16px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav h2{font-size:22px;font-weight:500;color:#2d5043}
.nav button{background:#2d5043;color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dh{text-align:center;font-size:14px;color:#8a8078;padding:4px 0;font-weight:500}
.cell{position:relative;background:#faf7f2;border:0.5px solid #d8d0c0;border-radius:0;min-height:70px;display:flex;flex-direction:column;overflow:visible;cursor:pointer}
.cell.empty{background:transparent;border-color:transparent;cursor:default}
.cell.today .dn{background:#a07850;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:16px}
.cell.swapped .badge{background:#c9905a}
.cell.has-note::after{content:'•';position:absolute;top:2px;right:4px;font-size:10px;color:#8a8078;z-index:5}
.cell.selected .top{background:#ecddd8!important}
.cell.selected .dn{color:#804030!important}
.cell.selected .bot{background:#f4ece8!important}
.cell.other-working{background:#e8f0f8!important}
.cell.other-working .bot{background:#d8e8f4!important}
.cell.z-top{border-top:3px solid var(--zc)!important}
.cell.z-bottom{border-bottom:3px solid var(--zc)!important}
.cell.z-left{border-left:3px solid var(--zc)!important}
.cell.z-right{border-right:3px solid var(--zc)!important}
.badge{position:absolute;top:-7px;left:-7px;width:22px;height:22px;background:#2d5043;color:#fff;border-radius:50%;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:10}
.top{background:#fff;flex:0 0 50%;display:flex;align-items:center;justify-content:center;position:relative;padding-bottom:10px}
.hol-name{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:8px;color:#b03030;font-weight:600;line-height:1}
.dn{font-size:21px;font-weight:600;color:#1a1a1a}
.dn.holiday{color:#b03030}
.bot{flex:0 0 50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:2px}
.sD{background:#f9f6f0;color:#5a4a2a}
.sDhol{background:#c8bfaa;color:#3a2a10}
.sE{background:#b5c4ce;color:#2a4050}
.sN{background:#d9c891;color:#50420a}
.sOFF{background:#c89a96;color:#5a1a18}
.s12{background:#a8b89d;color:#1a3020}
.panel{background:#faf7f2;border:1px solid #d8d0c0;border-radius:12px;padding:16px;margin-top:14px;display:none}
.panel.open{display:block}
.panel-title{font-size:17px;font-weight:600;margin-bottom:4px;color:#2d5043}
.panel-sub{font-size:14px;color:#8a8078;margin-bottom:4px}
.panel-hol{font-size:14px;color:#b03030;font-weight:600;margin-bottom:10px;display:none}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab-btn{flex:1;padding:9px;border:1px solid #d8d0c0;border-radius:8px;background:transparent;font-size:14px;cursor:pointer;color:#8a8078}
.tab-btn.active{background:#2d5043;color:#fff;border-color:#2d5043}
.field-label{font-size:14px;color:#8a8078;margin-bottom:5px}
select{width:100%;padding:10px 12px;border:1px solid #d8d0c0;border-radius:8px;background:#fff;color:#1a1a1a;font-size:16px;appearance:none}
.preview-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px}
.pg-head{text-align:center;background:#2d5043;color:#fff;border-radius:4px;font-size:10px;padding:3px 1px;font-weight:600}
.pg-cell{text-align:center;padding:5px 1px;border-radius:4px;font-size:10px;font-weight:600}
.shift-btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sb{padding:7px 11px;border-radius:8px;border:1px solid #d8d0c0;font-size:13px;cursor:pointer;font-weight:600}
.sb.active{border:2px solid #2d5043}
.note-area{width:100%;padding:10px 12px;border:1px solid #d8d0c0;border-radius:8px;font-size:16px;background:#fff;color:#1a1a1a;margin-top:6px;min-height:70px;resize:none;font-family:inherit}
.confirm-btn{width:100%;padding:13px;background:#2d5043;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:600;cursor:pointer;margin-top:14px}
.cancel-btn{width:100%;padding:10px;background:transparent;color:#8a8078;border:1px solid #d8d0c0;border-radius:8px;font-size:14px;cursor:pointer;margin-top:8px}
.sec-title{font-size:17px;font-weight:600;color:#2d5043;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid #d8d0c0}
.rec-list{list-style:none}
.rec-item{padding:10px 0;border-bottom:0.5px solid #f0ece0}
.rec-item:last-child{border:none}
.rec-item-head{display:flex;align-items:center;gap:8px}
.rec-tag{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.rec-tag.week{background:#e8f0e8;color:#2d5043}
.rec-tag.day{background:#fdf0e8;color:#8a4020}
.rec-desc{flex:1;font-size:14px}
.rec-del{background:none;border:none;color:#c89a96;font-size:18px;cursor:pointer;padding:0 4px}
.rec-note{font-size:13px;color:#8a8078;margin-top:4px;padding-left:4px;border-left:2px solid #d8d0c0}
.empty-msg{font-size:14px;color:#8a8078;text-align:center;padding:18px 0}
/* ── 時數功能 ── */
/* 餘額總覽卡片列 */
.hours-summary{display:flex;gap:8px;margin-top:10px}
.hs-card{flex:1;border-radius:10px;padding:10px 12px;border:1px solid #d8d0c0}
.hs-card.jiji{background:#eef5f0;border-color:#b8d4c0}
.hs-card.nian{background:#f0ecf8;border-color:#c8bce8}
.hs-card-label{font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:4px}
.hs-card.jiji .hs-card-label{color:#5a8a6a}
.hs-card.nian .hs-card-label{color:#7a6ab0}
.hs-card-val{font-size:22px;font-weight:700;line-height:1}
.hs-card.jiji .hs-card-val{color:#2d6040}
.hs-card.nian .hs-card-val{color:#5a48a0}
.hs-card-unit{font-size:11px;color:#8a8078;margin-top:2px}
/* 年休進度條 */
.nian-bar-row{display:flex;align-items:center;gap:8px;background:#faf7f2;border:1px solid #d8d0c0;border-radius:10px;padding:10px 14px;margin-top:8px}
.nbl{font-size:12px;font-weight:700;color:#9b8fcc;width:28px;flex-shrink:0}
.nbt{flex:1;height:6px;background:#e8e0d4;border-radius:99px;overflow:hidden}
.nbf{height:100%;background:#9b8fcc;border-radius:99px;transition:width 0.4s}
.nbn{font-size:11px;color:#8a8078;white-space:nowrap;min-width:80px;text-align:right}
/* 設定列（年休總額、積休初始） */
.hours-settings{display:flex;gap:14px;margin-top:6px;padding:0 2px;flex-wrap:wrap}
.nts-group{display:flex;align-items:center;gap:5px}
.nts-label{font-size:11px;color:#8a8078}
.nts-input{width:52px;padding:3px 6px;border:1px solid #d8d0c0;border-radius:6px;font-size:13px;font-weight:600;color:#5a48a0;background:#fff;text-align:center;font-family:inherit}
.nts-input.jiji-color{color:#2d6040}
/* 時數 badge 在格子上 */
.hbadge{display:block;font-size:8px;font-weight:700;padding:1px 3px;border-radius:3px;line-height:1.4;text-align:center;margin-top:1px}
.hb-j-p{background:#e4f0e8;color:#5a8a6a}
.hb-j-m{background:#f7eaea;color:#b03030}
.hb-n-m{background:#f7eaea;color:#b03030}
/* 時數按鈕（在 panel 底部） */
.hours-trigger-btn{width:100%;padding:10px;background:#f0ece4;color:#6a7a6a;border:1px solid #d8d0c0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.hours-trigger-btn.has-data{background:#eaf2ec;color:#2d6040;border-color:#a8c8a8}
/* 時數輸入浮層 */
.hours-overlay{display:none;position:fixed;inset:0;background:rgba(26,26,26,0.4);z-index:300;align-items:flex-end;justify-content:center}
.hours-overlay.open{display:flex}
.hours-sheet{background:#faf7f2;border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:0 0 env(safe-area-inset-bottom,16px);animation:hup 0.2s ease}
@keyframes hup{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.hs-handle{padding:10px 0 0;display:flex;justify-content:center}
.hs-handle-bar{width:36px;height:4px;background:#d8d0c0;border-radius:99px}
.hs-head{padding:10px 16px 10px;border-bottom:1px solid #d8d0c0}
.hs-date{font-size:15px;font-weight:600;color:#2d5043}
.hs-shift{font-size:12px;color:#8a8078;margin-top:2px}
.hs-body{padding:14px 16px 16px}
.hs-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hs-row-label{font-size:13px;font-weight:700;width:28px;flex-shrink:0}
.hs-row-label.j{color:#5a8a6a}
.hs-row-label.n{color:#7a6ab0}
.hs-selwrap{display:flex;gap:6px;flex:1}
.hdir{flex:0 0 96px;appearance:none;-webkit-appearance:none;border:1px solid #d8d0c0;border-radius:8px;padding:9px 6px 9px 10px;font-size:14px;font-weight:700;background:#fff;color:#1a1a1a;font-family:inherit;cursor:pointer}
.hdir.ot{border-color:#c8a87a;color:#7a5020;background:#fdf2e4}
.hdir.jm{border-color:#c89a96;color:#b03030;background:#f7eaea}
.hdir.nm{border-color:#c89a96;color:#b03030;background:#f7eaea}
.hhrs{flex:1;appearance:none;-webkit-appearance:none;border:1px solid #d8d0c0;border-radius:8px;padding:9px 10px;font-size:14px;font-weight:600;background:#fff;color:#1a1a1a;font-family:inherit;cursor:pointer}
.hs-btns{display:flex;gap:8px;margin-top:4px}
.hs-btn-clear{padding:10px 12px;border:1px solid #e0c4c4;border-radius:8px;background:#f7eaea;color:#b03030;font-size:13px;cursor:pointer;font-family:inherit}
.hs-btn-cancel{flex:1;padding:10px;border:1px solid #d8d0c0;border-radius:8px;background:transparent;color:#8a8078;font-size:14px;cursor:pointer;font-family:inherit}
.hs-btn-save{flex:2;padding:10px;border:none;border-radius:8px;background:#2d5043;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.hcustom{width:100%;padding:9px 12px;border:1px solid #c8a87a;border-radius:8px;font-size:15px;font-weight:600;background:#fdf2e4;color:#7a5020;font-family:inherit;outline:none}
/* ── 夜班津貼 ── */
.allow-wrap{margin-top:10px;background:#faf7f2;border:1px solid #d8d0c0;border-radius:10px;overflow:hidden}
.allow-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px}
.allow-title{font-size:12px;font-weight:700;color:#4a5a52;letter-spacing:1px}
.allow-month-total{font-size:13px;font-weight:700;color:#2d5043}
.allow-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #ece6dc}
.allow-cell{padding:8px 10px;border-right:1px solid #ece6dc;border-bottom:1px solid #ece6dc}
.allow-cell:nth-child(3n){border-right:none}
.allow-cell-label{font-size:10px;color:#8a8078;margin-bottom:3px;letter-spacing:0.5px}
.allow-cell-val{font-size:14px;font-weight:700;color:#2d5043}
.allow-cell-count{font-size:10px;color:#a89880;margin-top:1px}
.allow-note{font-size:10px;color:#a89880;padding:6px 14px 8px;border-top:1px solid #ece6dc}
.allow-manual{width:100%;margin-top:5px;padding:3px 6px;border:1px solid #d8d0c0;border-radius:5px;font-size:11px;background:#faf7f2;color:#2d5043;font-family:inherit;box-sizing:border-box}
</style>
</head>
<body>
<div class="nav">
  <button onclick="prev()">&#8249;</button>
  <h2 id="title"></h2>
  <button onclick="next()">&#8250;</button>
</div>
<div class="grid" id="gridHead"></div>
<div class="grid" id="grid"></div>

<!-- 積休 年休 餘額總覽 -->
<div class="hours-summary">
  <div class="hs-card jiji">
    <div class="hs-card-label">積　休</div>
    <div class="hs-card-val" id="jijiBalVal">0</div>
    <div class="hs-card-unit">小時</div>
  </div>
  <div class="hs-card nian">
    <div class="hs-card-label">年　休</div>
    <div class="hs-card-val" id="nianBalVal">0</div>
    <div class="hs-card-unit">小時</div>
  </div>
</div>
<!-- 年休進度條 -->
<div class="nian-bar-row">
  <span class="nbl">年休</span>
  <div class="nbt"><div class="nbf" id="nianFill" style="width:0%"></div></div>
  <span class="nbn" id="nianNums">已用 0 / 72 hr</span>
</div>
<!-- 設定：年休總額 + 積休初始 -->
<div class="hours-settings">
  <div class="nts-group">
    <span class="nts-label">年休總額：</span>
    <input class="nts-input" id="nianTotalInput" type="number" min="0" max="999" value="52" onchange="saveSettings()">
    <span class="nts-label">hr</span>
  </div>
  <div class="nts-group">
    <span class="nts-label">積休初始：</span>
    <input class="nts-input jiji-color" id="jijiInitInput" type="number" min="0" max="999" step="any" value="21.45" onchange="saveSettings()">
    <span class="nts-label">hr</span>
  </div>
</div>

<!-- 夜班津貼 -->
<div class="allow-wrap">
  <div class="allow-header">
    <span class="allow-title">夜班津貼</span>
    <span class="allow-month-total" id="allowTotal">本月 $0</span>
  </div>
  <div class="allow-grid">
    <div class="allow-cell">
      <div class="allow-cell-label">12-8 班 $270</div>
      <div class="allow-cell-val" id="allow12Val">$0</div>
      <div class="allow-cell-count" id="allow12Count">0 班</div>
      <input class="allow-manual" id="allow12Adj" type="number" step="any" placeholder="手動調整 $" onchange="saveAllowAdj()">
    </div>
    <div class="allow-cell">
      <div class="allow-cell-label">E 班 $560／包班 $640</div>
      <div class="allow-cell-val" id="allowEVal">$0</div>
      <div class="allow-cell-count" id="allowECount">0 班</div>
      <input class="allow-manual" id="allowEAdj" type="number" step="any" placeholder="手動調整 $" onchange="saveAllowAdj()">
    </div>
    <div class="allow-cell">
      <div class="allow-cell-label">N 班 $770／包班 $960</div>
      <div class="allow-cell-val" id="allowNVal">$0</div>
      <div class="allow-cell-count" id="allowNCount">0 班</div>
      <input class="allow-manual" id="allowNAdj" type="number" step="any" placeholder="手動調整 $" onchange="saveAllowAdj()">
    </div>
    <div class="allow-cell">
      <div class="allow-cell-label">D班加班 $270</div>
      <div class="allow-cell-val" id="allowDotVal">$0</div>
      <div class="allow-cell-count" id="allowDotCount">0 班</div>
    </div>
  </div>
  <div class="allow-note" id="allowNote">＊ 依當月班別自動計算，D班加班≥1.5hr 計入 $270</div>
</div>

<div class="panel" id="panel">
  <div class="panel-title" id="panelTitle"></div>
  <div class="panel-sub" id="panelSub"></div>
  <div class="panel-hol" id="panelHol"></div>
  <div class="tabs">
    <button class="tab-btn active" id="tabWeek" onclick="switchTab('week')">換號碼班（整週）</button>
    <button class="tab-btn" id="tabDay" onclick="switchTab('day')">修改當天班別</button>
  </div>
  <div id="formWeek">
    <div class="field-label">換成哪個號碼班</div>
    <select id="numSel" onchange="renderPreview()"><option value="">-- 選擇 --</option></select>
    <div id="preview" style="display:none">
      <div class="field-label" style="margin-top:10px">換後班表預覽：</div>
      <div class="preview-grid" id="previewGrid"></div>
    </div>
    <div class="field-label" style="margin-top:14px">備註</div>
    <textarea class="note-area" id="weekNote" placeholder="例：和真真換班"></textarea>
  </div>
  <div id="formDay" style="display:none">
    <div class="field-label">選擇班別</div>
    <div class="shift-btns" id="shiftBtns"></div>
    <div class="field-label" style="margin-top:14px">備註</div>
    <textarea class="note-area" id="dayNote" placeholder="例：假日加班、換班原因…"></textarea>
  </div>
  <button class="confirm-btn" onclick="confirmAction()">確認</button>
  <button class="cancel-btn" onclick="closePanel()">取消</button>
  <!-- 時數按鈕 -->
  <button class="hours-trigger-btn" id="hoursTriggerBtn" onclick="openHoursSheet()">⏱ 記錄時數（積休／年休）</button>
</div>

<!-- 時數輸入浮層 -->
<div class="hours-overlay" id="hoursOverlay" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="hours-sheet">
    <div class="hs-handle"><div class="hs-handle-bar"></div></div>
    <div class="hs-head">
      <div class="hs-date" id="hsDate"></div>
      <div class="hs-shift" id="hsShift"></div>
    </div>
    <div class="hs-body">
      <div class="hs-row">
        <span class="hs-row-label j">積休</span>
        <div class="hs-selwrap" style="flex-direction:column;gap:6px">
          <div style="display:flex;gap:6px">
            <select class="hdir ot" id="jijiDir" onchange="updateHDir('jiji')">
              <option value="+">加班</option>
              <option value="-">拿時間</option>
            </select>
            <select class="hhrs" id="jijiHrs" onchange="toggleCustom('jiji')">
              <option value="0">不填</option>
              <option value="0.5">0.5 hr</option>
              <option value="1">1 hr</option>
              <option value="1.5">1.5 hr</option>
              <option value="2">2 hr</option>
              <option value="2.5">2.5 hr</option>
              <option value="3">3 hr</option>
              <option value="3.5">3.5 hr</option>
              <option value="4">4 hr</option>
              <option value="4.5">4.5 hr</option>
              <option value="5">5 hr</option>
              <option value="custom">自訂…</option>
            </select>
          </div>
          <input class="hcustom" type="number" id="jijiCustom" min="0.5" max="99" step="0.5" placeholder="輸入時數（hr）" style="display:none">
        </div>
      </div>
      <div class="hs-row">
        <span class="hs-row-label n">年休</span>
        <div class="hs-selwrap" style="flex-direction:column;gap:6px">
          <div style="display:flex;gap:6px">
            <select class="hdir nm" id="nianDir" style="pointer-events:none;opacity:0.6">
              <option value="-">拿時間</option>
            </select>
            <select class="hhrs" id="nianHrs" onchange="toggleCustom('nian')">
              <option value="0">不填</option>
              <option value="0.5">0.5 hr</option>
              <option value="1">1 hr</option>
              <option value="1.5">1.5 hr</option>
              <option value="2">2 hr</option>
              <option value="2.5">2.5 hr</option>
              <option value="3">3 hr</option>
              <option value="3.5">3.5 hr</option>
              <option value="4">4 hr</option>
              <option value="4.5">4.5 hr</option>
              <option value="5">5 hr</option>
              <option value="custom">自訂…</option>
            </select>
          </div>
          <input class="hcustom" type="number" id="nianCustom" min="0.5" max="99" step="0.5" placeholder="輸入時數（hr）" style="display:none">
        </div>
      </div>
      <div class="hs-btns">
        <button class="hs-btn-clear" onclick="clearHoursForm()">清除</button>
        <button class="hs-btn-cancel" onclick="document.getElementById('hoursOverlay').classList.remove('open')">取消</button>
        <button class="hs-btn-save" onclick="saveHoursEntry()">儲存</button>
      </div>
    </div>
  </div>
</div>
<div class="sec-title">換班紀錄</div>
<ul class="rec-list" id="recList"></ul>
<script>
const SCH={1:['D2','D','D5','D','D7','OFF','N2'],2:['N1','N2','OFF','OFF','N2','N1','OFF'],3:['E3','E3','E3','E3','E3','OFF','E1'],4:['E4','E4','E4','E4','E4','OFF','OFF'],5:['D10','D8','D2','D','D4','D1','OFF'],6:['E1','E1','E1','E1','E1','OFF','N1'],7:['N2','N1','N1','N2','OFF','OFF','OFF'],8:['D4','D6','D','D10','D3','OFF','OFF'],9:['E2','E2','E2','E2','E2','E2','OFF'],10:['D5','D','D6','D2','DB1','D2','OFF'],11:['DB1','D7','D1','D8','D5','OFF','OFF'],12:['D3','DB1','N2','N1','N1','N2','OFF'],13:['OFF','D10','D3','D7','D1','OFF','OFF'],14:['D','D','D','D','D','OFF','E2'],15:['12-8 2','12-8 3','12-8 1','12-8 2','12-8 3','OFF','OFF'],16:['D7','D4','D9','DB1','D2','OFF','D2'],17:['D','D3','D10','D1','D9','OFF','OFF'],18:['12-8 3','12-8 1','12-8 2','12-8 3','12-8 1','E1','OFF'],19:['12-8 1','12-8 2','12-8 3','12-8 1','12-8 2','OFF','OFF'],20:['D1','D9','D4','D9','D6','OFF','OFF'],21:['D9','D','DB1','D6','D8','OFF','D1'],22:['D','D','D','D','D','OFF','OFF'],23:['OFF','OFF','OFF','OFF','OFF','OFF','OFF'],24:["D'OFF",'D','D','D','D','OFF','OFF'],25:['D','D','D','D','D','OFF','OFF'],26:['D8','D2','D7','D4','D','OFF.B','OFF'],27:['D6','D1','D8','D3','D10','OFF','OFF'],28:['D','D5','D','D5','D','OFF','OFF'],29:['D11','D11','D11','D11','D11','OFF','OFF'],30:['D','D','D','D','D','OFF','OFF'],31:['D12','D12','D12','D12','D12','OFF','OFF'],32:['D','D','D','D','D','OFF','OFF'],33:['D','D','D','D','D','OFF','OFF'],34:['D','D','D','D','D','OFF','OFF'],35:['D','D','D','D','D','OFF','OFF']};
const ANC=new Date(2026,5,8);
const ZONE_ANC=new Date(2026,5,8);
const ZONE_COLORS=['#8a9ea8','#a89bb0','#b8a878','#8fa68a','#b8a898','#9aabba'];
const ME={w1:16};
const HOL={'2026-01-01':'元旦','2026-02-17':'初一','2026-02-18':'初二','2026-02-19':'初三','2026-02-20':'初四','2026-02-21':'初五','2026-02-28':'228','2026-04-04':'兒童節','2026-04-05':'清明節','2026-05-01':'勞動節','2026-06-19':'端午節','2026-09-25':'中秋節','2026-09-28':'教師節','2026-10-10':'國慶日','2026-10-25':'光復節','2026-12-25':'行憲紀念日'};
const COMMON=['D','D1','D2','D3','D4','D5','D6','D7','D8','D9','D10','DB1','E1','E2','E3','E4','N1','N2','12-8 1','12-8 2','12-8 3','OFF'];
const DZ=['日','一','二','三','四','五','六'];
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ad(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function kd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function wo(date){const dow=date.getDay(),mon=ad(date,-((dow+6)%7));return Math.round((mon-ANC)/(7*86400000))}
function nf(w,woff){return((w-1+woff)%35+35)%35+1}
function monKey(date){return dk(ad(date,-((date.getDay()+6)%7)))}
function getZoneIdx(date){return(((Math.floor((date-ZONE_ANC)/86400000/28))%6)+6)%6;}
function getZoneColor(date){return ZONE_COLORS[getZoneIdx(date)];}
let wS={},dS={},nS={};
try{const s=localStorage.getItem('megan_wswaps');if(s)wS=JSON.parse(s);}catch(e){}
try{const s=localStorage.getItem('megan_dswaps');if(s)dS=JSON.parse(s);}catch(e){}
try{const s=localStorage.getItem('megan_notes');if(s)nS=JSON.parse(s);}catch(e){}
let oD={};  // 他人班表
try{const s=localStorage.getItem('megan_other');if(s)oD=JSON.parse(s);}catch(e){}
function saveOther(){try{localStorage.setItem('megan_other',JSON.stringify(oD));}catch(e){}}
function updateOtherLabel(){
  const el=document.getElementById('otherWorking');
  const label=document.getElementById('otherLabel');
  if(el&&label)label.textContent=el.checked?'有班':'休息';
}
// ── 時數資料 ──
let hD={};
let nianTotal=52, jijiInit=21.45;
try{const s=localStorage.getItem('megan_hours');if(s)hD=JSON.parse(s);}catch(e){}
try{const s=localStorage.getItem('megan_hours_cfg');if(s){const c=JSON.parse(s);nianTotal=parseFloat(c.nianTotal)||52;jijiInit=parseFloat(c.jijiInit)||0;}}catch(e){}
function saveHours(){try{localStorage.setItem('megan_hours',JSON.stringify(hD));}catch(e){}}
function saveSettings(){
  nianTotal=parseFloat(document.getElementById('nianTotalInput').value)||52;
  jijiInit=parseFloat(document.getElementById('jijiInitInput').value)||0;
  try{localStorage.setItem('megan_hours_cfg',JSON.stringify({nianTotal,jijiInit}));}catch(e){}
  refreshBalance();
}
// 計算積休餘額：初始 + 加班時數 - 拿時間時數
function calcJijiBalance(){
  let bal=jijiInit;
  for(const k in hD){const e=hD[k];if(e.jiji>0)bal+=(e.jijiDir==='+'?e.jiji:-e.jiji);}
  return bal;
}
// 計算年休已用（全部 nian 都是拿時間 = 扣）
function calcNianUsed(){
  let u=0;for(const k in hD){const e=hD[k];if(e.nian>0)u+=e.nian;}return u;
}
function refreshBalance(){
  const jijiB=calcJijiBalance();
  const nianU=calcNianUsed();
  const nianB=nianTotal-nianU;
  document.getElementById('jijiBalVal').textContent=jijiB;
  document.getElementById('nianBalVal').textContent=nianB;
  const pct=Math.min(100,nianTotal>0?Math.round(nianU/nianTotal*100):0);
  document.getElementById('nianFill').style.width=pct+'%';
  document.getElementById('nianNums').textContent='已用 '+nianU+' / '+nianTotal+' hr';
}
function openHoursSheet(){
  if(!selKey)return;
  const date=kd(selKey);
  const{s}=getShift(date);
  document.getElementById('hsDate').textContent=(date.getMonth()+1)+'/'+date.getDate()+' （週'+DZ[date.getDay()]+'）';
  document.getElementById('hsShift').textContent='班別：'+s;
  const e=hD[selKey]||{};
  // 積休
  document.getElementById('jijiDir').value=e.jijiDir||'+';
  const jv=e.jiji||0;
  const jSel=document.getElementById('jijiHrs');
  const jCustom=document.getElementById('jijiCustom');
  if(jv>0&&jv<=5&&jv*2===Math.round(jv*2)){jSel.value=jv;jCustom.style.display='none';}
  else if(jv>5||jv%0.5!==0){jSel.value='custom';jCustom.style.display='block';jCustom.value=jv||'';}
  else{jSel.value=0;jCustom.style.display='none';}
  // 年休
  const nv=e.nian||0;
  const nSel=document.getElementById('nianHrs');
  const nCustom=document.getElementById('nianCustom');
  if(nv>0&&nv<=5&&nv*2===Math.round(nv*2)){nSel.value=nv;nCustom.style.display='none';}
  else if(nv>5||nv%0.5!==0){nSel.value='custom';nCustom.style.display='block';nCustom.value=nv||'';}
  else{nSel.value=0;nCustom.style.display='none';}
  updateHDir('jiji');
  document.getElementById('hoursOverlay').classList.add('open');
}
function toggleCustom(type){
  const sel=document.getElementById(type+'Hrs');
  const inp=document.getElementById(type+'Custom');
  if(sel.value==='custom'){inp.style.display='block';inp.focus();}
  else{inp.style.display='none';}
}
function getHoursVal(type){
  const sel=document.getElementById(type+'Hrs');
  if(sel.value==='custom'){const v=parseFloat(document.getElementById(type+'Custom').value);return isNaN(v)?0:v;}
  return parseFloat(sel.value)||0;
}
function updateHDir(type){
  if(type!=='jiji')return;
  const sel=document.getElementById('jijiDir'),v=sel.value;
  sel.className='hdir '+(v==='+'?'ot':'jm');
}
function clearHoursForm(){
  document.getElementById('jijiDir').value='+';
  document.getElementById('jijiHrs').value=0;
  document.getElementById('jijiCustom').style.display='none';
  document.getElementById('nianHrs').value=0;
  document.getElementById('nianCustom').style.display='none';
  updateHDir('jiji');
}
function saveHoursEntry(){
  const jh=getHoursVal('jiji');
  const jd=document.getElementById('jijiDir').value;
  const nh=getHoursVal('nian');
  if(jh===0&&nh===0){delete hD[selKey];}
  else{hD[selKey]={jiji:jh,jijiDir:jd,nian:nh,nianDir:'-'};}
  saveHours();refreshBalance();refreshAllow();
  render();
  document.getElementById('hoursOverlay').classList.remove('open');
  updateHoursBtnStyle();
  document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function updateHoursBtnStyle(){
  const btn=document.getElementById('hoursTriggerBtn');
  if(!btn||!selKey)return;
  const e=hD[selKey];
  const hasData=e&&(e.jiji>0||e.nian>0);
  btn.className='hours-trigger-btn'+(hasData?' has-data':'');
  if(hasData){
    const parts=[];
    if(e.jiji>0)parts.push(e.jijiDir==='+'?'加班+'+e.jiji:'拿時間－'+e.jiji);
    if(e.nian>0)parts.push('年休－'+e.nian);
    btn.textContent='⏱ '+parts.join('　');
  }else{
    btn.textContent='⏱ 記錄時數（積休／年休）';
  }
}
// ── 夜班津貼 ──
const ALLOW_RATE={'12-8':270,'E':560,'N':770,'Dot':270};
let allowAdj={};  // {yyyymm: {a12, aE, aN}} 手動調整
try{const s=localStorage.getItem('megan_allow_adj');if(s)allowAdj=JSON.parse(s);}catch(e){}
function saveAllowAdj(){
  const ym=cy*100+(cm+1);
  const a12=parseFloat(document.getElementById('allow12Adj').value)||0;
  const aE=parseFloat(document.getElementById('allowEAdj').value)||0;
  const aN=parseFloat(document.getElementById('allowNAdj').value)||0;
  if(a12===0&&aE===0&&aN===0)delete allowAdj[ym];
  else allowAdj[ym]={a12,aE,aN};
  try{localStorage.setItem('megan_allow_adj',JSON.stringify(allowAdj));}catch(e){}
  refreshAllow();
}
function calcAllow(){
  const totalDays=new Date(cy,cm+1,0).getDate();
  let c12=0,cE=0,cN=0,cDot=0;
  for(let d=1;d<=totalDays;d++){
    const date=new Date(cy,cm,d);
    const{s}=getShift(date);
    const dow=date.getDay();
    if(s.startsWith('12-8'))c12++;
    else if(s.startsWith('E'))cE++;
    else if(s.startsWith('N'))cN++;
    // D班 週一到五 加班 ≥ 1.5hr
    if(dow>=1&&dow<=5&&s.startsWith('D')&&s!=='DB1'){
      const key=dk(date);
      const he=hD[key];
      if(he&&he.jijiDir==='+'&&he.jiji>=1.5)cDot++;
    }
  }
  // 包班費：E≥15天→$640/天，N≥15天→$960/天
  const rateE=cE>=15?640:560;
  const rateN=cN>=15?960:770;
  return{c12,cE,cN,cDot,rateE,rateN};
}
function refreshAllow(){
  const{c12,cE,cN,cDot,rateE,rateN}=calcAllow();
  const ym=cy*100+(cm+1);
  const adj=allowAdj[ym]||{};
  const adj12=adj.a12||0, adjE=adj.aE||0, adjN=adj.aN||0;
  const a12=c12*270+adj12, aE=cE*rateE+adjE, aN=cN*rateN+adjN, aDot=cDot*270;
  const total=a12+aE+aN+aDot;
  const labelE='E 班 $'+(cE>=15?'640（包班）':'560')+(cE>=15?' ✓':'');
  const labelN='N 班 $'+(cN>=15?'960（包班）':'770')+(cN>=15?' ✓':'');
  document.getElementById('allow12Val').textContent='$'+a12;
  document.getElementById('allow12Count').textContent=c12+' 班';
  document.getElementById('allowEVal').textContent='$'+aE;
  document.getElementById('allowECount').textContent=cE+' 班　'+labelE;
  document.getElementById('allowNVal').textContent='$'+aN;
  document.getElementById('allowNCount').textContent=cN+' 班　'+labelN;
  document.getElementById('allowDotVal').textContent='$'+aDot;
  document.getElementById('allowDotCount').textContent=cDot+' 班';
  document.getElementById('allow12Adj').value=adj12||'';
  document.getElementById('allowEAdj').value=adjE||'';
  document.getElementById('allowNAdj').value=adjN||'';
  document.getElementById('allowTotal').textContent='本月 $'+total;
}
function autoClean(){
  const now=new Date(),ym=now.getFullYear()*100+now.getMonth();
  let changed=false;
  for(const k of Object.keys(wS)){if(kd(k).getFullYear()*100+kd(k).getMonth()<ym){delete wS[k];changed=true;}}
  for(const k of Object.keys(dS)){if(kd(k).getFullYear()*100+kd(k).getMonth()<ym){delete dS[k];changed=true;}}
  for(const k of Object.keys(nS)){if(kd(k).getFullYear()*100+kd(k).getMonth()<ym){delete nS[k];changed=true;}}
  if(changed)save();
}
function save(){
  try{localStorage.setItem('megan_wswaps',JSON.stringify(wS));}catch(e){}
  try{localStorage.setItem('megan_dswaps',JSON.stringify(dS));}catch(e){}
  try{localStorage.setItem('megan_notes',JSON.stringify(nS));}catch(e){}
}
function getNum(date){return wS[monKey(date)]||nf(ME.w1,wo(date))}
function getShift(date){
  const key=dk(date);
  if(dS[key])return{s:dS[key],h:HOL[key]||null,dm:true,holD:false};
  const num=getNum(date),idx=(date.getDay()+6)%7;
  let s=SCH[num][idx];
  const h=HOL[key];
  let holD=false;
  if(h&&date.getDay()!==0&&date.getDay()!==6){
    const mo=['D','D3','D4','D5','D6','D7','D8','D9','D10','D11','D12','DB1','E3','E4','12-8 1','12-8 2','12-8 3',"D'OFF"];
    if(mo.includes(s)){s='OFF';}
    else if(s==='D1'||s==='D2')holD=true;
  }
  return{s,h:h||null,dm:false,holD};
}
function sc(s,holD){
  if(!s||s==='OFF'||s==='OFF.B'||s==="D'OFF")return'sOFF';
  if(s.startsWith('12-8'))return's12';
  if(s.startsWith('E'))return'sE';
  if(s.startsWith('N'))return'sN';
  if(holD)return'sDhol';
  return'sD';
}
let cy=new Date().getFullYear(),cm=new Date().getMonth(),selKey=null,curTab='week';
function prev(){cm--;if(cm<0){cm=11;cy--;}render();renderRecList();refreshAllow();}
function next(){cm++;if(cm>11){cm=0;cy++;}render();renderRecList();refreshAllow();}
function render(){
  const me=new Date(cy,cm+1,0),totalDays=me.getDate();
  document.getElementById('title').textContent=cy+' 年 '+(cm+1)+' 月';
  const gh=document.getElementById('gridHead');gh.innerHTML='';
  for(const d of['一','二','三','四','五','六','日']){const e=document.createElement('div');e.className='dh';e.textContent=d;gh.appendChild(e)}
  const g=document.getElementById('grid');g.innerHTML='';
  const fd=new Date(cy,cm,1).getDay(),off=(fd+6)%7;
  for(let i=0;i<off;i++){const e=document.createElement('div');e.className='cell empty';g.appendChild(e)}
  const tk=dk(new Date());
  for(let day=1;day<=totalDays;day++){
    const date=new Date(cy,cm,day),key=dk(date);
    const{s,h,dm,holD}=getShift(date);
    const dow=date.getDay(),isMon=((dow+6)%7)===0,isFirst=day===1;
    const mk=monKey(date),origNum=nf(ME.w1,wo(date));
    const zc=getZoneColor(date),zi=getZoneIdx(date);
    const gridPos=off+day-1,col=gridPos%7;
    const above=ad(date,-7),below=ad(date,7);
    const isLeft=col===0||getZoneIdx(ad(date,-1))!==zi;
    const isRight=col===6||getZoneIdx(ad(date,1))!==zi;
    const isTop=gridPos<7||getZoneIdx(above)!==zi;
    const isBottom=below.getMonth()!==date.getMonth()||below.getFullYear()!==date.getFullYear()||getZoneIdx(below)!==zi;
    const hasNote=!!(nS[key]||nS[mk]||wS[mk]||dS[key]);
    const cell=document.createElement('div');
    cell.style.cssText='--zc:'+zc;
    let cls='cell';
    if(key===tk)cls+=' today';
    if(wS[mk])cls+=' swapped';
    if(dm)cls+=' day-mod';
    if(selKey===key)cls+=' selected';
    if(hasNote)cls+=' has-note';
    if(oD[key])cls+=' other-working';
    if(isTop)cls+=' z-top';
    if(isBottom)cls+=' z-bottom';
    if(isLeft)cls+=' z-left';
    if(isRight)cls+=' z-right';
    cell.className=cls;
    cell.onclick=()=>openPanel(key);
    if(isMon||isFirst){
      const b=document.createElement('div');b.className='badge';b.textContent=origNum;
      b.onclick=function(e){
        e.stopPropagation();
        openPanel(key);
        switchTab('week');
        document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'});
      };
      cell.appendChild(b);
    }
    const top=document.createElement('div');top.className='top';
    const dn=document.createElement('div');dn.className='dn'+(h?' holiday':'');dn.textContent=day;top.appendChild(dn);
    if(h){const he=document.createElement('div');he.className='hol-name';he.textContent=h;top.appendChild(he);}
    const isHolD=h&&date.getDay()!==0&&date.getDay()!==6&&(s==='D1'||s==='D2');
    const bot=document.createElement('div');bot.className='bot '+sc(s,isHolD);bot.textContent=s;
    // 時數 badge
    const he=hD[key];
    if(he){
      if(he.jiji>0){const b=document.createElement('span');b.className='hbadge '+(he.jijiDir==='+'?'hb-j-p':'hb-j-m');b.textContent='積'+(he.jijiDir==='+'?'＋':'－')+he.jiji;bot.appendChild(b);}
      if(he.nian>0){const b=document.createElement('span');b.className='hbadge hb-n-m';b.textContent='年－'+he.nian;bot.appendChild(b);}
    }
    cell.appendChild(top);cell.appendChild(bot);g.appendChild(cell);
  }
}
function openPanel(key){
  selKey=key;
  const date=kd(key),dow=date.getDay(),isMon=((dow+6)%7)===0;
  const{s:curShift,h}=getShift(date);
  const mk=monKey(date);
  document.getElementById('panelTitle').textContent=(date.getMonth()+1)+'/'+date.getDate()+' （週'+DZ[dow]+'）';
  document.getElementById('panelSub').textContent='目前班別：'+curShift;
  const holEl=document.getElementById('panelHol');
  if(h){holEl.textContent='🎌 '+h;holEl.style.display='block';}else{holEl.style.display='none';}
  switchTab(isMon?'week':'day');
  document.getElementById('numSel').value=wS[mk]||'';
  document.getElementById('preview').style.display='none';
  if(wS[mk])renderPreview();
  renderShiftBtns(dS[key]||curShift);
  document.getElementById('weekNote').value=nS[mk]||'';
  document.getElementById('dayNote').value=nS[key]||'';
  const otherEl=document.getElementById('otherWorking');
  if(otherEl){otherEl.checked=oD[key]||false;updateOtherLabel();}
  document.getElementById('panel').classList.add('open');
  updateHoursBtnStyle();
  render();
  setTimeout(()=>document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'}),50);
}
function switchTab(tab){
  curTab=tab;
  document.getElementById('tabWeek').classList.toggle('active',tab==='week');
  document.getElementById('tabDay').classList.toggle('active',tab==='day');
  document.getElementById('formWeek').style.display=tab==='week'?'block':'none';
  document.getElementById('formDay').style.display=tab==='day'?'block':'none';
}
function renderShiftBtns(cur){
  document.getElementById('shiftBtns').innerHTML=COMMON.map(s=>'<button class="sb '+sc(s,false)+' '+(s===cur?'active':'')+'" onclick="selectShift(\''+s+'\')">'+s+'</button>').join('');
}
function selectShift(s){renderShiftBtns(s);}
function getSelectedShift(){const a=document.querySelector('#shiftBtns .sb.active');return a?a.textContent:'';}
function renderPreview(){
  const nv=document.getElementById('numSel').value,pv=document.getElementById('preview'),pg=document.getElementById('previewGrid');
  if(!nv){pv.style.display='none';return;}
  const num=parseInt(nv),wds=['一','二','三','四','五','六','日'];
  let h='';for(const d of wds)h+='<div class="pg-head">'+d+'</div>';
  for(let i=0;i<7;i++){const s=SCH[num][i];h+='<div class="pg-cell '+sc(s,false)+'">'+s+'</div>';}
  pg.innerHTML=h;pv.style.display='block';
}
function confirmAction(){
  if(!selKey)return;
  const mk=monKey(kd(selKey));
  if(curTab==='week'){
    const nv=document.getElementById('numSel').value;
    if(!nv){alert('請先選擇號碼班');return;}
    const date=kd(selKey),origNum=nf(ME.w1,wo(date));
    const note=document.getElementById('weekNote').value.trim();
    if(parseInt(nv)===origNum){
      // 換回原始號碼班 → 清除換班紀錄與備註
      delete wS[mk];delete nS[mk];
    }else{
      wS[mk]=parseInt(nv);
      if(note)nS[mk]=note;else delete nS[mk];
    }
  }else{
    const chosen=getSelectedShift();
    const date=kd(selKey);
    const{s:origShift}=getShift(date);  // 先取得原始班別（不含dS覆蓋）
    const note=document.getElementById('dayNote').value.trim();
    // 取得無dS覆蓋的原始班別
    const savedDS=dS[selKey];delete dS[selKey];
    const{s:baseShift}=getShift(date);
    if(savedDS)dS[selKey]=savedDS; // 恢復暫存
    if(chosen&&chosen!==baseShift){
      dS[selKey]=chosen;
    }else{
      delete dS[selKey]; // 選的和原始一樣 → 清除
    }
    if(note)nS[selKey]=note;else delete nS[selKey];
    if(!chosen&&!note){alert('請選擇班別或填寫備註');return;}
    // 他人班表
    const otherEl=document.getElementById('otherWorking');
    if(otherEl&&otherEl.checked){oD[selKey]=true;}else{delete oD[selKey];}
    saveOther();
  }
  save();renderRecList();
  render();refreshAllow();closePanel();
  document.getElementById('title').scrollIntoView({behavior:'smooth',block:'start'});
}
function closePanel(){
  selKey=null;
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.cell.selected').forEach(c=>c.classList.remove('selected'));
  document.getElementById('title').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderRecList(){
  const el=document.getElementById('recList'),items=[];
  // 只顯示目前瀏覽月份的紀錄
  function inViewMonth(date){return date.getFullYear()===cy&&date.getMonth()===cm;}
  Object.keys(wS).sort().forEach(mk=>{
    const date=kd(mk);
    // 週換班：以週一日期的月份為準
    if(!inViewMonth(date))return;
    const origNum=nf(ME.w1,wo(date));
    items.push({type:'week',key:mk,desc:(date.getMonth()+1)+'/'+date.getDate()+' 那週：N.'+origNum+' → N.'+wS[mk],note:nS[mk]||''});
  });
  Object.keys(dS).sort().forEach(key=>{
    const date=kd(key);
    if(!inViewMonth(date))return;
    if(dS[key])items.push({type:'day',key,desc:(date.getMonth()+1)+'/'+date.getDate()+'（週'+DZ[date.getDay()]+'）→ '+dS[key],note:nS[key]||''});
  });
  Object.keys(nS).sort().forEach(key=>{
    if(!wS[key]&&!dS[key]){
      const date=kd(key);
      if(!inViewMonth(date))return;
      items.push({type:'day',key,desc:(date.getMonth()+1)+'/'+date.getDate()+'（週'+DZ[date.getDay()]+'）備註',note:nS[key]});
    }
  });
  if(!items.length){el.innerHTML='<li class="empty-msg">尚無換班紀錄</li>';return;}
  el.innerHTML=items.map(({type,key,desc,note})=>'<li class="rec-item"><div class="rec-item-head"><span class="rec-tag '+type+'">'+(type==='week'?'換號碼班':'單日')+'</span><span class="rec-desc">'+desc+'</span><button class="rec-del" onclick="delRec(\''+type+'\',\''+key+'\')">✕</button></div>'+(note?'<div class="rec-note">💬 '+note+'</div>':'')+'</li>').join('');
}
function delRec(type,key){
  if(type==='week'){delete wS[key];delete nS[key];}else{delete dS[key];delete nS[key];}
  save();renderRecList();render();
}
const sel=document.getElementById('numSel');
for(let i=1;i<=35;i++){const o=document.createElement('option');o.value=i;o.textContent='號碼班 '+i;sel.appendChild(o);}
autoClean();renderRecList();render();
document.getElementById('nianTotalInput').value=nianTotal;
document.getElementById('jijiInitInput').value=jijiInit;
refreshBalance();refreshAllow();
</script>
</body>
