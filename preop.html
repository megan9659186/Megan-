<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>術式查詢</title>
<meta name="theme-color" content="#1F5147">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="術式查詢">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7FAF8; --ink:#17221F; --muted:#5A6B66; --pine:#1F5147; --pine-ink:#FFFFFF;
  --mint:#E2EEE9; --line:#C9D8D2; --amber:#9A6412; --amber-bg:#FBF1DF; --card:#FFFFFF; --danger:#A33A2B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111916; --ink:#E6EEEB; --muted:#9DB0AA; --pine:#6FB7A5; --pine-ink:#0C1412;
    --mint:#1C2A26; --line:#2E3F3A; --amber:#F0B75A; --amber-bg:#2B2213; --card:#17211E; --danger:#F08A7A;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:18px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:24px;line-height:1.3;margin:4px 0;font-weight:700;letter-spacing:.02em}
.privacy{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 14px;font-size:15px;margin:10px 0 16px}
.composer{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:10px 10px 10px 14px}
.composer:focus-within{border-color:var(--pine)}
.composer textarea{width:100%;min-height:56px;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;resize:none;padding:4px 0}
.bar{display:flex;align-items:center;gap:6px}
.icon{width:48px;height:48px;border-radius:12px;border:0;background:var(--mint);color:var(--pine);cursor:pointer;display:grid;place-items:center}
.icon svg{width:26px;height:26px}
.spacer{flex:1}
.clear{height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:16px;cursor:pointer}
input[type=file]{display:none}
.patient{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.plabel{font-size:14px;color:var(--muted);margin:2px 0 6px}
.plabel:not(:first-child){margin-top:12px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font:inherit;font-size:16px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tag[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
details.anes{border:1.5px solid var(--line);border-radius:14px;margin:10px 0;background:var(--card)}
details.anes[open]{border-color:var(--pine)}
details.anes>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
details.anes>summary::-webkit-details-marker{display:none}
details.anes>summary::after{content:"＋";color:var(--pine);font-weight:700}
details.anes[open]>summary::after{content:"－"}
details.anes>summary .sum{font-weight:500;font-size:15px;color:var(--muted);margin-left:auto}
details.item>summary{list-style:none;cursor:pointer}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .name::after{content:" ⓘ";color:var(--muted);font-weight:400;font-size:14px}
details.item[open]>summary .name::after{content:""}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.badge{font-size:13px;padding:1px 8px;border-radius:999px;background:var(--amber-bg);color:var(--amber)}
details.opt{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;margin:10px 0;background:var(--paper)}
details.opt>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:16px}
details.opt>summary::-webkit-details-marker{display:none}
details.opt>summary::after{content:"＋";color:var(--amber)}
details.opt[open]>summary::after{content:"－"}
details.opt>summary .sum{margin-left:auto;font-weight:500;color:var(--muted);font-size:15px}
details.opt .sug,details.opt>.note{margin:0 12px 10px}
.card-body{padding:0 14px 12px}
.card-body .sug{margin:0}
.sug li.on,.sug li.off{display:flex;gap:10px;align-items:flex-start}
.sug li>details{flex:1;min-width:0}
.pick-toggle{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--pine);background:var(--pine);color:var(--pine-ink);font:inherit;font-size:22px;font-weight:900;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.sug li.off .pick-toggle{background:transparent;color:var(--muted);border-color:var(--line)}
.sug li.off .name,.sug li.off .price{color:var(--muted);font-weight:400}
.sug li.off .badges{opacity:.6}
.total{display:flex;justify-content:space-between;font-weight:700;padding:10px 0 0;color:var(--pine)}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.status{margin-top:14px;font-size:16px;color:var(--muted);min-height:1.6em}
.err{color:var(--danger)}
.bar-progress{height:6px;border-radius:3px;background:var(--mint);overflow:hidden;margin-top:6px}
.bar-progress i{display:block;height:100%;background:var(--pine);width:0;transition:width .2s}
details.ocr{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
details.ocr summary{cursor:pointer;font-size:15px;color:var(--muted)}
details.ocr textarea{width:100%;min-height:120px;margin-top:8px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink)}
.small-btn{font:inherit;font-size:15px;border:1.5px solid var(--pine);background:transparent;color:var(--pine);border-radius:10px;padding:6px 14px;cursor:pointer;margin-top:6px}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-top:10px;background:var(--mint)}

.proc{border-left:6px solid var(--pine);padding:4px 0 4px 14px;margin:20px 0 10px}
.proc .cat{font-size:14px;color:var(--muted)}
.proc h2{font-size:24px;line-height:1.35;margin:0}
.proc .en{color:var(--muted);font-size:16px;margin:2px 0 0;word-break:break-word}
.proc .alias{font-size:14px;color:var(--muted);margin:4px 0 0;word-break:break-word}
.what{margin:10px 0 0}
h3{font-size:17px;margin:20px 0 8px;color:var(--pine);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--mint);border-radius:999px;padding:4px 14px;font-size:16px}
.sug{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sug li{padding:12px 0;border-bottom:1px solid var(--line)}
.sug .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sug .name{font-weight:700}
.sug .price{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--pine);font-weight:700}
.sug .why{font-size:16px;color:var(--muted);margin-top:2px}
.sug .inside{font-size:14px;color:var(--muted);margin-top:4px}
.note{font-size:14px;color:var(--muted);margin-top:12px}
.others{margin-top:24px}
.others h3{margin-bottom:4px}
.pick{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;font:inherit;color:var(--ink);cursor:pointer}
.pick small{display:block;color:var(--muted);font-size:14px}
.dx{display:flex;flex-wrap:wrap;gap:8px}
.dx button{border:1px solid var(--line);border-radius:10px;padding:4px 10px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);cursor:pointer}
.dx b{font-weight:500;margin-right:4px}
.empty{margin-top:18px;padding:14px;border-radius:12px;background:var(--amber-bg);color:var(--amber)}

.manual{margin-top:0}
details.manualbox{margin-top:20px}
.manual-total{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;margin:12px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--pine);color:var(--pine-ink);font-size:17px;border-radius:14px 14px 0 0}
.manual-total span{flex:1}
.manual-total small{display:block;font-size:13px;opacity:.9}
.manual-total b{font-size:22px;font-variant-numeric:tabular-nums}
.manual-total .small-btn{margin:0;border-color:var(--pine-ink);color:var(--pine-ink)}
details.browse{margin-top:36px;border-top:1px solid var(--line);padding-top:12px}
details.browse summary{cursor:pointer;font-weight:700;font-size:17px;padding:6px 0}
.list h4{font-size:15px;color:var(--pine);margin:16px 0 4px}
.list .it{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:6px 0;border-bottom:1px dashed var(--line)}
.list .it span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.list .it small{display:block;color:var(--muted);font-size:13px}
.list button.it{width:100%;background:none;border:0;border-bottom:1px dashed var(--line);text-align:left;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
@media (prefers-reduced-motion:no-preference){ #result.show{animation:rise .25s ease-out} @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<main>
  <h1>術式查詢與自費配對</h1>
  <div class="privacy">拍照前請遮住病人姓名、病歷號、身分證字號。照片只在手機上辨識，不會上傳。</div>

  <div class="composer">
    <textarea id="txt" rows="2" placeholder="輸入術式或縮寫，例：TKR、Lap chole、剖腹產" aria-label="術式或縮寫"></textarea>
    <div class="bar">
      <button class="icon" id="camBtn" type="button" aria-label="拍照辨識">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button class="icon" id="libBtn" type="button" aria-label="從相簿選照片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 5 5 3-3 5 5"/></svg></button>
      <span class="spacer"></span>
      <button class="clear" id="clearBtn" type="button">下一位</button>
    </div>
  </div>
  <input type="file" id="camInput" accept="image/*" capture="environment">
  <input type="file" id="libInput" accept="image/*">

  <section class="patient" aria-label="手術者需求">
    <div class="plabel">手術者需求（可複選）</div>
    <div class="tags" id="tags"></div>
  </section>
  <div class="status" id="status" aria-live="polite"></div>
  <div id="ocrBox"></div>
  <section id="result" aria-live="polite"></section>
  <details class="anes manualbox" id="manualBox"><summary><span>自行勾選自費項目</span><span class="sum" id="manualSum"></span></summary><div class="card-body" id="manualBody"></div></details>

  <details class="browse">
    <summary>瀏覽全部術式</summary>
    <div class="list" id="procList"></div>
  </details>
  <details class="browse">
    <summary>本院麻醉自費清單</summary>
    <div class="list" id="payList"></div>
  </details>
</main>

/* ---------- 比對 ---------- */
const CJK = /[\u3400-\u9fff]/;
function norm(s){
  return String(s || "").normalize("NFKC").toLowerCase()
    .replace(/(\w)\.(?=\w)/g, "$1").replace(/\.(?=\s|$|\))/g, "")
    .replace(/[^a-z0-9\u3400-\u9fff&\/+\-]+/g, " ").replace(/\s+/g, " ").trim();
}
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function prepare(){
  PROCS.forEach(p => {
    p.keys = [...new Set([p.en, p.zh, ...p.aliases])].map(a => {
      const n = norm(a); if (!n) return null;
      if (CJK.test(n)) return { n, cjk: true, len: n.length * 2 };
      const pat = n.split(" ").map(escapeRe).join("[\\s\\-\\.]*");
      return { n, cjk: false, len: n.replace(/\s/g, "").length, re: new RegExp("(^|[^a-z0-9])" + pat + "(?=$|[^a-z0-9])") };
    }).filter(Boolean);
  });
}
function search(raw){
  const t = norm(raw); if (!t) return [];
  const tCJK = t.replace(/\s/g, "");
  const out = [];
  for (const p of PROCS){
    let best = 0;
    for (const k of p.keys){
      if (k.cjk ? tCJK.includes(k.n.replace(/\s/g,"")) : k.re.test(t)) best = Math.max(best, 100 + k.len);
    }
    if (!best && t.length >= 2 && t.length <= 40){
      for (const k of p.keys){
        const kn = k.n.replace(/\s/g,""), tn = t.replace(/\s/g,"");
        if (kn.startsWith(tn)) best = Math.max(best, 50 + tn.length);
        else if ((k.cjk || tn.length >= 3) && kn.includes(tn)) best = Math.max(best, 30 + tn.length);
      }
    }
    if (best) out.push({ p, exact: best >= 100, score: best + (p.isDx ? -40 : 0) });
  }
  const res = out.some(m => m.exact) ? out.filter(m => m.exact) : out;
  return res.sort((a,b) => b.score - a.score);
}

/* ---------- 病人狀況與自費配對 ---------- */
const TAGS = ["女性","全身麻醉","會暈車","之前術後有暈吐","高齡","慢性病","腹腔鏡手術","止痛"];
const tags = new Set(); const openCards = new Set();
const PKG = { A:["AIRWAY","BIS","WARM","NB","PAIN","ONDAN"], B:["AIRWAY","BIS","NMT","WARM","NB","PAIN","ONDAN"] };
const GA_ONLY = new Set(["A","B","NMT","PAIN","AIRWAY","OLV","CV","NIVATS","SPINE","SELFGA","BIS"]);
const SA_ONLY = new Set(["SEDSPINAL","ITM"]);
const BIG_PKG = new Set(["CV","OLV","NIVATS"]);
const HIGH = [["UGI","HUGI"],["LGI","HLGI"],["ULGI","HULGI"],["ERCP","HERCP"]];
const MAIN = new Set(["UGI","HUGI","LGI","HLGI","ULGI","HULGI","EUS","EUSBX","ENTUP","ENTLOW","ESDA","ERCP","HERCP","LABOR","ITLABOR","DENTAL","BISSED"]);
const sum = items => items.reduce((t, i) => t + (PAY[i.code]?.price || 0), 0);
const picks = new Map(), openItems = new Set();
const isOn = (key, it) => picks.has(key + "|" + it.code) ? picks.get(key + "|" + it.code) : it.def !== false;
const sumOn = (items, key) => sum(items.filter(i => isOn(key, i)));

function plan(p, mode){
  let codes = [...p.pay];
  const ga = mode === "GA";
  if (mode === "GA") codes = codes.filter(c => !SA_ONLY.has(c));
  if (mode === "SA"){ codes = codes.filter(c => !GA_ONLY.has(c)); if (!codes.includes("SEDSPINAL")) codes.unshift("SEDSPINAL"); }
  const risky = tags.has("高齡") || tags.has("慢性病");
  for (const [n, hi] of HIGH){
    const i = codes.findIndex(c => c === n || c === hi);
    if (i >= 0){ codes = codes.filter(c => c !== n && c !== hi); codes.splice(i, 0, risky ? hi : n); }
  }
  const items = [], get = c => items.find(x => x.code === c);
  const add = (c, why, reason) => {
    if (!PAY[c]) return; let it = get(c);
    if (!it){ it = { code:c, why:[], reason: reason || "" }; items.push(it); }
    else if (reason && !it.reason) it.reason = reason;
    if (why && !it.why.includes(why)) it.why.push(why);
  };
  codes.forEach(c => add(c));

  const lap = tags.has("腹腔鏡手術") || /腹腔鏡|laparoscop/i.test(p.zh + p.en);
  const gaFactor = ga || (mode === null && tags.has("全身麻醉"));
  const ponv = [];
  if (tags.has("女性")) ponv.push("女性");
  if (tags.has("會暈車") || tags.has("之前術後有暈吐")) ponv.push(tags.has("之前術後有暈吐") ? "之前術後有暈吐" : "會暈車");
  if (gaFactor) ponv.push("全身麻醉");
  if (lap) ponv.push("腹腔鏡手術");
  if (ponv.length >= 2) ponv.forEach(w => add("ONDAN", w, `有 ${ponv.length} 項術後噁心嘔吐的危險因子（${ponv.join("、")}），建議預防性止吐`));
  if (tags.has("高齡")){
    if (ga || mode === "SA") add("REMI","高齡");
    if (ga) add("BIS","高齡");
    if (ga || mode === "SA") add("WARM","高齡","高齡者較容易失溫，保溫可減少術後發抖與併發症");
  }
  if (tags.has("慢性病")){
    if (ga || mode === "SA") add("REMI","慢性病");
    if (ga) add("BIS","慢性病");
    if (ga && (codes.includes("B") || p.anes.some(a => a.includes("插管")))) add("NMT","慢性病","肌肉鬆弛完全逆轉，減少心肺慢性病人術後呼吸併發症");
  }
  // 可做神經阻斷的術式：資料中明確列有神經阻斷者（清創等不做的術式已排除）
  const nbOK = p.pay.includes("NB");
  if (lap && ga){ add("NMT","腹腔鏡手術","腹腔鏡需要良好的肌肉放鬆，結束時快速逆轉，醒得快"); if (nbOK) add("NB","腹腔鏡手術"); }
  if (tags.has("止痛") && !p.pay.some(c => MAIN.has(c))){
    const regional = mode === "SA" || (mode === null && p.anes.some(a => a.includes("脊椎") || a.includes("硬脊膜外")));
    if (nbOK) add("NB","止痛");
    if (ga) add(p.pay.includes("EPCA") ? "EPCA" : "IVPCA", "止痛");
    else if (regional) add("ITM","止痛");
  }

  const pkg = items.find(i => PKG[i.code]);
  const isCore = c => PKG[c] || BIG_PKG.has(c) || c === "SPINE" || MAIN.has(c) || (mode === "SA" && c === "SEDSPINAL");
  // 方案一：組套內已含的項目併入組套；預設只勾組套（其餘額外項目呈灰色，可自行加選）
  let full = items;
  if (pkg){
    const inside = PKG[pkg.code];
    items.filter(i => inside.includes(i.code)).forEach(i => i.why.forEach(w => { if (!pkg.why.includes(w)) pkg.why.push(w); }));
    full = items.filter(i => !inside.includes(i.code));
  }
  full = full.map(i => ({ ...i, def: isCore(i.code) }));
  if (!full.some(i => i.def)) full.forEach(i => { if (!i.why.length) i.def = true; });   // 無組套的術式（如清創）：預設勾選基本項目
  // 方案二：已選需求觸發的項目＋進階呼吸道＋保溫毯＋主要麻醉項目（預設勾選），其他可加選項目呈灰色
  const tagOnly = [];
  const put = (c, why, def, reason) => {
    if (!PAY[c]) return; let it = tagOnly.find(x => x.code === c);
    if (!it){ it = { code:c, why:[], reason: reason || "", def }; tagOnly.push(it); } else if (def) it.def = true;
    why.forEach(w => { if (!it.why.includes(w)) it.why.push(w); });
  };
  items.filter(i => !PKG[i.code] && !BIG_PKG.has(i.code) && i.why.some(w => tags.has(w))).forEach(i => put(i.code, i.why.filter(w => tags.has(w)), true, i.reason));
  items.filter(i => MAIN.has(i.code)).forEach(i => put(i.code, [], true));
  put("AIRWAY", [], true);
  put("WARM", [], true);
  const cands = [...(pkg ? PKG[pkg.code] : []), ...items.map(i => i.code).filter(c => !PKG[c] && !BIG_PKG.has(c) && !MAIN.has(c))];
  cands.forEach(c => put(c, [], false));
  // 方案二：進階呼吸道固定排第一
  const t2 = order(tagOnly), ai = t2.findIndex(i => i.code === "AIRWAY");
  if (ai > 0) t2.unshift(...t2.splice(ai, 1));
  return { full: order(full), tagOnly: t2, hasPkg: !!pkg };
}
function order(items){
  const rank = i => (PKG[i.code] || BIG_PKG.has(i.code) ? 0 : MAIN.has(i.code) ? 1 : 2) + (i.def === false ? 3 : 0);
  return items.slice().sort((a, b) => rank(a) - rank(b));
}
function summaryText(pl, key){
  const a = "$" + fmt(sumOn(pl.full, key + "1"));
  return tags.size ? `${pl.hasPkg ? "組套" : "建議"} ${a}／單選 $${fmt(sumOn(pl.tagOnly, key + "2"))}` : a;
}
function renderPlan(pl, key){
  const f = document.createDocumentFragment();
  if (!tags.size){ f.append(renderItems(pl.full, key + "1")); return f; }
  const opt = (id, title, items, empty) => {
    const d = el("details","opt"); const k = key + id; if (openCards.has(k)) d.open = true;
    d.addEventListener("toggle", () => { d.open ? openCards.add(k) : openCards.delete(k); });
    const s = el("summary"); s.append(el("span","", title), el("span","sum", items.length ? "$" + fmt(sumOn(items, k)) : "無"));
    d.append(s);
    if (items.length) d.append(renderItems(items, k)); else d.append(el("p","note", empty));
    return d;
  };
  f.append(opt("1", pl.hasPkg ? "方案一：組套" : "方案一：基本建議", pl.full, "這個麻醉方式通常不需要自費項目。"));
  f.append(opt("2", "方案二：只選需求相關項目", pl.tagOnly, "所選的需求在這個麻醉方式下沒有對應的單項。"));
  return f;
}
function renderItems(items, key, noTotal){
  const wrap = document.createDocumentFragment();
  if (!items.length){ wrap.append(el("p","note","這個選擇下通常不需要自費項目，依麻醉醫師評估。")); return wrap; }
  const ul = el("ul","sug");
  items.forEach(it => {
    const s = PAY[it.code], on = isOn(key, it), li = el("li", on ? "on" : "off");
    const tg = el("button","pick-toggle", on ? "✓" : "＋"); tg.type = "button";
    tg.setAttribute("aria-pressed", on); tg.setAttribute("aria-label", (on ? "取消選取 " : "加選 ") + s.name);
    tg.onclick = () => { picks.set(key + "|" + it.code, !on); rerender(); };
    const ik = key + "|" + it.code, d = el("details","item"); if (openItems.has(ik)) d.open = true;
    d.addEventListener("toggle", () => { d.open ? openItems.add(ik) : openItems.delete(ik); });
    const sm = el("summary"), row = el("div","row");
    row.append(el("span","name", s.name), el("span","price", "$" + fmt(s.price)));
    sm.append(row);
    if (it.why.length){ const b = el("div","badges"); it.why.forEach(w => b.append(el("span","badge", w))); sm.append(b); }
    d.append(sm);
    const reason = it.reason || s.reason; if (reason) d.append(el("div","why", reason));
    if (s.inside && s.cat === "組套") d.append(el("div","inside", "內含：" + s.inside));
    li.append(tg, d); ul.append(li);
  });
  if (!noTotal){ const tot = el("li","total"); tot.append(el("span","", "合計（已勾選）"), el("span","", "$" + fmt(sumOn(items, key)))); ul.append(tot); }
  wrap.append(ul); return wrap;
}
/* ---------- 自行勾選（術式不在清單時） ---------- */
const MK = "manual";
function renderManual(){
  const box = el("section","manual");
  box.append(el("p","note","依病人需要與您的評估勾選，下方會即時計算合計。"));
  const all = PAYLIST.map(s => ({ code:s.code, why:[], reason:"", def:false }));
  const on = all.filter(i => isOn(MK, i)).map(i => i.code);
  // 已勾選組套時，標出組套內已含的單項，避免重複收費
  const inPkg = {};
  on.forEach(c => { const inside = PKG[c] || (c === "OLV" ? PKG.B : null); if (inside) inside.forEach(x => (inPkg[x] ||= []).push(PAY[c].name.replace(/^常見麻醉/,""))); });
  all.forEach(i => { if (inPkg[i.code]) i.why = inPkg[i.code].map(n => "已含於" + n); });
  const groups = {};
  all.forEach(i => (groups[PAY[i.code].cat] ||= []).push(i));
  Object.entries(groups).forEach(([cat, items], idx) => {
    const k = MK + "-" + cat, d = el("details","opt");
    const n = items.filter(i => isOn(MK, i)).length;
    if (openCards.has(k) || (!openCards.has(k + "-closed") && (idx === 0 || n))) d.open = true;
    d.addEventListener("toggle", () => { if (d.open){ openCards.add(k); openCards.delete(k + "-closed"); } else { openCards.delete(k); openCards.add(k + "-closed"); } });
    const s = el("summary"); s.append(el("span","", cat), el("span","sum", n ? `已選 ${n} 項` : ""));
    d.append(s, renderItems(items, MK, true));
    box.append(d);
  });
  const dup = on.filter(c => inPkg[c]).length;
  const bar = el("div","manual-total");
  const left = el("span","", on.length ? `已勾選 ${on.length} 項` : "尚未勾選");
  if (dup) left.append(el("small","", `⚠️ 有 ${dup} 項已含在組套內`));
  bar.append(left, el("b","", "$" + fmt(sumOn(all, MK))));
  if (on.length){
    const c = el("button","small-btn","全部取消"); c.type = "button";
    c.onclick = () => { [...picks.keys()].filter(x => x.startsWith(MK + "|")).forEach(x => picks.delete(x)); rerender(); };
    bar.append(c);
  }
  box.append(bar);
  return box;
}
let last = null;
function drawManual(){
  const body = document.getElementById("manualBody"); if (!body || !PAYLIST.length) return;
  const n = [...picks.entries()].filter(([k, v]) => k.startsWith(MK + "|") && v).length;
  body.replaceChildren(renderManual());
  document.getElementById("manualSum").textContent = n ? `已選 ${n} 項` : "術式不在清單時使用";
}
function openManual(){ const d = document.getElementById("manualBox"); if (d) d.open = true; }
function rerender(){ if (last) show(last.matches, last.fromPhoto, true); drawManual(); }
(function initPanel(){
  const tg = document.getElementById("tags");
  TAGS.forEach(t => {
    const b = el("button","tag", t); b.type = "button"; b.setAttribute("aria-pressed","false");
    b.onclick = () => { tags.has(t) ? tags.delete(t) : tags.add(t); b.setAttribute("aria-pressed", tags.has(t)); rerender(); };
    tg.append(b);
  });
})();
function resetPanel(){
  tags.clear(); openCards.clear(); picks.clear(); openItems.clear();
  document.querySelectorAll("#tags .tag").forEach(b => b.setAttribute("aria-pressed","false"));
}

/* ---------- 顯示 ---------- */
function el(tag, cls, text){ const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function renderProc(p){
  const frag = document.createDocumentFragment();
  const box = el("div","proc");
  box.append(el("div","cat", p.cat), el("h2","", p.zh), el("p","en", p.en));
  const al = p.aliases.filter(a => a !== p.en && a !== p.zh && !CJK.test(a));
  if (al.length) box.append(el("p","alias","常見寫法：" + al.join("、")));
  if (p.desc) box.append(el("p","what", p.desc));
  frag.append(box);
  if (p.anes.length){
    frag.append(el("h3","","常見麻醉方式"));
    const c = el("div","chips"); p.anes.forEach(a => c.append(el("span","chip", a))); frag.append(c);
  }
  if (p.isDx) frag.append(el("p","note","這是診斷或病歷用語，不是術式；請輸入術式（或點下方相關術式）查詢自費項目。"));
  if (!p.isDx){
    frag.append(el("h3","","建議自費項目"));
    const hasGA = p.anes.some(a => a.includes("全身麻醉")), hasSA = p.anes.some(a => a.includes("脊椎麻醉"));
    if (hasGA && hasSA){
      // 全身麻醉與半身麻醉都可選：做成可收合卡片
      const gaLabel = p.anes.find(a => a.includes("全身麻醉"));
      [[gaLabel,"GA"],["脊椎麻醉（半身）","SA"]].forEach(([label, mode]) => {
        const pl = plan(p, mode);
        const d = el("details","anes"); if (openCards.has(p.en + mode)) d.open = true;
        d.addEventListener("toggle", () => { d.open ? openCards.add(p.en + mode) : openCards.delete(p.en + mode); });
        const s = el("summary"); s.append(el("span","", label), el("span","sum", summaryText(pl, p.en + mode)));
        const body = el("div","card-body"); body.append(renderPlan(pl, p.en + mode));
        d.append(s, body); frag.append(d);
      });
    } else {
      frag.append(renderPlan(plan(p, hasGA ? "GA" : null), p.en + "single"));
    }
    frag.append(el("p","note","點項目名稱可看說明。價格依本院清單；建議僅供參考，實際依麻醉醫師評估。"));
  }
  return frag;
}
function show(matches, fromPhoto, keep){
  last = { matches, fromPhoto };
  result.replaceChildren(); if (!keep) result.classList.remove("show");
  const procs = matches.filter(m => !m.p.isDx), dxs = matches.filter(m => m.p.isDx);
  if (!procs.length && !dxs.length){
    const e = el("div","empty", fromPhoto
      ? "⚠️ 照片中沒有比對到清單內的術式。可能是手寫、反光或不在清單中，請打開下方「辨識出的文字」修改、手動輸入，或直接在下方自行勾選自費項目。"
      : "⚠️ 清單中找不到這個術式，請換個寫法（英文全名、縮寫或中文），或直接在下方自行勾選自費項目。");
    result.append(e); openManual(); return;
  }
  const top = matches[0] && matches[0].p.isDx && matches[0].score === 999 ? matches[0] : null;
  if (top) result.append(renderProc(top.p));
  if (procs.length){
    if (!top) result.append(renderProc(procs[0].p));
    const restP = top ? procs : procs.slice(1);
    if (restP.length){
      const o = el("div","others"); o.append(el("h3","", top ? "相關術式" : fromPhoto ? "照片中還有這些術式" : "其他可能的術式"));
      restP.slice(0, 8).forEach(m => {
        const b = el("button","pick"); b.type = "button";
        b.append(m.p.zh); b.append(el("small","", m.p.en));
        b.onclick = () => { openCards.clear(); openItems.clear(); show([m, ...procs.filter(x => x !== m), ...dxs], fromPhoto); window.scrollTo({top: result.offsetTop - 12, behavior:"smooth"}); };
        o.append(b);
      });
      result.append(o);
    }
  }
  if (dxs.length){
    if (dxs.some(m => m !== top)){ const h = el("h3","","診斷、縮寫與術語"); result.append(h); }
    const d = el("div","dx");
    dxs.filter(m => m !== top).slice(0, 12).forEach(m => {
      const s = el("button"); s.type = "button"; s.append(el("b","", m.p.aliases[0]), m.p.zh);
      s.onclick = () => { openCards.clear(); show([{...m, score:999}, ...matches.filter(x => x !== m)], fromPhoto); window.scrollTo({top: result.offsetTop - 12, behavior:"smooth"}); };
      d.append(s);
    });
    result.append(d);
  }
  result.classList.add("show");
}

let workerP = null;
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
}
let progressCb = () => {};
async function getWorker(){
  if (!workerP){
    workerP = (async () => {
      if (!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
      return Tesseract.createWorker("eng", 1, { logger: m => progressCb(m) });
    })();
    workerP.catch(() => { workerP = null; });
  }
  return workerP;
}
function prep(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const long = Math.max(img.naturalWidth, img.naturalHeight);
      const r = long > 2400 ? 2400 / long : (long < 1200 ? 1200 / long : 1);
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
      const g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.4)";
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}
async function runOCR(file){
  result.replaceChildren(); ocrBox.replaceChildren();
  statusEl.replaceChildren(el("span","", "準備辨識…"));
  const bar = el("div","bar-progress"), fill = el("i"); bar.append(fill); statusEl.append(bar);
  progressCb = m => {
    if (m.status === "recognizing text"){ statusEl.firstChild.textContent = "辨識文字中…"; fill.style.width = Math.round(m.progress * 100) + "%"; }
    else if (/load|initializ/.test(m.status)){ statusEl.firstChild.textContent = "第一次使用，下載辨識資料中…"; }
  };
  try{
    const [canvas, worker] = await Promise.all([prep(file), getWorker()]);
    const { data } = await worker.recognize(canvas);
    statusEl.replaceChildren();
    const text = (data.text || "").trim();
    // 顯示辨識文字（可修改後重新比對）
    const d = el("details","ocr"); d.append(el("summary","", "辨識出的文字（可修改後重新比對）"));
    const img = el("img","thumb"); img.alt = "拍攝的照片"; img.src = URL.createObjectURL(file); d.append(img);
    const ta = el("textarea"); ta.value = text; d.append(ta);
    const b = el("button","small-btn","重新比對"); b.type = "button"; b.onclick = () => show(search(ta.value), true); d.append(b);
    ocrBox.append(d);
    if (!text){ d.open = true; statusEl.replaceChildren(el("span","err","沒有讀到文字，請靠近一點、避免反光後重拍。")); }
    show(search(text), true);
  }catch(e){
    statusEl.replaceChildren(el("span","err", e?.message === "image" ? "照片無法讀取，請重拍。" : "辨識工具載入失敗，請確認網路後再試一次。"));
  }
}

/* ---------- 瀏覽清單 ---------- */
function renderLists(){
  const pl = $("procList"), groups = {};
  PROCS.forEach(p => (groups[p.cat] ||= []).push(p));
  for (const [g, ps] of Object.entries(groups)){
    pl.append(el("h4","", g));
    ps.forEach(p => {
      const b = el("button","it"); b.type = "button";
      const l = el("span","", p.zh); l.append(el("small","", p.aliases[0] === p.en ? p.en : p.aliases[0] + "　" + p.en));
      b.append(l);
      b.onclick = () => { txt.value = ""; ocrBox.replaceChildren(); show([{p, score:999}], false); window.scrollTo({top: result.offsetTop - 12, behavior:"smooth"}); };
      pl.append(b);
    });
  }
  const yl = $("payList"), pg = {};
  PAYLIST.forEach(s => (pg[s.cat] ||= []).push(s));
  for (const [g, ss] of Object.entries(pg)){
    yl.append(el("h4","", g));
    ss.forEach(s => {
      const d = el("div","it"), l = el("span","", s.name);
      if (s.inside && s.cat === "組套") l.append(el("small","", s.inside));
      else if (s.reason) l.append(el("small","", s.reason));
      d.append(l, el("span","", fmt(s.price))); yl.append(d);
    });
  }
}

/* ---------- 載入資料 ---------- */
(async () => {
  try{
    // 優先讀同資料夾的 CSV（方便在 GitHub 上修改）；讀不到時用內建備份
    const load = (file, id) => fetch(file, {cache:"no-cache"})
      .then(r => { if (!r.ok) throw 0; return r.text(); })
      .catch(() => document.getElementById(id).textContent.trim());
    const [pr, sp] = await Promise.all([load("procedures.csv","fallbackProcs"), load("selfpay.csv","fallbackPay")]);
    parseCSV(sp).forEach(([code, cat, name, price, inside, reason]) => {
      const s = { code: code.trim(), cat, name, price: Number(String(price).replace(/,/g,"")), inside, reason };
      PAY[s.code] = s; PAYLIST.push(s);
    });
    PROCS = parseCSV(pr).map(([cat, en, aliases, zh, desc, anes, pay]) => ({
      cat, en, zh, desc, isDx: cat === "診斷縮寫",
      aliases: String(aliases||"").split("|").map(s => s.trim()).filter(Boolean),
      anes: String(anes||"").split("、").map(s => s.trim()).filter(Boolean),
      pay: String(pay||"").split("|").map(s => s.trim()).filter(Boolean),
    }));
    prepare(); renderLists(); drawManual();
  }catch{
    statusEl.replaceChildren(el("span","err","資料檔讀取失敗。請確認 procedures.csv 和 selfpay.csv 與此網頁放在同一個資料夾，並從 GitHub Pages 網址開啟。"));
  }
})();
