<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tin排班">
<link rel="apple-touch-icon" href="tin-icon.png">
<title>Tin 排班</title>
<!-- Moomin-style: use a rounded, storybook-feel font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Moomin Color Palette ── */
:root{
  /* Raw swatch */
  --moo-black:#1a1a1a;
  --moo-dk-grey:#6b6b6b;
  --moo-lt-grey:#a8adb5;
  --moo-red:#c8564a;       /* rött */
  --moo-lt-red:#e8c4bc;    /* ljusrött */
  --moo-blue:#5a7ab0;      /* blått */
  --moo-lt-blue:#a8bcd8;   /* ljusblått */
  --moo-rdbrown:#7a2a28;   /* rödbrunt */
  --moo-warm-yel:#e8a020;  /* varmgult */
  --moo-lt-yel:#f0d840;    /* ljusgult */
  --moo-violet:#8a60b0;    /* violett */
  --moo-dk-violet:#4a3870; /* mörk violett */
  --moo-orange:#d4602a;    /* orange */

  /* UI surface */
  --bg:#f5f0e8;
  --surface:#fdfaf4;
  --border:#d4c9b0;
  --accent-primary:#5a7ab0;
  --accent-dark:#3a5a90;
  --text-main:#1a1a1a;
  --text-sub:#6b6b6b;
  --text-light:#a8adb5;

  /* Shift block colours — all from Moomin swatch */
  --c-D:#fdfaf4;           /* D班: 白底 */
  --c-D-text:#1a1a1a;
  --c-Dhol:#e8c4bc;        /* 假日D1/D2: ljusrött 淺紅 */
  --c-Dhol-text:#7a2a28;
  --c-E:#a8bcd8;           /* E班: ljusblått 淺藍 */
  --c-E-text:#3a5a90;
  --c-N:#f0d840;           /* N班: ljusgult 亮黃 */
  --c-N-text:#4a3800;
  --c-OFF:#c8564a;         /* OFF: rött 紅 */
  --c-OFF-text:#fff;
  --c-12:#8a60b0;          /* 12-8: violett 紫 */
  --c-12-text:#fff;

  /* Zone frame — 6 Moomin colours */
  --zone0:#5a7ab0;
  --zone1:#c8564a;
  --zone2:#e8a020;
  --zone3:#8a60b0;
  --zone4:#7a2a28;
  --zone5:#4a3870;

  /* 積休 → varmgult 暖黃  |  年休 → ljusrött 淺紅 */
  --jiji-bg0:#fdf5d8;
  --jiji-bg1:#f5e4a0;
  --jiji-border:#e8a020;
  --jiji-label:#7a5000;
  --jiji-val:#5a3800;
  --nian-bg0:#fae8e4;
  --nian-bg1:#f0c8c0;
  --nian-border:#c8564a;
  --nian-label:#7a2a28;
  --nian-val:#5a1a18;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif;
  color:var(--text-main);
  background:var(--bg);
  padding:calc(env(safe-area-inset-top,20px) + 16px) 12px 12px 12px;
  font-size:16px;
  min-height:100vh;
}

/* ── Header ── */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
  background:transparent;
  padding:4px 2px;
}
.nav h2{
  font-family:'Nunito',sans-serif;
  font-size:20px;font-weight:700;
  color:var(--text-main);
  letter-spacing:0.2px;
}
.nav-title-wrap{display:flex;flex-direction:column;align-items:center;}
.nav button{
  background:transparent;
  color:var(--accent-primary);
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:6px 14px;cursor:pointer;
  font-family:'Nunito',sans-serif;
  font-size:18px;font-weight:700;
  line-height:1;
  transition:opacity 0.15s;
}
.nav button:active{opacity:0.6;}

/* ── Moomin decorative wave ── */
.moo-deco{
  text-align:center;
  font-family:'Baloo 2',cursive;
  font-size:13px;
  color:var(--text-light);
  letter-spacing:3px;
  margin-bottom:10px;
  opacity:0.7;
}

/* ── Grid ── */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dh{
  text-align:center;font-size:12px;
  color:var(--accent-primary);
  padding:4px 0;font-weight:800;
  font-family:'Baloo 2',cursive;
  letter-spacing:0.5px;
}
.cell{
  position:relative;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:0;
  min-height:68px;
  display:flex;flex-direction:column;
  overflow:visible;cursor:pointer;
  transition:transform 0.1s;
}
.cell:active{transform:scale(0.97);}
.cell.empty{background:transparent;border-color:transparent;cursor:default;}
.cell.today .dn{
  background:var(--accent-primary);color:#fff;
  border-radius:50%;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;
}
.cell.swapped .badge{background:var(--moo-orange);}
.cell.has-note::after{
  content:'✦';position:absolute;top:2px;right:3px;
  font-size:7px;color:var(--moo-violet);z-index:5;
}
.cell.selected .top{background:var(--jiji-bg0)!important;}
.cell.selected .dn{color:var(--accent-dark)!important;}
.cell.selected .bot{background:var(--jiji-bg1)!important;color:var(--jiji-val)!important;}
.cell.z-top{border-top:3px solid var(--zc)!important;}
.cell.z-bottom{border-bottom:3px solid var(--zc)!important;}
.cell.z-left{border-left:3px solid var(--zc)!important;}
.cell.z-right{border-right:3px solid var(--zc)!important;}

/* Badge (week number) */
.badge{
  position:absolute;top:-8px;left:-8px;
  width:22px;height:22px;
  background:var(--accent-primary);
  color:#fff;border-radius:50%;
  font-family:'Baloo 2',cursive;
  font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
  box-shadow:0 1px 4px rgba(90,122,176,0.4);
  border:1.5px solid #fff;
}

/* Cell top (date) */
.top{
  background:#fff;flex:0 0 48%;
  display:flex;align-items:center;justify-content:center;
  position:relative;padding-bottom:8px;
  border-radius:0;
}
.hol-name{
  position:absolute;bottom:1px;left:0;right:0;
  text-align:center;font-size:7px;
  color:var(--moo-red);font-weight:800;line-height:1;
  font-family:'Nunito',sans-serif;
}
.dn{
  font-family:'Baloo 2',cursive;
  font-size:18px;font-weight:700;color:var(--text-main);
}
.dn.holiday{color:var(--moo-red);}

/* Cell bot (shift) */
.bot{
  flex:0 0 52%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;
  font-size:11px;font-weight:800;
  padding:2px;gap:1px;
}
/* Shift colors */
.sD{background:var(--c-D);color:var(--c-D-text);}
.sDhol{background:var(--c-Dhol);color:var(--c-Dhol-text);}
.sE{background:var(--c-E);color:var(--c-E-text);}
.sN{background:var(--c-N);color:var(--c-N-text);}
.sOFF{background:var(--c-OFF);color:var(--c-OFF-text);}
.s12{background:var(--c-12);color:var(--c-12-text);}

/* ── Balance cards ── */
.hours-summary{display:flex;gap:8px;margin-top:12px;}
.hs-card{
  flex:1;border-radius:14px;padding:10px 12px;
  border:2px solid transparent;
  font-family:'Nunito',sans-serif;
}
.hs-card.jiji{
  background:var(--jiji-bg0);
  border-color:var(--jiji-border);
}
.hs-card.nian{
  background:var(--nian-bg0);
  border-color:var(--nian-border);
}
.hs-card-label{
  font-size:15px;font-weight:800;letter-spacing:2px;margin-bottom:4px;
  font-family:'Baloo 2',cursive;
}
.hs-card.jiji .hs-card-label{color:var(--jiji-label);}
.hs-card.nian .hs-card-label{color:var(--nian-label);}
.hs-card-val{font-size:24px;font-weight:800;line-height:1;font-family:'Baloo 2',cursive;}
.hs-card.jiji .hs-card-val{color:var(--jiji-val);}
.hs-card.nian .hs-card-val{color:var(--nian-val);}
.hs-card-unit{font-size:10px;color:var(--text-light);margin-top:2px;}

/* ── Nian bar ── */
.nian-bar-row{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:12px;padding:10px 14px;margin-top:8px;
}
.nbl{font-size:16px;font-weight:800;color:var(--nian-label);width:36px;flex-shrink:0;font-family:'Baloo 2',cursive;}
.nbt{flex:1;height:8px;background:var(--nian-bg1);border-radius:99px;overflow:hidden;}
.nbf{height:100%;background:var(--moo-red);border-radius:99px;transition:width 0.4s;}
.nbn{font-size:11px;color:var(--text-light);white-space:nowrap;min-width:80px;text-align:right;font-weight:700;}

/* ── Settings ── */
.hours-settings{display:flex;gap:14px;margin-top:6px;padding:0 2px;flex-wrap:wrap;}
.nts-group{display:flex;align-items:center;gap:5px;}
.nts-label{font-size:11px;color:var(--text-light);font-weight:700;}
.nts-input{
  width:58px;padding:4px 6px;border:1.5px solid var(--border);
  border-radius:8px;font-size:13px;font-weight:800;
  color:var(--nian-val);background:#fff;text-align:center;
  font-family:'Nunito',sans-serif;
}
.nts-input.jiji-color{color:var(--jiji-val);}

/* ── Hours badge on cells ── */
.hbadge{
  display:block;font-size:7px;font-weight:800;
  padding:1px 3px;border-radius:4px;line-height:1.4;
  text-align:center;margin-top:1px;
  font-family:'Nunito',sans-serif;
}
.hb-j-p{background:var(--jiji-bg1);color:var(--jiji-val);}
.hb-j-m{background:var(--moo-lt-red);color:var(--moo-rdbrown);}
.hb-n-m{background:var(--moo-lt-red);color:var(--moo-rdbrown);}

/* ── Night allowance ── */
.allow-wrap{
  margin-top:10px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.allow-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 8px;
  background:linear-gradient(135deg,rgba(90,122,176,0.10),rgba(138,96,176,0.08));
}
.allow-title{
  font-size:16px;font-weight:800;
  color:var(--accent-primary);letter-spacing:1.5px;
  font-family:'Baloo 2',cursive;
}
.allow-month-total{font-size:16px;font-weight:800;color:var(--accent-primary);font-family:'Baloo 2',cursive;}
.allow-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1.5px solid var(--border);}
.allow-cell{padding:8px 10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
.allow-cell:nth-child(3n){border-right:none;}
.allow-cell-label{font-size:12px;color:var(--text-light);margin-bottom:3px;letter-spacing:0.5px;font-weight:700;}
.allow-cell-val{font-size:18px;font-weight:800;color:var(--accent-primary);font-family:'Baloo 2',cursive;}
.allow-cell-count{font-size:12px;color:var(--text-light);margin-top:1px;}
.allow-note{font-size:12px;color:var(--text-light);padding:6px 14px 8px;border-top:1px solid var(--border);}
.allow-manual{
  width:100%;margin-top:5px;padding:3px 6px;
  border:1px solid var(--border);border-radius:6px;
  font-size:13px;background:var(--bg);color:var(--accent-primary);
  font-family:'Nunito',sans-serif;box-sizing:border-box;
}

/* ── Panel ── */
.panel{
  background:var(--surface);
  border:2px solid var(--border);
  border-radius:18px;padding:16px;margin-top:14px;
  display:none;
  box-shadow:0 4px 16px rgba(90,122,176,0.12);
}
.panel.open{display:block;}
.panel-title{
  font-family:'Baloo 2',cursive;
  font-size:18px;font-weight:800;margin-bottom:2px;
  color:var(--accent-primary);
}
.panel-sub{font-size:14px;color:var(--text-sub);margin-bottom:3px;font-weight:700;}
.panel-hol{font-size:14px;color:var(--moo-red);font-weight:800;margin-bottom:10px;display:none;}
.tabs{display:flex;gap:6px;margin-bottom:14px;}
.tab-btn{
  flex:1;padding:9px;
  border:1.5px solid var(--border);
  border-radius:12px;background:transparent;
  font-family:'Baloo 2',cursive;
  font-size:13px;font-weight:700;cursor:pointer;color:var(--text-light);
  transition:all 0.15s;
}
.tab-btn.active{background:var(--accent-primary);color:#fff;border-color:var(--accent-primary);}
.field-label{font-size:13px;color:var(--text-sub);margin-bottom:5px;font-weight:800;font-family:'Baloo 2',cursive;}
select{
  width:100%;padding:10px 12px;
  border:1.5px solid var(--border);border-radius:10px;
  background:#fff;color:var(--text-main);font-size:15px;
  appearance:none;font-family:'Nunito',sans-serif;font-weight:700;
}

/* Preview grid */
.preview-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px;}
.pg-head{
  text-align:center;background:var(--accent-primary);color:#fff;
  border-radius:4px;font-size:10px;padding:3px 1px;font-weight:800;
  font-family:'Baloo 2',cursive;
}
.pg-cell{text-align:center;padding:5px 1px;border-radius:4px;font-size:10px;font-weight:800;font-family:'Nunito',sans-serif;}

/* Shift buttons */
.shift-btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.sb{
  padding:7px 11px;border-radius:10px;border:1.5px solid var(--border);
  font-size:12px;cursor:pointer;font-weight:800;
  font-family:'Nunito',sans-serif;transition:transform 0.1s;
}
.sb:active{transform:scale(0.95);}
.sb.active{border:2.5px solid var(--accent-primary);box-shadow:0 0 0 1px var(--accent-primary);}

/* Note area */
.note-area{
  width:100%;padding:10px 12px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:15px;background:#fff;color:var(--text-main);
  margin-top:6px;min-height:65px;resize:none;
  font-family:'Nunito',sans-serif;font-weight:600;
}

/* Buttons */
.confirm-btn{
  width:100%;padding:13px;
  background:var(--accent-primary);color:#fff;border:none;
  border-radius:12px;font-family:'Baloo 2',cursive;
  font-size:17px;font-weight:800;cursor:pointer;margin-top:14px;
  box-shadow:0 3px 10px rgba(90,122,176,0.35);
  transition:background 0.15s,transform 0.1s;
}
.confirm-btn:active{background:var(--accent-dark);transform:scale(0.98);}
.cancel-btn{
  width:100%;padding:10px;background:transparent;
  color:var(--text-light);border:1.5px solid var(--border);
  border-radius:10px;font-family:'Nunito',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;
}

/* ── Section title ── */
.sec-title{
  font-family:'Baloo 2',cursive;
  font-size:16px;font-weight:800;
  color:var(--accent-primary);
  margin:18px 0 10px;padding-bottom:6px;
  border-bottom:2px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.sec-title::before{content:'✦';font-size:10px;color:var(--moo-warm-yel);}

/* Rec list */
.rec-list{list-style:none;}
.rec-item{padding:10px 0;border-bottom:1px solid var(--border);}
.rec-item:last-child{border:none;}
.rec-item-head{display:flex;align-items:center;gap:8px;}
.rec-tag{
  font-size:10px;padding:3px 8px;border-radius:20px;
  font-weight:800;white-space:nowrap;font-family:'Baloo 2',cursive;
}
.rec-tag.week{background:var(--jiji-bg0);color:var(--accent-primary);}
.rec-tag.day{background:var(--moo-lt-red);color:var(--moo-rdbrown);}
.rec-desc{flex:1;font-size:13px;font-weight:700;color:var(--text-sub);}
.rec-del{background:none;border:none;color:var(--moo-red);font-size:18px;cursor:pointer;padding:0 4px;}
.rec-note{font-size:12px;color:var(--text-light);margin-top:4px;padding-left:4px;border-left:3px solid var(--moo-violet);font-weight:700;}
.empty-msg{font-size:13px;color:var(--text-light);text-align:center;padding:18px 0;font-weight:700;}

/* ── Hours trigger button ── */
.hours-trigger-btn{
  width:100%;padding:10px;background:var(--jiji-bg0);
  color:var(--text-sub);border:1.5px solid var(--border);
  border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;margin-top:8px;
  font-family:'Nunito',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.hours-trigger-btn.has-data{background:var(--jiji-bg1);color:var(--jiji-val);border-color:var(--jiji-border);}

/* ── Hours overlay ── */
.hours-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(26,26,26,0.45);z-index:300;
  align-items:flex-end;justify-content:center;
}
.hours-overlay.open{display:flex;}
.hours-sheet{
  background:var(--surface);border-radius:22px 22px 0 0;
  width:100%;max-width:480px;
  padding:0 0 env(safe-area-inset-bottom,16px);
  animation:hup 0.22s ease;
  border-top:3px solid var(--accent-primary);
}
@keyframes hup{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.hs-handle{padding:10px 0 0;display:flex;justify-content:center;}
.hs-handle-bar{width:36px;height:4px;background:var(--border);border-radius:99px;}
.hs-head{padding:10px 16px 10px;border-bottom:1.5px solid var(--border);}
.hs-date{font-family:'Baloo 2',cursive;font-size:16px;font-weight:800;color:var(--accent-primary);}
.hs-shift{font-size:12px;color:var(--text-light);margin-top:2px;font-weight:700;}
.hs-body{padding:14px 16px 16px;}
.hs-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.hs-row-label{font-family:'Baloo 2',cursive;font-size:13px;font-weight:800;width:28px;flex-shrink:0;}
.hs-row-label.j{color:var(--jiji-label);}
.hs-row-label.n{color:var(--nian-label);}
.hs-selwrap{display:flex;gap:6px;flex:1;}
.hdir{
  flex:0 0 96px;appearance:none;-webkit-appearance:none;
  border:1.5px solid var(--border);border-radius:10px;
  padding:9px 6px 9px 10px;font-size:13px;font-weight:800;
  background:#fff;color:var(--text-main);font-family:'Nunito',sans-serif;cursor:pointer;
}
.hdir.ot{border-color:var(--moo-warm-yel);color:#5a3800;background:#fdf0c0;}
.hdir.jm{border-color:var(--moo-red);color:var(--moo-red);background:var(--moo-lt-red);}
.hdir.nm{border-color:var(--moo-red);color:var(--moo-red);background:var(--moo-lt-red);}
.hhrs{
  flex:1;appearance:none;-webkit-appearance:none;
  border:1.5px solid var(--border);border-radius:10px;
  padding:9px 10px;font-size:13px;font-weight:700;
  background:#fff;color:var(--text-main);font-family:'Nunito',sans-serif;cursor:pointer;
}
.hs-btns{display:flex;gap:8px;margin-top:4px;}
.hs-btn-clear{padding:10px 12px;border:1.5px solid var(--moo-red);border-radius:10px;background:var(--moo-lt-red);color:var(--moo-rdbrown);font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;}
.hs-btn-cancel{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text-light);font-size:14px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;}
.hs-btn-save{flex:2;padding:10px;border:none;border-radius:10px;background:var(--accent-primary);color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:'Baloo 2',cursive;}
.hcustom{
  width:100%;padding:9px 12px;border:1.5px solid var(--moo-warm-yel);border-radius:10px;
  font-size:15px;font-weight:700;background:#fdf0c0;color:#5a3800;font-family:'Nunito',sans-serif;outline:none;
}

/* ── Moomin decorative footer ── */
.moo-footer{
  text-align:center;margin-top:24px;margin-bottom:8px;
  font-family:'Baloo 2',cursive;
  font-size:12px;color:var(--text-light);letter-spacing:2px;
  opacity:0.6;
}
</style>
</head>
<body>

<div class="nav">
  <button onclick="prev()">‹</button>
  <h2 id="title"></h2>

<script>
// ── Tin's config ──
// w1 = 27 (verified: nf(27,-1) = 26 for week of 6/1/2026)
const SCH={1:['D2','D','D5','D','D7','OFF','N2'],2:['N1','N2','OFF','OFF','N2','N1','OFF'],3:['E3','E3','E3','E3','E3','OFF','E1'],4:['E4','E4','E4','E4','E4','OFF','OFF'],5:['D10','D8','D2','D','D4','D1','OFF'],6:['E1','E1','E1','E1','E1','OFF','N1'],7:['N2','N1','N1','N2','OFF','OFF','OFF'],8:['D4','D6','D','D10','D3','OFF','OFF'],9:['E2','E2','E2','E2','E2','E2','OFF'],10:['D5','D','D6','D2','DB1','D2','OFF'],11:['DB1','D7','D1','D8','D5','OFF','OFF'],12:['D3','DB1','N2','N1','N1','N2','OFF'],13:['OFF','D10','D3','D7','D1','OFF','OFF'],14:['D','D','D','D','D','OFF','E2'],15:['12-8 2','12-8 3','12-8 1','12-8 2','12-8 3','OFF','OFF'],16:['D7','D4','D9','DB1','D2','OFF','D2'],17:['D','D3','D10','D1','D9','OFF','OFF'],18:['12-8 3','12-8 1','12-8 2','12-8 3','12-8 1','E1','OFF'],19:['12-8 1','12-8 2','12-8 3','12-8 1','12-8 2','OFF','OFF'],20:['D1','D9','D4','D9','D6','OFF','OFF'],21:['D9','D','DB1','D6','D8','OFF','D1'],22:['D','D','D','D','D','OFF','OFF'],23:['OFF','OFF','OFF','OFF','OFF','OFF','OFF'],24:["D'OFF",'D','D','D','D','OFF','OFF'],25:['D','D','D','D','D','OFF','OFF'],26:['D8','D2','D7','D4','D','OFF.B','OFF'],27:['D6','D1','D8','D3','D10','OFF','OFF'],28:['D','D5','D','D5','D','OFF','OFF'],29:['D11','D11','D11','D11','D11','OFF','OFF'],30:['D','D','D','D','D','OFF','OFF'],31:['D12','D12','D12','D12','D12','OFF','OFF'],32:['D','D','D','D','D','OFF','OFF'],33:['D','D','D','D','D','OFF','OFF'],34:['D','D','D','D','D','OFF','OFF'],35:['D','D','D','D','D','OFF','OFF']};

const ANC=new Date(2026,5,8); // anchor: 2026/06/08
const ZONE_ANC=new Date(2026,5,8);
const ZONE_COLORS=['#5a7ab0','#c8564a','#e8a020','#8a60b0','#7a2a28','#4a3870'];
const ME={w1:27}; // TIN's w1
const HOL={'2026-01-01':'元旦','2026-02-17':'初一','2026-02-18':'初二','2026-02-19':'初三','2026-02-20':'初四','2026-02-21':'初五','2026-02-28':'228','2026-04-04':'兒童節','2026-04-05':'清明節','2026-05-01':'勞動節','2026-06-19':'端午節','2026-09-25':'中秋節','2026-09-28':'教師節','2026-10-10':'國慶日','2026-10-25':'光復節','2026-12-25':'行憲紀念日'};
const COMMON=['D','D1','D2','D3','D4','D5','D6','D7','D8','D9','D10','DB1','E1','E2','E3','E4','N1','N2','12-8 1','12-8 2','12-8 3','OFF'];
const DZ=['日','一','二','三','四','五','六'];

function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ad(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function kd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function wo(date){const dow=date.getDay(),mon=ad(date,-((dow+6)%7));return Math.round((mon-ANC)/(7*86400000))}
function nf(w,woff){return((w-1+woff)%35+35)%35+1}
function monKey(date){return dk(ad(date,-((date.getDay()+6)%7)))}
function getZoneIdx(date){return(((Math.floor((date-ZONE_ANC)/86400000/28))%6)+6)%6;}
function getZoneColor(date){return ZONE_COLORS[getZoneIdx(date)];}

// Use tin_ prefix for localStorage to avoid conflicts with Megan's data
let wS={},dS={},nS={};
try{const s=localStorage.getItem('tin_wswaps');if(s)wS=JSON.parse(s);}catch(e){}
try{const s=localStorage.getItem('tin_dswaps');if(s)dS=JSON.parse(s);}catch(e){}
try{const s=localStorage.getItem('tin_notes');if(s)nS=JSON.parse(s);}catch(e){}

// ── 時數資料 ──
let hD={};
let nianTotal=52, jijiInit=0;
try{const s=localStorage.getItem('tin_hours');if(s)hD=JSON.parse(s);}catch(e){}
try{const s=localStorage.getItem('tin_hours_cfg');if(s){const c=JSON.parse(s);nianTotal=parseFloat(c.nianTotal)||52;jijiInit=parseFloat(c.jijiInit)||0;}}catch(e){}
function saveHours(){try{localStorage.setItem('tin_hours',JSON.stringify(hD));}catch(e){}}
function saveSettings(){
  nianTotal=parseFloat(document.getElementById('nianTotalInput').value)||52;
  jijiInit=parseFloat(document.getElementById('jijiInitInput').value)||0;
  try{localStorage.setItem('tin_hours_cfg',JSON.stringify({nianTotal,jijiInit}));}catch(e){}
  refreshBalance();
}
function calcJijiBalance(){
  let bal=jijiInit;
  for(const k in hD){const e=hD[k];if(e.jiji>0)bal+=(e.jijiDir==='+'?e.jiji:-e.jiji);}
  return bal;
}
function calcNianUsed(){
  let u=0;for(const k in hD){const e=hD[k];if(e.nian>0)u+=e.nian;}return u;
}
function refreshBalance(){
  const jijiB=calcJijiBalance();
  const nianU=calcNianUsed();
  const nianB=nianTotal-nianU;
  document.getElementById('jijiBalVal').textContent=jijiB;
  document.getElementById('nianBalVal').textContent=nianB;
  const pct=Math.min(100,nianTotal>0?Math.round(nianU/nianTotal*100):0);
  document.getElementById('nianFill').style.width=pct+'%';
  document.getElementById('nianNums').textContent='已用 '+nianU+' / '+nianTotal+' hr';
}
function openHoursSheet(){
  if(!selKey)return;
  const date=kd(selKey);
  const{s}=getShift(date);
  document.getElementById('hsDate').textContent=(date.getMonth()+1)+'/'+date.getDate()+' （週'+DZ[date.getDay()]+'）';
  document.getElementById('hsShift').textContent='班別：'+s;
  const e=hD[selKey]||{};
  document.getElementById('jijiDir').value=e.jijiDir||'+';
  const jv=e.jiji||0;
  const jSel=document.getElementById('jijiHrs');
  const jCustom=document.getElementById('jijiCustom');
  if(jv>0&&jv<=5&&jv*2===Math.round(jv*2)){jSel.value=jv;jCustom.style.display='none';}
  else if(jv>5||jv%0.5!==0){jSel.value='custom';jCustom.style.display='block';jCustom.value=jv||'';}
  else{jSel.value=0;jCustom.style.display='none';}
  const nv=e.nian||0;
  const nSel=document.getElementById('nianHrs');
  const nCustom=document.getElementById('nianCustom');
  if(nv>0&&nv<=5&&nv*2===Math.round(nv*2)){nSel.value=nv;nCustom.style.display='none';}
  else if(nv>5||nv%0.5!==0){nSel.value='custom';nCustom.style.display='block';nCustom.value=nv||'';}
  else{nSel.value=0;nCustom.style.display='none';}
  updateHDir('jiji');
  document.getElementById('hoursOverlay').classList.add('open');
}
function toggleCustom(type){
  const sel=document.getElementById(type+'Hrs');
  const inp=document.getElementById(type+'Custom');
  if(sel.value==='custom'){inp.style.display='block';inp.focus();}
  else{inp.style.display='none';}
}
function getHoursVal(type){
  const sel=document.getElementById(type+'Hrs');
  if(sel.value==='custom'){const v=parseFloat(document.getElementById(type+'Custom').value);return isNaN(v)?0:v;}
  return parseFloat(sel.value)||0;
}
function updateHDir(type){
  if(type!=='jiji')return;
  const sel=document.getElementById('jijiDir'),v=sel.value;
  sel.className='hdir '+(v==='+'?'ot':'jm');
}
function clearHoursForm(){
  document.getElementById('jijiDir').value='+';
  document.getElementById('jijiHrs').value=0;
  document.getElementById('jijiCustom').style.display='none';
  document.getElementById('nianHrs').value=0;
  document.getElementById('nianCustom').style.display='none';
  updateHDir('jiji');
}
function saveHoursEntry(){
  const jh=getHoursVal('jiji');
  const jd=document.getElementById('jijiDir').value;
  const nh=getHoursVal('nian');
  if(jh===0&&nh===0){delete hD[selKey];}
  else{hD[selKey]={jiji:jh,jijiDir:jd,nian:nh,nianDir:'-'};}
  saveHours();refreshBalance();refreshAllow();
  render();
  document.getElementById('hoursOverlay').classList.remove('open');
  updateHoursBtnStyle();
  document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'});
}
function updateHoursBtnStyle(){
  const btn=document.getElementById('hoursTriggerBtn');
  if(!btn||!selKey)return;
  const e=hD[selKey];
  const hasData=e&&(e.jiji>0||e.nian>0);
  btn.className='hours-trigger-btn'+(hasData?' has-data':'');
  if(hasData){
    const parts=[];
    if(e.jiji>0)parts.push(e.jijiDir==='+'?'加班+'+e.jiji:'拿時間－'+e.jiji);
    if(e.nian>0)parts.push('年休－'+e.nian);
    btn.textContent='⏱ '+parts.join('　');
  }else{
    btn.textContent='⏱ 記錄時數（積休／年休）';
  }
}

// ── 夜班津貼 ──
let allowAdj={};
try{const s=localStorage.getItem('tin_allow_adj');if(s)allowAdj=JSON.parse(s);}catch(e){}
function saveAllowAdj(){
  const ym=cy*100+(cm+1);
  const a12=parseFloat(document.getElementById('allow12Adj').value)||0;
  const aE=parseFloat(document.getElementById('allowEAdj').value)||0;
  const aN=parseFloat(document.getElementById('allowNAdj').value)||0;
  if(a12===0&&aE===0&&aN===0)delete allowAdj[ym];
  else allowAdj[ym]={a12,aE,aN};
  try{localStorage.setItem('tin_allow_adj',JSON.stringify(allowAdj));}catch(e){}
  refreshAllow();
}
function calcAllow(){
  const totalDays=new Date(cy,cm+1,0).getDate();
  let c12=0,cE=0,cN=0,cDot=0;
  for(let d=1;d<=totalDays;d++){
    const date=new Date(cy,cm,d);
    const{s}=getShift(date);
    const dow=date.getDay();
    if(s.startsWith('12-8'))c12++;
    else if(s.startsWith('E'))cE++;
    else if(s.startsWith('N'))cN++;
    if(dow>=1&&dow<=5&&s.startsWith('D')&&s!=='DB1'){
      const key=dk(date);
      const he=hD[key];
      if(he&&he.jijiDir==='+'&&he.jiji>=1.5)cDot++;
    }
  }
  const rateE=cE>=15?640:560;
  const rateN=cN>=15?960:770;
  return{c12,cE,cN,cDot,rateE,rateN};
}
function refreshAllow(){
  const{c12,cE,cN,cDot,rateE,rateN}=calcAllow();
  const ym=cy*100+(cm+1);
  const adj=allowAdj[ym]||{};
  const adj12=adj.a12||0, adjE=adj.aE||0, adjN=adj.aN||0;
  const a12=c12*270+adj12, aE=cE*rateE+adjE, aN=cN*rateN+adjN, aDot=cDot*270;
  const total=a12+aE+aN+aDot;
  const labelE='E班 $'+(cE>=15?'640（包班）':'560')+(cE>=15?' ✓':'');
  const labelN='N班 $'+(cN>=15?'960（包班）':'770')+(cN>=15?' ✓':'');
  document.getElementById('allow12Val').textContent='$'+a12;
  document.getElementById('allow12Count').textContent=c12+' 班';
  document.getElementById('allowEVal').textContent='$'+aE;
  document.getElementById('allowECount').textContent=cE+' 班　'+labelE;
  document.getElementById('allowNVal').textContent='$'+aN;
  document.getElementById('allowNCount').textContent=cN+' 班　'+labelN;
  document.getElementById('allowDotVal').textContent='$'+aDot;
  document.getElementById('allowDotCount').textContent=cDot+' 班';
  document.getElementById('allow12Adj').value=adj12||'';
  document.getElementById('allowEAdj').value=adjE||'';
  document.getElementById('allowNAdj').value=adjN||'';
  document.getElementById('allowTotal').textContent='本月 $'+total;
}

function autoClean(){
  const now=new Date(),ym=now.getFullYear()*100+now.getMonth();
  let changed=false;
  for(const k of Object.keys(wS)){if(kd(k).getFullYear()*100+kd(k).getMonth()<ym){delete wS[k];changed=true;}}
  for(const k of Object.keys(dS)){if(kd(k).getFullYear()*100+kd(k).getMonth()<ym){delete dS[k];changed=true;}}
  for(const k of Object.keys(nS)){if(kd(k).getFullYear()*100+kd(k).getMonth()<ym){delete nS[k];changed=true;}}
  if(changed)save();
}
function save(){
  try{localStorage.setItem('tin_wswaps',JSON.stringify(wS));}catch(e){}
  try{localStorage.setItem('tin_dswaps',JSON.stringify(dS));}catch(e){}
  try{localStorage.setItem('tin_notes',JSON.stringify(nS));}catch(e){}
}
function getNum(date){return wS[monKey(date)]||nf(ME.w1,wo(date))}
function getShift(date){
  const key=dk(date);
  if(dS[key])return{s:dS[key],h:HOL[key]||null,dm:true,holD:false};
  const num=getNum(date),idx=(date.getDay()+6)%7;
  let s=SCH[num][idx];
  const h=HOL[key];
  let holD=false;
  if(h&&date.getDay()!==0&&date.getDay()!==6){
    const mo=['D','D3','D4','D5','D6','D7','D8','D9','D10','D11','D12','DB1','E3','E4','12-8 1','12-8 2','12-8 3',"D'OFF"];
    if(mo.includes(s)){s='OFF';}
    else if(s==='D1'||s==='D2')holD=true;
  }
  return{s,h:h||null,dm:false,holD};
}
function sc(s,holD){
  if(!s||s==='OFF'||s==='OFF.B'||s==="D'OFF")return'sOFF';
  if(s.startsWith('12-8'))return's12';
  if(s.startsWith('E'))return'sE';
  if(s.startsWith('N'))return'sN';
  if(holD)return'sDhol';
  return'sD';
}

let cy=new Date().getFullYear(),cm=new Date().getMonth(),selKey=null,curTab='week';
function prev(){cm--;if(cm<0){cm=11;cy--;}render();renderRecList();refreshAllow();}
function next(){cm++;if(cm>11){cm=0;cy++;}render();renderRecList();refreshAllow();}

function render(){
  const me=new Date(cy,cm+1,0),totalDays=me.getDate();
  document.getElementById('title').textContent=cy+' 年 '+(cm+1)+' 月';
  const gh=document.getElementById('gridHead');gh.innerHTML='';
  for(const d of['一','二','三','四','五','六','日']){
    const e=document.createElement('div');e.className='dh';e.textContent=d;gh.appendChild(e);
  }
  const g=document.getElementById('grid');g.innerHTML='';
  const fd=new Date(cy,cm,1).getDay(),off=(fd+6)%7;
  for(let i=0;i<off;i++){const e=document.createElement('div');e.className='cell empty';g.appendChild(e);}
  const tk=dk(new Date());
  for(let day=1;day<=totalDays;day++){
    const date=new Date(cy,cm,day),key=dk(date);
    const{s,h,dm,holD}=getShift(date);
    const dow=date.getDay(),isMon=((dow+6)%7)===0,isFirst=day===1;
    const mk=monKey(date),origNum=nf(ME.w1,wo(date));
    const zc=getZoneColor(date),zi=getZoneIdx(date);
    const gridPos=off+day-1,col=gridPos%7;
    const above=ad(date,-7),below=ad(date,7);
    const isLeft=col===0||getZoneIdx(ad(date,-1))!==zi;
    const isRight=col===6||getZoneIdx(ad(date,1))!==zi;
    const isTop=gridPos<7||getZoneIdx(above)!==zi;
    const isBottom=below.getMonth()!==date.getMonth()||below.getFullYear()!==date.getFullYear()||getZoneIdx(below)!==zi;
    const hasNote=!!(nS[key]||nS[mk]||wS[mk]||dS[key]);
    const cell=document.createElement('div');
    cell.style.cssText='--zc:'+zc;
    let cls='cell';
    if(key===tk)cls+=' today';
    if(wS[mk])cls+=' swapped';
    if(dm)cls+=' day-mod';
    if(selKey===key)cls+=' selected';
    if(hasNote)cls+=' has-note';
    if(isTop)cls+=' z-top';
    if(isBottom)cls+=' z-bottom';
    if(isLeft)cls+=' z-left';
    if(isRight)cls+=' z-right';
    cell.className=cls;
    cell.onclick=()=>openPanel(key);
    if(isMon||isFirst){
      const b=document.createElement('div');b.className='badge';b.textContent=origNum;
      b.onclick=function(e){
        e.stopPropagation();openPanel(key);switchTab('week');
        document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'});
      };
      cell.appendChild(b);
    }
    const top=document.createElement('div');top.className='top';
    const dn=document.createElement('div');dn.className='dn'+(h?' holiday':'');dn.textContent=day;top.appendChild(dn);
    if(h){const he=document.createElement('div');he.className='hol-name';he.textContent=h;top.appendChild(he);}
    const isHolD=h&&date.getDay()!==0&&date.getDay()!==6&&(s==='D1'||s==='D2');
    const bot=document.createElement('div');bot.className='bot '+sc(s,isHolD);bot.textContent=s;
    const he=hD[key];
    if(he){
      if(he.jiji>0){const b=document.createElement('span');b.className='hbadge '+(he.jijiDir==='+'?'hb-j-p':'hb-j-m');b.textContent='積'+(he.jijiDir==='+'?'＋':'－')+he.jiji;bot.appendChild(b);}
      if(he.nian>0){const b=document.createElement('span');b.className='hbadge hb-n-m';b.textContent='年－'+he.nian;bot.appendChild(b);}
    }
    cell.appendChild(top);cell.appendChild(bot);g.appendChild(cell);
  }
}

function openPanel(key){
  selKey=key;
  const date=kd(key),dow=date.getDay(),isMon=((dow+6)%7)===0;
  const{s:curShift,h}=getShift(date);
  const mk=monKey(date);
  document.getElementById('panelTitle').textContent=(date.getMonth()+1)+'/'+date.getDate()+' （週'+DZ[dow]+'）';
  document.getElementById('panelSub').textContent='目前班別：'+curShift;
  const holEl=document.getElementById('panelHol');
  if(h){holEl.textContent='🎌 '+h;holEl.style.display='block';}else{holEl.style.display='none';}
  switchTab(isMon?'week':'day');
  document.getElementById('numSel').value=wS[mk]||'';
  document.getElementById('preview').style.display='none';
  if(wS[mk])renderPreview();
  renderShiftBtns(dS[key]||curShift);
  document.getElementById('weekNote').value=nS[mk]||'';
  document.getElementById('dayNote').value=nS[key]||'';
  document.getElementById('panel').classList.add('open');
  updateHoursBtnStyle();
  render();
  setTimeout(()=>document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'}),50);
}
function switchTab(tab){
  curTab=tab;
  document.getElementById('tabWeek').classList.toggle('active',tab==='week');
  document.getElementById('tabDay').classList.toggle('active',tab==='day');
  document.getElementById('formWeek').style.display=tab==='week'?'block':'none';
  document.getElementById('formDay').style.display=tab==='day'?'block':'none';
}
function renderShiftBtns(cur){
  document.getElementById('shiftBtns').innerHTML=COMMON.map(s=>'<button class="sb '+sc(s,false)+' '+(s===cur?'active':'')+'" onclick="selectShift(\''+s+'\')">'+s+'</button>').join('');
}
function selectShift(s){renderShiftBtns(s);}
function getSelectedShift(){const a=document.querySelector('#shiftBtns .sb.active');return a?a.textContent:'';}
function renderPreview(){
  const nv=document.getElementById('numSel').value,pv=document.getElementById('preview'),pg=document.getElementById('previewGrid');
  if(!nv){pv.style.display='none';return;}
  const num=parseInt(nv),wds=['一','二','三','四','五','六','日'];
  let h='';for(const d of wds)h+='<div class="pg-head">'+d+'</div>';
  for(let i=0;i<7;i++){const s=SCH[num][i];h+='<div class="pg-cell '+sc(s,false)+'">'+s+'</div>';}
  pg.innerHTML=h;pv.style.display='block';
}
function confirmAction(){
  if(!selKey)return;
  const mk=monKey(kd(selKey));
  if(curTab==='week'){
    const nv=document.getElementById('numSel').value;
    if(!nv){alert('請先選擇號碼班');return;}
    const date=kd(selKey),origNum=nf(ME.w1,wo(date));
    const note=document.getElementById('weekNote').value.trim();
    if(parseInt(nv)===origNum){
      delete wS[mk];delete nS[mk];
    }else{
      wS[mk]=parseInt(nv);
      if(note)nS[mk]=note;else delete nS[mk];
    }
  }else{
    const chosen=getSelectedShift();
    const date=kd(selKey);
    const note=document.getElementById('dayNote').value.trim();
    const savedDS=dS[selKey];delete dS[selKey];
    const{s:baseShift}=getShift(date);
    if(savedDS)dS[selKey]=savedDS;
    if(chosen&&chosen!==baseShift){
      dS[selKey]=chosen;
    }else{
      delete dS[selKey];
    }
    if(note)nS[selKey]=note;else delete nS[selKey];
    if(!chosen&&!note){alert('請選擇班別或填寫備註');return;}
  }
  save();renderRecList();render();refreshAllow();closePanel();
  document.getElementById('title').scrollIntoView({behavior:'smooth',block:'start'});
}
function closePanel(){
  selKey=null;
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.cell.selected').forEach(c=>c.classList.remove('selected'));
  document.getElementById('title').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderRecList(){
  const el=document.getElementById('recList'),items=[];
  function inViewMonth(date){return date.getFullYear()===cy&&date.getMonth()===cm;}
  Object.keys(wS).sort().forEach(mk=>{
    const date=kd(mk);
    if(!inViewMonth(date))return;
    const origNum=nf(ME.w1,wo(date));
    items.push({type:'week',key:mk,desc:(date.getMonth()+1)+'/'+date.getDate()+' 那週：N.'+origNum+' → N.'+wS[mk],note:nS[mk]||''});
  });
  Object.keys(dS).sort().forEach(key=>{
    const date=kd(key);
    if(!inViewMonth(date))return;
    if(dS[key])items.push({type:'day',key,desc:(date.getMonth()+1)+'/'+date.getDate()+'（週'+DZ[date.getDay()]+'）→ '+dS[key],note:nS[key]||''});
  });
  Object.keys(nS).sort().forEach(key=>{
    if(!wS[key]&&!dS[key]){
      const date=kd(key);
      if(!inViewMonth(date))return;
      items.push({type:'day',key,desc:(date.getMonth()+1)+'/'+date.getDate()+'（週'+DZ[date.getDay()]+'）備註',note:nS[key]});
    }
  });
  if(!items.length){el.innerHTML='<li class="empty-msg">尚無換班紀錄</li>';return;}
  el.innerHTML=items.map(({type,key,desc,note})=>'<li class="rec-item"><div class="rec-item-head"><span class="rec-tag '+type+'">'+(type==='week'?'換號碼班':'單日')+'</span><span class="rec-desc">'+desc+'</span><button class="rec-del" onclick="delRec(\''+type+'\',\''+key+'\')">✕</button></div>'+(note?'<div class="rec-note">💬 '+note+'</div>':'')+'</li>').join('');
}
function delRec(type,key){
  if(type==='week'){delete wS[key];delete nS[key];}else{delete dS[key];delete nS[key];}
  save();renderRecList();render();
}

// Init number selector
const sel=document.getElementById('numSel');
for(let i=1;i<=35;i++){const o=document.createElement('option');o.value=i;o.textContent='號碼班 '+i;sel.appendChild(o);}

autoClean();renderRecList();render();
document.getElementById('nianTotalInput').value=nianTotal;
document.getElementById('jijiInitInput').value=jijiInit;
refreshBalance();refreshAllow();
</script>
