<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Pantone 13-6008 TCX Misty Jade -->
  <rect width="1024" height="1024" rx="210" fill="#C4D5C4"/>

  <!-- Frog body -->
  <ellipse cx="512" cy="558" rx="173" ry="143" fill="#2a2a2a"/>

  <!-- Frog head -->
  <ellipse cx="512" cy="398" rx="150" ry="123" fill="#2a2a2a"/>

  <!-- Eye whites -->
  <circle cx="443" cy="334" r="45" fill="#fff"/>
  <circle cx="581" cy="334" r="45" fill="#fff"/>

  <!-- Eye pupils -->
  <circle cx="447" cy="337" r="26" fill="#1a1a1a"/>
  <circle cx="585" cy="337" r="26" fill="#1a1a1a"/>

  <!-- Eye shine -->
  <circle cx="456" cy="327" r="9" fill="#fff"/>
  <circle cx="594" cy="327" r="9" fill="#fff"/>

  <!-- Frog legs (back) -->
  <path d="M346 633 Q254 662 232 737 Q222 782 263 796 Q302 808 330 770 Q352 728 368 692 Z" fill="#2a2a2a"/>
  <path d="M678 633 Q770 662 792 737 Q802 782 761 796 Q722 808 694 770 Q672 728 656 692 Z" fill="#2a2a2a"/>

  <!-- Frog front arms -->
  <path d="M360 542 Q292 564 268 617 Q256 648 283 658 Q312 669 334 638 Q354 608 372 578 Z" fill="#2a2a2a"/>
  <path d="M664 542 Q732 564 756 617 Q768 648 741 658 Q712 669 690 638 Q670 608 652 578 Z" fill="#2a2a2a"/>

  <!-- Belly -->
  <ellipse cx="512" cy="569" rx="108" ry="90" fill="#3a3a3a"/>

  <!-- Smile -->
  <path d="M458 452 Q512 484 566 452" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Nostrils -->
  <ellipse cx="491" cy="418" rx="9" ry="6" fill="#555"/>
  <ellipse cx="533" cy="418" rx="9" ry="6" fill="#555"/>

  <!-- Text: Frog -->
  <text x="512" y="900" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="108" font-weight="700" fill="#1a1a1a" letter-spacing="6">Frog</text>
</svg>
