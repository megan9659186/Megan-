<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麻醉科排班查詢</title>
<style>
  :root {
    --bg: #f5f1e8;
    --ink: #2d5043;
    --amber: #c9905a;
    --paper: #faf7f2;
    --border: #d8d0c0;
    --muted: #8a8078;
    --d-color: #f9f6f0;
    --d-border: #c8c0b0;
    --e-color: #b5c4ce;
    --n-color: #d9c891;
    --off-color: #c89a96;
    --shift12-color: #a8b89d;
    --priority-bg: #fdf6e3;
    --priority-border: #d9a83b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', '微軟正黑體', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    font-size: 18px;
  }
  header {
    background: var(--ink);
    color: #fff;
    padding: 14px 16px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 {
    font-family: Georgia, 'Songti TC', serif;
    font-size: 18px;
    letter-spacing: 0.04em;
    flex: 1;
  }
  header .badge {
    background: var(--amber);
    color: #fff;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }
  nav {
    display: flex;
    background: var(--paper);
    border-bottom: 1.5px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: 1; min-width: 70px;
    padding: 10px 4px 8px;
    border: none; background: transparent;
    font-size: 0.72rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: all 0.18s;
    white-space: nowrap;
  }
  nav button.active {
    color: var(--ink);
    border-bottom-color: var(--amber);
    font-weight: 700;
  }
  .tab { display: none; padding: 14px 12px 60px; }
  .tab.active { display: block; }

  /* ── shared ── */
  label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 4px; }
  /* iOS zoom prevention: ALL inputs must be >= 16px */
  input, select, textarea {
    font-size: 16px !important;
  }
  select, input[type=date], input[type=text] {
    width: 100%; padding: 8px 10px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    font-size: 0.9rem;
    appearance: none;
  }
  .card {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
  }
  .shift-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 0.78rem;
    font-weight: 700;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .s-D { background: var(--d-color); border-color: var(--d-border); color: #5a4a2a; }
  .s-E { background: var(--e-color); color: #2a4050; }
  .s-N { background: var(--n-color); color: #50420a; }
  .s-OFF { background: var(--off-color); color: #5a1a18; }
  .s-12 { background: var(--shift12-color); color: #1a3020; }
  .row-label { font-size: 0.72rem; color: var(--muted); width: 28px; flex-shrink: 0; padding-top: 3px; }
  h3 { font-family: Georgia, serif; font-size: 0.95rem; color: var(--ink); margin-bottom: 8px; }
  h4 { font-size: 0.82rem; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
  .section-title {
    font-family: Georgia, serif;
    font-size: 0.88rem;
    color: var(--ink);
    margin: 14px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--bg);
    font-size: 0.82rem;
  }
  .info-row:last-child { border-bottom: none; }
  .tag { font-size: 0.68rem; padding: 1px 6px; border-radius: 10px; font-weight: 600; }
  .tag-holiday { background: #fde8e8; color: #b03030; }
  .tag-override { background: #e8f0e8; color: #2d5043; }
  .btn {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-amber { background: var(--amber); color: #fff; }
  .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--ink); }
  .btn-danger { background: #c89a96; color: #fff; }

  /* ── Tab 1 week grid ── */
  .week-grid {
    display: grid;
    grid-template-columns: 30px repeat(7, 1fr);
    gap: 2px;
    margin-top: 8px;
    font-size: 0.7rem;
  }
  .wg-head {
    text-align: center;
    padding: 4px 2px;
    background: var(--ink);
    color: #fff;
    border-radius: 4px;
    font-size: 0.65rem;
    font-weight: 700;
  }
  .wg-cell {
    text-align: center;
    padding: 5px 2px;
    border-radius: 5px;
    font-size: 0.68rem;
    font-weight: 600;
    border: 1.5px solid transparent;
  }
  .wg-cell.today { border-color: var(--amber) !important; box-shadow: 0 0 0 2px var(--amber); }

  /* ── swap cards ── */
  .swap-section { margin-top: 14px; }
  .swap-card {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .swap-card.priority {
    background: var(--priority-bg);
    border-color: var(--priority-border);
  }
  .swap-card-header {
    padding: 10px 12px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    user-select: none;
  }
  .swap-card-header .name { font-weight: 700; font-size: 0.85rem; flex: 1; }
  .swap-card-header .chevron { font-size: 0.8rem; color: var(--muted); transition: transform 0.2s; }
  .swap-card-header.open .chevron { transform: rotate(90deg); }
  .swap-card-body { display: none; padding: 0 12px 12px; }
  .swap-card-body.open { display: block; }

  /* mini calendar inside swap card */
  .mini-table { width: 100%; border-collapse: collapse; font-size: 0.68rem; margin-top: 8px; }
  .mini-table th { background: var(--ink); color: #fff; padding: 3px; text-align: center; }
  .mini-table td { padding: 3px 2px; text-align: center; border: 1px solid var(--bg); }
  .mini-table td.swap-day { outline: 2px solid var(--amber); outline-offset: -2px; border-radius: 3px; }
  .mini-table td .s2 { font-size: 0.62rem; display: block; color: var(--amber); font-weight: 700; }



  /* ── Tab 3 Calendar ── */
  .cal-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-nav h2 {
    font-family: Georgia, serif;
    font-size: 1.0rem;
    color: var(--ink);
  }
  .cal-nav button {
    background: var(--ink); color: #fff;
    border: none; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 0.9rem;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-dh {
    text-align: center;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--muted);
    padding: 4px 0;
  }
  .cal-cell {
    position: relative;
    border-radius: 7px;
    overflow: visible;
    border: 1.5px solid var(--border);
    background: var(--paper);
    min-height: 84px;
    display: flex; flex-direction: column;
  }
  .cal-cell.today-cell { border-color: var(--amber); border-width: 2px; }
  .cal-cell.empty { background: transparent; border-color: transparent; }
  .cal-top {
    background: #fff;
    flex: 0 0 42%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    padding: 2px;
  }
  .cal-date {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--ink);
    z-index: 1;
  }
  .cal-holiday {
    position: absolute;
    top: 1px; right: 2px;
    font-size: 0.45rem;
    color: #b03030;
    font-weight: 700;
    line-height: 1.1;
    max-width: 30px;
    text-align: right;
  }
  .cal-shift {
    flex: 0 0 58%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem;
    font-weight: 700;
    border-radius: 0 0 5px 5px;
    padding: 2px 2px;
    text-align: center;
    line-height: 1.2;
  }
  .cal-shift.s-D { background: var(--d-color); color: #5a4a2a; }
  .cal-shift.s-E { background: var(--e-color); color: #2a4050; }
  .cal-shift.s-N { background: var(--n-color); color: #50420a; }
  .cal-shift.s-OFF { background: var(--off-color); color: #5a1a18; }
  .cal-shift.s-12 { background: var(--shift12-color); color: #1a3020; }
  .wk-badge {
    position: absolute;
    top: -7px; left: -7px;
    min-width: 1.8em; height: 1.8em;
    background: var(--ink);
    color: #fff;
    border-radius: 50%;
    font-size: 0.78rem;
    font-family: Georgia, serif;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    z-index: 10;
    padding: 0 3px;
    font-weight: 700;
  }

  /* ── Tab 4 Holidays ── */
  .hday-list { list-style: none; }
  .hday-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--bg);
    font-size: 0.82rem;
  }
  .hday-item:last-child { border: none; }
  .hday-date { width: 90px; flex-shrink: 0; color: var(--muted); font-size: 0.78rem; }
  .hday-name { flex: 1; }
  .hday-del {
    background: none; border: none;
    color: var(--off-color); font-size: 1rem;
    cursor: pointer; padding: 2px 6px;
  }

  .collapsible-header {
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 0;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    user-select: none;
  }
  .collapsible-header .ch { transition: transform 0.2s; }
  .collapsible-header.open .ch { transform: rotate(90deg); }
  .collapsible-body { display: none; }
  .collapsible-body.open { display: block; }

  .input-row { display: flex; gap: 8px; margin-top: 10px; }
  .input-row input { flex: 1; }

  /* can-not swap reason */
  .reason { font-size: 0.68rem; color: #b03030; }
  .tag-na2 { background: #e8eef5; color: #2a3a5a; }
  .tag-na3 { background: #e8f5ee; color: #1a4030; }
  .tag-na4 { background: #f0ebe0; color: #4a3a20; }
  .tag-na1 { background: #f5e8f5; color: #4a1a4a; }
  .tag-na { background: #f5f5e8; color: #4a4a1a; }
  /* ── Swap Panel ── */
  .sp-type-btn { flex:1; padding:6px 4px; border-radius:8px; border:1.5px solid var(--border); background:var(--paper); color:var(--muted); font-size:0.72rem; cursor:pointer; font-weight:600; }
  .sp-type-btn.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .swap-preview-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .spg-head { text-align:center; background:var(--ink); color:#fff; border-radius:4px; font-size:0.6rem; padding:3px 1px; font-weight:700; }
  .spg-cell { text-align:center; padding:4px 1px; border-radius:4px; font-size:0.62rem; font-weight:600; }
  .cal-cell.has-swap .wk-badge { background: var(--amber); }
  .cal-cell.selected-mon { outline: 2.5px solid var(--amber); outline-offset: 2px; border-radius: 7px; }
  .cal-cell.has-give .cal-top { background: #c9905a; }
  .cal-cell.has-give .cal-date { color: #fff; }

  /* ── Tab 5 Swap Records ── */
  .sr-type-btn { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .sr-type-btn button { flex:1; min-width:80px; padding:7px 6px; border-radius:8px; border:1.5px solid var(--border); background:var(--paper); color:var(--muted); font-size:0.72rem; cursor:pointer; font-weight:600; }
  .sr-type-btn button.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .sr-form { background:var(--paper); border:1.5px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px; }
  .sr-form-row { margin-bottom:8px; }
  .sr-form-row label { font-size:0.75rem; color:var(--muted); margin-bottom:3px; }
  .sr-list { list-style:none; }
  .sr-item { background:var(--paper); border:1.5px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:7px; }
  .sr-item.type-week { border-left:4px solid #2d5043; }
  .sr-item.type-day  { border-left:4px solid #c9905a; }
  .sr-item.type-give { border-left:4px solid #b5c4ce; }
  .sr-item-head { display:flex; align-items:center; gap:6px; }
  .sr-item-type { font-size:0.65rem; font-weight:700; padding:1px 6px; border-radius:10px; }
  .sr-type-week { background:#e8f0e8; color:#2d5043; }
  .sr-type-day  { background:#fdf0e8; color:#8a4020; }
  .sr-type-give { background:#e8eef5; color:#2a3a5a; }
  .sr-item-desc { flex:1; font-size:0.8rem; font-weight:600; }
  .sr-del { background:none; border:none; color:var(--off-color); font-size:1rem; cursor:pointer; padding:2px 5px; }
  .sr-note { font-size:0.72rem; color:var(--muted); margin-top:4px; }
  .sr-note-input { width:100%; margin-top:5px; padding:5px 8px; border:1.5px solid var(--border); border-radius:6px; background:var(--paper); color:var(--ink); font-size:0.75rem; }
  .sr-note-input::placeholder { color:var(--muted); }
  .sr-empty { text-align:center; color:var(--muted); font-size:0.82rem; padding:20px 0; }

</style>
</head>
<body>

<header>
  <h1>🏥 麻醉科排班查詢</h1>
  <span class="badge">Megan · NA4</span>
</header>

<nav>
  <button class="active" onclick="switchTab(0)">📅 日期→班別</button>
  <button onclick="switchTab(1)">🗓 月曆</button>
</nav>

<div id="tab0" class="tab active">
  <label>選擇日期</label>
  <input type="date" id="dateInput" oninput="renderTab0()">
  <div id="tab0Result"></div>
</div>

<div id="tab1" class="tab">
  <div class="cal-nav">
    <button onclick="calPrev()">◀</button>
    <h2 id="calTitle"></h2>
    <button onclick="calNext()">▶</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>

  <!-- Swap panel (appears when Monday clicked) -->
  <div id="swapPanel" style="display:none;margin-top:16px">
    <div style="font-family:Georgia,serif;font-size:0.88rem;color:var(--ink);margin-bottom:10px;padding-bottom:4px;border-bottom:1px solid var(--border)">
      🔄 換班設定 — <span id="swapPanelTitle" style="color:var(--amber);font-size:18px;font-weight:700"></span>
    </div>


    <!-- Form: 換號碼班 -->
    <div id="spForm0">
      <label>換成哪個號碼班</label>
      <select id="spWeekNum" onchange="renderSwapPreview()">
        <option value="">-- 選擇號碼班 --</option>
      </select>
      <label style="margin-top:8px">備註</label>
      <input type="text" id="spWeekNote" placeholder="例：和同事換班，方便出遊">
      <!-- Preview -->
      <div id="spWeekPreview" style="margin-top:10px;display:none">
        <div style="font-size:0.75rem;color:var(--muted);margin-bottom:5px">換後那週班表預覽：</div>
        <div id="spWeekPreviewGrid" class="swap-preview-grid"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="confirmSwapWeek()">✓ 確認換班</button>
    </div>

    <!-- Form: 加班互換 -->
    <div id="spForm1" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
      <div style="font-size:0.75rem;color:var(--muted);margin-bottom:6px">原班別：<span id="spGiveOrigShift" style="font-weight:700;color:var(--ink)"></span></div>
      <label>我換後的班別（可手動修改）</label>
      <input type="text" id="spGiveMyShift" placeholder="例：D10、D、OFF…" style="margin-bottom:8px">
      <label>備註（對方資訊等）</label>
      <input type="text" id="spGiveNote" placeholder="例：D1 給人員X，我上 D10">
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="confirmSwapGive()">✓ 確認加班互換</button>
    </div>
  </div>

  <!-- Records list -->
  <div style="margin-top:16px">
    <div style="font-family:Georgia,serif;font-size:0.88rem;color:var(--ink);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)">📋 換班紀錄</div>
    <p style="font-size:0.68rem;color:var(--muted);margin-bottom:8px">換班紀錄會自動儲存，重整後不消失</p>
    <ul class="sr-list" id="srList"></ul>
  </div>
</div>

<script>
// ═══════════════════════════════════
// DATA
// ═══════════════════════════════════

// 號碼班表 [1-35][0=Mon..6=Sun]
const SCHEDULE = {
  1:  ['D2','D','D5','D','D7','OFF','N2'],
  2:  ['N1','N2','OFF','OFF','N2','N1','OFF'],
  3:  ['E3','E3','E3','E3','E3','OFF','E1'],
  4:  ['E4','E4','E4','E4','E4','OFF','OFF'],
  5:  ['D10','D8','D2','D','D4','D1','OFF'],
  6:  ['E1','E1','E1','E1','E1','OFF','N1'],
  7:  ['N2','N1','N1','N2','OFF','OFF','OFF'],
  8:  ['D4','D6','D','D10','D3','OFF','OFF'],
  9:  ['E2','E2','E2','E2','E2','E2','OFF'],
  10: ['D5','D','D6','D2','DB1','D2','OFF'],
  11: ['DB1','D7','D1','D8','D5','OFF','OFF'],
  12: ['D3','DB1','N2','N1','N1','N2','OFF'],
  13: ['OFF','D10','D3','D7','D1','OFF','OFF'],
  14: ['D','D','D','D','D','OFF','E2'],
  15: ['12-8 2','12-8 3','12-8 1','12-8 2','12-8 3','OFF','OFF'],
  16: ['D7','D4','D9','DB1','D2','OFF','D2'],
  17: ['D','D3','D10','D1','D9','OFF','OFF'],
  18: ['12-8 3','12-8 1','12-8 2','12-8 3','12-8 1','E1','OFF'],
  19: ['12-8 1','12-8 2','12-8 3','12-8 1','12-8 2','OFF','OFF'],
  20: ['D1','D9','D4','D9','D6','OFF','OFF'],
  21: ['D9','D','DB1','D6','D8','OFF','D1'],
  22: ['D','D','D','D','D','OFF','OFF'],
  23: ['OFF','OFF','OFF','OFF','OFF','OFF','OFF'],
  24: ["D'OFF",'D','D','D','D','OFF','OFF'],
  25: ['D','D','D','D','D','OFF','OFF'],
  26: ['D8','D2','D7','D4','D','OFF.B','OFF'],
  27: ['D6','D1','D8','D3','D10','OFF','OFF'],
  28: ['D','D5','D','D5','D','OFF','OFF'],
  29: ['D11','D11','D11','D11','D11','OFF','OFF'],
  30: ['D','D','D','D','D','OFF','OFF'],
  31: ['D12','D12','D12','D12','D12','OFF','OFF'],
  32: ['D','D','D','D','D','OFF','OFF'],
  33: ['D','D','D','D','D','OFF','OFF'],
  34: ['D','D','D','D','D','OFF','OFF'],
  35: ['D','D','D','D','D','OFF','OFF'],
};

// Anchor: 2026-06-08(Mon) = week where each person has W1
const ANCHOR_DATE = new Date(2026, 5, 8); // June 8 2026 (Mon)

// Personnel: id, name, w1(號碼班 at anchor week), level, participates
const PERSONNEL = [
  {id:7,  w1:32, level:'NA4'},
  {id:9,  w1:33, level:'NA4'},
  {id:10, w1:1,  level:'NA4'},
  {id:11, w1:18, level:'NA4'},
  {id:12, w1:3,  level:'NA4'},
  {id:13, w1:19, level:'NA4'},
  {id:14, w1:28, level:'NA4'},
  {id:15, w1:31, level:'NA4'},
  {id:16, w1:10, level:'NA4'},
  {id:17, w1:13, level:'NA4'},
  {id:18, w1:5,  level:'NA4'},
  {id:19, w1:2,  level:'NA4'},
  {id:20, w1:17, level:'NA4'},
  {id:21, w1:8,  level:'NA4'},
  {id:22, w1:12, level:'NA4'},
  {id:23, w1:14, level:'NA4'},
  {id:24, w1:16, level:'NA4', isMe:true},
  {id:25, w1:9,  level:'NA3'},

// Priority lists for swap
const SWAP_PRIORITY = {
  E: [10,18,32,35,36,38,39],
  N: [15,20,32],
  '12': [23,26,39],
};


// ═══════════════════════════════════
// CORE LOGIC
// ═══════════════════════════════════

function dateToKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function keyToDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y,m-1,d);
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate()+n);
  return r;
}

// Get week offset from anchor (anchor week = 0)
function getWeekOffset(date) {
  const anchor = ANCHOR_DATE;
  // Find Monday of date's week
  const dow = date.getDay(); // 0=Sun
  const daysSinceMon = (dow + 6) % 7;
  const mon = addDays(date, -daysSinceMon);
  const diff = Math.round((mon - anchor) / (7*86400000));
  return diff;
}

// Get person's schedule number for a given week offset
function getNumForOffset(person, weekOffset) {
  const n = ((person.w1 - 1 + weekOffset) % 35 + 35) % 35 + 1;
  return n;
}

// Get shift for person on a specific date
function getShift(person, date) {
  const weekOffset = getWeekOffset(date);
  const num = getNumForOffset(person, weekOffset);
  const dow = date.getDay(); // 0=Sun
  const idx = (dow + 6) % 7; // Mon=0..Sun=6
  return SCHEDULE[num][idx];
}

// Holiday lookup
// Default 2026 holidays
const DEFAULT_HOLIDAYS = [
  {date:'2026-01-01',name:'元旦'},{date:'2026-02-17',name:'初一'},{date:'2026-02-18',name:'初二'},
  {date:'2026-02-19',name:'初三'},{date:'2026-02-20',name:'初四'},{date:'2026-02-21',name:'初五'},
  {date:'2026-02-28',name:'228'},{date:'2026-04-04',name:'兒童節'},{date:'2026-04-05',name:'清明節'},
  {date:'2026-05-01',name:'勞動節'},{date:'2026-06-19',name:'端午節'},{date:'2026-09-25',name:'中秋節'},
  {date:'2026-09-28',name:'教師節'},{date:'2026-10-10',name:'國慶日'},{date:'2026-10-25',name:'光復節'},
  {date:'2026-12-25',name:'行憲紀念日'},
];
let holidays = DEFAULT_HOLIDAYS.map(h=>({...h}));

function getHoliday(date) {
  const key = dateToKey(date);
  return holidays.find(h => h.date === key) || null;
}

// Apply holiday override rule
function applyHolidayOverride(rawShift, date) {
  const hday = getHoliday(date);
  if (!hday) return { shift: rawShift, overridden: false, holiday: null };
  const dow = date.getDay(); // 0=Sun,6=Sat
  // Only weekdays (Mon-Fri) trigger override
  if (dow === 0 || dow === 6) return { shift: rawShift, overridden: false, holiday: hday };
  // Override rules
  const noOverride = ['D1','D2','E1','E2','N1','N2'];
  const makeOff = ['D','D3','D4','D5','D6','D7','D8','D9','D10','D11','D12','DB1','E3','E4','12-8 1','12-8 2','12-8 3'];
  if (rawShift === 'OFF' || rawShift === 'OFF.B') return { shift: rawShift, overridden: false, holiday: hday };
  if (rawShift === "D'OFF") return { shift: "D'OFF", overridden: false, holiday: hday };
  if (noOverride.includes(rawShift)) return { shift: rawShift, overridden: false, holiday: hday };
  if (makeOff.includes(rawShift)) return { shift: 'OFF', overridden: true, holiday: hday };
  return { shift: rawShift, overridden: false, holiday: hday };
}

function getEffectiveShift(person, date) {
  const raw = getShift(person, date);
  const result = applyHolidayOverride(raw, date);
  return result;
}

// My person
const ME = PERSONNEL.find(p=>p.isMe);

function getMyShift(date) {
  return getEffectiveShift(ME, date);
}

// Shift category
function shiftCategory(s) {
  if (!s || s === 'OFF' || s === 'OFF.B') return 'OFF';
  if (s.startsWith('12-8')) return '12';
  if (s.startsWith('E')) return 'E';
  if (s.startsWith('N')) return 'N';
  return 'D'; // D, D1-D12, DB1, D'OFF
}

// Shift times (end hour for next-shift gap check)
const SHIFT_END = { D: 15.5, '12': 20, E: 23.5, N: 7.5+24 }; // N ends "next day 7:30"
const SHIFT_START = { D: 7.5, '12': 12, E: 15.5, N: 23.5 };

function canFollow(prev, next) {
  if (!prev || prev === 'OFF') return true;
  if (!next || next === 'OFF') return true;
  const pc = shiftCategory(prev);
  const nc = shiftCategory(next);
  const end = SHIFT_END[pc];
  const start = SHIFT_START[nc];
  // For N, end is 31.5 (next day 7:30), start of next must be >= end+11
  const gap = start + (end >= 24 ? 24 : 0) - end + (start < (end%24) ? 24 : 0);
  // Simpler: use lookup
  const rules = {
    D: ['D','12','E','N','OFF'],
    '12': ['D','12','E','N','OFF'],
    E: ['12','E','N','OFF'],
    N: ['N','OFF'],
    OFF: ['D','12','E','N','OFF'],
  };
  return rules[pc] && rules[pc].includes(nc);
}

function shiftClass(s) {
  const cat = shiftCategory(s);
  return cat === '12' ? 's-12' : `s-${cat}`;
}

function shiftPill(s) {
  return `<span class="shift-pill ${shiftClass(s)}">${s||'OFF'}</span>`;
}

const DOW_ZH = ['日','一','二','三','四','五','六'];

function fmtDate(d) {
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function today() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function renderTab0() {
  const val = document.getElementById('dateInput').value;
  const el = document.getElementById('tab0Result');
  if (!val) { el.innerHTML = ''; return; }
  const date = keyToDate(val);
  const weekOffset = getWeekOffset(date);
  const myNum = getNumForOffset(ME, weekOffset);
  const {shift: myShift, overridden, holiday} = getMyShiftWithSwaps(date);

  // Week range (Mon..Sun)
  const dow = date.getDay();
  const daysSinceMon = (dow + 6) % 7;
  const weekMon = addDays(date, -daysSinceMon);

  let html = `<div class="card">`;

  html += `<div class="info-row"><span>日期</span><span><b>${fmtDate(date)}</b>（週${DOW_ZH[dow]}）</span></div>`;
  html += `<div class="info-row"><span>當週號碼班</span><span><b style="font-family:Georgia;font-size:1.1rem;color:var(--ink)">№${myNum}</b></span></div>`;
  html += `<div class="info-row"><span>當天班別</span><span>${shiftPill(myShift)}`;
  if (holiday) {
    html += ` <span class="tag tag-holiday">${holiday.name}</span>`;
    if (overridden) html += ` <span class="tag tag-override">改為休假</span>`;
  }
  html += `</span></div>`;

  // Week grid
  html += `</div><div class="section-title">📋 當週班表（號碼班 ${myNum}）</div>`;
  html += `<div class="week-grid">`;
  html += `<div class="wg-head" style="background:transparent;"></div>`;
  const weekDays = ['一','二','三','四','五','六','日'];
  for (let i=0;i<7;i++) {
    const dd = addDays(weekMon, i);
    const isToday = dateToKey(dd) === val;
    html += `<div class="wg-head" style="${isToday?'background:var(--amber)':''}">${weekDays[i]}<br><span style="font-size:0.6rem;font-weight:400">${dd.getMonth()+1}/${dd.getDate()}</span></div>`;
  }
  html += `<div class="row-label" style="padding-top:6px;font-size:0.65rem;color:var(--muted)">我</div>`;
  for (let i=0;i<7;i++) {
    const dd = addDays(weekMon, i);
    const {shift: s} = getMyShiftWithSwaps(dd);
    const isToday = dateToKey(dd) === val;
    html += `<div class="wg-cell ${shiftClass(s)} ${isToday?'today':''}">${s}</div>`;
  }
  html += `</div>`;

  // Swap suggestions
  const cat = shiftCategory(myShift);
  if ((cat === '12' || cat === 'E' || cat === 'N') && !overridden) {
    html += renderSwapSection(date, myShift, cat);
  }

  el.innerHTML = html;
}

function renderSwapSection(date, myShift, cat) {
  const priorityIds = SWAP_PRIORITY[cat] || [];
  const others = PERSONNEL.filter(p=>!p.isMe);

  // Check each person
  const can = [], canPriority = [], canOther = [], cannot = [];

  for (const p of others) {
    const {shift: theirShift} = getEffectiveShift(p, date);
    const theirCat = shiftCategory(theirShift);

    if (theirCat !== 'D') {
      cannot.push({p, shift: theirShift, reason: `對方當天${theirCat==='OFF'?'休假':theirShift}，非白班`});
      continue;
    }

    // Check接班 rules: day before and after for both people
    const prev = addDays(date, -1);
    const next = addDays(date, 1);
    const myPrev = getEffectiveShift(ME, prev).shift;
    const myNext = getEffectiveShift(ME, next).shift;
    const theirPrev = getEffectiveShift(p, prev).shift;
    const theirNext = getEffectiveShift(p, next).shift;

    // If they swap: I get D, they get myShift
    const ok1 = canFollow(myPrev, 'D') && canFollow('D', myNext);
    const ok2 = canFollow(theirPrev, myShift) && canFollow(myShift, theirNext);

    if (!ok1) { cannot.push({p, shift:theirShift, reason:`我的前後班不符規則（前:${myPrev}→D→${myNext}）`}); continue; }
    if (!ok2) { cannot.push({p, shift:theirShift, reason:`對方前後班不符規則（${theirPrev}→${myShift}→${theirNext}）`}); continue; }

    if (priorityIds.includes(p.id)) {
      canPriority.push({p, theirShift});
    } else {
      canOther.push({p, theirShift});
    }
  }

  let html = `<div class="swap-section">`;
  html += `<div class="section-title">💱 換班建議（我上 ${myShift}，找上 D 班的同事）</div>`;

  if (canPriority.length > 0) {
    html += `<h4>⭐ 優先推薦</h4>`;
    for (const {p, theirShift} of canPriority) {
      html += renderSwapCard(p, date, myShift, theirShift, true);
    }
  }
  if (canOther.length > 0) {
    html += `<h4>✅ 其他可換班</h4>`;
    for (const {p, theirShift} of canOther) {
      html += renderSwapCard(p, date, myShift, theirShift, false);
    }
  }
  if (canPriority.length === 0 && canOther.length === 0) {
    html += `<div class="card"><p style="color:var(--muted);font-size:0.82rem;text-align:center">目前無符合條件的換班人選</p></div>`;
  }

  // Cannot swap - collapsible
  html += `<div class="collapsible-header" onclick="toggleCollapsible(this)">
    <span class="ch">▶</span> ❌ 不能換（${cannot.length} 人）
  </div>
  <div class="collapsible-body">`;
  for (const {p, reason} of cannot) {
    html += `<div style="padding:5px 0;border-bottom:1px solid var(--bg);font-size:0.78rem;">
      <b>人員 ${p.id}</b> <span class="tag tag-${p.level.toLowerCase()}">${p.level}</span>
      <span class="reason" style="margin-left:6px">${reason}</span>
    </div>`;
  }
  html += `</div></div>`;
  return html;
}

function renderSwapCard(p, swapDate, myShift, theirShift, isPriority) {
  const id = `sc-${p.id}`;
  const weekOffset = getWeekOffset(swapDate);
  const theirNum = getNumForOffset(p, weekOffset);
  const myNum = getNumForOffset(ME, weekOffset);

  return `<div class="swap-card ${isPriority?'priority':''}">
    <div class="swap-card-header" onclick="toggleSwapCard(this,'${id}')">
      ${isPriority ? '<span style="color:#d9a83b;font-size:1rem">⭐</span>' : ''}
      <span class="name">人員 ${p.id} <span class="tag tag-${p.level.toLowerCase()}">${p.level}</span></span>
      <span style="font-size:0.72rem;color:var(--muted)">№${theirNum}</span>
      ${shiftPill(theirShift)}
      <span class="chevron">▶</span>
    </div>
    <div class="swap-card-body" id="${id}">
      ${renderMiniTable(p, swapDate, myShift, theirShift)}
    </div>
  </div>`;
}

function renderMiniTable(p, swapDate, myShift, theirShift) {
  // Show prev Sat, prev Sun + this week + next week = 16 days
  const dow = swapDate.getDay();
  const daysSinceMon = (dow+6)%7;
  const thisMon = addDays(swapDate, -daysSinceMon);
  const prevSat = addDays(thisMon, -2);

  const dates = [];
  // prev Sat + Sun
  dates.push(addDays(thisMon,-2));
  dates.push(addDays(thisMon,-1));
  // this week Mon-Sun
  for(let i=0;i<7;i++) dates.push(addDays(thisMon,i));
  // next week Mon-Sun
  for(let i=7;i<14;i++) dates.push(addDays(thisMon,i));

  const swapKey = dateToKey(swapDate);

  let html = `<table class="mini-table"><thead><tr>
    <th>日期</th><th>週</th><th>我</th><th>人員${p.id}</th>
  </tr></thead><tbody>`;

  for (const d of dates) {
    const key = dateToKey(d);
    const isSwapDay = key === swapKey;
    const {shift: myS} = getEffectiveShift(ME, d);
    const {shift: theirS} = getEffectiveShift(p, d);
    const displayMyS = isSwapDay ? theirShift : myS;
    const displayTheirS = isSwapDay ? myShift : theirS;

    html += `<tr class="${isSwapDay?'swap-day':''}">
      <td>${d.getMonth()+1}/${d.getDate()}</td>
      <td>${DOW_ZH[d.getDay()]}</td>
      <td class="${shiftClass(displayMyS)}" style="border-radius:3px">
        ${displayMyS}
        ${isSwapDay?`<span class="s2">←換</span>`:''}
      </td>
      <td class="${shiftClass(displayTheirS)}" style="border-radius:3px">
        ${displayTheirS}
        ${isSwapDay?`<span class="s2">←換</span>`:''}
      </td>
    </tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); }

function renderCal() {
  const monthStart = new Date(calYear, calMonth, 1);
  const monthEnd = new Date(calYear, calMonth+1, 0);
  document.getElementById('calTitle').textContent =
    `${calYear} 年 ${calMonth+1} 月`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Day headers
  const dhs = ['一','二','三','四','五','六','日'];
  for (const d of dhs) {
    const el = document.createElement('div');
    el.className = 'cal-dh';
    el.textContent = d;
    grid.appendChild(el);
  }

  // First cell offset (Mon=0)
  const firstDow = monthStart.getDay(); // 0=Sun
  const offset = (firstDow + 6) % 7; // Mon=0
  for (let i=0;i<offset;i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }

  const todayKey = dateToKey(today());

  for (let day=1; day<=monthEnd.getDate(); day++) {
    const date = new Date(calYear, calMonth, day);
    const key = dateToKey(date);
    const {shift, overridden, holiday} = getMyShiftWithSwaps(date);
    const weekOffset = getWeekOffset(date);
    const myNum = getNumForOffset(ME, weekOffset);
    const dow = date.getDay();
    const isFirst = day === 1;
    const isMonday = ((dow+6)%7) === 0;
    const showBadge = isMonday || isFirst;
    const monKey = isMonday ? key : dateToKey(addDays(date, -((dow+6)%7)));
    const hasSwap = swapRecords.some(r => r.type==='week' && getWeekOffset(keyToDate(r.monKey))===weekOffset);
    const hasGive = swapRecords.some(r => r.type==='give' && r.dateKey===key);
    const cell = document.createElement('div');
    cell.className = `cal-cell${key===todayKey?' today-cell':''}${hasSwap?' has-swap':''}${hasGive?' has-give':''}`;
    cell.style.cursor = 'pointer';
    cell.dataset.datekey = key;
    cell.dataset.ismonday = isMonday ? '1' : '0';
    cell.dataset.monkey = monKey;
    cell.onclick = () => onCalCellClick(key, monKey, isMonday);

    const top = document.createElement('div');
    top.className = 'cal-top';

    const dateEl = document.createElement('div');
    dateEl.className = 'cal-date';
    dateEl.textContent = day;
    top.appendChild(dateEl);

    if (holiday) {
      const hEl = document.createElement('div');
      hEl.className = 'cal-holiday';
      hEl.textContent = holiday.name;
      top.appendChild(hEl);
    }

    if (showBadge) {
      const badge = document.createElement('div');
      badge.className = 'wk-badge';
      badge.textContent = myNum;
      cell.appendChild(badge);
    }

    const bottom = document.createElement('div');
    bottom.className = `cal-shift ${shiftClass(shift)}`;
    bottom.textContent = shift + (overridden ? '🔴' : '');
    bottom.style.fontSize = '0.6rem';

    cell.appendChild(top);
    cell.appendChild(bottom);
    grid.appendChild(cell);
  }
}

// TAB 4: Swap Records
// ═══════════════════════════════════

// swapRecords: array of {id, type, ...}
// type='week': {myWeekDate, theirPid, theirWeekDate, note}
//   → my week ↔ their week (entire week schedule swap)
// type='day': {myDate, myShift, theirPid, theirDate, theirShift, note}
//   → single day swap
// type='give': {myDate, myShift, theirPid, note}
//   → I give my overtime, I get D, they get myShift

let swapRecords = [];
let srIdCounter = 1;

function saveToStorage() {
  try {
    localStorage.setItem('swapRecords', JSON.stringify(swapRecords));
    localStorage.setItem('srIdCounter', srIdCounter);
  } catch(e) {}
}

function loadFromStorage() {
  try {
    const saved = localStorage.getItem('swapRecords');
    const savedId = localStorage.getItem('srIdCounter');
    if (saved) swapRecords = JSON.parse(saved);
    if (savedId) srIdCounter = parseInt(savedId);
  } catch(e) {}
}
let currentSRType = 0;

// ── Override engine ──
function getMyShiftWithSwaps(date) {
  const wo = getWeekOffset(date);
  const idx = (date.getDay() + 6) % 7;
  const key = dateToKey(date);
  for (const r of swapRecords) {
    if (r.type === 'week') {
      const rWO = getWeekOffset(keyToDate(r.monKey));
      if (wo === rWO) {
        const raw = SCHEDULE[r.targetNum][idx];
        return applyHolidayOverride(raw, date);
      }
    }
    if (r.type === 'give' && r.dateKey === key) {
      return applyHolidayOverride(r.myNewShift || r.origShift, date);
    }
  }
  return getEffectiveShift(ME, date);
}

function deleteSR(id) {
  swapRecords = swapRecords.filter(r=>r.id!==id);
  saveToStorage();
  renderSRList();
  renderCal();
  renderTab0();
}

function renderSRList() {
  const el = document.getElementById('srList');
  if (!swapRecords.length) {
    el.innerHTML = '<li style="color:var(--muted);font-size:0.8rem;padding:12px 0;text-align:center;list-style:none">尚無換班紀錄</li>';
    return;
  }
  const typeLabel = {week:'換號碼班', give:'加班互換'};
  const typeCls = {week:'sr-type-week', give:'sr-type-give'};
  const itemCls = {week:'type-week', give:'type-give'};
  el.innerHTML = [...swapRecords].reverse().map(r => `
    <li class="sr-item ${itemCls[r.type]}">
      <div class="sr-item-head">
        <span class="sr-item-type ${typeCls[r.type]}">${typeLabel[r.type]}</span>
        <span class="sr-item-desc">${r.desc}</span>
        <button class="sr-del" onclick="deleteSR(${r.id})">✕</button>
      </div>
      <input class="sr-note-input" type="text" placeholder="💬 備註（可隨時修改）"
        value="${r.note||''}"
        oninput="updateSRNote(${r.id}, this.value)">
    </li>`).join('');
}

function updateSRNote(id, val) {
  const r = swapRecords.find(r => r.id === id);
  if (r) r.note = val;
}

}

function onCalCellClick(dateKey, monKey, isMonday) {
  selectedSwapMonday = monKey;
  selectedSwapDate = dateKey;
  const clickedDate = keyToDate(dateKey);
  const monDate = keyToDate(monKey);
  const wo = getWeekOffset(monDate);
  const myNum = getNumForOffset(ME, wo);
  const DOW = ['日','一','二','三','四','五','六'];
  const {shift} = getMyShiftWithSwaps(clickedDate);

  document.getElementById('swapPanel').style.display = 'block';

  // Title: show clicked date info
  if (isMonday) {
    document.getElementById('swapPanelTitle').textContent =
      `${clickedDate.getMonth()+1}/${clickedDate.getDate()}（週一）那週 N.${myNum}`;
  } else {
    document.getElementById('swapPanelTitle').textContent =
      `${clickedDate.getMonth()+1}/${clickedDate.getDate()}（週${DOW[clickedDate.getDay()]}）${shiftPillText(shift)}`;
  }

  // Show/hide 換號碼班 tab based on whether it's Monday

  // Reset forms
  document.getElementById('spWeekNum').value = '';
  document.getElementById('spWeekNote').value = '';
  document.getElementById('spGiveNote').value = '';
  document.getElementById('spWeekPreview').style.display = 'none';
  // Pre-fill give shift with current shift
  const origShift = getMyShiftWithSwaps(clickedDate).shift;
  document.getElementById('spGiveOrigShift').textContent = origShift || 'OFF';
  document.getElementById('spGiveMyShift').value = origShift || '';

  // Default to 加班互換 if not Monday
  // Show/hide forms directly
  document.getElementById('spForm0').style.display = isMonday ? 'block' : 'none';
  document.getElementById('spForm1').style.display = 'block';

  // Highlight selected cell
  document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected-mon'));
  document.querySelectorAll('.cal-cell[data-datekey="'+dateKey+'"]').forEach(c => c.classList.add('selected-mon'));

  // Scroll to panel
  setTimeout(() => document.getElementById('swapPanel').scrollIntoView({behavior:'smooth', block:'nearest'}), 100);
}

function shiftPillText(s) {
  return s || 'OFF';
}

function renderSwapPreview() {
  const numVal = document.getElementById('spWeekNum').value;
  const preview = document.getElementById('spWeekPreview');
  const grid = document.getElementById('spWeekPreviewGrid');
  if (!numVal || !selectedSwapMonday) { preview.style.display='none'; return; }
  const targetNum = parseInt(numVal);
  const wds = ['一','二','三','四','五','六','日'];
  let h = '';
  for (let i=0;i<7;i++) h += `<div class="spg-head">${wds[i]}</div>`;
  for (let i=0;i<7;i++) {
    const s = SCHEDULE[targetNum][i];
    h += `<div class="spg-cell ${shiftClass(s)}">${s}</div>`;
  }
  grid.innerHTML = h;
  preview.style.display = 'block';
}

function confirmSwapWeek() {
  const numVal = document.getElementById('spWeekNum').value;
  const note = document.getElementById('spWeekNote').value.trim();
  if (!numVal || !selectedSwapMonday) { alert('請先選擇號碼班'); return; }
  const targetNum = parseInt(numVal);
  const date = keyToDate(selectedSwapMonday);
  const wo = getWeekOffset(date);
  const myNum = getNumForOffset(ME, wo);

  // Remove any existing week swap for this week
  swapRecords = swapRecords.filter(r => !(r.type==='week' && getWeekOffset(keyToDate(r.monKey)) === wo));

  swapRecords.push({
    id: srIdCounter++,
    type: 'week',
    monKey: selectedSwapMonday,
    targetNum,
    note,
    desc: `${date.getMonth()+1}/${date.getDate()} 那週：№${myNum} → №${targetNum}`
  });

  renderSRList();
  renderCal();
  renderTab0();
  document.getElementById('swapPanel').style.display = 'none';
  selectedSwapMonday = null;
}

function confirmSwapGive() {
  const note = document.getElementById('spGiveNote').value.trim();
  const myNewShift = document.getElementById('spGiveMyShift').value.trim();
  if (!selectedSwapDate) return;
  const date = keyToDate(selectedSwapDate);
  const {shift: origShift} = getMyShiftWithSwaps(date);
  const DOW = ['日','一','二','三','四','五','六'];
  const finalShift = myNewShift || origShift;

  swapRecords.push({
    id: srIdCounter++,
    type: 'give',
    dateKey: selectedSwapDate,
    origShift,
    myNewShift: finalShift,
    note,
    desc: `${date.getMonth()+1}/${date.getDate()}（週${DOW[date.getDay()]}）${origShift}→${finalShift}`
  });

  renderSRList();
  renderCal();
  document.getElementById('swapPanel').style.display = 'none';
  selectedSwapDate = null;
  selectedSwapMonday = null;
}

// Set today's date as default
const todayStr = dateToKey(today());
document.getElementById('dateInput').value = todayStr;

loadFromStorage();
initSwapPanel();
renderSRList();
renderTab0();
renderCal();
</script>
