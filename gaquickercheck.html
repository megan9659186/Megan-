      <div class="calc-note"><b>公式</b>:藥量(mg)÷ 溶液總量(mL)× 1000 ÷ 體重(kg)÷ 60 = 每 1 mL/hr 相當於幾 µg/kg/min。<b>心算版</b>:藥量(mg)÷〔體重(kg)× 容量常數〕,容量常數 100 mL → 6、200 mL → 12、250 mL → 15、300 mL → 18、400 mL → 24、500 mL → 30。計算結果僅供核對,<b>實際速率仍依醫囑與病人反應調整</b>。</div>
    </div>

    <div class="tool-box">
      <h3>上幫浦前的提醒</h3>
      <ul style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.65;color:var(--ink);padding-left:18px">
        <li>需持續點滴給藥時,<b>先加藥稀釋、再排 set 內空氣</b></li>
        <li>劑量有變動時依主治醫師醫囑執行,<b>問清楚、聽清楚再執行</b></li>
      </ul>
    </div>

    <div class="tool-box">
      <h3>備藥時的幾個提醒</h3>
      <ul style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.65;color:var(--ink);padding-left:18px">
        <li><b>一次只泡一支、泡完立刻貼標</b>,不要一口氣抽好幾支再回頭補標籤</li>
        <li>濃度相近但強度差很多的藥(epinephrine 0.01 mg/mL 與 0.1 mg/mL、norepinephrine 推注與輸注)<b class='w'>分開放置</b></li>
        <li>換班或接手他人備好的針筒時,<b>沒有標示就重泡</b>,不要憑外觀猜</li>
        <li>高濃度輸注藥物盡量走<b>中心靜脈</b>;週邊給予時固定好並定時檢查有無外滲</li>
      </ul>
    </div>

    <div class="disclaimer">
      本表為臨床記憶輔助,非取代臨床判斷與藥品仿單。給藥前請完成標準核對流程,並依所屬機構protocol調整。
    </div>
  </div>`;
}

/* ---------- 表格左右捲動指示條(常駐顯示)---------- */
let RAIL_DRAG = null;
let RAIL_GLOBAL_BOUND = false;

function railBindGlobal(){
  if(RAIL_GLOBAL_BOUND) return;
  RAIL_GLOBAL_BOUND = true;
  const move = e => {
    if(!RAIL_DRAG) return;
    const d = RAIL_DRAG;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const max = d.sc.scrollWidth - d.sc.clientWidth;
    const track = d.rail.clientWidth - d.thumb.offsetWidth;
    if(track > 0 && max > 0) d.sc.scrollLeft = d.left0 + (x - d.x0) * (max / track);
  };
  const up = () => { RAIL_DRAG = null; };
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, { passive:true });
  document.addEventListener("mouseup", up);
  document.addEventListener("touchend", up);
  document.addEventListener("touchcancel", up);
}

function initScrollRails(){
  railBindGlobal();
  document.querySelectorAll(".tool-scroll").forEach(sc => {
    let rail = sc.nextElementSibling;
    if(!rail || !rail.classList || !rail.classList.contains("scroll-rail")){
      rail = document.createElement("div");
      rail.className = "scroll-rail";
      rail.innerHTML = `<div class="scroll-thumb"></div>`;
      sc.parentNode.insertBefore(rail, sc.nextSibling);
    }
    const thumb = rail.querySelector(".scroll-thumb");
    const sync = () => {
      const max = sc.scrollWidth - sc.clientWidth;
      if(max <= 2){ rail.classList.add("off"); return; }
      rail.classList.remove("off");
      const w = Math.max((sc.clientWidth / sc.scrollWidth) * 100, 14);
      thumb.style.width = w + "%";
      thumb.style.left = ((sc.scrollLeft / max) * (100 - w)) + "%";
    };
    if(!sc.dataset.railed){
      sc.dataset.railed = "1";
      sc.addEventListener("scroll", sync, { passive:true });
      const start = e => {
        const max = sc.scrollWidth - sc.clientWidth;
        if(max <= 2) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const tb = thumb.getBoundingClientRect();
        /* 直接點軌道任一處:先把滑塊移過去再開始拖曳 */
        if(x < tb.left || x > tb.right){
          const rb = rail.getBoundingClientRect();
          const track = rail.clientWidth - thumb.offsetWidth;
          if(track > 0){
            const p = Math.min(Math.max((x - rb.left - thumb.offsetWidth/2) / track, 0), 1);
            sc.scrollLeft = p * max;
            sync();
          }
        }
        RAIL_DRAG = { sc, rail, thumb, x0:x, left0:sc.scrollLeft };
        if(e.cancelable) e.preventDefault();
      };
      rail.addEventListener("mousedown", start);
      rail.addEventListener("touchstart", start, { passive:false });
      window.addEventListener("resize", sync);
    }
    sync();
    setTimeout(sync, 80);
  });
}

function wireDrugCalc(){
  const S = DRUG_CALC_STATE;
  const fmt = x => (x==null || !isFinite(x)) ? "—"
    : (Math.abs(x)>=100 ? x.toFixed(0) : Math.abs(x)>=10 ? x.toFixed(1) : Math.abs(x)>=1 ? x.toFixed(2) : x.toFixed(3));
  const setCells = (boxId, vals) => {
    const box = el(boxId); if(!box) return;
    box.querySelectorAll(".calc-cell").forEach((c,i)=>{
      if(!vals[i]) return;
      const v = c.querySelector(".v");
      const u = v.querySelector(".u");
      v.textContent = vals[i][0];
      if(u) v.appendChild(u);
      if(vals[i][1] != null){ const h = c.querySelector(".h"); if(h) h.textContent = vals[i][1]; }
    });
  };
  const upd = () => {
    const mg = parseFloat(el("dgMg").value);
    const mL = parseFloat(el("dgVol").value);
    const wt = parseFloat(el("dgWt").value);
    const dose = parseFloat(el("dgDose").value);
    const rate = parseFloat(el("dgRate").value);
    if(mg>0) S.mg = mg;
    if(mL>0) S.mL = mL;
    if(wt>0) S.wt = wt;
    if(dose>0) S.dose = dose;
    if(rate>0) S.rate = rate;
    const isHr = drugIsHrUnit(S.pi);
    const hrCell = el("dgHrCell");
    if(hrCell) hrCell.style.display = isHr ? "" : "none";
    const c = drugConcCalc(mg, mL, wt);
    setCells("dgOut", c
      ? [[fmt(c.cmg), `= ${fmt(c.cug)} µg/mL`], [fmt(c.perMin), null], [fmt(c.perHr), null]]
      : [["—","—"], ["—",null], ["—",null]]);
    const r = drugRateFromDose(mg, mL, wt, dose);
    const d = drugDoseFromRate(mg, mL, wt, rate);
    setCells("dgOut2", [
      [fmt(r), null],
      [fmt(d && d.min), d ? (isHr ? `= ${fmt(d.hr)} µg/kg/hr` : "依上方濃度與體重換算") : "—"]
    ]);
  };
  const pre = el("dgPreset");
  if(pre){
    pre.addEventListener("change", () => {
      S.pi = pre.value;
      const p = DRUG_PRESETS[+pre.value];
      if(p && p.mg != null){
        el("dgMg").value = p.mg;
        el("dgVol").value = p.mL;
      }
      upd();
    });
  }
  ["dgMg","dgVol","dgWt","dgDose","dgRate"].forEach(id=>{
    const n = el(id);
    if(n){
      n.addEventListener("input", upd);
      n.addEventListener("change", upd);
    }
  });
  ["dgMg","dgVol"].forEach(id=>{
    const n = el(id);
    if(n) n.addEventListener("input", () => {
      const p = el("dgPreset");
      if(p){ p.value = "0"; S.pi = "0"; }
    });
  });
  initScrollRails();
}

function renderList(){
  const q = el("search").value.trim();
  if(activeSpec===EXAM_CHIP || activeSpec===QUIZ_CHIP){ renderSetList(activeSpec); return; }
  if(activeSpec===CALC_CHIP && !q){ el("list").innerHTML = calcHtml(); wireCalc(); return; }
  if(activeSpec===DRUG_CHIP && !q){ el("list").innerHTML = drugPrepHtml(); wireDrugCalc(); return; }
  if((!activeSpec || activeSpec===HOME_CHIP) && !q){
    el("list").innerHTML = updatesHtml();
    el("list").querySelectorAll(".upd-link").forEach(b=>{
      b.onclick = () => showDetail(+b.dataset.go);
    });
    return;
  }
  const allSpec = !activeSpec || activeSpec==="全部" || activeSpec===HOME_CHIP
    || activeSpec===CALC_CHIP || activeSpec===DRUG_CHIP;   /* 在首頁或工具頁搜尋 = 全科搜尋 */
  const items = SURGERIES.filter(s =>
    (allSpec || inSpec(s,activeSpec)) && matches(s,q)
  );
  if(!items.length){
    el("list").innerHTML = (activeSpec===NORA_SPEC && !q)
      ? `<div class="set-empty"><b>${NORA_SPEC}(手術室外麻醉)</b>
          內容建置中。預計涵蓋內視鏡、支氣管鏡、心導管與電生理、
          CT／MRI 影像檢查、介入性放射線、電氣痙攣治療等。</div>`
      : `<div class="empty">找不到符合的手術<br>試試其他關鍵字</div>`;
    return;
  }
  el("list").innerHTML = items.map(s=>{
    const id = SURGERIES.indexOf(s);
    const isN = isNewItem(s);
    return `<div class="card ${id===activeId?'active':''} ${isN?'has-new':''}" data-id="${id}">
      ${isN ? `<span class="badge-new" title="近期新增或更新">NEW</span>` : ""}
      <div class="name">${s.en}</div>
      <div class="en">${s.name}</div>
      <div class="meta">
        <span class="tag spec">${s.specialty}</span>
        <span class="tag">${s.summary.airway}</span>
        ${hasNote(s) ? `<span class="tag note-tag" title="已有個人筆記">📝 筆記</span>` : ""}
      </div>
    </div>`;
  }).join("");
  el("list").querySelectorAll(".card").forEach(c=>{
    c.onclick = () => showDetail(+c.dataset.id);
  });
}

/* 體位小圖示 —— 依醫院手術床遙控器(Skytron 3503)風格:實心圓點=頭(固定左側)、粗線=身體/床面、側面平躺視角。
   type: 'supine'(LEVEL平躺) | 'revtrend'(頭高) | 'trend'(頭低) | 'prone'(俯臥) | 'lateral'(側臥) */
function posIcon(type){
  const icons = {
    supine:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="7" cy="9.4" r="3"/><rect x="10" y="8" width="26" height="2.8" rx="1.4"/></svg>`,
    revtrend:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="6.5" cy="6.6" r="3"/><rect x="10" y="8.6" width="26" height="2.8" rx="1.4" transform="rotate(7 23 10)"/></svg>`,
    trend:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="6.5" cy="12.4" r="3"/><rect x="10" y="8.6" width="26" height="2.8" rx="1.4" transform="rotate(-7 23 10)"/></svg>`,
    prone:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="7" cy="7.4" r="3"/><rect x="5.6" y="9.9" width="2.8" height="3.3" rx="1.3"/><rect x="10" y="8.1" width="26" height="2.8" rx="1.4"/></svg>`,
    lateral:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="7" cy="8.4" r="3"/><path d="M10 9 q7 0 11 5 q3 3.5 8 1.2" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  };
  return icons[type] || icons.supine;
}

/* ============================================================
   手勢:在手術詳情頁往右滑 → 返回清單
   ------------------------------------------------------------
   只在手機版(stage-detail 生效時)作用;若手指起點落在可橫向
   捲動的元素(示意圖、表格等)上則不攔截,避免誤觸。
   ============================================================ */
(function(){
  const SWIPE_X = 70;   /* 水平位移門檻 px */
  const SWIPE_Y = 55;   /* 垂直位移上限 px,超過視為捲動 */
  let x0 = 0, y0 = 0, live = false;
  const pane = el("detail");
  if(!pane) return;

  function scrollableX(node){
    while(node && node !== pane){
      if(node.scrollWidth - node.clientWidth > 8) return true;
      node = node.parentElement;
    }
    return false;
  }
  pane.addEventListener("touchstart", e => {
    live = false;
    if(e.touches.length !== 1) return;
    if(!el("app").classList.contains("stage-detail")) return;
    if(scrollableX(e.target)) return;
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    live = true;
  }, { passive:true });
  pane.addEventListener("touchend", e => {
    if(!live) return;
    live = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if(dx > SWIPE_X && Math.abs(dy) < SWIPE_Y) goBack();
  }, { passive:true });
})();

/* ============================================================
   自動更新:檔案推上 GitHub 後,手機回到 app 或每隔一段時間
   會自動偵測伺服器上的新版並更新,不必重開連結。
   原理:以 no-store 抓自身網址,比對 ETag / Last-Modified
   (取不到時退而比對內容雜湊)。只在 GitHub Pages 等 http(s)
   環境有效;本機 file:// 開啟會靜默略過。
   ============================================================ */
(function(){
  var SELF = location.href.split('#')[0].split('?')[0];
  var baseline = null;
  function hash(t){var h=0;for(var i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0;}return t.length+':'+h;}
  function getSig(){
    return fetch(SELF,{cache:'no-store'}).then(function(res){
      if(!res.ok) throw 0;
      var e=res.headers.get('etag'), m=res.headers.get('last-modified');
      if(e) return 'e:'+e;
      if(m) return 'm:'+m;
      return res.text().then(function(t){return 'h:'+hash(t);});
    });
  }
  window.applyUpdate=function(){ location.reload(); };
  function onNew(){
    var app=document.getElementById('app');
    if(app && app.classList.contains('stage-detail')){
      var b=document.getElementById('upd'); if(b) b.style.display='flex';
    } else { location.reload(); }
  }
  function check(){
    getSig().then(function(sig){
      if(baseline===null){ baseline=sig; return; }
      if(sig!==baseline){ onNew(); }
    }).catch(function(){});
  }
  check();
  setInterval(check, 60000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
  window.addEventListener('focus', check);
})();
</script>
