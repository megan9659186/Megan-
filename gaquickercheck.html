<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="麻醉速查">
<meta name="theme-color" content="#FBF8F1">
<title>各科手術全身麻醉快速查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F1;         /* 淺米白底 */
  --surface:#F4F1EB;    /* 卡片乳白 */
  --surface-2:#EDE9E1;
  --ink:#423E39;        /* 暖深灰褐 主文字 */
  --ink-soft:#726B62;   /* 次文字 */
  --line:#D6CFC3;       /* 細分隔線 */
  --sage:#8B9A8B;       /* 主色 灰綠 */
  --sage-tint:#DDE3D9;
  --clay:#B8968C;       /* 副色 灰玫 */
  --clay-tint:#EBDDD7;
  --flag:#A87E76;       /* 警示 灰陶紅 */
  --flag-tint:#EAD9D3;
  --warn:#C0392B;       /* 警示紅字 */
  --slate:#8892A0;      /* 監測 灰藍 */
  --slate-tint:#DCE0E5;
  --ochre:#B7A177;      /* 用藥 灰赭 */
  --ochre-tint:#E9E1D0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  line-height:1.6;font-size:16.5px;
}
.app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ---------- Header ---------- */
header{padding:22px 22px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:"Noto Serif TC",serif;font-weight:600;font-size:26px;letter-spacing:.5px}
.brand .sub{font-size:13.5px;color:var(--ink-soft);letter-spacing:.5px}
.search{margin-top:14px;position:relative}
.search input{
  width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:16.5px;outline:none;transition:border-color .15s;
}
.search input:focus{border-color:var(--sage)}
.search input::placeholder{color:#A69E92}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#A69E92}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{
  padding:6px 13px;border-radius:20px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-soft);font-size:14px;cursor:pointer;
  transition:all .15s;font-family:inherit;
}
.chip:hover{border-color:var(--sage)}
.chip[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff}

/* ---------- Body layout ---------- */
.body{display:flex;flex:1;min-height:0}
.list{
  width:340px;flex-shrink:0;border-right:1px solid var(--line);
  overflow-y:auto;padding:12px;
}
.detail{flex:1;overflow-y:auto;padding:26px 30px 60px}

/* ---------- List cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:all .15s;
}
.card:hover{border-color:var(--sage);transform:translateY(-1px)}
.card.active{border-color:var(--sage);background:var(--sage-tint)}
.card .name{font-weight:500;font-size:16.5px}
.card .en{font-size:13px;color:var(--ink-soft);margin-top:1px}
.card .meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft)}
.tag.spec{background:var(--clay-tint);color:#8a6a60}
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:15px}
/* 更新紀錄(首頁預設畫面) */
.upd{padding:20px 20px 28px}
.upd-h{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:600;color:var(--ink);margin-bottom:4px}
.upd-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6}
.upd-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.upd-date{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;color:#5E6B5E;
  background:var(--sage-tint);border-radius:20px;padding:3px 11px;margin-bottom:9px}
.upd-note{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.upd-list{list-style:none;margin:0;padding:0}
.upd-list li{position:relative;padding-left:17px;font-size:14.5px;line-height:1.8;color:var(--ink)}
.upd-list li+li{margin-top:2px}
.upd-list li::before{content:"";position:absolute;left:3px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--clay)}
.upd-link{font:inherit;color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.upd-link:hover{color:#5E6B5E;text-decoration-color:var(--sage)}
.upd-tip{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:18px;line-height:1.6}

/* ---------- Detail view ---------- */
.detail .placeholder{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#A69E92;text-align:center;gap:10px;
}
.detail .placeholder svg{opacity:.5}
.d-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:4px}
.back{display:none;align-items:center;gap:6px;background:none;border:none;color:var(--sage);
  font-family:inherit;font-size:15px;cursor:pointer;padding:0;margin-bottom:14px}
.back-bottom{width:100%;justify-content:center;margin:26px 0 4px;padding:13px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  color:var(--sage);font-size:15.5px;font-weight:500}
.back-bottom:hover{border-color:var(--sage);background:var(--sage-tint)}
.d-title{font-family:"Noto Serif TC",serif;font-weight:600;font-size:26px;letter-spacing:.3px}
.d-title-zh{font-size:16.5px;color:var(--ink-soft);margin-top:2px}
.d-en{color:var(--ink-soft);font-size:13.5px;margin-top:6px;letter-spacing:.4px}
.d-summary{
  display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px;
}
.d-summary .item{font-size:14px}
.d-summary .item .k{color:var(--ink-soft);font-size:12.5px;letter-spacing:.5px}
.d-summary .item .v{font-weight:500;margin-top:1px}
.d-summary .item.pos .v{display:flex;align-items:center;gap:7px}
.posico{width:30px;height:14px;flex-shrink:0;color:var(--ink)}

.section{margin-top:22px;padding-left:15px;border-left:3px solid var(--sage);position:relative}
.section h3{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.section .dot{width:8px;height:8px;border-radius:50%;background:var(--sage);flex-shrink:0}
.section ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.section li{position:relative;padding-left:16px;font-size:16px;color:var(--ink)}
.section li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;
  border-radius:50%;background:var(--line)}
.section li b{font-weight:600;color:var(--ink)}
.section li b.w{font-weight:700;color:var(--warn)}

/* section color variants */
.s-airway{border-left-color:var(--slate)}   .s-airway .dot{background:var(--slate)}
.s-monitor{border-left-color:var(--slate)}  .s-monitor .dot{background:var(--slate)}
.s-drug{border-left-color:var(--ochre)}     .s-drug .dot{background:var(--ochre)}
.s-hemo{border-left-color:var(--clay)}      .s-hemo .dot{background:var(--clay)}

/* red flag block */
.flag-box{margin-top:24px;background:var(--flag-tint);border:1px solid #DDBEB4;
  border-radius:11px;padding:15px 17px}
.flag-box h3{color:var(--warn);font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:9px}
.flag-box ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.flag-box li{position:relative;padding-left:18px;font-size:16px;color:var(--warn);font-weight:700}
.flag-box li b{font-weight:700;color:var(--warn)}
.flag-box li::before{content:"▲";position:absolute;left:0;top:1px;font-size:11px;color:var(--warn)}

.asa-btn{margin-left:auto;font-family:inherit;font-size:12.5px;color:var(--slate);
  background:var(--slate-tint);border:1px solid #C9D0D8;border-radius:20px;
  padding:3px 10px;cursor:pointer;font-weight:500;transition:all .15s;white-space:nowrap}
.asa-btn:hover{background:#CED6DE}
.asa-btn[aria-expanded="true"]{background:var(--slate);color:#fff;border-color:var(--slate)}
.asa-panel{margin-top:10px;background:var(--slate-tint);border:1px solid #D2D8DF;
  border-radius:10px;padding:13px 15px;line-height:1.6;color:var(--ink)}
.asa-panel[hidden]{display:none}
.asa-panel h4{font-size:13.5px;font-weight:700;color:#5a6470;margin-bottom:8px;letter-spacing:.3px}
.asa-panel .std{margin-bottom:6px;font-size:13.8px}
.asa-panel .std b{color:var(--ink);font-weight:700}
.asa-panel ul{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:6px}
.asa-panel li{position:relative;padding-left:15px;font-size:13.5px;color:var(--ink-soft)}
.asa-panel li::before{content:"";position:absolute;left:3px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--slate)}
.asa-panel li b{color:var(--ink);font-weight:600}
.asa-panel .src{margin-top:9px;padding-top:8px;border-top:1px solid #D2D8DF;font-size:12.5px;color:var(--ink-soft);line-height:1.55}

.d-figure{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 12px 10px}
.d-figure svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.d-figure figcaption{margin-top:8px;font-size:13px;color:var(--ink-soft);line-height:1.55;text-align:center}

/* 通用「點擊展開說明」按鈕與面板 */
.info-btn{display:inline-flex;align-items:center;margin-left:6px;font-family:inherit;font-size:12.5px;
  color:var(--sage);background:var(--sage-tint);border:1px solid #C7D0C4;border-radius:20px;
  padding:1px 8px;cursor:pointer;font-weight:500;vertical-align:middle;line-height:1.6;transition:all .15s}
.info-btn:hover{background:#CED6C9}
.info-btn[aria-expanded="true"]{background:var(--sage);color:#fff;border-color:var(--sage)}
.info-panel{display:block;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);
  border-left:3px solid var(--sage);border-radius:8px;padding:10px 13px;
  font-size:15px;line-height:1.65;color:var(--ink-soft);font-weight:400}
.info-panel[hidden]{display:none}
.info-panel b{color:var(--ink);font-weight:600}

.refs-box{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px 17px}
.refs-box h3{font-size:15px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.refs-box ol{list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:8px}
.refs-box li{counter-increment:r;position:relative;padding-left:24px;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.refs-box li::before{content:counter(r);position:absolute;left:0;top:0;width:17px;height:17px;
  background:var(--sage-tint);color:#5a6a5a;border-radius:5px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center}

/* ---------- 個人筆記 / 照片(存在本機瀏覽器) ---------- */
.note-box{margin-top:22px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--clay);border-radius:11px;padding:15px 17px 16px}
.note-box h3{font-size:15px;font-weight:700;color:var(--ink-soft);
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.note-local{font-size:12px;font-weight:500;color:#8a6a60;background:var(--clay-tint);
  border-radius:20px;padding:2px 9px}
.note-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:10px}
.note-ta{display:block;width:100%;min-height:110px;resize:vertical;font-family:inherit;
  font-size:15.5px;line-height:1.7;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.note-ta:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 2px var(--clay-tint)}
.note-row{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.note-status{font-size:12.5px;color:var(--ink-soft)}
.note-btn{font-family:inherit;font-size:13px;font-weight:500;color:#8a6a60;
  background:var(--clay-tint);border:1px solid #DCC7BF;border-radius:20px;
  padding:5px 13px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.note-btn:hover{background:#E2CFC8}
.note-btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft)}
.note-btn.ghost:hover{background:var(--surface-2)}

.note-backup{margin:8px 0 12px;background:var(--ochre-tint);border:1px solid #DCCFAE;
  border-radius:9px;padding:11px 13px}
.note-backup .bk-msg{font-size:13.5px;line-height:1.65;color:#6b5d3c}
.note-backup .bk-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}

.ph-wrap{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ph-wrap h4{font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:7px}
.ph-warn{font-size:12.5px;line-height:1.6;color:#8a5a50;background:var(--flag-tint);
  border-radius:8px;padding:8px 11px;margin-bottom:10px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-bottom:10px}
.ph-grid:empty{display:none}
.ph-item{position:relative;aspect-ratio:1/1;border-radius:9px;overflow:hidden;
  border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.ph-item img{width:100%;height:100%;object-fit:cover;display:block}
.ph-item .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(66,62,57,.72);
  color:#fff;font-size:11.5px;line-height:1.35;padding:4px 6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-empty{font-size:13px;color:var(--ink-soft);margin-bottom:10px}

.lb{position:fixed;inset:0;z-index:99;background:rgba(40,37,33,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px}
.lb img{max-width:100%;max-height:66vh;border-radius:10px;object-fit:contain;background:#000}
.lb-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}
.lb-cap{flex:1 1 200px;min-width:0;font-family:inherit;font-size:14.5px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
.lb-cap:focus{outline:none;border-color:var(--clay)}
.lb-btn{font-family:inherit;font-size:13.5px;font-weight:500;border-radius:20px;
  padding:7px 14px;cursor:pointer;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.lb-btn.del{background:rgba(192,57,43,.75);border-color:rgba(192,57,43,.9)}

.tag.note-tag{background:var(--clay-tint);color:#8a6a60}

footer .foot-tools{display:inline-flex;gap:8px;margin-left:10px;vertical-align:middle}
.foot-btn{font-family:inherit;font-size:12px;color:var(--ink-soft);background:var(--surface-2);
  border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer}
.foot-btn:hover{background:var(--surface)}

.disclaimer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);
  font-size:13px;color:var(--ink-soft);line-height:1.7}

footer{padding:14px 22px;border-top:1px solid var(--line);font-size:12.5px;color:#A69E92;text-align:center}

/* ---------- Mobile two-stage ---------- */
@media(max-width:760px){
  .body{position:relative}
  .list{width:100%;border-right:none}
  .detail{display:none;position:absolute;inset:0;background:var(--bg);z-index:5}
  .app.stage-detail .list{display:none}
  .app.stage-detail .detail{display:block}
  /* 進入手術詳情時收起標題／搜尋／科別列,讓內容佔滿螢幕(更新提示仍保留) */
  .app.stage-detail header{padding:0;border-bottom:none}
  .app.stage-detail header .brand,
  .app.stage-detail header .search,
  .app.stage-detail header .chips{display:none}
  .app.stage-detail .upd{margin:0}
  .back{display:inline-flex}
  .back-bottom{display:flex}
  .d-summary{gap:16px}
  /* 手機閱讀強化:字再放大、行距加寬、觸控目標加大 */
  body{font-size:16.5px}
  h1{font-size:23px}
  .brand .sub{font-size:13px}
  .search input{font-size:17px;padding:13px 14px 13px 40px}
  .chip{font-size:14.5px;padding:8px 14px}
  .card .name{font-size:17px}
  .card .en{font-size:13px}
  .section h3{font-size:17px}
  .section li{font-size:16.5px;line-height:1.8}
  .flag-box h3{font-size:17px}
  .flag-box li{font-size:16.5px;line-height:1.8}
  .info-btn{font-size:13px;padding:3px 9px}
  .info-panel{font-size:15.5px;line-height:1.75}
  .d-title{font-size:24px}
  .d-title-zh{font-size:17px}
  .d-summary .item{font-size:15px}
  .refs-box li{font-size:14px;line-height:1.6}
  .disclaimer{font-size:13.5px;line-height:1.75}
  .note-ta{font-size:16.5px;min-height:130px}
  .note-btn{font-size:14px;padding:7px 15px}
  .ph-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .ph-warn{font-size:13px}
  .note-backup .bk-msg{font-size:14px}
}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:#CFC7B9;border-radius:6px}
.upd{display:none;align-items:center;justify-content:center;gap:8px;
  background:var(--sage);color:#fff;font-weight:600;font-size:15px;
  padding:11px 14px;border-radius:9px;margin-bottom:12px;cursor:pointer;
  text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.upd:active{opacity:.85}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div id="upd" class="upd" onclick="applyUpdate()">🔄 已有新版本 · 點擊立即更新</div>
    <div class="brand">
      <h1>各科手術全身麻醉快速查詢</h1>
      <span class="sub">Surgical GA Quick Reference</span>
    </div>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="搜尋手術名稱、科別或關鍵字…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="body">
    <div class="list" id="list"></div>
    <div class="detail" id="detail">
      <div class="placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6M12 9v6"/><circle cx="12" cy="12" r="9"/></svg>
        <div>從左側選擇一台手術<br>查看全身麻醉注意事項</div>
      </div>
    </div>
  </div>

  <footer>
    <span>臨床輔助工具 · 使用前請對照所屬機構protocol與最新指引</span>
    <span class="foot-tools">
      <button class="foot-btn" type="button" onclick="exportNotes()">匯出筆記</button>
      <button class="foot-btn" type="button" onclick="pickImportFile()">匯入筆記</button>
      <input id="impFile" type="file" accept="application/json,.json" hidden>
    </span>
  </footer>
</div>

    hemo:[
      "<b class='w'>CO₂ 灌注(capnothorax)→ 胸內壓上升、靜脈回流下降 → 低血壓、心輸出下降</b>;<b>右胸灌注時影響更明顯</b>(易壓迫右心房與腔靜脈)<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>為了把塌陷的肺推離術野、看得更清楚,外科會把 CO₂ 打進胸膜腔,形成人工氣胸(capnothorax)。胸膜腔平時是負壓,灌氣後變成正壓,會像從外面壓迫一樣把<b>心臟與大靜脈(腔靜脈)</b>壓扁 → 回到心臟的血變少(靜脈回流下降)→ 心輸出與血壓跟著掉。右胸的縱膈構造(右心房、上下腔靜脈)更貼近,所以<b>右側灌注時血壓掉得更兇</b>。處理原則:請外科<b>降低灌注壓與流速</b>、補充輸液、必要時給升壓劑;若嚴重,先暫停灌注讓壓力釋放。</span>",

    preop:[
      "<b>適應症決定風險屬性</b>:<b class='w'>阻塞型睡眠呼吸障礙(obstructive sleep-disordered breathing, oSDB)/阻塞型睡眠呼吸中止(OSA)</b>為最常見適應症;反覆扁桃腺炎則依 <b>Paradise criteria</b> 判定<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>Paradise criteria 用於界定『反覆咽扁桃腺炎嚴重族群』:一年內 ≥7 次、連續兩年每年 ≥5 次、或連續三年每年 ≥3 次發作,且僅採計有病歷紀錄者。臨床意義在於:以感染為適應症的孩子多半沒有睡眠呼吸障礙,圍術期呼吸風險相對低;以 oSDB/OSA 為適應症者才是鴉片敏感與呼吸不良事件的高風險族群。麻醉前分辨這兩類病人,是後續止痛與監測強度的第一個分岔點。</span>",
      "<b class='w'>OSA 嚴重度分層決定照護等級</b>:多項睡眠檢查(polysomnography, PSG)呈呼吸中止低通氣指數(AHI)≥10/hr 或 SpO₂ 最低值 <80% 屬重度;無 PSG 時可用夜間血氧與 McGill oximetry score 分層<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>PSG 是診斷金標準,但多數孩童術前拿不到。McGill oximetry score 只需一夜居家血氧紀錄,依去飽和事件的次數與最低血氧分為 1 到 4 級:分數愈高代表阻塞愈嚴重,與術後呼吸不良事件相關性良好。實務用法是『陽性結果有意義、陰性結果不能排除 OSA』——分數高即可直接視為高風險安排住院監測,分數正常仍須參考病史與共病。</span>",
      "術前口咽視診記錄<b>扁桃腺大小(Brodsky 0–4+ 分級)</b>與腺樣體阻塞程度,作為誘導期氣道塌陷與置放喉罩難易的預估;<b class='w'>但扁桃腺大小與 OSA 嚴重度僅弱相關,不能用來排除 OSA</b><button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>Brodsky 分級以扁桃腺佔口咽橫向寬度的比例分為五級:0 為完全在扁桃腺柱內、1+ 佔不到 25%、2+ 佔 26–50%、3+ 佔 51–75%、4+ 超過 75%。對麻醉的意義在於<b>空間</b>:4+ 的孩子誘導期更容易塌陷、喉罩不易置放、口張器撐開後術野與導管都更擁擠。但系統性回顧顯示扁桃腺大小與睡眠檢查所測的嚴重度只有弱相關,病史與理學檢查(打鼾、目擊呼吸暫停)敏感度與特異度也互有長短,因此扁桃腺小不代表沒有 OSA。</span>",
      "<b>術前安排多項睡眠檢查(PSG)的對象</b>:年齡 <2–3 歲、肥胖、唐氏症、顱顏異常、神經肌肉疾病、鐮刀型貧血、黏多醣症 → 目的在確立嚴重度以規劃圍術期照護;<b class='w'>極重度 OSA(AHI ≥24/hr、快速動眼期 AHI ≥60/hr 或 SpO₂ 最低值 <70%)、困難氣道、明顯心臟疾病或當下上呼吸道感染者,宜安排於具小兒加護能力的院所</b><button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>PSG 對麻醉的價值不在『能不能開刀』,而在<b>把風險量化</b>:嚴重度(尤其最低血氧)直接對應鴉片敏感度、術後呼吸不良事件機率與監測強度,也提供日後追蹤的基準值。回顧性研究顯示,術前資料(嚴重度指標與共病)可用來預測術後嚴重呼吸事件、協助判斷是否需要加護觀察。反之,若拿不到 PSG,就應以最保守的方式處理:當作重度看待、鴉片減量、安排住院監測。</span>",
      "<b class='w'>高風險族群</b>:年齡 <3 歲、肥胖、生長遲滯、顱顏或基因症候群(如唐氏症)、神經肌肉疾病、先天性心臟病、血液疾病 → 圍術期呼吸不良事件(perioperative respiratory adverse events, PRAE)風險上升,宜由經驗豐富之小兒麻醉人員照護並安排住院觀察",
      "<b class='w'>近期上呼吸道感染(URI)</b>使氣道高反應性上升 → 擇期手術建議於症狀緩解後延後二至四週;僅重度氣道阻塞或抗生素無效之慢性扁桃腺炎為例外",
      "<b class='w'>術前抗焦慮藥宜盡量避免</b>:手術時間短,midazolam 等藥物的殘餘鎮靜可延續到術後,對 OSA 孩童尤其危險 → 優先以家屬陪同、影音與玩具分散注意力;若仍給予,須全程接續脈搏血氧監測",
      "高風險者可考慮<b>術前吸入短效乙二型交感神經作用劑(short-acting beta-2 agonist, SABA;如 salbutamol 200 mcg)</b>:對象為中重度 OSA、兩週內上呼吸道感染、氣喘或異位性體質、二手菸暴露者<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>一項納入約 480 名兒童的隨機對照試驗(REACT)顯示,扁桃腺手術前單劑吸入 salbutamol 可降低喉痙攣、嚴重咳嗽與血氧下降的發生率,效益主要集中在中重度 OSA 的孩子。除支氣管擴張外,它也抑制肥大細胞釋放發炎介質並減少咳嗽反射。單劑使用安全性佳,是低成本的預防手段;但恢復室停留時間並未縮短,臨床重要性仍有討論空間。</span>",
      "<b class='w'>出血傾向與貧血屬相對禁忌</b>:中重度貧血(血紅素 <9–10 g/dL)先矯正病因;已知或疑似 von Willebrand 病、血友病、鐮刀型貧血須先會診小兒血液科。無個人或家族出血病史之健康孩童不需常規凝血篩檢",
      "<b>特定疾病需個別化準備</b>:<b class='w'>鐮刀型貧血</b>(圍術期急性胸症候群風險)、<b class='w'>唐氏症</b>(先評估甲狀腺功能;寰樞椎不穩定)、<b class='w'>黏多醣症</b>(困難氣道合併心肺功能異常)、顱顏症候群與神經肌肉疾病(多部位阻塞、可能合併換氣不足)<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>這幾類孩子的共同特徵是<b>阻塞不只發生在扁桃腺與腺樣體一個地方</b>,因此手術後 OSA 常無法完全解決,圍術期呼吸不良事件也較多。個別重點:鐮刀型貧血須注意脫水、低血氧、低體溫與疼痛都可能誘發鐮刀化與急性胸症候群,輸血與輸液計畫應事先與血液科討論;唐氏症除甲狀腺功能外,擺位時要避免頸部過度伸展;黏多醣症的組織堆積使面罩通氣與插管都可能困難,且常合併瓣膜與肺部病變,應備困難氣道設備與有經驗的人力。</span>",
      "腺樣體切除的特殊禁忌:<b class='w'>顯性或黏膜下顎裂、懸壅垂分裂(bifid uvula)、短顎、咽腔過寬、顎部神經肌肉功能異常</b><button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>腺樣體本身填補了鼻咽的空隙,協助軟顎在發某些子音時貼上咽後壁。若病人本來就有顎部結構或功能缺陷,切除腺樣體會讓這道『門』關不緊,造成顎咽閉鎖不全與開放性鼻音(hypernasality),且不易回復。懸壅垂分裂、軟顎正中線變寬變薄、硬軟顎交界可觸及 V 形凹陷,都是黏膜下顎裂的線索,術前口咽視診與觸診應例行檢查。</span>"
    ],
    airway:[
      "<b>誘導方式依風險決定</b>:無重度 OSA 的幼童(約 6 歲以下)可用 sevoflurane 吸入誘導;<b class='w'>重度 OSA、多重呼吸不良事件危險因子、或 12 歲以上及體重 >50 kg 者優先靜脈誘導(propofol)</b>,若必須吸入誘導,誘導後應儘速建立靜脈通路<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>吸入麻醉劑會降低咽部肌張力、提高氣道關閉壓,並打亂上呼吸道肌肉與橫膈的協調;加上全身麻醉使肺容積下降、縱膈上移而減少上呼吸道的縱向張力,在放置氣道裝置之前就可能塌陷。這些效應在 OSA 與顱顏異常的孩子身上更明顯。靜脈通路的另一個價值是能立刻給救援藥物(atropine、adrenaline、肌肉鬆弛劑),而靜脈藥物也能更快達到足以操作氣道的深度。</span>",
      "<b class='w'>共用氣道</b>:與外科團隊共用口咽術野,麻醉端遠離病人頭側;氣道裝置置於<b>正中線</b>,並在放置口張器<b>之前</b>固定於下顎",
      "<b>裝置首選有囊氣管內管(cuffed ETT)</b>:以 <b>oral RAE</b>(預彎、不易在口角處扭折)或加強型導管為佳;可彎式喉罩是替代方案,但術中改插氣管內管的比率約 4–17%<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>有囊導管的好處是密封氣管、擋住血液與分泌物、減少高濃度氧與揮發性氣體外漏到術野,且佔口腔空間小、術野較好。喉罩對氣道刺激較小、甦醒較平順,但體積大、在口張器撐開時可能扭折或移位,扁桃腺特別肥大者甚至放不進去。若要使用喉罩,外科、麻醉與恢復室三方必須事先有共識並準備好隨時改插管。</span>",
      "<b class='w'>電燒 + 高濃度氧 + 共用氣道 = 氣道起火的三要素</b> → 維持吸入氧濃度約 21–30%,確保囊袋密封、避免氧氣往咽部外漏<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>手術室火災需要三個條件同時存在:氧化劑(高濃度氧、笑氣)、點火源(電燒、雷射)與燃料(導管、紗布、組織)。共用氣道手術剛好把三者聚在同一個小空間。預防作法是把吸入氧濃度降到能維持血氧的最低值、使用有囊導管防止氧氣外漏、並在電燒前讓術野的氧氣先散去。</span>",
      "<b class='w'>口張器撐開的瞬間是關鍵風險點</b>:可壓迫、扭折、推入或拉出氣管內管 → 撐開後立即重新確認雙側呼吸音、氣道壓與二氧化碳波形<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>口張器的舌板會把舌根與導管一起往下壓。頸部同時被伸展時,導管相對往下移,最常見的後果是<b>單側支氣管插管</b>(通常是右側),表現為氣道壓上升、單側呼吸音減弱、血氧下降;反之若導管被帶出,則是漏氣與二氧化碳波形消失。每次口張器置入、調整或病人頭位改變後都重新確認一次,是最省力的預防。</span>",
      "腺樣體肥大者鼻通氣受阻、面罩通氣可能困難;誘導期上呼吸道易塌陷 → 早期置入口咽通氣道並給予 CPAP 支持",
      "<b>OSA 孩童對麻醉藥所致上呼吸道肌張力下降特別敏感</b> → 誘導與甦醒兩端都是阻塞高峰,而非只有拔管當下"
    ],
    monitor:[
      "標準 ASA 基本監測;<b class='w'>失血因吞入而被低估</b> → 綜合吸引瓶、紗布與心搏、血壓、灌流變化判斷",
      "體溫監測與主動保溫;體重小者散熱快"
    ],
    hemo:[
      "多數健康孩童血行動力學穩定;重度 OSA 長期間歇性低血氧者可能已有<b class='w'>肺動脈高壓與右心負荷</b> → 誘導期避免低血氧、高碳酸血症與酸血症等升高肺血管阻力的因素<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>反覆夜間缺氧會造成肺血管收縮,長期下來形成肺動脈高壓,嚴重者出現右心室肥厚。這類孩子在誘導或甦醒期一旦缺氧、二氧化碳蓄積或酸血症,肺血管阻力會急速上升,右心輸出下降而導致循環惡化。臨床線索包括發育遲緩、長期張口呼吸、夜間明顯呼吸暫停,必要時術前安排心臟超音波。</span>",
      "禁食後容量偏低加上吞入失血 → 適度靜脈補液,同時兼顧術後噁心嘔吐與早期恢復口服"
    ],
    intraop:[
      "體位為肩下墊枕、頸部伸展(Rose position);與外科團隊確認口張器位置與導管未受壓,並注意口角、牙齒與眼睛保護",
      "<b class='w'>唐氏症孩童常有無症狀的寰樞椎不穩定</b> → 擺位與插管避免過度頸部伸展;頸部伸展本身也會使導管相對移位,小小孩甚至意外脫管",
      "<b class='w'>口張器撐開前務必達到足夠麻醉深度</b>:撐開是突然的強烈刺激,深度不足會出現體動、屏氣、嗆咳甚至喉痙攣",
      "<b>被膜內部分切除(tonsillotomy / intracapsular tonsillectomy)</b>相較傳統全切除,術後疼痛與出血較少,但殘留組織有復發可能 → 術式影響術後止痛與出血衛教<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>全切除是把扁桃腺連同被膜整個剝離,傷口直接暴露在咽部肌肉層,痛感與出血風險較高;部分切除只削去阻塞氣道的多餘組織,留下被膜作為保護層,對阻塞型睡眠呼吸障礙的效果相近而恢復較快。以感染為適應症時仍以全切除為主,因為殘留組織可能再度發炎。近年統合分析顯示部分切除的術後出血率較低(約 0.9% 對 2.9%),恢復正常飲食與停止止痛藥的時間也較短,但組織再生與再次手術的比率明顯較高(再生約 10.8% 對 1.6%、再手術約 5.1% 對 0.3%),四歲以下尤其明顯。麻醉前得知術式,有助於預估止痛需求與出血風險。</span>",
      "止血後經口放置胃管抽吸胃內積血,可減少術後嘔吐",
      "維持以吸入麻醉(sevoflurane)為主即可;<b>PONV 高風險或病史明顯者可改採 propofol–remifentanil 全靜脈麻醉(TIVA)</b>,remifentanil 作用超短,對重度 OSA 者較不會遺留呼吸抑制",
      "<b>單純腺樣體切除</b>時間更短、疼痛較輕、氣道處置相對單純,可使用喉罩,術後多以 paracetamol 與 NSAID 即足夠,通常不需鴉片"
    ],
    drug:[
      "<b class='w'>鴉片減量、以多模式止痛為核心</b>:重度 OSA 孩童對鴉片誘發的呼吸抑制敏感度上升,起始劑量宜減半並小量滴定<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>長期間歇性低血氧會改變中樞鴉片受體的表現與呼吸驅動的化學敏感度,使同樣劑量的嗎啡在重度 OSA 孩童身上產生更強的呼吸抑制。實務作法是把鴉片當『救援用藥』而非常規排程:先給足非鴉片類止痛,必要時以小劑量分次滴定,並在給藥後延長觀察。同時盡量避免會加重上呼吸道肌肉鬆弛的藥物,即所謂『咽部保留』的用藥策略。</span>",
      "<b>基礎止痛組合(PROSPECT 建議):paracetamol(乙醯胺酚)+ 非類固醇消炎止痛藥(NSAID)+ 單劑靜脈 dexamethasone</b>,鴉片僅作救援<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>過去擔心 NSAID 抑制血小板會增加術後出血,但系統性回顧與現行指引並不支持因此全面禁用;ibuprofen 在兒童扁桃腺術後可安全使用,且能明顯減少鴉片需求。做法上以定時給藥為主(而非等痛才給),術後前幾天規律服用效果最好。若個別病人有出血傾向或外科團隊有特殊考量,再個別調整。</span>",
      "<b class='w'>兒童扁桃腺術後禁用 codeine(可待因);tramadol 亦應避免</b> → CYP2D6 超快代謝者可產生致死性呼吸抑制<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>codeine 本身幾乎沒有止痛活性,需經肝臟 CYP2D6 轉換為嗎啡才生效。此酵素活性個體差異極大:超快代謝者會在短時間內產生遠超預期的嗎啡濃度,已有兒童扁桃腺術後死亡案例,主管機關因此發出禁用警示。tramadol 走同一條代謝路徑,風險相同。改以 paracetamol、NSAID 為主,必要時用可直接滴定的嗎啡類藥物。</span>",
      "<b>單劑術中靜脈 dexamethasone</b>(實務常用 0.1–0.5 mg/kg;試驗劑量範圍約 0.15–1 mg/kg):減輕疼痛與腫脹、縮短恢復進食時間並降低嘔吐;<b class='w'>疑似扁桃腺惡性腫瘤者不給</b>(腫瘤溶解與高血鉀風險)<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>減少嘔吐的效果在多篇隨機試驗與統合分析中一致。出血疑慮源自一項因術後出血增加而提前中止的隨機試驗;之後多篇統合分析並未發現顯著增加,但那些研究多半不是為了偵測出血而設計,也少有正式篩檢,因此無法完全排除風險上升的可能。權衡之下,現行指引仍建議常規給予單劑。</span>",
      "<b>插管仍以肌肉鬆弛劑為主(本院作法)</b>:手術本身不需維持肌鬆,但以 <b>rocuronium</b> 插管可取得穩定的插管條件、減少嗆咳與喉部創傷;手術時間短,<b class='w'>拔管前務必確認肌力完全恢復,必要時以 sugammadex 逆轉</b><button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>扁桃腺手術常在 30 分鐘內結束,非去極化肌鬆劑的作用時間可能長於手術本身,殘餘肌鬆會讓上呼吸道肌肉張力不足,對本來就容易塌陷的 OSA 孩童特別不利。因此重點不在該不該給肌鬆,而在<b>離開手術室前的逆轉與確認</b>:以神經肌肉監測確認恢復,必要時給 sugammadex,並在氣道保護反射完全恢復後才拔管。</span>",
      "<b>NSAID 的給藥時機</b>:術中多延到外科團隊確認止血後再給,或事先與外科團隊討論;ketorolac 對術後出血的影響證據不一致,選擇性 COX-2 抑制劑(celecoxib、parecoxib)在常用劑量不影響血小板功能,觀察性資料未見出血增加",
      "<b class='w'>兒童 NSAID 使用注意</b>:ibuprofen 未滿三個月不建議使用,三至六個月僅限單次;常用 10 mg/kg 每 6 小時(單次上限 400 mg,每日上限 40 mg/kg 或 2400 mg);ketorolac 一般用於六個月以上,0.5 mg/kg 靜脈、單次上限 30 mg<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>小小孩用 NSAID 要多看三件事:一是<b>年齡與腎臟成熟度</b>,月齡太小者藥物清除與腎血流自我調節能力有限;二是<b>脫水</b>,扁桃腺術後吞嚥痛常導致喝水不足,低血容加上 NSAID 會提高急性腎損傷風險,務必先確保口服補液;三是<b>氣喘與鼻息肉病史</b>,少數孩子屬阿斯匹靈加重呼吸道疾病,首次使用宜留意。此外脫水、腎功能不良、已知出血傾向者應個別評估或改用其他止痛方式。</span>",
      "<b>常用術中劑量參考</b>(須依機構規範核對):paracetamol 15 mg/kg 靜脈或口服;fentanyl 0.5–1 mcg/kg 或 morphine 0.05–0.1 mg/kg(OSA 減半);dexmedetomidine 0.5 mcg/kg;ketamine 0.5 mg/kg(上限 30 mg)",
      "<b>仍具爭議的選項</b>:methadone 等長效鴉片有隨機試驗顯示可減少術後一週的鴉片用量,但試驗排除重度 OSA 且未評估安全性結果,返家後的呼吸抑制風險未明;扁桃腺窩局部麻醉浸潤可減痛,卻有感染、氣道受損與局部麻醉劑全身毒性(心律不整、心跳停止)的個案報告",
      "第二線輔助:ketamine、dexmedetomidine、gabapentinoid;dexmedetomidine 兼具鎮靜、減少鴉片需求與降低甦醒躁動",
      "<b class='w'>術後噁心嘔吐(PONV)風險高</b>(吞血 + 咽部刺激):未預防者約六至七成發生,常規預防可降到約兩成五以下 → dexamethasone + 血清素受體拮抗劑(ondansetron 0.1 mg/kg 靜脈,常見上限 4 mg);<b class='w'>OSA 孩童避免 promethazine</b>(鎮靜與呼吸抑制)"
    ],
    emergence:[
      "<b class='w'>甦醒期為喉痙攣與氣道阻塞高峰</b>:咽部積血與分泌物是主要刺激源 → 拔管前徹底抽吸咽部、以胃管抽空胃內積血,並與外科團隊確認止血<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 喉痙攣處置</button><span class='info-panel' hidden>辨識:吸氣性喘鳴、氣管牽引與胸腹反常運動。立即處置為移除刺激(停止操作、抽吸分泌物),給 100% 氧氣併持續正壓,合併下顎推前、頸部伸展、張口,必要時置入口咽通氣道,並可壓迫喉痙攣凹(Larson 手法,位於乳突、下顎枝與顱底之間)。仍有部分氣流時可加深麻醉(propofol 約誘導劑量的兩成);完全阻塞則求援並給肌肉鬆弛劑打斷痙攣(本院以 rocuronium 為主,插管劑量 1.2 mg/kg,備 sugammadex 逆轉),伴心搏過緩時給 atropine 0.02 mg/kg。</span>",
      "<b>多數建議清醒拔管</b>(氣道張力與保護反射已恢復),<b class='w'>顱顏異常與重度 OSA 者尤然</b>;支氣管痙攣風險高或須避免嗆咳者才考慮深麻醉拔管,關鍵是<b class='w'>不要停在半清醒的中間階段</b><button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>喉罩通常在深麻醉下移除,但氣道有血液、分泌物多、OSA 或解剖性阻塞者宜等清醒後移除。一項納入近 300 名至少具一項呼吸危險因子孩童的隨機對照試驗顯示,深麻醉與清醒移除喉罩在整體呼吸不良事件上差異不大,但深麻醉移除組的事件仍偏多。無論何種時機,都需要有人守著、能立即做下顎推前與置入通氣道。</span>",
      "恢復採側臥、頭略低的<b>扁桃腺姿(tonsil position)</b>,利血液與分泌物向外引流",
      "sevoflurane 麻醉後兒童常見<b>甦醒躁動</b> → 適度止痛加上 propofol 或 dexmedetomidine 可減少;<b class='w'>先與疼痛區分</b>,並排除低血氧、低血壓、二氧化碳過高或過低、低體溫、低血糖與顱內壓上升",
      "由熟悉基本氣道處置(下顎推前、口/鼻咽通氣道)的人員照護到完全清醒;轉送恢復室途中給予面罩或鼻導管氧氣"
    ],
    postop:[
      "<b class='w'>術後 12–24 小時是重大呼吸不良事件最脆弱的時段</b> → 監測過度鎮靜與呼吸抑制,並確實衛教病房人員與家屬",
      "<b>住院過夜的建議對象</b>:年齡 <3 歲、<b class='w'>體重 <18 kg</b>、重度 OSA(AHI ≥10/hr 或 SpO₂ 最低值 <80%)、唐氏症等共病與氣道異常、或返家後就醫不便者<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>多數扁桃腺手術以日間手術完成,術後數小時返家。回顧性資料顯示體重未滿 18 公斤是術後早期呼吸衰竭(非計畫性轉入加護單位或需要呼吸支持)的獨立危險因子,與年齡小、氣道口徑小、代償空間有限一致。判斷是否留院時,除了 OSA 嚴重度,也要一併考慮體型、共病與家庭就醫的可近性。</span>",
      "疼痛常持續七至十天且吞嚥時最劇 → 規律定時 paracetamol 加 NSAID、鼓勵飲水;<b class='w'>疼痛致脫水是常見再入院原因</b>",
      "出院前確認可耐受口服、疼痛可控、無活動性出血,並教導家屬辨識吐鮮血與反覆吞嚥動作",
      "<b>鼓勵早期恢復口服與充足水分</b>(與疼痛較輕相關);<b>不需常規預防性抗生素</b>,對術後結果無幫助",
      "<b class='w'>手術不等於治癒:術後 OSA 可能殘留或復發</b> → 事先向家屬說明;高風險者(術前重度 OSA、嚴重肥胖、唐氏症、顱顏或神經肌肉疾病)術後三個月以上宜追蹤睡眠檢查<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>一般健康孩童手術後多數睡眠檢查明顯改善,但肥胖、術前嚴重度高、唐氏症、顱顏或神經肌肉疾病者常有殘留 OSA;唐氏症族群約半數以上需要後續治療。殘留 OSA 的處理包括正壓呼吸器,或先以藥物誘導睡眠內視鏡(drug-induced sleep endoscopy, DISE)找出阻塞部位再做針對性手術。對麻醉的意義是:這些孩子日後可能再回到手術室——DISE 需要在保留自主呼吸的鎮靜下進行,後續的舌根、咽側壁或上呼吸道多階段手術則屬更高難度的共用氣道麻醉。</span>",
      "家中已使用正壓呼吸器者請攜帶自用機器與面罩;共病較多的孩子,術後短期以 CPAP／BPAP 支持氣道是可行選項"
    ],
    flags:[
      "術後出血(原發性約 0.2–2.2%、續發性約 0.1–3%):原發性 <24 小時、續發性多在術後 5–10 天 → 飽胃、低血容、視野被血遮蔽之高風險急診麻醉<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>出血的孩子往往已吞下大量血液:外觀失血被低估,同時等同飽胃;組織腫脹加上口咽積血,即使前一次插管順利,這次也可能變困難。原則是<b>先復甦、後誘導</b>——建立靜脈通路、輸液或輸血矯正低血容,檢驗血紅素與凝血,並回顧前次麻醉紀錄的氣道資訊。器械備兩份(喉頭鏡、附管芯的有囊導管多種尺寸、兩支吸引管),請人力支援。預給氧採側臥頭低位讓血液外流,再轉為仰臥執行快速順序誘導:誘導藥減量(propofol 1–2 mg/kg、ketamine 1–2 mg/kg 或 etomidate 0.2 mg/kg),隨即 atropine 0.02 mg/kg 加 <b>rocuronium 1.2 mg/kg</b>(備 sugammadex)。回顧資料顯示低血氧是最常見的不良事件(約一成),且發生在拔管與甦醒期的次數是誘導期的兩倍,因此務必完全清醒、肌鬆完全反轉,並在側臥或坐姿下拔管。</span>",
      "氣道起火(電燒合併高濃度氧外漏)",
      "喉痙攣;負壓性肺水腫",
      "鴉片相關呼吸抑制(重度 OSA、CYP2D6 超快代謝者風險最高)",
      "口張器致氣管內管壓迫、扭折、單側支氣管插管或脫出",
      "腺樣體切除後顎咽閉鎖不全與開放性鼻音",
      "脫水與再入院;罕見:寰樞椎旋轉半脫位(Grisel syndrome)、牙齒或顳顎關節損傷"

  {
    specialty:"耳鼻喉科",
    name:"鼻部手術(鼻竇/鼻中膈/鼻整形)",

    summary:{ position:"Supine · reverse Trendelenburg 10–15° (head-up)", posType:"revtrend", time:"0.5–2 hr", blood:"少–中", airway:"GA / oral RAE 或 flexible LMA・共用氣道・throat pack" },
    preop:[
      "常見<b>慢性鼻竇炎(chronic rhinosinusitis)</b>合併<b class='w'>下呼吸道發炎</b>:高達三分之二病人併氣喘/COPD/支氣管擴張 → 評估並優化氣道反應性<button class='info-btn' type='button' aria-expanded='false' onclick='toggleInfo(this)'>ⓘ 說明</button><span class='info-panel' hidden>上下呼吸道為連續一體(『同一氣道』概念),鼻竇黏膜慢性發炎常伴支氣管高反應性。術前若氣喘控制不佳,誘導與拔管期較易支氣管痙攣;宜延續吸入型類固醇/支氣管擴張劑,並評估近期發作與用藥。</span>",
      "<b class='w'>阿斯匹靈加重呼吸道疾病(AERD;鼻息肉 + 氣喘 + NSAID 敏感)</b> → 避免非類固醇消炎止痛藥(NSAID)",
      "評估出血傾向與抗凝/抗血小板用藥;鼻息肉、青少年血管纖維瘤(juvenile angiofibroma)等血管性病灶術前備血"
    ],
    airway:[

/* ============================================================
   個人筆記 / 擺位照片
   ------------------------------------------------------------
   資料只存在「使用者自己這台裝置的這個瀏覽器」裡(IndexedDB;
   不支援時退回 localStorage,僅存文字)。GitHub Pages 是純靜態
   網站、沒有後端,所以筆記不會上傳、不會同步、也不會被其他人
   看到。要分享或備份,用頁尾的「匯出筆記 / 匯入筆記」。

     可用匯出檔找回)。要改 en 時請一併提醒使用者。
   ============================================================ */
const NOTE_DB = "ga-quickref-notes", NOTE_STORE = "notes", LS_KEY = "ga-quickref-notes-fallback";
let NOTES = {};            /* key -> {text, photos:[{id,src,cap,ts}], ts} */
let noteTimer = null, lbState = null;

/* 備份提醒:META 與筆記存在同一個 store,用保留鍵區隔(手術 en 不可能等於此字串) */
const META_KEY = "__meta__", META_LS = "ga-quickref-meta";
const BACKUP_DUE_MS = 30 * 24 * 60 * 60 * 1000;   /* 距上次匯出超過 30 天才提醒 */
const BACKUP_SNOOZE_MS = 7 * 24 * 60 * 60 * 1000; /* 按「之後再說」暫停 7 天 */
let META = { lastExport: 0, snoozeUntil: 0 };

function noteKey(s){ return String(s.en || s.name || "").trim().toLowerCase().replace(/\s+/g," "); }
function blankNote(){ return { text:"", photos:[], ts:0 }; }
function getNote(s){ return NOTES[noteKey(s)] || blankNote(); }
function hasNote(s){ const n = NOTES[noteKey(s)]; return !!(n && (n.text.trim() || n.photos.length)); }

/* ---------- 儲存層 ---------- */
let idbFailed = false;
function idb(){
  return new Promise((res, rej)=>{
    if(idbFailed || !window.indexedDB) return rej(new Error("no-idb"));
    const r = indexedDB.open(NOTE_DB, 1);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(NOTE_STORE)) db.createObjectStore(NOTE_STORE);
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror   = () => { idbFailed = true; rej(r.error || new Error("idb-open")); };
  });
}
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); }catch(e){ return {}; } }
function lsWrite(obj){
  try{
    /* localStorage 容量小(約 5MB),備援模式只保留文字,照片不寫入 */
    const slim = {};
    Object.keys(obj).forEach(k => {
      if(k === META_KEY) return;
      slim[k] = { text: obj[k].text, photos: [], ts: obj[k].ts };
    });
    localStorage.setItem(LS_KEY, JSON.stringify(slim));
  }catch(e){}
}

async function storeLoad(){
  try{
    const db = await idb();
    const out = await new Promise((res, rej)=>{
      const tx = db.transaction(NOTE_STORE, "readonly").objectStore(NOTE_STORE);
      const acc = {};
      const cur = tx.openCursor();
      cur.onsuccess = e => {
        const c = e.target.result;
        if(c){ acc[c.key] = c.value; c.continue(); } else res(acc);
      };
      cur.onerror = () => rej(cur.error);
    });
    return out;
  }catch(e){ return lsRead(); }
}
async function storePut(key, val){
  try{
    const db = await idb();
    await new Promise((res, rej)=>{
      const tx = db.transaction(NOTE_STORE, "readwrite");
      tx.objectStore(NOTE_STORE).put(val, key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }catch(e){ lsWrite(NOTES); throw e; }
}
async function storeDel(key){
  try{
    const db = await idb();
    await new Promise((res, rej)=>{
      const tx = db.transaction(NOTE_STORE, "readwrite");
      tx.objectStore(NOTE_STORE).delete(key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }catch(e){ lsWrite(NOTES); }
}

async function saveMeta(){
  try{ localStorage.setItem(META_LS, JSON.stringify(META)); }catch(e){}
  try{ await storePut(META_KEY, META); }catch(e){}
}
function loadMetaFallback(){
  try{ return JSON.parse(localStorage.getItem(META_LS) || "null"); }catch(e){ return null; }
}

/* 是否該提醒備份:有「上次匯出之後才改動過」的筆記,且距離參考時點超過 30 天。
   從未匯出過的人,以最早一筆筆記的時間當參考時點,不會一寫完就跳提醒。 */
function backupDue(){
  const keys = Object.keys(NOTES);
  if(!keys.length) return false;
  if(Date.now() < (META.snoozeUntil || 0)) return false;
  const stamps = keys.map(k => NOTES[k].ts || 0);
  const newest = Math.max.apply(null, stamps);
  if(newest <= (META.lastExport || 0)) return false;   /* 匯出後沒再改過,不用吵 */
  const ref = META.lastExport || Math.min.apply(null, stamps);
  return (Date.now() - ref) > BACKUP_DUE_MS;
}
function daysSince(ts){ return Math.floor((Date.now() - ts) / 86400000); }
function backupBannerHtml(){
  if(!backupDue()) return "";
  const msg = META.lastExport
    ? `距離上次匯出已經 ${daysSince(META.lastExport)} 天,期間筆記有新增或修改。`
    : `這裡的筆記已經累積 ${daysSince(Math.min.apply(null, Object.keys(NOTES).map(k => NOTES[k].ts || Date.now())))} 天,還沒備份過。`;
  return `
      <div class="note-backup" id="backupBanner">
        <div class="bk-msg">💾 ${msg}筆記只存在這台裝置,清除瀏覽器資料或換裝置就會消失,建議匯出一份留存。</div>
        <div class="bk-row">
          <button class="note-btn" type="button" onclick="exportNotes()">立即匯出備份</button>
          <button class="note-btn ghost" type="button" onclick="snoozeBackup()">之後再說</button>
        </div>
      </div>`;
}
function snoozeBackup(){
  META.snoozeUntil = Date.now() + BACKUP_SNOOZE_MS;
  saveMeta();
  const b = el("backupBanner"); if(b) b.remove();
}
function refreshBackupBanner(){
  const b = el("backupBanner");
  if(!backupDue()){ if(b) b.remove(); return; }

}

/* 要求瀏覽器不要在空間不足時自動清掉這些資料(iOS 建議另存到主畫面) */
function askPersist(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}

async function saveNote(key, note, statusMsg){
  note.ts = Date.now();
  if(!note.text.trim() && !note.photos.length){
    delete NOTES[key];
    await storeDel(key);
  }else{
    NOTES[key] = note;
    try{ await storePut(key, note); }
    catch(e){
      setNoteStatus("儲存失敗(裝置空間不足或瀏覽器限制)", true);
      return false;
    }
  }
  setNoteStatus(statusMsg || ("已儲存 · " + new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})));
  renderList();
  return true;
}
function setNoteStatus(msg, isErr){
  const st = el("noteStatus"); if(!st) return;
  st.textContent = msg;
  st.style.color = isErr ? "var(--warn)" : "var(--ink-soft)";
}

/* ---------- 照片處理:上傳前縮圖壓縮,避免佔滿裝置空間 ---------- */
const PH_MAX_EDGE = 1600, PH_QUALITY = 0.72;
async function compressImage(file){
  let w, h, draw;
  if(window.createImageBitmap){
    const bmp = await createImageBitmap(file, { imageOrientation:"from-image" });
    w = bmp.width; h = bmp.height; draw = bmp;
  }else{
    draw = await new Promise((res, rej)=>{
      const fr = new FileReader();
      fr.onload = () => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = fr.result; };
      fr.onerror = rej; fr.readAsDataURL(file);
    });
    w = draw.naturalWidth; h = draw.naturalHeight;
  }
  const sc = Math.min(1, PH_MAX_EDGE / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
  const cv = document.createElement("canvas");
  cv.width = cw; cv.height = ch;
  cv.getContext("2d").drawImage(draw, 0, 0, cw, ch);
  if(draw.close) draw.close();
  return cv.toDataURL("image/jpeg", PH_QUALITY);
}

async function addPhotos(input){
  const files = Array.from(input.files || []).filter(f => /^image\//.test(f.type));
  input.value = "";
  if(!files.length || activeId == null) return;
  const s = SURGERIES[activeId], key = noteKey(s), note = getNote(s);
  note.photos = note.photos.slice();
  setNoteStatus("處理照片中…");
  for(const f of files){
    try{
      const src = await compressImage(f);
      note.photos.push({ id: "p" + Date.now() + Math.random().toString(36).slice(2,7), src, cap:"", ts: Date.now() });
    }catch(e){ setNoteStatus("有照片無法讀取,已略過", true); }
  }
  askPersist();
  const ok = await saveNote(key, note, "照片已儲存");
  if(ok) renderPhotos();
}

}

function bindNoteBox(s){
  const ta = el("noteTa"); if(!ta) return;
  const key = noteKey(s);
  ta.addEventListener("input", () => {
    setNoteStatus("編輯中…");

    noteTimer = setTimeout(() => {
      const n = getNote(s); n.text = ta.value; askPersist(); saveNote(key, n);
    }, 700);
  });
  ta.addEventListener("blur", () => {

  });

    if(!confirm("確定清除這台手術的所有筆記與照片?此動作無法復原。")) return;

    await storeDel(key);

}

/* ---------- 匯出 / 匯入(備份與同事分享) ---------- */
function exportNotes(){
  const keys = Object.keys(NOTES);
  if(!keys.length){ alert("目前沒有任何筆記可以匯出。"); return; }
  const payload = { app:"surgical-ga-quickref", type:"notes-backup", version:1, exportedAt:new Date().toISOString(), notes:NOTES };
  const blob = new Blob([JSON.stringify(payload)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ga-quickref-notes-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  META.lastExport = Date.now();
  META.snoozeUntil = 0;
  saveMeta();
  const b = el("backupBanner"); if(b) b.remove();
  setNoteStatus("已匯出備份 · " + new Date().toLocaleDateString("zh-TW"));
}
function pickImportFile(){ el("impFile").click(); }
async function importNotes(file){
  try{
    const txt = await file.text();
    const data = JSON.parse(txt);
    const incoming = (data && data.notes && typeof data.notes === "object") ? data.notes : null;
    if(!incoming) throw new Error("format");
    const n = Object.keys(incoming).length;
    if(!n){ alert("這個檔案裡沒有筆記。"); return; }
    if(!confirm("將匯入 " + n + " 台手術的筆記。\n\n同一台手術若已有筆記,匯入的內容會接在後面、照片會合併,不會覆蓋既有內容。要繼續嗎?")) return;
    for(const key of Object.keys(incoming)){
      const inc = incoming[key] || {};
      const cur = NOTES[key] || blankNote();
      const incText = String(inc.text || "").trim();
      const merged = blankNote();
      merged.text = cur.text.trim() && incText
        ? cur.text.trim() + "\n\n— 匯入的筆記 —\n" + incText
        : (cur.text.trim() || incText);
      const seen = new Set(cur.photos.map(p => p.src));
      merged.photos = cur.photos.concat((inc.photos || []).filter(p => p && p.src && !seen.has(p.src)));
      NOTES[key] = merged;
      await saveNote(key, merged, "");
    }
    alert("匯入完成。");
    if(activeId != null) showDetail(activeId); else renderList();
  }catch(e){
    alert("匯入失敗:這不是本工具匯出的筆記檔,或檔案已損毀。");
  }
}

async function initNotes(){
  const all = await storeLoad();
  const meta = all[META_KEY] || loadMetaFallback();
  if(meta) META = { lastExport: meta.lastExport || 0, snoozeUntil: meta.snoozeUntil || 0 };
  delete all[META_KEY];
  NOTES = all;
  Object.keys(NOTES).forEach(k => {
    const n = NOTES[k] || {};
    NOTES[k] = { text: String(n.text || ""), photos: Array.isArray(n.photos) ? n.photos : [], ts: n.ts || 0 };
  });
  renderList();
  if(activeId != null) showDetail(activeId);
}

function renderChips(){

    `<button class="chip" data-sp="${sp}" aria-pressed="${sp===activeSpec}">${sp}</button>`
  ).join("");

    c.onclick = () => { activeSpec = c.dataset.sp; renderChips(); renderList(); };
  });
}

function matches(s, q){
  if(!q) return true;
  const n = NOTES[noteKey(s)];
  const hay = (s.name+s.en+s.specialty+JSON.stringify(s)+(n?n.text:"")).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function findByEn(en){
  const k = String(en || "").trim().toLowerCase().replace(/\s+/g," ");
  return SURGERIES.findIndex(s => String(s.en || "").trim().toLowerCase().replace(/\s+/g," ") === k);
}

function updatesHtml(){

      <ul class="upd-list">${lis}</ul>

  }).join("");
  return `<div class="upd">
    <div class="upd-h">最近更新</div>
    <div class="upd-sub">以下為本次更新項目;要查手術請按上方「全部」或各科別,亦可直接輸入手術名稱、關鍵字搜尋。</div>
    ${blocks || `<div class="empty">尚無更新紀錄</div>`}
    <div class="upd-tip">上線前請對照所屬機構 protocol 逐台校過。</div>
  </div>`;
}

function renderList(){
  const q = el("search").value.trim();
  if((!activeSpec || activeSpec===HOME_CHIP) && !q){
    el("list").innerHTML = updatesHtml();
    el("list").querySelectorAll(".upd-link").forEach(b=>{
      b.onclick = () => showDetail(+b.dataset.go);
    });
    return;
  }
  const allSpec = !activeSpec || activeSpec==="全部" || activeSpec===HOME_CHIP;   /* 在首頁搜尋 = 全科搜尋 */
  const items = SURGERIES.filter(s =>
    (allSpec || s.specialty===activeSpec) && matches(s,q)
  );
  if(!items.length){
    el("list").innerHTML = `<div class="empty">找不到符合的手術<br>試試其他關鍵字</div>`;
    return;
  }
  el("list").innerHTML = items.map(s=>{
    const id = SURGERIES.indexOf(s);
    return `<div class="card ${id===activeId?'active':''}" data-id="${id}">
      <div class="name">${s.en}</div>
      <div class="en">${s.name}</div>
      <div class="meta">
        <span class="tag spec">${s.specialty}</span>
        <span class="tag">${s.summary.airway}</span>
        ${hasNote(s) ? `<span class="tag note-tag" title="已有個人筆記">📝 筆記</span>` : ""}
      </div>
    </div>`;
  }).join("");
  el("list").querySelectorAll(".card").forEach(c=>{
    c.onclick = () => showDetail(+c.dataset.id);
  });
}

function li(arr){ return arr && arr.length ? arr.map(x=>`<li>${x}</li>`).join("") : `<li style="color:var(--ink-soft)">—</li>`; }

function toggleAsa(){
  const p = el("asaPanel"); if(!p) return;
  const btn = document.querySelector(".asa-btn");
  const show = p.hasAttribute("hidden");
  if(show){ p.removeAttribute("hidden"); } else { p.setAttribute("hidden",""); }
  if(btn) btn.setAttribute("aria-expanded", show ? "true" : "false");
}

/* 通用「點擊展開說明」:切換按鈕緊鄰的 .info-panel(平時收縮) */
function toggleInfo(btn){
  const p = btn.nextElementSibling; if(!p) return;
  const show = p.hasAttribute("hidden");
  if(show){ p.removeAttribute("hidden"); } else { p.setAttribute("hidden",""); }
  btn.setAttribute("aria-expanded", show ? "true" : "false");
}

/* 體位小圖示 —— 依醫院手術床遙控器(Skytron 3503)風格:實心圓點=頭(固定左側)、粗線=身體/床面、側面平躺視角。
   type: 'supine'(LEVEL平躺) | 'revtrend'(頭高) | 'trend'(頭低) | 'prone'(俯臥) | 'lateral'(側臥) */
function posIcon(type){
  const icons = {
    supine:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="7" cy="9.4" r="3"/><rect x="10" y="8" width="26" height="2.8" rx="1.4"/></svg>`,
    revtrend:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="6.5" cy="6.6" r="3"/><rect x="10" y="8.6" width="26" height="2.8" rx="1.4" transform="rotate(7 23 10)"/></svg>`,
    trend:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="6.5" cy="12.4" r="3"/><rect x="10" y="8.6" width="26" height="2.8" rx="1.4" transform="rotate(-7 23 10)"/></svg>`,
    prone:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="7" cy="7.4" r="3"/><rect x="5.6" y="9.9" width="2.8" height="3.3" rx="1.3"/><rect x="10" y="8.1" width="26" height="2.8" rx="1.4"/></svg>`,
    lateral:`<svg class="posico" viewBox="0 0 40 18" fill="currentColor">
      <circle cx="7" cy="8.4" r="3"/><path d="M10 9 q7 0 11 5 q3 3.5 8 1.2" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  };
  return icons[type] || icons.supine;
}

function showDetail(id){
  activeId = id;
  const s = SURGERIES[id];
  const sum = s.summary;
  const sections = SECTION_DEFS.filter(d=>s[d.key] && s[d.key].length).map(d=>{
    const isMon = d.key==="monitor";
    const btn = isMon ? `<button class="asa-btn" type="button" aria-expanded="false" onclick="toggleAsa()">ⓘ ASA 基本監測</button>` : "";
    const panel = isMon ? `<div class="asa-panel" id="asaPanel" hidden>${ASA_INFO}</div>` : "";
    const dia = (s.diagram && s.diagram.section===d.key)
      ? `<figure class="d-figure">${s.diagram.svg}${s.diagram.caption?`<figcaption>${s.diagram.caption}</figcaption>`:""}</figure>` : "";
    return `
    <div class="section ${d.cls}">
      <h3><span class="dot"></span>${d.label}${btn}</h3>
      <ul>${li(s[d.key])}</ul>
      ${dia}
      ${panel}
    </div>`;
  }).join("");

  el("detail").innerHTML = `
    <button class="back" id="backBtn">← 返回清單</button>
    <div class="d-head">
      <div class="d-title">${s.en}</div>
      <div class="d-title-zh">${s.name}</div>
      <div class="d-en">${s.specialty}</div>
      <div class="d-summary">
        <div class="item pos"><div class="k">Position</div><div class="v">${posIcon(sum.posType)}<span>${sum.position||"—"}</span></div></div>
        <div class="item"><div class="k">預估時間</div><div class="v">${sum.time||"—"}</div></div>
        <div class="item"><div class="k">預估失血</div><div class="v">${sum.blood||"—"}</div></div>
        <div class="item"><div class="k">麻醉方式</div><div class="v">${sum.airway||"—"}</div></div>
      </div>
    </div>
    ${sections}
    ${s.flags && s.flags.length ? `
      <div class="flag-box">
        <h3>⚠ 重要併發症</h3>
        <ul>${s.flags.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>` : ""}
    ${s.refs && s.refs.length ? `
      <div class="refs-box">
        <h3>文獻出處　References</h3>
        <ol>${s.refs.map(x=>`<li>${x}</li>`).join("")}</ol>
      </div>` : ""}
    ${noteBoxHtml(s)}
    <div class="disclaimer">
      本卡為臨床記憶輔助,非取代臨床判斷。各項處置請依病人狀況、外科團隊需求與所屬機構protocol調整,並對照最新指引與文獻。
    </div>
    <button class="back back-bottom" id="backBtnBottom" type="button">← 返回清單</button>`;
  el("backBtn").onclick = goBack;
  el("backBtnBottom").onclick = goBack;
  bindNoteBox(s);
  el("app").classList.add("stage-detail");
  renderList();
  el("detail").scrollTop = 0;
  window.scrollTo(0,0);
}

/* 返回清單:收起詳情、回到頁面頂端 */
function goBack(){
  el("app").classList.remove("stage-detail");
  el("detail").scrollTop = 0;
  window.scrollTo(0,0);
}

el("search").addEventListener("input", renderList);
el("impFile").addEventListener("change", function(){
  const f = this.files && this.files[0];
  this.value = "";
  if(f) importNotes(f);
});
renderChips();
renderList();
initNotes();

/* ============================================================
   自動更新:檔案推上 GitHub 後,手機回到 app 或每隔一段時間
   會自動偵測伺服器上的新版並更新,不必重開連結。
   原理:以 no-store 抓自身網址,比對 ETag / Last-Modified
   (取不到時退而比對內容雜湊)。只在 GitHub Pages 等 http(s)
   環境有效;本機 file:// 開啟會靜默略過。
   ============================================================ */
(function(){
  var SELF = location.href.split('#')[0].split('?')[0];
  var baseline = null;
  function hash(t){var h=0;for(var i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0;}return t.length+':'+h;}
  function getSig(){
    return fetch(SELF,{cache:'no-store'}).then(function(res){
      if(!res.ok) throw 0;
      var e=res.headers.get('etag'), m=res.headers.get('last-modified');
      if(e) return 'e:'+e;
      if(m) return 'm:'+m;
      return res.text().then(function(t){return 'h:'+hash(t);});
    });
  }
  window.applyUpdate=function(){ location.reload(); };
  function onNew(){
    var app=document.getElementById('app');
    if(app && app.classList.contains('stage-detail')){
      var b=document.getElementById('upd'); if(b) b.style.display='flex';
    } else { location.reload(); }
  }
  function check(){
    getSig().then(function(sig){
      if(baseline===null){ baseline=sig; return; }
      if(sig!==baseline){ onNew(); }
    }).catch(function(){});
  }
  check();
  setInterval(check, 60000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
  window.addEventListener('focus', check);
})();
</script>
